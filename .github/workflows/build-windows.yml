name: Build Windows installer

# Windows 用のインストーラ（.exe）を GitHub の Windows の上で作り、ダウンロードできるように置く
# （CheckListMaker の build-windows.yml から写した）。手元で npm run dist が通らないときの代わりにもなる。

on:
  # PR ごとに作る
  pull_request:
  # Actions の画面から手で動かすこともできる。release_tag を渡すと、GitHub の側でタグを作り、Releases に公開する
  # （2026-11-06 ユーザー指示。クラウドのセッションからはタグを push できず、下書きを公開する道具もないため。Claude が公開まで済ませる）
  workflow_dispatch:
    inputs:
      release_tag:
        description: '公開する版のタグ（例 v1.04）。空なら、インストーラを作るだけ'
        required: false
        default: ''
      target:
        description: 'タグを付けて中身を作るコミット（40 桁）。空なら、動かしたブランチのコミット'
        required: false
        default: ''
      remove_exe_from:
        description: '公開した後に、インストーラ（.exe）を消す古い版のタグ（例 v1.03）。使用説明書と説明の文は残す。空なら消さない'
        required: false
        default: ''
  # 版のタグ（例 v1.00）を push したら、GitHub の Releases に下書きを作り、インストーラと Word の別冊を載せる（2026-10-24 の q92）
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      # インストーラを作るこの仕事は読むだけ（npm ci で入れる部品の台本に、書く権限の鍵を見せない）。下書きは下の release の仕事で作る
      contents: read
    env:
      # インストーラに Puppeteer の Chrome は要らない
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手で動かして target を渡したときは、そのコミットの中身で作る（例 v1.03 は main の古いコミットで作る）。空なら今までどおり
          ref: ${{ inputs.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # package-lock.json をコミットしているので npm ci を使う
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        # npm run dist は、Electron 本体を取得してから electron-builder を動かす。署名の証明書はないので、署名なしの exe になる
        run: npm run dist

      - name: List build output
        run: dir dist
        shell: cmd

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MockImageMaker-Windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Write download link to run summary
        if: success()
        shell: bash
        run: |
          {
            echo "## モックイメージメーカー Windows インストーラ";
            echo "";
            echo "- ダウンロード: ${{ steps.upload.outputs.artifact-url }}";
            echo "- またはこのページの下の **Artifacts → MockImageMaker-Windows-installer** から取得";
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # 版のタグを push したときは、上で作ったインストーラと Word の別冊を、GitHub の Releases の下書きに載せる（中身を見てから Releases の画面で公開する）。
    # 手で動かして release_tag を渡したときは、GitHub の側でタグを作り、そのまま公開する（2026-11-06 ユーザー指示。クラウドのセッションから Claude が公開まで済ませる道）。
    # 書く権限はこの仕事だけに渡し、よその action ではなく GitHub の gh コマンドで作る（2026-10-26。自動の見直しの指摘）
    needs: build-win
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.target }}

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MockImageMaker-Windows-installer
          path: dist

      - name: Create release with installer and manual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 入力は env で渡し、シェルの文に直接埋めない
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.release_tag }}
          IN_TARGET: ${{ inputs.target }}
          IN_REMOVE: ${{ inputs.remove_exe_from }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manual_run=false
          if [ "$EVENT" = "workflow_dispatch" ]; then manual_run=true; TAG="$IN_TAG"; else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]{2}$ ]]; then echo "版のタグの形が違います（例 v1.04）: $TAG" >&2; exit 1; fi
          exe=(dist/*.exe)
          docx=(manual/*_"${TAG}".docx)
          if [ "${#exe[@]}" -ne 1 ] || [ "${#docx[@]}" -ne 1 ]; then
            echo "インストーラ（dist/*.exe）か、この版の使用説明書（manual/*_${TAG}.docx）が 1 つずつ見つかりません" >&2
            exit 1
          fi
          # インストーラの版（1.0.4）がタグ（v1.04）と合うか。違うコミットで作ったものを載せないため（v1.04 → 1.0.4、v1.10 → 1.0.10）
          major="${TAG#v}"; major="${major%%.*}"; minor="${TAG#*.}"; want="${major}.0.$((10#$minor))"
          if [ "$(basename "${exe[0]}")" != "MockImageMaker Setup ${want}.exe" ]; then
            echo "インストーラの版が ${TAG}（${want}）と合いません: $(basename "${exe[0]}")" >&2
            exit 1
          fi
          # GitHub は Releases のファイルの名前の日本語を置き換える（2026-10-26 の v1.00 の下書きで「_._v1.00.docx」になった）。
          # 使用説明書は英字の名前に写して載せ、元の日本語の名前は表示名（# の後ろ）にする
          manual="MockImageMaker_UserManual_${TAG}.docx"
          cp "${docx[0]}" "$manual"
          cat > release-notes.md <<NOTES
          モックイメージメーカー ${TAG} の Windows 用インストーラと使用説明書（Word）です。
          - インストーラ（.exe）: 管理者の権限なしで入れられます。署名なしのため、初めて開くと「Windows によって PC が保護されました」の青い窓が出ます。そのときは「詳細情報」を押し、出てきた「実行」を押してください。
          - 使用説明書（.docx）: アプリの「ヘルプ > 使い方」と同じ中身です。
          NOTES
          if [ "$manual_run" = false ]; then
            gh release create "$TAG" "${exe[@]}" "${manual}#$(basename "${docx[0]}")" \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "モックイメージメーカー ${TAG}" --notes-file release-notes.md
            exit 0
          fi
          # 手で動かしたとき: タグを付けるコミットを決め、GitHub の側でタグを作って公開する
          sha="${IN_TARGET:-$RUN_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "target は 40 桁のコミットの番号にしてください: $sha" >&2; exit 1; fi
          if [ -n "$IN_REMOVE" ] && ! [[ "$IN_REMOVE" =~ ^v[0-9]+\.[0-9]{2}$ ]]; then echo "remove_exe_from の形が違います（例 v1.03）: $IN_REMOVE" >&2; exit 1; fi
          if [ "$IN_REMOVE" = "$TAG" ]; then echo "公開する版のインストーラは消せません: $IN_REMOVE" >&2; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "${TAG} の Releases はもうあります" >&2; exit 1; fi
          gh release create "$TAG" "${exe[@]}" "${manual}#$(basename "${docx[0]}")" \
            --repo "$GITHUB_REPOSITORY" --target "$sha" --latest \
            --title "モックイメージメーカー ${TAG}" --notes-file release-notes.md
          # 古い版のインストーラを消す（使用説明書と説明の文は残す。2026-11-02 ユーザー指示・質問 R1 の案B）
          if [ -n "$IN_REMOVE" ]; then
            gh release view "$IN_REMOVE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              case "$name" in
                *.exe) gh release delete-asset "$IN_REMOVE" "$name" --repo "$GITHUB_REPOSITORY" -y ;;
              esac
            done
          fi
