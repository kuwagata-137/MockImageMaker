    key: normalizeRef(src.key),
    copies: (Array.isArray(src.copies) ? src.copies : []).filter(isObj).map((c) => ({ ...c, from: normalizeRef(c.from), to: normalizeRef(c.to) })),
  };
}
// ルックアップ元のデータベースの名前と、参照している項目の名前（項目が見つからないときは控えの名前）
function dbLabel(state, db) {
  const d = db && db.designId ? findDesign(state, db.designId) : null;
  return (d ? d.name : db && db.name) || '（データベースを選んでいません）';
}
function refLabel(design, ref) {
  const it = design && ref && ref.itemId ? findItem(design, ref.itemId) : null;
  return (it ? it.name : ref && ref.name) || '（項目を選んでいません）';
}
const refMatches = (ref, item) => (ref.itemId ? ref.itemId === item.id : !!ref.name && ref.name === item.name);
// その項目が、同じ画面設計のどれかの項目のルックアップで「一緒に写される」項目なら { key（探す項目）, copy } を返す
function lookupCopyOf(design, item) {
  for (const k of design.items) {
    if (k === item || !k.lookup) continue;
    const copy = k.lookup.copies.find((c) => refMatches(c.to, item));
    if (copy) return { key: k, copy };
  }
  return null;
}
// 一覧表の「設定」に足すルックアップの文（画像 q22）。p は項目と合わせた部品か、項目を部品の形にしたもの
function lookupLines({ design, state }, p) {
  const lk = p.item ? p.item.lookup : p.lookup; // 項目を一覧表から消した後の部品は、消したときのルックアップ
  if (lk) {
    const src = lk.db.designId ? findDesign(state, lk.db.designId) : null;
    const db = dbLabel(state, lk.db);
    const lines = [`ルックアップ＝${db}の「${refLabel(src, lk.key)}」で探す`];
    const copies = lk.copies.filter((c) => c.from.itemId || c.from.name || c.to.itemId || c.to.name);
    if (copies.length) lines.push('一緒に写す＝' + copies.map((c) => `${refLabel(src, c.from)} → ${refLabel(design, c.to)}`).join('、'));
    return lines;
  }
  const role = p.item ? lookupCopyOf(design, p.item) : null;
  if (!role) return [];
  const klk = role.key.lookup;
  const src = klk.db.designId ? findDesign(state, klk.db.designId) : null;
  return [`ルックアップ＝${dbLabel(state, klk.db)}の「${refLabel(src, role.copy.from)}」（${role.key.name}で引く）`];
}

// 取り込んだ元 { designId, itemId, designName, lost }。designName は元の画面設計の名前の控え（元がなくなったときに出す）。
// lost は、元の画面設計を完全に削除したか、元の画面設計でその項目を消したとき true（そのときの中身で固定している）
function normalizeLink(src) {
  if (!isObj(src) || !str(src.designId) || !str(src.itemId)) return null;
  return { ...src, designId: str(src.designId), itemId: str(src.itemId), designName: str(src.designName), lost: !!src.lost };
}

// 取り込んだ項目に写す、元の項目の中身（取り込んだ側では直せない中身）
const LINKED_FIELDS = ['name', 'type', 'required', 'memo', 'props', 'lookup'];
function linkedFields(src, srcDesign) {
  const lookup = src.lookup ? clone(src.lookup) : null;
  if (lookup) lookup.copies = lookup.copies.map((c) => ({ ...c, to: { itemId: null, name: refLabel(srcDesign, c.to) } }));
  return { name: src.name, type: src.type, required: src.required, memo: src.memo, props: clone(src.props), lookup };
}

// 取り込んだ項目（つなげたまま）を、元の項目の今の中身にそろえる。元を直したときは、同じ操作（commit）の中で呼ぶ。
// 元が見つからないときは lost にして、今の中身で固定する。元の元（取り込んだ項目をさらに取り込んだもの）にも届くように、変わらなくなるまで繰り返す
function syncLinkedItems(state) {
  const designs = new Map(state.designs.map((d) => [d.id, d]));
  for (let round = 0; round < 8; round++) {
    let changed = false;
    state.designs.forEach((d) => d.items.forEach((it) => {
      if (!it.link) return;
      const srcDesign = designs.get(it.link.designId);
      const src = srcDesign ? findItem(srcDesign, it.link.itemId) : null;
      if (!src || src === it) {
        if (!it.link.lost) { it.link.lost = true; changed = true; }
        return;
      }
      if (it.link.lost) { it.link.lost = false; changed = true; }
      if (it.link.designName !== srcDesign.name) { it.link.designName = srcDesign.name; changed = true; }
      const want = linkedFields(src, srcDesign);
      if (LINKED_FIELDS.every((k) => JSON.stringify(it[k]) === JSON.stringify(want[k]))) return;
      if (want.type !== it.type && isInputType(want.type) && isInputType(it.type)) changeItemType(d, it, want.type);
      Object.assign(it, want);
      changed = true;
    }));
    if (!changed) return;
  }
}

// 取り込む窓で、元の項目 it がこの画面設計 d から見てどうなっているか。
// 'own'＝この画面設計の項目を取り込んだもの、'done'＝取り込み済み、'status'＝ステータスの項目で、この画面設計にもうある
// （ステータスの並びは画面設計に 1 つだけ）、'same'＝同じ名前の項目がある、'' ＝ふつう。取り込めるのは 'same' と '' だけ
const IMPORT_BLOCKED = ['own', 'done', 'status'];
function importState(d, src, it) {
  if (it.link && it.link.designId === d.id) return 'own';
  if (d.items.some((x) => x.link && x.link.designId === src.id && x.link.itemId === it.id)) return 'done';
  if (it.type === 'status' && d.items.some((x) => x.type === 'status')) return 'status';
  if (d.items.some((x) => x.name === it.name)) return 'same';
  return '';
}

// ── データベースどうしのつながりの図（画像 q23）──
// 箱＝画面設計（ごみ箱のものは除く）と、ルックアップ・関連レコード一覧の元に名前だけ書いた「一覧にないデータベース」。
// 矢印は値が流れる向き（元 → 引く側）: lookup（ルックアップ）・related（関連レコード一覧）は紺、link（項目の取り込み）は緑の点線。
// focusId を渡すと、その画面設計と、直接つながる箱だけにする（編集の画面のつながりの図）
const MAP_W = 200;
const MAP_H = 64;
const MAP_COL = 400; // 列の幅（箱の幅 200 ＋ 矢印の文字を書く間 200）
const MAP_ROW = 112; // 段の高さ（箱の高さ 64 ＋ 間 48）
function mapModel(state, focusId = null) {
  const designs = visibleDesigns(state);
  const ids = new Set(designs.map((d) => d.id));
  const keyOfDb = (db) => (db && db.designId ? (ids.has(db.designId) ? 'd:' + db.designId : null) : db && db.name ? 'x:' + db.name : null);
  const edges = new Map();
  const add = (from, to, kind, label) => {
    if (!from || from === to) return;
    const k = `${from}|${to}|${kind}`;
    if (!edges.has(k)) edges.set(k, { from, to, kind, labels: [] });
    if (label && !edges.get(k).labels.includes(label)) edges.get(k).labels.push(label);
  };
  designs.forEach((d) => {
    const to = 'd:' + d.id;
    d.items.forEach((it) => {
      if (it.lookup) {
        const src = it.lookup.db.designId ? findDesign(state, it.lookup.db.designId) : null;
        const copies = it.lookup.copies.map((c) => refLabel(src, c.from)).filter((n) => n && !n.startsWith('（')).join('・');
        add(keyOfDb(it.lookup.db), to, 'lookup', `${refLabel(src, it.lookup.key)}で引く${copies ? `\n${copies}` : ''}`);
      }
      if (it.link && !it.link.lost && ids.has(it.link.designId)) add('d:' + it.link.designId, to, 'link', it.name);
    });
    d.screens.forEach((s) => s.parts.forEach((p) => {
      if (p.type === 'table' && p.tableKind === 'related' && p.props && p.props.db) add(keyOfDb(p.props.db), to, 'related', p.label);
    }));
  });
  let list = [...edges.values()];
  const nodes = new Map(designs.map((d) => ['d:' + d.id, { key: 'd:' + d.id, design: d, name: d.name }]));
  list.forEach((e) => [e.from, e.to].forEach((k) => { if (!nodes.has(k)) nodes.set(k, { key: k, design: null, name: k.slice(2) }); }));
  let keys = [...nodes.keys()];
  if (focusId) {
    const f = 'd:' + focusId;
    list = list.filter((e) => e.from === f || e.to === f);
    const near = new Set([f, ...list.flatMap((e) => [e.from, e.to])]);
    keys = keys.filter((k) => near.has(k));
  }
  return { nodes: keys.map((k) => nodes.get(k)), edges: list };
}
// 自動で並べる位置。矢印の元を左、引く側を右の列にする（列＝元から何段目か）。
// つながりのない箱は、つながった箱の下に、名前の順に横に並べる（右の端の列に置くと、図が横に長くなるため。Claude が決めた）
function mapLayout(model) {
  const forward = mapForwardEdges(model);
  const rank = mapRanks(model, forward);
  const linked = new Set(model.edges.flatMap((e) => [e.from, e.to]));
  const byName = [...model.nodes].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const cols = new Map();
  byName.filter((n) => linked.has(n.key)).forEach((n) => {
    const c = rank.get(n.key);
    if (!cols.has(c)) cols.set(c, []);
    cols.get(c).push(n);
  });
  mapOrderRows(cols, forward);
  const pos = {};
  cols.forEach((list, c) => list.forEach((n, i) => { pos[n.key] = { x: 40 + c * MAP_COL, y: 40 + i * MAP_ROW }; }));
  const rows = Math.max(0, ...[...cols.values()].map((list) => list.length));
  const top = 40 + rows * MAP_ROW + (rows ? 32 : 0);
  const perRow = Math.max(4, Math.floor((cols.size * MAP_COL - (MAP_COL - MAP_W)) / (MAP_W + 40)));
  byName.filter((n) => !linked.has(n.key)).forEach((n, i) => {
    pos[n.key] = { x: 40 + (i % perRow) * (MAP_W + 40), y: top + Math.floor(i / perRow) * MAP_ROW };
  });
  return pos;
}
// 箱の列＝矢印の元から何段目か（いちばん長い道のり）。入ってくる矢印のない箱（いちばん元）は、矢印の先のいちばん左の箱の
// すぐ左の列へ寄せる（例: 受注管理だけに引かれる会計システムを、いちばん左の列に置くと、長い矢印が間の列の箱の後ろを通るため）
function mapRanks(model, forward) {
  const rank = new Map(model.nodes.map((n) => [n.key, 0]));
  for (let i = 0; i < model.nodes.length; i++) {
    let changed = false;
    forward.forEach((e) => { if (rank.get(e.to) < rank.get(e.from) + 1) { rank.set(e.to, rank.get(e.from) + 1); changed = true; } });
    if (!changed) break;
  }
  const hasIn = new Set(forward.map((e) => e.to));
  model.nodes.filter((n) => !hasIn.has(n.key)).forEach((n) => {
    const outs = forward.filter((e) => e.from === n.key).map((e) => rank.get(e.to));
    if (outs.length) rank.set(n.key, Math.min(...outs) - 1);
  });
  return rank;
}
// 列の中の並び。矢印でつながる相手（左の列の元・右の列の先）の段の平均に近い順にする（線の交わりを減らすため）。
// 左から右・右から左を 2 回ずつ繰り返す。相手がいない箱と、平均が同じ箱は、今の並び（はじめは名前の順）のまま
function mapOrderRows(cols, forward) {
  const row = new Map();
  cols.forEach((list) => list.forEach((n, i) => row.set(n.key, i)));
  const order = [...cols.keys()].sort((a, b) => a - b);
  for (let pass = 0; pass < 4; pass++) {
    const fromLeft = pass % 2 === 0;
    (fromLeft ? order : [...order].reverse()).forEach((c) => {
      const list = cols.get(c);
      const score = new Map(list.map((n, i) => {
        const near = forward.filter((e) => (fromLeft ? e.to : e.from) === n.key).map((e) => row.get(fromLeft ? e.from : e.to));
        return [n.key, near.length ? near.reduce((s, x) => s + x, 0) / near.length : i];
      }));
      list.sort((a, b) => score.get(a.key) - score.get(b.key));
      list.forEach((n, i) => row.set(n.key, i));
    });
  }
}
// 列を決めるときに使う矢印。矢印が輪になっているとき（例: 顧客管理 → 受注管理 のルックアップと、受注管理 → 顧客管理 の関連レコード一覧）は、
// 輪を閉じる矢印を外す（外さないと、輪の箱が右の列へ送られ続けるため）。ルックアップ・取り込み・関連レコード一覧の順に矢印を足していき、
// 足すと輪になる矢印だけを外す（関連レコード一覧は、ルックアップと逆向きに置かれることが多いため後にする）
const MAP_EDGE_ORDER = { lookup: 0, link: 1, related: 2 };
function mapForwardEdges(model) {
  const out = new Map(model.nodes.map((n) => [n.key, []]));
  const reaches = (from, to) => {
    const seen = new Set([from]);
    const stack = [from];
    while (stack.length) {
      const k = stack.pop();
      if (k === to) return true;
      out.get(k).forEach((n) => { if (!seen.has(n)) { seen.add(n); stack.push(n); } });
    }
    return false;
  };
  const kept = [];
  [...model.edges].sort((a, b) => MAP_EDGE_ORDER[a.kind] - MAP_EDGE_ORDER[b.kind]).forEach((e) => {
    if (reaches(e.to, e.from)) return;
    out.get(e.from).push(e.to);
    kept.push(e);
  });
  return kept;
}

// その画面設計の項目を取り込んでいる、ほかの画面設計（ごみ箱のものは除く）
function designsImporting(state, designId) {
  return state.designs.filter((d) => d.id !== designId && !d.trashedAt && d.items.some((it) => it.link && it.link.designId === designId && !it.link.lost));
}

// 種類ごとの設定を、最初の値と同じ形（文字の配列・真偽・文字）にそろえる。知らない項目は残す
function normalizeProps(t, src) {
  const props = isObj(src) ? { ...src } : {};
  Object.entries(t.props).forEach(([k, def]) => {
    const v = props[k];
    if (Array.isArray(def)) props[k] = Array.isArray(v) ? v.filter((x) => typeof x === 'string' || typeof x === 'number').map(String) : clone(def);
    else if (typeof def === 'boolean') props[k] = v === undefined ? def : !!v;
    else props[k] = typeof v === 'string' ? v : typeof v === 'number' && Number.isFinite(v) ? String(v) : def;
  });
  return props;
}

// id が重なっていたら、後のほうに新しい id を付ける（画面設計・画面。片方をごみ箱へ移す・消すと、もう片方も動くのを防ぐため）
function uniqueIds(list, prefix) {
  const seen = new Set();
  list.forEach((x) => {
    if (seen.has(x.id)) x.id = newId(prefix);
    seen.add(x.id);
  });
  return list;
}
// 同じ画面設計の中で部品の id が重なっていたら、後のほうに新しい id を付ける（片方を消すと両方消えるのを防ぐため）
function uniquePartIds(screens) {
  const seen = new Set();
  screens.forEach((s) => s.parts.forEach((p) => {
    if (seen.has(p.id)) p.id = newId('p');
    seen.add(p.id);
  }));
  return screens;
}
// 項目の id も同じ（重なっていると、片方を直すと両方の部品が変わるため）。後のほうの項目を指す部品はないものとして扱う
function uniqueItemIds(items) {
  const seen = new Set();
  items.forEach((it) => {
    if (seen.has(it.id)) it.id = newId('i');
    seen.add(it.id);
  });
  return items;
}

function normalizeScreen(src, i, items = []) {
  const s = isObj(src) ? src : {};
  const device = own(DEVICES, s.device) ? s.device : 'pc';
  // 部品から項目を作るとき（データの形の版 1 を直すとき）は、上から下・左から右の順に作る（一覧表の並びを画面の読む順にするため）
  const raw = Array.isArray(s.parts) ? s.parts.filter(isObj) : [];
  const order = raw.map((p, k) => k).sort((a, b) => numOr(raw[a].y, 0) - numOr(raw[b].y, 0) || numOr(raw[a].x, 0) - numOr(raw[b].x, 0));
  const parts = [];
  order.forEach((k) => { parts[k] = normalizePart(raw[k], items); });
  return {
    ...s,
    id: str(s.id) || newId('s'),
    name: typeof s.name === 'string' ? s.name : `画面 ${i + 1}`,
    device,
    width: DEVICES[device].width,
    height: snapHeight(s.height == null ? DEVICES[device].height : s.height, device),
    showHeader: s.showHeader !== false,
    tablePos: s.tablePos === 'bottom' ? 'bottom' : 'right',
    parts,
    callouts: Array.isArray(s.callouts) ? s.callouts.filter(isObj).map(normalizeCallout) : [],
  };
}

// 吹き出し { id, x, y, w, h, text, color, target, tip }（画面の callouts。画像 q27）。x・y は画面の左上から（外の余白はマイナスや画面の幅より先）。
// target はつないだ部品の id（つながないときは null）。color は yellow・red・blue・gray。tip は線の先の形（dot・arrow・none）
function normalizeCallout(src) {
  return {
    ...src,
    id: str(src.id) || newId('k'),
    x: numOr(src.x, 0), y: numOr(src.y, 0),
    w: Math.max(CALLOUT_MIN, numOr(src.w, 200)), h: Math.max(CALLOUT_MIN, numOr(src.h, 80)),
    text: str(src.text),
    color: own(CALLOUT_COLORS, src.color) ? src.color : 'yellow',
    target: str(src.target) || null,
    tip: ['dot', 'arrow', 'none'].includes(src.tip) ? src.tip : 'dot',
  };
}

function normalizeDesign(src) {
  const d = isObj(src) ? src : {};
  const createdAt = str(d.createdAt) || nowIso();
  const items = uniqueItemIds((Array.isArray(d.items) ? d.items : []).filter(isObj).map(normalizeItem));
  const screens = Array.isArray(d.screens) && d.screens.length
    ? uniquePartIds(uniqueIds(d.screens.map((s, i) => normalizeScreen(s, i, items)), 's'))
    : [createScreenData(FIRST_SCREEN_NAME)];
  return {
    ...d,
    id: str(d.id) || newId('d'),
    name: cleanName(d.name) || '名前なし',
    target: str(d.target),
    description: str(d.description),
    createdAt,
    updatedAt: str(d.updatedAt) || createdAt,
    trashedAt: str(d.trashedAt) || null,
    revisions: Array.isArray(d.revisions) ? d.revisions : [],
    items,
    screens,
    mapPos: normalizeMapPos(d.mapPos), // 編集の画面の「この画面設計のつながりの図」の箱の位置
  };
}

// つながりの図で、ドラッグして動かした箱の位置 { 箱の鍵: { x, y } }（箱の鍵は画面設計なら 'd:id'、一覧にないデータベースなら 'x:名前'）
function normalizeMapPos(src) {
  const out = {};
  if (isObj(src)) Object.entries(src).forEach(([k, v]) => { if (isObj(v) && Number.isFinite(Number(v.x)) && Number.isFinite(Number(v.y))) out[k] = { x: Number(v.x), y: Number(v.y) }; });
  return out;
}

function normalizeState(raw, schemaVersion) {
  const settings = isObj(raw.settings) ? raw.settings : {};
  const customs = Array.isArray(settings.customTargets) ? settings.customTargets : [];
  const state = {
    ...raw,
    schemaVersion,
    // mapPos は最初の画面の「全部の画面設計のつながりの図」の箱の位置
    settings: { ...settings, customTargets: [...new Set(customs.filter((t) => typeof t === 'string' && t.trim()))], mapPos: normalizeMapPos(settings.mapPos) },
    designs: uniqueIds((Array.isArray(raw.designs) ? raw.designs : []).filter(isObj).map(normalizeDesign), 'd'),
  };
  syncLinkedItems(state);
  return state;
}

// 戻り値 { state, blockReason }。blockReason があるときは、保存を止める（データを消さないため）
function migrate(raw) {
  if (raw == null) return { state: createInitialState(), blockReason: null };
  if (!isObj(raw)) return { state: createInitialState(), blockReason: '保存データの形が正しくありません。' };
  const v = raw.schemaVersion === undefined ? 1 : Number(raw.schemaVersion);
  if (!Number.isInteger(v) || v < 1) return { state: createInitialState(), blockReason: '保存データの版（schemaVersion）が正しくありません。' };
  if (v > SCHEMA_VERSION) {
    return {
      state: normalizeState(raw, v),
      blockReason: `この保存データは新しい版のアプリで保存されています（データの形の版 ${v}。この版のアプリが分かるのは ${SCHEMA_VERSION} まで）。新しい版のアプリを使ってください。`,
    };
  }
  // データの形を上げるときは、ここに「v が N より小さければ N の形に直す」を足していく。
  // 1 → 2（項目を画面設計の items へ移す）は normalizePart が受け持つ: 項目を指していない入力欄の部品 1 つから項目を 1 つ作る
  // （同じ項目名の部品が別の画面にあっても 1 つにまとめない。別の項目のつもりの部品を 1 つにしてしまわないため）
  return { state: normalizeState(raw, SCHEMA_VERSION), blockReason: null };
}

// ── 3. 保存 ───────────────────────────────────────────────────────────────────
// ブラウザで開いたとき。容量の上限に当たると save() が false を返す
class LocalStorageAdapter {
  constructor(key = STORAGE_KEY) {
    this.key = key;
  }
  // 中身が壊れているときは例外を投げる（起動のときに保存を止める）
  load() {
    const raw = localStorage.getItem(this.key);
    return raw ? JSON.parse(raw) : null;
  }
  save(state) {
    try {
      localStorage.setItem(this.key, JSON.stringify(state));
      return true;
    } catch (e) {
      console.warn('保存に失敗しました:', e);
      return false;
    }
  }
}

// Electron で動いているとき。前の保存が終わるのを待たずにすぐ送る
// （1 つずつ並べて書くのは、メインプロセスの storage.js の saveChain が受け持つ）
class FileAdapter {
  constructor() {
    this.pending = Promise.resolve();
    this.lastError = null;
  }
  save(state) {
    const json = JSON.stringify(state);
    this.pending = window.storageAPI.save(json)
      .then((res) => {
        if (!res || !res.ok) throw new Error((res && res.error) || 'わからない理由');
        this.lastError = null;
      })
      .catch((e) => {
        this.lastError = e;
        console.error('ファイルへの保存に失敗しました:', e);
        showBanner('ファイルへの保存に失敗しました（' + (e.message || e) + '）。ディスクの空きとフォルダの書き込みの許可を確かめてください。');
      });
    return true;
  }
}

// 保存を止めているとき（読み込めなかった・新しい版のデータ）。何も書かない
class BlockedAdapter {
  save() {
    return true;
  }
}

// 戻り値 { store, blockReason, notice }。blockReason があるときは保存を止める。notice は知らせるだけ（保存は続ける）
async function createAppStore() {
  let raw;
  let notice = null;
  try {
    if (window.storageAPI) {
      const res = await window.storageAPI.load();
      if (!res || !res.ok) throw new Error((res && res.error) || '読み込みに失敗しました');
      raw = res.json == null ? null : JSON.parse(res.json);
      notice = res.notice || null;
    } else {
      raw = new LocalStorageAdapter().load();
    }
  } catch (e) {
    const reason = '保存データを読み込めませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  let migrated;
  try {
    migrated = migrate(raw);
  } catch (e) {
    const reason = '保存データを今の形に直せませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  const { state, blockReason } = migrated;
  if (blockReason) return { store: new Store(new BlockedAdapter(), state), blockReason };
  const adapter = window.storageAPI ? new FileAdapter() : new LocalStorageAdapter();
  return { store: new Store(adapter, state), blockReason: null, notice };
}

// ── 4. 元に戻す ───────────────────────────────────────────────────────────────
// 変更はすべて commit() を通す。変更の前の写しを履歴に積み、保存し、画面を描き直す。
class Store {
  constructor(adapter, state) {
    this.adapter = adapter;
    this.state = state;
    this.undoStack = [];
    this.redoStack = [];
    this.listeners = new Set();
  }
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }
  notify() {
    this.listeners.forEach((fn) => fn(this.state));
  }
  // 何も変わらなかったときは、履歴に積まない（打ちかけの欄を保存し直しただけで、元に戻すが 1 回空振りし、やり直すが消えないように）
  commit(mutator, { history = true } = {}) {
    const before = history ? JSON.stringify(this.state) : null;
    mutator(this.state);
    if (history && JSON.stringify(this.state) !== before) {
      this.undoStack.push(JSON.parse(before));
      if (this.undoStack.length > HISTORY_LIMIT) this.undoStack.shift();
      this.redoStack = [];
    }
    this.persist();
    this.notify();
  }
  canUndo() { return this.undoStack.length > 0; }
  canRedo() { return this.redoStack.length > 0; }
  undo() {
    if (!this.canUndo()) return;
    this.redoStack.push(clone(this.state));
    this.state = this.undoStack.pop();
    this.persist();
    this.notify();
  }
  redo() {
    if (!this.canRedo()) return;
    this.undoStack.push(clone(this.state));
    this.state = this.redoStack.pop();
    this.persist();
    this.notify();
  }
  // 画面設計を開くとき・一覧へ戻るとき・完全に削除したときに呼ぶ（開いていない画面設計が戻るのを防ぐ）
  clearHistory() {
    this.undoStack = [];
    this.redoStack = [];
  }
  persist() {
    this.lastSaveOk = this.adapter.save(this.state);
    if (this.lastSaveOk === false) showBanner('保存に失敗しました。ブラウザの保存領域がいっぱいの可能性があります。');
    return this.lastSaveOk;
  }
}

let store = null;
const findDesign = (state, id) => state.designs.find((d) => d.id === id) || null;

// ── 画面設計の操作（store を書き換える）──
// 画面設計を書き換えた後は、ほかの画面設計が取り込んでいる項目（つなげたまま）も同じ commit の中でそろえる
// （元に戻すで、元と取り込んだ側が一緒に戻るように）。取り込んだ側の更新日時は変えない
// 更新日時は、画面設計の中身が変わったときだけ変える（何も変わらない操作を、元に戻すの履歴に積まないため）
function mutateDesign(id, fn, { touch = true } = {}) {
  if (!findDesign(store.state, id)) return false;
  store.commit((s) => {
    const d = findDesign(s, id);
    const before = touch ? JSON.stringify(d) : '';
    fn(d, s);
    if (touch && JSON.stringify(d) !== before) d.updatedAt = nowIso();
    syncLinkedItems(s);
  });
  return true;
}

const actions = {
  createDesign(name, target) {
    const n = cleanName(name);
    if (!n) return null;
    const d = createDesignData(n, target);
    store.commit((s) => {
      addCustomTarget(s, target);
      s.designs.push(d);
    });
    return d.id;
  },
  renameDesign(id, name) {
    const n = cleanName(name);
    if (!n) return false;
    return mutateDesign(id, (d) => { d.name = n; });
  },
  // patch は { name, target, description } のどれか
  updateDesignInfo(id, patch) {
    return mutateDesign(id, (d, s) => {
      if ('name' in patch) d.name = cleanName(patch.name) || d.name;
      if ('target' in patch) {
        d.target = patch.target;
        addCustomTarget(s, patch.target);
      }
      if ('description' in patch) d.description = String(patch.description);
    });
  },
  duplicateDesign(id) {
    const src = findDesign(store.state, id);
    if (!src) return null;
    const copy = duplicateDesignData(src);
    store.commit((s) => { s.designs.push(copy); });
    return copy.id;
  },
  trashDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = nowIso(); }, { touch: false });
  },
  restoreDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = null; }, { touch: false });
  },
  // 完全に削除は戻せない。履歴に写しが残っていると元に戻すで戻ってしまうので、履歴も空にする
  deleteDesignForever(id) {
    if (!findDesign(store.state, id)) return false;
    store.clearHistory();
    store.commit((s) => {
      s.designs = s.designs.filter((d) => d.id !== id);
      syncLinkedItems(s); // この画面設計から取り込んでいた項目は、今の中身で固定する
    }, { history: false });
    return true;
  },
  // patch は { name, device, height, showHeader, tablePos } のどれか
  updateScreen(designId, screenId, patch) {
    return mutateDesign(designId, (d) => {
      const i = d.screens.findIndex((x) => x.id === screenId);
      if (i < 0) return;
      let sc = d.screens[i];
      if ('device' in patch && own(DEVICES, patch.device)) {
        sc = changeDevice(sc, patch.device);
        // 縦は、いちばん下の部品が入るまで画面を伸ばす（部品を上へ寄せて重ねないため）。
        // 横は、幅が狭くなって画面からはみ出す部品を画面の中へ寄せる（知らない種類の部品はそのまま）
        sc.height = Math.max(sc.height, minScreenHeight(sc));
        sc.parts = sc.parts.map((p) => (partType(p.type) ? { ...p, ...fitRect(p, sc) } : p));
        sc.callouts = sc.callouts.map((c) => ({ ...c, ...fitCallout(c, sc) })); // 画面が狭くなったら、吹き出しも範囲の中へ寄せる
      }
      if ('height' in patch) {
        sc = { ...sc, height: Math.max(snapHeight(patch.height, sc.device), minScreenHeight(sc)) };
        sc.callouts = sc.callouts.map((c) => ({ ...c, ...fitCallout(c, sc) }));
      }
      if ('name' in patch) sc = { ...sc, name: cleanName(patch.name) || sc.name };
      if ('showHeader' in patch) sc = { ...sc, showHeader: !!patch.showHeader };
      if ('tablePos' in patch) sc = { ...sc, tablePos: patch.tablePos === 'bottom' ? 'bottom' : 'right' };
      d.screens[i] = sc;
    });
  },

  // ── 部品の操作 ──
  // at は置く位置（画面の左上から）。帯の下に置き、同じ位置に部品があればずらす。戻り値は新しい部品の id
  addPart(designId, screenId, type, at) {
    const sc = findScreen(designId, screenId);
    const t = partType(type);
    if (!sc || !t) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    // 入力欄の部品と表（最初はテーブル）を置くと、データベースの項目の一覧表にも項目を 1 つ足す（項目名と設定は項目が持つ）。
    // ステータスの印・進み具合の矢印は、画面設計のステータスの項目を指す（なければ作る）
    const d0 = findDesign(store.state, designId);
    const status = type === 'status' || type === 'steps' ? d0.items.find((it) => it.type === 'status') : null;
    const itemType = isInputType(type) ? type : type === 'table' ? 'table' : type === 'status' || type === 'steps' ? 'status' : '';
    const item = itemType && !status ? createItemData(itemType) : null;
    const p = createPartData(type, sc, freeSpot(sc, start), (status || item || {}).id || null, { design: d0 });
    if (p.view && 'current' in p.view) p.view.current = ((status || item).props.states[1] || (status || item).props.states[0] || '');
    mutateScreen(designId, screenId, (s, d) => {
      if (item) d.items.push(item);
      s.parts.push(p);
    });
    return p.id;
  },
  // patch は { label, labelPos, sample, placeholder, required, memo, numbered, props } のどれか（props は足りない分だけ書き換える）。
  // 項目を指す部品の label（項目名）・required・memo・props は項目に書く（その項目を置いた全部の画面が変わる）。
  // 項目を一覧表から消した後に残った部品では、それらを書き換えない（消したときの中身で固定する）
  updatePart(designId, screenId, partId, patch) {
    return mutatePart(designId, screenId, partId, (p, sc, d) => {
      ['labelPos', 'sample', 'placeholder'].forEach((k) => { if (k in patch) p[k] = patch[k]; });
      if ('numbered' in patch) p.no = patch.numbered ? (p.no != null ? p.no : nextPartNo(sc)) : null;
      if (isObj(patch.view)) {
        p.view = { ...(p.view || {}), ...clone(patch.view) };
        if (p.type === 'table') {
          p.view = normalizeTableView(p.view);
          const h = tableHeight(p.view.rows);
          if (p.y + h > sc.height) sc.height = Math.ceil((p.y + h) / GRID) * GRID; // 表を上へずらさず、画面を伸ばす
          Object.assign(p, fitRect({ ...p, h }, sc));
        }
      }
      const item = findItem(d, p.itemId);
      if (item) { if (!item.link) applyFieldPatch(item, 'name', patch); } // 取り込んだ項目は直せない（元のモックで直す）
      else if (!p.itemId) applyFieldPatch(p, 'label', patch);
    });
  },
  // 位置と大きさを変える（マス目に吸い付け、画面の中に収める）。変わらないときは履歴に積まない
  movePart(designId, screenId, partId, rect) {
    const sc = findScreen(designId, screenId);
    const p = findPart(sc, partId);
    if (!p) return false;
    const r = fitRect(rect, sc);
    if (r.x === p.x && r.y === p.y && r.w === p.w && r.h === p.h) return false;
    return mutatePart(designId, screenId, partId, (q) => { Object.assign(q, r); });
  },
  // 部品を消す。その部品につないだ吹き出しは残し、線だけを外す（画像 q27 の決めごと）
  deletePart(designId, screenId, partId) {
    return mutatePart(designId, screenId, partId, (p, sc) => {
      sc.parts = sc.parts.filter((x) => x.id !== partId);
      sc.callouts.forEach((c) => { if (c.target === partId) c.target = null; });
    });
  },

  // ── まとめて操作（画像 q28）。sel は [{ k: 'p'（部品）か 'c'（吹き出し）, id }] ──
  // rects（[{ k, id, x, y, w, h }]）の位置と大きさにする。部品は画面の中、吹き出しは置ける範囲の中に収める。何も変わらなければ履歴に積まない
  setRects(designId, screenId, rects) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    const next = rects.map((r) => {
      const cur = r.k === 'p' ? findPart(sc, r.id) : findCallout(sc, r.id);
      if (!cur) return null;
      const fit = r.k === 'p' ? fitRect(r, sc) : fitCallout(r, sc);
      return fit.x === cur.x && fit.y === cur.y && fit.w === cur.w && fit.h === cur.h ? null : { k: r.k, id: r.id, fit };
    }).filter(Boolean);
    if (!next.length) return false;
    return mutateScreen(designId, screenId, (s) => {
      next.forEach(({ k, id, fit }) => Object.assign(k === 'p' ? findPart(s, id) : findCallout(s, id), fit));
    });
  },
  // まとめて dx・dy（ドット）動かす。どれかが画面（吹き出しは範囲）の端に当たるときは、そこで止める（並びをくずさないため）
  moveMany(designId, screenId, sel, dx, dy) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    const rects = selRects(sc, sel);
    const [ddx, ddy] = clampGroupMove(sc, rects, snapGrid(dx), snapGrid(dy));
    if (!ddx && !ddy) return false;
    return this.setRects(designId, screenId, rects.map((r) => ({ ...r, x: r.x + ddx, y: r.y + ddy })));
  },
  alignMany(designId, screenId, sel, how) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    return this.setRects(designId, screenId, alignedRects(selRects(sc, sel), how));
  },
  // まとめて消す。消した部品につないでいた吹き出しは残し、線だけを外す
  deleteMany(designId, screenId, sel) {
    const sc = findScreen(designId, screenId);
    const parts = new Set(sel.filter((x) => x.k === 'p' && findPart(sc, x.id)).map((x) => x.id));
    const cos = new Set(sel.filter((x) => x.k === 'c' && findCallout(sc, x.id)).map((x) => x.id));
    if (!parts.size && !cos.size) return false;
    return mutateScreen(designId, screenId, (s) => {
      s.parts = s.parts.filter((p) => !parts.has(p.id));
      s.callouts = s.callouts.filter((c) => !cos.has(c.id));
      s.callouts.forEach((c) => { if (parts.has(c.target)) c.target = null; });
    });
  },
  // まとめて番号を付ける（付けるときは、上から下・左から右の順に、その画面の次の番号から）・外す
  numberMany(designId, screenId, sel, on) {
    const sc = findScreen(designId, screenId);
    const ids = sel.filter((x) => x.k === 'p').map((x) => findPart(sc, x.id)).filter((p) => p && (on ? p.no == null : p.no != null))
      .sort((a, b) => a.y - b.y || a.x - b.x).map((p) => p.id);
    if (!ids.length) return false;
    return mutateScreen(designId, screenId, (s) => {
      ids.forEach((id) => { const p = findPart(s, id); p.no = on ? nextPartNo(s) : null; });
    });
  },
  // コピーした部品と吹き出しを貼り付ける。entries は { parts: [{ part, item }], callouts: [吹き出し] }。dx・dy だけずらして置く。
  // 戻り値は貼り付けたものの sel。部品の項目の扱いは insertPartCopy と同じ（同じ画面に同じ項目を 2 回は置かない）。
  // 吹き出しのつなぐ部品は、一緒に貼り付けた部品なら新しい部品へ、この画面にある部品ならそのまま、ほかは外す
  insertCopies(designId, screenId, entries, dx, dy) {
    const sc = findScreen(designId, screenId);
    const d = findDesign(store.state, designId);
    if (!sc || !isObj(entries)) return [];
    const work = clone(sc);
    const newItems = [];
    const map = {};
    const out = [];
    (entries.parts || []).forEach(({ part: src, item: srcItem }) => {
      const r = preparePartCopy(d, work, newItems, src, { x: src.x + dx, y: src.y + dy }, srcItem);
      if (!r) return;
      map[src.id] = r.part.id;
      work.parts.push(r.part);
      if (r.item) newItems.push(r.item);
      out.push({ k: 'p', id: r.part.id });
    });
    const newCallouts = (entries.callouts || []).map((c) => {
      const target = map[c.target] || (findPart(sc, c.target) ? c.target : null);
      const nc = normalizeCallout({ ...clone(c), id: newId('k'), target, ...fitCallout({ ...c, x: c.x + dx, y: c.y + dy }, sc) });
      out.push({ k: 'c', id: nc.id });
      return nc;
    });
    if (!out.length) return [];
    mutateScreen(designId, screenId, (s, dd) => {
      dd.items.push(...newItems);
      s.parts.push(...work.parts.filter((p) => !s.parts.some((x) => x.id === p.id)));
      s.callouts.push(...newCallouts);
    });
    return out;
  },

  // ── つながりの図 ──
  // 動かした箱の位置を覚える。designId が null なら最初の画面の図（設定に持つ）、あれば編集の画面のその画面設計の図（画面設計に持つ。更新日時は変えない）
  setMapPos(designId, key, pos) {
    const p = { x: Math.max(0, snapGrid(pos.x)), y: Math.max(0, snapGrid(pos.y)) };
    if (!designId) {
      store.commit((s) => { s.settings.mapPos = { ...s.settings.mapPos, [key]: p }; });
      return true;
    }
    return mutateDesign(designId, (d) => { d.mapPos = { ...d.mapPos, [key]: p }; }, { touch: false });
  },
  // 覚えた位置を消して、自動で並べ直す
  resetMapPos(designId) {
    if (!designId) {
      if (!Object.keys(store.state.settings.mapPos || {}).length) return false;
      store.commit((s) => { s.settings.mapPos = {}; });
      return true;
    }
    const d = findDesign(store.state, designId);
    if (!d || !Object.keys(d.mapPos || {}).length) return false;
    return mutateDesign(designId, (dd) => { dd.mapPos = {}; }, { touch: false });
  },

  // ── 吹き出し ──
  // at は吹き出しの左上（画面の左上から）。target はつなぐ部品の id。戻り値は新しい吹き出しの id
  addCallout(designId, screenId, at, target = null) {
    const sc = findScreen(designId, screenId);
    if (!sc) return null;
    const c = normalizeCallout({ id: newId('k'), ...fitCallout({ x: at.x, y: at.y, w: 200, h: 80 }, sc), text: '説明を書きます。', target: findPart(sc, target) ? target : null });
    mutateScreen(designId, screenId, (s) => { s.callouts.push(c); });
    return c.id;
  },
  // patch は { text, color, tip, target } のどれか
  updateCallout(designId, screenId, id, patch) {
    const sc = findScreen(designId, screenId);
    if (!findCallout(sc, id)) return false;
    if ('target' in patch && patch.target && !findPart(sc, patch.target)) return false;
    return mutateScreen(designId, screenId, (s) => {
      const c = findCallout(s, id);
      if ('text' in patch) c.text = String(patch.text);
      if ('color' in patch && own(CALLOUT_COLORS, patch.color)) c.color = patch.color;
      if ('tip' in patch && ['dot', 'arrow', 'none'].includes(patch.tip)) c.tip = patch.tip;
      if ('target' in patch) c.target = patch.target || null;
    });
  },
  moveCallout(designId, screenId, id, rect) {
    const sc = findScreen(designId, screenId);
    const c = findCallout(sc, id);
    if (!c) return false;
    const r = fitCallout(rect, sc);
    if (r.x === c.x && r.y === c.y && r.w === c.w && r.h === c.h) return false;
    return mutateScreen(designId, screenId, (s) => { Object.assign(findCallout(s, id), r); });
  },
  deleteCallout(designId, screenId, id) {
    if (!findCallout(findScreen(designId, screenId), id)) return false;
    return mutateScreen(designId, screenId, (s) => { s.callouts = s.callouts.filter((c) => c.id !== id); });
  },
  // 貼り付けと複製。src の写しを at に置く。番号の付いた部品の写しには、その画面の次の番号を付ける。戻り値は新しい部品の id。
  // 項目を指す部品の写しは、その項目がこの画面にまだなければ同じ項目を指す（同じ画面設計のほかの画面へ貼り付けたとき）。
  // この画面にもうあれば、項目も写して新しい項目にする（同じ項目を 1 つの画面に 2 回は置かないため）。
  // srcItem はコピーしたときの項目の写し。ほかの画面設計へ貼り付けて、その項目がないときに、同じ id で足す
  insertPartCopy(designId, screenId, src, at, srcItem = null) {
    if (!isObj(src)) return null;
    const out = this.insertCopies(designId, screenId, { parts: [{ part: { ...src, x: at.x, y: at.y }, item: srcItem }] }, 0, 0);
    return out.length ? out[0].id : null;
  },
  renumberParts(designId, screenId) {
    return mutateScreen(designId, screenId, (sc) => { sc.parts = renumberedParts(sc.parts); });
  },

  // ── データベースの項目の操作 ──
  addItem(designId, type) {
    if (!(isInputType(type) || type === 'table') || !findDesign(store.state, designId)) return null;
    const item = createItemData(type);
    mutateDesign(designId, (d) => { d.items.push(item); });
    return item.id;
  },
  // patch は { label（項目名）, required, memo, props, type } のどれか
  updateItem(designId, itemId, patch) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || item.link) return false; // 取り込んだ項目は直せない（元のモックで直す）
    if ('type' in patch && !(isInputType(patch.type) && isInputType(item.type))) return false;
    return mutateDesign(designId, (d) => {
      const item = findItem(d, itemId);
      if ('type' in patch && patch.type !== item.type) changeItemType(d, item, patch.type);
      applyFieldPatch(item, 'name', patch);
    });
  },
  // 項目を並べ替える。toIndex は、今の並びで「この位置の項目の前」に入れる位置（いちばん後ろは項目の数）
  moveItem(designId, itemId, toIndex) {
    const d = findDesign(store.state, designId);
    const from = d ? d.items.findIndex((it) => it.id === itemId) : -1;
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex > d.items.length || toIndex === from || toIndex === from + 1) return false;
    return mutateDesign(designId, (dd) => {
      const [it] = dd.items.splice(from, 1);
      dd.items.splice(toIndex > from ? toIndex - 1 : toIndex, 0, it);
    });
  },
  // 項目を一覧表から消す。その項目を置いた部品は画面に残し、消したときの項目名と設定を部品に写して固定する（ユーザーの指示）
  deleteItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item) return false;
    const fields = frozenItemFields(item);
    return mutateDesign(designId, (d) => {
      d.items = d.items.filter((it) => it.id !== itemId);
      d.screens.forEach((s) => s.parts.forEach((p) => { if (p.itemId === itemId && isItemPart(p)) Object.assign(p, clone(fields)); }));
    });
  },
  // 項目を消した後に残った部品から、消したときの中身で項目を一覧表のいちばん下に戻す。同じ項目を指していたほかの部品もつながり直る
  // ステータスの項目は、画面設計にもうステータスの項目があれば、残った部品をその項目へつなぎ直す（ステータスの並びは画面設計に 1 つだけ）。
  // 1 つの画面に同じ項目の部品が 2 つ以上残っていたとき（複製した後など）は、2 つ目からは項目の写しを指す（1 つの画面に同じ項目は 1 回だけ）
  restoreItem(designId, itemId) {
    const d = findDesign(store.state, designId);
    if (!d || findItem(d, itemId)) return false;
    const src = d.screens.flatMap((s) => s.parts).find((p) => p.itemId === itemId && isItemPart(p));
    if (!src) return false;
    const fromPart = (p, id) => normalizeItem({ id, name: p.label, type: partItemType(p), required: p.required, memo: p.memo, props: clone(p.props), lookup: p.lookup || null, link: p.link || null });
    const status = partItemType(src) === 'status' ? d.items.find((it) => it.type === 'status') : null;
    return mutateDesign(designId, (dd) => {
      if (!status) dd.items.push(fromPart(src, itemId));
      dd.screens.forEach((s) => {
        let seen = 0;
        s.parts = s.parts.map((p) => {
          if (p.itemId !== itemId || !isItemPart(p)) return p;
          if (status) return { ...withoutItemFields(p), itemId: status.id, view: { ...p.view, current: status.props.states.includes((p.view || {}).current) ? p.view.current : status.props.states[1] || status.props.states[0] || '' } };
          seen += 1;
          if (seen === 1 || !oncePerScreen(partItemType(p))) return withoutItemFields(p);
          const copyItem = fromPart(p, newId('i'));
          dd.items.push(copyItem);
          return { ...withoutItemFields(p), itemId: copyItem.id };
        });
      });
    });
  },
  // 表の部品の中身（テーブル・レコード一覧・関連レコード一覧）を変える。テーブルにすると項目（表）を作って指し、
  // テーブルから変えると項目を指さなくなる。そのとき、その項目をほかのどの画面にも置いていなければ、項目も消す
  // （中身を選び直しただけで、使わない項目が一覧表に残らないため。Claude が決めた）
  setTableKind(designId, screenId, partId, kind) {
    const p0 = findPart(findScreen(designId, screenId), partId);
    if (!p0 || p0.type !== 'table' || !own(TABLE_KINDS, kind) || p0.tableKind === kind) return false;
    const d0 = findDesign(store.state, designId);
    const item = kind === 'subtable' ? createItemData('table') : null;
    // ほかの画面設計（ごみ箱の中も）がこの表の項目を取り込んでいるときは、項目を残す（取り込んだ側が知らせなしに「元なし」にならないように）
    const imported = !!p0.itemId && store.state.designs.some((x) => x.id !== designId && x.items.some((it) => it.link && !it.link.lost && it.link.designId === designId && it.link.itemId === p0.itemId));
    return mutatePart(designId, screenId, partId, (p, sc, d) => {
      const old = p.itemId;
      if (item) {
        d.items.push(item);
        Object.assign(withoutItemFieldsInPlace(p), { tableKind: kind, itemId: item.id });
        return;
      }
      const defLabel = (k) => (k === 'related' ? '関連レコード一覧' : '一覧');
      if (p.tableKind === 'subtable') {
        const oldItem = findItem(d, old);
        delete p.itemId;
        p.label = defLabel(kind);
        p.required = false;
        p.memo = '';
        p.props = defaultTablePartProps(d0);
        if (oldItem && !imported && !d.screens.some((s) => s.parts.some((x) => x.itemId === old))) d.items = d.items.filter((it) => it.id !== old);
      } else if (p.label === defLabel(p.tableKind)) p.label = defLabel(kind); // 名前が最初のままなら、新しい中身の名前にする
      p.tableKind = kind;
    });
  },
  // ほかの画面設計（srcDesignId）の項目を取り込み、一覧表のいちばん下に足す。取り込んだ項目は元とつなげたままにする。
  // 戻り値は足した項目の数。この画面設計の項目を取り込んだ項目（元がこの画面設計）と、取り込み済みの項目は足さない
  importItems(designId, srcDesignId, itemIds) {
    const d = findDesign(store.state, designId);
    const src = findDesign(store.state, srcDesignId);
    if (!d || !src || d.id === src.id) return 0;
    const add = itemIds.map((id) => findItem(src, id)).filter((it) => it && !IMPORT_BLOCKED.includes(importState(d, src, it)))
      .map((it) => ({ ...linkedFields(it, src), id: newId('i'), link: { designId: src.id, itemId: it.id, designName: src.name, lost: false } }));
    if (!add.length) return 0;
    mutateDesign(designId, (dd) => { dd.items.push(...add.map(normalizeItem)); });
    return add.length;
  },
  // ルックアップを書き換える（null で外す）。create（{ index, name, type }）を渡すと、一緒に写す先の項目を新しく作って、
  // copies[index] の写す先にする（「＋ 同じ名前で新しく作る」）。取り込んだ項目と、ルックアップを書けない種類の項目は書き換えない
  updateLookup(designId, itemId, lookup, create = null) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || item.link || !LOOKUP_TYPES.includes(item.type)) return false;
    const next = lookup ? normalizeLookup(clone(lookup)) : null;
    const created = create && next && next.copies[create.index] ? createItemData(isItemType(create.type) ? create.type : 'text1', create.name) : null;
    return mutateDesign(designId, (d) => {
      if (created) {
        d.items.push(created);
        next.copies[create.index].to = { itemId: created.id, name: created.name };
      }
      findItem(d, itemId).lookup = next;
    });
  },
  // 取り込んだ項目のつながりを切り、そのときの中身の、この画面設計だけの項目にする
  unlinkItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || !item.link) return false;
    return mutateDesign(designId, (d) => { findItem(d, itemId).link = null; });
  },
  // データベースの項目の一覧表にある項目を、画面に置く。その画面にもう置いてあれば置かない（戻り値 null）
  addItemPart(designId, screenId, itemId, at) {
    const sc = findScreen(designId, screenId);
    const item = findItem(findDesign(store.state, designId), itemId);
    const type = item && isItemType(item.type) ? partTypeOfItem(item.type) : '';
    const t = partType(type);
    if (!sc || !t || (oncePerScreen(item.type) && itemOnScreen(sc, itemId))) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    const p = createPartData(type, sc, freeSpot(sc, start), itemId);
    if (p.view && 'current' in p.view) p.view.current = item.props.states[1] || item.props.states[0] || '';
    mutateScreen(designId, screenId, (s) => { s.parts.push(p); });
    return p.id;
  },
};

function findScreen(designId, screenId) {
  const d = findDesign(store.state, designId);
  return d ? d.screens.find((s) => s.id === screenId) || null : null;
}
// 画面・部品が見つからないときは、履歴に何も積まずに false を返す
function mutateScreen(designId, screenId, fn) {
  if (!findScreen(designId, screenId)) return false;
  return mutateDesign(designId, (d) => fn(d.screens.find((s) => s.id === screenId), d));
}
function mutatePart(designId, screenId, partId, fn) {
  if (!findPart(findScreen(designId, screenId), partId)) return false;
  return mutateScreen(designId, screenId, (sc, d) => fn(findPart(sc, partId), sc, d));
}

// 貼り付ける部品 1 つの下ごしらえ（commit はしない）。sc は貼り付ける先の画面（ここまでに貼り付けた部品を足した写し）、
// pendingItems はここまでに作った項目。戻り値 { part, item（新しく足す項目。なければ null）}
function preparePartCopy(d, sc, pendingItems, src, at, srcItem) {
  if (!isObj(src)) return null;
  const p = { ...clone(src), id: newId('p'), ...fitRect({ ...src, ...freeSpot(sc, fitRect({ ...src, ...at }, sc)) }, sc) };
  p.no = src.no != null ? nextPartNo(sc) : null;
  let newItem = null;
  const find = (id) => findItem(d, id) || pendingItems.find((it) => it.id === id) || null;
  if (!p.itemId || !isItemPart(p)) return { part: p, item: null };
  // ステータスの印・進み具合の矢印は、貼り付ける先の画面設計にステータスの項目があれば、それを指す（ステータスの並びは画面設計に 1 つだけ）
  const status = partItemType(p) === 'status' ? d.items.find((it) => it.type === 'status') || pendingItems.find((it) => it.type === 'status') : null;
  if (status) {
    withoutItemFieldsInPlace(p).itemId = status.id;
    if (p.view && !status.props.states.includes(p.view.current)) p.view.current = status.props.states[1] || status.props.states[0] || '';
    return { part: p, item: null };
  }
  // 取り込んだ項目の部品を、取り込んだ元の画面設計へ貼り付けるときは、元の項目を指す
  const home = isObj(srcItem) && srcItem.link && srcItem.link.designId === d.id ? findItem(d, srcItem.link.itemId) : null;
  if (home && !find(p.itemId)) p.itemId = home.id;
  const item = find(p.itemId);
  // 貼る先に、同じ id の項目を一覧表から消した後に残った部品があるときは、項目を写すときに新しい id にする（消した項目が生き返らないように）
  const orphaned = (id) => d.screens.some((s) => s.parts.some((x) => x.itemId === id)) || sc.parts.some((x) => x.itemId === id);
  if (!item && isObj(srcItem) && srcItem.id === p.itemId) {
    newItem = { ...clone(srcItem), id: orphaned(srcItem.id) ? newId('i') : srcItem.id };
    p.itemId = newItem.id;
  } else if (item && oncePerScreen(item.type) && itemOnScreen(sc, item.id)) {
    newItem = { ...clone(item), id: newId('i') };
    p.itemId = newItem.id;
  } else if (!item && oncePerScreen(partItemType(p)) && sc.parts.some((x) => x.itemId === p.itemId)) {
    p.itemId = newId('i'); // 項目を消した後に残った部品を、同じ部品がもうある画面に貼るときは、別の項目として残す
  }
  // コピーした後で項目の種類を変えていたときは、部品の種類を項目の今の種類に合わせる
  const target = newItem || item;
  if (target && isInputType(target.type) && isInputType(p.type)) p.type = target.type;
  return { part: p, item: newItem };
}

// 選んだものの位置と大きさ（選んだ順）。見つからないものは除く
function selRects(sc, sel) {
  return sel.map((x) => {
    const o = x.k === 'p' ? findPart(sc, x.id) : findCallout(sc, x.id);
    return o ? { k: x.k, id: x.id, x: o.x, y: o.y, w: o.w, h: o.h } : null;
  }).filter(Boolean);
}
// まとめて動かす幅を、部品は画面の中、吹き出しは範囲の中に収まるところまでにする
function clampGroupMove(sc, rects, dx, dy) {
  const maxW = Math.floor(sc.width / GRID) * GRID;
  const maxH = Math.floor(sc.height / GRID) * GRID;
  const b = calloutBounds(sc);
  let [lo, hi, lo2, hi2] = [-Infinity, Infinity, -Infinity, Infinity];
  rects.forEach((r) => {
    const [x0, y0, x1, y1] = r.k === 'p' ? [0, 0, maxW, maxH] : [b.x0, b.y0, b.x1, b.y1];
    lo = Math.max(lo, x0 - r.x); hi = Math.min(hi, x1 - r.x - r.w);
    lo2 = Math.max(lo2, y0 - r.y); hi2 = Math.min(hi2, y1 - r.y - r.h);
  });
  return [Math.min(Math.max(dx, lo), hi), Math.min(Math.max(dy, lo2), hi2)].map((v) => (Number.isFinite(v) ? v : 0));
}

// 設定の欄の変更を、項目（nameKey は 'name'）か、項目を指さない部品（nameKey は 'label'）に書く
function applyFieldPatch(target, nameKey, patch) {
  if ('label' in patch) target[nameKey] = patch.label;
  if ('required' in patch) target.required = !!patch.required;
  if ('memo' in patch) target.memo = patch.memo;
  if (isObj(patch.props)) target.props = keepInitialInOptions(target.type, { ...target.props, ...patch.props });
}

// ── 5. 共通の部品 ─────────────────────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showBanner(message) {
  const el = $('#banner');
  el.textContent = message;
  el.hidden = false;
}

let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

// 小さな窓。OK で collect(窓) の結果（{ error } なら窓に出して閉じない）、キャンセルで null を返す。
// 窓は 1 つだけ。開いている間は後ろの画面（#app）を inert にして、押せないようにする
function showDialog({ title, body, okLabel, okClass = 'primary', init, collect, wide = false }) {
  if (isDialogOpen()) return Promise.resolve(null);
  return new Promise((resolve) => {
    const root = $('#dialog-root');
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <h2>${esc(title)}</h2>
          <div class="modal-body">${body}</div>
          <p class="modal-error" hidden></p>
          <div class="modal-actions">
            <button class="btn" data-dlg="cancel">キャンセル</button>
            <button class="btn ${okClass}" data-dlg="ok">${esc(okLabel)}</button>
          </div>
        </div>
      </div>`;
    const modal = $('.modal', root);
    const close = (value) => {
      document.removeEventListener('keydown', onKey, true);
      root.innerHTML = '';
      appEl().removeAttribute('inert');
      resolve(value);
    };
    const ok = () => {
      const r = collect ? collect(modal) : true;
      if (r && r.error) {
        const errEl = $('.modal-error', modal);
        errEl.textContent = r.error;
        errEl.hidden = false;
        return;
      }
      close(r);
    };
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(null); return; }
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      // ボタンの上の Enter は、ブラウザの本来の動き（そのボタンを押す）に任せる。複数行の欄では改行にする
      if (e.target && e.target.closest && e.target.closest('button, textarea')) return;
      e.preventDefault();
      ok();
    }
    document.addEventListener('keydown', onKey, true);
    $('[data-dlg="cancel"]', modal).addEventListener('click', () => close(null));
    $('[data-dlg="ok"]', modal).addEventListener('click', ok);
    appEl().setAttribute('inert', '');
    if (init) init(modal);
    // 窓の中にフォーカスを移す。危ない操作の窓では「キャンセル」に置く（Enter の押し間違いで実行しないため）
    if (!modal.contains(document.activeElement)) $(okClass === 'danger' ? '[data-dlg="cancel"]' : '[data-dlg="ok"]', modal).focus();
  });
}
const isDialogOpen = () => !!$('#dialog-root .modal-overlay');

// 作る先を選ぶ欄。「その他」を選ぶと名前を書く欄が出る。選んだ値は readTargetPicker で読む
const OTHER_TARGET = '__other__';
function targetPickerHtml(state, current) {
  const customs = [...state.settings.customTargets];
  if (current && !builtinTarget(current) && !customs.includes(current)) customs.push(current);
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
  return `
    <div class="target-picker">
      <select class="target-select" aria-label="作る先">
        ${current ? '' : opt('', '（選んでいません）', true)}
        ${BUILTIN_TARGETS.map((t) => opt('b:' + t.id, t.label, current === t.id)).join('')}
        ${customs.map((c) => opt('c:' + c, c, current === c)).join('')}
        ${opt(OTHER_TARGET, 'その他（名前を書く）', false)}
      </select>
      <input type="text" class="target-other" maxlength="${TARGET_MAX}" placeholder="作る先の名前" aria-label="作る先の名前" hidden>
    </div>`;
}
// 戻り値: 作る先（kintone などは id、その他は書いた名前）。その他で名前が空なら null
function readTargetPicker(root) {
  const v = $('.target-select', root).value;
  if (v === OTHER_TARGET) return resolveTargetName($('.target-other', root).value) || null;
  return v.slice(2);
}
function bindTargetPicker(root, onPick) {
  const sel = $('.target-select', root);
  const other = $('.target-other', root);
  sel.addEventListener('change', () => {
    other.hidden = sel.value !== OTHER_TARGET;
    if (!other.hidden) { other.focus(); return; }
    if (onPick && sel.value) onPick(readTargetPicker(root));
  });
  if (!onPick) return;
  other.addEventListener('change', () => {
    const t = readTargetPicker(root);
    if (t) onPick(t);
  });
}

function targetChip(target) {
  const cls = builtinTarget(target) ? ' t-' + target : '';
  return `<span class="chip${cls}">${esc(targetLabel(target))}</span>`;
}

// 画面を、編集の画面と同じ HTML で描く（縮小画像にも使う）。selectedId の部品には、選んだ印と縁のつまみを付ける。
// marks のとき（編集の画面）は、項目を消した後に残った部品などに小さな札を付ける（書き出しと縮小画像には付けない）
// selected（部品の id の Set）を渡すと、それらに選んだ印を付ける。縁のつまみは gripId の部品だけ（1 つだけ選んだとき）
function screenHtml(design, screen, { grid = false, height = screen.height, selectedId = null, selected = null, gripId = selectedId, marks = false } = {}) {
  const band = screen.showHeader ? `<div class="screen-band">${esc(design.name)} ／ ${esc(screen.name)}</div>` : '';
  const isSel = (id) => (selected ? selected.has(id) : id === selectedId);
  const parts = screen.parts.map((p) => partHtml(resolvePart(design, p), isSel(p.id), marks, p.id === gripId)).join('');
  return `<div class="screen${grid ? ' grid' : ''}" style="width:${screen.width}px;height:${height}px">${band}${parts}</div>`;
}

// ── 部品の見た目（画像 q15・仕上がりイメージ.png に合わせた）──
const GRIPS = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
const partNoHtml = (p, cls = '') => (p.no != null ? `<span class="pno${cls}">${p.no}</span>` : '');

function partHtml(p, selected = false, marks = false, withGrips = selected) {
  const t = partType(p.type);
  const cls = ['part', 'pt-' + (t ? p.type : 'unknown')];
  if (t && t.input && p.labelPos === 'left') cls.push('lab-left');
  if (selected) cls.push('sel');
  const grips = selected && withGrips ? GRIPS.map((g) => `<span class="grip g-${g}" data-grip="${g}"></span>`).join('') : '';
  // 読み込んだデータが思わぬ形でも、ほかの部品と画面は描けるように、この部品だけを「描けない部品」の箱にする
  let inner;
  try {
    inner = partInnerHtml(p, t, marks);
  } catch (e) {
    inner = `<div class="punknown">この部品は描けません（${esc(e.message || e)}）</div>`;
  }
  return `<div class="${cls.join(' ')}" data-part-id="${esc(p.id)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px">${inner}${grips}</div>`;
}

// 編集の画面だけで、項目名の後ろに付ける札（項目を一覧表から消した後に残った部品）
function partMarksHtml(p) {
  if (isItemPart(p) && p.itemId && !p.item) return ' <span class="tag gone" title="この部品の項目は、データベースの項目の一覧表から消しました">項目なし</span>';
  const link = p.item && p.item.link;
  if (link && link.lost) return ` <span class="tag lost" title="取り込んだ元のモック（または元の項目）はもうありません">取り込み・元なし</span>`;
  if (link) return ` <span class="tag link" title="モック「${esc(link.designName)}」から取り込んだ項目">取り込み</span>`;
  return '';
}

function partInnerHtml(p, t, marks = false) {
  if (!t) return `<div class="punknown">${partNoHtml(p)}${esc(partTypeName(p.type))}</div>`;
  const pr = p.props;
  // 項目名のない部品の番号は、ボタンと同じく左の外（左に入る幅がないときは左上の角に重ねる）
  const outNo = () => partNoHtml(p, p.x >= 28 ? ' pno-out' : ' pno-corner');
  switch (p.type) {
    case 'table': return `${partLabelHtml(p, marks)}${tableHtml(p)}`;
    case 'graph': return `<div class="plabel">${partNoHtml(p)}<span class="plabel-text">${esc(p.label)}</span></div><div class="pgraph">${graphSvg(p)}</div>`;
    case 'search':
      return `${outNo()}<div class="psearch"><span class="pph">🔍 ${esc(p.placeholder || t.ph)}</span>${pr.button !== false ? '<b>検索</b>' : ''}</div>`;
    case 'filter': {
      const names = (pr.items || []).map((id, i) => [p.itemNames ? p.itemNames[id] : '', (pr.values || [])[i]]);
      const chips = names.length
        ? names.map(([n, val]) => `<span class="f"><small>${esc(n || '（項目なし）')}</small>${esc(val || 'すべて')}<i>▼</i></span>`).join('')
        : '<span class="pph">（絞り込む項目を選んでください）</span>';
      return `${outNo()}<div class="pfilter"><span>絞り込み:</span>${chips}</div>`;
    }
    case 'pager': {
      const per = Math.max(1, Number(pr.perPage) || 20);
      const total = Math.max(0, Number(pr.total) || 0);
      const pages = Math.max(1, Math.ceil(total / per));
      const nums = pages <= 4 ? Array.from({ length: pages }, (_, i) => String(i + 1)) : ['1', '2', '3', '…', String(pages)];
      const count = pr.showCount === false ? '' : total ? `<em>${total} 件中 1〜${Math.min(per, total)} 件</em>` : '<em>0 件</em>';
      return `${outNo()}<div class="ppager"><span>‹</span>${nums.map((n, i) => `<span${i === 0 ? ' class="on"' : ''}>${n}</span>`).join('')}<span>›</span>${count}</div>`;
    }
    case 'status': {
      const states = pr.states || [];
      const cur = p.view && states.includes(p.view.current) ? p.view.current : states[0] || '';
      const word = p.view && p.view.showWord === false ? '' : `<span>${esc(p.label)}</span>`;
      return `${outNo()}<div class="pstatus">${word}<span class="pbadge sc${Math.max(0, states.indexOf(cur)) % 5}">${esc(cur)}</span>${marks ? partMarksHtml(p) : ''}</div>`;
    }
    case 'steps': {
      const states = pr.states || [];
      const at = p.view ? states.indexOf(p.view.current) : -1;
      return `${outNo()}<div class="psteps">${states.map((s, i) => `<span class="${i < at ? 'done' : i === at ? 'on' : ''}">${esc(s)}</span>`).join('')}</div>`;
    }
    case 'tabs': {
      const tabs = pr.tabs || [];
      const cur = tabs.includes(pr.current) ? pr.current : tabs[0];
      return `${outNo()}<div class="ptabs">${tabs.map((s) => `<span${s === cur ? ' class="on"' : ''}>${esc(s)}</span>`).join('')}</div>`;
    }
    case 'image':
      return `${partNoHtml(p, ' pno-corner')}<div class="pimage"><svg width="40" height="32" viewBox="0 0 40 32" aria-hidden="true"><rect x="1" y="1" width="38" height="30" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/><circle cx="12" cy="10" r="3.5" fill="#94a3b8"/><path d="M4,28 L15,17 L22,23 L28,15 L37,28 Z" fill="#94a3b8"/></svg>${esc(p.label)}</div>`;
    case 'link':
      return `${outNo()}<div class="plink">${esc(p.label)}</div>`;
    case 'icon':
      return `${partNoHtml(p, ' pno-corner')}<div class="picon-wrap">${iconSvg(pr.icon, pr.color)}</div>`;
    case 'button':
      // 番号はボタンの左の外。左に番号の入る幅がないときは、画面の縁で切れないように左上の角に重ねる
      return `${partNoHtml(p, p.x >= 28 ? ' pno-out' : ' pno-corner')}<div class="pbtn ${pr.style === 'normal' ? 'normal' : 'primary'}">${esc(p.label)}</div>`;
    case 'heading':
      return `<div class="phead">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'desc':
      return `<div class="pdesc">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'divider':
      return `<div class="pline">${partNoHtml(p)}<i></i></div>`;
  }
  return partLabelHtml(p, marks) + partFieldHtml(p, t);
}

// 入力欄の部品と表の、番号・項目名・必須の印・ルックアップの札（と、編集の画面だけの札）
function partLabelHtml(p, marks) {
  const ref = p.lookupRole ? '<span class="reftag" title="ほかのデータベースから値を引く項目（ルックアップ）">⇦ ルックアップ</span>' : '';
  const related = p.type === 'table' && p.tableKind === 'related' && p.relatedName ? `<span class="reftag" title="ほかのデータベースのレコードを並べる表（関連レコード一覧）">⇦ ${esc(p.relatedName)}</span>` : '';
  return `<div class="plabel">${partNoHtml(p)}<span class="plabel-text">${esc(p.label)}</span>${p.required ? '<span class="preq">*</span>' : ''}${ref}${related}${marks ? partMarksHtml(p) : ''}</div>`;
}

// 表の部品の中身。列の名前・見本の値・幅は p.columns（resolvePart で付けた列）と、この画面だけの設定（view）から
function tableHtml(p) {
  const cols = p.columns || [];
  const view = p.view || { rows: 3, samples: {}, widths: {} };
  const ops = p.tableKind === 'subtable';
  const icon = p.tableKind === 'records';
  const avail = Math.max(60, p.w - (ops ? 52 : 0) - (icon ? 34 : 0) - 2);
  const fixed = cols.reduce((s, c) => s + (view.widths[c.id] || 0), 0);
  const free = cols.filter((c) => !view.widths[c.id]).length;
  const each = free ? Math.max(40, Math.floor((avail - fixed) / free)) : 0;
  const width = (c) => view.widths[c.id] || each;
  const PH = { number: '数値', calc: '自動計算', date: '年-月-日', datetime: '年-月-日 時:分', dropdown: '選択', radio: '選択', checkbox: '選択', user: '人', file: 'ファイル', text2: '文章' };
  const head = `<tr>${icon ? '<th style="width:34px"></th>' : ''}${cols.map((c) => `<th style="width:${width(c)}px">${esc(c.name)}${c.required ? ' <span class="preq">*</span>' : ''}</th>`).join('') || '<th>（列がありません）</th>'}</tr>`;
  const rows = Array.from({ length: view.rows }, (_, r) => `<tr>${icon ? '<td class="ic">📄</td>' : ''}${cols.map((c) => {
    const val = (view.samples[c.id] || [])[r];
    const cls = c.type === 'number' ? ' class="num"' : c.type === 'calc' ? ' class="calc"' : '';
    return `<td${cls}>${val ? esc(val) : `<span class="pph">${esc(PH[c.type] || '文字列')}</span>`}</td>`;
  }).join('') || '<td></td>'}</tr>`).join('');
  const opsHtml = ops ? `<div class="ptbl-ops">${Array.from({ length: view.rows }, () => '<span><i>＋</i><i>−</i></span>').join('')}</div>` : '';
  return `<div class="ptbl-wrap"><table class="ptbl">${head}${rows}</table>${opsHtml}</div>`;
}

// グラフの部品の絵。見本の値（1 行に「分類, 値」）から、棒・横棒・折れ線・円を描く
const GRAPH_COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', '#f97316'];
// 1 行に「分類, 値」。全角の数字は半角に直し、値の中の桁の区切り（1,200）は数に含める。値の後ろの単位（120万）は読み飛ばす。
// 値に数字のない行は描かない（0 の棒にしない）
function parseGraphSamples(text) {
  return String(text || '').normalize('NFKC').split('\n').map((line) => {
    const m = line.match(/^(.*?)[,、\t]\s*[¥$]?([-+]?\d[\d,]*(?:\.\d+)?)[^\d]*$/);
    if (!m) return null;
    const value = Number(m[2].replace(/,/g, ''));
    return Number.isFinite(value) ? { label: m[1].trim(), value: Math.max(0, value) } : null;
  }).filter(Boolean).slice(0, 24);
}
// 目盛りを 4 つに分けたとき、1 目盛りがきりのよい数（6・60・250 など）になるいちばん上の値
function niceMax(v) {
  if (v <= 0) return 4;
  const raw = v / 4;
  const p = 10 ** Math.floor(Math.log10(raw));
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((k) => k * p).find((x) => x >= raw - 1e-9) * 4;
}
function graphSvg(p) {
  const w = Math.max(40, p.w - 2);
  const h = Math.max(40, p.h - TABLE_LABEL_H - 6);
  const data = parseGraphSamples(p.props.samples);
  const svg = (inner) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" aria-hidden="true">${inner}</svg>`;
  const text = (x, y, s, attrs = '') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" fill="#475569" ${attrs}>${esc(s)}</text>`;
  if (!data.length) return svg(text(w / 2, h / 2, '見本の値を書くと、グラフが出ます', 'text-anchor="middle"'));
  const max = niceMax(Math.max(...data.map((d) => d.value)));
  const chart = p.props.chart;
  if (chart === 'pie') {
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const r = Math.max(10, Math.min(h / 2 - 10, w * 0.28));
    const cx = r + 16;
    const cy = h / 2;
    let a = -Math.PI / 2;
    const whole = data.filter((d) => d.value > 0).length === 1;
    const slices = data.map((d, i) => {
      const da = (d.value / total) * Math.PI * 2;
      const [x1, y1, x2, y2] = [cx + r * Math.cos(a), cy + r * Math.sin(a), cx + r * Math.cos(a + da), cy + r * Math.sin(a + da)];
      const path = whole ? (d.value > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${GRAPH_COLORS[i % 8]}"/>` : '')
        : `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${da > Math.PI ? 1 : 0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${GRAPH_COLORS[i % 8]}"/>`;
      a += da;
      return path;
    }).join('');
    const legend = data.map((d, i) => `<rect x="${cx + r + 24}" y="${18 + i * 22}" width="11" height="11" fill="${GRAPH_COLORS[i % 8]}"/>${text(cx + r + 40, 28 + i * 22, `${d.label}　${d.value}（${Math.round((d.value / total) * 100)}%）`, 'font-size="12"')}`).join('');
    return svg(slices + legend);
  }
  const unit = String(p.props.unit || '').trim();
  if (chart === 'hbar') {
    const left = 96;
    const bw = (h - 20) / data.length;
    const bars = data.map((d, i) => {
      const len = Math.max(0, ((w - left - 50) * d.value) / max);
      const y = 10 + i * bw + bw * 0.18;
      return `<rect x="${left}" y="${y.toFixed(1)}" width="${len.toFixed(1)}" height="${Math.max(0, bw * 0.64).toFixed(1)}" fill="#3b82f6"/>${text(left - 6, y + bw * 0.42, d.label, 'text-anchor="end" font-size="12"')}${text(left + len + 5, y + bw * 0.42, String(d.value))}`;
    }).join('');
    return svg(`<line x1="${left}" y1="6" x2="${left}" y2="${h - 6}" stroke="#64748b"/>${bars}`);
  }
  const [L, R, T, B] = [44, 12, unit ? 22 : 12, 24];
  const pw = Math.max(0, w - L - R);
  const ph = Math.max(0, h - T - B);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((k) => {
    const y = T + ph * (1 - k);
    return `<line x1="${L}" y1="${y.toFixed(1)}" x2="${w - R}" y2="${y.toFixed(1)}" stroke="${k ? '#e2e8f0' : '#64748b'}"/>${text(L - 5, y + 4, String(Math.round(max * k * 100) / 100), 'text-anchor="end" font-size="10.5"')}`;
  }).join('');
  const step = pw / data.length;
  const cxs = data.map((d, i) => L + step * (i + 0.5));
  const ys = data.map((d) => T + ph * (1 - d.value / max));
  const labels = data.map((d, i) => text(cxs[i], h - 8, d.label, 'text-anchor="middle"')).join('');
  const marks = chart === 'line'
    ? `<polyline points="${cxs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ')}" fill="none" stroke="#3b82f6" stroke-width="2.5"/>${cxs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" fill="#fff" stroke="#3b82f6" stroke-width="2"/>`).join('')}`
    : cxs.map((x, i) => `<rect x="${(x - step * 0.32).toFixed(1)}" y="${ys[i].toFixed(1)}" width="${(step * 0.64).toFixed(1)}" height="${Math.max(0, T + ph - ys[i]).toFixed(1)}" fill="#3b82f6"/>`).join('');
  return svg(`${ticks}<line x1="${L}" y1="${T}" x2="${L}" y2="${T + ph}" stroke="#64748b"/>${marks}${labels}${unit ? text(L, 12, `（${unit}）`, 'font-size="10.5"') : ''}`);
}

// 入力欄の部品の、項目名より下（入力欄・選択肢・添付の枠）
function partFieldHtml(p, t) {
  const pr = p.props;
  const opts = (mark, isOn) => `<div class="popts${pr.dir === 'v' ? ' v' : ''}">${(pr.options || []).map((o) =>
    `<span class="popt"><span class="pmark ${mark}${isOn(o) ? ' on' : ''}"></span>${esc(o)}</span>`).join('')}</div>`;
  if (p.type === 'radio') return opts('rd', (o) => o === pr.initial);
  if (p.type === 'checkbox') return opts('ck', (o) => Array.isArray(pr.initial) && pr.initial.includes(o));
  if (p.type === 'file') return '<div class="pdrop">📎 ファイルをここにドラッグ、または <u>選ぶ</u></div>';
  // ルックアップで一緒に写される項目は、自分では書けないことが分かるように灰色にし、どこから入るかを薄い字で書く
  const copied = p.lookupRole === 'copy';
  const ph = copied && !p.placeholder ? `（${p.lookupKeyName}から自動で入る）` : p.placeholder || t.ph;
  const value = p.sample ? esc(p.sample) : `<span class="pph">${esc(ph)}</span>`;
  const unit = String(pr.unit || '').trim();
  const right = {
    number: unit && esc(unit), calc: unit && esc(unit), date: '📅', datetime: '🕒', dropdown: '▼', user: '選ぶ',
  }[p.type];
  const head = p.type === 'user' ? '<span class="picon">👤</span>' : '';
  const kind = p.type === 'text2' ? ' area' : p.type === 'calc' ? ' calc' : copied ? ' copied' : '';
  const get = p.lookupRole === 'key' ? '<span class="pget">🔍 取得</span>' : '';
  return `<div class="pbox${kind}">${head}<span class="pval">${value}</span>${right ? `<span class="pr">${right}</span>` : ''}${get}</div>`;
}

// 縮小画像。画面の上から機器の 1 画面分を、箱（boxW × boxH）に収まるように CSS の scale で縮める
function thumbHtml(design, screen, boxW, boxH) {
  const viewH = Math.min(screen.height, DEVICES[screen.device].height);
  const k = Math.min(boxW / screen.width, boxH / viewH);
  const w = Math.round(screen.width * k);
  const h = Math.round(viewH * k);
  return `<div class="thumb" style="width:${w}px;height:${h}px"><div class="thumb-scale" style="transform:scale(${k.toFixed(4)})">${screenHtml(design, screen)}</div></div>`;
}

// つながりの図の HTML。focusId（編集の画面の画面設計）があればその画面設計の図。saved は覚えた箱の位置
function mapHtml(state, focusId, saved) {
  const model = mapModel(state, focusId);
  if (!model.nodes.length) return '<p class="map-empty">まだ画面設計がありません。</p>';
  const auto = mapLayout(model);
  const pos = Object.fromEntries(model.nodes.map((n) => [n.key, { ...(saved[n.key] || auto[n.key]) }]));
  const roles = (k) => {
    if (!focusId || k === 'd:' + focusId) return '';
    const f = 'd:' + focusId;
    const r = model.edges.filter((e) => (e.from === k && e.to === f) || (e.from === f && e.to === k)).map((e) => (e.to === f
      ? { lookup: 'ルックアップ元', related: '関連レコード一覧の元', link: '取り込み元' }[e.kind]
      : { lookup: 'この画面設計から引いている', related: 'この画面設計のレコードを並べている', link: 'この画面設計から取り込んでいる' }[e.kind]));
    return [...new Set(r)].join('・');
  };
  const nodes = model.nodes.map((n) => {
    const p = pos[n.key];
    const cur = focusId && n.key === 'd:' + focusId;
    const meta = n.design
      ? `${cur ? '' : targetChip(n.design.target)}<span>項目 ${n.design.items.length} 個・画面 ${n.design.screens.length}</span>`
      : '<span>一覧にないデータベース</span>';
    const role = roles(n.key);
    p.h = MAP_H + (role ? (role.length > 16 ? 32 : 16) : 0); // 役目の行は 1 行に 16 字ほど
    return `<div class="mnode${n.design ? '' : ' ext'}${cur ? ' cur' : ''}" data-node="${esc(n.key)}" style="left:${p.x}px;top:${p.y}px;width:${MAP_W}px;height:${p.h}px"
      title="${n.design && !cur ? `ドラッグで動かせます。押すと「${esc(n.name)}」を開きます` : 'ドラッグで動かせます'}"><b>${esc(n.name)}${cur ? '（この画面設計）' : ''}</b><div class="mt">${meta}</div>${role ? `<div class="mt role">${esc(role)}</div>` : ''}</div>`;
  }).join('');
  const w = Math.max(860, ...Object.values(pos).map((p) => p.x + MAP_W + 40));
  const h = Math.max(420, ...Object.values(pos).map((p) => p.y + MAP_H + 60));
  return `<div class="map-inner" id="map-inner" style="width:${w}px;height:${h}px" data-focus="${esc(focusId || '')}">${mapEdgesSvg(model, pos, w, h)}${nodes}</div>`;
}
// 矢印の線。箱の左右（重なって並ぶときは上下）の縁から、相手の箱へ曲線で引き、真ん中に文字を書く。
// 同じ縁に何本も付くときは、縁に沿ってずらす（mapPorts）。同じ 2 つの箱の間の矢印（行きと帰りなど）は、文字を線の外側に書く
function mapEdgesSvg(model, pos, w, h) {
  const box = (k) => ({ ...pos[k], w: MAP_W, h: MAP_H });
  const pairOf = (e) => [e.from, e.to].sort().join('|');
  const pairs = new Map();
  model.edges.forEach((e) => pairs.set(pairOf(e), [...(pairs.get(pairOf(e)) || []), e]));
  const ports = mapPorts(model, pos);
  const paths = model.edges.map((e, i) => {
    const same = pairs.get(pairOf(e));
    const outside = same.length > 1 ? (same.indexOf(e) < (same.length - 1) / 2 ? -1 : 1) : 0;
    // ほかの箱は、役目の行（編集の画面の図）の分も含めた高さで避ける
    const others = model.nodes.filter((n) => n.key !== e.from && n.key !== e.to).map((n) => ({ ...pos[n.key], w: MAP_W, h: pos[n.key].h || MAP_H }));
    const g = mapEdgeGeometry(box(e.from), box(e.to), ports.get(e), others);
    const link = e.kind === 'link';
    const col = link ? '#16a34a' : '#1d3f6e';
    const label = link ? [`取り込み: ${e.labels.join('・')}`]
      : e.kind === 'related' ? ['関連レコード一覧', e.labels.join('・')]
        : e.labels.join('\n').split('\n').slice(0, 3);
    const lh = 16 + (label.length - 1) * 15;
    const [mx, my] = [g.mx, g.my + (g.detour ? 0 : outside ? outside * (8 + lh / 2) : i % 2 ? 14 : -14)];
    const tw = Math.min(MAP_COL - MAP_W - 8, Math.max(...label.map((s) => s.length)) * 12 + 12);
    const text = label.map((s, j) => `<text x="${(mx - tw / 2 + 6).toFixed(1)}" y="${(my + 4 + j * 15 - (label.length - 1) * 7.5).toFixed(1)}" font-size="${j ? 11 : 12}" font-weight="${j || link ? 400 : 700}" fill="${j ? '#475569' : col}">${esc(s)}</text>`).join('');
    return `<path d="${g.d}" fill="none" stroke="${col}" stroke-width="${link ? 2 : 2.5}"${link ? ' stroke-dasharray="6 4"' : ''} marker-end="url(#map-arrow-${link ? 'g' : 'n'})"/>
      <rect x="${(mx - tw / 2).toFixed(1)}" y="${(my - 9 - (label.length - 1) * 7.5).toFixed(1)}" width="${tw}" height="${16 + (label.length - 1) * 15}" rx="4" fill="#fff" opacity=".92"/>${text}`;
  }).join('');
  return `<svg width="${w}" height="${h}" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" aria-hidden="true"><defs>
    <marker id="map-arrow-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d3f6e"/></marker>
    <marker id="map-arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    </defs>${paths}</svg>`;
}
// 箱のどちらの縁（l・r・t・b）から線を出すか
function mapSides(a, b) {
  if (b.x >= a.x + MAP_W) return ['r', 'l'];
  if (b.x + MAP_W <= a.x) return ['l', 'r'];
  return b.y >= a.y ? ['b', 't'] : ['t', 'b'];
}
// 線の端を縁の真ん中からずらす量 { from, to }。同じ縁に何本も付くときは、相手の箱の位置の順（左右の縁なら上から、上下の縁なら左から）に
// 16 ずつ（縁に収まらないときは詰めて）ずらす。相手が同じ線（行きと帰りなど）は、両端で同じ順になるので交わらない
function mapPorts(model, pos) {
  const sides = new Map();
  model.edges.forEach((e) => {
    const [sa, sb] = mapSides(pos[e.from], pos[e.to]);
    [[e.from, sa, 'from', pos[e.to]], [e.to, sb, 'to', pos[e.from]]].forEach(([k, side, end, other]) => {
      const key = `${k}|${side}`;
      sides.set(key, [...(sides.get(key) || []), { e, end, other, lr: side === 'l' || side === 'r' }]);
    });
  });
  const out = new Map(model.edges.map((e) => [e, { from: 0, to: 0 }]));
  sides.forEach((list) => {
    const lr = list[0].lr;
    list.sort((p, q) => (lr ? p.other.y - q.other.y : p.other.x - q.other.x));
    const step = list.length > 1 ? Math.min(16, ((lr ? MAP_H : MAP_W) - 16) / (list.length - 1)) : 0;
    list.forEach((p, j) => { out.get(p.e)[p.end] = (j - (list.length - 1) / 2) * step; });
  });
  return out;
}
// 1 本の矢印の形。d は線の道のり、(mx, my) は文字を書く真ん中。detour は、ほかの箱を避けて隙間を通したか
function mapEdgeGeometry(a, b, port, others) {
  const f = (n) => n.toFixed(1);
  const [sa] = mapSides(a, b);
  const horiz = sa === 'l' || sa === 'r';
  let [x1, y1, x2, y2] = [0, 0, 0, 0];
  if (sa === 'r') [x1, y1, x2, y2] = [a.x + a.w, a.y + a.h / 2 + port.from, b.x, b.y + b.h / 2 + port.to];
  else if (sa === 'l') [x1, y1, x2, y2] = [a.x, a.y + a.h / 2 + port.from, b.x + b.w, b.y + b.h / 2 + port.to];
  else if (sa === 'b') [x1, y1, x2, y2] = [a.x + a.w / 2 + port.from, a.y + a.h, b.x + b.w / 2 + port.to, b.y];
  else [x1, y1, x2, y2] = [a.x + a.w / 2 + port.from, a.y, b.x + b.w / 2 + port.to, b.y + b.h];
  const off = Math.max(40, Math.abs(horiz ? x2 - x1 : y2 - y1) / 2);
  const s = Math.sign(horiz ? x2 - x1 : y2 - y1);
  const c1 = horiz ? [x1 + s * off, y1] : [x1, y1 + s * off];
  const c2 = horiz ? [x2 - s * off, y2] : [x2, y2 - s * off];
  const way = horiz ? mapDetour([x1, y1], c1, c2, [x2, y2], others) : null;
  if (!way) return { detour: false, mx: (x1 + x2) / 2, my: (y1 + y2) / 2, d: `M${f(x1)},${f(y1)} C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(x2)},${f(y2)}` };
  const { xa, xb, yd } = way;
  const [ma, mb] = [(x1 + xa) / 2, (xb + x2) / 2];
  return { detour: true, mx: (xa + xb) / 2, my: yd,
    d: `M${f(x1)},${f(y1)} C${f(ma)},${f(y1)} ${f(ma)},${f(yd)} ${f(xa)},${f(yd)} L${f(xb)},${f(yd)} C${f(mb)},${f(yd)} ${f(mb)},${f(y2)} ${f(x2)},${f(y2)}` };
}
// 曲線（p0 → p3。p1・p2 は曲げる点）がほかの箱に重なるときの通り道。重なる箱の手前で、その箱たちの上か下（線の高さに近いほう）の
// 隙間へ曲がり、横にまっすぐ通って、箱を過ぎてから相手の箱へ曲がる。重ならないとき・隙間がないときは null（そのまま引く）
function mapDetour(p0, p1, p2, p3, others) {
  const at = (t) => [0, 1].map((k) => (1 - t) ** 3 * p0[k] + 3 * (1 - t) ** 2 * t * p1[k] + 3 * (1 - t) * t * t * p2[k] + t ** 3 * p3[k]);
  const hits = new Set();
  for (let t = 0.02; t < 1; t += 0.02) {
    const [x, y] = at(t);
    others.forEach((b) => { if (x > b.x - 8 && x < b.x + b.w + 8 && y > b.y - 8 && y < b.y + b.h + 8) hits.add(b); });
  }
  if (!hits.size) return null;
  const list = [...hits];
  const s = Math.sign(p3[0] - p0[0]);
  const [left, right] = [Math.min(...list.map((b) => b.x)) - 28, Math.max(...list.map((b) => b.x + b.w)) + 28];
  const [xa, xb] = s > 0 ? [left, right] : [right, left];
  if ((xa - p0[0]) * s < 16 || (p3[0] - xb) * s < 16) return null;
  const free = (y) => y >= 8 && !others.some((b) => y > b.y - 8 && y < b.y + b.h + 8 && b.x < Math.max(xa, xb) && b.x + b.w > Math.min(xa, xb));
  const mid = (p0[1] + p3[1]) / 2;
  const ys = [Math.min(...list.map((b) => b.y)) - 24, Math.max(...list.map((b) => b.y + b.h)) + 24];
  const yd = ys.sort((m, n) => Math.abs(m - mid) - Math.abs(n - mid)).find(free);
  return yd == null ? null : { xa, xb, yd };
}

function openRenameDialog(d) {

function openDeleteForeverDialog(d) {
  const importers = designsImporting(store.state, d.id);
  const note = importers.length
    ? `<p class="warn">このモックの項目を、ほかの ${importers.length} つの画面設計（${esc(importers.map((x) => x.name).join('・'))}）が取り込んでいます。完全に削除すると、取り込んだ側の項目は、今の中身で固定されます。</p>`
    : '';
  return showDialog({
    title: '完全に削除',
    okLabel: '完全に削除する',
    okClass: 'danger',
    body: `<p>「${esc(d.name)}」を完全に削除します。</p><p class="warn">完全に削除すると、元に戻せません（「元に戻す」でも戻りません）。</p>${note}`,
  });
}

function openTrashImportedDialog(d, importers) {
  return showDialog({
    title: `「${d.name}」をごみ箱に移しますか？`,
    okLabel: 'ごみ箱へ移す',
    okClass: 'danger',
    body: `<p>ごみ箱からいつでも戻せます。</p>
      <p class="warn">このモックの項目を、ほかの ${importers.length} つの画面設計（${esc(importers.map((x) => x.name).join('・'))}）が取り込んでいます。
      ごみ箱の中にある間は、つながったままです。完全に削除すると、取り込んだ側の項目は、そのときの中身で固定されます。</p>`,
  });
}

async function onHomeAction(action, id) {
  const d = id ? findDesign(store.state, id) : null;
  switch (action) {
    case 'new': {
      const r = await openNewDesignDialog();
      if (r) openDesign(actions.createDesign(r.name, r.target));
      return;
    }
    case 'open': openDesign(id); return;
    case 'card-menu': ui.menuFor = ui.menuFor === id ? null : id; refreshCards(); return;
    case 'home-map': case 'home-cards': ui.homeMap = action === 'home-map'; renderHome(); return;
    case 'map-reset': actions.resetMapPos(null); return;
    case 'toggle-trash': ui.trashOpen = !ui.trashOpen; $('#home-trash').innerHTML = renderTrash(); return;
  }
  if (!d) return;
  if (ui.menuFor) {
    ui.menuFor = null;
    refreshCards();
  }
  await onDesignAction(action, d);
}

async function onDesignAction(action, d) {
  switch (action) {
    case 'rename': {
      const r = await openRenameDialog(d);
      if (r && r.name !== d.name) actions.renameDesign(d.id, r.name);
      return;
    }
    case 'duplicate':
      actions.duplicateDesign(d.id);
      toast(`「${d.name} のコピー」を作りました。`);
      return;
    case 'trash': {
      const importers = designsImporting(store.state, d.id);
      if (importers.length && !(await openTrashImportedDialog(d, importers))) return;
      actions.trashDesign(d.id);
      toast(`「${d.name}」をごみ箱へ移しました。戻すときは、下の「ごみ箱」か「元に戻す」（Ctrl+Z）を使います。`);
      return;
    }
    case 'restore':
      actions.restoreDesign(d.id);
      toast(`「${d.name}」を一覧に戻しました。`);
      return;
    case 'delete-forever':
      if (await openDeleteForeverDialog(d)) {
        actions.deleteDesignForever(d.id);
        toast(`「${d.name}」を完全に削除しました。`);
      }
  }
}

// keepSide: 右の欄の文字を書き換えたときは、右の欄を描き直さない（次に押した入力欄が作り直されて、文字が打てなくなるため）
function updateEditor({ keepSide = false } = {}) {
  const d = currentDesign();
  if (!d || d.trashedAt) { goHome(); return; }
  if (!d.screens.some((s) => s.id === ui.screenId)) ui.screenId = d.screens[0].id;
  // 元に戻すなどで部品・吹き出しが消えたときは、選ぶのをやめる
  const sc0 = currentScreen();
  ui.sel = ui.sel.filter((x) => (x.k === 'p' ? findPart(sc0, x.id) : findCallout(sc0, x.id)));
  if (!findItem(d, ui.itemId)) ui.itemId = null;
  $('#ed-title').textContent = `${d.name}（${targetLabel(d.target)}）`;
  updateToolbarState();
  $('#screen-list').innerHTML = screenListHtml(d);
  const onScreen = ui.panel === 'screen';
  $('#canvas-wrap').hidden = !onScreen;
  $('#zoom-badge').hidden = !onScreen;
  $('#db-view').hidden = onScreen;
  $('#side-box').hidden = !onScreen;
  $('#side-panel').hidden = ui.panel === 'map';
  if (onScreen) renderStage();
  else if (ui.panel === 'map') renderMapView(d);
  else renderItemsView(d);
  renderPalette(d);
  if (!keepSide) renderSettings(d);
}

function updateToolbarState() {
  const s = currentScreen();
  const onScreen = ui.panel === 'screen';
  $('#tb-undo').disabled = !store.canUndo();
  $('#tb-redo').disabled = !store.canRedo();
  ['#tb-copy', '#tb-dup', '#tb-del'].forEach((sel) => { $(sel).disabled = !onScreen || !ui.sel.length; });
  // 揃えるのは 2 つ以上、等間隔は 3 つ以上選んだとき
  document.querySelectorAll('#toolbar [data-align-cmd]').forEach((b) => {
    b.disabled = !onScreen || ui.sel.length < (b.dataset.alignCmd.startsWith('distribute') ? 3 : 2);
  });
  $('#tb-paste').disabled = !onScreen || !ui.clipboard;
  $('#tb-renumber').disabled = !onScreen || !s || !s.parts.some((p) => p.no != null);
  $('#tb-mode-select').classList.toggle('on', ui.mode === 'select');
  $('#tb-mode-hand').classList.toggle('on', ui.mode === 'hand');
  document.querySelectorAll('#toolbar [data-screen-only]').forEach((b) => { b.disabled = !onScreen; });
  $('#canvas-wrap').classList.toggle('hand', ui.mode === 'hand');
}
