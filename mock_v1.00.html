// 項目の一覧表の並べ替え（行の左のつまみのドラッグ）。放した行の上半分なら前、下半分なら後ろに入れる
function startItemSort(ev, itemId) {
  ev.preventDefault();
  flushSideField();
  drag = { kind: 'item-sort', id: itemId, to: null };
  document.body.classList.add('sorting');
}

function dragItemSort(ev) {
  document.querySelectorAll('#db-view tr.drop-before, #db-view tr.drop-after').forEach((r) => r.classList.remove('drop-before', 'drop-after'));
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const row = hit && hit.closest ? hit.closest('#db-view tr[data-id]') : null;
  if (!row) { drag.to = null; return; }
  const ids = currentDesign().items.map((it) => it.id);
  const r = row.getBoundingClientRect();
  const after = ev.clientY > r.top + r.height / 2;
  drag.to = ids.indexOf(row.dataset.id) + (after ? 1 : 0);
  row.classList.add(after ? 'drop-after' : 'drop-before');
}

// つながりの図の箱のドラッグ。動かさずに放したときは、その画面設計を開く（編集中の画面設計の箱と、一覧にないデータベースは開かない）
function startMapDrag(ev, el) {
  ev.preventDefault();
  flushSideField();
  const inner = el.closest('.map-inner');
  drag = { kind: 'map', el, inner, key: el.dataset.node, sx: ev.clientX, sy: ev.clientY, x0: parseFloat(el.style.left) || 0, y0: parseFloat(el.style.top) || 0, moved: false, focus: inner.dataset.focus || null };
}
function dragMap(ev) {
  const dx = ev.clientX - drag.sx;
  const dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  drag.moved = true;
  document.body.classList.add('map-dragging');
  drag.x = Math.max(0, snapGrid(drag.x0 + dx));
  drag.y = Math.max(0, snapGrid(drag.y0 + dy));
  Object.assign(drag.el.style, { left: drag.x + 'px', top: drag.y + 'px' });
  // 図の枠の外へ動かしたときは、枠を広げる（放すまで箱が隠れないように）
  const st = drag.inner.style;
  st.width = Math.max(parseFloat(st.width), drag.x + MAP_W + 60) + 'px';
  st.height = Math.max(parseFloat(st.height), drag.y + MAP_H + 76) + 'px';
  // 線も描き直す（ほかの箱は今の位置のまま）
  const model = mapModel(store.state, drag.focus);
  const pos = {};
  drag.inner.querySelectorAll('.mnode').forEach((n) => { pos[n.dataset.node] = { x: parseFloat(n.style.left) || 0, y: parseFloat(n.style.top) || 0, h: parseFloat(n.style.height) || MAP_H }; });
  const svg = drag.inner.querySelector('svg');
  if (svg) svg.outerHTML = mapEdgesSvg(model, pos, parseFloat(drag.inner.style.width), parseFloat(drag.inner.style.height));
}
function endMapDrag(done) {
  document.body.classList.remove('map-dragging');
  if (done.moved) { actions.setMapPos(done.focus, done.key, { x: done.x, y: done.y }); return; }
  if (!done.key.startsWith('d:') || done.key === 'd:' + done.focus) return;
  openDesign(done.key.slice(2));
}

function onDragMove(ev) {
  if (!drag) return;
  if (drag.kind === 'map') { dragMap(ev); return; }
  if (drag.kind === 'add') { dragAdditive(ev); return; }
  if (drag.kind === 'group') { dragGroup(ev); return; }
  if (drag.kind === 'band') { dragBand(ev); return; }
  if (drag.kind === 'item-sort') { dragItemSort(ev); return; }
  if (drag.kind === 'co-move' || drag.kind === 'co-size') { dragCallout(ev); return; }
  if (drag.kind === 'co-link') { dragCalloutLink(ev); return; }
  if (drag.kind === 'move' || drag.kind === 'size') { dragPart(ev); return; }
  if (drag.kind === 'place') { dragPlace(ev); return; }
  const { wrap } = drag;
  if (drag.kind === 'pan') {
    wrap.scrollLeft = drag.sl - (ev.clientX - drag.sx);
    wrap.scrollTop = drag.st - (ev.clientY - drag.sy);
    return;
  }
  // 窓の下の端の近くまで来たら、下へ送る（画面を長く伸ばすため）
  const r = wrap.getBoundingClientRect();
  if (r.height && ev.clientY > r.bottom - 32) wrap.scrollTop += 24;
  const dy = ev.clientY - drag.sy + (wrap.scrollTop - drag.st);
  const h = Math.max(snapHeight(drag.h0 + dy / ui.zoom, drag.device), drag.minH);
  if (h === (ui.previewHeight == null ? drag.h0 : ui.previewHeight)) return;
  ui.previewHeight = h;
  renderStage();
}

function onDragEnd(ev) {
  if (!drag) return;
  const done = drag;
  drag = null;
  document.body.classList.remove('resizing', 'moving', 'sorting', 'linking', 'copying');
  if (done.kind === 'map') { endMapDrag(done); return; }
  if (done.kind === 'add') {
    // Ctrl を押して押しただけ（動かしていない）なら、選ぶものに足す・外す
    const { k, id } = done.hit;
    setSelection(isSelected(k, id) ? ui.sel.filter((x) => !(x.k === k && x.id === id)) : [...ui.sel, done.hit]);
    return;
  }
  if (done.kind === 'group') { endGroupDrag(done); return; }
  if (done.kind === 'band') { endBand(done); return; }
  if (done.kind === 'co-move' || done.kind === 'co-size') {
    const r = done.rect;
    if (!r || !actions.moveCallout(ui.designId, currentScreen().id, done.id, r)) renderStage();
    return;
  }
  if (done.kind === 'co-link') {
    const c = findCallout(currentScreen(), done.id);
    if (done.target === undefined || !c || c.target === done.target || !actions.updateCallout(ui.designId, currentScreen().id, done.id, { target: done.target })) renderStage();
    return;
  }
  if (done.kind === 'item-sort') {
    if (done.to == null || !actions.moveItem(ui.designId, done.id, done.to)) renderItemsView(currentDesign());
    return;
  }
  if (done.kind === 'place') { if (done.moved) dropPlace(done, ev); return; }
  if (done.kind === 'move' || done.kind === 'size') {
    const r = done.rect;
    const r0 = done.r0;
    if (r && (r.x !== r0.x || r.y !== r0.y || r.w !== r0.w || r.h !== r0.h)) actions.movePart(ui.designId, currentScreen().id, done.id, r);
    return;
  }
  done.wrap.classList.remove('grabbing');
  if (done.kind !== 'resize') return;
  const h = ui.previewHeight;
  ui.previewHeight = null;
  if (h != null && h !== done.h0) actions.updateScreen(ui.designId, currentScreen().id, { height: h });
  else renderStage();
}

// ── コピー・貼り付け・複製・削除・矢印のキーで動かす（選んだものをまとめて）──
// コピーしたものは { parts: [{ part（部品の写し）, item（指している項目の写し。ほかの画面設計へ貼り付けるときに使う）}], callouts: [吹き出しの写し] }
function selectionEntries() {
  const s = currentScreen();
  const d = currentDesign();
  const parts = ui.sel.filter((x) => x.k === 'p').map((x) => findPart(s, x.id)).filter(Boolean)
    .map((p) => { const item = findItem(d, p.itemId); return { part: clone(p), item: item ? clone(item) : null }; });
  const callouts = ui.sel.filter((x) => x.k === 'c').map((x) => findCallout(s, x.id)).filter(Boolean).map(clone);
  return { parts, callouts };
}
function copyPart() {
  const entries = selectionEntries();
  const n = entries.parts.length + entries.callouts.length;
  if (!n) return;
  ui.clipboard = entries;
  updateToolbarState();
  toast(`${n === 1 ? (entries.parts.length ? '部品' : '吹き出し') : `${n} 個`}をコピーしました。Ctrl+V で貼り付けます。`);
}

// 続けて貼り付けると、前に貼り付けた所から右下へずらして置く
function pastePart() {
  if (!ui.clipboard) return;
  const out = actions.insertCopies(ui.designId, currentScreen().id, ui.clipboard, PART_GAP, PART_GAP);
  if (!out.length) return;
  const shift = (o) => ({ ...o, x: o.x + PART_GAP, y: o.y + PART_GAP });
  ui.clipboard = { parts: ui.clipboard.parts.map((e) => ({ ...e, part: shift(e.part) })), callouts: ui.clipboard.callouts.map(shift) };
  setSelection(out);
}

function duplicatePart() {
  const out = actions.insertCopies(ui.designId, currentScreen().id, selectionEntries(), PART_GAP, PART_GAP);
  if (out.length) setSelection(out);
}

function deletePart() {
  if (!ui.sel.length) return;
  const sel = ui.sel;
  ui.sel = [];
  actions.deleteMany(ui.designId, currentScreen().id, sel);
}

function nudgePart(dx, dy) {
  if (ui.sel.length) actions.moveMany(ui.designId, currentScreen().id, ui.sel, dx * GRID, dy * GRID);
}

// ── 8. 命令（runCommand）──────────────────────────────────────────────────────
// ボタン・キー・アプリのメニュー（Electron の menu:command）からの命令は、すべてここで受ける
function runCommand(cmd) {
  if (isDialogOpen()) return false;
  flushSideField();
  switch (cmd) {
    case 'undo': store.undo(); return true;
    case 'redo': store.redo(); return true;
    case 'goHome':
      if (ui.view === 'editor') goHome();
      return true;
  }
  if (ui.view !== 'editor') return false;
  switch (cmd) {
    case 'openItems': openItemsPanel(); return true;
    case 'openMap': openMapPanel(); return true;
    case 'addItemMenu':
      if (ui.panel !== 'items') Object.assign(ui, { panel: 'items', partId: null });
      ui.addItemMenu = !ui.addItemMenu;
      updateEditor();
      return true;
    case 'deleteItem': if (ui.panel === 'items' && ui.itemId) deleteItemWithConfirm(ui.itemId).catch(reportPageError); return true;
    case 'importItems': openImportDialog().catch(reportPageError); return true;
    case 'deselectItem': if (ui.panel === 'items') selectItem(null); return true;
  }
  if (ui.panel !== 'screen') return false;
  switch (cmd) {
    case 'zoomIn': case 'zoomOut': case 'zoomReset': zoomByCommand(cmd); return true;
    case 'modeSelect': setMode('select'); return true;
    case 'modeHand': setMode('hand'); return true;
    case 'copyPart': copyPart(); return true;
    case 'pastePart': pastePart(); return true;
    case 'duplicatePart': duplicatePart(); return true;
    case 'deletePart': deletePart(); return true;
    case 'deselectPart': selectPart(null); return true;
    case 'selectAll': selectAll(); return true;
    case 'numberOn': case 'numberOff': actions.numberMany(ui.designId, currentScreen().id, ui.sel, cmd === 'numberOn'); return true;
    case 'renumber': actions.renumberParts(ui.designId, currentScreen().id); return true;
  }
  if (own(ALIGN_COMMANDS, cmd)) { actions.alignMany(ui.designId, currentScreen().id, ui.sel, ALIGN_COMMANDS[cmd]); return true; }
  const nudge = { moveLeft: [-1, 0], moveRight: [1, 0], moveUp: [0, -1], moveDown: [0, 1] }[cmd];
  if (nudge) { nudgePart(...nudge); return true; }
  return false;
}

// 揃える命令（メニューバー・右の欄・アプリのメニュー）と、alignedRects の how
const ALIGN_COMMANDS = {
  alignLeft: 'left', alignHCenter: 'hcenter', alignRight: 'right', alignTop: 'top', alignVCenter: 'vcenter', alignBottom: 'bottom',
  distributeH: 'hdist', distributeV: 'vdist', sameWidth: 'width', sameHeight: 'height',
};

  ['alignVCenter', 'align-vcenter', '上下の\n中央', '<line x1="2" y1="10" x2="18" y2="10" stroke="#334155" stroke-width="2"/><rect x="4" y="4" width="4" height="12" fill="#64748b"/><rect x="11" y="6" width="4" height="8" fill="#64748b"/>'],
  ['alignBottom', 'align-bottom', '下', '<line x1="2" y1="17" x2="18" y2="17" stroke="#334155" stroke-width="2"/><rect x="4" y="4" width="4" height="11" fill="#64748b"/><rect x="11" y="8" width="4" height="7" fill="#64748b"/>'],
  ['distributeH', 'distribute-h', '横に\n等間隔', '<rect x="1" y="6" width="4" height="8" fill="#64748b"/><rect x="8" y="6" width="4" height="8" fill="#64748b"/><rect x="15" y="6" width="4" height="8" fill="#64748b"/>'],
  ['distributeV', 'distribute-v', '縦に\n等間隔', '<rect x="6" y="1" width="8" height="4" fill="#64748b"/><rect x="6" y="8" width="8" height="4" fill="#64748b"/><rect x="6" y="15" width="8" height="4" fill="#64748b"/>'],
];
const SIZE_BUTTONS = [
  ['sameWidth', 'same-width', '同じ幅にする', '<path d="M2 10h16M2 10l3-3M2 10l3 3M18 10l-3-3M18 10l-3 3" stroke="#334155" stroke-width="1.6" fill="none"/>'],
  ['sameHeight', 'same-height', '同じ高さにする', '<path d="M10 2v16M10 2l-3 3M10 2l3 3M10 18l-3-3M10 18l3-3" stroke="#334155" stroke-width="1.6" fill="none"/>'],
];
const alignSvg = (inner) => `<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">${inner}</svg>`;

const ACTION_COMMANDS = {
  undo: 'undo', redo: 'redo', home: 'goHome', 'zoom-in': 'zoomIn', 'zoom-out': 'zoomOut',
  'zoom-reset': 'zoomReset', 'mode-select': 'modeSelect', 'mode-hand': 'modeHand',
  'copy-part': 'copyPart', 'paste-part': 'pastePart', 'duplicate-part': 'duplicatePart', 'delete-part': 'deletePart', renumber: 'renumber',
  'open-items': 'openItems', 'open-map': 'openMap', 'add-item-menu': 'addItemMenu', 'import-items': 'importItems', 'delete-callout': 'deletePart',
  'select-all': 'selectAll', 'number-on': 'numberOn', 'number-off': 'numberOff', 'delete-many': 'deletePart',
  ...Object.fromEntries([...ALIGN_BUTTONS, ...SIZE_BUTTONS].map(([cmd, action]) => [action, cmd])),
};

// 編集の画面だけで使う、ボタン以外の押したときの動き
function onEditorClick(action, btn) {
  switch (action) {
    case 'open-items': openItemsPanel(); return true;
    case 'open-map': openMapPanel(); return true;
    case 'map-reset': actions.resetMapPos(ui.designId); return true;
    case 'select-screen':
      flushSideField();
      if (btn.dataset.id === ui.screenId && ui.panel === 'screen') return true; // mousedown で切り替えた後の click
      Object.assign(ui, { screenId: btn.dataset.id, sel: [], panel: 'screen', addItemMenu: false });
      updateEditor();
      return true;
    case 'add-part': addPartAtCenter(btn.dataset.type); return true;
    case 'add-item-part': {
      const item = findItem(currentDesign(), btn.dataset.itemId);
      if (item) addPartAtCenter(item.type, item.id);
      return true;
    }
    case 'select-part': selectPart(btn.dataset.id); return true;
    case 'select-item': selectItem(btn.dataset.id); return true;
    case 'add-item': addItemOfType(btn.dataset.type); return true;
    case 'delete-item': deleteItemWithConfirm(btn.dataset.id).catch(reportPageError); return true;
    case 'restore-item': actions.restoreItem(ui.designId, btn.dataset.id); return true;
    case 'unlink-item': actions.unlinkItem(ui.designId, btn.dataset.id); return true;
    case 'lk-add': editLookupCopies((c) => c.push({ from: emptyRef(), to: emptyRef() })); return true;
    case 'lk-del': editLookupCopies((c) => c.splice(Number(btn.dataset.i), 1)); return true;
    case 'open-lookup-key': openLookupKey(btn.dataset.id); return true;
    case 'tb-col': case 'tb-col-up': case 'tb-col-down': case 'tb-col-del': case 'tb-col-add': onTableColumnAction(action, btn.dataset.id); return true;
    case 'fl-up': case 'fl-down': case 'fl-del': onFilterAction(action, Number(btn.dataset.i)); return true;
    case 'open-link-source': openLinkSource(btn.dataset.id); return true;
    case 'toggle-palette':
      ui.paletteClosed[btn.dataset.id] = !ui.paletteClosed[btn.dataset.id];
      renderPalette(currentDesign());
      return true;
  }
  return false;
}

function onAppClick(e) {
  if (isDialogOpen()) return;
  if (ui.menuFor && !e.target.closest('.card-menu, .card-more')) {
    ui.menuFor = null;
    refreshCards();
  }
  if (ui.addItemMenu && !e.target.closest('.pop-menu, [data-action="add-item-menu"]')) {
    ui.addItemMenu = false;
    renderItemsView(currentDesign());
  }
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const { action, id } = btn.dataset;
  if (ACTION_COMMANDS[action]) { runCommand(ACTION_COMMANDS[action]); return; }
  if (ui.view === 'editor' && onEditorClick(action, btn)) return;
  onHomeAction(action, id).catch(reportPageError);
}

function reportPageError(e) {
  console.error(e);
  toast('うまくいきませんでした（' + ((e && e.message) || e) + '）。');
}

// Ctrl+Z・Ctrl+Y・Ctrl+Shift+Z と、拡大縮小のキー（CheckListMaker v1.0.8 と同じ考え方）。
// 入力欄の中の Ctrl+Z・Ctrl+Y は、文字の取り消しとしてブラウザに任せる
function keyCommand(e) {
  const k = String(e.key || '').toLowerCase();
  if (k === 'z') return e.shiftKey ? 'redo' : 'undo';
  if (k === 'y') return 'redo';
  if (k === '+' || k === '=' || k === ';') return 'zoomIn';
  if (k === '-') return 'zoomOut';
  if (k === '0') return 'zoomReset';
  return null;
}

// 編集の画面で、入力欄の外で押したキー（部品を選んでいるときの Delete・矢印・Esc と、Ctrl+C・Ctrl+V・Ctrl+D）
function editorKeyCommand(e) {
  const k = String(e.key || '');
  if (ui.panel === 'items') {
    if (e.ctrlKey || e.metaKey || !ui.itemId) return null;
    if (k === 'Delete' || k === 'Backspace') return 'deleteItem';
    return k === 'Escape' ? 'deselectItem' : null;
  }
  if (e.ctrlKey || e.metaKey) {
    const low = k.toLowerCase();
    if (low === 'a') return 'selectAll';
    if (low === 'c' && ui.sel.length) return 'copyPart';
    if (low === 'v' && ui.clipboard) return 'pastePart';
    if (low === 'd' && ui.sel.length) return 'duplicatePart';
    return null;
  }
  if (!ui.sel.length) return null;
  if (k === 'Delete' || k === 'Backspace') return 'deletePart';
  if (k === 'Escape') return 'deselectPart';
  return { ArrowLeft: 'moveLeft', ArrowRight: 'moveRight', ArrowUp: 'moveUp', ArrowDown: 'moveDown' }[k] || null;
}

function onKeyDown(e) {
  if (isDialogOpen()) return;
  if (e.key === 'Escape' && ui.menuFor) { ui.menuFor = null; refreshCards(); return; }
  const inField = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
  if (ui.view === 'editor' && !inField && !e.altKey && !e.isComposing) {
    const partCmd = editorKeyCommand(e);
    if (partCmd) { e.preventDefault(); runCommand(partCmd); return; }
  }
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const cmd = keyCommand(e);
  if (!cmd) return;
  if ((cmd === 'undo' || cmd === 'redo') && inField) return;
  if (cmd.startsWith('zoom') && ui.view !== 'editor') return;
  e.preventDefault();
  runCommand(cmd);
}

function onStoreChange() {
  if (ui.view === 'home') renderHome();
  else updateEditor({ keepSide: keepSideOnNotify });
}

// ── 9. 起動 ───────────────────────────────────────────────────────────────────
function bindGlobalEvents() {
  const app = appEl();
  app.addEventListener('click', onAppClick);
  app.addEventListener('input', (e) => {
    // 選択肢を打っている間も、初期値の欄を今の選択肢に合わせておく（離れたときに初期値の欄を作り直すと、押した四角が消えるため）
    if (e.target.dataset && e.target.dataset.pf === 'props.options') { refreshChoiceInitial(parseOptions(e.target.value)); return; }
    if (e.target.id !== 'home-search') return;
    ui.query = e.target.value;
    refreshCards();
  });
  app.addEventListener('change', (e) => {
    if (e.target.closest('#side-panel') && !e.target.closest('.target-picker')) onSidePanelChange(e);
  });
  app.addEventListener('mousedown', (e) => {
    const node = e.button === 0 ? e.target.closest('.mnode') : null;
    if (node) { startMapDrag(e, node); return; }
    if (ui.view !== 'editor' || e.button !== 0) return;
    // 部品の箱のボタンからのドラッグ（押しただけなら click で置く）
    const btn = e.target.closest('.pal-btn');
    if (btn) { startPlace(e, btn.dataset.type); return; }
    const itemBtn = e.target.closest('button.pal-item');
    if (itemBtn) {
      const item = findItem(currentDesign(), itemBtn.dataset.itemId);
      if (item) startPlace(e, item.type, item.id);
      return;
    }
    const grip = e.target.closest('#db-view [data-drag="item-sort"]');
    if (grip) { startItemSort(e, grip.closest('tr').dataset.id); return; }
    // 一覧表の行と画面の一覧は、押した時点で切り替える。右の欄で打ちかけの文字があると、離れたときの保存で
    // 一覧表と画面の一覧が描き直され、押した行・ボタンが click の前に消えて、1 回目の押しが効かないため
    if (e.target.closest('.del-x')) return;
    const sel = e.target.closest('[data-action="select-part"], [data-action="select-screen"], [data-action="select-item"], [data-action="open-items"], [data-action="open-map"]');
    if (sel) onEditorClick(sel.dataset.action, sel);
  });
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  window.addEventListener('resize', () => { if (ui.view === 'editor') syncZoomSpacer(); });
  window.addEventListener('blur', flushSideField);
  window.addEventListener('beforeunload', flushSideField);
}

async function boot() {
  const created = await createAppStore();
  store = created.store;
  if (created.blockReason) showBanner(created.blockReason + ' 今のデータを消さないように、保存を止めています。');
  else if (created.notice) showBanner(created.notice);
  store.subscribe(onStoreChange);
  bindGlobalEvents();
  if (window.menuAPI) window.menuAPI.onCommand(runCommand);
  renderHome();
  exposeForTest();
}

// ── 10. テスト用の窓口 ────────────────────────────────────────────────────────
// テストの土台（test/harness.js）が起動の前に window.__test__ を置いたときだけ埋める
function exposeForTest() {
  if (!window.__test__) return;
  Object.assign(window.__test__, {
    store, ui, actions, runCommand, openDesign, goHome, migrate, normalizeState, snapHeight, changeDevice,
    visibleDesigns, trashedDesigns, resolveTargetName, DEVICES, SCHEMA_VERSION, STORAGE_KEY, APP_VERSION,
    PART_TYPES, PALETTE_GROUPS, fitRect, resizedRect, describePart, tableRows, renumberedParts, minScreenHeight, selectPart, currentScreen,
    currentDesign, currentPart, resolvePart, findItem, describeItem, mapModel, mapLayout,
    ready: true,
  });
}

// 起動の途中で例外が出たときは、真っ白のまま止まらないように、上の赤い帯で知らせる
boot().catch((e) => {
  console.error(e);
  showBanner('アプリを起動できませんでした（' + ((e && e.message) || e) + '）。');
});
</script>
