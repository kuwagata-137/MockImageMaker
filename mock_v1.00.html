// 画面ごとの印（designDiff の screens から）。AI が足した画面は、全部の部品と吹き出しを「足した」にする
function aiScreenMarks(diff, s) {
  const info = diff && diff.screens[s.id];
  if (!info) return { parts: {}, callouts: {} };
  if (!info.isNew) return { parts: info.parts, callouts: info.callouts };
  return { parts: Object.fromEntries(s.parts.map((p) => [p.id, 'new'])), callouts: Object.fromEntries(s.callouts.map((c) => [c.id, 'new'])) };
}
const aiHasMarks = (m) => Object.keys(m.parts).length + Object.keys(m.callouts).length > 0;
// 光らせ始めてからの時間。描き直しても光り方が続くように、CSS のアニメーションを経った分だけ進めて始める
const aiGlowElapsed = (at) => (at == null ? AI_GLOW_MS : Math.max(0, Date.now() - at));
const aiGlowClass = (at) => (aiGlowElapsed(at) < AI_GLOW_MS ? ' ai-glow' : '');
const aiGlowStyle = (at) => (aiGlowElapsed(at) < AI_GLOW_MS ? ` style="animation-delay:-${aiGlowElapsed(at)}ms"` : '');

// 開いている画面の、AI が足した・直した部品と吹き出しに札を付け、光らせる（renderStage の最後に呼ぶ）。
// 札は紫の帯が出ている間の合計（帯の diff）、光らせるのは glowMarks の分だけ
function markAiParts(s) {
  const b = aiView.band;
  if (!b || b.kind !== 'edited' || b.designId !== ui.designId || store.isViewing) return;
  const marks = aiScreenMarks(b.diff, s);
  if (!aiHasMarks(marks)) return;
  const elapsed = aiGlowElapsed(aiView.glow.get(s.id));
  const glows = aiView.glowMarks.get(s.id) || { parts: {}, callouts: {} };
  const mark = (el, kind, inside, glow) => {
    el.insertAdjacentHTML('beforeend', `<span class="ai-tag${inside ? ' ai-in' : ''}">${kind === 'new' ? 'AI が足した' : 'AI が直した'}</span>`);
    if (!glow || elapsed >= AI_GLOW_MS) return;
    el.classList.add('ai-glow');
    el.style.animationDelay = `-${elapsed}ms`;
  };
  // 画面の上の端の部品は、札が画面の外で切れないように、部品の内側に出す
  document.querySelectorAll('#stage .screen .part[data-part-id]').forEach((el) => {
    const id = el.dataset.partId;
    if (marks.parts[id]) mark(el, marks.parts[id], parseFloat(el.style.top) < 24, !!glows.parts[id]);
  });
  document.querySelectorAll('#stage .callout[data-callout-id]').forEach((el) => {
    const id = el.dataset.calloutId;
    if (marks.callouts[id]) mark(el, marks.callouts[id], false, !!glows.callouts[id]);
  });
}
// AI の印を付けた画面を開いたら、光らせ始めて印を消す
function aiSeeScreen(id) {
  if (aiView.unseen.delete(id)) aiView.glow.set(id, Date.now());
}
// 一覧の画面のカードの印。まだ一覧に出していない印は、初めて出すときに光らせ始める
function aiCardMark(id) {
  const m = aiView.cards.get(id);
  if (m && m.at == null) m.at = Date.now();
  return m || null;
}

// 直す前の様子を控える（aiWrite の batch の前）。開いている画面設計の写しは、光らせる部品と紫の帯の件数を決めるのに使う。
// systems は、システムごとの直す前の中身の JSON（システムの紫の帯の件数に使う。第 9 段階）。
// sys は書く道具が指したシステム。notes は、その直す前の設計ノートの JSON（設計ノートは systems の中身に入らないので、別に控えて帯の件数に足す。第 10 段階）
function aiViewBefore(S, systems = new Map(), sys = null) {
  const notes = sys ? JSON.stringify(sys.notes) : null;
  const openId = ui.view === 'editor' ? ui.designId : null;
  const open = openId ? findDesign(S, openId) : null;
  if (!open) return { open: null, systems, notes };
  const keep = aiView.band && aiView.band.kind === 'edited' && aiView.band.designId === openId;
  const snap = designSnapshot(open);
  return { open: openId, content: designContent(open), snap, base: keep ? aiView.band.base : snap, systems, notes };
}
// AI が直した後の知らせ（aiWrite で、中身が変わったときに呼ぶ。描き直しは呼ぶ側）。mode は元に戻すの履歴の扱い（true か 'clear'）。
// システムの道具（tx.system・tx.createdSystem）は、知らせの名前をシステムの名前にする（第 9 段階）
function aiAfterWrite(tx, mode, hadHistory, beforeMap, seen) {
  const S = store.state;
  const label = aiClientLabel(tx.ctx.client);
  const sys = tx.system || tx.createdSystem ? findSystem(S, tx.createdSystem || tx.system.id) : null;
  const target = sys ? null : findDesign(S, tx.createdDesign || (tx.design && tx.design.id));
  const created = sys ? !!tx.createdSystem : !!tx.createdDesign;
  // 一覧の画面のカードの印（一覧の画面に出すときに光らせる）。この頼みで新しくできた画面設計（作った・複製した）は「AI が作った」
  S.designs.filter((x) => beforeMap.get(x.id) !== tx.afterMap.get(x.id)).forEach((x) => {
    const was = aiView.cards.get(x.id);
    aiView.cards.set(x.id, { kind: !beforeMap.has(x.id) || (was && was.kind === 'created') ? 'created' : 'edited', at: ui.view === 'home' ? Date.now() : null });
  });
  const open = seen.open ? findDesign(S, seen.open) : null;
  const openChanged = !!open && designContent(open) !== seen.content;
  // システムの画面で開いているシステムが変わったか（オレンジの帯の「開いている…は変わっていません」に使う。第 9 段階）
  const openSys = ui.view === 'system' ? findSystem(S, ui.systemId) : null;
  const openSysChanged = !!openSys && systemContent(openSys) !== seen.systems.get(openSys.id);
  // 画面設計の道具が、開いているシステムを変えたとき（作業の指す先が外れた・作った画面設計を入れた）は、帯にその 1 文を足す
  const sysNote = !sys && openSysChanged ? aiOpenSystemNote(openSys, target, tx, label) : '';
  if (openChanged) aiNoteOpenEdited(open, seen, label, mode === true);
  else if (open && tx.afterMap.get(open.id) !== beforeMap.get(open.id)) toast(`${label} が「${open.name}」を改訂しました（${revisionLabel(open)}）。`); // 改訂履歴に版を足しただけ
  // 元に戻すの履歴を消したら、前に出した紫の帯の「元に戻す」は出さない（押しても戻らないため）
  if (mode === 'clear' && aiView.band && (aiView.band.kind === 'edited' || aiView.band.kind === 'system')) aiView.band.undoable = false;
  const what = sys || target;
  const notesOnly = aiOnlyNotesChanged(sys, created, seen, tx.afterSys);
  if (mode === 'clear' && hadHistory) {
    aiView.warn = what ? {
      designId: target ? target.id : null, systemId: sys ? sys.id : null, name: what.name, label, created, openChanged: openChanged || openSysChanged, sysNote, notesOnly,
    } : null;
    aiView.cleared = what ? what.name : '画面設計';
  } else if (sys) {
    aiNoteSystemEdited(sys, seen, label, created, mode === true, notesOnly);
  } else if (!openChanged && target && target.id !== seen.open) {
    aiView.band = { kind: created ? 'created' : 'other', designId: target.id, name: target.name, label, sysNote };
  }
  aiView.undoMark = { len: store.undoStack.length, top: store.undoStack[store.undoStack.length - 1] };
}
// システムの道具（sys）で、中身（SYSTEM_CONTENT_KEYS）は変わらず、設計ノートが変わったか（第 10 段階）。そのときは「AI が直す前の状態」の行が
// 残らないので、オレンジの帯に「戻せます」を書かず、ボタンを「設計ノートを開く」にする（aiWarnHtml）。作ったシステムは偽。
// seen は aiViewBefore の控え（notes は直す前の設計ノートの JSON、systems は直す前の中身）。afterSys は直した後の中身（tx.afterSys）
function aiOnlyNotesChanged(sys, created, seen, afterSys) {
  if (!sys || created || seen.notes == null) return false;
  return seen.notes !== JSON.stringify(sys.notes) && afterSys.get(sys.id) === seen.systems.get(sys.id);
}
// 人がシステムの画面で開いているシステム y を、画面設計の道具が変えたときの帯の 1 文（エスケープの前の文字）。
// 作った画面設計をそのシステムに入れたとき（create_design の system）と、作業の指す先が外れたとき（画面・ステータスを消したなど）
function aiOpenSystemNote(y, target, tx, label) {
  const row = `（履歴に「${label} が直す前の状態」を残しました）`;
  if (tx.createdDesign && target && y.designIds.includes(target.id)) return `開いている「${y.name}」に「${target.name}」を入れました${row}。`;
  return `開いている「${y.name}」のスイムレーン図の作業の指す先も外れました${row}。`;
}
// AI がシステムを直した・作ったとき: 紫の帯（kind 'system'）。件数は、同じシステムの帯を出してから最初に直す前（base）と今の違い。
// AI が続けて直したら、件数を足して出し直す。undoable は「元に戻す」を出すか（q66 で元に戻すの 1 回分として積んだとき）。
// 設計ノート（第 10 段階）は中身（base）に入らないので、最初に直す前の設計ノート（notesBase）も持ち越し、その違いの数を足す。
// notesOnly は、この頼みで設計ノートだけを直したか（aiOnlyNotesChanged）。同じ帯の間ずっと設計ノートだけを直したときだけ、帯の「開く」を設計ノートの入口にする
function aiNoteSystemEdited(sys, seen, label, created, undoable, notesOnly = false) {
  const b = aiView.band;
  const keep = !!b && b.kind === 'system' && b.systemId === sys.id;
  const base = keep ? b.base : (seen.systems.get(sys.id) ?? null);
  const notesBase = keep ? b.notesBase : seen.notes;
  const count = (base ? systemChangeCount(JSON.parse(base), systemContentOf(sys)) : 0) + (notesBase ? notesChangeCount(JSON.parse(notesBase), sys.notes) : 0);
  aiView.band = {
    kind: 'system', systemId: sys.id, name: sys.name, label, created: created || (keep && b.created), base, notesBase, count, undoable,
    notesOnly: notesOnly && (!keep || !!b.notesOnly),
  };
}
// システムの中身の違いの数（紫の帯の「変更 N 件」）。名前・説明、役割・作業・矢印・画面設計の並びの 1 つずつの、足した・消した・直したを 1 件と数え、
// 並びの順が変わったら、その並びで 1 件を足す
function systemChangeCount(a, b) {
  const byId = (v) => v.id;
  return (a.name !== b.name) + (a.description !== b.description)
    + listChangeCount(a.roles, b.roles, byId) + listChangeCount(a.swimlane.steps, b.swimlane.steps, byId)
    + listChangeCount(a.swimlane.edges, b.swimlane.edges, byId) + listChangeCount(a.designIds, b.designIds, (v) => v);
}
// 設計ノートの違いの数（システムの紫の帯の「変更 N 件」に足す。第 10 段階）。段階の進み具合（state と確認の日時）が変わった段階を 1 件ずつ、
// 読み取ったこと・メモが変わったら 1 件ずつ、決めたこと・まだ決まっていないことの行の足した・消した・直したを 1 件ずつ（id で比べる）数える
function notesChangeCount(a, b) {
  const stage = (n, k) => canonicalJson(n.stages[k]);
  const byId = (v) => v.id;
  return NOTE_STAGES.filter((k) => stage(a, k) !== stage(b, k)).length + (a.findings !== b.findings) + (a.memo !== b.memo)
    + listChangeCount(a.decisions, b.decisions, byId) + listChangeCount(a.questions, b.questions, byId);
}
function listChangeCount(before, after, keyOf) {
  const old = new Map(before.map((v) => [keyOf(v), canonicalJson(v)]));
  const now = new Map(after.map((v) => [keyOf(v), canonicalJson(v)]));
  let n = 0;
  now.forEach((j, k) => { if (old.get(k) !== j) n++; });
  old.forEach((j, k) => { if (!now.has(k)) n++; });
  const common = (m, other) => [...m.keys()].filter((k) => other.has(k)).join('\n');
  return n + (common(old, now) !== common(now, old) ? 1 : 0);
}
// 開いている画面設計を AI が直したとき: 紫の帯（件数は最初に直す前と今の違い）と、この 1 回で変わった部品を光らせる
function aiNoteOpenEdited(open, seen, label, undoable) {
  const diff = designDiff(seen.base, open, store.state);
  aiView.band = { kind: 'edited', designId: open.id, name: open.name, label, base: seen.base, diff, undoable };
  const now = seen.base === seen.snap ? diff : designDiff(seen.snap, open, store.state); // 最初の頼みでは、2 つの違いは同じ
  open.screens.forEach((s) => {
    const m = aiScreenMarks(now, s); // この 1 回の頼みで変わった部品と吹き出し
    if (!aiHasMarks(m)) return;
    if (ui.panel === 'screen' && s.id === ui.screenId) {
      aiView.glow.set(s.id, Date.now()); // 開いている画面は、今から光らせる（開いている画面は切り替えない）
      aiView.glowMarks.set(s.id, m);
      aiView.unseen.delete(s.id);
      return;
    }
    // ほかの画面は、左の一覧の縮小画像に「AI」の印。開くまでに AI が変えた分を足していき、開いたときに光らせる
    const prev = aiView.unseen.has(s.id) ? aiView.glowMarks.get(s.id) : null;
    aiView.glowMarks.set(s.id, prev ? { parts: { ...prev.parts, ...m.parts }, callouts: { ...prev.callouts, ...m.callouts } } : m);
    aiView.unseen.add(s.id);
  });
}
// 人が直した（元に戻すの履歴が、紫の帯を出したときから変わった）ら、紫の帯と光らせる印を閉じる（onStoreChange の初めに呼ぶ）
function aiNoteStoreChange() {
  if (aiView.writing || !aiView.band || !aiView.undoMark) return;
  const m = aiView.undoMark;
  if (store.undoStack.length === m.len && store.undoStack[store.undoStack.length - 1] === m.top) return;
  aiCloseBand();
}
function aiCloseBand() {
  Object.assign(aiView, { band: null, undoMark: null });
  aiView.glow.clear();
  aiView.glowMarks.clear();
  aiView.unseen.clear();
}
// 一覧の画面・編集の画面・システムの画面を行き来したときに、知らせを片付ける。一覧の画面から画面設計・システムを開くときは、カードの印も消す（q50c）

function onAiClick(action, btn) {
  switch (action) {
    case 'ai-band-close':
      aiCloseBand();
      if (ui.view === 'home') renderHome();
      else if (ui.view === 'system') renderSystem();
      else updateEditor({ keepSide: true });
      return true;
    // システムの画面を開く（第 9 段階）。「履歴を開く」は履歴の入口、「設計ノートを開く」（第 10 段階。紫の帯の、設計ノートだけを直したときの「開く」も）は
    // 設計ノートの入口を開く。
    // もう開いていれば開き直さない（入口だけを切り替える）
    case 'ai-open-system': case 'ai-open-system-history': case 'ai-open-system-notes': {
      flushSideField();
      const panel = { 'ai-open-system-history': 'history', 'ai-open-system-notes': 'notes' }[action] || null;
      // 設計ノートを開くときは、前に開いていた札を忘れ、最初に開く札の決まり（noteOpenStage）で札を選び直す
      // （人が帯を押したので、札が動いてよい。AI が確認待ちにした段階が開く。終わりの見直し A の Minor 4）
      if (panel === 'notes') delete ui.notesStages[btn.dataset.id];
      if (!(ui.view === 'system' && ui.systemId === btn.dataset.id)) openSystem(btn.dataset.id, { panel });
      else if (panel) openSystemPanel(panel);
      return true;
    }
    case 'ai-warn-close':
      aiView.warn = null;
      renderAiChrome();
      return true;
    case 'ai-show-changes': openAiChangesDialog().catch(reportPageError); return true;
    case 'ai-open-design':
      flushSideField();
      if (findDesign(store.state, btn.dataset.id)) openDesign(btn.dataset.id);
      return true;
    case 'ai-open-revisions':
      flushSideField();
      if (!(ui.view === 'editor' && ui.designId === btn.dataset.id)) {
        if (!findDesign(store.state, btn.dataset.id)) return true;
        openDesign(btn.dataset.id);
      }
      openRevisionsDialog().catch(reportPageError);
      return true;
  }
  return false;
}

// ── 11. 起動 ──────────────────────────────────────────────────────────────────
// 編集の画面で、押した時点で切り替えるもの（部品・画面・項目を選ぶ、左の一覧のいちばん上の入口）。前の版を見ている間も押せる
const EDITOR_PICK_ACTIONS = ['select-part', 'select-screen', 'select-item', 'open-items', 'open-map', 'open-process', 'open-flow'].map((a) => `[data-action="${a}"]`).join(', ');
function bindGlobalEvents() {
  const app = appEl();
  app.addEventListener('click', onAppClick);
  app.addEventListener('input', (e) => {
    // 選択肢を打っている間も、初期値の欄を今の選択肢に合わせておく（離れたときに初期値の欄を作り直すと、押した四角が消えるため）
    if (e.target.dataset && e.target.dataset.pf === 'props.options') { refreshChoiceInitial(parseOptions(e.target.value)); return; }
    if (e.target.id !== 'home-search') return;
    ui.query = e.target.value;

  });
  app.addEventListener('change', (e) => {
    if (e.target.closest('#side-panel, #sys-view, #sys-side') && !e.target.closest('.target-picker')) onSidePanelChange(e);
  });
  // 文字の欄にフォーカスしたときの値を控える（人が打っていない欄は保存しない。fieldUntyped）
  app.addEventListener('focusin', (e) => rememberFieldValue(e.target));
  // システムの画面のスイムレーン図のダブルクリック（文字の欄・作業を足す）と右クリック（消す。ブラウザのメニューを出さない）（第 9 段階の T6b）
  app.addEventListener('dblclick', (e) => { if (ui.view === 'system' && !isDialogOpen()) onSwimDblClick(e); });
  app.addEventListener('contextmenu', (e) => { if (ui.view === 'system' && !isDialogOpen()) onSwimContextMenu(e); });
  app.addEventListener('mousedown', (e) => {
    // スイムレーン図の箱は、つながりの図などのドラッグでは動かさない（押して選ぶだけ。図の上の操作は T6b）
    const node = e.button === 0 ? e.target.closest('.mnode') : null;
    if (node && !node.closest('[data-view="swimlane"]')) { startMapDrag(e, node); return; }
    if (ui.view === 'system') { onSystemMouseDown(e); return; }
    if (ui.view !== 'editor' || e.button !== 0) return;
    // 「…」・「＋ 画面を足す」・「…」のメニューの項目は、押した時点で右の欄を離れない（離れると打ちかけの文字の保存で画面の一覧が描き直され、
    // 押したボタンが click の前に消えて、1 回目の押しが効かないため）。打ちかけの文字は、押したときの処理の初めに保存する
    if (e.target.closest('.sl-more, .sl-add, .screen-menu button')) { e.preventDefault(); return; }
    // 部品の箱と真ん中の欄（項目の一覧表・3 つの図）のボタンも同じ（変更のたびに作り直す所。組の見出し・一覧表の ✕・「自動で並べ直す」など。
    // デバッグとリリースの見直し⑤-4）。打ちかけの文字は、click の処理の初め（onAppClick）に保存する
    if (e.target.closest('#side-box button, #db-view button')) e.preventDefault();
    if (ui.screenMenu) closeScreenMenu();
    // 前の版を見ている間は、置く・並べ替えるのドラッグを始めない（押して切り替える・選ぶだけ）
    if (store.isViewing) {

  }, true);
  window.addEventListener('blur', flushSideField);
  // 閉じる前に、打ちかけの文字を保存する。単体で開いた HTML で保存していない変更があれば、閉じるのを止める（ブラウザの確かめが出る）
  window.addEventListener('beforeunload', (e) => {

      e.preventDefault();

  document.addEventListener('dragover', onFileDragOver);

  document.addEventListener('dragleave', (e) => {
    if (e.relatedTarget) return;
    document.body.classList.remove('file-over');
    markDropSystem(null);
  });
}

// 起動したときに、どの資料の行からも指されていない資料のファイルを、資料の窓口に消してもらう（第 9 段階の後半。設計書の 5-3）。
// 保存データをそのまま読めて（保存を止めた理由 blockReason がない）、知らせ（notice。前の保存から戻したときなど）もなく、資料の窓口があるとき
// （デスクトップ版）だけ。keep は { システムの id: [資料の行の file, …] }（ごみ箱のシステムも入れる。資料のないシステムは []）。
// 消し終わるのは待たずに起動を進め、失敗しても起動は止めない（console.warn だけ）
function sweepMaterialFiles(created) {
  const api = window.materialsAPI;
  if (!api || created.blockReason || created.notice) return;
  const keep = {};
  store.state.systems.forEach((y) => { keep[y.id] = y.materials.map((m) => m.file).filter(Boolean); });
  Promise.resolve()
    .then(() => api.sweep(keep))
    .then((res) => { if (!res || !res.ok) console.warn('資料のファイルを片付けられませんでした:', materialFailText(res)); })
    .catch((e) => console.warn('資料のファイルを片付けられませんでした:', (e && e.message) || e));
}
