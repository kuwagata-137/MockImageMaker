<div id="banner" hidden></div>
<div id="app"></div>
<div id="dialog-root"></div>
<div id="toast" hidden></div>
<script>
'use strict';
// =============================================================================
// モックイメージメーカー（アプリの画面）
// 目次
//   1. 版
//   2. データの形（純関数）  … 画面設計・画面・部品の作り方、番号、一覧表の「設定」の文、読み込んだデータを今の形に直す migrate()
//   3. 保存                  … LocalStorageAdapter（ブラウザ）・FileAdapter（Electron）・BlockedAdapter（保存を止める）
//   4. 元に戻す              … Store（commit・undo・redo・persist・subscribe）と、画面設計・画面・部品の操作（actions）
//   5. 共通の部品            … 文字の置き換え・日時・お知らせ・小さな窓・作る先の選び方・画面と部品の描き方・一覧表・縮小画像
//   6. 一覧の画面            … カード・名前で探す・新規作成・名前の変更・複製・ごみ箱・システムのまとまり（左のシステムの一覧・
//                              入れる窓。第 9 段階）・システムの画面（第 9 段階）
//   7. 編集の画面            … メニューバー・画面の一覧・画面（帯・マス目・高さ）・部品の箱・設定の欄・拡大縮小・ハンド・
//                              部品のドラッグ（置く・動かす・大きさ）・コピーと貼り付け
//   8. 出力と取り込み        … 出力の窓（PDF・HTML・PNG）・印刷用のページ（表紙・つながりの図・項目の一覧表・画面）・
//                              システムの説明書（PDF。表紙・スイムレーン図・設計ノートのページ。第 10 段階の後半）・
//                              単体で開いて編集できる HTML（埋め込み・保存し直す）・HTML の取り込み（確かめの窓）
//   9. 命令（runCommand）    … ボタン・キー・アプリのメニューからの命令を 1 か所で受ける
//  10. AI の窓口            … AI（Claude Code など）の頼みを受けて実行する（第 7 段階。AI設計基盤_設計書.md の 8・9 章）
//  11. 起動
//  12. テスト用の窓口（window.__test__。テストのときだけ埋まる）
// 手本: 保存と元に戻すと一覧の画面は CheckListMaker の index.html、
//       拡大縮小とハンドとメニューバーの見た目はビジネスダイアグラムメーカー（参考/diagram_v8.31.html）から写した。
// =============================================================================

// ── 1. 版 ─────────────────────────────────────────────────────────────────────
const APP_VERSION = '1.00';
// 出力する HTML（単体で開いて編集できる HTML）の材料にする、このアプリの script の文字。
// document.currentScript は script を実行している間しか取れないので、いちばん初めに取っておく（style の文字は起動のときに取る）
const APP_SCRIPT = document.currentScript ? document.currentScript.textContent : '';

// ── 2. データの形（純関数）────────────────────────────────────────────────────
// { schemaVersion, settings: { customTargets, mapPos }, systems, designs: [ { id, name, target, description,
//   createdAt, updatedAt, trashedAt, revisions, items, screens: [ { id, name, device, width, height,
//   showHeader, tablePos, parts, callouts } ], mapPos, processPos, flowPos } ] }
// items（データベースの項目の一覧表）と parts の 1 つずつの形は、下の「項目」「部品」に書いた。callouts（吹き出し）は第 3 段階の後半で使う。
// systems（システム。いくつかの画面設計をまとめる入れ物）の形は、下の「システム」に書いた（第 8 段階で入れ物を足し、第 9 段階で中身を作った）。
// 倍率・モード・開いている画面・選んでいる部品・コピーした部品は保存しない（下の ui に持つ）。
// データの形の版: 1＝部品が項目名と設定を持つ（第 3 段階の前半まで）。2＝項目は画面設計の items に持ち、入力欄の部品は itemId で項目を指す。
// 3＝ステータスに id（{ id, name }）と操作（actions）を持ち、ボタンにも移る先を持つ。図の位置（processPos・flowPos）と systems を足した（第 8 段階）。
const SCHEMA_VERSION = 3;
const STORAGE_KEY = 'mockimagemaker.v1';
const HISTORY_LIMIT = 50;
const GRID = 8;
const NAME_MAX = 100;
const TARGET_MAX = 60;
const DEVICES = {
  pc: { label: 'パソコン', width: 1280, height: 800 },
  tablet: { label: 'タブレット', width: 768, height: 1024 },
  phone: { label: 'スマホ', width: 375, height: 667 },
};
const BUILTIN_TARGETS = [
  { id: 'kintone', label: 'kintone' },
  { id: 'salesforce', label: 'Salesforce' },
  { id: 'claude', label: 'Claude で作るアプリ' },
];
const FIRST_SCREEN_NAME = '画面 1';

const clone = (obj) => JSON.parse(JSON.stringify(obj));
// 中まで凍らせる（改訂履歴の版の写し）。凍らせた物は書き換えられないので、直して使うときは clone してから使う
function deepFreeze(v) {
  if (!v || typeof v !== 'object' || Object.isFrozen(v)) return v;
  Object.freeze(v);
  Object.values(v).forEach(deepFreeze);
  return v;
}
const nowIso = () => new Date().toISOString();
const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const str = (v) => (typeof v === 'string' ? v : '');

function newId(prefix) {
  const c = window.crypto;
  if (c && typeof c.randomUUID === 'function') return prefix + '-' + c.randomUUID();
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// 名前の前後の空白を取り、続く空白を 1 つにする。長すぎる名前は切る
function cleanName(s, max = NAME_MAX) {
  return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').slice(0, max);
}

function createInitialState() {
  return { schemaVersion: SCHEMA_VERSION, settings: { customTargets: [], mapPos: {} }, systems: [], designs: [] };
}

function createScreenData(name, device = 'pc') {
  const d = DEVICES[device];
  return { id: newId('s'), name, device, width: d.width, height: d.height, showHeader: true, tablePos: 'right', parts: [], callouts: [] };
}

function createDesignData(name, target, now = nowIso()) {
  return {
    id: newId('d'), name, target, description: '', createdAt: now, updatedAt: now,
    trashedAt: null, revisions: [], items: [], screens: [createScreenData(FIRST_SCREEN_NAME)], mapPos: {}, processPos: {}, flowPos: {},
  };
}

// 高さは、機器の 1 画面分から 8 ドットずつ伸ばせる（1 画面分より低くはできない）
function snapHeight(h, device) {
  const min = DEVICES[device].height;
  const extra = Math.round((Number(h) - min) / GRID) * GRID;
  return min + Math.max(0, extra || 0);
}
// 下の端（bottom）まで入る、いちばん低い高さ（機器の 1 画面分から 8 ドットずつ）
function heightToFit(bottom, device) {
  const min = DEVICES[device].height;
  return min + Math.max(0, Math.ceil((bottom - min) / GRID) * GRID);
}

// 機器の種類を変えると、幅はその機器の幅になる。下へ伸ばした分は、新しい機器の 1 画面分に足す
function changeDevice(screen, device) {
  const extra = Math.max(0, screen.height - DEVICES[screen.device].height);
  return { ...screen, device, width: DEVICES[device].width, height: snapHeight(DEVICES[device].height + extra, device) };
}

function builtinTarget(id) {
  return BUILTIN_TARGETS.find((t) => t.id === id) || null;
}
function targetLabel(target) {
  const b = builtinTarget(target);
  return b ? b.label : target || '作る先なし';
}
// 「その他」に書いた名前。kintone などと同じ名前なら、そちらを選んだことにする
function resolveTargetName(text) {
  const s = cleanName(text, TARGET_MAX);
  const low = s.toLowerCase();
  const b = BUILTIN_TARGETS.find((t) => t.label.toLowerCase() === low || t.id === low);
  return b ? b.id : s;
}
function addCustomTarget(state, target) {
  if (!target || builtinTarget(target)) return;
  if (!state.settings.customTargets.includes(target)) state.settings.customTargets.push(target);
}

const byNewest = (key) => (a, b) => String(b[key] || '').localeCompare(String(a[key] || ''));
// 一覧に出す画面設計（ごみ箱のものを除く・名前で探す・更新の新しい順）
function visibleDesigns(state, query = '') {
  const q = cleanName(query).toLowerCase();
  return state.designs
    .filter((d) => !d.trashedAt && (!q || d.name.toLowerCase().includes(q)))
    .sort(byNewest('updatedAt'));
}
function trashedDesigns(state) {
  return state.designs.filter((d) => d.trashedAt).sort(byNewest('trashedAt'));
}

function duplicateDesignData(d, now = nowIso()) {
  const copy = clone({ ...d, revisions: [] });
  copy.id = newId('d');
  copy.name = cleanName(d.name + ' のコピー');
  copy.createdAt = now;
  copy.updatedAt = now;
  copy.trashedAt = null;
  // 改訂履歴は写さない（部品の id を付け直すので、前の版の写しと突き合わせられないため。Claude が決めた）
  copy.revisions = [];
  // 項目の id は画面設計の中だけで重ならなければよいので、そのまま写す（部品・ルックアップが指す id を付け直さなくて済むため）。
  // 画面と部品の id は付け直し、それを指す吹き出しのつなぐ部品と、ボタン・リンクの文字の移る先も付け直す
  const screenIds = new Map(d.screens.map((s) => [s.id, newId('s')]));
  copy.screens = d.screens.map((s) => copyScreenData(s, { name: s.name, id: screenIds.get(s.id), screenIds, designId: d.id }));
  // 編集の画面のつながりの図で覚えた「この画面設計」の箱の位置は、複製の箱の鍵で覚え直す
  if (isObj(copy.mapPos) && copy.mapPos['d:' + d.id]) {
    copy.mapPos['d:' + copy.id] = copy.mapPos['d:' + d.id];
    delete copy.mapPos['d:' + d.id];
  }
  // 画面の移り方の図で覚えた画面の箱の位置も、複製の画面の鍵で覚え直す（ほかの画面設計の画面の箱はそのまま）
  if (isObj(copy.flowPos)) {
    copy.flowPos = Object.fromEntries(Object.entries(copy.flowPos).map(([k, v]) => [k.startsWith('s:') && screenIds.has(k.slice(2)) ? 's:' + screenIds.get(k.slice(2)) : k, v]));
  }
  return copy;
}

// ── 画面を足す・複製する（第 4 段階。画像 q29・q30）──
// 画面 1 つの写し。画面・部品・吹き出しの id を付け直し、吹き出しのつなぐ部品とボタン・リンクの文字の移る先も付け直す。
// 部品は同じ項目を指したまま（ほかの画面へ貼るときと同じ。1 つの画面に同じ項目は 1 回だけだが、別の画面には置ける）。
// screenIds（元の画面の id → 新しい id）を渡したとき（画面設計の複製）は、この画面設計の画面を指す移る先をそれで付け直し、ないものは外す。
// 渡さないとき（画面の複製）は、自分の画面を指す移る先だけを新しい画面に付け直し、ほかの画面を指すものはそのままにする。
// ほかの画面設計の画面を指す移る先は、どちらでもそのまま写す（designId は元の画面設計の id。'' はこの画面設計）
function copyScreenData(src, { name, id = newId('s'), screenIds = null, designId = '' }) {
  const copy = clone(src);
  copy.id = id;
  copy.name = name;
  const partIds = new Map();
  copy.parts.forEach((p) => { partIds.set(p.id, newId('p')); p.id = partIds.get(p.id); });
  copy.callouts = (copy.callouts || []).map((c) => ({ ...c, id: newId('k'), target: c.target ? partIds.get(c.target) || null : null }));
  copy.parts.forEach((p) => {
    if (!hasMoveTarget(p) || !p.props.screenId || (p.props.designId && p.props.designId !== designId)) return;
    const to = p.props.screenId;
    p.props.screenId = screenIds ? screenIds.get(to) || '' : to === src.id ? id : to;
    if (screenIds) p.props.designId = ''; // 画面設計の複製では、元の画面設計を名指ししていた移る先も「この画面設計」にする
  });
  return copy;
}

// 画面の名前が重ならないようにする（「一覧」がもうあれば「一覧 2」）。番号を足しても名前の長さの上限を超えないように、元の名前を切る
function uniqueScreenName(design, base) {
  const names = new Set(design.screens.map((s) => s.name));
  if (!names.has(base)) return base;
  for (let n = 2; ; n++) {
    const name = `${base.slice(0, NAME_MAX - String(n).length - 1).trim()} ${n}`;
    if (!names.has(name)) return name;
  }
}
// 白紙の画面の名前（「画面 4」）。画面の数＋1 から数えて、使われていない番号にする（「画面 3 2」のようにしないため）
function blankScreenName(design) {
  const names = new Set(design.screens.map((s) => s.name));
  for (let n = design.screens.length + 1; ; n++) if (!names.has(`画面 ${n}`)) return `画面 ${n}`;
}
// 複製した画面の名前（「◯◯ のコピー」、重なれば「◯◯ のコピー 2」）。長い名前でも「のコピー」と番号が切れないように、元の名前のほうを切る
function copyScreenName(design, name) {
  const names = new Set(design.screens.map((s) => s.name));
  for (let n = 1; ; n++) {
    const suffix = n === 1 ? ' のコピー' : ` のコピー ${n}`;
    const full = cleanName(name).slice(0, NAME_MAX - suffix.length).trim() + suffix;
    if (!names.has(full)) return full;
  }
}

// 画面を afterId の画面のすぐ後ろに入れる（見つからなければいちばん後ろ）
function insertScreenAfter(design, screen, afterId) {
  const i = design.screens.findIndex((s) => s.id === afterId);
  design.screens.splice(i < 0 ? design.screens.length : i + 1, 0, screen);
}

// ── 移る先（ボタンとリンクの文字。第 8 段階で、ボタンにも持たせ、ほかの画面設計の画面も指せるようにした）──
// 部品の props: to（''・'screen'・'url'）・designId（移る先の画面設計。'' はこの画面設計）・screenId・url。
// 移る先を「URL を書く」に変えた後も designId・screenId は残るので、移る先が画面のものだけを見る
const MOVE_PART_TYPES = ['button', 'link'];
const hasMoveTarget = (p) => MOVE_PART_TYPES.includes(p.type) && isObj(p.props);
// 部品の移る先の画面 { designId, screenId }（inDesignId は部品のある画面設計）。移る先が画面でないときは null
function moveTargetOf(p, inDesignId) {
  if (!hasMoveTarget(p) || p.props.to !== 'screen' || !p.props.screenId) return null;
  return { designId: p.props.designId || inDesignId, screenId: p.props.screenId };
}
const targetsScreen = (p, inDesignId, designId, screenId) => {
  const t = moveTargetOf(p, inDesignId);
  return !!t && t.designId === designId && t.screenId === screenId;
};
// その画面を移る先にしているボタンとリンクの文字の数を、画面設計ごとに数える（画面を消す確かめの窓に書く。消す画面の中の部品は数えない）。
// 戻り値 [{ design, count }]。この画面設計が先、ほかは名前の順。ごみ箱の画面設計の分も数える（消すと、その移る先も外れるため）
function screenRefsInto(state, designId, screenId) {
  return state.designs
    .map((d) => ({ design: d, count: d.screens.filter((s) => !(d.id === designId && s.id === screenId))
      .reduce((n, s) => n + s.parts.filter((p) => targetsScreen(p, d.id, designId, screenId)).length, 0) }))
    .filter((x) => x.count)
    .sort((a, b) => (b.design.id === designId) - (a.design.id === designId) || a.design.name.localeCompare(b.design.name, 'ja'));
}
// その画面を指す移る先を外す（画面を消したとき。どの画面設計の分も）。外した画面設計の id の並びを返す
function clearScreenRefs(state, designId, screenId) {
  const hit = [];
  state.designs.forEach((d) => d.screens.forEach((s) => s.parts.forEach((p) => {
    if (!targetsScreen(p, d.id, designId, screenId)) return;
    p.props.screenId = '';
    if (!hit.includes(d.id)) hit.push(d.id);
  })));
  return hit;
}
// 完全に削除した画面設計を名指ししていた移る先を、画面設計も画面も外す
function clearDesignRefs(state, designId) {
  state.designs.forEach((d) => d.screens.forEach((s) => s.parts.forEach((p) => {
    if (hasMoveTarget(p) && p.props.designId === designId) Object.assign(p.props, { designId: '', screenId: '' });
  })));
}
// 移る先の画面設計の名前と画面（{ name, screens }）。単体で開いた HTML では、出力したときに入れた screenPeers から引く
function screenOwner(state, designId) {
  return findDesign(state, designId) || (standalone && standalone.screenPeers.find((p) => p.id === designId)) || null;
}
// 設定の文の「移る先＝」。この画面設計の画面は「一覧の画面」、ほかの画面設計の画面は「経費精算 ／ 一覧の画面」、見つからなければ「（ない画面）」
function moveTargetText(ctx, pr) {
  if (pr.to === 'url') return String(pr.url == null ? '' : pr.url).trim();
  if (pr.to !== 'screen' || !pr.screenId || !ctx) return '';
  const own = !pr.designId || pr.designId === ctx.design.id;
  const owner = own ? ctx.design : screenOwner(ctx.state, pr.designId);
  const s = owner ? owner.screens.find((x) => x.id === pr.screenId) : null;
  if (!s) return '（ない画面）';
  return (own ? '' : `${owner.name} ／ `) + `${s.name}の画面`;
}
// 出力する HTML に入れる、移る先のほかの画面設計（この画面設計のボタン・リンクの文字が指す画面設計と、この画面設計の画面を指す
// ボタン・リンクの文字のある画面設計〔ごみ箱にないもの〕）。名前・画面の名前と、入ってくる移る先（from: 相手の画面・to: この画面設計の画面）だけを入れる。
// 指す先の画面設計がごみ箱にあるときは trashed の印を付ける（設定の文には名前を出し、図と移る先の選択肢には出さない。アプリと同じ）。
// つながりの図の peers とは分ける（つながりの図に箱を増やさないため）
function screenPeersOf(d, state) {
  const ids = new Set();
  d.screens.forEach((s) => s.parts.forEach((p) => { const t = moveTargetOf(p, d.id); if (t && t.designId !== d.id) ids.add(t.designId); }));
  const refs = new Map();
  state.designs.filter((x) => x.id !== d.id && !x.trashedAt).forEach((x) => x.screens.forEach((s) => s.parts.forEach((p) => {
    const t = moveTargetOf(p, x.id);
    if (!t || t.designId !== d.id) return;
    ids.add(x.id);
    refs.set(x.id, [...(refs.get(x.id) || []), { from: s.id, to: t.screenId, type: p.type, label: partTitle(p) }]);
  })));
  return [...ids].map((id) => findDesign(state, id)).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'))
    .map((x) => ({ id: x.id, name: x.name, screens: x.screens.map((s) => ({ id: s.id, name: s.name })), refs: refs.get(x.id) || [], ...(x.trashedAt ? { trashed: true } : {}) }));
}
function normalizeScreenPeers(raw) {
  return (Array.isArray(raw) ? raw : []).filter((p) => isObj(p) && str(p.id)).map((p) => ({
    id: str(p.id),
    name: cleanName(p.name) || '名前なし',
    screens: (Array.isArray(p.screens) ? p.screens : []).filter((s) => isObj(s) && str(s.id)).map((s) => ({ id: str(s.id), name: str(s.name) })),
    refs: (Array.isArray(p.refs) ? p.refs : []).filter(isObj).map((r) => ({ from: str(r.from), to: str(r.to), type: r.type === 'button' ? 'button' : 'link', label: str(r.label) })),
    ...(p.trashed === true ? { trashed: true } : {}),
  }));
}

// ひな形（画像 q30）。note は「画面を足す」の窓の札に書く短い説明
const SCREEN_TEMPLATES = [
  { id: 'blank', name: '白紙', note: '帯だけ' },
  { id: 'input', name: '入力', note: '項目を並べ、保存のボタン' },
  { id: 'detail', name: '詳細', note: '項目を並べ、編集・削除のボタン' },
  { id: 'list', name: '一覧', note: '検索・絞り込み・レコード一覧' },
  { id: 'graph', name: 'グラフ', note: 'グラフを 2 つ' },
  { id: 'agg', name: '集計', note: '表とグラフ' },
  { id: 'steps', name: '進み具合', note: '進み具合の矢印・承認のボタン' },
];
const TPL_LEFT = 32; // ひな形で部品を置く左の端
const TPL_COL2 = 480; // 項目を 2 列で並べるときの右の列（幅 400 の部品の右に 48 空ける）
const TPL_GAP = 24; // 項目の行の間
// データベースの項目がまだないときに、入力・詳細・進み具合へ置く見本の項目
const TPL_SAMPLE_ITEMS = [['text1', '項目名 1'], ['date', '項目名 2'], ['dropdown', '項目名 3']];

// ── 並べ方（第 7 段階。設計書の 9-3）──
// 行と列だけを決めれば、位置と大きさを決まりどおりに決める。ひな形と AI の並べ方（layout）の両方がこれを使う（置き方の決まりを 1 か所にするため）
const LAYOUT_COL_W = 400; // 列の幅
const LAYOUT_SPAN_W = TPL_COL2 + LAYOUT_COL_W - TPL_LEFT; // 2 列の幅いっぱい（848）
const LAYOUT_TWO_COL_MIN = TPL_COL2 + LAYOUT_COL_W + TPL_LEFT; // 2 列で置ける画面の幅（912。パソコンだけ）
const LAYOUT_ALIGN_GAP = 32; // align の行（ボタンの行）の部品の間と、前の行との間
const isAlignRow = (row) => isObj(row) && !Array.isArray(row) && Array.isArray(row.parts);
// 並べ方から位置と大きさを決める（純関数）。rows の 1 つは、部品の並び（配列）か { align: 'left'・'center'・'right', parts: [...] }。
// sizeOf(entry) は、その部品の種類と最初の大きさ { type, w, h } を返す。entry.span が 2 なら 2 列の幅いっぱいに広げる。
// 戻り値 { placed: [{ entry, type, x, y, w, h }]（置く順）, nextY（次に置ける y。最後の行のいちばん下＋24）}
function layoutPlacements({ rows, columns = 1 }, { width, startY, sizeOf }) {
  const cols = columns >= 2 && width >= LAYOUT_TWO_COL_MIN ? 2 : 1;
  const maxW = Math.floor((width - TPL_LEFT * 2) / GRID) * GRID; // 画面の幅から左右 32 ずつ引いた幅
  const placed = [];
  let y = startY;
  const sized = (entry) => {
    const s = sizeOf(entry);
    const w = entry && entry.span === 2 ? Math.min(LAYOUT_SPAN_W, maxW) : Math.min(s.w, maxW);
    return { entry, type: s.type, w, h: s.h };
  };
  // 1 行分を y に置き、次の行の y へ進める
  const putLine = (line) => {
    if (!line.length) return;
    line.forEach((p) => placed.push({ ...p, y }));
    y += Math.max(...line.map((p) => p.h)) + TPL_GAP;
  };
  rows.forEach((row) => {
    if (isAlignRow(row)) {
      if (y !== startY) y += LAYOUT_ALIGN_GAP - TPL_GAP;
      layoutAlignLines(row.parts.map(sized), maxW).forEach((line) => {
        const total = line.reduce((n, p) => n + p.w, 0) + LAYOUT_ALIGN_GAP * (line.length - 1);
        let x = row.align === 'right' ? width - TPL_LEFT - total
          : row.align === 'center' ? Math.floor((width - total) / 2 / GRID) * GRID : TPL_LEFT;
        putLine(line.map((p) => { const q = { ...p, x }; x += p.w + LAYOUT_ALIGN_GAP; return q; }));
      });
      return;
    }
    let line = [];
    (Array.isArray(row) ? row : []).forEach((entry) => {
      const p = sized(entry);
      // 1 列のとき・列の幅に入らない部品は、1 行を 1 つで使う
      if (cols === 1 || p.w > LAYOUT_COL_W) { putLine(line); putLine([{ ...p, x: TPL_LEFT }]); line = []; return; }
      if (line.length >= cols) { putLine(line); line = []; }
      line.push({ ...p, x: line.length ? TPL_COL2 : TPL_LEFT });
    });
    putLine(line);
  });
  return { placed, nextY: y };
}
// align の行の部品を、画面の幅に入る分ずつの行に分ける
function layoutAlignLines(parts, maxW) {
  const lines = [];
  let line = [];
  let w = 0;
  parts.forEach((p) => {
    if (line.length && w + LAYOUT_ALIGN_GAP + p.w > maxW) { lines.push(line); line = []; }
    w = line.length ? w + LAYOUT_ALIGN_GAP + p.w : p.w;
    line.push(p);
  });
  if (line.length) lines.push(line);
  return lines;
}
// 部品の最初の大きさ（並べ方の sizeOf に使う）
const defaultPartSize = (type) => ({ type, w: partType(type).w, h: partType(type).h });

// 画面に部品を 1 つ置く（commit はしない）。下の端が画面からはみ出すときは、画面を下へ伸ばす（部品が上へずれないように）。
// spec: { type, x, y, w, h, itemId, tableKind, label, props, view }。戻り値は置いた部品
function placePartIn(sc, design, { type, x, y, w, h, itemId = null, tableKind = 'subtable', label, props, view }) {
  const t = partType(type);
  const bottom = y + (h || t.h) + TPL_LEFT;
  if (bottom > sc.height) sc.height = snapHeight(Math.ceil(bottom / GRID) * GRID, sc.device);
  const p = createPartData(type, sc, { x, y }, itemId, { tableKind, design });
  if (label != null) p.label = label;
  if (props) p.props = { ...p.props, ...props };
  if (view) p.view = type === 'table' ? normalizeTableView({ ...p.view, ...view }) : { ...p.view, ...view };
  Object.assign(p, fitRect({ ...p, w: w || p.w, h: h || p.h }, sc));
  sc.parts.push(p);
  return p;
}

// ひな形から画面を作る（commit はしない）。戻り値 { screen, items（データベースの項目の一覧表に新しく足す項目）}。
// 入力・詳細・進み具合には、データベースの項目の一覧表の項目を上から順に 2 列で並べ、テーブルの項目はその下に 1 つずつ置く
function screenFromTemplate(design, templateId, name) {
  const sc = createScreenData(name);
  const items = [];
  const put = (type, x, y, opts = {}) => placePartIn(sc, design, { type, x, y, ...opts });
  const button = (x, y, label, style = 'primary') => put('button', x, y, { label, props: { style } });
  const status = () => {
    let it = design.items.find((x) => x.type === 'status') || items.find((x) => x.type === 'status');
    if (!it) items.push((it = createItemData('status')));
    return it;
  };
  const putStatus = (type, x, y) => {
    const it = status();
    put(type, x, y, { itemId: it.id, view: { current: defaultStateId(it) } });
  };
  // 項目を 2 列で並べ（並べ方の決まり layoutPlacements で置く）、テーブルの項目はその下に 1 つずつ、最後に buttons の行を置く
  const flowItems = (y0, buttons = []) => {
    let inputs = design.items.filter((it) => isInputType(it.type));
    const tables = design.items.filter((it) => it.type === 'table');
    if (!inputs.length && !tables.length) {
      inputs = TPL_SAMPLE_ITEMS.map(([type, n]) => createItemData(type, n));
      items.push(...inputs);
    }
    const rows = [];
    for (let i = 0; i < inputs.length; i += 2) rows.push(inputs.slice(i, i + 2).map((it) => ({ item: it })));
    tables.forEach((it) => rows.push([{ item: it }]));
    if (buttons.length) rows.push({ align: 'left', parts: buttons.map(([label, style]) => ({ type: 'button', label, props: { style } })) });
    const sizeOf = (e) => defaultPartSize(e.item ? partTypeOfItem(e.item.type) : e.type);
    const { placed } = layoutPlacements({ rows, columns: 2 }, { width: sc.width, startY: y0, sizeOf });
    placed.forEach((pl) => put(pl.type, pl.x, pl.y, { itemId: pl.entry.item ? pl.entry.item.id : null, w: pl.w, h: pl.h, label: pl.entry.label, props: pl.entry.props }));
  };
  const right = (w) => sc.width - TPL_LEFT - w;
  switch (templateId) {
    case 'input':
      flowItems(64, [['保存', 'primary'], ['キャンセル', 'normal']]);
      break;
    case 'detail':
      button(right(96 + 32 + 96), 56, '編集');
      button(right(96), 56, '削除', 'normal');
      flowItems(112);
      break;
    case 'list': {
      put('search', TPL_LEFT, 64);
      put('filter', 368, 64);
      put('button', right(128), 64, { label: '＋ 新規登録', w: 128 });
      const t = put('table', TPL_LEFT, 128, { tableKind: 'records', w: sc.width - TPL_LEFT * 2, h: tableHeight(8), view: { rows: 8 } });
      put('pager', right(PART_TYPES.pager.w), t.y + t.h + 16);
      break;
    }
    case 'graph': {
      const w = (sc.width - TPL_LEFT * 3) / 2;
      put('filter', TPL_LEFT, 64);
      put('graph', TPL_LEFT, 128, { w });
      put('graph', TPL_LEFT * 2 + w, 128, { w, props: { chart: 'pie', samples: '分類 1, 45\n分類 2, 30\n分類 3, 25' } });
      break;
    }
    case 'agg': {
      const w = (sc.width - TPL_LEFT * 3) / 2;
      put('filter', TPL_LEFT, 64);
      put('table', TPL_LEFT, 128, { tableKind: 'records', w, h: tableHeight(6), view: { rows: 6 } });
      put('graph', TPL_LEFT * 2 + w, 128, { w, props: { chart: 'hbar', samples: '分類 1, 42\n分類 2, 35\n分類 3, 28\n分類 4, 19' } });
      break;
    }
    case 'steps': {
      putStatus('steps', TPL_LEFT, 64);
      putStatus('status', right(PART_TYPES.status.w), 64);
      flowItems(136, [['承認する', 'primary'], ['差し戻す', 'normal']]);
      break;
    }
    default: break; // 白紙は帯だけ
  }
  return { screen: sc, items };
}

//   type は入力欄の部品の種類（text1 など）。name は項目名。props は種類ごとの設定（PART_TYPES の props が最初の値）。

  // ボタンとリンクの文字の移る先: to は ''（なし）・'screen'（画面）・'url'。designId は移る先の画面設計（'' はこの画面設計。第 8 段階）
  button: { name: 'ボタン', icon: '▬', w: 96, h: 40, label: 'ボタン', props: { style: 'primary', action: '', to: '', designId: '', screenId: '', url: '' } },
  heading: { name: '見出し', icon: 'T', w: 400, h: 32, label: '見出し', noNumber: true, props: {} },

// まとめて揃える（画像 q28）。rects は [{ k, id, x, y, w, h }]（選んだ順）。基準はいちばん初めに選んだもの（ユーザーが選んだ）。
// how: left・hcenter・right・top・vcenter・bottom（基準の端・真ん中に合わせる）、hdist・vdist（両端を動かさずに間を等しくする。3 つ以上）、
// width・height（基準と同じ幅・高さにする）。戻り値は動かした後の位置と大きさ（マス目と範囲に収めるのは呼ぶ側）
function alignedRects(rects, how) {
  if (rects.length < 2) return rects;
  const ref = rects[0];
  const out = rects.map((r) => ({ ...r }));
  const each = (fn) => out.forEach((r, i) => { if (i) fn(r); });
  switch (how) {
    case 'left': each((r) => { r.x = ref.x; }); break;
    case 'hcenter': each((r) => { r.x = ref.x + ref.w / 2 - r.w / 2; }); break;
    case 'right': each((r) => { r.x = ref.x + ref.w - r.w; }); break;
    case 'top': each((r) => { r.y = ref.y; }); break;
    case 'vcenter': each((r) => { r.y = ref.y + ref.h / 2 - r.h / 2; }); break;
    case 'bottom': each((r) => { r.y = ref.y + ref.h - r.h; }); break;
    case 'width': each((r) => { r.w = ref.w; }); break;
    case 'height': each((r) => { r.h = ref.h; }); break;
    case 'hdist': case 'vdist': {
      if (out.length < 3) return out;
      const [pos, size] = how === 'hdist' ? ['x', 'w'] : ['y', 'h'];
      const order = [...out].sort((a, b) => a[pos] - b[pos]);
      const first = order[0];
      const last = order[order.length - 1];
      const total = order.reduce((s, r) => s + r[size], 0);
      const gap = (last[pos] + last[size] - first[pos] - total) / (order.length - 1);
      let at = first[pos];
      order.forEach((r) => { r[pos] = at; at += r[size] + gap; });
      break;
    }
  }
  return out;
}

// 吹き出しから部品への線の両端（吹き出しの縁の点 → 部品のいちばん近い点）。重なっているときは null
function calloutLine(c, part) {
  if (!part) return null;
  const cx = c.x + c.w / 2;
  const cy = c.y + c.h / 2;
  const inside = cx >= part.x && cx <= part.x + part.w && cy >= part.y && cy <= part.y + part.h;
  const ex = inside ? part.x + part.w / 2 : Math.min(Math.max(cx, part.x), part.x + part.w);
  const ey = inside ? part.y + part.h / 2 : Math.min(Math.max(cy, part.y), part.y + part.h);
  const dx = ex - cx;
  const dy = ey - cy;
  const tx = dx > 0 ? (c.w / 2) / dx : dx < 0 ? (-c.w / 2) / dx : Infinity;
  const ty = dy > 0 ? (c.h / 2) / dy : dy < 0 ? (-c.h / 2) / dy : Infinity;
  const k = Math.min(tx, ty);
  if (!(k < 1)) return null;
  return { x1: cx + dx * k, y1: cy + dy * k, x2: ex, y2: ey };
}

// 部品の位置と大きさを 8 ドットのマス目に吸い付け、画面の中に収める（大きさは変えずに位置をずらす）
function fitRect(r, screen) {
  const maxW = Math.floor(screen.width / GRID) * GRID;

  const w = Math.min(Math.max(PART_MIN, snapGrid(r.w)), maxW);

  const x = Math.min(Math.max(0, snapGrid(r.x)), maxW - w);

  let t = r0.y;
  let r = r0.x + r0.w;
  let b = r0.y + r0.h;
  if (grip.includes('w')) l = Math.min(Math.max(0, snapGrid(l + dx)), r - PART_MIN);
  if (grip.includes('e')) r = Math.max(Math.min(maxX, snapGrid(r + dx)), l + PART_MIN);
  if (grip.includes('n')) t = Math.min(Math.max(0, snapGrid(t + dy)), b - PART_MIN);

function renumberedParts(parts) {
  const order = parts.filter((p) => p.no != null).sort((a, b) => a.y - b.y || a.x - b.x);
  const nos = new Map(order.map((p, i) => [p.id, i + 1]));
  return parts.map((p) => (nos.has(p.id) ? { ...p, no: nos.get(p.id) } : p));
}

// 一覧表の「設定」の列の文。1 行目に「必須・最大 50 文字」のような短い条件を「・」でつなぎ、
// 「選択肢＝…」のように「＝」で書く項目は 1 つずつ行を分け、最後の行にメモを足す。何も書いていない欄は出さない
// ctx（{ design, state }）を渡すと、ルックアップの文も足す（ルックアップ元の名前を引くため）
function describePart(p, ctx = null) {
  const x = describePartLines(p, ctx);
  return [x.short, ...x.eq, x.memo].filter(Boolean).join('\n');
}
// 設定の文を組む前の形 { short（「必須・最大 50 文字」）, eq（「選択肢＝…」の行）, memo }。改訂履歴の変更内容の一覧で、行ごとに比べるためにも使う
function describePartLines(p, ctx = null) {
  const pr = p.props || {};
  const v = (s) => String(s == null ? '' : s).trim();
  const list = (a) => (Array.isArray(a) ? a.map(v).filter(Boolean).join('／') : '');
  const short = [];
  const eq = [];
  const eqIf = (label, value) => { if (value) eq.push(`${label}＝${value}`); };
  if (p.required && partType(p.type) && partType(p.type).input) short.push('必須');
  switch (p.type) {
    case 'text1': case 'text2':
      if (v(pr.maxLen)) short.push(`最大 ${v(pr.maxLen)} 文字`);
      eqIf('初期値', v(pr.initial));
      break;
    case 'number': {
      const [min, max, dec] = [v(pr.min), v(pr.max), v(pr.decimals)];
      if (min && max) short.push(`${min}〜${max}`);
      else if (min) short.push(`${min} 以上`);
      else if (max) short.push(`${max} 以下`);
      if (dec === '0') short.push('小数なし');
      else if (dec) short.push(`小数 ${dec} 桁`);
      eqIf('単位', v(pr.unit));
      eqIf('初期値', v(pr.initial));
      break;
    }
    case 'date':
      eqIf('初期値', pr.initial === 'today' ? '今日' : pr.initial === 'date' ? v(pr.initialDate) : '');
      break;
    case 'datetime':
      eqIf('初期値', pr.initial === 'now' ? '今の日時' : '');
      break;
    case 'dropdown': case 'radio': case 'checkbox':
      eqIf('選択肢', list(pr.options));
      eqIf('初期値', p.type === 'checkbox' ? list(pr.initial) : v(pr.initial));
      break;
    case 'user':
      if (pr.multiple) short.push('複数人を選べる');
      eqIf('選べる人', v(pr.scope));
      eqIf('初期値', pr.initial === 'me' ? '使っている人' : '');
      break;
    case 'file':
      if (v(pr.maxCount)) short.push(`${v(pr.maxCount)} 個まで`);
      eqIf('ファイル', v(pr.accept));
      break;
    case 'calc':
      eqIf('計算式', v(pr.formula));
      eqIf('単位', v(pr.unit));
      break;
    case 'button':
      eqIf('移る先', moveTargetText(ctx, pr));
      eqIf('押したとき', v(pr.action));
      break;
    case 'table':
      if (p.tableKind === 'subtable') { if (p.required) short.push('必須（1 行以上）'); }
      else if (p.tableKind === 'related') {
        const src = ctx && pr.db && pr.db.designId ? findDesign(ctx.state, pr.db.designId) : null;
        const db = ctx ? dbLabel(ctx.state, pr.db) : v(pr.db && pr.db.name);
        eqIf('関連レコード一覧', db);
        if (pr.cond && (pr.cond.from.itemId || pr.cond.from.name)) eqIf('条件', `${db}の「${refLabel(src, pr.cond.from)}」がこのレコードの「${refLabel(ctx && ctx.design, pr.cond.to)}」と同じ`);
        eqIf('並べ順', v(pr.sort));
        if (v(pr.limit)) short.push(`最大 ${v(pr.limit)} 件`);
      } else {
        eqIf('並べ順', v(pr.sort));
        if (v(pr.perPage)) short.push(`1 ページ ${v(pr.perPage)} 件`);
      }
      break;
    case 'graph': {
      const by = itemNameIn(ctx, pr.byItem);
      eqIf('グラフ', CHART_NAMES[pr.chart] || '');
      eqIf('分類', by ? by + (v(pr.byUnit) ? `（${v(pr.byUnit)}）` : '') : v(pr.byUnit));
      const agg = pr.agg === 'count' ? AGG_NAMES.count : itemNameIn(ctx, pr.aggItem) ? `${itemNameIn(ctx, pr.aggItem)}の${AGG_NAMES[pr.agg] || '合計'}` : '';
      eqIf('集計', agg && agg + (v(pr.unit) ? `（${v(pr.unit)}）` : ''));
      break;
    }
    case 'search':
      eqIf('探す項目', (pr.items || []).map((id) => itemNameIn(ctx, id)).filter(Boolean).join('・'));
      if (pr.button === false) short.push('「検索」ボタンなし');
      break;
    case 'filter':
      eqIf('絞り込む項目', (pr.items || []).map((id) => itemNameIn(ctx, id)).filter(Boolean).join('・'));
      break;
    case 'pager':
      if (v(pr.perPage)) short.push(`1 ページ ${v(pr.perPage)} 件`);
      break;
    case 'status': case 'steps':
      eqIf('ステータス', stateNames(pr.states).join(p.type === 'steps' ? ' → ' : '／'));
      eq.push(...actionLines(pr));
      break;
    case 'tabs':
      eqIf('タブ', list(pr.tabs));
      break;
    case 'link':
      eqIf('移る先', moveTargetText(ctx, pr));
      break;
  }
  if (ctx) eq.push(...lookupLines(ctx, p));
  return { short: short.join('・'), eq, memo: v(p.memo) };
}

// 操作の行「操作「承認する」＝承認待ちから承認済みへ（上長）・条件」。「＝」の前を操作ごとに変えて、改訂履歴の違いで操作ごとに前と後を出す
function actionLines(pr) {
  const states = Array.isArray(pr.states) ? pr.states : [];
  const nm = (id) => stateNameOf(states, id) || '（なし）';
  return (Array.isArray(pr.actions) ? pr.actions : []).filter(isObj)
    .map((a) => `操作「${String(a.name || '').trim()}」＝${nm(a.from)}から${nm(a.to)}へ${str(a.role).trim() ? `（${a.role.trim()}）` : ''}${str(a.cond).trim() ? `・${a.cond.trim()}` : ''}`);
}
const itemNameIn = (ctx, id) => { const it = ctx && id ? findItem(ctx.design, id) : null; return it ? it.name : ''; };

// データベースの項目の一覧表の「設定」の列の文（部品の設定の一覧表と同じ書き方）。表（テーブル）は列の名前も書く
function describeItem(item, ctx = null) {
  const text = describePart({ type: item.type, tableKind: 'subtable', required: item.required, memo: item.memo, props: item.props, item }, ctx);
  if (item.type !== 'table') return text;
  const cols = (item.props.columns || []).map((c) => c.name).filter(Boolean).join('・');
  return [cols && `列＝${cols}`, text].filter(Boolean).join('\n');
}

// 表の部品の列（描くときと、一覧表の枝番の行に使う）。{ id, name, type, kind（部品の種類の名前）, setting（設定の文） }
function tableColumns(p, ctx = null) {
  const pr = p.props || {};
  if (p.tableKind === 'subtable') {
    return (pr.columns || []).map((c) => ({ id: c.id, name: c.name, type: c.type, kind: partTypeName(c.type), setting: describePart({ type: c.type, required: c.required, memo: c.memo, props: c.props }) }));
  }
  const design = ctx && ctx.design;
  const src = p.tableKind === 'related' ? (ctx && pr.db && pr.db.designId ? findDesign(ctx.state, pr.db.designId) : null) : design;
  return (pr.columns || []).map((c) => {
    const it = src && c.ref.itemId ? findItem(src, c.ref.itemId) : null;
    const setting = p.tableKind === 'related' ? `${ctx ? dbLabel(ctx.state, pr.db) : ''}の項目` : it ? describeItem(it, ctx) : '';
    return { id: c.id, name: it ? it.name : c.ref.name || '（項目を選んでいません）', type: it ? it.type : 'text1', kind: it ? itemTypeName(it.type) : '－', setting };
  });
}

// 一覧表の「項目名」の列。説明の文字は 1 行目の初めの 20 文字。名前がなければ部品の種類
function partTitle(p) {
  const first = String(p.label == null ? '' : p.label).split('\n')[0].trim();
  if (!first) return partTypeName(p.type);
  return p.type === 'desc' && first.length > 20 ? first.slice(0, 20) + '…' : first;
}

// 部品の設定の一覧表の行（番号の付いた部品だけを番号の順に）。design を渡すと、部品が指す項目の中身で書く
function tableRows(screen, design = null, state = null) {
  const ctx = design && state ? { design, state } : null;
  // 表の部品は、表の行の下に、列ごとの行を枝番（3-1・3-2）で並べる（仕様_細かい決めごと.md の「部品の細かい決めごと（後半）」）
  return screen.parts
    .filter((p) => p.no != null)
    .sort((a, b) => a.no - b.no)
    .flatMap((raw) => {
      const p = design ? resolvePart(design, raw) : raw;
      const kind = p.type === 'table' ? `表（${TABLE_KINDS[p.tableKind] || 'テーブル'}）` : partTypeName(p.type);
      const row = { id: p.id, no: p.no, label: partTitle(p), kind, setting: describePart(p, ctx) };
      if (p.type !== 'table') return [row];
      return [row, ...tableColumns(p, ctx).map((c, i) => ({ id: p.id, no: `${p.no}-${i + 1}`, label: c.name, kind: c.kind, setting: c.setting, branch: true }))];
    });
}

// 部品のいちばん下の端より画面を低くしない（下の縁のドラッグで部品が切れないため）。機器の 1 画面分から 8 ドットずつ
function minScreenHeight(screen) {
  const min = DEVICES[screen.device].height;
  const bottom = screen.parts.reduce((m, p) => Math.max(m, p.y + p.h), 0);
  return bottom <= min ? min : min + Math.ceil((bottom - min) / GRID) * GRID;
}

// ── 改訂履歴（第 6 段階。仕様_細かい決めごと.md の「改訂履歴の細かい決めごと」）──
// 画面設計の revisions の行: { id, kind, no, date, note, schemaVersion, appVersion, snapshot, changes, baseNo }
//   kind: 'revision'（改訂する。no に版の番号）・'import'（取り込む前の状態）・'restore'（戻す前の状態）・'ai'（AI が直す前の状態。第 7 段階）。
//     自動の行（import・restore・ai）の no は null。
//   snapshot: revisions を除いた画面設計の写し。ほかのモックから取り込んだ項目も、そのときの中身のまま写る（後で元が変わっても、前の版の中身は変わらない）。

//   changes: 改訂したときに、ひとつ前の版（第 baseNo 版）と比べて作った変更内容の一覧（designDiff の rows）。第 1 版と、前の版の写しがないときは null

const versionRows = (d) => d.revisions.filter(isVersionRow);
const latestVersion = (d) => versionRows(d).reduce((m, r) => (!m || r.no > m.no ? r : m), null);
// 次の版の番号。消した版の番号は付け直さないが、いちばん新しい版を消したときは、その番号をもう一度使う（Claude が決めた）
const nextVersionNo = (d) => (latestVersion(d) ? latestVersion(d).no + 1 : 1);
const revisionTitle = (r) => (isVersionRow(r) ? `第 ${r.no} 版` : REV_AUTO[r.kind] || '自動で残した状態');
const revisionDay = (r) => fmtDateTime(r.date).slice(0, 10);
const findRevision = (d, id) => (d && id ? d.revisions.find((r) => isObj(r) && r.id === id) || null : null);
const todayDay = () => fmtDateTime(nowIso()).slice(0, 10);
// 日付の欄（YYYY-MM-DD）から行の日時を作る。今日なら今の日時、ほかの日ならその日の昼（時差で日付がずれないように）
function revisionDate(day) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str(day)) || day === todayDay()) return nowIso();
  const t = new Date(`${day}T12:00:00`);
  return Number.isNaN(t.getTime()) ? nowIso() : t.toISOString();
}

// 画面設計の中身（前の版に戻す・取り込んで置き換える・中身を比べるところ）。画面設計に中身の項目を足したら、ここに足す
// （restoreRevision・replaceWithImported・designContent がこれを使う。3 か所に並べていると、足すときに漏れるため。第 7 段階）
const DESIGN_CONTENT_KEYS = ['name', 'target', 'description', 'items', 'screens', 'mapPos', 'processPos', 'flowPos'];
// 画面設計の中身だけを抜き出す。copy のときは中身を写す
function designContentOf(d, copy = false) {
  const out = {};
  DESIGN_CONTENT_KEYS.forEach((k) => { out[k] = copy && d[k] !== undefined ? clone(d[k]) : d[k]; });
  return out;
}
// 改訂履歴に残す写し（revisions を除いた画面設計）。凍らせて、元に戻すの履歴・保存では写さずに同じものを指す（stateWithRefs）
function designSnapshot(d) {
  return deepFreeze(clone({ ...d, revisions: undefined }));
}
function revisionRow(d, kind, { no = null, note = '', date = nowIso(), changes = null, baseNo = null } = {}) {
  return { id: newId('r'), kind, no, date, note, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, snapshot: designSnapshot(d), changes, baseNo };
}
// 写しから、見る・戻す・比べるための画面設計を作る（今の形に直す。id は今の画面設計のまま）
function designFromSnapshot(d, r) {
  return normalizeDesign({ ...clone(r.snapshot), id: d.id, revisions: [] });
}
// 「改訂する」で残す変更内容の一覧。ひとつ前の版（いちばん新しい版）と今を比べる。前の版がない・写しがないときは null
function changesSinceLatest(d, state) {
  const prev = latestVersion(d);
  if (!prev || !hasSnapshot(prev)) return { changes: null, baseNo: prev ? prev.no : null };
  return { changes: designDiff(designFromSnapshot(d, prev), d, state).rows, baseNo: prev.no };
}

// ── 前の版と今の違い（変更内容の一覧と「新」「変」の印）──
// 部品・吹き出し・画面・項目は id で突き合わせる。「変」は、設定・位置・大きさのどれかが変わったもの（ユーザー指示）
const DIFF_CLIP = 40;
const clipText = (s, n = DIFF_CLIP) => {
  const t = String(s == null ? '' : s).replace(/\s*\n\s*/g, '／').trim();
  if (!t) return 'なし';
  return t.length > n ? t.slice(0, n) + '…' : t;

const fromTo = (label, a, b) => `${label}：${clipText(a)} → ${clipText(b)}`;
const LABEL_WORDS = { heading: '文字', desc: '文字', button: 'ボタンの文字', link: '文字' };
const LABEL_POS = { top: '上', left: '左' };
// 比べない名前の控え（{ itemId, name }・{ designId, name } の name）を外す。名前は今の名前で引いて書くので、控えの古さを違いにしない
function stripNameCaches(v) {
  if (Array.isArray(v)) return v.map(stripNameCaches);
  if (!isObj(v)) return v;
  const out = {};
  Object.keys(v).forEach((k) => {
    if (k === 'name' && (str(v.itemId) || str(v.designId))) return;
    out[k] = stripNameCaches(v[k]);
  });
  return out;
}
// 部品の、比べるための中身（項目の中身と合わせる）
function partFacts(design, raw, state) {
  const p = resolvePart(design, raw);
  const ctx = { design, state };
  const own0 = clone(raw);
  ['id', 'x', 'y', 'w', 'h', 'no'].forEach((k) => delete own0[k]);
  const item = p.item ? { name: p.item.name, type: p.item.type, required: p.item.required, memo: p.item.memo, props: p.item.props, lookup: p.item.lookup } : null;
  return {
    p, no: p.no, title: partTitle(p), label: str(p.label), orphan: isOrphanPart(design, raw),
    kind: p.type === 'table' ? `表（${TABLE_KINDS[p.tableKind] || 'テーブル'}）` : partTypeName(p.type),
    lines: describePartLines(p, ctx), setting: describePart(p, ctx),
    columns: p.type === 'table' ? tableColumns(p, ctx).map((c) => `${c.name}（${c.kind}）`).join('・') : '',
    all: canonicalJson(stripNameCaches({ own: own0, item })),

}
// 設定の文の違い（「条件：なし → 必須」「選択肢：A → B」「メモ：…」）
function settingChanges(a, b) {
  const out = [];
  if (a.short !== b.short) out.push(fromTo('条件', a.short, b.short));
  // 「＝」より前を鍵にして、前後の行を突き合わせる。同じ鍵の行（同じ名前の操作など）は、鍵ごとに並びの順で突き合わせる
  const map = (eq) => {
    const m = new Map();
    eq.forEach((line) => {
      const i = line.indexOf('＝');
      const [k, v] = i < 0 ? [line, ''] : [line.slice(0, i), line.slice(i + 1)];
      m.set(k, [...(m.get(k) || []), v]);
    });
    return m;
  };
  const [ma, mb] = [map(a.eq), map(b.eq)];
  [...new Set([...ma.keys(), ...mb.keys()])].forEach((k) => {
    const [va, vb] = [ma.get(k) || [], mb.get(k) || []];
    for (let i = 0; i < Math.max(va.length, vb.length); i++) if (va[i] !== vb[i]) out.push(fromTo(k, va[i], vb[i]));
  });
  if (a.memo !== b.memo) out.push(fromTo('メモ', a.memo, b.memo));
  return out;
}
// 部品 1 つの違い。戻り値 [{ change, text }]（設定変更・位置変更・大きさ変更）。違いがなければ []
function partChanges(fa, fb) {
  const [a, b] = [fa.p, fb.p];
  const out = [];
  const set = [];
  if (fa.orphan !== fb.orphan) set.push(fb.orphan ? 'データベースの項目の一覧表から消した（この部品は、消したときの中身で残っている）' : 'データベースの項目の一覧表に戻した');
  if (fa.label !== fb.label) set.push(fromTo(LABEL_WORDS[b.type] || '項目名', fa.label, fb.label));
  if (fa.kind !== fb.kind) set.push(fromTo('部品の種類', fa.kind, fb.kind));
  if (fa.no !== fb.no) set.push(fromTo('番号', fa.no, fb.no));
  set.push(...settingChanges(fa.lines, fb.lines));
  if (fa.columns !== fb.columns) set.push(fromTo('列', fa.columns, fb.columns));
  if (str(a.labelPos) !== str(b.labelPos) && partType(b.type) && partType(b.type).input) set.push(fromTo('項目名の位置', LABEL_POS[a.labelPos], LABEL_POS[b.labelPos]));
  if (str(a.sample) !== str(b.sample)) set.push(fromTo('見本の値', a.sample, b.sample));
  if (str(a.placeholder) !== str(b.placeholder)) set.push(fromTo('薄い字', a.placeholder, b.placeholder));
  if (canonicalJson(a.view || null) !== canonicalJson(b.view || null)) set.push('見本（行の数・見本の値・出すステータス）を変えた');
  if (!set.length && fa.all !== fb.all) set.push('そのほかの設定を変えた');
  if (set.length) out.push({ change: '設定変更', text: set.join('\n') });
  if (a.x !== b.x || a.y !== b.y) out.push({ change: '位置変更', text: `左 ${a.x}・上 ${a.y} → 左 ${b.x}・上 ${b.y}` });
  if (a.w !== b.w || a.h !== b.h) out.push({ change: '大きさ変更', text: `幅 ${a.w}・高さ ${a.h} → 幅 ${b.w}・高さ ${b.h}` });
  return out;
}
const calloutTitle = (c) => `吹き出し「${clipText(c.text, 12)}」`;
const CALLOUT_TIP_NAMES = { dot: '点', arrow: '矢印', none: 'なし' };
function calloutChanges(a, b, sa, sb, base, cur, state) {
  const out = [];
  const set = [];
  const target = (s, design, id) => { const p = findPart(s, id); return p ? partTitle(resolvePart(design, p)) : ''; };
  if (a.text !== b.text) set.push(fromTo('文字', a.text, b.text));
  if (a.color !== b.color) set.push(fromTo('色', (CALLOUT_COLORS[a.color] || [])[0], (CALLOUT_COLORS[b.color] || [])[0]));
  if (a.tip !== b.tip) set.push(fromTo('線の先', CALLOUT_TIP_NAMES[a.tip], CALLOUT_TIP_NAMES[b.tip]));
  if (str(a.target) !== str(b.target)) set.push(fromTo('つなぐ部品', target(sa, base, a.target), target(sb, cur, b.target)));
  if (set.length) out.push({ change: '設定変更', text: set.join('\n') });
  if (a.x !== b.x || a.y !== b.y) out.push({ change: '位置変更', text: `左 ${a.x}・上 ${a.y} → 左 ${b.x}・上 ${b.y}` });
  if (a.w !== b.w || a.h !== b.h) out.push({ change: '大きさ変更', text: `幅 ${a.w}・高さ ${a.h} → 幅 ${b.w}・高さ ${b.h}` });
  return out;
}
const byNoThenPos = (a, b) => (a.no == null) - (b.no == null) || (a.no || 0) - (b.no || 0) || a.y - b.y || a.x - b.x;
// 画面 1 つの違い（同じ id の画面どうし）
function screenDiff(base, cur, sa, sb, state, rows) {
  const info = { isNew: false, parts: {}, callouts: {}, deleted: [], counts: { new: 0, chg: 0, del: 0 } };
  const row = (no, name, k, change, text) => rows.push({ screen: sb.name, no: no == null ? '－' : String(no), name, k, change, text });
  const set = [];
  if (sa.name !== sb.name) set.push(fromTo('画面の名前', sa.name, sb.name));
  if (sa.device !== sb.device) set.push(fromTo('機器', DEVICES[sa.device].label, DEVICES[sb.device].label));
  if (sa.height !== sb.height) set.push(fromTo('高さ', sa.height, sb.height));
  if (sa.showHeader !== sb.showHeader) set.push(fromTo('帯', sa.showHeader ? 'あり' : 'なし', sb.showHeader ? 'あり' : 'なし'));
  if (sa.tablePos !== sb.tablePos) set.push(fromTo('一覧表の位置', sa.tablePos === 'bottom' ? '下' : '右', sb.tablePos === 'bottom' ? '下' : '右'));
  if (set.length) row(null, '－', 'chg', '画面の設定変更', set.join('\n'));
  [...sb.parts].sort(byNoThenPos).forEach((p) => {
    const fb = partFacts(cur, p, state);
    const old = findPart(sa, p.id);
    if (!old) {
      info.parts[p.id] = 'new';
      info.counts.new++;
      row(p.no, fb.title, 'add', '追加', `${fb.kind}を足した${fb.lines.short ? `（${fb.lines.short}）` : ''}`);
      return;
    }
    const ch = partChanges(partFacts(base, old, state), fb);
    if (!ch.length) return;
    info.parts[p.id] = 'chg';
    info.counts.chg++;
    ch.forEach((c) => row(p.no, fb.title, 'chg', c.change, c.text));
  });
  sb.callouts.forEach((c) => {
    const old = findCallout(sa, c.id);
    if (!old) {
      info.callouts[c.id] = 'new';
      info.counts.new++;
      row(null, calloutTitle(c), 'add', '追加', '吹き出しを足した');
      return;
    }
    const ch = calloutChanges(old, c, sa, sb, base, cur, state);
    if (!ch.length) return;
    info.callouts[c.id] = 'chg';
    info.counts.chg++;
    ch.forEach((x) => row(null, calloutTitle(c), 'chg', x.change, x.text));
  });
  [...sa.parts].filter((p) => !findPart(sb, p.id)).sort(byNoThenPos).forEach((p) => {
    const fa = partFacts(base, p, state);
    info.deleted.push({ no: p.no, title: fa.title, kind: fa.kind, setting: fa.setting });
    info.counts.del++;
    row(p.no == null ? null : `（${p.no}）`, fa.title, 'del', '削除', `${fa.kind}を消した${p.no == null ? '' : '（番号は前の版のもの）'}`);
  });
  sa.callouts.filter((c) => !findCallout(sb, c.id)).forEach((c) => {
    info.counts.del++;
    row(null, calloutTitle(c), 'del', '削除', '吹き出しを消した');
  });
  return info;
}
// 前の版（base）と今（cur）の違い。戻り値 { rows, screens, counts }
//   rows: 変更内容の一覧の行 { screen（画面の名前・「画面設計」・「データベースの項目」）, no, name, k（'add'|'chg'|'del'）, change（追加・設定変更…）, text }
//   screens: { 今の画面の id: { isNew, parts: { 部品の id: 'new'|'chg' }, callouts: { 吹き出しの id: 'new'|'chg' }, deleted: [{ no, title, kind, setting }], counts } }
//   counts: { new, chg, del }（部品と吹き出しの数。画面の追加・削除は数えない）
// 両方を読み込むときと同じ形に直してから比べる（項目を消した後に残った部品・スマホの画面の高さなど、直すと形が変わる所を違いにしないため）
function designDiff(base0, cur0, state) {
  const [base, cur] = [base0, cur0].map((x) => normalizeDesign(clone({ ...x, revisions: [] })));
  const rows = [];
  const design = [];
  if (base.name !== cur.name) design.push(fromTo('名前', base.name, cur.name));
  if (base.target !== cur.target) design.push(fromTo('作る先', targetLabel(base.target), targetLabel(cur.target)));
  if (base.description !== cur.description) design.push(fromTo('説明', base.description, cur.description));
  if (design.length) rows.push({ screen: '画面設計', no: '－', name: '－', k: 'chg', change: '設定変更', text: design.join('\n') });
  // 画面の順番は、両方にある画面どうしの並びで比べる（足した・消した画面は、画面の追加・削除の行に出る）
  const common = (a, b) => a.screens.filter((s) => b.screens.some((x) => x.id === s.id));
  const [oa, ob] = [common(base, cur), common(cur, base)];
  if (oa.some((s, i) => s.id !== ob[i].id)) {
    rows.push({ screen: '画面設計', no: '－', name: '－', k: 'chg', change: '画面の順番', text: `${oa.map((s) => s.name).join('・')} → ${ob.map((s) => s.name).join('・')}` });
  }
  const screens = {};
  const counts = { new: 0, chg: 0, del: 0 };
  cur.screens.forEach((sb) => {
    const sa = base.screens.find((x) => x.id === sb.id);
    if (!sa) {
      screens[sb.id] = { isNew: true, parts: {}, callouts: {}, deleted: [], counts: { new: 0, chg: 0, del: 0 } };
      rows.push({ screen: sb.name, no: '－', name: '－', k: 'add', change: '画面の追加', text: `「${sb.name}」の画面を足した（部品 ${sb.parts.length} 個）` });
      return;
    }
    const info = screenDiff(base, cur, sa, sb, state, rows);
    screens[sb.id] = info;
    Object.keys(counts).forEach((k) => { counts[k] += info.counts[k]; });
  });
  base.screens.filter((sa) => !cur.screens.some((x) => x.id === sa.id)).forEach((sa) => {
    rows.push({ screen: sa.name, no: '－', name: '－', k: 'del', change: '画面の削除', text: `「${sa.name}」の画面を消した（部品 ${sa.parts.length} 個）` });
  });
  rows.push(...itemDiffRows(base, cur, state));
  return { rows, screens, counts };
}
// データベースの項目の違い。項目の中身の違いは、前の版と今の両方で同じ画面の同じ部品に置いてある項目なら、その部品の行に出す。
// それ以外（どの画面にも置いていない・置き方が変わった項目）は、項目どうしで比べてこの行に出す。
// 項目を消したときは、画面に置いていたかに関係なく削除の行を出す（置いていた部品は、消したときの中身で画面に残る）
function itemDiffRows(base, cur, state) {
  const rows = [];
  const spots = (design, id) => design.screens.flatMap((s) => s.parts.filter((p) => p.itemId === id).map((p) => `${s.id}/${p.id}`));
  const onSamePart = (id) => { const a = new Set(spots(base, id)); return spots(cur, id).some((k) => a.has(k)); };
  const facts = (design, it) => ({ name: it.name, kind: itemTypeName(it.type), lines: describePartLines({ type: it.type, tableKind: 'subtable', required: it.required, memo: it.memo, props: it.props, item: it }, { design, state }), all: canonicalJson(stripNameCaches({ type: it.type, required: it.required, memo: it.memo, props: it.props, lookup: it.lookup })) });
  const row = (name, k, change, text) => rows.push({ screen: 'データベースの項目', no: '－', name, k, change, text });
  cur.items.forEach((it) => {
    const old = findItem(base, it.id);
    const fb = facts(cur, it);
    if (!old) {
      if (!spots(cur, it.id).length) row(it.name, 'add', '追加', `${fb.kind}（どの画面にも置いていない）`); // 置いた項目は、部品の「追加」の行に出る
      return;
    }
    if (onSamePart(it.id)) return;
    const fa = facts(base, old);
    const set = [];
    if (fa.name !== fb.name) set.push(fromTo('項目名', fa.name, fb.name));
    if (fa.kind !== fb.kind) set.push(fromTo('部品の種類', fa.kind, fb.kind));
    set.push(...settingChanges(fa.lines, fb.lines));
    if (!set.length && fa.all !== fb.all) set.push('そのほかの設定を変えた');
    if (set.length) row(it.name, 'chg', '設定変更', set.join('\n'));
  });
  base.items.filter((it) => !findItem(cur, it.id)).forEach((it) => {
    const left = spots(cur, it.id).length > 0;
    row(it.name, 'del', '削除', `${itemTypeName(it.type)}を消した${left ? '（画面に置いた部品は、消したときの中身で残っている）' : ''}`);
  });
  return rows;
}

// ── 読み込んだデータを今の形に直す ──
// 足りない項目を補い、知らない項目はそのまま残す（新しい版で足した項目を消さないため）。
const numOr = (v, d) => (v !== null && v !== '' && Number.isFinite(Number(v)) ? Number(v) : d);

// items はその画面設計の項目（直した後のもの）。項目を指していない入力欄の部品（データの形の版 1 の部品）は、
// 部品が持っていた項目名と設定から項目を 1 つ作って items に足し、その項目を指す部品にする
function normalizePart(src, items = []) {
  const p = isObj(src) ? src : {};
  const t = partType(p.type);
  const no = Number(p.no);
  const base = {
    ...p,
    id: str(p.id) || newId('p'),
    type: str(p.type) || 'unknown',
    x: numOr(p.x, 0),
    y: numOr(p.y, 0),
    w: Math.max(PART_MIN, numOr(p.w, t ? t.w : 160)),
    h: Math.max(PART_MIN, numOr(p.h, t ? t.h : 64)),
    no: p.no != null && p.no !== '' && Number.isInteger(no) && no > 0 ? no : null,
  };
  if (!t) return base; // 知らない種類（新しい版で足した部品）は、中身をそのまま残す
  const common = { ...base, labelPos: p.labelPos === 'left' ? 'left' : 'top', sample: str(p.sample), placeholder: str(p.placeholder) };
  if (base.type === 'table') {
    common.tableKind = own(TABLE_KINDS, p.tableKind) ? p.tableKind : str(p.itemId) ? 'subtable' : 'records';
    common.view = normalizeTableView(p.view);
  }
  if (base.type === 'status' || base.type === 'steps') common.view = { ...(isObj(p.view) ? p.view : {}), current: str(p.view && p.view.current), showWord: !(p.view && p.view.showWord === false) };
  const itemType = partItemType(common);
  const fields = {
    label: typeof p.label === 'string' ? p.label : t.label,
    required: !!p.required,
    memo: str(p.memo),
    props: itemType && !isInputType(itemType) ? normalizeItemProps(itemType, p.props)
      : base.type === 'table' ? normalizeTablePartProps(p.props) : keepInitialInOptions(base.type, normalizeProps(t, p.props)),
  };
  if (!itemType) {
    const { itemId: _drop, ...rest } = common;
    return { ...rest, ...fields };
  }
  const itemId = str(p.itemId);
  if (!itemId) {
    // 項目を指していない部品（データの形の版 1 の入力欄の部品など）は、部品の中身から項目を作る。
    // ステータスの部品は、画面設計にステータスの項目があればそれを指す
    const found = itemType === 'status' ? items.find((it) => it.type === 'status') : null;
    const item = found || normalizeItem({ name: fields.label, type: itemType, required: fields.required, memo: fields.memo, props: fields.props });
    if (!found) items.push(item);
    return withStateView(withoutItemFields({ ...common, itemId: item.id }), item.props);
  }
  // 指している項目があれば、項目名と設定は項目のものを使う。なければ（項目を一覧表から消した後）、部品が持っている中身で描く
  const target = items.find((it) => it.id === itemId);
  if (target) return withStateView(withoutItemFields({ ...common, itemId }), target.props);
  return withStateView({ ...common, itemId, ...fields, lookup: isInputType(itemType) ? normalizeLookup(p.lookup) : null, link: normalizeLink(p.link) }, fields.props);
}
// ステータスの印・進み具合の矢印の、見本で出すステータス（view.current）を、ステータスの id にそろえる（データの形の版 2 では名前で持っていた）。
// 並びにない値は消さずに残す（版 2 で並びの名前を変えた後に残った名前。版 2 の出力の印と比べるときに、中身が変わらないように）
function withStateView(part, props) {
  if (!part.view || !('current' in part.view) || !isObj(props) || !Array.isArray(props.states)) return part;
  return { ...part, view: { ...part.view, current: resolveStateRef(props.states, part.view.current) || part.view.current } };
}

function withoutItemFields(p) {
  const { label, required, memo, props, lookup, link, ...rest } = p;
  return rest;
}
function withoutItemFieldsInPlace(p) {
  ['label', 'required', 'memo', 'props', 'lookup', 'link'].forEach((k) => { delete p[k]; });
  return p;
}

function normalizeItem(src) {
  const it = isObj(src) ? src : {};
  const type = str(it.type) || 'text1';
  return {
    ...it,
    id: str(it.id) || newId('i'),
    name: typeof it.name === 'string' ? it.name : isItemType(type) ? createItemData(type).name : '項目名',
    type,
    required: !!it.required,
    memo: str(it.memo),
    // 知らない種類の項目（新しい版で足した項目）は、設定をそのまま残す
    props: isItemType(type) ? normalizeItemProps(type, it.props) : isObj(it.props) ? it.props : {},
    lookup: normalizeLookup(it.lookup),
    link: normalizeLink(it.link),
  };
}

// 項目の種類ごとの設定を直す。表（テーブル）は列（{ id, name, type, required, memo, props }）、ステータスはステータスの並び
function normalizeItemProps(type, src) {
  const props = isObj(src) ? { ...src } : {};
  if (type === 'table') return { ...props, columns: (Array.isArray(props.columns) ? props.columns : []).filter(isObj).map(normalizeColumn) };
  if (type === 'status') {
    const states = normalizeStates(props.states);
    return { ...props, states, actions: normalizeActions(props.actions, states) };
  }
  return keepInitialInOptions(type, normalizeProps(partType(type), props));
}

// ── ステータスと操作（プロセス管理。データの形の版 3・第 8 段階）──
// ステータスは { id, name }。操作は { id, name, from, to, role, cond }（from・to はステータスの id。role は操作する人、cond は条件）。
// データの形の版 2 の文字のステータスには、名前から id を作る（毎回同じ id になるように。改訂履歴の版 2 の写しと今を比べるとき・
// 版 2 で出力した HTML を取り込むとき・取り込んだ項目で、同じステータスが同じ id になる）。同じ名前の 2 つ目からは「-2」「-3」を付ける。
// 版 3 で新しく足すステータスは newId('t')、操作は newId('a')
function stateIdFromName(name, seen) {
  const base = 't-' + shortHash(name);
  let id = base;
  for (let k = 2; seen.has(id); k++) id = base + '-' + k;
  return id;
}
function normalizeStates(src) {
  const seen = new Set();
  const out = [];
  (Array.isArray(src) ? src : []).forEach((s) => {
    const obj = isObj(s) ? s : typeof s === 'string' ? { name: s } : null;
    const name = obj && typeof obj.name === 'string' ? obj.name : '';
    if (!name.trim()) return;
    let id = str(obj.id);
    if (!id || seen.has(id)) id = stateIdFromName(name, seen);
    seen.add(id);
    out.push({ ...obj, id, name });
  });
  return out.length ? out : normalizeStates(DEFAULT_STATES);
}
// 操作の前と次は、ステータスの id か名前で書ける（名前は id に直す）。並びにないものは ''。id がない操作には、中身から id を作る
function normalizeActions(src, states) {
  const seen = new Set();
  return (Array.isArray(src) ? src : []).filter(isObj).map((a, i) => {
    const name = typeof a.name === 'string' ? a.name : '';
    let id = str(a.id);
    if (!id || seen.has(id)) {
      const base = 'a-' + shortHash([name, str(a.from), str(a.to), i].join('|'));
      id = base;
      for (let k = 2; seen.has(id); k++) id = base + '-' + k;
    }
    seen.add(id);
    return { ...a, id, name, from: resolveStateRef(states, a.from), to: resolveStateRef(states, a.to), role: str(a.role), cond: str(a.cond) };
  });
}
// ステータスの id か名前（v）を、並び states の id にする。見つからなければ ''。
// fromStates（元の並び）を渡すと、元の並びのステータスの名前で当て直す（ほかの画面設計へ貼り付けた部品の見本・項目の一覧表に戻した部品など）
function resolveStateRef(states, v, fromStates = null) {
  const list = Array.isArray(states) ? states.filter(isObj) : [];
  const ref = str(v);
  if (!ref) return '';
  // 元の並び（fromStates。ほかの画面設計から貼り付けたときなど）があれば、元のステータスの名前で当て直すのを先にする
  // （画面設計の複製や版 2 から直した並びは、画面設計をまたいで同じ id なので、名前を変えた後は id で当てると違うステータスになる）
  const was = Array.isArray(fromStates) ? fromStates.find((s) => isObj(s) && s.id === ref) : null;
  const again = was ? list.find((s) => s.name === was.name) : null;
  if (again) return again.id;
  if (list.some((s) => s.id === ref)) return ref;
  const byName = list.find((s) => s.name === ref);
  return byName ? byName.id : '';
}
const stateNames = (states) => (Array.isArray(states) ? states : []).map((s) => (isObj(s) ? s.name : String(s)));
// ステータスの名前（id か名前で指す）。並びになければ ''
function stateNameOf(states, v) {
  const id = resolveStateRef(states, v);
  const s = id ? states.find((x) => x.id === id) : null;
  return s ? s.name : '';
}
// 部品を置いたときに見本で出すステータス（2 つ目。なければ 1 つ目）
const defaultStateId = (item) => {
  const states = (item && item.props && item.props.states) || [];
  return (states[1] || states[0] || {}).id || '';
};
const stateIdsOf = (item) => (item && isObj(item.props) && Array.isArray(item.props.states) ? item.props.states.map((s) => s.id) : []);
// ステータスの並びを名前の並びで置き換えた設定。同じ名前のステータスは今の id を残し、なくなったステータスを使う操作は消す。
// 戻り値 { props, removed（消した操作）}。名前が 1 つもないときは、今のまま
function statePropsFromNames(props, names) {
  const list = (Array.isArray(names) ? names : []).map((n) => String(n == null ? '' : n)).filter((n) => n.trim());
  if (!list.length) return { props, removed: [] };
  const pool = [...(props.states || [])];
  const states = normalizeStates(list.map((n) => {
    const i = pool.findIndex((s) => s.name === n);
    return i >= 0 ? pool.splice(i, 1)[0] : { id: newId('t'), name: n };
  }));
  const ids = new Set(states.map((s) => s.id));
  const keep = (v) => !v || ids.has(v);
  const actions = Array.isArray(props.actions) ? props.actions : [];
  return {
    props: { ...props, states, actions: normalizeActions(actions.filter((a) => keep(a.from) && keep(a.to)), states) },
    removed: actions.filter((a) => !(keep(a.from) && keep(a.to))),
  };
}
// ステータスの項目の並びを変えた後、なくなったステータスを見本で出していた部品を「なし」（''）にする（この画面設計の部品だけ）
function clearGoneStates(design, item, beforeIds) {
  const now = new Set(stateIdsOf(item));
  const gone = beforeIds.filter((id) => !now.has(id));
  if (!gone.length) return;
  design.screens.forEach((s) => s.parts.forEach((p) => {
    if (p.itemId === item.id && p.view && gone.includes(p.view.current)) p.view.current = '';
  }));
}
function normalizeColumn(src) {
  const type = isInputType(src.type) ? src.type : 'text1';
  return {
    ...src, id: str(src.id) || newId('c'), name: typeof src.name === 'string' ? src.name : '列', type,
    required: !!src.required, memo: str(src.memo), props: keepInitialInOptions(type, normalizeProps(partType(type), src.props)),
  };
}
// レコード一覧・関連レコード一覧の設定（列は { id, ref: 項目の参照 }）
function normalizeTablePartProps(src) {
  const props = isObj(src) ? { ...src } : {};
  const cond = isObj(props.cond) ? props.cond : {};
  return {
    ...props,
    columns: (Array.isArray(props.columns) ? props.columns : []).filter(isObj).map((c) => ({ ...c, id: str(c.id) || newId('c'), ref: normalizeRef(c.ref) })),
    sort: str(props.sort), perPage: str(props.perPage), limit: str(props.limit),
    db: normalizeDb(props.db),
    cond: { ...cond, from: normalizeRef(cond.from), to: normalizeRef(cond.to) },

}
// 表の部品の、この画面だけの設定（見本の行の数・列ごとの見本の値・列の幅）
function normalizeTableView(src) {
  const v = isObj(src) ? src : {};
  const rows = Math.round(numOr(v.rows, 3));
  const samples = {};
  if (isObj(v.samples)) Object.entries(v.samples).forEach(([k, a]) => { if (Array.isArray(a)) samples[k] = a.map((x) => String(x == null ? '' : x)); });
  const widths = {};
  if (isObj(v.widths)) Object.entries(v.widths).forEach(([k, w]) => { if (Number.isFinite(Number(w)) && Number(w) > 0) widths[k] = Math.round(Number(w)); });
  return { ...v, rows: Math.min(20, Math.max(1, rows || 3)), samples, widths };
}

// ルックアップ（ほかのデータベースのレコードから値を引いて入れる。画像 q22 の案A）。探すときに使う項目（例: 取引先コード）の lookup に、
//   { db: { designId, name, free }, key: 項目の参照, copies: [{ from: 項目の参照, to: 項目の参照 }] } をまとめて持つ。
//   db はルックアップ元のデータベース。designId は最初の画面に並ぶ画面設計の id。一覧にないデータベースは designId を null、free を true にして name に名前を書く。
//   項目の参照は { itemId, name }。key と from はルックアップ元の項目（一覧にないデータベースでは itemId が null で、name だけ）。
//   to は、一緒に写す先のこの画面設計の項目。name は名前の控え（項目が見つからないときに出す）。
// ルックアップの設定を書けるのは、テキスト（1行）と数値の項目（kintone のルックアップと同じく、値で探せる種類）
const LOOKUP_TYPES = ['text1', 'number'];
const emptyRef = () => ({ itemId: null, name: '' });
const normalizeRef = (r) => (isObj(r) ? { ...r, itemId: str(r.itemId) || null, name: str(r.name) } : emptyRef());
const normalizeDb = (src) => {
  const db = isObj(src) ? src : {};
  return { ...db, designId: str(db.designId) || null, name: str(db.name), free: !!db.free };
};
function normalizeLookup(src) {
  if (!isObj(src)) return null;
  return {
    ...src,
    db: normalizeDb(src.db),
    key: normalizeRef(src.key),
    copies: (Array.isArray(src.copies) ? src.copies : []).filter(isObj).map((c) => ({ ...c, from: normalizeRef(c.from), to: normalizeRef(c.to) })),
  };
}
// ルックアップ元のデータベースの名前と、参照している項目の名前（項目が見つからないときは控えの名前）
function dbLabel(state, db) {
  const d = db && db.designId ? findDesign(state, db.designId) : null;
  return (d ? d.name : db && db.name) || '（データベースを選んでいません）';
}
function refLabel(design, ref) {
  const it = design && ref && ref.itemId ? findItem(design, ref.itemId) : null;
  return (it ? it.name : ref && ref.name) || '（項目を選んでいません）';
}
const refMatches = (ref, item) => (ref.itemId ? ref.itemId === item.id : !!ref.name && ref.name === item.name);
// その項目が、同じ画面設計のどれかの項目のルックアップで「一緒に写される」項目なら { key（探す項目）, copy } を返す
function lookupCopyOf(design, item) {
  for (const k of design.items) {
    if (k === item || !k.lookup) continue;
    const copy = k.lookup.copies.find((c) => refMatches(c.to, item));
    if (copy) return { key: k, copy };
  }
  return null;
}
// 一覧表の「設定」に足すルックアップの文（画像 q22）。p は項目と合わせた部品か、項目を部品の形にしたもの
function lookupLines({ design, state }, p) {
  const lk = p.item ? p.item.lookup : p.lookup; // 項目を一覧表から消した後の部品は、消したときのルックアップ
  if (lk) {
    const src = lk.db.designId ? findDesign(state, lk.db.designId) : null;
    const db = dbLabel(state, lk.db);
    const lines = [`ルックアップ＝${db}の「${refLabel(src, lk.key)}」で探す`];
    const copies = lk.copies.filter((c) => c.from.itemId || c.from.name || c.to.itemId || c.to.name);
    if (copies.length) lines.push('一緒に写す＝' + copies.map((c) => `${refLabel(src, c.from)} → ${refLabel(design, c.to)}`).join('、'));
    return lines;
  }
  const role = p.item ? lookupCopyOf(design, p.item) : null;
  if (!role) return [];
  const klk = role.key.lookup;
  const src = klk.db.designId ? findDesign(state, klk.db.designId) : null;
  return [`ルックアップ＝${dbLabel(state, klk.db)}の「${refLabel(src, role.copy.from)}」（${role.key.name}で引く）`];
}

// 取り込んだ元 { designId, itemId, designName, lost }。designName は元の画面設計の名前の控え（元がなくなったときに出す）。
// lost は、元の画面設計を完全に削除したか、元の画面設計でその項目を消したとき true（そのときの中身で固定している）
function normalizeLink(src) {
  if (!isObj(src) || !str(src.designId) || !str(src.itemId)) return null;
  return { ...src, designId: str(src.designId), itemId: str(src.itemId), designName: str(src.designName), lost: !!src.lost };
}

// 取り込んだ項目に写す、元の項目の中身（取り込んだ側では直せない中身）
const LINKED_FIELDS = ['name', 'type', 'required', 'memo', 'props', 'lookup'];
function linkedFields(src, srcDesign) {
  const lookup = src.lookup ? clone(src.lookup) : null;
  if (lookup) lookup.copies = lookup.copies.map((c) => ({ ...c, to: { itemId: null, name: refLabel(srcDesign, c.to) } }));
  return { name: src.name, type: src.type, required: src.required, memo: src.memo, props: clone(src.props), lookup };
}

// 取り込んだ項目（つなげたまま）を、元の項目の今の中身にそろえる。元を直したときは、同じ操作（commit）の中で呼ぶ。
// 元が見つからないときは lost にして、今の中身で固定する。元の元（取り込んだ項目をさらに取り込んだもの）にも届くように、変わらなくなるまで繰り返す
function syncLinkedItems(state) {
  const designs = new Map(state.designs.map((d) => [d.id, d]));
  for (let round = 0; round < 8; round++) {
    let changed = false;
    state.designs.forEach((d) => d.items.forEach((it) => {
      if (!it.link) return;
      const srcDesign = designs.get(it.link.designId);
      const src = srcDesign ? findItem(srcDesign, it.link.itemId) : null;
      if (!src || src === it) {
        // 単体で開いた HTML には、元の画面設計が入っていない。「元なし」にせず、出力したときの中身とつながりのまま残す
        // （直して返してもらった HTML を取り込んだときに、一覧にある元とつなぎ直すため）
        if (!srcDesign && standalone) return;
        if (!it.link.lost) { it.link.lost = true; changed = true; }
        return;
      }
      if (it.link.lost) { it.link.lost = false; changed = true; }
      if (it.link.designName !== srcDesign.name) { it.link.designName = srcDesign.name; changed = true; }
      const want = linkedFields(src, srcDesign);
      if (LINKED_FIELDS.every((k) => JSON.stringify(it[k]) === JSON.stringify(want[k]))) return;
      if (want.type !== it.type && isInputType(want.type) && isInputType(it.type)) changeItemType(d, it, want.type);
      const before = stateIdsOf(it);
      Object.assign(it, want);
      clearGoneStates(d, it, before); // 元でステータスを消したときは、取り込んだ側でそのステータスを見本で出していた部品も「なし」にする
      changed = true;
    }));
    if (!changed) return;
  }
}
// その画面設計と、そこから項目を取り込んでいる画面設計（取り込んだ項目をさらに取り込んだものも。syncLinkedItems がそろえる範囲）の id。
// 取り込みのつながりをたどって集める（輪になっていても、集めた画面設計はもう一度たどらないので止まる）
function designAndImporters(S, rootId) {
  const ids = new Set([rootId]);
  for (let grew = true; grew;) {
    grew = false;
    S.designs.forEach((x) => {
      if (ids.has(x.id) || !x.items.some((it) => it.link && ids.has(it.link.designId))) return;
      ids.add(x.id);
      grew = true;
    });
  }
  return ids;
}

// 取り込む窓で、元の項目 it がこの画面設計 d から見てどうなっているか。
// 'own'＝この画面設計の項目を取り込んだもの、'done'＝取り込み済み、'status'＝ステータスの項目で、この画面設計にもうある
// （ステータスの並びは画面設計に 1 つだけ）、'same'＝同じ名前の項目がある、'' ＝ふつう。取り込めるのは 'same' と '' だけ
const IMPORT_BLOCKED = ['own', 'done', 'status'];
function importState(d, src, it) {
  if (it.link && it.link.designId === d.id) return 'own';
  if (d.items.some((x) => x.link && x.link.designId === src.id && x.link.itemId === it.id)) return 'done';
  if (it.type === 'status' && d.items.some((x) => x.type === 'status')) return 'status';
  if (d.items.some((x) => x.name === it.name)) return 'same';
  return '';
}

// ── データベースどうしのつながりの図（画像 q23）──
// 箱＝画面設計（ごみ箱のものは除く）と、ルックアップ・関連レコード一覧の元に名前だけ書いた「一覧にないデータベース」。
// 矢印は値が流れる向き（元 → 引く側）: lookup（ルックアップ）・related（関連レコード一覧）は紺、link（項目の取り込み）は緑の点線。
// focusId を渡すと、その画面設計と、直接つながる箱だけにする（編集の画面のつながりの図）
const MAP_W = 200;
const MAP_H = 64;
const MAP_COL = 400; // 列の幅（箱の幅 200 ＋ 矢印の文字を書く間 200）
const MAP_ROW = 112; // 段の高さ（箱の高さ 64 ＋ 間 48）
function mapModel(state, focusId = null) {
  const designs = [...visibleDesigns(state), ...peerDesigns(state)]; // 単体で開いた HTML では、埋め込んだほかの画面設計の写しも箱にする
  const ids = new Set(designs.map((d) => d.id));
  const keyOfDb = (db) => (db && db.designId ? (ids.has(db.designId) ? 'd:' + db.designId : null) : db && db.name ? 'x:' + db.name : null);
  const edges = new Map();
  const add = (from, to, kind, label) => {
    if (!from || from === to) return;
    const k = `${from}|${to}|${kind}`;
    if (!edges.has(k)) edges.set(k, { from, to, kind, labels: [] });
    if (label && !edges.get(k).labels.includes(label)) edges.get(k).labels.push(label);
  };
  designs.forEach((d) => {
    const to = 'd:' + d.id;
    d.items.forEach((it) => {
      if (it.lookup) {
        const src = it.lookup.db.designId ? findDesign(state, it.lookup.db.designId) : null;
        const copies = it.lookup.copies.map((c) => refLabel(src, c.from)).filter((n) => n && !n.startsWith('（')).join('・');
        add(keyOfDb(it.lookup.db), to, 'lookup', `${refLabel(src, it.lookup.key)}で引く${copies ? `\n${copies}` : ''}`);
      }
      if (it.link && !it.link.lost && ids.has(it.link.designId)) add('d:' + it.link.designId, to, 'link', it.name);
    });
    d.screens.forEach((s) => s.parts.forEach((p) => {
      if (p.type === 'table' && p.tableKind === 'related' && p.props && p.props.db) add(keyOfDb(p.props.db), to, 'related', p.label);
    }));
  });
  let list = [...edges.values()];
  const nodes = new Map(designs.map((d) => ['d:' + d.id, { key: 'd:' + d.id, design: d, name: d.name }]));
  list.forEach((e) => [e.from, e.to].forEach((k) => { if (!nodes.has(k)) nodes.set(k, { key: k, design: null, name: k.slice(2) }); }));
  let keys = [...nodes.keys()];
  if (focusId) {
    const f = 'd:' + focusId;
    list = list.filter((e) => e.from === f || e.to === f);
    const near = new Set([f, ...list.flatMap((e) => [e.from, e.to])]);
    keys = keys.filter((k) => near.has(k));
  }
  return { nodes: keys.map((k) => nodes.get(k)), edges: list };
}
// 自動で並べる位置。矢印の元を左、引く側を右の列にする（列＝元から何段目か）。
// つながりのない箱は、つながった箱の下に、名前の順に横に並べる（右の端の列に置くと、図が横に長くなるため。Claude が決めた）
function mapLayout(model, hOf = () => MAP_H) {
  const forward = mapForwardEdges(model);
  const rank = mapRanks(model, forward);
  const linked = new Set(model.edges.flatMap((e) => [e.from, e.to]));
  // 箱の並びの初めは名前の順。order のある箱（画面の移り方の図の画面）は、その順で先に並べる
  const byName = [...model.nodes].sort((a, b) => (a.order ?? Infinity) - (b.order ?? Infinity) || a.name.localeCompare(b.name, 'ja'));
  const cols = new Map();
  byName.filter((n) => linked.has(n.key)).forEach((n) => {
    const c = rank.get(n.key);
    if (!cols.has(c)) cols.set(c, []);
    cols.get(c).push(n);
  });
  mapOrderRows(cols, forward);
  const pos = {};
  cols.forEach((list, c) => {
    let y = 40;
    list.forEach((n) => {
      pos[n.key] = { x: 40 + c * MAP_COL, y };
      y += hOf(n.key) + MAP_ROW - MAP_H; // 箱の間は 48
    });
  });
  const bottom = Math.max(0, ...Object.entries(pos).map(([k, p]) => p.y + hOf(k)));
  const top = bottom ? bottom + MAP_ROW - MAP_H + 32 : 40;
  const perRow = Math.max(4, Math.floor((cols.size * MAP_COL - (MAP_COL - MAP_W)) / (MAP_W + 40)));
  byName.filter((n) => !linked.has(n.key)).forEach((n, i) => {
    pos[n.key] = { x: 40 + (i % perRow) * (MAP_W + 40), y: top + Math.floor(i / perRow) * MAP_ROW };
  });
  return pos;
}
// 箱の列＝矢印の元から何段目か（いちばん長い道のり）。入ってくる矢印のない箱（いちばん元）は、矢印の先のいちばん左の箱の
// すぐ左の列へ寄せる（例: 受注管理だけに引かれる会計システムを、いちばん左の列に置くと、長い矢印が間の列の箱の後ろを通るため）
function mapRanks(model, forward) {
  const rank = new Map(model.nodes.map((n) => [n.key, 0]));
  for (let i = 0; i < model.nodes.length; i++) {
    let changed = false;
    forward.forEach((e) => { if (rank.get(e.to) < rank.get(e.from) + 1) { rank.set(e.to, rank.get(e.from) + 1); changed = true; } });
    if (!changed) break;
  }
  const hasIn = new Set(forward.map((e) => e.to));
  model.nodes.filter((n) => !hasIn.has(n.key)).forEach((n) => {
    const outs = forward.filter((e) => e.from === n.key).map((e) => rank.get(e.to));
    if (outs.length) rank.set(n.key, Math.min(...outs) - 1);
  });
  return rank;
}
// 列の中の並び。矢印でつながる相手（左の列の元・右の列の先）の段の平均に近い順にする（線の交わりを減らすため）。
// 左から右・右から左を 2 回ずつ繰り返す。相手がいない箱と、平均が同じ箱は、今の並び（はじめは名前の順）のまま
function mapOrderRows(cols, forward) {
  const row = new Map();
  cols.forEach((list) => list.forEach((n, i) => row.set(n.key, i)));
  const order = [...cols.keys()].sort((a, b) => a - b);
  for (let pass = 0; pass < 4; pass++) {
    const fromLeft = pass % 2 === 0;
    (fromLeft ? order : [...order].reverse()).forEach((c) => {
      const list = cols.get(c);
      const score = new Map(list.map((n, i) => {
        const near = forward.filter((e) => (fromLeft ? e.to : e.from) === n.key).map((e) => row.get(fromLeft ? e.from : e.to));
        return [n.key, near.length ? near.reduce((s, x) => s + x, 0) / near.length : i];
      }));
      list.sort((a, b) => score.get(a.key) - score.get(b.key));
      list.forEach((n, i) => row.set(n.key, i));
    });
  }
}
// 列を決めるときに使う矢印。矢印が輪になっているとき（例: 顧客管理 → 受注管理 のルックアップと、受注管理 → 顧客管理 の関連レコード一覧）は、
// 輪を閉じる矢印を外す（外さないと、輪の箱が右の列へ送られ続けるため）。ルックアップ・取り込み・関連レコード一覧の順に矢印を足していき、
// 足すと輪になる矢印だけを外す（関連レコード一覧は、ルックアップと逆向きに置かれることが多いため後にする）
const MAP_EDGE_ORDER = { lookup: 0, link: 1, related: 2 };
function mapForwardEdges(model) {
  const out = new Map(model.nodes.map((n) => [n.key, []]));
  const reaches = (from, to) => {
    const seen = new Set([from]);
    const stack = [from];
    while (stack.length) {
      const k = stack.pop();
      if (k === to) return true;
      out.get(k).forEach((n) => { if (!seen.has(n)) { seen.add(n); stack.push(n); } });
    }
    return false;
  };
  const kept = [];
  // order のある矢印（画面の移り方の図。画面の並びで前へ進む矢印が 0）は、その順で先に足す
  const rankOf = (e) => (e.order != null ? e.order : MAP_EDGE_ORDER[e.kind]);
  [...model.edges].sort((a, b) => rankOf(a) - rankOf(b)).forEach((e) => {
    if (reaches(e.to, e.from)) return;
    out.get(e.from).push(e.to);
    kept.push(e);
  });
  return kept;
}

// その画面設計の項目を取り込んでいる、ほかの画面設計（ごみ箱のものは除く）
function designsImporting(state, designId) {
  return state.designs.filter((d) => d.id !== designId && !d.trashedAt && d.items.some((it) => it.link && it.link.designId === designId && !it.link.lost));
}

// 種類ごとの設定を、最初の値と同じ形（文字の配列・真偽・文字）にそろえる。知らない項目は残す
function normalizeProps(t, src) {
  const props = isObj(src) ? { ...src } : {};
  Object.entries(t.props).forEach(([k, def]) => {
    const v = props[k];
    if (Array.isArray(def)) props[k] = Array.isArray(v) ? v.filter((x) => typeof x === 'string' || typeof x === 'number').map(String) : clone(def);
    else if (typeof def === 'boolean') props[k] = v === undefined ? def : !!v;
    else props[k] = typeof v === 'string' ? v : typeof v === 'number' && Number.isFinite(v) ? String(v) : def;
  });
  return props;
}

// id が重なっていたら、後のほうに新しい id を付ける（画面設計・画面。片方をごみ箱へ移す・消すと、もう片方も動くのを防ぐため）
function uniqueIds(list, prefix) {
  const seen = new Set();
  list.forEach((x) => {
    if (seen.has(x.id)) x.id = newId(prefix);
    seen.add(x.id);
  });
  return list;
}
// 同じ画面設計の中で部品の id が重なっていたら、後のほうに新しい id を付ける（片方を消すと両方消えるのを防ぐため）
function uniquePartIds(screens) {
  const seen = new Set();
  screens.forEach((s) => s.parts.forEach((p) => {
    if (seen.has(p.id)) p.id = newId('p');
    seen.add(p.id);
  }));
  return screens;
}
// 項目の id も同じ（重なっていると、片方を直すと両方の部品が変わるため）。後のほうの項目を指す部品はないものとして扱う
function uniqueItemIds(items) {
  const seen = new Set();
  items.forEach((it) => {
    if (seen.has(it.id)) it.id = newId('i');
    seen.add(it.id);
  });
  return items;
}

function normalizeScreen(src, i, items = []) {
  const s = isObj(src) ? src : {};
  const device = own(DEVICES, s.device) ? s.device : 'pc';
  // 部品から項目を作るとき（データの形の版 1 を直すとき）は、上から下・左から右の順に作る（一覧表の並びを画面の読む順にするため）
  const raw = Array.isArray(s.parts) ? s.parts.filter(isObj) : [];
  const order = raw.map((p, k) => k).sort((a, b) => numOr(raw[a].y, 0) - numOr(raw[b].y, 0) || numOr(raw[a].x, 0) - numOr(raw[b].x, 0));
  const parts = [];
  order.forEach((k) => { parts[k] = normalizePart(raw[k], items); });
  return {
    ...s,
    id: str(s.id) || newId('s'),
    name: typeof s.name === 'string' ? s.name : `画面 ${i + 1}`,
    device,
    width: DEVICES[device].width,
    height: snapHeight(s.height == null ? DEVICES[device].height : s.height, device),
    showHeader: s.showHeader !== false,
    tablePos: s.tablePos === 'bottom' ? 'bottom' : 'right',
    parts,
    callouts: uniqueIds(Array.isArray(s.callouts) ? s.callouts.filter(isObj).map(normalizeCallout) : [], 'k'), // id が重なると、片方を消すと両方消えるため
  };
}

// 吹き出し { id, x, y, w, h, text, color, target, tip }（画面の callouts。画像 q27）。x・y は画面の左上から（外の余白はマイナスや画面の幅より先）。
// target はつないだ部品の id（つながないときは null）。color は yellow・red・blue・gray。tip は線の先の形（dot・arrow・none）
function normalizeCallout(src) {
  return {
    ...src,
    id: str(src.id) || newId('k'),
    x: numOr(src.x, 0), y: numOr(src.y, 0),
    w: Math.max(CALLOUT_MIN, numOr(src.w, 200)), h: Math.max(CALLOUT_MIN, numOr(src.h, 80)),
    text: str(src.text),
    color: own(CALLOUT_COLORS, src.color) ? src.color : 'yellow',
    target: str(src.target) || null,
    tip: ['dot', 'arrow', 'none'].includes(src.tip) ? src.tip : 'dot',
  };
}

function normalizeDesign(src) {
  const d = isObj(src) ? src : {};
  const createdAt = str(d.createdAt) || nowIso();
  const items = uniqueItemIds((Array.isArray(d.items) ? d.items : []).filter(isObj).map(normalizeItem));
  const screens = Array.isArray(d.screens) && d.screens.length
    ? uniquePartIds(uniqueIds(d.screens.map((s, i) => normalizeScreen(s, i, items)), 's'))
    : [createScreenData(FIRST_SCREEN_NAME)];
  const id = str(d.id) || newId('d');
  // ボタン・リンクの文字の移る先がこの画面設計を指しているときは ''（この画面設計）に直す（複製・取り込みで id が変わっても、自分を指し続けるように）
  screens.forEach((s) => s.parts.forEach((p) => {
    if ((p.type === 'button' || p.type === 'link') && isObj(p.props) && p.props.designId === id) p.props.designId = '';
  }));
  return {
    ...d,
    id,
    name: cleanName(d.name) || '名前なし',
    target: str(d.target),
    description: str(d.description),
    createdAt,
    updatedAt: str(d.updatedAt) || createdAt,
    trashedAt: str(d.trashedAt) || null,
    revisions: Array.isArray(d.revisions) ? d.revisions : [],
    items,
    screens,
    mapPos: normalizeMapPos(d.mapPos), // 編集の画面の「この画面設計のつながりの図」の箱の位置
    processPos: normalizeMapPos(d.processPos), // ステータスの移り方の図の箱の位置（鍵は 't:ステータスの id'）
    flowPos: normalizeMapPos(d.flowPos), // 画面の移り方の図の箱の位置（鍵は 's:画面の id'、ほかの画面設計の画面は 'x:画面設計の id/画面の id'）
  };
}

// つながりの図で、ドラッグして動かした箱の位置 { 箱の鍵: { x, y } }（箱の鍵は画面設計なら 'd:id'、一覧にないデータベースなら 'x:名前'）
function normalizeMapPos(src) {
  const out = {};
  if (isObj(src)) Object.entries(src).forEach(([k, v]) => { if (isObj(v) && Number.isFinite(Number(v.x)) && Number.isFinite(Number(v.y))) out[k] = { x: Number(v.x), y: Number(v.y) }; });
  return out;
}

// ── システム（第 9 段階。AI設計基盤_設計書.md の 5-3・5-6）──
// いくつかの画面設計をまとめる入れ物（例: 出張申請システム）。{ id（y-）, name, description, createdAt, updatedAt, trashedAt,
//   designIds（入れている画面設計の id。並び順が表示の順）, roles: [{ id（l-）, name, memo }]（並び順がスイムレーンのレーンの順）,
//   swimlane: { steps: [{ id（w-）, roleId, col, kind, text, memo, ref: { designId, screenId, stateId }, src（BDM の箱。normalizeStep）}], edges: [{ id（e-）, from, to, label }] },
//   materials（資料。行の形は下の normalizeMaterial）, notes（設計ノート。形は下の normalizeNotes）}。
// 1 つの画面設計を 2 つ以上のシステムに入れられる（案B）。どのシステムに入っているかは、システムの designIds だけに持つ（画面設計の側には持たない）。
// 画面設計をごみ箱へ移しても designIds からは外さない（戻したときに元のシステムに戻るように）。完全に削除したときに、全部のシステムから外す
const SWIM_KINDS = ['start', 'task', 'input', 'decision', 'doc', 'end']; // 始まり・作業・システムへの入力・判断・書類・終わり
const SWIM_KIND_NAMES = { start: '始まり', task: '作業', input: 'システムへの入力', decision: '判断', doc: '書類', end: '終わり' };
// 資料（第 9 段階の後半）の種類。資料のファイルの見分け（material-kind.js の MATERIAL_KINDS）と同じ並び
const MATERIAL_KINDS = ['text', 'image', 'pdf', 'word', 'excel', 'bdm', 'other'];
const MATERIAL_KIND_NAMES = { text: '文字', image: '画像', pdf: 'PDF', word: 'Word', excel: 'Excel', bdm: 'MPD', other: 'そのほか' }; // bdm は MultipurposeDiagramMaker（旧名 ビジネスダイアグラムメーカー・BDM）で保存した図の HTML。画面の文では MPD（2026-10-21 q84）

function createSystemData({ name, description = '' } = {}, now = nowIso()) {
  return {
    id: newId('y'), name, description, createdAt: now, updatedAt: now, trashedAt: null,
    designIds: [], roles: [], swimlane: { steps: [], edges: [] }, materials: [], notes: normalizeNotes({}), revisions: [],
  };
}
// 役割の並び。名前のない役割は「名前なし」。id の重なりを直す。知らない欄は残す
function normalizeRoles(list) {
  return uniqueIds((Array.isArray(list) ? list : []).filter(isObj)
    .map((r) => ({ ...r, id: str(r.id) || newId('l'), name: cleanName(r.name) || '名前なし', memo: str(r.memo) })), 'l');
}
// 作業の指す先（この作業で使う画面設計・画面・ステータス）。ないものは null。知らない欄は残す
function normalizeStepRef(src) {
  const r = isObj(src) ? src : {};
  return { ...r, designId: str(r.designId) || null, screenId: str(r.screenId) || null, stateId: str(r.stateId) || null };
}
// 読み込んだ列を 0 以上の整数に直す（小数は丸める。数でない・負のときは null）
function swimCol(v) {
  const n = typeof v === 'number' || (typeof v === 'string' && v.trim()) ? Math.round(Number(v)) : NaN;
  return Number.isFinite(n) && n >= 0 ? n : null;
}
// 作業。役割が見つからない作業も消さずに残す（描くときに外す）。知らない種類は「作業」
function normalizeStep(src) {
  return {
    ...src,
    id: str(src.id) || newId('w'),
    roleId: str(src.roleId),
    col: swimCol(src.col) ?? 0,
    kind: SWIM_KINDS.includes(src.kind) ? src.kind : 'task',
    text: str(src.text),
    memo: str(src.memo),
    ref: normalizeStepRef(src.ref),
    // ビジネスダイアグラムメーカーから読んだ箱の { id, x, y, w, h, material（どの資料から読んだか。資料の id か null）}（書き戻すとき、同じ箱・同じ位置に
    // 戻すため。material は第 9 段階の後半の swimlaneFromPlan が付ける）。中の欄は直さずにそのまま残す
    src: isObj(src.src) ? src.src : null,
  };
}
// スイムレーン。作業の id の重なりを直してから、端の作業がない矢印と、自分への矢印と、同じ向きの 2 本目の矢印（1 本目を残す）を外す
function normalizeSwimlane(src) {
  const sw = isObj(src) ? src : {};
  const steps = uniqueIds((Array.isArray(sw.steps) ? sw.steps : []).filter(isObj).map(normalizeStep), 'w');
  const stepIds = new Set(steps.map((w) => w.id));
  const pairs = new Set();
  const firstOfPair = (e) => {
    const k = `${e.from}\n${e.to}`;
    if (pairs.has(k)) return false;
    pairs.add(k);
    return true;
  };
  const edges = uniqueIds((Array.isArray(sw.edges) ? sw.edges : []).filter(isObj)
