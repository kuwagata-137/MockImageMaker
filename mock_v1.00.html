    .map((e) => ({ ...e, id: str(e.id) || newId('e'), from: str(e.from), to: str(e.to), label: str(e.label) }))
    .filter((e) => stepIds.has(e.from) && stepIds.has(e.to) && e.from !== e.to && firstOfPair(e)), 'e');
  return { ...sw, steps, edges };
}
// 資料の行 { id（m-）, name（入れたときのファイルの名前）, kind, size（バイト）, addedAt, memo, file（<userData>/data/files/<システムの id>/ の中の
// ファイルの名前）}（設計書の 5-3。ファイルの中身は designs.json に入れない）。知らない種類は「そのほか」、大きさが 0 以上の整数でなければ 0。知らない欄は残す
function normalizeMaterial(m) {
  return {
    ...m,
    id: str(m.id) || newId('m'),
    name: str(m.name),
    kind: MATERIAL_KINDS.includes(m.kind) ? m.kind : 'other',
    size: Number.isSafeInteger(m.size) && m.size >= 0 ? m.size : 0,
    addedAt: str(m.addedAt),
    memo: str(m.memo),
    file: str(m.file),
  };
}
// 資料の並び。オブジェクトでない行は外し、id の重なりを直す（片方を消すと両方消えるのを防ぐため）
const normalizeMaterials = (list) => uniqueIds((Array.isArray(list) ? list : []).filter(isObj).map(normalizeMaterial), 'm');
// 古い形（.doc・.xls）のファイルの資料か（中身を読めない）。行には持たず、保存したファイルの名前の拡張子で見る
const isLegacyMaterial = (row) => isObj(row) && /\.(doc|xls)$/i.test(str(row.file));
// 設計ノート（第 10 段階。設計書の 5-3・10 章）。AI が資料からシステムを作るときの 5 つの段階の進み具合と、読み取ったこと・決めたことと理由・
// まだ決まっていないこと・メモを、システムごとに持つ。{ stages: { read・flow・items・screens・docs: { state, confirmedAt } }, findings,
//   decisions: [{ id（nd-）, date, stage, text, reason }], questions: [{ id（nq-）, date, stage, text, answer, resolvedAt }], memo }。
// システムの履歴の写しには入れない（SYSTEM_CONTENT_KEYS）。データの形の版は 3 のまま（読み込みで足りない欄を補う）
const NOTE_STAGES = ['read', 'flow', 'items', 'screens', 'docs']; // 段階の鍵と順
const NOTE_STAGE_NAMES = { read: '① 資料から読み取る', flow: '② 業務の流れ', items: '③ データベースの項目', screens: '④ 画面', docs: '⑤ 説明書と出力' };
// 段階の進み具合: まだ・作業中・確認待ち・確認済み・確認を飛ばした（人の指示で）。名前の表は、AI の断りの文と設計ノートの画面が使う
const NOTE_STATES = ['todo', 'doing', 'review', 'done', 'skipped'];
const NOTE_STATE_NAMES = { todo: 'まだ', doing: '作業中', review: '確認待ち', done: '確認済み', skipped: '確認を飛ばした' };
// 「読み取ったこと」「メモ」の 1 つの長さの上限（人の欄の長さと、AI が断る長さ）。行（決めたこと・まだ決まっていないこと）の文には設けない
const NOTE_TEXT_MAX = 8000;
// 段階 1 つ。知らない進み具合は todo。confirmedAt は空でない文字だけ残し、ほかは null（trashedAt と同じ。読み込みでは付け直さない）。知らない欄は残す
function normalizeNoteStage(src) {
  const s = isObj(src) ? src : {};
  return { ...s, state: NOTE_STATES.includes(s.state) ? s.state : 'todo', confirmedAt: str(s.confirmedAt) || null };
}
// 段階の入れ物。5 つの鍵を決まった順に必ず持たせる。知らない段階の鍵は、直さずに後ろへ残す（消さない）
function normalizeNoteStages(src) {
  const st = isObj(src) ? src : {};
  const out = {};
  NOTE_STAGES.forEach((k) => { out[k] = normalizeNoteStage(st[k]); });
  Object.keys(st).forEach((k) => { if (!NOTE_STAGES.includes(k)) out[k] = st[k]; });
  return out;
}
// 行（決めたこと・まだ決まっていないこと）。id がなければ付け、文字の欄は文字にする。知らない欄と知らない段階の行は残す
const normalizeNoteDecision = (r) => ({ ...r, id: str(r.id) || newId('nd'), date: str(r.date), stage: str(r.stage), text: str(r.text), reason: str(r.reason) });
const normalizeNoteQuestion = (r) => ({
  ...r, id: str(r.id) || newId('nq'), date: str(r.date), stage: str(r.stage), text: str(r.text),
  answer: str(r.answer), resolvedAt: str(r.resolvedAt) || null,
});
// まだ決まっていないことの行が「決まった」か: 答え（前後の空白を除く）が空でない行。解決の日時（resolvedAt）では見分けない
// （読み込んだデータで、答えがあるのに resolvedAt が null の行があるため）。画面の表と、AI の set_stage の warnings で使う（終わりの見直し A の Minor 2）
const noteQuestionDecided = (q) => str(q.answer).trim() !== '';
// 行の並び。オブジェクトでない行は外し、id の重なりを直す（片方を消すと両方消えるのを防ぐため）
const noteRows = (list, normalizeRow, prefix) => uniqueIds((Array.isArray(list) ? list : []).filter(isObj).map(normalizeRow), prefix);
// 設計ノートを読み込める形に直す。オブジェクトでなければ既定の形（5 つの段階が todo・文と行は空）。読み取ったこと・メモの長さは読み込みでは切らない。知らない欄は残す
function normalizeNotes(raw) {
  const n = isObj(raw) ? raw : {};
  return {
    ...n,
    stages: normalizeNoteStages(n.stages),
    findings: str(n.findings),
    decisions: noteRows(n.decisions, normalizeNoteDecision, 'nd'),
    questions: noteRows(n.questions, normalizeNoteQuestion, 'nq'),
    memo: str(n.memo),
  };
}
// システム 1 つを読み込める形に直す。designIds は state にある画面設計（ごみ箱のものも含む）の id だけを、重ねずに残す。知らない欄は残す
function normalizeSystem(raw, designIds) {
  const y = isObj(raw) ? raw : {};
  const known = designIds instanceof Set ? designIds : new Set(designIds || []);
  const createdAt = str(y.createdAt) || null;
  return {
    ...y,
    id: str(y.id) || newId('y'),
    name: cleanName(y.name) || '名前なし',
    description: str(y.description),
    createdAt,
    updatedAt: str(y.updatedAt) || createdAt,
    trashedAt: str(y.trashedAt) || null,
    designIds: [...new Set((Array.isArray(y.designIds) ? y.designIds : []).filter((id) => typeof id === 'string' && known.has(id)))],
    roles: normalizeRoles(y.roles),
    swimlane: normalizeSwimlane(y.swimlane),
    materials: normalizeMaterials(y.materials),
    notes: normalizeNotes(y.notes),
    // 履歴の行の id が重なっていれば、2 つ目からは新しい id にする（どの行に戻すかを id で決めるため）
    revisions: uniqueIds((Array.isArray(y.revisions) ? y.revisions : []).filter(isObj).map(normalizeSystemRevision), 'r'),
  };
}

// ── システムの履歴（第 9 段階。q65）──
// システムの revisions の行: { id（r-）, kind, date, note, snapshot }。kind は 'ai'（AI が直す前の状態。aiSession も持つ）・'restore'（戻す前の状態）。
// 写し（snapshot）は中身（SYSTEM_CONTENT_KEYS）だけ。資料（materials）・設計ノート（notes）・revisions は入れない（資料のファイルは写しで戻せず、
// 設計ノートは AI と人の作業の記録なので、戻すと記録が消えるため）。写しは凍らせ、元に戻すの履歴・保存では写さずに同じものを指す（stateWithRefs）
const SYSTEM_CONTENT_KEYS = ['name', 'description', 'roles', 'swimlane', 'designIds'];
function systemContentOf(y) {
  const out = {};
  SYSTEM_CONTENT_KEYS.forEach((k) => { out[k] = y[k]; });
  return out;
}
// 中身を比べるための JSON（キーを並べ替える。AI が直す前の行の写しは、この JSON から作る）
const systemContent = (y) => canonicalJson(systemContentOf(y));
// 写しの中身を読み込める形に直す（読み込むときと、戻すとき）。designIds は文字だけを重ねずに残す（今ある画面設計かは、戻すときに見る）。知らない欄は残す
function systemContentFrom(raw) {
  const y = isObj(raw) ? raw : {};
  return {
    ...y,
    name: cleanName(y.name) || '名前なし',
    description: str(y.description),
    roles: normalizeRoles(y.roles),
    swimlane: normalizeSwimlane(y.swimlane),
    designIds: [...new Set((Array.isArray(y.designIds) ? y.designIds : []).filter((id) => typeof id === 'string' && id))],
  };
}
// 履歴の行を読み込める形に直す。写しのない行は snapshot: null（戻せない）。知らない欄は残す
function normalizeSystemRevision(r) {
  return { ...r, id: str(r.id) || newId('r'), kind: str(r.kind), date: str(r.date) || null, note: str(r.note), snapshot: isObj(r.snapshot) ? systemContentFrom(r.snapshot) : null };
}
// 履歴の行の名前。AI が直す前の状態なら AI の名前の入った文（「Claude Code が直す前の状態」）、ほかは種類の名前（「戻す前の状態」）
const systemRevisionTitle = (r) => (r.kind === 'ai' && r.note ? r.note : revisionTitle(r));
// 履歴の行。content を渡すと、それを写しにする（AI が直す前の中身。渡さなければ今の中身）
function systemRevisionRow(y, kind, { note = '', date = nowIso(), content = null } = {}) {
  const snapshot = deepFreeze(content ? clone(content) : clone(systemContentOf(y)));
  return { id: newId('r'), kind, date, note, snapshot };
}
// 戻すときの中身（写しを今の形に直し、今ない画面設計〔完全に削除したもの〕を外す。ごみ箱の画面設計は残す）。
// 作業の指す先も今の中身で検め、ないものを外す（dropMissingStepRef）
function systemFromSnapshot(snap, state) {
  const c = systemContentFrom(clone(snap));
  c.designIds = c.designIds.filter((id) => findDesign(state, id));
  c.swimlane.steps.forEach((w) => dropMissingStepRef(state, w.ref));
  return systemContentOf(c);
}
// 履歴の行 r の中身に戻しても、今のシステム y の中身と変わらないか（写しを戻すときの形〔systemFromSnapshot〕に直して比べる。T9 の見直し）
const sameAsSystemRevision = (state, y, r) => canonicalJson(systemFromSnapshot(r.snapshot, state)) === systemContent(y);
// 履歴の行のうち、その種類（kind）の行を新しい方から max 行まで残し、古い行から消す（ほかの種類の行は消さない。行は古い順に並んでいる）。
// x は画面設計かシステム
function trimRevisionRows(x, kind, max) {
  const rows = x.revisions.filter((r) => isObj(r) && r.kind === kind);
  if (rows.length <= max) return;
  const drop = new Set(rows.slice(0, rows.length - max));
  for (let i = x.revisions.length - 1; i >= 0; i--) if (drop.has(x.revisions[i])) x.revisions.splice(i, 1);
}
// システムの「戻す前の状態」の行は、システムごとに新しい方から 10 行まで（「AI が直す前の状態」の行とは別に数える。Claude が決めた）
const SYSTEM_RESTORE_ROWS_MAX = 10;

const findSystem = (state, id) => state.systems.find((y) => y.id === id) || null;
const findStep = (y, id) => y.swimlane.steps.find((w) => w.id === id) || null;
const isSwimCol = (v) => Number.isInteger(v) && v >= 0; // 操作で受け取る列（読み込むときの swimCol と違い、整数でなければ断る）
// 画面設計を入れられるシステム（ごみ箱のシステムは、見つからないときと同じく null）
const liveSystem = (state, id) => {
  const y = findSystem(state, id);
  return y && !y.trashedAt ? y : null;
};
// 画面設計をシステムに入れる（state を書き換える）。システムが見つからない・ごみ箱にある・もう入っているときは何もしない。入れたシステムの更新日時を変える
function putIntoSystem(state, sysId, designId) {
  const y = liveSystem(state, sysId);
  if (!y || y.designIds.includes(designId)) return;
  y.designIds.push(designId);
  y.updatedAt = nowIso();
}
// その画面設計を入れているシステム（ごみ箱のシステムは除く）
function systemsOf(state, designId) {
  return state.systems.filter((y) => !y.trashedAt && y.designIds.includes(designId));
}
// システムに入れている画面設計（designIds の順。ごみ箱の画面設計は除く）。sys はシステムか、その id
function designsOfSystem(state, sys) {
  const y = typeof sys === 'string' ? findSystem(state, sys) : sys;
  return y ? y.designIds.map((id) => findDesign(state, id)).filter((d) => d && !d.trashedAt) : [];
}
// どのシステムにも入っていない画面設計（ごみ箱の画面設計は除く。ごみ箱のシステムにだけ入っているものは、入っていないとみなす）
function loneDesigns(state) {
  const used = new Set(state.systems.filter((y) => !y.trashedAt).flatMap((y) => y.designIds));
  return state.designs.filter((d) => !d.trashedAt && !used.has(d.id));
}
// ごみ箱のシステム（ごみ箱へ移した日時の新しい順）
function trashedSystems(state) {
  return state.systems.filter((y) => y.trashedAt).sort(byNewest('trashedAt'));
}
// 画面設計・画面・ステータスを消したとき、それを指していた作業の指す先を外す（作業の文は残す。どのシステムの分も。システムの更新日時は変えない）。
// screenId も stateId も渡さないとき（画面設計を完全に削除したとき）は、指す先を全部外す。画面とステータスの id は画面設計の中だけで
// 重ならないものなので、同じ画面設計を指す作業だけを見る
function clearStepRefs(state, designId, { screenId = null, stateId = null } = {}) {
  state.systems.forEach((y) => y.swimlane.steps.forEach((w) => {
    if (w.ref.designId !== designId) return;
    if (!screenId && !stateId) Object.assign(w.ref, { designId: null, screenId: null, stateId: null });
    if (screenId && w.ref.screenId === screenId) w.ref.screenId = null;
    if (stateId && w.ref.stateId === stateId) w.ref.stateId = null;
  }));
}
// 作業の指す先（ref を書き換える）のうち、今の state にないものを外す。ない画面設計なら 3 つとも、ない画面・ステータスなら、その欄だけ null にする
function dropMissingStepRef(state, ref) {
  if (!ref.designId) return;
  const d = findDesign(state, ref.designId);
  if (!d) {
    Object.assign(ref, { designId: null, screenId: null, stateId: null });
    return;
  }
  if (ref.screenId && !d.screens.some((s) => s.id === ref.screenId)) ref.screenId = null;
  if (ref.stateId && !stateIdsOf(d.items.find((it) => it.type === 'status')).includes(ref.stateId)) ref.stateId = null;
}
// 画面設計を書き換えた後に、その画面設計（designIds。id 1 つか id の Set）を指す作業の指す先のうち、もうない画面・ステータスを外す
// （どのシステムの分も。システムの更新日時は変えない）。指す先がなくなる操作（画面・ステータス・ステータスの項目を消す・並びを書き直す・
// 前の版に戻す・取り込みで置き換えるなど）では、どれでも外す（第 9 段階の見直しで決めた）。読み込みのときは外さない
function clearDanglingStepRefs(state, designIds) {
  const ids = designIds instanceof Set ? designIds : new Set([designIds]);
  state.systems.forEach((y) => y.swimlane.steps.forEach((w) => { if (ids.has(w.ref.designId)) dropMissingStepRef(state, w.ref); }));
}

function normalizeState(raw, schemaVersion) {
  const settings = isObj(raw.settings) ? raw.settings : {};
  const customs = Array.isArray(settings.customTargets) ? settings.customTargets : [];
  const designs = uniqueIds((Array.isArray(raw.designs) ? raw.designs : []).filter(isObj).map(normalizeDesign), 'd');
  const designIds = new Set(designs.map((d) => d.id));
  const state = {
    ...raw,
    schemaVersion,
    // mapPos は最初の画面の「全部の画面設計のつながりの図」の箱の位置
    settings: { ...settings, customTargets: [...new Set(customs.filter((t) => typeof t === 'string' && t.trim()))], mapPos: normalizeMapPos(settings.mapPos) },
    // システム（第 9 段階）。画面設計を直した後に直す（designIds を、ある画面設計の id だけにするため）
    systems: uniqueIds((Array.isArray(raw.systems) ? raw.systems : []).filter(isObj).map((y) => normalizeSystem(y, designIds)), 'y'),
    designs,
  };
  syncLinkedItems(state);
  return state;
}

// 戻り値 { state, blockReason }。blockReason があるときは、保存を止める（データを消さないため）
function migrate(raw) {
  if (raw == null) return { state: createInitialState(), blockReason: null };
  if (!isObj(raw)) return { state: createInitialState(), blockReason: '保存データの形が正しくありません。' };
  const v = raw.schemaVersion === undefined ? 1 : Number(raw.schemaVersion);
  if (!Number.isInteger(v) || v < 1) return { state: createInitialState(), blockReason: '保存データの版（schemaVersion）が正しくありません。' };
  if (v > SCHEMA_VERSION) {
    return {
      state: normalizeState(raw, v),
      blockReason: `この保存データは新しい版のアプリで保存されています（データの形の版 ${v}。この版のアプリが分かるのは ${SCHEMA_VERSION} まで）。新しい版のアプリを使ってください。`,
    };
  }
  // データの形を上げるときは、ここに「v が N より小さければ N の形に直す」を足していく。
  // そのとき、改訂履歴の写し（revisions[].snapshot）は古い形のまま残る（写しは直さない）。写しを見る・戻す・比べるときは designFromSnapshot で
  // 今の形に直すので、古い形の写しもそこで直るようにする（normalizeDesign の中で直すか、designFromSnapshot に同じ直しを足す）。
  // 1 → 2（項目を画面設計の items へ移す）は normalizePart が受け持つ: 項目を指していない入力欄の部品 1 つから項目を 1 つ作る
  // （同じ項目名の部品が別の画面にあっても 1 つにまとめない。別の項目のつもりの部品を 1 つにしてしまわないため）
  // 2 → 3（ステータスに id・操作・移る先の欄・図の位置・systems）は normalizeItemProps・normalizePart（withStateView）・normalizeProps・
  // normalizeDesign・normalizeState が受け持つ。ステータスの id は名前から作るので、版 2 の写しを何度直しても同じ id になる
  return { state: normalizeState(raw, SCHEMA_VERSION), blockReason: null };
}

// ── 3. 保存 ───────────────────────────────────────────────────────────────────
// ブラウザで開いたとき。容量の上限に当たると save() が false を返す
class LocalStorageAdapter {
  constructor(key = STORAGE_KEY) {
    this.key = key;
  }
  // 中身が壊れているときは例外を投げる（起動のときに保存を止める）
  load() {
    const raw = localStorage.getItem(this.key);
    return raw ? JSON.parse(raw) : null;
  }
  save(state) {
    try {
      localStorage.setItem(this.key, stateJsonForSave(state));
      return true;
    } catch (e) {
      console.warn('保存に失敗しました:', e);
      return false;
    }
  }
}

// Electron で動いているとき。前の保存が終わるのを待たずにすぐ送る
// （1 つずつ並べて書くのは、メインプロセスの storage.js の saveChain が受け持つ）
class FileAdapter {
  constructor() {
    this.pending = Promise.resolve();
    this.lastError = null;
  }
  save(state) {
    const json = stateJsonForSave(state);
    this.pending = window.storageAPI.save(json)
      .then((res) => {
        if (!res || !res.ok) throw new Error((res && res.error) || 'わからない理由');
        this.lastError = null;
      })
      .catch((e) => {
        this.lastError = e;
        console.error('ファイルへの保存に失敗しました:', e);
        showBanner('ファイルへの保存に失敗しました（' + (e.message || e) + '）。ディスクの空きとフォルダの書き込みの許可を確かめてください。');
      });
    return true;
  }
}

// 保存を止めているとき（読み込めなかった・新しい版のデータ）。何も書かない
class BlockedAdapter {
  save() {
    return true;
  }
}

// 戻り値 { store, blockReason, notice }。blockReason があるときは保存を止める。notice は知らせるだけ（保存は続ける）
async function createAppStore() {
  let raw;
  let notice = null;
  try {
    if (window.storageAPI) {
      const res = await window.storageAPI.load();
      if (!res || !res.ok) throw new Error((res && res.error) || '読み込みに失敗しました');
      raw = res.json == null ? null : JSON.parse(res.json);
      notice = res.notice || null;
    } else {
      raw = new LocalStorageAdapter().load();
    }
  } catch (e) {
    const reason = '保存データを読み込めませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  let migrated;
  try {
    migrated = migrate(raw);
  } catch (e) {
    const reason = '保存データを今の形に直せませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  const { state, blockReason } = migrated;
  if (blockReason) return { store: new Store(new BlockedAdapter(), state), blockReason };
  const adapter = window.storageAPI ? new FileAdapter() : new LocalStorageAdapter();
  return { store: new Store(adapter, state), blockReason: null, notice };
}

// ── 4. 元に戻す ───────────────────────────────────────────────────────────────
// 改訂履歴の版の写し（revisions[].snapshot）は、写さずに使い回す（第 6 段階）。写しは画面設計 1 つ分の大きさがあり、そのまま扱うと、
// 版が増えるほど 1 回の操作（変わったかを見る JSON・元に戻すの履歴の写し）と保存が重くなるため。
// 写しは凍らせてあり書き換わらないので、比べる JSON と履歴では写しの所を印 { "$mimSnapshot": 番号 } に置き換え、履歴の中身は同じ写しを指す
const SNAP_REF = '$mimSnapshot';
const SNAP_REF_RE = /\{"\$mimSnapshot":(\d+)\}/g;
const snapNos = new WeakMap(); // 写し → 番号
let snapNoNext = 1;
const snapJsons = new WeakMap(); // 写し → 保存する JSON（写しごとに 1 回だけ作る）
// 戻り値 { refs（番号 → 写し）, design（画面設計の写しの所を印に置き換えた浅い写しを返す関数）, system（システムの同じ関数。第 9 段階）}
function snapshotRefs() {
  const refs = new Map();
  const ref = (snap) => {
    if (!snapNos.has(snap)) snapNos.set(deepFreeze(snap), snapNoNext++); // 読み込んだ写しも、ここで凍らせる
    refs.set(snapNos.get(snap), snap);
    return { [SNAP_REF]: snapNos.get(snap) };
  };
  // 画面設計とシステムの revisions の写しの所を印に置き換える（どちらも行の snapshot に写しを持つ）
  const withRefs = (x) => (Array.isArray(x.revisions) && x.revisions.some(hasSnapshot)
    ? { ...x, revisions: x.revisions.map((r) => (hasSnapshot(r) ? { ...r, snapshot: ref(r.snapshot) } : r)) }
    : x);
  return { refs, design: withRefs, system: withRefs };
}
// 写しを印に置き換えた JSON。戻り値 { json, refs }
function stateWithRefs(state) {
  const { refs, design, system } = snapshotRefs();
  const systems = Array.isArray(state.systems) ? { systems: state.systems.map(system) } : {};
  return { json: JSON.stringify({ ...state, designs: state.designs.map(design), ...systems }), refs };
}
// stateWithRefs の戻り値から状態を作り直す（写しは同じものを指す）
function stateFromRefs({ json, refs }) {
  const state = JSON.parse(json);
  const owners = [...state.designs, ...(Array.isArray(state.systems) ? state.systems : [])];
  owners.forEach((x) => (Array.isArray(x.revisions) ? x.revisions : []).forEach((r) => {
    if (isObj(r) && isObj(r.snapshot) && refs.has(r.snapshot[SNAP_REF])) r.snapshot = refs.get(r.snapshot[SNAP_REF]);
  }));
  return state;
}
const cloneState = (state) => stateFromRefs(stateWithRefs(state));
// 画面設計 1 つの、写しを印に置き換えた JSON（中身が変わったかを見るため）
const designJsonWithRefs = (d) => JSON.stringify(snapshotRefs().design(d));
// 保存する JSON（写しも中身ごと入る）
function stateJsonForSave(state) {
  const { json, refs } = stateWithRefs(state);
  if (!refs.size) return json;
  return json.replace(SNAP_REF_RE, (m, n) => {
    const snap = refs.get(Number(n));
    if (!snap) return m;
    if (!snapJsons.has(snap)) snapJsons.set(snap, JSON.stringify(snap));
    return snapJsons.get(snap);
  });
}

// 変更はすべて commit() を通す。変更の前の写しを履歴に積み、保存し、画面を描き直す。
class Store {
  constructor(adapter, state) {
    this.adapter = adapter;
    this.state = state;
    this.undoStack = [];
    this.redoStack = [];
    this.listeners = new Set();
    this.blockReason = null; // 保存を止めた理由（起動のときに入れる。AI の書く頼みを断る文に使う）
    this.batching = false;
  }
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }
  notify() {
    this.listeners.forEach((fn) => fn(this.state));
  }
  // 前の版を見ている間（第 6 段階）は、見せるための中身（view）に差し替え、変更・元に戻す・保存を止める。本当の中身は realState に置いておく
  startViewing(view) {
    if (!this.realState) this.realState = this.state;
    this.state = view;
    this.notify();
  }
  stopViewing() {
    if (!this.realState) return;
    this.state = this.realState;
    this.realState = null;
    this.notify();
  }
  get isViewing() { return !!this.realState; }
  // 何も変わらなかったときは、履歴に積まない（打ちかけの欄を保存し直しただけで、元に戻すが 1 回空振りし、やり直すが消えないように）
  commit(mutator, { history = true } = {}) {
    if (this.realState) return; // 前の版を見ている間は直せない
    if (this.batching) { mutator(this.state); return; } // batch の中では、積む・保存・描き直しを batch に任せる
    const before = history ? stateWithRefs(this.state) : null;
    mutator(this.state);
    if (history && stateWithRefs(this.state).json !== before.json) {
      this.undoStack.push(stateFromRefs(before));
      if (this.undoStack.length > HISTORY_LIMIT) this.undoStack.shift();
      this.redoStack = [];
    }
    this.persist();
    this.notify();
  }
  // AI の 1 回の頼み（第 7 段階。設計書の 8-1）。fn の中の何回の commit も、元に戻すの 1 回・保存の 1 回・描き直しの 1 回にまとめる。
  // fn が例外を投げたら、始める前の中身に戻して投げ直す（保存も描き直しもしない）。fn は待たずに終わる関数にする。
  // history は true（積む）・false（積まない）・'clear'（元に戻すの履歴を消す）か、それを返す関数（fn の後の中身を受け取る）。
  // 戻り値 { result（fn の戻り値）, changed（中身が変わったか）}。何も変わらなければ、保存も描き直しもしない
  batch(fn, { history = true } = {}) {
    if (this.realState) throw new Error('前の版を見ている間は直せません');
    if (this.batching) return { result: fn(), changed: null }; // 入れ子は外の batch に任せる
    const before = stateWithRefs(this.state);
    let result;
    this.batching = true;
    try {
      result = fn();
      if (result && typeof result.then === 'function') throw new Error('batch の中では待てません');
    } catch (e) {
      this.state = stateFromRefs(before);
      throw e;
    } finally {
      this.batching = false;
    }
    const changed = stateWithRefs(this.state).json !== before.json;
    if (!changed) return { result, changed };
    const mode = typeof history === 'function' ? history(this.state) : history;
    if (mode === 'clear') this.clearHistory();
    else if (mode) {
      this.undoStack.push(stateFromRefs(before));
      if (this.undoStack.length > HISTORY_LIMIT) this.undoStack.shift();
      this.redoStack = [];
    }
    this.persist();
    this.notify();
    return { result, changed };
  }
  // 今までに頼んだ保存が書き終わるのを待つ（AI の頼みの返事を、保存が済んでから返すため）。保存に失敗していたら reject
  whenSaved() {
    if (this.lastSaveOk === false) return Promise.reject(new Error('保存に失敗しました'));
    const a = this.adapter;
    if (!a || !a.pending) return Promise.resolve();
    return a.pending.then(() => { if (a.lastError) throw a.lastError; });
  }
  canUndo() { return !this.realState && this.undoStack.length > 0; }
  canRedo() { return !this.realState && this.redoStack.length > 0; }
  undo() {
    if (!this.canUndo()) return;
    this.redoStack.push(cloneState(this.state));
    this.state = this.undoStack.pop();
    this.persist();
    this.notify();
  }
  redo() {
    if (!this.canRedo()) return;
    this.undoStack.push(cloneState(this.state));
    this.state = this.redoStack.pop();
    this.persist();
    this.notify();
  }
  // 画面設計を開くとき・一覧へ戻るとき・完全に削除したときに呼ぶ（開いていない画面設計が戻るのを防ぐ）
  clearHistory() {
    this.undoStack = [];
    this.redoStack = [];
  }
  persist() {
    if (this.realState) return true; // 見せるための中身は保存しない
    this.lastSaveOk = this.adapter.save(this.state);
    if (this.lastSaveOk === false) showBanner('保存に失敗しました。ブラウザの保存領域がいっぱいの可能性があります。改訂履歴の古い版を消すと、空きが増えます。');
    return this.lastSaveOk;
  }
}

let store = null;
const findDesign = (state, id) => state.designs.find((d) => d.id === id) || null;

// ── 画面設計の操作（store を書き換える）──
// 画面設計を書き換えた後は、ほかの画面設計が取り込んでいる項目（つなげたまま）も同じ commit の中でそろえる
// （元に戻すで、元と取り込んだ側が一緒に戻るように）。取り込んだ側の更新日時は変えない
// 更新日時は、画面設計の中身が変わったときだけ変える（何も変わらない操作を、元に戻すの履歴に積まないため）
// 直せるステータスの項目（取り込んだ項目・前の版を見ている間は null）
function editableStatusItem(designId, itemId) {
  const it = store.isViewing ? null : findItem(findDesign(store.state, designId), itemId);
  return it && it.type === 'status' && !it.link ? it : null;
}
// 操作の前と次は、並びにあるステータスの id か ''。前と次が同じ操作（自分への矢印）は作らない
const validProcessAction = (a, ids) => [a.from, a.to].every((v) => v === '' || ids.includes(v)) && !(a.from && a.from === a.to);
// ステータスの項目の states か actions の中の 1 つを、toIndex（動かした後の位置）へ動かす。動かないときは false
function moveInList(designId, itemId, key, id, toIndex) {
  const list = findItem(findDesign(store.state, designId), itemId).props[key];
  const from = list.findIndex((x) => x.id === id);
  if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex >= list.length || toIndex === from) return false;
  return mutateDesign(designId, (d) => {
    const arr = findItem(d, itemId).props[key];
    const [x] = arr.splice(from, 1);
    arr.splice(toIndex, 0, x);
  });
}
// 画面設計を書き換えた後は、その画面設計と、項目をそろえた画面設計を指す作業の指す先のうち、もうない画面・ステータスを外す（clearDanglingStepRefs）
function mutateDesign(id, fn, { touch = true } = {}) {
  if (store.isViewing || !findDesign(store.state, id)) return false;
  store.commit((s) => {
    const d = findDesign(s, id);
    const before = touch ? designJsonWithRefs(d) : '';
    fn(d, s);
    if (touch && designJsonWithRefs(d) !== before) d.updatedAt = nowIso();
    syncLinkedItems(s);
    clearDanglingStepRefs(s, designAndImporters(s, id));
  });
  return true;
}
// ── システムの操作（第 9 段階）──
// 直せるシステム（前の版を見ている間・見つからないときは null）
const editableSystem = (id) => (store.isViewing ? null : findSystem(store.state, id));
// システムを書き換える（mutateDesign と同じ形）。前の版を見ている間・見つからないときは false。
// 更新日時は、システムの中身が変わったときだけ変える（touch: false なら変えない）。履歴の写しは印に置き換えて比べる（写しを毎回文字にしないため）
const systemJsonWithRefs = (y) => JSON.stringify(snapshotRefs().system(y));
function mutateSystem(id, fn, { touch = true } = {}) {
  if (!editableSystem(id)) return false;
  store.commit((s) => {
    const y = findSystem(s, id);
    const before = touch ? systemJsonWithRefs(y) : '';
    fn(y, s);
    if (touch && systemJsonWithRefs(y) !== before) y.updatedAt = nowIso();
  });
  return true;
}
// ── 設計ノートの操作の下請け（第 10 段階。actions の setNote…・editNote…・removeNote… が使う）。どれも、変わらないとき・直せないときは false ──
// 読み取ったこと・メモ（key は 'findings'・'memo'）。前後の空白と改行はそのまま入れ、NOTE_TEXT_MAX を超える分は切る
function setNoteText(sysId, key, text) {
  const y = editableSystem(sysId);
  const next = str(text).slice(0, NOTE_TEXT_MAX);
  if (!y || y.notes[key] === next) return false;
  return mutateSystem(sysId, (yy) => { yy.notes[key] = next; });
}
// 行（listKey は 'decisions'・'questions'）の欄を直す。書いた欄（fields のうち patch にあるもの）だけ変える。
// stage を書いたときは NOTE_STAGES の値だけ受ける（知らない段階は、今と同じ値でも断る）。文は前後の空白を取らずにそのまま入れる
function editNoteRow(sysId, listKey, rowId, patch, fields) {
  const y = editableSystem(sysId);
  const row = y && isObj(patch) ? y.notes[listKey].find((r) => r.id === rowId) : null;
  if (!row || ('stage' in patch && !NOTE_STAGES.includes(patch.stage))) return false;
  const next = {};
  fields.forEach((k) => { if (k in patch) next[k] = str(patch[k]); });
  if (Object.keys(next).every((k) => row[k] === next[k])) return false;
  return mutateSystem(sysId, (yy) => { Object.assign(yy.notes[listKey].find((r) => r.id === rowId), next); });
}
function removeNoteRow(sysId, listKey, rowId) {
  const y = editableSystem(sysId);
  if (!y || !y.notes[listKey].some((r) => r.id === rowId)) return false;
  return mutateSystem(sysId, (yy) => { yy.notes[listKey] = yy.notes[listKey].filter((r) => r.id !== rowId); });
}
// ── BDM の案からスイムレーン図を作る（第 9 段階の後半。actions.swimlaneFromPlan が使う）──
// 案（plan）は資料の窓口の bdmPlan の返事 { roles: [名前], steps: [{ key, role, col, kind, text, memo, src }], edges: [{ from, to, label }] }。
// 役割の名前は、名前と同じく前後の空白を取り、続く空白を 1 つにして比べる（cleanName）。名前のない役割は「名前なし」（読み込むときと同じ）
const planRoleName = (v) => cleanName(v) || '名前なし';
// 案の役割（roles の順。作業の役割で roles にない名前は後ろに足す）を、システムの役割に当てる。同じ名前の役割は使い回し、ない名前は新しい役割にする
// （今の役割の並びは変えず、後ろに足す。形は addRole と同じ）。戻り値 { added（足す役割）, reused（使い回す名前）, idOf（案の名前 → 役割の id）}
function rolesFromPlan(y, plan) {
  const names = [];
  const push = (v) => {
    const n = planRoleName(v);
    if (!names.includes(n)) names.push(n);
  };
  (Array.isArray(plan.roles) ? plan.roles : []).forEach(push);
  plan.steps.filter(isObj).forEach((p) => push(p.role));
  const added = [];
  const reused = [];
  const idOf = new Map();
  names.forEach((n) => {
    const r = y.roles.find((x) => x.name.trim() === n);
    if (r) reused.push(n);
    else added.push({ id: newId('l'), name: n, memo: '' });
    idOf.set(n, r ? r.id : added[added.length - 1].id);
  });
  return { added, reused, idOf };
}
// 案の作業と矢印を、システムの作業と矢印にする。作業の src には、どの資料から読んだか（materialId。資料の id か null）を material として持たせる。
// 今の作業のうち、同じ資料（src.material）の同じ BDM の箱（src.id が案の key）のものがあれば、その id と指す先（ref）を残す（同じ BDM を読み直しても、
// 作業と画面の対応が消えないように）。BDM の箱の id は図ごとに e1・e2… と数えるので、別の資料の案や、資料の分からない案（materialId が null）では
// 残さない（関係のない作業に、前の作業の画面へのつながりが付かないように）。矢印は案の key を作業の id にし、今の矢印に同じ「元 → 先」があれば、
// その id を使い回す。列のない作業は swimAutoCols で付け、setSwimlane と同じく normalizeSwimlane で直す（知らない種類・端のない矢印・自分への矢印・同じ向きの 2 本目）
function swimlaneFromPlanSteps(y, plan, idOf, materialId) {
  const used = new Set();
  const idByKey = new Map();
  const sameBox = (w, key) => isObj(w.src) && w.src.material === materialId && w.src.id != null && String(w.src.id) === key && !used.has(w.id);
  const steps = plan.steps.filter(isObj).map((p) => {
    const key = p.key == null ? '' : String(p.key);
    const old = key && materialId ? y.swimlane.steps.find((w) => sameBox(w, key)) : null;
    const id = old ? old.id : newId('w');
    used.add(id);
    if (!idByKey.has(key)) idByKey.set(key, id);
    return {
      id, roleId: idOf.get(planRoleName(p.role)), col: swimCol(p.col), kind: p.kind, text: str(p.text).trim(), memo: str(p.memo),
      ref: old ? clone(old.ref) : null, src: isObj(p.src) ? { ...clone(p.src), material: materialId } : null,
    };
  });
  const edges = (Array.isArray(plan.edges) ? plan.edges : []).filter(isObj).map((e) => {
    const [from, to] = [idByKey.get(String(e.from)) || '', idByKey.get(String(e.to)) || ''];
    const old = y.swimlane.edges.find((x) => x.from === from && x.to === to);
    return { id: old ? old.id : newId('e'), from, to, label: str(e.label).trim() };
  });
  return normalizeSwimlane({ steps: swimAutoCols(steps, edges), edges });
}

const actions = {
  // systemId を渡すと、作った画面設計をそのシステムに入れる（同じ 1 回の変更で）。ない・ごみ箱にあるシステムを渡したときは作らない
  createDesign(name, target, { systemId = null } = {}) {
    const n = cleanName(name);
    if (!n || (systemId && !liveSystem(store.state, systemId))) return null;
    const d = createDesignData(n, target);
    store.commit((s) => {
      addCustomTarget(s, target);
      s.designs.push(d);
      if (systemId) putIntoSystem(s, systemId, d.id);
    });
    return d.id;
  },
  renameDesign(id, name) {
    const n = cleanName(name);
    if (!n) return false;
    return mutateDesign(id, (d) => { d.name = n; });
  },
  // patch は { name, target, description } のどれか
  updateDesignInfo(id, patch) {
    return mutateDesign(id, (d, s) => {
      if ('name' in patch) d.name = cleanName(patch.name) || d.name;
      if ('target' in patch) {
        d.target = patch.target;
        addCustomTarget(s, patch.target);
      }
      if ('description' in patch) d.description = String(patch.description);
    });
  },
  // systemId を渡すと、複製をそのシステムにだけ入れる（同じ 1 回の変更で。設計書の 5-6）。渡さなければ、どのシステムにも入れない。
  // ない・ごみ箱にあるシステムを渡したときは複製しない
  duplicateDesign(id, { systemId = null } = {}) {
    const src = findDesign(store.state, id);
    if (!src || (systemId && !liveSystem(store.state, systemId))) return null;
    const copy = duplicateDesignData(src);
    store.commit((s) => {
      s.designs.push(copy);
      if (systemId) putIntoSystem(s, systemId, copy.id);
    });
    return copy.id;
  },
  trashDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = nowIso(); }, { touch: false });
  },
  restoreDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = null; }, { touch: false });
  },
  // 完全に削除は戻せない。履歴に写しが残っていると元に戻すで戻ってしまうので、履歴も空にする
  deleteDesignForever(id) {
    if (!findDesign(store.state, id)) return false;
    store.clearHistory();
    store.commit((s) => {
      s.designs = s.designs.filter((d) => d.id !== id);
      clearDesignRefs(s, id); // この画面設計の画面を指していた移る先は外す（更新日時は変えない）
      // 全部のシステムから外し、この画面設計を指していた作業の指す先を外す（作業の文は残す。システムの更新日時は変えない。設計書の 5-6）
      s.systems.forEach((y) => { y.designIds = y.designIds.filter((x) => x !== id); });
      clearStepRefs(s, id);
      syncLinkedItems(s); // この画面設計から取り込んでいた項目は、今の中身で固定する
    }, { history: false });
    return true;
  },

  // ── システム（第 9 段階。AI設計基盤_設計書.md の 5-3・5-6）──
  // 断ったとき（名前が空・見つからない・同じ名前の役割・動かない など）は null・false を返し、履歴に積まない
  // 作ったシステムの id を返す
  createSystem({ name, description = '' } = {}) {
    const n = cleanName(name);
    if (!n || store.isViewing) return null;
    const y = createSystemData({ name: n, description: str(description) });
    store.commit((s) => { s.systems.push(y); });
    return y.id;
  },
  // patch は { name, description } のどれか。名前を空にしたときは今の名前のまま
  updateSystem(id, patch = {}) {
    if (!isObj(patch)) return false;
    return mutateSystem(id, (y) => {
      if ('name' in patch) y.name = cleanName(patch.name) || y.name;
      if ('description' in patch) y.description = str(patch.description);
    });
  },
  trashSystem(id) {
    return mutateSystem(id, (y) => { y.trashedAt = nowIso(); }, { touch: false });
  },
  restoreSystem(id) {
    return mutateSystem(id, (y) => { y.trashedAt = null; }, { touch: false });
  },
  // システムだけを消す（入れていた画面設計は残る）。戻せないので、画面設計の完全な削除と同じく、元に戻すの履歴も空にする
  deleteSystemForever(id) {
    if (!editableSystem(id)) return false;
    store.clearHistory();
    store.commit((s) => { s.systems = s.systems.filter((y) => y.id !== id); }, { history: false });
    return true;
  },
  // 今ある画面設計を、同じ画面設計のまま入れる（案B。ほかのシステムにも入っていてよい）。もう入っている・ごみ箱の画面設計は入れない。
  // ごみ箱のシステムにも入れない
  addDesignToSystem(sysId, designId) {
    const y = editableSystem(sysId);
    const d = findDesign(store.state, designId);
    if (!y || y.trashedAt || !d || d.trashedAt || y.designIds.includes(designId)) return false;
    return mutateSystem(sysId, (yy) => { yy.designIds.push(designId); });
  },
  // 今ある画面設計を複製して、そのシステムにだけ入れる（別の画面設計になり、同期しない）。戻り値は新しい画面設計の id
  copyDesignIntoSystem(sysId, designId) {
    if (!editableSystem(sysId)) return null;
    return actions.duplicateDesign(designId, { systemId: sysId });
  },
  // いくつかの画面設計をまとめて入れる・複製して入れる（最初の画面の入れる窓。T5）。1 回の変更なので、元に戻す 1 回で戻る。
  // 戻り値は、入れた画面設計の id の並び（複製は新しい画面設計の id の並び）
  addDesignsToSystem(sysId, designIds) {
    if (!editableSystem(sysId) || !Array.isArray(designIds)) return [];
    const done = [];
    store.batch(() => designIds.forEach((id) => { if (actions.addDesignToSystem(sysId, id)) done.push(id); }));
    return done;
  },
  copyDesignsIntoSystem(sysId, designIds) {
    if (!editableSystem(sysId) || !Array.isArray(designIds)) return [];
    const done = [];
    store.batch(() => designIds.forEach((id) => {
      const copy = actions.copyDesignIntoSystem(sysId, id);
      if (copy) done.push(copy);
    }));
    return done;
  },
  // システムから外す（画面設計は残る）
  removeDesignFromSystem(sysId, designId) {
    const y = editableSystem(sysId);
    if (!y || !y.designIds.includes(designId)) return false;
    return mutateSystem(sysId, (yy) => { yy.designIds = yy.designIds.filter((x) => x !== designId); });
  },
  // 並べ替える。toIndex は、ごみ箱の画面設計を除いた並び（designsOfSystem。画面に出す並び）での、動かした後の位置。
  // ごみ箱の画面設計は designIds の同じ場所に残す（戻したときに、元の辺りに出るように）
  moveDesignInSystem(sysId, designId, toIndex) {
    const y = editableSystem(sysId);
    const shown = y ? designsOfSystem(store.state, y).map((d) => d.id) : [];
    const from = shown.indexOf(designId);
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex >= shown.length || toIndex === from) return false;
    const next = [...shown];
    next.splice(toIndex, 0, ...next.splice(from, 1));
    return mutateSystem(sysId, (yy) => {
      let k = 0;
      yy.designIds = yy.designIds.map((id) => (shown.includes(id) ? next[k++] : id));
    });
  },
  // 役割（スイムレーンのレーン）。名前は空にしない・同じシステムの中で同じ名前にしない。戻り値は役割の id
  addRole(sysId, name) {
    const y = editableSystem(sysId);
    const n = cleanName(name);
    if (!y || !n || y.roles.some((r) => r.name === n)) return null;
    const id = newId('l');
    mutateSystem(sysId, (yy) => { yy.roles.push({ id, name: n, memo: '' }); });
    return id;
  },
  renameRole(sysId, roleId, name) {
    const y = editableSystem(sysId);
    const n = cleanName(name);
    if (!y || !n || !y.roles.some((r) => r.id === roleId) || y.roles.some((r) => r.name === n && r.id !== roleId)) return false;
    return mutateSystem(sysId, (yy) => { yy.roles.find((r) => r.id === roleId).name = n; });
  },
  // 役割のメモ（その役割の人・仕事の説明など。T4 で AI の update_system の set_memo のために足した）
  setRoleMemo(sysId, roleId, memo) {
    const y = editableSystem(sysId);
    if (!y || !y.roles.some((r) => r.id === roleId)) return false;
    return mutateSystem(sysId, (yy) => { yy.roles.find((r) => r.id === roleId).memo = str(memo); });
  },
  // toIndex は動かした後の位置（0 がいちばん上のレーン）
  moveRole(sysId, roleId, toIndex) {
    const y = editableSystem(sysId);
    const from = y ? y.roles.findIndex((r) => r.id === roleId) : -1;
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex >= y.roles.length || toIndex === from) return false;
    return mutateSystem(sysId, (yy) => { yy.roles.splice(toIndex, 0, ...yy.roles.splice(from, 1)); });
  },
  // 役割を消す。その役割の作業と、その作業につながる矢印も一緒に消す（1 回の変更なので、元に戻す 1 回で戻る）
  deleteRole(sysId, roleId) {
    const y = editableSystem(sysId);
    if (!y || !y.roles.some((r) => r.id === roleId)) return false;
    return mutateSystem(sysId, (yy) => {
      const gone = new Set(yy.swimlane.steps.filter((w) => w.roleId === roleId).map((w) => w.id));
      yy.roles = yy.roles.filter((r) => r.id !== roleId);
      yy.swimlane.steps = yy.swimlane.steps.filter((w) => !gone.has(w.id));
      yy.swimlane.edges = yy.swimlane.edges.filter((e) => !gone.has(e.from) && !gone.has(e.to));
    });
  },
  // スイムレーンをまとめて置き換える（読み込むときと同じに直す: 知らない種類は「作業」・端のない矢印と自分への矢印は外す）
  setSwimlane(sysId, sw = {}) {
    if (!editableSystem(sysId) || !isObj(sw)) return false;
    const next = normalizeSwimlane(clone({ steps: Array.isArray(sw.steps) ? sw.steps : [], edges: Array.isArray(sw.edges) ? sw.edges : [] }));
    return mutateSystem(sysId, (yy) => { yy.swimlane = { ...yy.swimlane, steps: next.steps, edges: next.edges }; });
  },
  // BDM の案（資料の窓口の bdmPlan の返事の plan）でスイムレーン図を置き換える（第 9 段階の後半。AI の swimlane_from_bdm から呼ぶ）。
  // materialId は案を作った BDM の資料の id（作業の src.material に入れる。同じ資料の同じ箱の作業だけ、id と指す先を残す）。
  // 役割は同じ名前を使い回し、ない名前を後ろに足す（rolesFromPlan）。作業と矢印は案で置き換える（swimlaneFromPlanSteps。案にない作業・矢印は消える）。
  // 役割とスイムレーンを 1 回の変更で直すので、元に戻す 1 回で全部戻る。中身が同じなら履歴に積まず、更新日時も変えない（changed: false）。
  // 戻り値 { addedRoles, reusedRoles（役割の名前の並び）, steps, edges（置き換えた後の数）, changed }。直せないシステム・案の形が違うときは null
  swimlaneFromPlan(sysId, plan, opts = {}) {
    const y = editableSystem(sysId);
    if (!y || !isObj(plan) || !Array.isArray(plan.steps)) return null;
    const roles = rolesFromPlan(y, plan);
    const sw = swimlaneFromPlanSteps(y, plan, roles.idOf, (isObj(opts) && str(opts.materialId)) || null);
    const before = systemJsonWithRefs(y);
    mutateSystem(sysId, (yy) => {
      yy.roles.push(...roles.added);
      yy.swimlane = { ...yy.swimlane, steps: sw.steps, edges: sw.edges };
    });
    const now = findSystem(store.state, sysId);
    return {
      addedRoles: roles.added.map((r) => r.name), reusedRoles: roles.reused,
      steps: now.swimlane.steps.length, edges: now.swimlane.edges.length, changed: systemJsonWithRefs(now) !== before,
    };
  },
  // 作業を足す。spec は { roleId, col, kind, text, memo, ref }。役割はこのシステムにあるもの。列を書かなければ、いちばん右の作業の次の列。
  // 種類を書かなければ「作業」。役割が見つからない・知らない種類・列が 0 以上の整数でないときは null。戻り値は作業の id
  addStep(sysId, spec = {}) {
    const y = editableSystem(sysId);
    if (!y || !isObj(spec) || !y.roles.some((r) => r.id === spec.roleId)) return null;
    if ((spec.kind != null && !SWIM_KINDS.includes(spec.kind)) || (spec.col != null && !isSwimCol(spec.col))) return null;
    const w = normalizeStep({
      roleId: spec.roleId,
      col: spec.col != null ? spec.col : y.swimlane.steps.reduce((m, x) => Math.max(m, x.col + 1), 0),
      kind: spec.kind || 'task', text: str(spec.text).trim(), memo: str(spec.memo), ref: clone(spec.ref || {}),
    });
    mutateSystem(sysId, (yy) => { yy.swimlane.steps.push(w); });
    return w.id;
  },
  // 作業を直す。patch は { kind, text, memo, ref } のどれか（ref は丸ごと置き換える）。役割と列は moveStep で変える
  updateStep(sysId, stepId, patch = {}) {
    const y = editableSystem(sysId);
    if (!y || !isObj(patch) || !findStep(y, stepId) || ('kind' in patch && !SWIM_KINDS.includes(patch.kind))) return false;
    return mutateSystem(sysId, (yy) => {
      const w = findStep(yy, stepId);
      if ('kind' in patch) w.kind = patch.kind;
      if ('text' in patch) w.text = str(patch.text).trim();
      if ('memo' in patch) w.memo = str(patch.memo);
      if ('ref' in patch) w.ref = normalizeStepRef(clone(patch.ref || {}));
    });
  },
  // 作業を動かす。to は { roleId, col } のどれか（役割はこのシステムにあるもの、列は 0 以上の整数）
  moveStep(sysId, stepId, to = {}) {
    const y = editableSystem(sysId);
    if (!y || !isObj(to) || !findStep(y, stepId)) return false;
    if (('roleId' in to && !y.roles.some((r) => r.id === to.roleId)) || ('col' in to && !isSwimCol(to.col))) return false;
    return mutateSystem(sysId, (yy) => {
      const w = findStep(yy, stepId);
      if ('roleId' in to) w.roleId = to.roleId;
      if ('col' in to) w.col = to.col;
    });
  },
  // 作業を消す。つながる矢印も消す
  deleteStep(sysId, stepId) {
    const y = editableSystem(sysId);
    if (!y || !findStep(y, stepId)) return false;
    return mutateSystem(sysId, (yy) => {
      yy.swimlane.steps = yy.swimlane.steps.filter((w) => w.id !== stepId);
      yy.swimlane.edges = yy.swimlane.edges.filter((e) => e.from !== stepId && e.to !== stepId);
    });
  },
  // 矢印を足す。同じ向きの同じ 2 つの作業の間に 2 本目は作らない（逆向きは作れる）・自分への矢印は作らない。戻り値は矢印の id
  addEdge(sysId, from, to, label = '') {
    const y = editableSystem(sysId);
    if (!y || from === to || !findStep(y, from) || !findStep(y, to) || y.swimlane.edges.some((e) => e.from === from && e.to === to)) return null;
    const e = { id: newId('e'), from, to, label: str(label).trim() };
    mutateSystem(sysId, (yy) => { yy.swimlane.edges.push(e); });
    return e.id;
  },
  // 矢印の文（例: 差し戻し）を直す
  updateEdge(sysId, edgeId, label) {
    const y = editableSystem(sysId);
    if (!y || !y.swimlane.edges.some((e) => e.id === edgeId)) return false;
    return mutateSystem(sysId, (yy) => { yy.swimlane.edges.find((e) => e.id === edgeId).label = str(label).trim(); });
  },
  deleteEdge(sysId, edgeId) {
    const y = editableSystem(sysId);
    if (!y || !y.swimlane.edges.some((e) => e.id === edgeId)) return false;
    return mutateSystem(sysId, (yy) => { yy.swimlane.edges = yy.swimlane.edges.filter((e) => e.id !== edgeId); });
  },
  // 矢印の端を付け替える（第 9 段階の T6b。選んだ矢印の端のオレンジの ○ のドラッグ）。to は { from, to } のどれか（このシステムの作業の id）。
  // 自分への矢印になるとき・同じ向きの矢印がほかにあるときは false（矢印の文字はそのまま）
  relinkEdge(sysId, edgeId, to = {}) {
    const y = editableSystem(sysId);
    const e = y && isObj(to) ? y.swimlane.edges.find((x) => x.id === edgeId) : null;
    if (!e) return false;
    const [from, dest] = ['from' in to ? to.from : e.from, 'to' in to ? to.to : e.to];
    if (from === dest || !findStep(y, from) || !findStep(y, dest) || y.swimlane.edges.some((x) => x.id !== edgeId && x.from === from && x.to === dest)) return false;
    return mutateSystem(sysId, (yy) => { Object.assign(yy.swimlane.edges.find((x) => x.id === edgeId), { from, to: dest }); });
  },
  // ── 資料（第 9 段階の後半。設計書の 5-3）──
  // 資料の行を足す。added は資料の窓口（materialsAPI の pick・addDropped）の返事の added [{ id, name, kind, size, file, legacy }]（ファイルは窓口が
  // もう写してある）。古い形（legacy）は行に入れない（isLegacyMaterial でファイルの名前から見る）。今ある行と同じ id は新しい id にする。
  // 保存したファイルの名前（file）のない行は足さない（読めず、起動時の掃除でも残せないため）。
  // 1 回の変更なので、元に戻す 1 回で全部消える。戻り値は足した行の写しの並び（足すものがない・直せないシステムのときは []）
  addMaterials(sysId, added) {
    const list = Array.isArray(added) ? added.filter((a) => isObj(a) && str(a.file)) : [];
    if (!editableSystem(sysId) || !list.length) return [];
    const addedAt = nowIso();
    const rows = list.map((a) => normalizeMaterial({ id: a.id, name: a.name, kind: a.kind, size: a.size, addedAt, memo: '', file: a.file }));
    mutateSystem(sysId, (yy) => {
      yy.materials.push(...rows);
      uniqueIds(yy.materials, 'm'); // 足した行（後ろ）の id を直す。rows も同じ行なので、返す id も直った id になる
    });
    return clone(rows);
  },
  // 資料のメモ（どんな資料か・どこを見るかなど）。前後の空白を取る。長さの上限は設けない（役割・作業のメモと同じ）
  setMaterialMemo(sysId, matId, memo) {
    const y = editableSystem(sysId);
    if (!y || !y.materials.some((m) => m.id === matId)) return false;
    return mutateSystem(sysId, (yy) => { yy.materials.find((m) => m.id === matId).memo = str(memo).trim(); });
  },
  // 資料の行を消す。ファイルはすぐには消さない（元に戻すで行が戻ったときに、ファイルがないと困るため。どの行からも指されていないファイルは、
  // 次に起動したときに消す〔sweepMaterialFiles〕）
  deleteMaterial(sysId, matId) {
    const y = editableSystem(sysId);
    if (!y || !y.materials.some((m) => m.id === matId)) return false;
    return mutateSystem(sysId, (yy) => { yy.materials = yy.materials.filter((m) => m.id !== matId); });
  },
  // ── 設計ノート（第 10 段階。設計書の 5-3。形は normalizeNotes）──
  // 段階の進み具合を変える。done・skipped に変わったときだけ確認の日時（confirmedAt）を入れ（done ↔ skipped も、変わったので入れ直す）、
  // ほかの進み具合に変わったら null にする。知らない段階・進み具合・今と同じ進み具合のときは何も変えず false
  setNoteStage(sysId, stage, state) {
    const y = editableSystem(sysId);
    if (!y || !NOTE_STAGES.includes(stage) || !NOTE_STATES.includes(state) || y.notes.stages[stage].state === state) return false;
    return mutateSystem(sysId, (yy) => {
      const st = yy.notes.stages[stage];
      st.state = state;
      st.confirmedAt = state === 'done' || state === 'skipped' ? nowIso() : null;
    });
  },
  // ① で資料から読み取ったこと・メモ。前後の空白と改行はそのまま入れ、NOTE_TEXT_MAX を超える分は切る
  setNoteFindings(sysId, text) { return setNoteText(sysId, 'findings', text); },
  setNoteMemo(sysId, text) { return setNoteText(sysId, 'memo', text); },
  // 決めたことと理由の行を足す。spec は { stage, text, reason }（stage は NOTE_STAGES の値。文は省ける）。日付は今日。戻り値は行の id（足せなければ null）
  addNoteDecision(sysId, spec = {}) {
    if (!editableSystem(sysId) || !isObj(spec) || !NOTE_STAGES.includes(spec.stage)) return null;
    const row = { id: newId('nd'), date: todayDay(), stage: spec.stage, text: str(spec.text), reason: str(spec.reason) };
    mutateSystem(sysId, (yy) => { yy.notes.decisions.push(row); });
    return row.id;
  },
  // 決めたことの行を直す。patch は { stage, text, reason } のどれか（書いた欄だけ変える）
  editNoteDecision(sysId, rowId, patch = {}) { return editNoteRow(sysId, 'decisions', rowId, patch, ['stage', 'text', 'reason']); },
  removeNoteDecision(sysId, rowId) { return removeNoteRow(sysId, 'decisions', rowId); },
  // まだ決まっていないことの行を足す。spec は { stage, text }。答えは空・解決の日時は null。戻り値は行の id（足せなければ null）
  addNoteQuestion(sysId, spec = {}) {
    if (!editableSystem(sysId) || !isObj(spec) || !NOTE_STAGES.includes(spec.stage)) return null;
    const row = { id: newId('nq'), date: todayDay(), stage: spec.stage, text: str(spec.text), answer: '', resolvedAt: null };
    mutateSystem(sysId, (yy) => { yy.notes.questions.push(row); });
    return row.id;
  },
  // まだ決まっていないことの行を直す。patch は { stage, text }（答えは answerNoteQuestion で変える）
  editNoteQuestion(sysId, rowId, patch = {}) { return editNoteRow(sysId, 'questions', rowId, patch, ['stage', 'text']); },
  // 答えを入れる。前後の空白を取って空でなければ、解決の日時（resolvedAt）を入れる。すでに入っているときは、答えだけを変えても付け直さない。空にしたら null
  answerNoteQuestion(sysId, rowId, answer) {
    const y = editableSystem(sysId);
    const q = y ? y.notes.questions.find((r) => r.id === rowId) : null;
    const next = str(answer);
    if (!q || q.answer === next) return false;
    return mutateSystem(sysId, (yy) => {
      const r = yy.notes.questions.find((x) => x.id === rowId);
      r.answer = next;
      if (!next.trim()) r.resolvedAt = null;
      else if (!r.resolvedAt) r.resolvedAt = nowIso();
    });
  },
  removeNoteQuestion(sysId, rowId) { return removeNoteRow(sysId, 'questions', rowId); },
  // システムの履歴の行（AI が直す前の状態・戻す前の状態）の中身に戻す（q65。人がシステムの画面の「履歴」から戻す。AI の道具はない）。
  // 今の中身を「戻す前の状態」の行に残してから、写しの中身（名前・説明・役割・スイムレーン・画面設計の並び）で置き換える。
  // 写しにあって今ない画面設計は外し、作業の指す先も今の中身で検める（systemFromSnapshot）。1 回の変更なので、元に戻す 1 回で戻る。
  // 「戻す前の状態」の行は新しい方から 10 行まで。戻した行がない・写しがない・写しの中身が今と同じ（T9 の見直し）ときは false
  restoreSystemRevision(sysId, rowId) {
    const y = editableSystem(sysId);
    const r = y && rowId ? y.revisions.find((x) => isObj(x) && x.id === rowId) : null;
    if (!hasSnapshot(r) || sameAsSystemRevision(store.state, y, r)) return false;
    const title = systemRevisionTitle(r);
    return mutateSystem(sysId, (yy, s) => {
      const from = systemFromSnapshot(r.snapshot, s);
      yy.revisions.push(systemRevisionRow(yy, 'restore', { note: `「${title}（${revisionDay(r)}）」に戻す前の状態` }));
      trimRevisionRows(yy, 'restore', SYSTEM_RESTORE_ROWS_MAX);
      Object.assign(yy, from);
    });
  },
  // ── 改訂履歴（第 6 段階）──
  // 改訂する。今の中身の写しと、ひとつ前の版からの変更内容の一覧を、次の番号の版として残す。戻り値は足した行の id
  addRevision(designId, { note = '', day = '' } = {}) {
    let id = null;
    mutateDesign(designId, (d, s) => {
      const { changes, baseNo } = changesSinceLatest(d, s);
      const row = revisionRow(d, 'revision', { no: nextVersionNo(d), note: String(note).trim(), date: revisionDate(day), changes, baseNo });
      d.revisions.push(row);
      id = row.id;
    });
    return id;
  },
  // 版の行の「変えた内容」と日付を書き直す（自動の行は書き直さない）
  updateRevision(designId, revId, { note, day }) {
    return mutateDesign(designId, (d) => {
      const r = findRevision(d, revId);
      if (!isVersionRow(r)) return;
      if (note != null) r.note = String(note).trim();
      if (day && day !== revisionDay(r)) r.date = revisionDate(day);
    });
  },
  // 行を消す（その版の写しも消える。版の番号は付け直さない）
  deleteRevision(designId, revId) {
    return mutateDesign(designId, (d) => { d.revisions = d.revisions.filter((r) => !(isObj(r) && r.id === revId)); });
  },
  // 前の版に戻す。今の中身を「戻す前の状態」として残してから、写しの中身で置き換える。
  // 取り込んだ項目は、mutateDesign の syncLinkedItems で元のモックとつなぎ直す（元がなければ写しの中身で固定して「元なし」。q43）
  restoreRevision(designId, revId) {
    let done = false;
    mutateDesign(designId, (d, s) => {
      const r = findRevision(d, revId);
      if (!hasSnapshot(r)) return;
      const from = designFromSnapshot(d, r);
      d.revisions.push(revisionRow(d, 'restore', { note: `「${revisionTitle(r)}（${revisionDay(r)}）」に戻す前の状態` }));
      Object.assign(d, designContentOf(from));
      addCustomTarget(s, from.target);
      done = true;
    });
    return done;
  },
  // patch は { name, device, height, showHeader, tablePos } のどれか
  updateScreen(designId, screenId, patch) {
    return mutateDesign(designId, (d) => {
      const i = d.screens.findIndex((x) => x.id === screenId);
      if (i < 0) return;
      let sc = d.screens[i];
      if ('device' in patch && own(DEVICES, patch.device)) {
        sc = changeDevice(sc, patch.device);
        // 縦は、いちばん下の部品が入るまで画面を伸ばす（部品を上へ寄せて重ねないため）。
        // 横は、幅が狭くなって画面からはみ出す部品を画面の中へ寄せる（知らない種類の部品はそのまま）
        sc.height = Math.max(sc.height, minScreenHeight(sc));
        sc.parts = sc.parts.map((p) => (partType(p.type) ? { ...p, ...fitRect(p, sc) } : p));
        sc.callouts = sc.callouts.map((c) => ({ ...c, ...fitCallout(c, sc) })); // 画面が狭くなったら、吹き出しも範囲の中へ寄せる
      }
      if ('height' in patch) {
        sc = { ...sc, height: Math.max(snapHeight(patch.height, sc.device), minScreenHeight(sc)) };
        sc.callouts = sc.callouts.map((c) => ({ ...c, ...fitCallout(c, sc) }));
      }
      if ('name' in patch) sc = { ...sc, name: cleanName(patch.name) || sc.name };
      if ('showHeader' in patch) sc = { ...sc, showHeader: !!patch.showHeader };
      if ('tablePos' in patch) sc = { ...sc, tablePos: patch.tablePos === 'bottom' ? 'bottom' : 'right' };
      d.screens[i] = sc;
    });
  },
  // ひな形から画面を足し、afterId の画面のすぐ後ろに入れる。名前はひな形の名前（白紙は「画面 3」のような番号）。戻り値は新しい画面の id
  addScreen(designId, templateId, afterId = null) {
    const d = findDesign(store.state, designId);
    const tpl = SCREEN_TEMPLATES.find((t) => t.id === templateId);
    if (!d || !tpl) return null;
    const name = tpl.id === 'blank' ? blankScreenName(d) : uniqueScreenName(d, tpl.name);
    const { screen, items } = screenFromTemplate(d, tpl.id, name);
    mutateDesign(designId, (dd) => {
      dd.items.push(...items);
      insertScreenAfter(dd, screen, afterId);
    });
    return screen.id;
  },
  // 画面を複製し、元の画面のすぐ後ろに入れる。戻り値は新しい画面の id
  duplicateScreen(designId, screenId) {
    const d = findDesign(store.state, designId);
    const src = findScreen(designId, screenId);
    if (!src) return null;
    const copy = copyScreenData(src, { name: copyScreenName(d, src.name), designId });
    mutateDesign(designId, (dd) => { insertScreenAfter(dd, copy, screenId); });
    return copy.id;
  },
  // 画面の並びを変える。toIndex は今の並びでの入れる位置（0 ならいちばん上、画面の数ならいちばん下）。動かないときは履歴に積まない
  moveScreen(designId, screenId, toIndex) {
    const d = findDesign(store.state, designId);
    const from = d ? d.screens.findIndex((s) => s.id === screenId) : -1;
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex > d.screens.length || toIndex === from || toIndex === from + 1) return false;
    return mutateDesign(designId, (dd) => {
      const [s] = dd.screens.splice(from, 1);
      dd.screens.splice(toIndex > from ? toIndex - 1 : toIndex, 0, s);
    });
  },
  // 画面を消す（最後の 1 つは消せない）。データベースの項目は一覧表に残す。ボタン・リンクの文字がこの画面を指していれば、移る先を外す
  // （ほかの画面設計の分も同じ 1 回の変更で外し、外した画面設計の更新日時も変える）。システムの作業がこの画面を指していれば、指す先の画面を外す
  deleteScreen(designId, screenId) {
    const d = findDesign(store.state, designId);
    if (!d || d.screens.length < 2 || !findScreen(designId, screenId)) return false;
    return mutateDesign(designId, (dd, s) => {
      dd.screens = dd.screens.filter((x) => x.id !== screenId);
      const now = nowIso();
      clearScreenRefs(s, designId, screenId).filter((id) => id !== designId).forEach((id) => { findDesign(s, id).updatedAt = now; });
      clearStepRefs(s, designId, { screenId });
    });
  },

  // ── 部品の操作 ──
  // 決めた位置に部品をまとめて置く（並べ方 layoutPlacements の結果など）。specs は placePartIn の spec の並び。戻り値は置いた部品の id の並び
  placeParts(designId, screenId, specs) {
    const ids = [];
    mutateDesign(designId, (d) => {
      const sc = d.screens.find((x) => x.id === screenId);
      if (sc) specs.forEach((spec) => ids.push(placePartIn(sc, d, spec).id));
    });
    return ids;
  },
  // at は置く位置（画面の左上から）。帯の下に置き、同じ位置に部品があればずらす。戻り値は新しい部品の id
  addPart(designId, screenId, type, at) {
    const sc = findScreen(designId, screenId);
    const t = partType(type);
    if (!sc || !t) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    // 入力欄の部品と表（最初はテーブル）を置くと、データベースの項目の一覧表にも項目を 1 つ足す（項目名と設定は項目が持つ）。
    // ステータスの印・進み具合の矢印は、画面設計のステータスの項目を指す（なければ作る）
    const d0 = findDesign(store.state, designId);
    const status = type === 'status' || type === 'steps' ? d0.items.find((it) => it.type === 'status') : null;
    const itemType = isInputType(type) ? type : type === 'table' ? 'table' : type === 'status' || type === 'steps' ? 'status' : '';
    const item = itemType && !status ? createItemData(itemType) : null;
    const p = createPartData(type, sc, freeSpot(sc, start), (status || item || {}).id || null, { design: d0 });
    if (p.view && 'current' in p.view) p.view.current = defaultStateId(status || item);
    mutateScreen(designId, screenId, (s, d) => {
      if (item) d.items.push(item);
      s.parts.push(p);
    });
    return p.id;
  },
  // patch は { label, labelPos, sample, placeholder, required, memo, numbered, props } のどれか（props は足りない分だけ書き換える）。
  // 項目を指す部品の label（項目名）・required・memo・props は項目に書く（その項目を置いた全部の画面が変わる）。
  // 項目を一覧表から消した後に残った部品では、それらを書き換えない（消したときの中身で固定する）
  updatePart(designId, screenId, partId, patch) {
    return mutatePart(designId, screenId, partId, (p, sc, d) => {
      ['labelPos', 'sample', 'placeholder'].forEach((k) => { if (k in patch) p[k] = patch[k]; });
      if ('numbered' in patch) p.no = patch.numbered ? (p.no != null ? p.no : nextPartNo(sc)) : null;
      if (isObj(patch.view)) {
        p.view = { ...(p.view || {}), ...clone(patch.view) };
        if (p.type === 'table') {
          p.view = normalizeTableView(p.view);
          const h = tableHeight(p.view.rows);
          if (p.y + h > sc.height) sc.height = heightToFit(p.y + h, sc.device); // 表を上へずらさず、画面を伸ばす
          Object.assign(p, fitRect({ ...p, h }, sc));
        }
      }
      const item = findItem(d, p.itemId);
      if (item) { if (!item.link) setItemFields(d, item, patch); } // 取り込んだ項目は直せない（元のモックで直す）
      else if (!p.itemId) applyFieldPatch(p, 'label', patch);
    });
  },
  // 位置と大きさを変える（マス目に吸い付け、画面の中に収める）。変わらないときは履歴に積まない
  movePart(designId, screenId, partId, rect) {
    const sc = findScreen(designId, screenId);
    const p = findPart(sc, partId);
    if (!p) return false;
    const r = fitRect(rect, sc);
    if (r.x === p.x && r.y === p.y && r.w === p.w && r.h === p.h) return false;
    return mutatePart(designId, screenId, partId, (q) => { Object.assign(q, r); });
  },
  // 部品を消す。その部品につないだ吹き出しは残し、線だけを外す（画像 q27 の決めごと）
  deletePart(designId, screenId, partId) {
    return mutatePart(designId, screenId, partId, (p, sc) => {
      sc.parts = sc.parts.filter((x) => x.id !== partId);
      sc.callouts.forEach((c) => { if (c.target === partId) c.target = null; });
    });
  },

  // ── まとめて操作（画像 q28）。sel は [{ k: 'p'（部品）か 'c'（吹き出し）, id }] ──
  // rects（[{ k, id, x, y, w, h }]）の位置と大きさにする。部品は画面の中、吹き出しは置ける範囲の中に収める。何も変わらなければ履歴に積まない
  setRects(designId, screenId, rects) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    const next = rects.map((r) => {
      const cur = r.k === 'p' ? findPart(sc, r.id) : findCallout(sc, r.id);
      if (!cur) return null;
      const fit = r.k === 'p' ? fitRect(r, sc) : fitCallout(r, sc);
      return fit.x === cur.x && fit.y === cur.y && fit.w === cur.w && fit.h === cur.h ? null : { k: r.k, id: r.id, fit };
    }).filter(Boolean);
    if (!next.length) return false;
    return mutateScreen(designId, screenId, (s) => {
      next.forEach(({ k, id, fit }) => Object.assign(k === 'p' ? findPart(s, id) : findCallout(s, id), fit));
    });
  },
  // まとめて dx・dy（ドット）動かす。どれかが画面（吹き出しは範囲）の端に当たるときは、そこで止める（並びをくずさないため）
  moveMany(designId, screenId, sel, dx, dy) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    const rects = selRects(sc, sel);
    const [ddx, ddy] = clampGroupMove(sc, rects, snapGrid(dx), snapGrid(dy));
    if (!ddx && !ddy) return false;
    return this.setRects(designId, screenId, rects.map((r) => ({ ...r, x: r.x + ddx, y: r.y + ddy })));
  },
  alignMany(designId, screenId, sel, how) {
    const sc = findScreen(designId, screenId);
    if (!sc) return false;
    return this.setRects(designId, screenId, alignedRects(selRects(sc, sel), how));
  },
  // まとめて消す。消した部品につないでいた吹き出しは残し、線だけを外す
  deleteMany(designId, screenId, sel) {
    const sc = findScreen(designId, screenId);
    const parts = new Set(sel.filter((x) => x.k === 'p' && findPart(sc, x.id)).map((x) => x.id));
    const cos = new Set(sel.filter((x) => x.k === 'c' && findCallout(sc, x.id)).map((x) => x.id));
    if (!parts.size && !cos.size) return false;
    return mutateScreen(designId, screenId, (s) => {
      s.parts = s.parts.filter((p) => !parts.has(p.id));
      s.callouts = s.callouts.filter((c) => !cos.has(c.id));
      s.callouts.forEach((c) => { if (parts.has(c.target)) c.target = null; });
    });
  },
  // まとめて番号を付ける（付けるときは、上から下・左から右の順に、その画面の次の番号から）・外す
  numberMany(designId, screenId, sel, on) {
    const sc = findScreen(designId, screenId);
    const ids = sel.filter((x) => x.k === 'p').map((x) => findPart(sc, x.id)).filter((p) => p && (on ? p.no == null : p.no != null))
      .sort((a, b) => a.y - b.y || a.x - b.x).map((p) => p.id);
    if (!ids.length) return false;
    return mutateScreen(designId, screenId, (s) => {
      ids.forEach((id) => { const p = findPart(s, id); p.no = on ? nextPartNo(s) : null; });
    });
  },
  // コピーした部品と吹き出しを貼り付ける。entries は { parts: [{ part, item }], callouts: [吹き出し] }。dx・dy だけずらして置く。
  // 戻り値は貼り付けたものの sel。部品の項目の扱いは insertPartCopy と同じ（同じ画面に同じ項目を 2 回は置かない）。
  // 吹き出しのつなぐ部品は、一緒に貼り付けた部品なら新しい部品へ、この画面にある部品ならそのまま、ほかは外す
  insertCopies(designId, screenId, entries, dx, dy) {
    const sc = findScreen(designId, screenId);
    const d = findDesign(store.state, designId);
    if (!sc || !isObj(entries)) return [];
    const work = clone(sc);
    const newItems = [];
    const map = {};
    const out = [];
    (entries.parts || []).forEach(({ part: src, item: srcItem }) => {
      const r = preparePartCopy(d, work, newItems, src, { x: src.x + dx, y: src.y + dy }, srcItem, entries.designId);
      if (!r) return;
      map[src.id] = r.part.id;
      work.parts.push(r.part);
      if (r.item) newItems.push(r.item);
      out.push({ k: 'p', id: r.part.id });
    });
    const newCallouts = (entries.callouts || []).map((c) => {
      const target = map[c.target] || (findPart(sc, c.target) ? c.target : null);
      const nc = normalizeCallout({ ...clone(c), id: newId('k'), target, ...fitCallout({ ...c, x: c.x + dx, y: c.y + dy }, sc) });
      out.push({ k: 'c', id: nc.id });
      return nc;
    });
    if (!out.length) return [];
    mutateScreen(designId, screenId, (s, dd) => {
      dd.items.push(...newItems);
      s.parts.push(...work.parts.filter((p) => !s.parts.some((x) => x.id === p.id)));
      s.callouts.push(...newCallouts);
    });
    return out;
  },

  // ── つながりの図・ステータスの移り方の図・画面の移り方の図 ──
  // 動かした箱の位置を覚える。view は 'map'・'process'・'flow'（VIEW_POS の欄に覚える。画面設計の更新日時は変えない）。
  // つながりの図で designId が null なら、最初の画面の図（設定に持つ）
  setViewPos(designId, view, key, pos) {
    const field = VIEW_POS[view];
    if (!field) return false;
    const p = { x: Math.max(0, snapGrid(pos.x)), y: Math.max(0, snapGrid(pos.y)) };
    if (!designId && view === 'map') {
      store.commit((s) => { s.settings.mapPos = { ...s.settings.mapPos, [key]: p }; });
      return true;
    }
    return mutateDesign(designId, (d) => { d[field] = { ...d[field], [key]: p }; }, { touch: false });
  },
  // 覚えた位置を消して、自動で並べ直す
  resetViewPos(designId, view) {
    const field = VIEW_POS[view];
    if (!field) return false;
    if (!designId && view === 'map') {
      if (!Object.keys(store.state.settings.mapPos || {}).length) return false;
      store.commit((s) => { s.settings.mapPos = {}; });
      return true;
    }
    const d = findDesign(store.state, designId);
    if (!d || !Object.keys(d[field] || {}).length) return false;
    return mutateDesign(designId, (dd) => { dd[field] = {}; }, { touch: false });
  },
  setMapPos(designId, key, pos) { return actions.setViewPos(designId, 'map', key, pos); },
  resetMapPos(designId) { return actions.resetViewPos(designId, 'map'); },

  // ── 吹き出し ──
  // at は吹き出しの左上（画面の左上から）。target はつなぐ部品の id。戻り値は新しい吹き出しの id
  addCallout(designId, screenId, at, target = null) {
    const sc = findScreen(designId, screenId);
    if (!sc) return null;
    const c = normalizeCallout({ id: newId('k'), ...fitCallout({ x: at.x, y: at.y, w: 200, h: 80 }, sc), text: '説明を書きます。', target: findPart(sc, target) ? target : null });
    mutateScreen(designId, screenId, (s) => { s.callouts.push(c); });
    return c.id;
  },
  // patch は { text, color, tip, target } のどれか
  updateCallout(designId, screenId, id, patch) {
    const sc = findScreen(designId, screenId);
    if (!findCallout(sc, id)) return false;
    if ('target' in patch && patch.target && !findPart(sc, patch.target)) return false;
    return mutateScreen(designId, screenId, (s) => {
      const c = findCallout(s, id);
      if ('text' in patch) c.text = String(patch.text);
      if ('color' in patch && own(CALLOUT_COLORS, patch.color)) c.color = patch.color;
      if ('tip' in patch && ['dot', 'arrow', 'none'].includes(patch.tip)) c.tip = patch.tip;
      if ('target' in patch) c.target = patch.target || null;
    });
  },
  moveCallout(designId, screenId, id, rect) {
    const sc = findScreen(designId, screenId);
    const c = findCallout(sc, id);
    if (!c) return false;
    const r = fitCallout(rect, sc);
    if (r.x === c.x && r.y === c.y && r.w === c.w && r.h === c.h) return false;
    return mutateScreen(designId, screenId, (s) => { Object.assign(findCallout(s, id), r); });
  },
  deleteCallout(designId, screenId, id) {
    if (!findCallout(findScreen(designId, screenId), id)) return false;
    return mutateScreen(designId, screenId, (s) => { s.callouts = s.callouts.filter((c) => c.id !== id); });
  },
  // 貼り付けと複製。src の写しを at に置く。番号の付いた部品の写しには、その画面の次の番号を付ける。戻り値は新しい部品の id。
  // 項目を指す部品の写しは、その項目がこの画面にまだなければ同じ項目を指す（同じ画面設計のほかの画面へ貼り付けたとき）。
  // この画面にもうあれば、項目も写して新しい項目にする（同じ項目を 1 つの画面に 2 回は置かないため）。
  // srcItem はコピーしたときの項目の写し。ほかの画面設計へ貼り付けて、その項目がないときに、同じ id で足す
  insertPartCopy(designId, screenId, src, at, srcItem = null) {
    if (!isObj(src)) return null;
    const out = this.insertCopies(designId, screenId, { parts: [{ part: { ...src, x: at.x, y: at.y }, item: srcItem }] }, 0, 0);
    return out.length ? out[0].id : null;
  },
  renumberParts(designId, screenId) {
    return mutateScreen(designId, screenId, (sc) => { sc.parts = renumberedParts(sc.parts); });
  },

  // ── ステータスと操作（第 8 段階。画像 q52 の案A）──
  // ステータスの項目（itemId）のステータスと操作を直す。取り込んだ項目は直さない（元の画面設計で直す）。断ったときは null・false を返し、履歴に積まない
  addState(designId, itemId, name) {
    const it = editableStatusItem(designId, itemId);
    const n = cleanName(name);
    if (!it || !n || it.props.states.some((s) => s.name === n)) return null;
    const id = newId('t');
    mutateDesign(designId, (d) => { findItem(d, itemId).props.states.push({ id, name: n }); });
    return id;
  },
  renameState(designId, itemId, stateId, name) {
    const it = editableStatusItem(designId, itemId);
    const n = cleanName(name);
    if (!it || !n || !it.props.states.some((s) => s.id === stateId) || it.props.states.some((s) => s.name === n && s.id !== stateId)) return false;
    return mutateDesign(designId, (d) => { findItem(d, itemId).props.states.find((s) => s.id === stateId).name = n; });
  },
  // toIndex は動かした後の位置（0 がいちばん上）
  moveState(designId, itemId, stateId, toIndex) {
    const it = editableStatusItem(designId, itemId);
    return !!it && moveInList(designId, itemId, 'states', stateId, toIndex);
  },
  // ステータスを消す（最後の 1 つは消せない）。そのステータスを使う操作も消え、見本で出していた部品は「なし」になる（取り込んだ側も）。
  // システムの作業がこの画面設計のこのステータスを指していれば、指す先のステータスを外す
  deleteState(designId, itemId, stateId) {
    const it = editableStatusItem(designId, itemId);
    if (!it || it.props.states.length < 2 || !it.props.states.some((s) => s.id === stateId)) return false;
    return mutateDesign(designId, (d, s) => {
      const item = findItem(d, itemId);
      const before = stateIdsOf(item);
      item.props.states = item.props.states.filter((x) => x.id !== stateId);
      item.props.actions = item.props.actions.filter((a) => a.from !== stateId && a.to !== stateId);
      clearGoneStates(d, item, before);
      clearStepRefs(s, designId, { stateId });
    });
  },
  // 操作を足す。spec は { name, from, to, role, cond }（from・to はステータスの id）。書かなければ「新しい操作」・1 つ目 → 2 つ目。戻り値は操作の id
  addProcessAction(designId, itemId, spec = {}) {
    const it = editableStatusItem(designId, itemId);
    if (!it) return null;
    const ids = stateIdsOf(it);
    const a = {
      id: newId('a'), name: cleanName(spec.name) || '新しい操作',
      from: 'from' in spec ? str(spec.from) : ids[0] || '', to: 'to' in spec ? str(spec.to) : ids[1] || '',
      role: str(spec.role).trim(), cond: str(spec.cond).trim(),
    };
    if (!validProcessAction(a, ids)) return null;
    mutateDesign(designId, (d) => { findItem(d, itemId).props.actions.push(a); });
    return a.id;
  },
  // 操作を直す。patch は { name, from, to, role, cond } のどれか。名前を空にしたときは今の名前のまま。前と次を同じにはしない
  updateProcessAction(designId, itemId, actionId, patch) {
    const it = editableStatusItem(designId, itemId);
    const cur = it ? it.props.actions.find((a) => a.id === actionId) : null;
    if (!cur || !isObj(patch)) return false;
    const next = { ...cur };
    if ('name' in patch) next.name = cleanName(patch.name) || cur.name;
    ['from', 'to'].forEach((k) => { if (k in patch) next[k] = str(patch[k]); });
    ['role', 'cond'].forEach((k) => { if (k in patch) next[k] = str(patch[k]).trim(); });
    if (!validProcessAction(next, stateIdsOf(it))) return false;
    return mutateDesign(designId, (d) => { Object.assign(findItem(d, itemId).props.actions.find((a) => a.id === actionId), next); });
  },
  moveProcessAction(designId, itemId, actionId, toIndex) {
    const it = editableStatusItem(designId, itemId);
    return !!it && moveInList(designId, itemId, 'actions', actionId, toIndex);
  },
  deleteProcessAction(designId, itemId, actionId) {
    const it = editableStatusItem(designId, itemId);
    if (!it || !it.props.actions.some((a) => a.id === actionId)) return false;
    return mutateDesign(designId, (d) => { const item = findItem(d, itemId); item.props.actions = item.props.actions.filter((a) => a.id !== actionId); });
  },

  // ── データベースの項目の操作 ──
  addItem(designId, type) {
    if (!(isInputType(type) || type === 'table') || !findDesign(store.state, designId)) return null;
    const item = createItemData(type);
    mutateDesign(designId, (d) => { d.items.push(item); });
    return item.id;
  },
  // patch は { label（項目名）, required, memo, props, type } のどれか
  updateItem(designId, itemId, patch) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || item.link) return false; // 取り込んだ項目は直せない（元のモックで直す）
    if ('type' in patch && !(isInputType(patch.type) && isInputType(item.type))) return false;
    return mutateDesign(designId, (d) => {
      const item = findItem(d, itemId);
      if ('type' in patch && patch.type !== item.type) changeItemType(d, item, patch.type);
      setItemFields(d, item, patch);
    });
  },
  // 項目を並べ替える。toIndex は、今の並びで「この位置の項目の前」に入れる位置（いちばん後ろは項目の数）
  moveItem(designId, itemId, toIndex) {
    const d = findDesign(store.state, designId);
    const from = d ? d.items.findIndex((it) => it.id === itemId) : -1;
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex > d.items.length || toIndex === from || toIndex === from + 1) return false;
    return mutateDesign(designId, (dd) => {
      const [it] = dd.items.splice(from, 1);
      dd.items.splice(toIndex > from ? toIndex - 1 : toIndex, 0, it);
    });
  },
  // 項目を一覧表から消す。その項目を置いた部品は画面に残し、消したときの項目名と設定を部品に写して固定する（ユーザーの指示）
  deleteItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item) return false;
    const fields = frozenItemFields(item);
    return mutateDesign(designId, (d) => {
      d.items = d.items.filter((it) => it.id !== itemId);
      d.screens.forEach((s) => s.parts.forEach((p) => { if (p.itemId === itemId && isItemPart(p)) Object.assign(p, clone(fields)); }));
    });
  },
  // 項目を消した後に残った部品から、消したときの中身で項目を一覧表のいちばん下に戻す。同じ項目を指していたほかの部品もつながり直る
  // ステータスの項目は、画面設計にもうステータスの項目があれば、残った部品をその項目へつなぎ直す（ステータスの並びは画面設計に 1 つだけ）。
  // 1 つの画面に同じ項目の部品が 2 つ以上残っていたとき（複製した後など）は、2 つ目からは項目の写しを指す（1 つの画面に同じ項目は 1 回だけ）
  restoreItem(designId, itemId) {
    const d = findDesign(store.state, designId);
    if (!d || findItem(d, itemId)) return false;
    const src = d.screens.flatMap((s) => s.parts).find((p) => p.itemId === itemId && isItemPart(p));
    if (!src) return false;
    const fromPart = (p, id) => normalizeItem({ id, name: p.label, type: partItemType(p), required: p.required, memo: p.memo, props: clone(p.props), lookup: p.lookup || null, link: p.link || null });
    const status = partItemType(src) === 'status' ? d.items.find((it) => it.type === 'status') : null;
    return mutateDesign(designId, (dd) => {
      if (!status) dd.items.push(fromPart(src, itemId));
      dd.screens.forEach((s) => {
        let seen = 0;
        s.parts = s.parts.map((p) => {
          if (p.itemId !== itemId || !isItemPart(p)) return p;
          if (status) return { ...withoutItemFields(p), itemId: status.id, view: { ...p.view, current: resolveStateRef(status.props.states, (p.view || {}).current, p.props && p.props.states) || defaultStateId(status) } };
          seen += 1;
          if (seen === 1 || !oncePerScreen(partItemType(p))) return withoutItemFields(p);
          const copyItem = fromPart(p, newId('i'));
          dd.items.push(copyItem);
          return { ...withoutItemFields(p), itemId: copyItem.id };
        });
      });
    });
  },
  // 表の部品の中身（テーブル・レコード一覧・関連レコード一覧）を変える。テーブルにすると項目（表）を作って指し、
  // テーブルから変えると項目を指さなくなる。そのとき、その項目をほかのどの画面にも置いていなければ、項目も消す
  // （中身を選び直しただけで、使わない項目が一覧表に残らないため。Claude が決めた）
  setTableKind(designId, screenId, partId, kind) {
    const p0 = findPart(findScreen(designId, screenId), partId);
    if (!p0 || p0.type !== 'table' || !own(TABLE_KINDS, kind) || p0.tableKind === kind) return false;
    const d0 = findDesign(store.state, designId);
    const item = kind === 'subtable' ? createItemData('table') : null;
    // ほかの画面設計（ごみ箱の中も）がこの表の項目を取り込んでいるときは、項目を残す（取り込んだ側が知らせなしに「元なし」にならないように）
    const imported = !!p0.itemId && store.state.designs.some((x) => x.id !== designId && x.items.some((it) => it.link && !it.link.lost && it.link.designId === designId && it.link.itemId === p0.itemId));
    return mutatePart(designId, screenId, partId, (p, sc, d) => {
      const old = p.itemId;
      if (item) {
        d.items.push(item);
        Object.assign(withoutItemFieldsInPlace(p), { tableKind: kind, itemId: item.id });
        return;
      }
      const defLabel = (k) => (k === 'related' ? '関連レコード一覧' : '一覧');
      if (p.tableKind === 'subtable') {
        const oldItem = findItem(d, old);
        delete p.itemId;
        p.label = defLabel(kind);
        p.required = false;
        p.memo = '';
        p.props = defaultTablePartProps(d0);
        if (oldItem && !imported && !d.screens.some((s) => s.parts.some((x) => x.itemId === old))) d.items = d.items.filter((it) => it.id !== old);
      } else if (p.label === defLabel(p.tableKind)) p.label = defLabel(kind); // 名前が最初のままなら、新しい中身の名前にする
      p.tableKind = kind;
    });
  },
  // ほかの画面設計（srcDesignId）の項目を取り込み、一覧表のいちばん下に足す。取り込んだ項目は元とつなげたままにする。
  // 戻り値は足した項目の数。この画面設計の項目を取り込んだ項目（元がこの画面設計）と、取り込み済みの項目は足さない
  importItems(designId, srcDesignId, itemIds) {
    const d = findDesign(store.state, designId);
    const src = findDesign(store.state, srcDesignId);
    if (!d || !src || d.id === src.id) return 0;
    const add = itemIds.map((id) => findItem(src, id)).filter((it) => it && !IMPORT_BLOCKED.includes(importState(d, src, it)))
      .map((it) => ({ ...linkedFields(it, src), id: newId('i'), link: { designId: src.id, itemId: it.id, designName: src.name, lost: false } }));
    if (!add.length) return 0;
    mutateDesign(designId, (dd) => { dd.items.push(...add.map(normalizeItem)); });
    return add.length;
  },
  // ルックアップを書き換える（null で外す）。create（{ index, name, type }）を渡すと、一緒に写す先の項目を新しく作って、
  // copies[index] の写す先にする（「＋ 同じ名前で新しく作る」）。取り込んだ項目と、ルックアップを書けない種類の項目は書き換えない
  updateLookup(designId, itemId, lookup, create = null) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || item.link || !LOOKUP_TYPES.includes(item.type)) return false;
    const next = lookup ? normalizeLookup(clone(lookup)) : null;
    const created = create && next && next.copies[create.index] ? createItemData(isItemType(create.type) ? create.type : 'text1', create.name) : null;
    return mutateDesign(designId, (d) => {
      if (created) {
        d.items.push(created);
        next.copies[create.index].to = { itemId: created.id, name: created.name };
      }
      findItem(d, itemId).lookup = next;
    });
  },
  // 取り込んだ項目のつながりを切り、そのときの中身の、この画面設計だけの項目にする
  unlinkItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || !item.link) return false;
    return mutateDesign(designId, (d) => { findItem(d, itemId).link = null; });
  },
  // データベースの項目の一覧表にある項目を、画面に置く。その画面にもう置いてあれば置かない（戻り値 null）
  addItemPart(designId, screenId, itemId, at) {
    const sc = findScreen(designId, screenId);
    const item = findItem(findDesign(store.state, designId), itemId);
    const type = item && isItemType(item.type) ? partTypeOfItem(item.type) : '';
    const t = partType(type);
    if (!sc || !t || (oncePerScreen(item.type) && itemOnScreen(sc, itemId))) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    const p = createPartData(type, sc, freeSpot(sc, start), itemId);
    if (p.view && 'current' in p.view) p.view.current = defaultStateId(item);
    mutateScreen(designId, screenId, (s) => { s.parts.push(p); });
    return p.id;
  },
};

function findScreen(designId, screenId) {
  const d = findDesign(store.state, designId);
  return d ? d.screens.find((s) => s.id === screenId) || null : null;
}
// 画面・部品が見つからないときは、履歴に何も積まずに false を返す
function mutateScreen(designId, screenId, fn) {
  if (!findScreen(designId, screenId)) return false;
  return mutateDesign(designId, (d) => fn(d.screens.find((s) => s.id === screenId), d));
}
function mutatePart(designId, screenId, partId, fn) {
  if (!findPart(findScreen(designId, screenId), partId)) return false;
  return mutateScreen(designId, screenId, (sc, d) => fn(findPart(sc, partId), sc, d));
}

// 貼り付ける部品 1 つの下ごしらえ（commit はしない）。sc は貼り付ける先の画面（ここまでに貼り付けた部品を足した写し）、
// pendingItems はここまでに作った項目。srcDesignId はコピーした画面設計。戻り値 { part, item（新しく足す項目。なければ null）}
function preparePartCopy(d, sc, pendingItems, src, at, srcItem, srcDesignId = '') {
  if (!isObj(src)) return null;
  const p = { ...clone(src), id: newId('p'), ...fitRect({ ...src, ...freeSpot(sc, fitRect({ ...src, ...at }, sc)) }, sc) };
  p.no = src.no != null ? nextPartNo(sc) : null;
  // ほかの画面設計へ貼るときは、移る先の画面設計を名指しし直す（コピーした画面設計の画面 → その画面設計を名指し、貼る先の画面設計の画面 → 「この画面設計」）
  if (hasMoveTarget(p) && p.props.screenId && srcDesignId && srcDesignId !== d.id) {
    const to = p.props.designId || srcDesignId;
    p.props.designId = to === d.id ? '' : to;
  }
  let newItem = null;
  const find = (id) => findItem(d, id) || pendingItems.find((it) => it.id === id) || null;
  if (!p.itemId || !isItemPart(p)) return { part: p, item: null };
  // ステータスの印・進み具合の矢印は、貼り付ける先の画面設計にステータスの項目があれば、それを指す（ステータスの並びは画面設計に 1 つだけ）
  const status = partItemType(p) === 'status' ? d.items.find((it) => it.type === 'status') || pendingItems.find((it) => it.type === 'status') : null;
  if (status) {
    // 見本で出すステータスは、コピーした元の並び（コピーしたときの項目か、項目を消した後に残った部品の並び）の名前で当て直す
    const fromStates = (isObj(srcItem) && isObj(srcItem.props) && srcItem.props.states) || (src.props && src.props.states) || null;
    withoutItemFieldsInPlace(p).itemId = status.id;
    if (p.view) p.view.current = resolveStateRef(status.props.states, p.view.current, fromStates) || defaultStateId(status);
    return { part: p, item: null };
  }
  // 取り込んだ項目の部品を、取り込んだ元の画面設計へ貼り付けるときは、元の項目を指す
  const home = isObj(srcItem) && srcItem.link && srcItem.link.designId === d.id ? findItem(d, srcItem.link.itemId) : null;
  if (home && !find(p.itemId)) p.itemId = home.id;
  const item = find(p.itemId);
  // 貼る先に、同じ id の項目を一覧表から消した後に残った部品があるときは、項目を写すときに新しい id にする（消した項目が生き返らないように）
  const orphaned = (id) => d.screens.some((s) => s.parts.some((x) => x.itemId === id)) || sc.parts.some((x) => x.itemId === id);
  if (!item && isObj(srcItem) && srcItem.id === p.itemId) {
    newItem = { ...clone(srcItem), id: orphaned(srcItem.id) ? newId('i') : srcItem.id };
    p.itemId = newItem.id;
  } else if (item && oncePerScreen(item.type) && itemOnScreen(sc, item.id)) {
    newItem = { ...clone(item), id: newId('i') };
    p.itemId = newItem.id;
  } else if (!item && oncePerScreen(partItemType(p)) && sc.parts.some((x) => x.itemId === p.itemId)) {
    p.itemId = newId('i'); // 項目を消した後に残った部品を、同じ部品がもうある画面に貼るときは、別の項目として残す
  }
  // コピーした後で項目の種類を変えていたときは、部品の種類を項目の今の種類に合わせる
  const target = newItem || item;
  if (target && isInputType(target.type) && isInputType(p.type)) p.type = target.type;
  return { part: p, item: newItem };
}

// 選んだものの位置と大きさ（選んだ順）。見つからないものは除く
function selRects(sc, sel) {
  return sel.map((x) => {
    const o = x.k === 'p' ? findPart(sc, x.id) : findCallout(sc, x.id);
    return o ? { k: x.k, id: x.id, x: o.x, y: o.y, w: o.w, h: o.h } : null;
  }).filter(Boolean);
}
// まとめて動かす幅を、部品は画面の中、吹き出しは範囲の中に収まるところまでにする
function clampGroupMove(sc, rects, dx, dy) {
  const maxW = Math.floor(sc.width / GRID) * GRID;
  const maxH = Math.floor(sc.height / GRID) * GRID;
  const b = calloutBounds(sc);
  let [lo, hi, lo2, hi2] = [-Infinity, Infinity, -Infinity, Infinity];
  rects.forEach((r) => {
    const [x0, y0, x1, y1] = r.k === 'p' ? [0, 0, maxW, maxH] : [b.x0, b.y0, b.x1, b.y1];
    lo = Math.max(lo, x0 - r.x); hi = Math.min(hi, x1 - r.x - r.w);
    lo2 = Math.max(lo2, y0 - r.y); hi2 = Math.min(hi2, y1 - r.y - r.h);
  });
  // 範囲の外に出ているもの（読み込んだデータなど）があると、下限が上限より大きくなるので、0 を含む幅に広げる（逆向きに跳ばないように）
  [lo, lo2] = [Math.min(lo, 0), Math.min(lo2, 0)];
  [hi, hi2] = [Math.max(hi, 0), Math.max(hi2, 0)];
