      ほかの画面設計の箱を押すと、その画面設計を開きます。全部の画面設計の図は、最初の画面の「つながりの図」で見られます。</p>${mapLegendHtml()}
    <div class="map-canvas" id="design-map">${mapHtml(store.state, d.id, d.mapPos || {})}</div></div>`;
}

// ── データベースの項目の一覧表（真ん中。画像 q19 の案A）──
function renderItemsView(d) {
  const el = $('#db-view');
  const top = el.scrollTop;
  el.innerHTML = itemTableHtml(d);
  el.scrollTop = top;
}

function itemTableHtml(d) {
  const rows = d.items.map((it) => {
    const scr = screensWithItem(d, it.id).map((s) => s.name);
    return `<tr data-action="select-item" data-id="${esc(it.id)}"${it.id === ui.itemId ? ' class="sel"' : ''}>
      <td class="c-grip" data-drag="item-sort" title="ドラッグで並べ替えます">⋮⋮</td>
      <td>${it.name ? esc(it.name) : '<span class="none">（名前なし）</span>'}</td>
      <td>${esc(itemTypeName(it.type))}</td>
      <td class="c-set">${esc(isItemType(it.type) ? describeItem(it, { design: d, state: store.state }) : '')}</td>
      <td>${itemSourceHtml(d, it)}</td>
      <td>${scr.length ? esc(scr.join('・')) : '<span class="none">どの画面にもない</span>'}</td>
      <td class="c-del"><button class="del-x" data-action="delete-item" data-id="${esc(it.id)}" title="この項目を消します" aria-label="「${esc(it.name)}」を消す">✕</button></td>
    </tr>`;
  }).join('');
  const body = d.items.length
    ? `<table><thead><tr><th></th><th>項目名</th><th>部品の種類</th><th>設定</th><th>ルックアップ元・取り込み元</th><th>置いている画面</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="itable-empty">まだ項目がありません。「＋ 項目を足す」で足すか、画面に入力欄の部品を置くと、ここに並びます。</div>';
  return `
    <div class="itable">
      <div class="itable-head">
        <h3>データベースの項目（${esc(d.name)}）</h3>
        <span class="hint">行の左のつまみ（⋮⋮）をドラッグすると並べ替えられます。行を押すと、右の欄に設定が出ます。</span>
        <span class="spacer"></span>
        <button class="btn primary small" data-action="add-item-menu" aria-expanded="${ui.addItemMenu}">＋ 項目を足す ▾</button>
        <button class="btn small" data-action="import-items">⇩ ほかのモックから取り込む</button>
      </div>
      ${ui.addItemMenu ? addItemMenuHtml() : ''}
      ${body}
    </div>`;
}

// 「ルックアップ元・取り込み元」の列
function itemSourceHtml(d, it) {
  const parts = [];
  const tag = '<span class="tag ref">ルックアップ</span>';
  if (it.lookup) {
    const src = it.lookup.db.designId ? findDesign(store.state, it.lookup.db.designId) : null;
    const db = esc(dbLabel(store.state, it.lookup.db));
    parts.push(`${tag} ${db} › ${esc(refLabel(src, it.lookup.key))}<br><small>（この値で${db}を探す）</small>`);
  } else {
    const role = lookupCopyOf(d, it);
    if (role) {
      const klk = role.key.lookup;
      const src = klk.db.designId ? findDesign(store.state, klk.db.designId) : null;
      parts.push(`${tag} ${esc(dbLabel(store.state, klk.db))} › ${esc(refLabel(src, role.copy.from))}<br><small>（${esc(role.key.name)}で引く）</small>`);
    }
  }
  if (it.link) parts.push(linkSourceHtml(it.link, it.name));
  return parts.join('<br>') || '<span class="none">－</span>';
}

// 取り込み元の文。元がなくなったときは、そのときの中身で固定していることを書く
function linkSourceHtml(link, name) {
  const where = `${esc(link.designName || '（名前なし）')} › ${esc(name)}`;
  if (!link.lost) return `<span class="tag link">取り込み</span> ${where}`;
  return `<span class="tag lost">取り込み・元なし</span> ${where}<br><small style="color:#9a3412">元のモック（または元の項目）はもうありません。今の中身で固定しています</small>`;
}

function addItemMenuHtml() {
  return `<div class="pop-menu" role="menu" style="right:18px;top:50px">${itemMenuTypes().map((type) => {
    const t = partType(type);
    return `<button role="menuitem" data-action="add-item" data-type="${type}"><i>${t.icon}</i>${esc(t.name)}</button>`;
  }).join('')}</div>`;
}

// いくつか選んだときは、全体を囲む点線の枠と、基準（最初に選んだもの）の「基準」の札を付ける
function markMultiSelection(s) {
  if (ui.sel.length < 2) return;
  const rects = selRects(s, ui.sel);
  if (!rects.length) return;
  const els = (x) => [...document.querySelectorAll(x.k === 'p' ? '#stage .part' : '#stage .callout')].find((e) => (x.k === 'p' ? e.dataset.partId : e.dataset.calloutId) === x.id);
  const ref = els(ui.sel[0]);
  if (ref) ref.classList.add('sel-ref');
  const zone = $('#co-zone');
  if (!zone) return;
  const Z = CALLOUT_ZONE;
  const [x0, y0] = [Math.min(...rects.map((r) => r.x)), Math.min(...rects.map((r) => r.y))];
  const [x1, y1] = [Math.max(...rects.map((r) => r.x + r.w)), Math.max(...rects.map((r) => r.y + r.h))];
  const box = document.createElement('div');
  box.className = 'sel-box';
  Object.assign(box.style, { left: Z + x0 - 4 + 'px', top: Z + y0 - 4 + 'px', width: x1 - x0 + 8 + 'px', height: y1 - y0 + 8 + 'px' });
  zone.appendChild(box);
}

// 吹き出しと線（画面に重ねた SVG）。overrides（{ id: rect }）を渡すと、ドラッグ中の部品・吹き出しをその位置で描く
function calloutsHtml(s) {
  const Z = CALLOUT_ZONE;
  const boxes = s.callouts.map((c) => {
    const sel = isSelected('c', c.id);
    const grips = sel && ui.sel.length === 1 ? GRIPS.map((g) => `<span class="grip g-${g}" data-grip="${g}"></span>`).join('') : '';
    return `<div class="callout cc-${c.color}${sel ? ' sel' : ''}" data-callout-id="${esc(c.id)}" style="left:${Z + c.x}px;top:${Z + c.y}px;width:${c.w}px;height:${c.h}px">${esc(c.text)}${grips}</div>`;
  }).join('');
  return `${calloutLinesSvg(s)}${boxes}${calloutHandleHtml(s)}`;
}
function calloutLinesSvg(s, overrides = {}) {
  const Z = CALLOUT_ZONE;
  const rectOf = (k, x) => {
    const o = overrides[k + ':' + x.id];
    return o ? { ...x, ...o } : x;
  };
  const lines = s.callouts.map((c0) => {
    const c = rectOf('c', c0);
    const p = c.target ? findPart(s, c.target) : null;
    const ln = p && calloutLine(c, rectOf('p', p));
    if (!ln) return '';
    const col = CALLOUT_COLORS[c.color][1];
    const [x1, y1, x2, y2] = [ln.x1 + Z, ln.y1 + Z, ln.x2 + Z, ln.y2 + Z].map((v) => v.toFixed(1));
    const tip = c.tip === 'dot' ? `<circle cx="${x2}" cy="${y2}" r="4.5" fill="${col}"/>` : '';
    const marker = c.tip === 'arrow' ? ` marker-end="url(#co-arrow-${c.color})"` : '';
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2"${marker}/>${tip}`;
  }).join('');
  const temp = overrides.temp ? `<line x1="${(overrides.temp.x1 + Z).toFixed(1)}" y1="${(overrides.temp.y1 + Z).toFixed(1)}" x2="${(overrides.temp.x2 + Z).toFixed(1)}" y2="${(overrides.temp.y2 + Z).toFixed(1)}" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>` : '';
  const defs = Object.entries(CALLOUT_COLORS).map(([k, [, col]]) =>
    `<marker id="co-arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`).join('');
  return `<svg class="co-lines" id="co-lines" width="${s.width + Z * 2}" height="${s.height + Z * 2}"><defs>${defs}</defs>${lines}${temp}</svg>`;
}
// 1 つだけ選んだ吹き出しの線の先の ○（ドラッグして部品に重ねるとつなぐ）。つないでいないときは吹き出しの下に出す
function calloutEnd(s, c) {
  const p = c.target ? findPart(s, c.target) : null;
  const ln = p && calloutLine(c, p);
  return ln ? { x: ln.x2, y: ln.y2 } : { x: c.x + c.w / 2, y: c.y + c.h + 20 };
}
function calloutHandleHtml(s) {
  const c = findCallout(s, ui.calloutId);
  if (!c) return '';
  const e = calloutEnd(s, c);
  return `<span class="co-handle" data-co-handle="${esc(c.id)}" style="left:${CALLOUT_ZONE + e.x}px;top:${CALLOUT_ZONE + e.y}px" title="ドラッグして部品に重ねると、その部品につなぎます（何もない所で放すと、つながりを外します）"></span>`;
}

// 右の欄の上の部品の箱。組の見出しを押すと開く・閉じる（最初は全部開いている）。
// いちばん上の「データベースの項目」の組には、この画面設計の項目を並べる（画像 q19）。この画面にまだ置いていない項目を先に並べ、
// 置いた項目は薄く出して「置いた」と書く（同じ項目を 1 つの画面に 2 回は置かないため、置けない）
function renderPalette(d) {
  const box = $('#side-box');
  const top = box.scrollTop;
  const head = (id, name, n, open) =>
    `<button class="pal-head" data-action="toggle-palette" data-id="${id}" aria-expanded="${open}">${open ? '▼' : '▶'} ${esc(name)}<span class="n">${n}</span></button>`;
  const btn = (type) => {
    const t = paletteEntry(type);
    const tip = type === 'callout' ? '吹き出し（部品の上に落とすと、その部品につながる。押すと、選んでいる部品につないで置く）' : `${t.name}（画面へドラッグして置く。押すと、見えている所の真ん中に置く）`;
    return `<button class="pal-btn" data-action="add-part" data-type="${type}" title="${esc(tip)}"><i>${t.icon}</i>${esc(t.pal || t.name)}</button>`;
  };
  const sc = currentScreen();
  const items = d.items.filter((it) => isItemType(it.type));
  const placed = (it) => oncePerScreen(it.type) && itemOnScreen(sc, it.id);
  const itemBtn = (it) => {
    const t = partType(it.type);
    const name = esc(it.name || '（名前なし）');
    if (placed(it)) return `<div class="pal-item placed" title="この画面にもう置いています"><i>${t.icon}</i><span>${name}</span><small>置いた</small></div>`;
    return `<button class="pal-item" data-action="add-item-part" data-item-id="${esc(it.id)}" title="「${name}」を画面へドラッグして置く（押すと、見えている所の真ん中に置く）"><i>${t.icon}</i><span>${name}</span><small>${esc(itemTypeName(it.type))}</small></button>`;
  };
  const itemsOpen = !ui.paletteClosed.items;
  const itemList = [...items.filter((it) => !placed(it)), ...items.filter(placed)].map(itemBtn).join('')
    || '<div class="pal-empty">まだ項目がありません。下の組から入力欄の部品を置くと、ここにも並びます。</div>';
  box.innerHTML = '<div class="panel-title">部品 <small>（画面へドラッグして置く）</small></div>'
    + `<div class="pal-group items">${head('items', 'データベースの項目', items.length, itemsOpen)}${itemsOpen ? `<div class="pal-items">${itemList}</div>` : ''}</div>`
    + PALETTE_GROUPS.map((g) => {
      const open = !ui.paletteClosed[g.id];
      return `<div class="pal-group">${head(g.id, g.name, g.types.length, open)}${open ? `<div class="pal-grid">${g.types.map(btn).join('')}</div>` : ''}</div>`;
    }).join('');
  box.scrollTop = top;
}

// 右の欄の下。部品を選んでいるときはその部品の設定、選んでいないときは画面設計の情報と画面の設定。
// 同じものを描き直すときは、スクロールの位置を保つ
function renderSettings(d) {
  const el = $('#side-settings');
  const key = ui.panel === 'items' ? 'item:' + ui.itemId : ui.panel === 'map' ? 'map' : ui.sel.length > 1 ? 'multi' : ui.partId || ui.calloutId || 'screen:' + ui.screenId;
  const top = el.dataset.key === key ? el.scrollTop : 0;
  const p = currentSubject();
  const co = ui.panel === 'screen' ? findCallout(currentScreen(), ui.calloutId) : null;
  if (ui.panel === 'screen' && ui.sel.length > 1) el.innerHTML = multiSettingsHtml(d);
  else if (ui.panel === 'map') el.innerHTML = '';
  else if (ui.panel === 'items') el.innerHTML = p ? itemSettingsHtml(d, p) : itemsHintHtml(d);
  else if (p) el.innerHTML = partSettingsHtml(p);
  else if (co) el.innerHTML = calloutSettingsHtml(co);
  else renderScreenSettings(d, el);
  el.dataset.key = key;
  el.scrollTop = top;
}

function renderScreenSettings(d, el) {
  const s = currentScreen();
  const devices = Object.entries(DEVICES).map(([key, v]) => `
    <label><input type="radio" name="device" value="${key}" data-field="device"${s.device === key ? ' checked' : ''}><span>${v.label}<small>幅 ${v.width}</small></span></label>`).join('');
  const tablePos = [['right', '画面の右'], ['bottom', '画面の下']].map(([v, l]) => `

  el.innerHTML = `
    <section>
      <div class="panel-title">画面設計の情報</div>

      <div class="field"><span>作る先</span>${targetPickerHtml(store.state, d.target)}</div>
      <label class="field"><span>説明</span><textarea data-field="design-desc" rows="4" placeholder="この業務アプリで何をするか など">${esc(d.description)}</textarea></label>
    </section>
    <section>
      <div class="panel-title">画面の設定</div>
      <label class="field"><span>画面の名前</span><input type="text" data-field="screen-name" maxlength="${NAME_MAX}" value="${esc(s.name)}"></label>

        <span class="hint">画面の下の縁をドラッグすると、8 ドットずつ伸ばせます。</span></div>
      <label class="check"><input type="checkbox" data-field="screen-header"${s.showHeader ? ' checked' : ''}>画面のいちばん上に「業務アプリ名 ／ 画面の名前」の帯を付ける</label>
      <div class="field" style="margin-top:10px"><span>部品の設定の一覧表の位置</span><div class="seg">${tablePos}</div></div>

  bindTargetPicker(el, (t) => actions.updateDesignInfo(d.id, { target: t }));

// ── 選んだ部品の設定の欄（画像 q16）──
// 欄の data-pf は部品の項目の名前。「props.」で始まるものは部品の種類ごとの設定（props）
const pfLabel = (label, hint) => `<span>${label}${hint ? ` <small>${hint}</small>` : ''}</span>`;
const pfText = (key, label, value, { hint = '', placeholder = '', type = 'text' } = {}) =>
  `<label class="field">${pfLabel(label, hint)}<input type="${type}" data-pf="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;
const pfArea = (key, label, value, { hint = '', rows = 3 } = {}) =>
  `<label class="field">${pfLabel(label, hint)}<textarea data-pf="${key}" rows="${rows}">${esc(value)}</textarea></label>`;
const pfCheck = (key, label, on) => `<label class="check"><input type="checkbox" data-pf="${key}"${on ? ' checked' : ''}>${label}</label>`;
const pfSeg = (key, label, value, choices) => `<div class="field">${pfLabel(label)}<div class="seg">${choices.map(([v, l]) =>
  `<label><input type="radio" name="pf-${key}" value="${v}" data-pf="${key}"${value === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>`;
const pfSelect = (key, label, value, choices) => `<label class="field">${pfLabel(label)}<select data-pf="${key}">${choices.map(([v, l]) =>
  `<option value="${esc(v)}"${value === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
const pfRow = (...cells) => `<div class="row2">${cells.join('')}</div>`;
const NUM = { type: 'number' };

const fieldCtx = () => ({ design: currentDesign(), state: store.state });

// 一覧表の「設定」に出る文の欄。番号を外した部品は、一覧表に出ないことを書く
function pfOutHtml(p, { forItem = false } = {}) {
  if (!forItem && p.no == null) return '<div class="pf-out"><b>一覧表の「設定」に出る文</b><div>（番号を外しているので、一覧表には出ません）</div></div>';
  return `<div class="pf-out"><b>一覧表の「設定」に出る文</b><div id="pf-out">${esc(subjectSettingText(p)) || '（まだありません）'}</div></div>`;
}
// 右の欄に出す「設定」の文。データベースの項目の一覧表で選んだ項目は、一覧表と同じ describeItem で作る（表の項目もテーブルとして書くため）
function subjectSettingText(p) {
  if (!p) return '';
  return ui.panel === 'items' && p.item ? describeItem(p.item, fieldCtx()) : describePart(p, fieldCtx());
}

// 選んだ部品の設定の欄。入力欄の部品は、上に「項目の設定（どの画面でも同じ）」、下に「この画面だけの設定」を出す（画像 q20）。
// 項目を一覧表から消した後に残った部品は、項目の設定を灰色にして直せなくし、「項目の一覧表に戻す」を出す
function partSettingsHtml(p) {
  const t = partType(p.type);
  if (t && p.type === 'table') return tableSettingsHtml(p, t);
  if (t && isItemPart(p)) return itemPartSettingsHtml(p, t);
  const del = '<div class="pf-del"><button class="btn small danger-text" data-action="delete-part">この部品を消す</button></div>';
  if (!t) return `<div class="panel-title">選んだ部品</div><p class="hint">${esc(partTypeName(p.type))}です。新しい版のアプリで足した部品のため、この版では設定を変えられません。</p>${del}`;
  const typeFields = partTypeFieldsHtml(p);
  const setting = describePart(p, fieldCtx());
  const out = p.no == null
    ? '<div class="pf-out"><b>一覧表の「設定」に出る文</b><div>（番号を外しているので、一覧表には出ません）</div></div>'
    : `<div class="pf-out"><b>一覧表の「設定」に出る文</b><div id="pf-out">${esc(setting) || '（まだありません）'}</div></div>`;
  return `
    <div class="panel-title">選んだ部品の設定（${p.no != null ? `番号 ${p.no}・` : ''}${esc(t.name)}）</div>
    ${partCommonFieldsHtml(p)}
    ${typeFields ? `<div class="pf-sep"><i>${esc(t.name)}の欄</i></div>${typeFields}` : ''}
    ${pfArea('memo', 'メモ', p.memo, { hint: '（自由に書く）' })}
    ${out}
    ${del}`;
}

// 項目を指さない部品の共通の欄（ボタン・見出し・説明の文字は文字、どれも番号を付ける）
function partCommonFieldsHtml(p) {
  const numbered = pfCheck('numbered', '番号を付ける', p.no != null);
  if (p.type === 'button') return pfText('label', 'ボタンの文字', p.label) + numbered;
  if (p.type === 'heading') return pfText('label', '文字', p.label) + numbered;
  if (p.type === 'desc') return pfArea('label', '文字', p.label) + numbered;
  if (p.type === 'graph') return pfText('label', 'グラフの名前', p.label) + numbered;
  if (p.type === 'image') return pfText('label', '説明の文字', p.label, { placeholder: '例: 会社のロゴ' }) + numbered;
  if (p.type === 'link') return pfText('label', '文字', p.label) + numbered;
  return numbered;
}

// 取り込んだ項目の知らせ（画像 q20 の 2）。元を直すとここも変わること、ここでは直せないことと、元を開く・つながりを切るボタン
function linkBannerHtml(item) {
  const btns = `<div class="btns">${item.link.lost ? '' : `<button class="btn small primary" data-action="open-link-source" data-id="${esc(item.id)}">元のモックを開く</button>`}
    <button class="btn small" data-action="unlink-item" data-id="${esc(item.id)}">つながりを切る</button></div>`;
  if (item.link.lost) {
    return `<div class="pf-banner gone">⚠ この項目は、モック「<b>${esc(item.link.designName)}</b>」から取り込みましたが、元のモック（または元の項目）はもうありません。今の中身で固定しています。
      直すときは「つながりを切る」で、この画面設計だけの項目にします。${btns}</div>`;
  }
  return `<div class="pf-banner link">🔗 この項目は、モック「<b>${esc(item.link.designName)}</b>」の「${esc(item.name)}」とつながっています。元のモックで直すと、ここも変わります。ここでは直せません。
    つながりを切ると、この画面設計だけの項目になります（元を直しても変わらなくなります）。${btns}</div>`;
}

function itemPartSettingsHtml(p, t) {
  const d = currentDesign();
  const gone = !p.item;
  const linked = !!(p.item && p.item.link);
  const banner = gone
    ? `<div class="pf-banner gone">⚠ この部品の項目「${esc(p.label)}」は、データベースの項目の一覧表から消しました。消したときの中身のまま表示しています。ここでは直せません。
        <div class="btns"><button class="btn small primary" data-action="restore-item" data-id="${esc(p.itemId)}">項目の一覧表に戻す</button></div></div>`
    : linked ? linkBannerHtml(p.item) : '';
  const sample = t.ph
    ? pfText('sample', '見本の値', p.sample, { hint: '（書かないときは薄い字）', placeholder: p.placeholder || t.ph })
      + pfText('placeholder', '薄い字', p.placeholder, { hint: '（見本の値がないときに出す字）', placeholder: t.ph })
    : '';
  const states = (p.props && p.props.states) || [];
  const here = p.type === 'status' || p.type === 'steps'
    ? pfSelect('view.current', p.type === 'steps' ? '今のステータス（見本）' : '見本で出すステータス', (p.view || {}).current, states.map((s) => [s, s]))
      + (p.type === 'status' ? pfCheck('view.showWord', '「ステータス」の文字を付ける', !(p.view && p.view.showWord === false)) : '')
    : pfSeg('labelPos', '項目名の位置', p.labelPos, [['top', '上'], ['left', '左']]) + sample;
  return `
    <div class="panel-title">選んだ部品の設定（${p.no != null ? `番号 ${p.no}・` : ''}${esc(t.name)}）</div>
    ${banner}
    ${itemSectionHtml(d, p, { locked: gone || linked, note: gone ? '消したときの中身' : linked ? '元のモックの中身' : 'どの画面でも同じ' })}
    <div class="pf-sec here"><div class="pf-sec-head">この画面だけの設定<small>${esc(currentScreen().name)}の画面</small></div><div class="pf-sec-body">
      ${here}
      ${pfCheck('numbered', '番号を付ける', p.no != null)}
    </div></div>
    <div class="pf-del"><button class="btn small danger-text" data-action="delete-part">この画面から部品を消す</button></div>
    ${gone ? '' : '<div class="pf-note">（項目は、データベースの項目の一覧表に残ります）</div>'}`;
}

// 「項目の設定」の紺の枠。locked のときは灰色にして、中の欄を全部押せなくする（fieldset の disabled）。
// withType のとき（データベースの項目の一覧表で項目を選んだとき）は、部品の種類も選べるようにする
function itemSectionHtml(d, p, { locked = false, withType = false, note = 'どの画面でも同じ' } = {}) {
  const t = partType(p.type);
  const typeFields = p.type === 'table' ? '' : partTypeFieldsHtml(p);
  const used = p.item ? screensWithItem(d, p.item.id).map((s) => s.name) : [];
  return `
    <fieldset class="pf-sec ${locked ? 'locked' : 'item'}"${locked ? ' disabled' : ''}>
      <div class="pf-sec-head">${locked ? '🔒 ' : ''}項目の設定<small>${esc(note)}</small></div>
      <div class="pf-sec-body">
        ${p.item ? `<div class="pf-used">この項目を置いている画面: <b>${used.length ? esc(used.join('・')) : 'なし'}</b></div>` : ''}
        ${pfText('label', '項目名', p.label)}
        ${withType && isInputType(p.type) ? pfSelect('type', '部品の種類', p.type, PALETTE_GROUPS.flatMap((g) => g.types).filter(isInputType).map((k) => [k, partTypeName(k)])) : ''}
        ${p.type === 'status' || p.type === 'steps' ? '' : pfCheck('required', p.type === 'table' ? '必須（1 行以上）' : '必須', p.required)}
        ${lookupFieldsHtml(d, p)}
        ${p.type === 'table' ? tableColumnsEditorHtml(p, true) : ''}
        ${typeFields ? `<div class="pf-sep"><i>${esc(p.item ? itemTypeName(p.item.type) : t.name)}の欄</i></div>${typeFields}` : ''}
        ${pfArea('memo', 'メモ', p.memo, { hint: '（自由に書く）' })}
        ${pfOutHtml(p, { forItem: withType })}
      </div>
    </fieldset>`;
}

// ルックアップの欄（画像 q22 の案A）。探すときに使う項目（テキスト（1行）・数値）に、ルックアップ元のデータベース・探すときに使う元の項目・
// 一緒に写す項目をまとめて書く。一緒に写される項目には、どの項目のルックアップで何が入るかと、その探す項目の設定を開くボタンを出す
const lkSelect = (key, value, choices, { i = null, label = '' } = {}) => `<select data-lk="${key}"${i != null ? ` data-i="${i}"` : ''} aria-label="${esc(label)}">${choices.map(([v, l]) =>
  `<option value="${esc(v)}"${value === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const lkText = (key, value, { i = null, label = '', placeholder = '' } = {}) =>
  `<input type="text" data-lk="${key}"${i != null ? ` data-i="${i}"` : ''} value="${esc(value)}" placeholder="${esc(placeholder)}" aria-label="${esc(label)}">`;

function lookupFieldsHtml(d, p) {
  const state = store.state;
  const role = p.item ? lookupCopyOf(d, p.item) : null;
  if (role && !p.item.lookup) {
    const klk = role.key.lookup;
    const src = klk.db.designId ? findDesign(state, klk.db.designId) : null;
    return `<div class="pf-banner ref">⇦ この項目には、「${esc(role.key.name)}」のルックアップで、${esc(dbLabel(state, klk.db))}の「${esc(refLabel(src, role.copy.from))}」が入ります。
      <div class="btns"><button class="btn small" data-action="open-lookup-key" data-id="${esc(role.key.id)}">${esc(role.key.name)}の設定を開く</button></div></div>`;
  }
  if (!LOOKUP_TYPES.includes(p.type)) return '';
  const lk = p.item ? p.item.lookup : p.lookup || null;
  const head = `<label class="check"><input type="checkbox" data-lk="on"${lk ? ' checked' : ''}>ほかのデータベースから引く（ルックアップ）</label>`;
  if (!lk) return `<div class="lk-box">${head}</div>`;
  const src = lk.db.designId ? findDesign(state, lk.db.designId) : null;
  const dbs = visibleDesigns(state).filter((x) => x.id !== d.id);
  const dbChoices = [['', '（選んでください）'], ...dbs.map((x) => ['d:' + x.id, `${x.name}（${targetLabel(x.target)}）`])];
  if (lk.db.designId && !dbs.some((x) => x.id === lk.db.designId)) dbChoices.push(['d:' + lk.db.designId, `${dbLabel(state, lk.db)}（ごみ箱にあるか、もうありません）`]);
  dbChoices.push(['__free__', '✎ 一覧にないデータベース（名前を書く）']);
  const dbValue = lk.db.designId ? 'd:' + lk.db.designId : lk.db.free ? '__free__' : '';
  // 元の項目を選ぶ欄。一覧にないデータベースのときは名前を書く欄
  const srcRef = (key, ref, opts) => {
    if (!src) return lkText(key + 'Name', ref.name, { ...opts, placeholder: '元の項目の名前' });
    const choices = [['', '（選んでください）'], ...src.items.map((it) => [it.id, it.name])];
    if (ref.itemId && !findItem(src, ref.itemId)) choices.push([ref.itemId, `${ref.name}（もうありません）`]);
    return lkSelect(key, ref.itemId || '', choices, opts);
  };
  const toChoices = (ref) => {
    const c = [['', '（選んでください）'], ...d.items.filter((it) => !p.item || it.id !== p.item.id).map((it) => [it.id, it.name])];
    if (ref.itemId && !findItem(d, ref.itemId)) c.push([ref.itemId, `${ref.name}（もうありません）`]);
    return [...c, ['__new__', '＋ 同じ名前で新しく作る']];
  };
  const pairs = lk.copies.map((c, i) => `<div class="lk-pair">${srcRef('from', c.from, { i, label: `${i + 1} つ目の元の項目` })}→${lkSelect('to', c.to.itemId || '', toChoices(c.to), { i, label: `${i + 1} つ目の写す先の項目` })}
      <button class="del-x" data-action="lk-del" data-i="${i}" title="この組を外します" aria-label="${i + 1} つ目の組を外す">✕</button></div>`).join('');
  return `<div class="lk-box">${head}
    <label class="field"><span>ルックアップ元のデータベース</span>${lkSelect('db', dbValue, dbChoices, { label: 'ルックアップ元のデータベース' })}</label>
    ${!lk.db.designId && lk.db.free ? `<label class="field"><span>データベースの名前</span>${lkText('dbName', lk.db.name, { label: 'データベースの名前', placeholder: '例: 会計システム' })}</label>` : ''}
    <label class="field"><span>探すときに使う元の項目 <small>（この項目の値で探す）</small></span>${srcRef('key', lk.key, { label: '探すときに使う元の項目' })}</label>
    <div class="field" style="margin-bottom:4px"><span>一緒に写す項目 <small>（元の項目 → この画面設計の項目）</small></span></div>
    ${pairs}
    <button class="lk-add" data-action="lk-add">＋ 写す項目を足す</button>
  </div>`;
}

// いくつか選んだときの右の欄（画像 q28）。選んだものの一覧（いちばん初めが基準）・揃える・大きさをそろえる・まとめて番号と消す
function multiSettingsHtml(d) {
  const s = currentScreen();
  const parts = ui.sel.filter((x) => x.k === 'p').length;
  const cos = ui.sel.length - parts;
  const names = ui.sel.map((x, i) => {
    const o = x.k === 'p' ? findPart(s, x.id) : findCallout(s, x.id);
    if (!o) return '';
    const p = x.k === 'p' ? resolvePart(d, o) : null;
    const label = p ? `${p.no != null ? `<span class="pno">${p.no}</span>` : ''}${esc(partTitle(p))}` : `💬 ${esc(String(o.text).split('\n')[0].slice(0, 12) || '吹き出し')}`;
    return `<span>${i === 0 ? '<b>基準</b>' : ''}${label}</span>`;
  }).join('');
  const btn = ([cmd, action, label, svg]) => `<button data-action="${action}"${ui.sel.length < (cmd.startsWith('distribute') ? 3 : 2) ? ' disabled' : ''}>${alignSvg(svg)}<span>${label.replace('\n', '')}</span></button>`;
  return `
    <div class="panel-title">${ui.sel.length} 個を選んでいます <small>（部品 ${parts}・吹き出し ${cos}）</small></div>
    <div class="ms-list">${names}</div>
    <div class="ms-sub">揃える <small style="font-weight:400;color:#64748b">（基準＝最初に選んだものに合わせる）</small></div>
    <div class="ms-btns">${ALIGN_BUTTONS.map(btn).join('')}</div>
    <div class="ms-sub">大きさをそろえる</div>
    <div class="ms-btns" style="grid-template-columns:1fr 1fr">${SIZE_BUTTONS.map(btn).join('')}</div>
    <div class="ms-sub">まとめて</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn small" data-action="number-on"${parts ? '' : ' disabled'}>番号を付ける</button>
      <button class="btn small" data-action="number-off"${parts ? '' : ' disabled'}>番号を外す</button>
      <button class="btn small danger-text" data-action="delete-many">まとめて消す</button>
    </div>
    <p class="hint" style="margin-top:12px">Ctrl を押しながら押すと、選ぶものを足したり外したりできます。何もない所からドラッグして囲むと、枠に全部入ったものを選びます。</p>`;
}

// 選んだ吹き出しの設定の欄（画像 q27）
function calloutSettingsHtml(c) {
  const s = currentScreen();
  const d = currentDesign();
  const parts = s.parts.map((raw) => resolvePart(d, raw)).filter((p) => partType(p.type))
    .sort((a, b) => (a.no == null) - (b.no == null) || (a.no || 0) - (b.no || 0) || a.y - b.y || a.x - b.x)
    .map((p) => [p.id, `${p.no != null ? p.no + '　' : ''}${partTitle(p)}（${partTypeName(p.type)}）`]);
  const seg = (key, value, choices) => `<div class="seg">${choices.map(([v, l]) =>
    `<label><input type="radio" name="co-${key}" value="${v}" data-co="${key}"${value === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
  return `
    <div class="panel-title">選んだ吹き出しの設定</div>
    <label class="field"><span>文字</span><textarea data-co="text" rows="4">${esc(c.text)}</textarea></label>
    <label class="field"><span>つなぐ部品 <small>（線の先の ○ をドラッグして部品に重ねても選べる）</small></span><select data-co="target">
      <option value="">（つながない）</option>${parts.map(([v, l]) => `<option value="${esc(v)}"${c.target === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    <div class="field"><span>線の先の形</span>${seg('tip', c.tip, [['dot', '● 点'], ['arrow', '➤ 矢印'], ['none', 'なし']])}</div>
    <div class="field"><span>色</span>${seg('color', c.color, Object.entries(CALLOUT_COLORS).map(([k, [n, col]]) => [k, `<i class="co-swatch" style="border-color:${col};background:${col}22"></i>${n}`]))}</div>
    <p class="hint">吹き出しには赤い番号を付けず、部品の設定の一覧表にも入りません。つないだ部品を消したときは、吹き出しは残り、線だけが消えます。</p>
    <div class="pf-del"><button class="btn small danger-text" data-action="delete-callout">この吹き出しを消す</button></div>`;
}

// データベースの項目の一覧表で項目を選んだときの右の欄（画像 q20 の 4）
function itemSettingsHtml(d, p) {
  const linked = !!p.item.link;
  return `
    <div class="panel-title">選んだ項目の設定（${esc(p.label || '名前なし')}）</div>
    ${linked ? linkBannerHtml(p.item) : ''}
    ${itemSectionHtml(d, p, { withType: true, locked: linked, note: linked ? '元のモックの中身' : 'どの画面でも同じ' })}
    <div class="pf-del"><button class="btn small danger-text" data-action="delete-item" data-id="${esc(p.id)}">この項目を消す</button></div>`;
}

function itemsHintHtml(d) {
  return `
    <div class="panel-title">データベースの項目</div>
    <p class="hint">「${esc(d.name)}」が持つ項目を、画面に関係なく 1 か所にまとめた表です。どの画面の入力欄の部品も、この表の項目を指します。</p>
    <p class="hint" style="margin-top:8px">表の行を押すと、ここにその項目の設定が出ます。画面に置くときは、左の一覧で画面を選び、右の部品の箱のいちばん上の「データベースの項目」から画面へドラッグします。</p>`;
}

// 部品の種類ごとの欄（CLAUDE.md の「部品の細かい決めごと」）
function partTypeFieldsHtml(p) {
  const pr = p.props;
  // 選択肢の部品だけで使う欄（ほかの種類では作らない）
  const optionsField = () => pfArea('props.options', '選択肢', (pr.options || []).join('\n'), { hint: '（1 行に 1 つ）', rows: 4 });
  const dirField = () => pfSeg('props.dir', '並べ方', pr.dir, [['h', '横'], ['v', '縦']]);
  const initialField = () => `<div id="pf-initial" data-options="${esc(JSON.stringify(pr.options || []))}">${choiceInitialHtml(p)}</div>`;
  switch (p.type) {
    case 'text1': case 'text2':
      return pfRow(pfText('props.maxLen', '最大の文字数', pr.maxLen, NUM), pfText('props.initial', '初期値', pr.initial));
    case 'number':
      return pfText('props.unit', '単位', pr.unit, { placeholder: '例: 円・人' })
        + pfRow(pfText('props.min', 'いちばん小さい値', pr.min, NUM), pfText('props.max', 'いちばん大きい値', pr.max, NUM))
        + pfRow(pfText('props.decimals', '小数の桁数', pr.decimals, NUM), pfText('props.initial', '初期値', pr.initial));
    case 'date':
      return pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['today', '今日'], ['date', '日付を書く']])
        + (pr.initial === 'date' ? pfText('props.initialDate', '初期値の日付', pr.initialDate, { type: 'date' }) : '');
    case 'datetime':
      return pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['now', '今の日時']]);
    case 'dropdown': case 'radio':
      return optionsField() + initialField() + (p.type === 'radio' ? dirField() : '');
    case 'checkbox':
      return optionsField() + initialField() + dirField();
    case 'user':
      return pfText('props.scope', '選べる人', pr.scope, { placeholder: '例: 営業部の社員' })
        + pfCheck('props.multiple', '複数人を選べる', pr.multiple)
        + pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['me', '使っている人']]);
    case 'file':
      return pfRow(pfText('props.accept', '受け付けるファイル', pr.accept, { placeholder: '例: PDF' }), pfText('props.maxCount', 'いちばん多い個数', pr.maxCount, NUM));
    case 'calc':
      return pfText('props.formula', '計算式', pr.formula, { placeholder: '例: 数量×単価' }) + pfText('props.unit', '単位', pr.unit, { placeholder: '例: 円' });
    case 'button':
      return pfSeg('props.style', '見た目', pr.style, [['primary', '目立つ（青）'], ['normal', 'ふつう（白）']])
        + pfArea('props.action', '押したとき', pr.action);
    case 'status': case 'steps':
      return pfArea('props.states', 'ステータスの並び', (pr.states || []).join('\n'), { hint: '（1 行に 1 つ。上から順に進む）', rows: 4 });
    case 'graph': {
      const items = (currentDesign() || { items: [] }).items.filter((it) => isInputType(it.type)).map((it) => [it.id, it.name]);
      return pfSeg('props.chart', 'グラフの種類', pr.chart, Object.entries(CHART_NAMES).map(([k, n]) => [k, n.replace('グラフ', '')]))
        + pfRow(pfSelect('props.byItem', '分類する項目', pr.byItem, [['', '（なし）'], ...items]), pfText('props.byUnit', '分け方', pr.byUnit, { placeholder: '例: 月ごと' }))
        + pfRow(pfSelect('props.agg', '集計のしかた', pr.agg, Object.entries(AGG_NAMES).map(([k, n]) => [k, k === 'count' ? '件数' : n])), pfSelect('props.aggItem', '集計する項目', pr.aggItem, [['', '（なし）'], ...items]))
        + pfArea('props.samples', '見本の値', pr.samples, { hint: '（1 行に「分類, 値」を 1 組）', rows: 6 })
        + pfText('props.unit', '値の単位', pr.unit, { placeholder: '例: 万円' });
    }
    case 'search': {
      const on = pr.items || [];
      const boxes = (currentDesign() || { items: [] }).items.filter((it) => isInputType(it.type)).map((it) =>
        `<label><input type="checkbox" data-pf="props.items" value="${esc(it.id)}"${on.includes(it.id) ? ' checked' : ''}>${esc(it.name)}</label>`).join('');
      return pfText('placeholder', '薄い字', p.placeholder, { placeholder: partType('search').ph })
        + `<div class="field">${pfLabel('探す項目', '（いくつでも）')}<div class="pf-multi">${boxes || '<span class="hint">データベースの項目がまだありません。</span>'}</div></div>`
        + pfCheck('props.button', '「検索」ボタンを付ける', pr.button !== false);
    }
    case 'filter': return filterFieldsHtml(p);
    case 'pager':
      return pfRow(pfText('props.perPage', '1 ページの件数', pr.perPage, NUM), pfText('props.total', '見本の全部の件数', pr.total, NUM))
        + pfCheck('props.showCount', '件数を書く', pr.showCount !== false);
    case 'tabs':
      return pfArea('props.tabs', 'タブの名前', (pr.tabs || []).join('\n'), { hint: '（1 行に 1 つ）', rows: 4 })
        + pfSelect('props.current', '選んでいるタブ', pr.current, (pr.tabs || []).map((s) => [s, s]));
    case 'link': {
      const screens = (currentDesign() || { screens: [] }).screens.map((s) => [s.id, `${s.name}の画面`]);
      return pfSelect('props.to', '移る先', pr.to, [['', '（なし）'], ['screen', 'この画面設計のほかの画面'], ['url', 'URL を書く']])
        + (pr.to === 'screen' ? pfSelect('props.screenId', '移る画面', pr.screenId, [['', '（選んでください）'], ...screens]) : '')
        + (pr.to === 'url' ? pfText('props.url', 'URL', pr.url, { placeholder: 'https://' }) : '');
    }
    case 'icon':
      return pfSelect('props.icon', 'アイコンの種類', pr.icon, Object.entries(ICONS).map(([k, v]) => [k, v[0]]))
        + pfSeg('props.color', '色', pr.color, Object.entries(ICON_COLORS).map(([k, v]) => [k, v[0]]));
  }
  return '';
}

// 絞り込みの欄: 絞り込む項目を並べ（↑↓ で並べ替え・✕ で外す）、項目ごとに見本の値を書く
function filterFieldsHtml(p) {
  const pr = p.props;
  const d = currentDesign();
  const ids = pr.items || [];
  const rows = ids.map((id, i) => {
    const it = findItem(d, id);
    return `<div class="lk-pair"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it ? it.name : '（項目なし）')}</span>
      <input type="text" data-fl="value" data-i="${i}" value="${esc((pr.values || [])[i] || '')}" placeholder="すべて" aria-label="${esc(it ? it.name : '')}の見本の値" style="flex:1">
      <button class="del-x" data-action="fl-up" data-i="${i}" title="上へ" aria-label="上へ"${i ? '' : ' disabled'}>↑</button>
      <button class="del-x" data-action="fl-down" data-i="${i}" title="下へ" aria-label="下へ"${i < ids.length - 1 ? '' : ' disabled'}>↓</button>
      <button class="del-x" data-action="fl-del" data-i="${i}" title="外す" aria-label="外す">✕</button></div>`;
  }).join('');
  const choices = d.items.filter((it) => isInputType(it.type) && !ids.includes(it.id)).map((it) => [it.id, it.name]);
  return `<div class="field">${pfLabel('絞り込む項目', '（右の欄は見本の値）')}${rows || '<span class="hint">まだありません。下で項目を選んで足します。</span>'}</div>
    <label class="field"><span>絞り込む項目を足す</span><select data-fl="add"><option value="">（選んでください）</option>${choices.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label>`;
}

// ── 表の部品の設定の欄（画像 q24）──
// 表の中身（テーブル・レコード一覧・関連レコード一覧）を選ぶ。テーブルは項目になるので「項目の設定」と「この画面だけの設定」に分ける
function tableSettingsHtml(p, t) {
  const d = currentDesign();
  const kind = `<div class="field">${pfLabel('表の中身')}<div class="seg">${Object.entries(TABLE_KINDS).map(([k, n]) =>
    `<label><input type="radio" name="tb-kind" value="${k}" data-tb="kind"${p.tableKind === k ? ' checked' : ''}><span>${n}</span></label>`).join('')}</div></div>`;
  const title = `<div class="panel-title">選んだ部品の設定（${p.no != null ? `番号 ${p.no}・` : ''}表（${TABLE_KINDS[p.tableKind]}））</div>`;
  // 項目の設定の枠を直せないテーブル（取り込んだ表・項目を一覧表から消した後の表）は、列を選ぶボタンを、この画面だけの設定にも出す
  const lockedCols = p.tableKind === 'subtable' && (!p.item || !!p.item.link);
  const here = `<div class="pf-sec here"><div class="pf-sec-head">この画面だけの設定<small>${esc(currentScreen().name)}の画面</small></div><div class="pf-sec-body">
      <label class="field"><span>見本の行の数</span><input type="number" min="1" max="20" data-tb="rows" value="${(p.view || {}).rows || 3}"></label>
      ${tableColumnViewHtml(p, lockedCols)}
      ${pfCheck('numbered', '番号を付ける', p.no != null)}
    </div></div>`;
  if (p.tableKind === 'subtable') {
    const gone = !p.item;
    const linked = !!(p.item && p.item.link);
    const banner = gone
      ? `<div class="pf-banner gone">⚠ この表の項目「${esc(p.label)}」は、データベースの項目の一覧表から消しました。消したときの中身のまま表示しています。ここでは直せません。
          <div class="btns"><button class="btn small primary" data-action="restore-item" data-id="${esc(p.itemId)}">項目の一覧表に戻す</button></div></div>`
      : linked ? linkBannerHtml(p.item) : '';
    return `${title}${kind}${banner}
      ${itemSectionHtml(d, p, { locked: gone || linked, note: gone ? '消したときの中身' : linked ? '元のモックの中身' : 'どの画面でも同じ' })}
      ${here}
      <div class="pf-del"><button class="btn small danger-text" data-action="delete-part">この画面から部品を消す</button></div>`;
  }
  const pr = p.props;
  let source = '';
  if (p.tableKind === 'related') {
    const dbs = visibleDesigns(store.state).filter((x) => x.id !== d.id);
    const choices = [['', '（選んでください）'], ...dbs.map((x) => ['d:' + x.id, `${x.name}（${targetLabel(x.target)}）`]), ['__free__', '✎ 一覧にないデータベース（名前を書く）']];
    const src = pr.db.designId ? findDesign(store.state, pr.db.designId) : null;
    const fromField = src
      ? `<select data-tb="condFrom" aria-label="元の項目"><option value="">（選んでください）</option>${src.items.map((it) => `<option value="${esc(it.id)}"${pr.cond.from.itemId === it.id ? ' selected' : ''}>${esc(it.name)}</option>`).join('')}</select>`
      : `<input type="text" data-tb="condFromName" value="${esc(pr.cond.from.name)}" placeholder="元の項目の名前" aria-label="元の項目の名前">`;
    const toField = `<select data-tb="condTo" aria-label="このレコードの項目"><option value="">（選んでください）</option>${d.items.filter((it) => isInputType(it.type)).map((it) => `<option value="${esc(it.id)}"${pr.cond.to.itemId === it.id ? ' selected' : ''}>${esc(it.name)}</option>`).join('')}</select>`;
    source = `<label class="field"><span>関連レコード一覧の元のデータベース</span><select data-tb="db">${choices.map(([v, l]) =>
      `<option value="${esc(v)}"${(pr.db.designId ? 'd:' + pr.db.designId : pr.db.free ? '__free__' : '') === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      ${!pr.db.designId && pr.db.free ? `<label class="field"><span>データベースの名前</span><input type="text" data-tb="dbName" value="${esc(pr.db.name)}" placeholder="例: 受注管理"></label>` : ''}
      <div class="field">${pfLabel('条件', '（元の項目 ＝ このレコードの項目）')}<div class="lk-pair">${fromField}＝${toField}</div></div>`;
  }
  const count = p.tableKind === 'related'
    ? pfRow(pfText('props.sort', '並べ順', pr.sort, { placeholder: '例: 受注日の新しい順' }), pfText('props.limit', '最大の件数', pr.limit, NUM))
    : pfRow(pfText('props.sort', '並べ順', pr.sort, { placeholder: '例: 顧客コードの小さい順' }), pfText('props.perPage', '1 ページの件数', pr.perPage, NUM));
  return `${title}${kind}
    <div class="pf-sec item"><div class="pf-sec-head">この部品の設定<small>データベースの項目にはならない</small></div><div class="pf-sec-body">
      ${pfText('label', '表の名前', p.label)}
      ${source}
      ${tableColumnsEditorHtml(p, false)}
      ${count}
      ${pfArea('memo', 'メモ', p.memo, { hint: '（自由に書く）' })}
      ${pfOutHtml(p)}
    </div></div>
    ${here}
    <div class="pf-del"><button class="btn small danger-text" data-action="delete-part">この部品を消す</button></div>`;
}

// 表の列の欄。押した列を選び（選んだ列の見本の値と幅を、この画面だけの設定で書く）、↑↓ で並べ替え、✕ で外す。
// テーブルは選んだ列の設定（列の名前・種類・必須・種類ごとの欄）もここで書く。レコード一覧・関連レコード一覧は項目を選んで足す
function tableColumnsEditorHtml(p, isItem) {
  const cols = p.columns || tableColumns({ ...p, tableKind: 'subtable' });
  const pr = p.props || {};
  const rows = cols.map((c, i) => {
    const sel = c.id === ui.colId;
    const head = `<div class="lk-pair"><button class="pal-item${sel ? ' on' : ''}" data-action="tb-col" data-id="${esc(c.id)}" style="flex:1;cursor:pointer"><span>${esc(c.name)}</span><small>${esc(c.kind)}</small></button>
      <button class="del-x" data-action="tb-col-up" data-id="${esc(c.id)}" title="左へ" aria-label="左へ"${i ? '' : ' disabled'}>↑</button>
      <button class="del-x" data-action="tb-col-down" data-id="${esc(c.id)}" title="右へ" aria-label="右へ"${i < cols.length - 1 ? '' : ' disabled'}>↓</button>
      <button class="del-x" data-action="tb-col-del" data-id="${esc(c.id)}" title="この列を外す" aria-label="この列を外す">✕</button></div>`;
    if (!sel || !isItem) return head;
    const col = (pr.columns || []).find((x) => x.id === c.id);
    const fake = { ...col, label: col.name };
    const fields = partTypeFieldsHtml(fake).replace(/data-pf="props\./g, 'data-tb="col.props.').replace(/id="pf-initial"/g, '').replace(/name="pf-props\./g, 'name="tb-col.');
    return `${head}<div class="lk-box" style="border-color:#93c5fd;background:#fff">
      <label class="field"><span>列の名前</span><input type="text" data-tb="col.name" value="${esc(col.name)}"></label>
      <label class="field"><span>部品の種類</span><select data-tb="col.type">${PALETTE_GROUPS.flatMap((g) => g.types).filter(isInputType).map((k) => `<option value="${k}"${col.type === k ? ' selected' : ''}>${esc(partTypeName(k))}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" data-tb="col.required"${col.required ? ' checked' : ''}>必須</label>
      ${fields}
    </div>`;
  }).join('');
  let add;
  if (isItem) add = '<button class="lk-add" data-action="tb-col-add">＋ 列を足す</button>';
  else {
    const src = p.tableKind === 'related' ? (pr.db.designId ? findDesign(store.state, pr.db.designId) : null) : currentDesign();
    const used = new Set((pr.columns || []).map((c) => c.ref.itemId).filter(Boolean));
    add = src
      ? `<label class="field"><span>列を足す</span><select data-tb="addCol"><option value="">（${esc(src.name)}の項目から選ぶ）</option>${src.items.filter((it) => isInputType(it.type) && !used.has(it.id)).map((it) => `<option value="${esc(it.id)}">${esc(it.name)}</option>`).join('')}</select></label>`
      : '<label class="field"><span>列を足す</span><input type="text" data-tb="addColName" placeholder="元の項目の名前を書く"></label>';
  }
  return `<div class="field" style="margin-bottom:4px">${pfLabel('列', '（押すと、その列の設定と見本の値）')}</div>${rows || '<p class="hint" style="margin-bottom:6px">列がまだありません。</p>'}${add}`;
}

// 選んだ列の見本の値と幅（この画面だけ）
function tableColumnViewHtml(p, pick = false) {
  const cols = p.columns || [];
  const picker = pick && cols.length ? `<div class="field">${pfLabel('列', '（押すと、その列の見本の値と幅）')}<div class="tb-pick">${cols.map((x) =>
    `<button class="pal-item${x.id === ui.colId ? ' on' : ''}" data-action="tb-col" data-id="${esc(x.id)}"><span>${esc(x.name)}</span></button>`).join('')}</div></div>` : '';
  const c = cols.find((x) => x.id === ui.colId);
  if (!c) return picker || '<p class="hint" style="margin-bottom:8px">列の欄で列を押すと、その列の見本の値と幅を書けます。</p>';
  return picker + tableColumnSampleHtml(p, c);
}
function tableColumnSampleHtml(p, c) {
  const view = p.view || { samples: {}, widths: {} };
  return `<label class="field"><span>見本の値（${esc(c.name)}の列） <small>1 行に 1 つ。上の行から入る</small></span><textarea data-tb="sample" rows="4">${esc((view.samples[c.id] || []).join('\n'))}</textarea></label>
    <label class="field"><span>列の幅（${esc(c.name)}の列） <small>書かないときは残りを分ける</small></span><input type="number" min="40" data-tb="width" value="${view.widths[c.id] || ''}"></label>`;
}

// 選択肢の部品の「初期値」。選択肢を書き換えたときは、ここだけを描き直す
function choiceInitialHtml(p) {
  const pr = p.props;
  const options = pr.options || [];
  if (p.type !== 'checkbox') return pfSelect('props.initial', '初期値', pr.initial, [['', '（なし）'], ...options.map((o) => [o, o])]);
  const on = Array.isArray(pr.initial) ? pr.initial : [];
  const boxes = options.map((o) => `<label><input type="checkbox" data-pf="props.initial" value="${esc(o)}"${on.includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('');
  return `<div class="field">${pfLabel('初期値', '（いくつでも）')}<div class="pf-multi">${boxes || '<span class="hint">選択肢を書くと選べます。</span>'}</div></div>`;
}

let keepSideOnNotify = false;
function commitKeepSide(fn) {
  keepSideOnNotify = true;
  try { fn(); } finally { keepSideOnNotify = false; }
}

// 右の欄の変更（文字は、欄を離れたときか Enter を押したときに保存する）
function onSidePanelChange(e) {
  if (e.target.dataset.co) { onCalloutFieldChange(e.target); return; }
  if (e.target.dataset.tb) { onTableFieldChange(e.target); return; }
  if (e.target.dataset.fl) { onFilterFieldChange(e.target); return; }
  if (e.target.dataset.lk) { onLookupFieldChange(e.target); return; }
  if (e.target.dataset.pf) { onPartFieldChange(e.target); return; }
  const field = e.target.dataset.field;
  const d = currentDesign();
  const s = currentScreen();
  if (!field || !d) return;
  const v = e.target.value;
  if (field === 'design-name' || field === 'screen-name') {
    const old = field === 'design-name' ? d.name : s.name;
    const n = cleanName(v);
    if (!n) { e.target.value = old; toast('名前を空にはできません。'); return; }
    if (n === old) return;
    const patch = { name: n };
    commitKeepSide(() => (field === 'design-name' ? actions.updateDesignInfo(d.id, patch) : actions.updateScreen(d.id, s.id, patch)));
    return;
  }
  if (field === 'design-desc' && v !== d.description) commitKeepSide(() => actions.updateDesignInfo(d.id, { description: v }));
  if (field === 'device' && v !== s.device) actions.updateScreen(d.id, s.id, { device: v });
  if (field === 'screen-header') actions.updateScreen(d.id, s.id, { showHeader: e.target.checked });
  if (field === 'table-pos' && v !== s.tablePos) actions.updateScreen(d.id, s.id, { tablePos: v });
}

// 選んだ部品の設定の欄の変更。文字の欄は右の欄を描き直さずに保存し（打っている欄が作り直されないため）、
// 「一覧表に出る文」と選択肢の初期値だけを描き直す
const isTextInput = (el) => el.matches('input[type=text], input[type=number], input[type=date], textarea');
function onPartFieldChange(el) {
  const s = currentScreen();
  const p = currentSubject();
  if (!p) return;
  const key = el.dataset.pf;
  const value = readPartField(el);
  const old = key.startsWith('props.') ? p.props[key.slice(6)] : key.startsWith('view.') ? (p.view || {})[key.slice(5)] : key === 'numbered' ? p.no != null : p[key];
  if (JSON.stringify(old) === JSON.stringify(value)) return;
  const patch = key.startsWith('props.') ? { props: { [key.slice(6)]: value } } : key.startsWith('view.') ? { view: { [key.slice(5)]: value } } : { [key]: value };
  // データベースの項目の一覧表では項目を、画面では部品を書き換える（部品の項目名と設定は、部品が指す項目に書く）
  const apply = () => (ui.panel === 'items' ? actions.updateItem(ui.designId, p.id, patch) : actions.updatePart(ui.designId, s.id, p.id, patch));
  if (!isTextInput(el)) { apply(); return; }
  commitKeepSide(apply);
  const now = currentSubject();
  const out = $('#pf-out');
  if (out) out.textContent = subjectSettingText(now) || '（まだありません）';
  if (key === 'props.options') refreshChoiceInitial(now.props.options);
  // 項目名を変えたときは、項目の一覧表と部品の箱の名前も合わせる（右の欄は描き直さない）
  if (key === 'label' && ui.panel === 'items') renderItemsView(currentDesign());
  if (key === 'label') renderPalette(currentDesign());
}

const parseOptions = (text) => String(text).split('\n').map((o) => o.trim()).filter(Boolean);

// ルックアップの欄の変更（data-lk）。今のルックアップを写して直し、actions.updateLookup で 1 回で書く
function onLookupFieldChange(el) {
  const p = currentSubject();
  const item = p && p.item;
  const d = currentDesign();
  if (!item || item.link) return;
  const k = el.dataset.lk;
  const i = Number(el.dataset.i);
  const next = item.lookup ? clone(item.lookup) : null;
  let create = null;
  const src = next && next.db.designId ? findDesign(store.state, next.db.designId) : null;
  const srcItemRef = (id) => { const it = findItem(src, id); return it ? { itemId: it.id, name: it.name } : emptyRef(); };
  if (k === 'on') {
    commitLookup(d, item, el.checked ? { db: { designId: null, name: '', free: false }, key: emptyRef(), copies: [] } : null, null, el);
    return;
  }
  if (!next) return;
  switch (k) {
    case 'db': {
      const v = el.value;
      const x = v.startsWith('d:') ? findDesign(store.state, v.slice(2)) : null;
      next.db = x ? { designId: x.id, name: x.name, free: false } : { designId: null, name: '', free: v === '__free__' };
      // データベースを変えたら、元の項目は選び直す
      next.key = emptyRef();
      next.copies.forEach((c) => { c.from = emptyRef(); });
      break;
    }
    case 'dbName': next.db.name = el.value.trim(); break;
    case 'key': next.key = srcItemRef(el.value); break;
    case 'keyName': next.key = { itemId: null, name: el.value.trim() }; break;
    case 'from': next.copies[i].from = srcItemRef(el.value); break;
    case 'fromName': next.copies[i].from = { itemId: null, name: el.value.trim() }; break;
    case 'to': {
      if (el.value === '__new__') {
        const from = next.copies[i].from;
        const srcIt = findItem(src, from.itemId);
        create = { index: i, name: from.name || (srcIt && srcIt.name) || '項目名', type: srcIt && isInputType(srcIt.type) ? srcIt.type : 'text1' };
      } else {
        const it = findItem(d, el.value);
        next.copies[i].to = it ? { itemId: it.id, name: it.name } : emptyRef();
      }
      break;
    }
    default: return;
  }
  commitLookup(d, item, next, create, el);
}

// 文字の欄は右の欄を描き直さずに保存し（打っている欄が作り直されないため）、一覧表に出る文だけを描き直す
function commitLookup(d, item, next, create, el) {
  if (!create && JSON.stringify(next) === JSON.stringify(item.lookup)) return;
  const apply = () => actions.updateLookup(d.id, item.id, next, create);
  if (!isTextInput(el)) { apply(); return; }
  commitKeepSide(apply);
  const out = $('#pf-out');
  const now = currentSubject();
  if (out && now) out.textContent = subjectSettingText(now) || '（まだありません）';
}

// 吹き出しの設定の欄の変更（data-co）。文字は右の欄を描き直さずに保存する
function onCalloutFieldChange(el) {
  const s = currentScreen();
  const c = findCallout(s, ui.calloutId);
  if (!c) return;
  const key = el.dataset.co;
  const value = key === 'text' ? el.value : el.value || null;
  if ((c[key] || null) === (value || null) && key !== 'text') return;
  if (key === 'text') {
    if (c.text === value) return;
    commitKeepSide(() => actions.updateCallout(ui.designId, s.id, c.id, { text: value }));
    return;
  }
  actions.updateCallout(ui.designId, s.id, c.id, { [key]: value });
}

// ── 表の部品の設定の欄の変更（data-tb）──
// テーブルの列は項目（表）の列なので項目に書き、レコード一覧・関連レコード一覧の設定と、見本の値・幅は部品に書く
function onTableFieldChange(el) {
  const p = currentSubject();
  const s = currentScreen();
  if (!p || p.type !== 'table') return;
  const k = el.dataset.tb;
  const d = currentDesign();
  const keep = isTextInput(el);
  const run = (fn) => (keep ? commitKeepSide(fn) : fn());
  if (k === 'kind') { actions.setTableKind(d.id, s.id, p.id, el.value); return; }
  if (k === 'rows') { run(() => actions.updatePart(d.id, s.id, p.id, { view: { rows: Number(el.value) || 3 } })); return; }
  if (k === 'sample' || k === 'width') {
    if (!ui.colId) return;
    const view = clone(p.view);
    if (k === 'sample') view.samples[ui.colId] = String(el.value).split('\n').map((x) => x.trim());
    else if (Number(el.value) > 0) view.widths[ui.colId] = Math.round(Number(el.value));
    else delete view.widths[ui.colId];
    run(() => actions.updatePart(d.id, s.id, p.id, { view: { samples: view.samples, widths: view.widths } }));
    return;
  }
  if (k.startsWith('col.')) {
    if (!p.item || p.item.link) return;
    const cols = clone(p.item.props.columns);
    const c = cols.find((x) => x.id === ui.colId);
    if (!c) return;
    const f = k.slice(4);
    if (f === 'name') c.name = el.value.trim();
    else if (f === 'required') c.required = el.checked;
    else if (f === 'type') Object.assign(c, { type: el.value, props: keepInitialInOptions(el.value, normalizeProps(partType(el.value), c.props)) });
    else if (f.startsWith('props.')) {
      const pk = f.slice(6);
      c.props = keepInitialInOptions(c.type, { ...c.props, [pk]: el.type === 'checkbox' && pk !== 'initial' ? el.checked
        : pk === 'options' ? parseOptions(el.value)
        : pk === 'initial' && el.type === 'checkbox' ? [...document.querySelectorAll('#side-settings [data-tb="col.props.initial"]')].filter((x) => x.checked).map((x) => x.value)
        : el.tagName === 'TEXTAREA' ? el.value : el.value.trim() });
    }
    const apply = () => actions.updateItem(d.id, p.item.id, { props: { columns: cols.map(normalizeColumn) } });
    if (keep && f !== 'props.options') commitKeepSide(apply); else apply();
    return;
  }
  const pr = clone(p.props);
  if (k === 'db') {
    const x = el.value.startsWith('d:') ? findDesign(store.state, el.value.slice(2)) : null;
    pr.db = x ? { designId: x.id, name: x.name, free: false } : { designId: null, name: '', free: el.value === '__free__' };
    pr.cond.from = emptyRef();
    pr.columns = [];
  } else if (k === 'dbName') pr.db.name = el.value.trim();
  else if (k === 'condFrom') {
    const it = findItem(findDesign(store.state, pr.db.designId), el.value);
    pr.cond.from = it ? { itemId: it.id, name: it.name } : emptyRef();
  } else if (k === 'condFromName') pr.cond.from = { itemId: null, name: el.value.trim() };
  else if (k === 'condTo') {
    const it = findItem(d, el.value);
    pr.cond.to = it ? { itemId: it.id, name: it.name } : emptyRef();
  } else if (k === 'addCol' || k === 'addColName') {
    const src = p.tableKind === 'related' ? findDesign(store.state, pr.db.designId) : d;
    const it = k === 'addCol' ? findItem(src, el.value) : null;
    const name = it ? it.name : el.value.trim();
    if (!name) return;
    pr.columns.push({ id: newId('c'), ref: { itemId: it ? it.id : null, name } });
    if (k === 'addColName') el.value = '';
  } else return;
  run(() => actions.updatePart(d.id, s.id, p.id, { props: pr }));
}

// 表の列の欄のボタン（列を選ぶ・並べ替える・外す・足す）
function onTableColumnAction(action, id) {
  const p = currentSubject();
  const s = currentScreen();
  if (!p || p.type !== 'table') return;
  if (action === 'tb-col') { ui.colId = ui.colId === id ? null : id; renderSettings(currentDesign()); return; }
  const isItem = ui.panel === 'items' || p.tableKind === 'subtable';
  if (isItem && (!p.item || p.item.link)) return;
  const cols = clone(isItem ? p.item.props.columns : p.props.columns);
  const i = cols.findIndex((c) => c.id === id);
  if (action === 'tb-col-add') {
    const c = createColumnData('text1', `列 ${cols.length + 1}`);
    cols.push(c);
    ui.colId = c.id;
  } else if (i < 0) return;
  else if (action === 'tb-col-del') cols.splice(i, 1);
  else {
    const j = action === 'tb-col-up' ? i - 1 : i + 1;
    if (j < 0 || j >= cols.length) return;
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  if (isItem) actions.updateItem(ui.designId, p.item.id, { props: { columns: cols } });
  else actions.updatePart(ui.designId, s.id, p.id, { props: { columns: cols } });
}

// 絞り込みの欄の変更（data-fl）と、↑↓✕
function onFilterFieldChange(el) {
  const p = currentPart();
  if (!p || p.type !== 'filter') return;
  const items = [...(p.props.items || [])];
  const values = items.map((_, i) => (p.props.values || [])[i] || '');
  if (el.dataset.fl === 'add') {
    if (!el.value) return;
    items.push(el.value);
    values.push('');
  } else if (el.dataset.fl === 'value') values[Number(el.dataset.i)] = el.value.trim();
  else return;
  const apply = () => actions.updatePart(ui.designId, currentScreen().id, p.id, { props: { items, values } });
  if (isTextInput(el)) commitKeepSide(apply); else apply();
}
function onFilterAction(action, i) {
  const p = currentPart();
  if (!p || p.type !== 'filter') return;
  const items = [...(p.props.items || [])];
  const values = items.map((_, k) => (p.props.values || [])[k] || '');
  if (action === 'fl-del') { items.splice(i, 1); values.splice(i, 1); } else {
    const j = action === 'fl-up' ? i - 1 : i + 1;
    if (j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    [values[i], values[j]] = [values[j], values[i]];
  }
  actions.updatePart(ui.designId, currentScreen().id, p.id, { props: { items, values } });
}

// 「＋ 写す項目を足す」と、組の ✕
function editLookupCopies(fn) {

// 一緒に写される項目から、探す項目の設定を開く。画面では、その画面に探す項目の部品があればそれを選び、なければ項目の一覧表で選ぶ

// 選択肢の部品の初期値の欄を、options（まだ保存していない打ちかけの選択肢でもよい）に合わせて描き直す。同じ選択肢なら描き直さない

// 右の欄で打ちかけの文字（まだ change が起きていない）を保存する。
// 右の欄を作り直す操作（高さのドラッグ・部品を選ぶ）・命令・窓を離れる前に呼ぶ（呼ばないと、作り直しで打った文字が消える）

// ── 拡大縮小（ビジネスダイアグラムメーカーの applyZoom・syncZoomSpacer・zoomAtPointer から写した）──
function stageOffsetX() {
  return parseFloat($('#stage').style.left) || 0;
}

// スクロールできる範囲（#zoom-spacer）を、縮めた画面と一覧表の大きさに合わせる。画面が窓より狭いときは真ん中に置く。
// 一覧表の高さは中身で決まるので、描いた #stage の大きさ（拡大縮小の前の大きさ）も見る
function syncZoomSpacer() {
  const wrap = $('#canvas-wrap');
  const stage = $('#stage');
  const s = currentScreen();
  if (!wrap || !s) return;
  const h = ui.previewHeight == null ? s.height : ui.previewHeight;
  const tableW = s.tablePos === 'bottom' ? 0 : TABLE_GAP + TABLE_W;
  const sw = Math.round(Math.max(s.width + CALLOUT_ZONE * 2 + tableW + STAGE_PAD * 2, stage.offsetWidth) * ui.zoom);
  const sh = Math.round(Math.max(h + CALLOUT_ZONE * 2 + STAGE_PAD * 2, stage.offsetHeight) * ui.zoom);
  const offX = Math.max(0, Math.round((wrap.clientWidth - sw) / 2));
  $('#stage').style.left = offX + 'px';
  const spacer = $('#zoom-spacer');
  spacer.style.width = sw + offX + 'px';
  spacer.style.height = sh + 'px';
}

function applyZoom() {
  const stage = $('#stage');
  if (!stage) return;
  stage.style.transform = `scale(${ui.zoom})`;
  syncZoomSpacer();
  const label = Math.round(ui.zoom * 100) + '%';
  $('#zoom-label').textContent = label;
  $('#zoom-badge').textContent = label;
}

function nextZoom(dir) {
  if (dir > 0) {
    const up = ZOOM_STEPS.find((z) => z >= ui.zoom + 0.01);
    return up == null ? ui.zoom : up;
  }
  const down = [...ZOOM_STEPS].reverse().find((z) => z <= ui.zoom - 0.01);
  return down == null ? ui.zoom : down;
}

// 窓の中の点（vx, vy）が指している画面の位置を動かさずに、倍率を変える
function zoomAt(vx, vy, zoom) {
  const wrap = $('#canvas-wrap');
  const before = ui.zoom;
  if (!wrap || zoom === before) return;
  const cx = (vx + wrap.scrollLeft - stageOffsetX()) / before;
  const cy = (vy + wrap.scrollTop) / before;
  ui.zoom = zoom;
  applyZoom();
  wrap.scrollLeft = Math.max(0, stageOffsetX() + cx * zoom - vx);
  wrap.scrollTop = Math.max(0, cy * zoom - vy);
}

function zoomAtPointer(ev, dir) {
  const r = $('#canvas-wrap').getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, nextZoom(dir));
}

// ボタン・キー・メニューからの拡大縮小は、見えている部分の真ん中を中心にする
function zoomByCommand(cmd) {
  const wrap = $('#canvas-wrap');
  const zoom = cmd === 'zoomReset' ? 1 : nextZoom(cmd === 'zoomIn' ? 1 : -1);
  zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, zoom);
}

function setMode(mode) {
  ui.mode = mode;
  updateToolbarState();
}

// ── ハンドツールと高さのドラッグ（ビジネスダイアグラムメーカーの initHandTool から写した）と、部品のドラッグ ──
// drag.kind: 'pan'（ハンドで動かす）・'resize'（画面の高さ）・'move'（部品を動かす）・'size'（部品の大きさ）・'place'（部品の箱から置く）
let drag = null;

function initCanvasEvents(wrap) {
  wrap.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest('[data-drag="resize"]')) { startResize(ev, wrap); return; }
    if (ui.mode !== 'hand') { onSelectModeMouseDown(ev); return; }
    ev.preventDefault();
    drag = { kind: 'pan', wrap, sx: ev.clientX, sy: ev.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
    wrap.classList.add('grabbing');
  });
  // ハンドのときはホイールで、どのモードでも Ctrl+ホイールで、カーソルの位置を中心に拡大縮小する
  wrap.addEventListener('wheel', (ev) => {
    if (ui.mode !== 'hand' && !(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    if (ev.deltaY !== 0) zoomAtPointer(ev, ev.deltaY < 0 ? 1 : -1);
  }, { passive: false });
}

function startResize(ev, wrap) {
  ev.preventDefault();
  flushSideField();
  const s = currentScreen();
  drag = { kind: 'resize', wrap, sy: ev.clientY, st: wrap.scrollTop, h0: s.height, device: s.device, minH: minScreenHeight(s) };
  document.body.classList.add('resizing');
}

// 選択のモードで画面の上を押したとき: 部品・縁のつまみならドラッグを始め、何もない所なら選ぶのをやめる
// Ctrl（Shift でも）を押しながら押すと、選ぶものに足す・外す（Microsoft Office と同じ。ユーザーの指示）。
// そのままドラッグすると、選んだものを複製する（Office と同じ。Claude が決めた）。
// 選んだもののどれかをドラッグすると、まとめて動かす。何もない所からドラッグすると、囲んだ枠に全部入ったものを選ぶ
function onSelectModeMouseDown(ev) {
  const additive = ev.ctrlKey || ev.metaKey || ev.shiftKey;
  const grip = ev.target.closest('.grip');
  const handle = ev.target.closest('[data-co-handle]');
  if (handle && !additive) { startCalloutLink(ev, handle.dataset.coHandle); return; }
  const coEl = ev.target.closest('#stage .callout');
  const partEl = coEl ? null : ev.target.closest('#stage .screen .part');
  const hit = coEl ? { k: 'c', id: coEl.dataset.calloutId } : partEl ? { k: 'p', id: partEl.dataset.partId } : null;
  if (hit) {
    if (additive) { startAdditive(ev, hit); return; }
    if (ui.sel.length > 1 && isSelected(hit.k, hit.id)) { startGroupDrag(ev, false); return; }
    if (hit.k === 'c') startCalloutDrag(ev, hit.id, grip ? grip.dataset.grip : null);
    else startPartDrag(ev, hit.id, grip ? grip.dataset.grip : null);
    return;
  }
  if (ev.target.closest('.ptable')) return; // 一覧表の行は click で選ぶ
  if (!ev.target.closest('#co-zone')) { if (ui.sel.length && !additive) selectPart(null); return; }
  startBand(ev, additive);
}

// 選んでいるもの（ui.sel）を変えて、画面と右の欄を描き直す
function setSelection(sel) {
  flushSideField();
  ui.sel = sel;
  ui.colId = null;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}
function blurSidePanel() {
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
}

function startAdditive(ev, hit) {
  ev.preventDefault();
  flushSideField();
  blurSidePanel();
  drag = { kind: 'add', hit, sx: ev.clientX, sy: ev.clientY };
}
// Ctrl を押したままドラッグし始めたら、押したものも選んで、複製のドラッグにする
function dragAdditive(ev) {
  if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const { hit, sx, sy } = drag;
  if (!isSelected(hit.k, hit.id)) setSelection([...ui.sel, hit]);
  startGroupDrag({ clientX: sx, clientY: sy, preventDefault() {} }, true);
  dragGroup(ev);
}

function startGroupDrag(ev, copy) {
  ev.preventDefault();
  flushSideField();
  blurSidePanel();
  const s = currentScreen();
  drag = { kind: 'group', copy, sx: ev.clientX, sy: ev.clientY, rects: selRects(s, ui.sel), dx: 0, dy: 0, ghosts: null };
  document.body.classList.add(copy ? 'copying' : 'moving');
}
function selElement(x) {
  return [...document.querySelectorAll(x.k === 'p' ? '#stage .part' : '#stage .callout')].find((e) => (x.k === 'p' ? e.dataset.partId : e.dataset.calloutId) === x.id);
}
// まとめて動かしている間は、要素だけを動かす（保存は放したとき）。複製のときは、写しの影を動かす
function dragGroup(ev) {
  const s = currentScreen();
  const [dx, dy] = clampGroupMove(s, drag.rects, snapGrid((ev.clientX - drag.sx) / ui.zoom), snapGrid((ev.clientY - drag.sy) / ui.zoom));
  drag.dx = dx;
  drag.dy = dy;
  if (drag.copy && !drag.ghosts) {
    drag.ghosts = drag.rects.map((r) => {
      const el = selElement(r);
      if (!el) return null;
      const g = el.cloneNode(true);
      g.classList.add('ghost-copy');
      g.classList.remove('sel-ref');
      el.parentNode.appendChild(g);
      return g;
    });
  }
  const overrides = {};
  drag.rects.forEach((r, i) => {
    const el = drag.copy ? drag.ghosts[i] : selElement(r);
    const off = r.k === 'c' ? CALLOUT_ZONE : 0;
    if (el) Object.assign(el.style, { left: off + r.x + dx + 'px', top: off + r.y + dy + 'px' });
    overrides[r.k + ':' + r.id] = { ...r, x: r.x + dx, y: r.y + dy };

}

  if (done.copy) {
    const out = actions.insertCopies(ui.designId, currentScreen().id, selectionEntries(), done.dx, done.dy);
    if (out.length) { ui.sel = out; updateEditor(); } else renderStage();
    return;
  }
  if (!actions.moveMany(ui.designId, currentScreen().id, ui.sel, done.dx, done.dy)) renderStage();
}

// 何もない所からのドラッグで囲む。Ctrl を押していないときは、押した時点で選ぶのをやめる
function zonePoint(ev) {
  const zone = $('#co-zone');
  const r = zone.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / ui.zoom - CALLOUT_ZONE, y: (ev.clientY - r.top) / ui.zoom - CALLOUT_ZONE };
}
function startBand(ev, additive) {
  ev.preventDefault();
  if (!additive && ui.sel.length) selectPart(null);
  else flushSideField();
  const pt = zonePoint(ev);
  drag = { kind: 'band', x0: pt.x, y0: pt.y, x: pt.x, y: pt.y, additive, base: [...ui.sel], el: null, sx: ev.clientX, sy: ev.clientY };
}
function dragBand(ev) {
  if (!drag.el && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const pt = zonePoint(ev);
  drag.x = pt.x;
  drag.y = pt.y;
  if (!drag.el) {
    drag.el = document.createElement('div');
    drag.el.className = 'band';
    $('#co-zone').appendChild(drag.el);
  }
  const Z = CALLOUT_ZONE;
  Object.assign(drag.el.style, { left: Z + Math.min(drag.x0, drag.x) + 'px', top: Z + Math.min(drag.y0, drag.y) + 'px', width: Math.abs(drag.x - drag.x0) + 'px', height: Math.abs(drag.y - drag.y0) + 'px' });
}
// 枠の中に全部入った部品と吹き出しを選ぶ（ユーザーが選んだ）。並びは上から下・左から右（いちばん初めが基準）
function endBand(done) {
  if (!done.el) return;
  done.el.remove();
  const s = currentScreen();
  const [x0, y0, x1, y1] = [Math.min(done.x0, done.x), Math.min(done.y0, done.y), Math.max(done.x0, done.x), Math.max(done.y0, done.y)];
  const inside = (o) => o.x >= x0 && o.y >= y0 && o.x + o.w <= x1 && o.y + o.h <= y1;
  const found = [...s.parts.filter(inside).map((p) => ({ k: 'p', id: p.id, o: p })), ...s.callouts.filter(inside).map((c) => ({ k: 'c', id: c.id, o: c }))]
    .sort((a, b) => a.o.y - b.o.y || a.o.x - b.o.x).map(({ k, id }) => ({ k, id }));
  const base = done.additive ? done.base : [];
  setSelection([...base, ...found.filter((f) => !base.some((b) => b.k === f.k && b.id === f.id))]);
}

function selectAll() {
  const s = currentScreen();
  const parts = [...s.parts].sort((a, b) => a.y - b.y || a.x - b.x).map((p) => ({ k: 'p', id: p.id }));
  setSelection([...parts, ...s.callouts.map((c) => ({ k: 'c', id: c.id }))]);
}

// 吹き出しを選ぶ（null で選ぶのをやめる）
function selectCallout(id) {
  flushSideField();
  if (ui.calloutId === id) return;
  ui.calloutId = id;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}

function startCalloutDrag(ev, id, grip) {
  ev.preventDefault();
  selectCallout(id);

  if (active && active.closest && active.closest('#side-panel')) active.blur();
  const c = findCallout(currentScreen(), id);
  if (!c) return;
  drag = { kind: grip ? 'co-size' : 'co-move', grip, id, sx: ev.clientX, sy: ev.clientY, r0: { x: c.x, y: c.y, w: c.w, h: c.h }, rect: null };
  if (!grip) document.body.classList.add('moving');
}

// ドラッグ中は、その吹き出しの要素と線だけを描き直す（保存は放したとき）
function dragCallout(ev) {
  const s = currentScreen();
  const dx = (ev.clientX - drag.sx) / ui.zoom;
  const dy = (ev.clientY - drag.sy) / ui.zoom;
  const r0 = drag.r0;
  const rect = drag.kind === 'co-move' ? fitCallout({ ...r0, x: r0.x + dx, y: r0.y + dy }, s) : resizedCallout(r0, drag.grip, dx, dy, s);
  drag.rect = rect;
  const el = [...document.querySelectorAll('#stage .callout')].find((e) => e.dataset.calloutId === drag.id);
  if (el) Object.assign(el.style, { left: CALLOUT_ZONE + rect.x + 'px', top: CALLOUT_ZONE + rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });

}
function redrawCalloutLines(overrides) {
  const svg = $('#co-lines');
  if (svg) svg.outerHTML = calloutLinesSvg(currentScreen(), overrides);
  const h = $('#stage [data-co-handle]');
  if (h) h.style.display = 'none'; // 動かしている間は線の先の ○ を隠す（放すと描き直す）
}

// 線の先の ○ をドラッグして、部品に重ねたところでつなぐ
function startCalloutLink(ev, id) {
  ev.preventDefault();
  drag = { kind: 'co-link', id, target: undefined };
  document.body.classList.add('linking');
}
function dragCalloutLink(ev) {
  const s = currentScreen();
  const c = findCallout(s, drag.id);
  const zone = $('#co-zone');
  if (!c || !zone) return;
  const r = zone.getBoundingClientRect();
  const x = (ev.clientX - r.left) / ui.zoom - CALLOUT_ZONE;
  const y = (ev.clientY - r.top) / ui.zoom - CALLOUT_ZONE;
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const partEl = hit && hit.closest ? hit.closest('#stage .screen .part') : null;
  drag.target = partEl ? partEl.dataset.partId : null;
  redrawCalloutLines({ temp: { x1: c.x + c.w / 2, y1: c.y + c.h / 2, x2: x, y2: y } });
}

function placeCalloutAt(at, target) {
  const id = actions.addCallout(ui.designId, currentScreen().id, at, target);
  if (id) selectCallout(id);
}

// 部品を選んでいるときに部品の箱の「吹き出し」を押すと、その部品の右上につないで置く。選んでいないときは見えている所の真ん中に置く
function addCalloutByClick() {
  const s = currentScreen();
  const p = findPart(s, ui.partId);
  if (p) { placeCalloutAt({ x: p.x + p.w + 24, y: p.y - 96 }, p.id); return; }
  const wrap = $('#canvas-wrap');
  const scr = $('#stage .screen');
  if (!wrap || !scr) return;
  const wr = wrap.getBoundingClientRect();
  const sr = scr.getBoundingClientRect();
  placeCalloutAt({ x: (wr.left + wr.width / 2 - sr.left) / ui.zoom - 100, y: (wr.top + wr.height / 2 - sr.top) / ui.zoom - 40 }, null);
}

// 部品を選ぶ（null で選ぶのをやめる）。右の欄で打ちかけの文字は、前に選んでいた部品に保存してから切り替える
function selectPart(id) {
  flushSideField();
  if (id ? ui.partId === id : !ui.sel.length) return; // null のときは、吹き出しを選んでいても選ぶのをやめる
  ui.partId = id;
  ui.colId = null;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}

function startPartDrag(ev, partId, grip) {
  ev.preventDefault();
  selectPart(partId);
  // 右の欄の文字の欄にフォーカスが残っていると、Delete や矢印のキーがその欄に行くので外す
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
  const p = findPart(currentScreen(), partId);
  if (!p) return;
  drag = { kind: grip ? 'size' : 'move', grip, id: partId, sx: ev.clientX, sy: ev.clientY, r0: { x: p.x, y: p.y, w: p.w, h: p.h }, rect: null };
  if (!grip) document.body.classList.add('moving');
}

// 部品のドラッグ中は、その部品の要素だけを動かす（保存は放したとき）
function dragPart(ev) {
  const s = currentScreen();
  const dx = (ev.clientX - drag.sx) / ui.zoom;
  const dy = (ev.clientY - drag.sy) / ui.zoom;
  const r0 = drag.r0;
  const rect = drag.kind === 'move' ? fitRect({ ...r0, x: r0.x + dx, y: r0.y + dy }, s) : resizedRect(r0, drag.grip, dx, dy, s);
  drag.rect = rect;
  // id は読み込んだデータの値なので、セレクタに埋め込まずに dataset で探す
  const el = [...document.querySelectorAll('#stage .part')].find((e) => e.dataset.partId === drag.id);
  if (el) Object.assign(el.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
  if (s.callouts.some((c) => c.target === drag.id)) redrawCalloutLines({ ['p:' + drag.id]: rect });
}

// 部品の箱のボタンを押したときに、ドラッグで置くかもしれないので覚えておく（動かさずに放せば click で真ん中に置く）。
// itemId を渡したとき（部品の箱の「データベースの項目」の組）は、その項目を指す部品を置く
function startPlace(ev, type, itemId = null) {
  if (ev.button !== 0 || !paletteEntry(type)) return;
  ev.preventDefault();
  flushSideField();
  drag = { kind: 'place', type, itemId, sx: ev.clientX, sy: ev.clientY, moved: false, ghost: null };
}

const PLACE_GRAB = 8; // 置くときの影の左上から、マウスの位置までの幅（窓の上のドット）
function dragPlace(ev) {
  if (!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const t = paletteEntry(drag.type);
  if (!drag.ghost) {
    drag.moved = true;
    drag.ghost = document.createElement('div');
    drag.ghost.className = 'place-ghost';
    const item = drag.itemId ? findItem(currentDesign(), drag.itemId) : null;
    drag.ghost.textContent = item ? `${item.name}（${t.name}）` : t.name;
    drag.ghost.style.width = t.w * ui.zoom + 'px';
    drag.ghost.style.height = t.h * ui.zoom + 'px';
    document.body.appendChild(drag.ghost);
    document.body.classList.add('placing');
  }
  drag.ghost.style.left = ev.clientX - PLACE_GRAB + 'px';
  drag.ghost.style.top = ev.clientY - PLACE_GRAB + 'px';
}

// 画面の上で放したら、そこに置く。画面の外で放したら置かない
function dropPlace(done, ev) {
  done.ghost.remove();
  document.body.classList.remove('placing');
  // ドラッグを部品の箱の上で放すと click が起きて真ん中に置かれてしまうので、すぐ後の click を 1 回だけ止める
  const stop = (e) => { e.stopPropagation(); e.preventDefault(); };
  document.addEventListener('click', stop, true);
  setTimeout(() => document.removeEventListener('click', stop, true), 0);
  // 放した所に見えているのが画面のときだけ置く。画面の矩形だけで見ると、右の欄・メニューバーの裏に隠れた部分
  // （スクロールで見えない所）で放しても置いてしまうため。影（.place-ghost）は消してあるので邪魔にならない
  const scr = $('#stage .screen');
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const zone = $('#co-zone');
  if (done.type === 'callout') {
    if (!scr || !hit || !zone || !zone.contains(hit)) return;
    const r = scr.getBoundingClientRect();
    const x = (ev.clientX - r.left) / ui.zoom;
    const y = (ev.clientY - r.top) / ui.zoom;
    const partEl = hit.closest('#stage .screen .part');
    // 部品の上に落としたときは、部品と重ならないように右上へずらして置き、その部品につなぐ
    if (partEl) placeCalloutAt({ x: x + 40, y: y - 120 }, partEl.dataset.partId);
    else placeCalloutAt({ x: x - PLACE_GRAB / ui.zoom, y: y - PLACE_GRAB / ui.zoom }, null);
    return;
  }
  if (!scr || !hit || !scr.contains(hit)) return;
  const r = scr.getBoundingClientRect();
  const at = { x: (ev.clientX - PLACE_GRAB - r.left) / ui.zoom, y: (ev.clientY - PLACE_GRAB - r.top) / ui.zoom };
  addPartAt(done.type, at, done.itemId);
}

function addPartAt(type, at, itemId = null) {
  const sid = currentScreen().id;
  const id = itemId ? actions.addItemPart(ui.designId, sid, itemId, at) : actions.addPart(ui.designId, sid, type, at);
  if (id) selectPart(id);
}

// 部品の箱のボタンを押しただけのときは、窓に見えている画面の真ん中に置く
function addPartAtCenter(type, itemId = null) {
  if (type === 'callout') { addCalloutByClick(); return; }
  const t = partType(type);
  const wrap = $('#canvas-wrap');
  const scr = $('#stage .screen');
  if (!t || !wrap || !scr) return;
  const wr = wrap.getBoundingClientRect();
  const sr = scr.getBoundingClientRect();
  const cx = (wr.left + wr.width / 2 - sr.left) / ui.zoom;
  const cy = (wr.top + wr.height / 2 - sr.top) / ui.zoom;
  addPartAt(type, { x: cx - t.w / 2, y: cy - t.h / 2 }, itemId);
}

// ── データベースの項目の一覧表の操作 ──
// 真ん中を項目の一覧表にする（選んでいた部品は選ぶのをやめる）
function openItemsPanel() {
  flushSideField();

}
function openMapPanel() {

}

function selectItem(id) {

}

function addItemOfType(type) {

}

// ほかのモックから項目を取り込む窓（画像 q21）。左で元のモック（ごみ箱にない、ほかの画面設計）を選び、右で項目に印を付ける
async function openImportDialog() {
  const d = currentDesign();
  const sources = visibleDesigns(store.state).filter((x) => x.id !== d.id);
  let srcId = (sources.find((x) => x.items.length) || sources[0] || {}).id || null;
  let query = '';
  const checked = new Set();
  const stateLabel = { own: '<span class="tag done">このモックの項目</span>', done: '<span class="tag done">取り込み済み</span>', same: '<span class="tag warn">同じ名前の項目があります</span>',
    status: '<span class="tag done">ステータスはこのモックにもうあります</span>' };
  const leftHtml = () => {
    const q = cleanName(query).toLowerCase();
    const list = sources.filter((x) => !q || x.name.toLowerCase().includes(q));
    if (!list.length) return `<p class="imp-empty">${sources.length ? '名前に合う画面設計はありません。' : 'ほかの画面設計がありません。'}</p>`;
    return list.map((x) => `
      <button type="button" class="imp-design${x.id === srcId ? ' on' : ''}" data-imp-src="${esc(x.id)}">
        ${thumbHtml(x, x.screens[0], 62, 40)}
        <span><span class="nm">${esc(x.name)}</span><span class="mt">${targetChip(x.target)}項目 ${x.items.length} 個・${esc(fmtDateTime(x.updatedAt).slice(5, 10).replace('-', '/'))} 更新</span></span>
      </button>`).join('');
  };
  const rightHtml = () => {
    const src = findDesign(store.state, srcId);
    if (!src) return '<p class="imp-empty">左で、取り込む元のモックを選びます。</p>';
    if (!src.items.length) return `<p class="imp-empty">「${esc(src.name)}」には、まだ項目がありません。</p>`;
    return `<table><thead><tr><th></th><th>項目名</th><th>部品の種類</th><th>設定</th></tr></thead><tbody>${src.items.map((it) => {
      const st = importState(d, src, it);
      const dis = IMPORT_BLOCKED.includes(st);
      return `<tr${dis ? ' class="dis"' : ''}><td class="ck"><input type="checkbox" data-imp-item="${esc(it.id)}" aria-label="「${esc(it.name)}」を取り込む"${dis || checked.has(it.id) ? ' checked' : ''}${dis ? ' disabled' : ''}></td>
        <td>${esc(it.name)} ${stateLabel[st] || ''}</td><td>${esc(itemTypeName(it.type))}</td><td class="set">${esc(isItemType(it.type) ? describeItem(it, { design: src, state: store.state }) : '')}</td></tr>`;
    }).join('')}</tbody></table>`;
  };
  const footText = () => {
    const src = findDesign(store.state, srcId);
    return src && checked.size ? `「${esc(src.name)}」から、新しく <b>${checked.size} 個</b>の項目を、データベースの項目の一覧表に取り込みます。` : '取り込む項目に印を付けてください。';
  };
  return showDialog({
    title: 'ほかのモックから項目を取り込む',
    okLabel: '取り込む',
    wide: true,
    body: `
      <p class="hint" style="margin-bottom:10px">取り込んだ項目は、元のモックとつながったままになります。元のモックで項目を直すと、この画面設計の項目も同じように変わります（ここでは直せません）。</p>
      <div class="imp">
        <div class="imp-left"><div class="imp-head">1. 取り込む元のモックを選ぶ</div>
          <label class="imp-search"><input type="search" data-imp-search placeholder="名前で探す" aria-label="名前で探す"></label>
          <div class="imp-list" data-imp-left>${leftHtml()}</div></div>
        <div class="imp-right"><div class="imp-head">2. 取り込む項目に印を付ける<span class="spacer"></span><button type="button" class="link-btn" data-imp-all>すべて選ぶ</button></div>
          <div class="imp-items" data-imp-right>${rightHtml()}</div></div>
      </div>
      <p class="imp-foot" data-imp-foot>${footText()}</p>`,
    init: (m) => {
      const redraw = () => {
        $('[data-imp-left]', m).innerHTML = leftHtml();
        $('[data-imp-right]', m).innerHTML = rightHtml();
        $('[data-imp-foot]', m).innerHTML = footText();
      };
      m.addEventListener('click', (e) => {
        const b = e.target.closest('[data-imp-src]');
        if (b && b.dataset.impSrc !== srcId) { srcId = b.dataset.impSrc; checked.clear(); redraw(); return; }
        if (e.target.closest('[data-imp-all]')) {
          const src = findDesign(store.state, srcId);
          if (src) src.items.forEach((it) => { if (!IMPORT_BLOCKED.includes(importState(d, src, it))) checked.add(it.id); });
          redraw();
        }
      });
      m.addEventListener('change', (e) => {
        const c = e.target.closest('[data-imp-item]');
        if (!c) return;
        if (c.checked) checked.add(c.dataset.impItem); else checked.delete(c.dataset.impItem);
        $('[data-imp-foot]', m).innerHTML = footText();
      });
      m.addEventListener('input', (e) => {
        if (!e.target.matches('[data-imp-search]')) return;
        query = e.target.value;
        $('[data-imp-left]', m).innerHTML = leftHtml();
      });
    },
    collect: () => (srcId && checked.size ? { srcId, ids: [...checked] } : { error: '取り込む項目に印を付けてください。' }),
  }).then((r) => {
    if (!r) return;
    const src = findDesign(store.state, r.srcId);
    Object.assign(ui, { panel: 'items', partId: null, addItemMenu: false });
    const n = actions.importItems(d.id, r.srcId, r.ids);
    if (n) toast(`「${src.name}」から ${n} 個の項目を取り込みました。`);
    updateEditor();
  });
}

// 取り込んだ項目の元のモックを開き、データベースの項目の一覧表でその項目を選ぶ
function openLinkSource(itemId) {
  const it = findItem(currentDesign(), itemId);
  const src = it && it.link ? findDesign(store.state, it.link.designId) : null;
  if (!src || src.trashedAt) { toast('元のモックが見つかりません（ごみ箱にあるか、完全に削除されています）。'); return; }
  flushSideField();
  openDesign(src.id);
  Object.assign(ui, { panel: 'items', itemId: findItem(src, it.link.itemId) ? it.link.itemId : null });

}

// 項目を消す。画面に置いてあるときは、部品が残って固定されることを確かめてから消す
async function deleteItemWithConfirm(itemId) {
  const d = currentDesign();
  const item = findItem(d, itemId);
  if (!item) return;
  const scr = screensWithItem(d, itemId).map((s) => s.name);

    const ok = await showDialog({
      title: '項目を消す',

        <p class="warn">${esc(scr.join('・'))}の画面にある部品は残り、消したときの項目名と設定で固定されます（部品の設定の欄の「項目の一覧表に戻す」で戻せます）。</p>`,
    });
