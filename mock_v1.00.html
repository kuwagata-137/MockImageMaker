<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モックイメージメーカー</title>
<style>
/* ── 全体 ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Segoe UI','Yu Gothic UI','Meiryo',sans-serif;background:#f1f5f9;color:#1e293b;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:13px;color:#1e293b}
.spacer{flex:1}

/* 保存を止めているときの帯・お知らせ */
#banner{background:#fef2f2;color:#991b1b;border-bottom:1px solid #fecaca;padding:8px 16px;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#f8fafc;padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:50;max-width:80vw}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:#f1f5f9}
.btn.primary{background:#1d3f6e;border-color:#1d3f6e;color:#fff;font-weight:600}
.btn.primary:hover{background:#25528f}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
.btn.danger:hover{background:#b91c1c}
.btn.small{padding:4px 10px;font-size:12px}
.btn.small.danger-text{color:#dc2626}
.btn:disabled{opacity:.45;cursor:default}

/* 上の細い帯（アプリ名） */
.brandbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #e2e8f0;padding:6px 16px;min-height:38px;flex-shrink:0}
.brand{font-weight:700;font-size:13px;color:#0f172a}
.brand-ver{font-size:11px;color:#94a3b8}
.brand-design{font-size:13px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 作る先の印 */
.chip{display:inline-block;padding:1px 9px;border:1px solid #cbd5e1;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;white-space:nowrap}
.chip.t-kintone{background:#fff7e6;border-color:#f5c26b;color:#a15c00}
.chip.t-salesforce{background:#e8f4fd;border-color:#7cc0f0;color:#0b6fb3}
.chip.t-claude{background:#f3edff;border-color:#c4a8f5;color:#6d3fc9}

/* ── 最初の画面（画面設計の一覧）─────────────────────── */
.home-scroll{flex:1;overflow:auto}
.home{max-width:1120px;margin:0 auto;padding:22px 24px 40px}
.home-head{display:flex;align-items:center;gap:10px}
.home-head h1{font-size:22px;font-weight:700;color:#0f172a}
.search{display:flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 10px;width:240px}
.search input{border:none;outline:none;padding:7px 0;width:100%;background:transparent}
.search:focus-within{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.home-note{color:#64748b;font-size:12px;margin:8px 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.empty{color:#64748b;padding:32px 4px;font-size:14px}
.card{position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:visible}
.card:hover{border-color:#94a3b8;box-shadow:0 2px 10px rgba(15,23,42,.08)}
.card-open{display:block;width:100%;border:none;background:none;text-align:left;cursor:pointer;border-radius:10px}
.card-thumb{height:160px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.card-body{padding:12px 16px 14px}
.card-name{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:24px}
.card-meta{display:flex;align-items:center;gap:6px;color:#64748b;font-size:12px;margin-bottom:4px}
.card-date{color:#64748b;font-size:12px}
.card-more{position:absolute;right:10px;bottom:10px;width:30px;height:26px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;color:#64748b;font-size:16px;line-height:1}
.card-more:hover{background:#f1f5f9;border-color:#cbd5e1}
.card-menu{position:absolute;right:10px;bottom:40px;z-index:10;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:4px;min-width:170px;display:flex;flex-direction:column}
.card-menu button{border:none;background:none;text-align:left;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.card-menu button:hover{background:#f1f5f9}
.card-menu button.danger{color:#dc2626}
.trash{margin-top:28px;border-top:1px solid #e2e8f0;padding-top:14px}
.trash-toggle{border:none;background:none;cursor:pointer;color:#475569;font-size:13px;font-weight:600;padding:4px 2px}
.trash-list{margin-top:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:6px 14px}
.trash-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.trash-row:last-of-type{border-bottom:none}
.trash-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-date{color:#64748b;font-size:12px;margin-left:auto;white-space:nowrap}
.trash-empty,.trash-note{color:#64748b;font-size:12px;padding:8px 0}

/* 縮小画像（画面を同じ HTML で描いて縮める） */
.thumb{position:relative;overflow:hidden;background:#fff;border:1px solid #cbd5e1;flex-shrink:0}
.thumb-scale{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

/* ── 小さな窓（名前を聞く・確かめる）────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.35);width:min(440px,calc(100vw - 32px));padding:20px 22px 18px}
.modal.wide{width:min(920px,calc(100vw - 32px))}
/* ほかのモックから項目を取り込む窓（画像 q21） */
.imp{display:flex;gap:14px;height:min(380px,calc(100vh - 260px))}
.imp-left{width:320px;flex-shrink:0;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;min-height:0}
.imp-right{flex:1;min-width:0;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;min-height:0}
.imp-head{padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#334155;display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:8px 8px 0 0}
.imp-head .spacer{flex:1}
.imp-search{margin:8px 10px}
.imp-search input{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:5px 8px}
.imp-list{overflow:auto;padding:0 6px 6px;min-height:0}
.imp-design{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;margin-bottom:3px}
.imp-design:hover{background:#f8fafc}
.imp-design.on{background:#eff6ff;border-color:#93c5fd}
.imp-design .nm{font-weight:700;font-size:13px}
.imp-design .mt{font-size:11px;color:#64748b;display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.imp-items{overflow:auto;min-height:0}
.imp-items table{border-collapse:collapse;width:100%;font-size:12.5px}
.imp-items th,.imp-items td{border-bottom:1px solid #e2e8f0;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.5}
.imp-items th{background:#f8fafc;color:#475569;font-size:11.5px;position:sticky;top:0}
.imp-items td.ck{width:32px;text-align:center}
.imp-items tr.dis td{color:#94a3b8}
.imp-items td.set{white-space:pre-line}
.imp-items td:nth-child(3){white-space:nowrap}
.imp-empty{color:#64748b;font-size:12.5px;padding:14px;line-height:1.6}
.imp-foot{font-size:12.5px;color:#334155;margin-top:12px}
.tag.warn{background:#fff7ed;color:#9a3412;border:1px solid #fdba74;font-weight:400}
.tag.done{background:#dcfce7;color:#166534;border:1px solid #86efac;font-weight:400}
.link-btn{border:none;background:none;color:#2563eb;cursor:pointer;font-size:12px;padding:0}
.modal h2{font-size:16px;margin-bottom:14px;color:#0f172a}
.modal p{font-size:13px;line-height:1.6}
.modal .warn{color:#b91c1c;margin-top:6px}
.modal-error{color:#dc2626;font-size:12px;margin-top:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span:first-child{font-size:12px;color:#475569;font-weight:600}
.field input[type=text],.field textarea,.target-picker select,.target-picker input{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;background:#fff}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field input:focus,.field textarea:focus,.target-picker select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.target-picker{display:flex;flex-direction:column;gap:6px}
.hint{color:#64748b;font-size:12px;line-height:1.5}

/* ── 編集の画面 ─────────────────────────────────────── */
/* メニューバー（ビジネスダイアグラムメーカーの .rgroup などから写した） */
#toolbar{background:#f8fafc;color:#334155;padding:4px 8px 0;display:flex;flex-shrink:0;border-bottom:1px solid #cbd5e1;box-shadow:0 1px 4px rgba(15,23,42,.12);position:relative;z-index:2;overflow-x:auto}
.rgroup{display:flex;flex-direction:column;flex:0 0 auto;padding:0 7px 0 4px;border-right:1px solid #e2e8f0;margin-right:3px}
.gbody{flex:1;display:flex;align-items:flex-start;gap:2px;padding:2px 2px 0}
.glabel{text-align:center;font-size:10px;color:#64748b;padding:3px 2px 4px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.stack .tbtn{display:flex;align-items:center;gap:5px;text-align:left}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:5px 7px 4px;border-radius:5px;border:1px solid transparent;background:transparent;color:#334155;font-size:11px;line-height:1.25;cursor:pointer}
.bigbtn .ico{font-size:20px;line-height:1}
.bigbtn:hover{background:#e2e8f0;color:#0f172a}
.bigbtn.on{background:#2563eb;color:#fff;border-color:#3b82f6}
.tbtn{background:transparent;border:1px solid transparent;color:#334155;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;white-space:nowrap}
.tbtn:hover{background:#e2e8f0;color:#0f172a}
.tbtn:disabled{opacity:.4;cursor:default;background:transparent}
.bigbtn:disabled{opacity:.4;cursor:default}
.zoom-label{min-width:52px;color:#475569;align-self:center}

.editor-body{flex:1;min-height:0;display:flex}
.screen-list{width:176px;flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;overflow-y:auto;padding:12px 12px 20px}
.panel-title{font-size:12px;font-weight:700;color:#334155;margin-bottom:10px}
.sl-item{display:block;width:100%;border:none;background:none;text-align:left;cursor:pointer;margin-bottom:12px;padding:0}
.sl-thumb{display:flex;justify-content:center;padding:6px;border:2px solid transparent;border-radius:6px;background:#f8fafc}
.sl-item.active .sl-thumb{border-color:#2563eb}
.sl-item:hover .sl-thumb{background:#eef2f7}
.sl-name{font-size:12px;color:#475569;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-item.active .sl-name{color:#1d4ed8;font-weight:600}
/* 左の一覧のいちばん上の「データベースの項目」（画像 q19 の案A） */
.db-entry{display:flex;align-items:center;gap:8px;width:100%;border:2px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#f8fafc;cursor:pointer;text-align:left}
.db-entry:hover{background:#eef2f7}
.db-entry .ic{font-size:18px;color:#1d3f6e;line-height:1}
.db-entry b{display:block;font-size:12.5px;color:#0f172a}
.db-entry small{display:block;color:#64748b;font-size:11px}
.db-entry.active{border-color:#2563eb;background:#eff6ff}
.db-entry.active b{color:#1d4ed8}
.sl-sep{border-top:1px solid #e2e8f0;margin:6px 0 10px}

.canvas-area{flex:1;min-width:0;position:relative;background:#e2e8f0}
#canvas-wrap{position:absolute;inset:0;overflow:auto}
#canvas-wrap.hand{cursor:grab}
#canvas-wrap.grabbing{cursor:grabbing}
#zoom-spacer{position:absolute;left:0;top:0;pointer-events:none}
#stage{position:absolute;left:0;top:0;padding:48px;transform-origin:0 0}
.zoom-badge{position:absolute;right:16px;bottom:14px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:2px 12px;font-size:12px;color:#475569;pointer-events:none}

/* 画面（描いた業務アプリの画面）。中身は HTML の要素で描く */
.screen-frame{position:relative}
.screen{position:relative;background:#fff;box-shadow:0 1px 6px rgba(15,23,42,.22);overflow:hidden}
.screen.grid{background-image:linear-gradient(to right,rgba(148,163,184,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.22) 1px,transparent 1px);background-size:8px 8px}
.screen-band{height:40px;background:#1f2f4f;color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 部品（画面の中。見た目は画像 q15・仕上がりイメージ.png に合わせた） */
.part{position:absolute;display:flex;flex-direction:column;font-size:14px;color:#1e293b;line-height:1.4}
.part.lab-left{flex-direction:row;gap:8px}
.plabel{display:flex;align-items:center;gap:6px;height:24px;flex-shrink:0;color:#334155;white-space:nowrap;overflow:hidden}
.lab-left .plabel{width:112px;height:36px}
.plabel-text{overflow:hidden;text-overflow:ellipsis}
.pno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;line-height:1;flex-shrink:0}
.pno-out{position:absolute;left:-28px;top:50%;transform:translateY(-50%)}
.pno-corner{position:absolute;left:-4px;top:-8px;z-index:1;box-shadow:0 0 0 2px #fff}
.preq{color:#dc2626;font-weight:700}
.pbox{margin-top:4px;flex:1;min-height:0;min-width:0;border:1px solid #94a3b8;border-radius:4px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#fff;overflow:hidden;white-space:nowrap}
.pbox.area{align-items:flex-start;padding-top:8px;white-space:pre-wrap}
.pbox.calc{background:#f1f5f9;border-style:dashed}
.pval{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbox .pr{margin-left:auto;color:#475569;font-size:13px;flex-shrink:0}
.pph{color:#94a3b8}
.picon{flex-shrink:0}
.popts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;align-content:flex-start;overflow:hidden;min-width:0}
.popts.v{flex-direction:column;flex-wrap:nowrap}
.popt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pmark{width:15px;height:15px;border:1.5px solid #64748b;flex-shrink:0;position:relative}
.pmark.rd{border-radius:50%}
.pmark.ck{border-radius:3px}
.pmark.rd.on::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:#2563eb}
.pmark.ck.on{background:#2563eb;border-color:#2563eb}
.pmark.ck.on::after{content:'✓';position:absolute;left:1.5px;top:-3px;color:#fff;font-size:11px;font-weight:700}
.pdrop{margin-top:4px;flex:1;min-height:0;min-width:0;border:1.5px dashed #94a3b8;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:#64748b;font-size:13px;background:#f8fafc;overflow:hidden;white-space:nowrap}
.pdrop u{color:#2563eb;text-decoration:none;border:1px solid #93c5fd;border-radius:4px;padding:2px 8px;background:#fff}
.lab-left .pbox,.lab-left .popts,.lab-left .pdrop{margin-top:0}
.lab-left .popts{min-height:36px;align-items:center}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:15px;white-space:nowrap;overflow:hidden}
.pbtn.primary{background:#2563eb;color:#fff;font-weight:600}
.pbtn.normal{background:#fff;border:1px solid #64748b;color:#334155}
.phead{flex:1;display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:#0f172a;border-left:4px solid #1d3f6e;padding-left:8px;overflow:hidden;white-space:nowrap}
.pdesc{flex:1;display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap;overflow:hidden}
.pline{flex:1;display:flex;align-items:center;gap:6px}
.pline i{flex:1;height:1px;background:#94a3b8}
.punknown{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed #94a3b8;color:#64748b;font-size:12px;background:#f8fafc;overflow:hidden}
/* 選んだ部品の印と、縁のつまみ（編集の画面だけ） */
.part.sel{outline:2px solid #2563eb;outline-offset:1px;z-index:1}
.grip{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #2563eb;border-radius:2px;z-index:2}
.g-nw{left:-6px;top:-6px;cursor:nwse-resize}.g-n{left:calc(50% - 5px);top:-6px;cursor:ns-resize}.g-ne{right:-6px;top:-6px;cursor:nesw-resize}
.g-e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}.g-se{right:-6px;bottom:-6px;cursor:nwse-resize}.g-s{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
.g-sw{left:-6px;bottom:-6px;cursor:nesw-resize}.g-w{left:-6px;top:calc(50% - 5px);cursor:ew-resize}
#stage .screen .part{cursor:move}
#canvas-wrap.hand #stage .screen .part{cursor:inherit}
body.moving,body.moving *{cursor:move!important}
body.placing,body.placing *{cursor:copy!important}
.place-ghost{position:fixed;z-index:30;pointer-events:none;border:2px dashed #2563eb;background:rgba(37,99,235,.08);border-radius:4px;color:#1d4ed8;font-size:12px;font-weight:600;padding:4px 6px;white-space:nowrap;overflow:hidden}

/* 部品の設定の一覧表（画面の右か下。見た目は画像 q18） */
.stage-row{display:flex;gap:32px;align-items:flex-start}
.stage-row.bottom{flex-direction:column}
.ptable{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:16px 18px 18px;flex-shrink:0;font-size:14px;color:#1e293b}
.ptable h3{font-size:16px;color:#0f172a;margin-bottom:10px}
.ptable table{border-collapse:collapse;width:100%}
.ptable th,.ptable td{border:1px solid #cbd5e1;padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}
.ptable th{background:#eef2f7;color:#334155;font-size:13px}
.ptable .c-no{text-align:center;width:56px}
.ptable .c-label{width:116px}
.ptable .c-kind{width:148px}
.ptable .c-set{white-space:pre-line}
.ptable tr[data-action]{cursor:pointer}
.ptable tr[data-action]:hover td{background:#f8fafc}
.ptable tr.sel td{background:#eff6ff}
.ptable-empty{color:#64748b;font-size:13px;line-height:1.7;border:1px dashed #94a3b8;border-radius:6px;padding:14px;background:#f8fafc}
.screen-resize{position:absolute;left:0;right:0;bottom:22px;height:14px;transform:translateY(50%);cursor:ns-resize;display:flex;align-items:center;justify-content:center}
.screen-resize span{width:56px;height:6px;border-radius:3px;background:#94a3b8;opacity:.75}
.screen-resize:hover span{background:#2563eb;opacity:1}
.screen-size{height:24px;line-height:24px;font-size:12px;color:#64748b;text-align:center;white-space:nowrap}
body.resizing,body.resizing *{cursor:ns-resize!important}

/* 右の欄: 上に部品の箱、下に選んだ部品の設定。設定の欄にはいつも 340 ドットを残し、
   部品の箱がそれより伸びるときは部品の箱の中をスクロールする（画像 q14b） */
.side-panel{width:288px;flex-shrink:0;background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:0}

.side-panel section+section{margin-top:10px;padding-top:14px;border-top:1px solid #e2e8f0}
.panel-title small{font-weight:400;color:#64748b}
.pal-group{border:1px solid #e2e8f0;border-radius:6px;margin-bottom:5px}

.field input[type=number],.field input[type=date],.field select{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;background:#fff}

.pf-sep{border-top:1px dashed #cbd5e1;margin:12px 0 10px;position:relative}

.seg{display:flex;gap:6px}

/* ── データベースの項目の一覧表（真ん中。画像 q19）── */
.db-view{position:absolute;inset:0;overflow:auto;padding:22px 26px 40px}
.itable{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:16px 18px 18px;max-width:1240px;position:relative}
.itable-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}

.itable-empty{color:#64748b;font-size:13px;line-height:1.7;border:1px dashed #94a3b8;border-radius:6px;padding:14px;background:#f8fafc}

body.sorting,body.sorting *{cursor:grabbing!important}
/* 部品や項目に付ける小さな札（編集の画面だけ。ルックアップの札は書き出しにも出す） */
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap;line-height:1.6;vertical-align:middle}
.tag.link{background:#dcfce7;color:#166534;border:1px solid #86efac}
.tag.lost,.tag.gone{background:#f1f5f9;color:#475569;border:1px solid #94a3b8}
/* 部品の箱のいちばん上の「データベースの項目」の組 */
.pal-group.items{border-color:#93c5fd}
.pal-group.items .pal-head{background:#eff6ff;color:#1d4ed8}
.pal-items{display:flex;flex-direction:column;gap:3px;padding:5px}
.pal-item{display:flex;align-items:center;gap:6px;border:1px solid #bfdbfe;border-radius:6px;background:#fff;padding:5px 8px;font-size:12px;cursor:grab;text-align:left;min-width:0}
.pal-item i{font-style:normal;color:#1d3f6e;width:16px;text-align:center;flex-shrink:0}
.pal-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal-item small{margin-left:auto;color:#64748b;font-size:10.5px;white-space:nowrap;flex-shrink:0}

.pal-empty{color:#64748b;font-size:11.5px;padding:6px 8px;line-height:1.5}
/* 選んだ部品の設定の欄の 2 つの枠（画像 q20）: 紺＝項目の設定、灰＝この画面だけの設定 */
.pf-sec{margin:0 0 10px;padding:0;border:0;min-width:0}
.pf-sec-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 9px;border-radius:7px 7px 0 0}

.pf-sec-body{padding:10px 10px 4px;border:1px solid;border-top:none;border-radius:0 0 7px 7px}
.pf-sec.item .pf-sec-head{background:#1d3f6e;color:#fff}
.pf-sec.item .pf-sec-head small{color:#cbd5e1}
.pf-sec.item .pf-sec-body{border-color:#1d3f6e}
.pf-sec.here .pf-sec-head{background:#e2e8f0;color:#334155}
.pf-sec.here .pf-sec-head small{color:#64748b}
.pf-sec.here .pf-sec-body{border-color:#cbd5e1}
.pf-sec.locked .pf-sec-head{background:#64748b;color:#fff}

.pf-sec.locked input,.pf-sec.locked textarea,.pf-sec.locked select{background:#f1f5f9;color:#64748b;border-style:dashed}
.pf-used{font-size:11.5px;color:#475569;margin-bottom:8px;line-height:1.5}
.pf-used b{color:#1d3f6e}
.pf-banner{border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.55;margin-bottom:10px}
.pf-banner .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pf-banner.link{background:#f0fdf4;border:1px solid #86efac;color:#14532d}
.pf-banner.gone{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12}
.pf-note{font-size:11px;color:#64748b;text-align:right;margin-top:3px}

<body>
<div id="banner" hidden></div>
<div id="app"></div>
<div id="dialog-root"></div>
<div id="toast" hidden></div>
<script>
'use strict';
// =============================================================================
// モックイメージメーカー（アプリの画面）
// 目次
//   1. 版
//   2. データの形（純関数）  … 画面設計・画面・部品の作り方、番号、一覧表の「設定」の文、読み込んだデータを今の形に直す migrate()
//   3. 保存                  … LocalStorageAdapter（ブラウザ）・FileAdapter（Electron）・BlockedAdapter（保存を止める）
//   4. 元に戻す              … Store（commit・undo・redo・persist・subscribe）と、画面設計・画面・部品の操作（actions）
//   5. 共通の部品            … 文字の置き換え・日時・お知らせ・小さな窓・作る先の選び方・画面と部品の描き方・一覧表・縮小画像
//   6. 一覧の画面            … カード・名前で探す・新規作成・名前の変更・複製・ごみ箱
//   7. 編集の画面            … メニューバー・画面の一覧・画面（帯・マス目・高さ）・部品の箱・設定の欄・拡大縮小・ハンド・
//                              部品のドラッグ（置く・動かす・大きさ）・コピーと貼り付け
//   8. 命令（runCommand）    … ボタン・キー・アプリのメニューからの命令を 1 か所で受ける
//   9. 起動
//  10. テスト用の窓口（window.__test__。テストのときだけ埋まる）
// 手本: 保存と元に戻すと一覧の画面は CheckListMaker の index.html、
//       拡大縮小とハンドとメニューバーの見た目はビジネスダイアグラムメーカー（参考/diagram_v8.31.html）から写した。
// =============================================================================

// ── 1. 版 ─────────────────────────────────────────────────────────────────────
const APP_VERSION = '1.00';

// ── 2. データの形（純関数）────────────────────────────────────────────────────
// { schemaVersion, settings: { customTargets }, designs: [ { id, name, target, description,
//   createdAt, updatedAt, trashedAt, revisions, items, screens: [ { id, name, device, width, height,
//   showHeader, tablePos, parts, callouts } ] } ] }
// items（データベースの項目の一覧表）と parts の 1 つずつの形は、下の「項目」「部品」に書いた。callouts（吹き出し）は第 3 段階の後半で使う。
// 倍率・モード・開いている画面・選んでいる部品・コピーした部品は保存しない（下の ui に持つ）。
// データの形の版: 1＝部品が項目名と設定を持つ（第 3 段階の前半まで）。2＝項目は画面設計の items に持ち、入力欄の部品は itemId で項目を指す。
const SCHEMA_VERSION = 2;
const STORAGE_KEY = 'mockimagemaker.v1';
const HISTORY_LIMIT = 50;
const GRID = 8;
const NAME_MAX = 100;
const TARGET_MAX = 60;
const DEVICES = {
  pc: { label: 'パソコン', width: 1280, height: 800 },
  tablet: { label: 'タブレット', width: 768, height: 1024 },
  phone: { label: 'スマホ', width: 375, height: 667 },
};
const BUILTIN_TARGETS = [
  { id: 'kintone', label: 'kintone' },
  { id: 'salesforce', label: 'Salesforce' },
  { id: 'claude', label: 'Claude で作るアプリ' },
];
const FIRST_SCREEN_NAME = '画面 1';

const clone = (obj) => JSON.parse(JSON.stringify(obj));
const nowIso = () => new Date().toISOString();
const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const str = (v) => (typeof v === 'string' ? v : '');

function newId(prefix) {
  const c = window.crypto;
  if (c && typeof c.randomUUID === 'function') return prefix + '-' + c.randomUUID();
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// 名前の前後の空白を取り、続く空白を 1 つにする。長すぎる名前は切る
function cleanName(s, max = NAME_MAX) {
  return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').slice(0, max);
}

function createInitialState() {
  return { schemaVersion: SCHEMA_VERSION, settings: { customTargets: [] }, designs: [] };
}

function createScreenData(name, device = 'pc') {
  const d = DEVICES[device];
  return { id: newId('s'), name, device, width: d.width, height: d.height, showHeader: true, tablePos: 'right', parts: [], callouts: [] };
}

function createDesignData(name, target, now = nowIso()) {
  return {
    id: newId('d'), name, target, description: '', createdAt: now, updatedAt: now,
    trashedAt: null, revisions: [], items: [], screens: [createScreenData(FIRST_SCREEN_NAME)],
  };
}

// 高さは、機器の 1 画面分から 8 ドットずつ伸ばせる（1 画面分より低くはできない）
function snapHeight(h, device) {
  const min = DEVICES[device].height;
  const extra = Math.round((Number(h) - min) / GRID) * GRID;
  return min + Math.max(0, extra || 0);
}

// 機器の種類を変えると、幅はその機器の幅になる。下へ伸ばした分は、新しい機器の 1 画面分に足す
function changeDevice(screen, device) {
  const extra = Math.max(0, screen.height - DEVICES[screen.device].height);
  return { ...screen, device, width: DEVICES[device].width, height: snapHeight(DEVICES[device].height + extra, device) };
}

function builtinTarget(id) {
  return BUILTIN_TARGETS.find((t) => t.id === id) || null;
}
function targetLabel(target) {
  const b = builtinTarget(target);
  return b ? b.label : target || '作る先なし';
}
// 「その他」に書いた名前。kintone などと同じ名前なら、そちらを選んだことにする
function resolveTargetName(text) {
  const s = cleanName(text, TARGET_MAX);
  const low = s.toLowerCase();
  const b = BUILTIN_TARGETS.find((t) => t.label.toLowerCase() === low || t.id === low);
  return b ? b.id : s;
}
function addCustomTarget(state, target) {
  if (!target || builtinTarget(target)) return;
  if (!state.settings.customTargets.includes(target)) state.settings.customTargets.push(target);
}

const byNewest = (key) => (a, b) => String(b[key] || '').localeCompare(String(a[key] || ''));
// 一覧に出す画面設計（ごみ箱のものを除く・名前で探す・更新の新しい順）
function visibleDesigns(state, query = '') {
  const q = cleanName(query).toLowerCase();
  return state.designs
    .filter((d) => !d.trashedAt && (!q || d.name.toLowerCase().includes(q)))
    .sort(byNewest('updatedAt'));
}
function trashedDesigns(state) {
  return state.designs.filter((d) => d.trashedAt).sort(byNewest('trashedAt'));
}

function duplicateDesignData(d, now = nowIso()) {
  const copy = clone(d);
  copy.id = newId('d');
  copy.name = cleanName(d.name + ' のコピー');
  copy.createdAt = now;
  copy.updatedAt = now;
  copy.trashedAt = null;
  // 項目の id は画面設計の中だけで重ならなければよいので、そのまま写す（部品・ルックアップが指す id を付け直さなくて済むため）
  copy.screens.forEach((s) => {
    s.id = newId('s');
    s.parts.forEach((p) => { p.id = newId('p'); });
  });
  return copy;
}

// ── 項目と部品 ──
// 項目 { id, name, type, required, memo, props, lookup, link }（画面設計の items。データベースの項目の一覧表の 1 行）
//   type は入力欄の部品の種類（text1 など）。name は項目名。props は種類ごとの設定（PART_TYPES の props が最初の値）。
//   lookup はルックアップ（第 3 段階の後半）、link はほかのモックから取り込んだ元（第 3 段階の後半）。使わないときは null。
// 部品 { id, type, x, y, w, h, no, labelPos, sample, placeholder, itemId }（入力欄の部品。項目名と設定は itemId の項目が持つ）
// 部品 { id, type, x, y, w, h, no, label, labelPos, sample, placeholder, required, memo, props }（ボタン・見出しなど、項目を指さない部品）
//   x・y は画面の左上から（帯の上にも置ける）。no は赤い番号（番号を外した部品は null）。
//   label はボタン・見出し・説明の文字では、その文字。placeholder は見本の値を書かないときに出す薄い字（空なら種類ごとの字）。
//   項目を一覧表から消した後に画面に残った入力欄の部品は、消したときの項目名と設定を label・required・memo・props に写して持ち、
//   orphan: { itemId }（消した項目の id）を付ける（ユーザーの指示。消したときの中身で固定する）。
// 部品の中身を描くときは、resolvePart で項目と合わせた形（label・required・memo・props がそろった形）にしてから使う。
// 見た目と最初の大きさは CLAUDE.md の「部品の細かい決めごと」（画像 q15）のとおり。
const PART_MIN = 16; // 部品のいちばん小さい幅と高さ
const PART_GAP = 16; // 貼り付け・複製・押して置いたときに、重ならないようにずらす幅
const BAND_H = 40; // 画面の帯の高さ（.screen-band と同じ）。部品を置くときは帯の下に置く
const TABLE_W = 560; // 部品の設定の一覧表を画面の右に置いたときの幅
const TABLE_GAP = 32; // 画面と一覧表の間
const PART_TYPES = {
  text1: { name: 'テキスト（1行）', pal: 'テキスト\n（1行）', icon: '▭', w: 320, h: 64, input: true, ph: '文字列', label: '項目名', props: { maxLen: '', initial: '' } },
  text2: { name: 'テキスト（複数行）', pal: 'テキスト\n（複数行）', icon: '≡', w: 400, h: 120, input: true, ph: '文章（複数行）', label: '項目名', props: { maxLen: '', initial: '' } },
  number: { name: '数値', icon: '#', w: 200, h: 64, input: true, ph: '数値', label: '項目名', props: { unit: '', min: '', max: '', decimals: '', initial: '' } },
  date: { name: '日付', icon: '📅', w: 200, h: 64, input: true, ph: '年-月-日', label: '項目名', props: { initial: 'none', initialDate: '' } },
  dropdown: { name: 'ドロップダウン', pal: 'ドロップ\nダウン', icon: '▾', w: 320, h: 64, input: true, ph: '選択してください', label: '項目名', props: { options: ['選択肢 1', '選択肢 2'], initial: '' } },
  radio: { name: 'ラジオボタン', pal: 'ラジオ\nボタン', icon: '◉', w: 320, h: 64, input: true, label: '項目名', props: { options: ['選択肢 1', '選択肢 2'], initial: '', dir: 'h' } },
  checkbox: { name: 'チェックボックス', pal: 'チェック\nボックス', icon: '☑', w: 400, h: 64, input: true, label: '項目名', props: { options: ['選択肢 1', '選択肢 2', '選択肢 3'], initial: [], dir: 'h' } },
  button: { name: 'ボタン', icon: '▬', w: 96, h: 40, label: 'ボタン', props: { style: 'primary', action: '' } },
  heading: { name: '見出し', icon: 'T', w: 400, h: 32, label: '見出し', noNumber: true, props: {} },
  desc: { name: '説明の文字', icon: 'Aa', w: 400, h: 48, label: '説明の文を書きます。', props: {} },
  divider: { name: '区切り線', icon: '―', w: 336, h: 16, label: '', noNumber: true, props: {} },
  file: { name: '添付ファイルの欄', pal: '添付\nファイル', icon: '📎', w: 400, h: 96, input: true, label: '項目名', props: { accept: '', maxCount: '' } },
  user: { name: '人を選ぶ欄', pal: '人を選ぶ', icon: '👤', w: 320, h: 64, input: true, ph: '選択してください', label: '項目名', props: { scope: '', multiple: false, initial: 'none' } },
  datetime: { name: '日時', icon: '🕒', w: 240, h: 64, input: true, ph: '年-月-日 時:分', label: '項目名', props: { initial: 'none' } },
  calc: { name: '自動計算の値', pal: '自動計算', icon: 'ƒx', w: 200, h: 64, input: true, ph: '（自動計算）', label: '項目名', props: { formula: '', unit: '' } },
};
// 部品の箱の組。表・グラフ・吹き出しと、一覧の画面用・進み具合の画面用・見た目用の組は、第 3 段階の後半で足す（作るまで箱に出さない）
const PALETTE_GROUPS = [
  { id: 'basic', name: '基本', types: ['text1', 'text2', 'number', 'date', 'dropdown', 'radio', 'checkbox', 'button', 'heading', 'desc', 'divider'] },
  { id: 'input', name: '入力の画面用', types: ['file', 'user', 'datetime', 'calc'] },
];

// 種類の引き当ては、PART_TYPES 自身の項目だけを見る（読み込んだデータの type が constructor などでも、継承した値を拾わないため）
const own = (obj, key) => typeof key === 'string' && Object.prototype.hasOwnProperty.call(obj, key);
const partType = (type) => (own(PART_TYPES, type) ? PART_TYPES[type] : null);
const partTypeName = (type) => (partType(type) ? partType(type).name : `この版では描けない部品（${type}）`);
const snapGrid = (v) => Math.round(Number(v) / GRID) * GRID || 0;
const findPart = (screen, id) => (screen && id ? screen.parts.find((p) => p.id === id) || null : null);
const findItem = (design, id) => (design && id && Array.isArray(design.items) ? design.items.find((it) => it.id === id) || null : null);

// 項目になる部品（データベースの項目の一覧表に行がある部品）か
const isItemType = (type) => !!(partType(type) && partType(type).input);

function createItemData(type, name) {
  const t = partType(type);
  return { id: newId('i'), name: name == null ? t.label : name, type, required: false, memo: '', props: clone(t.props), lookup: null, link: null };
}

// 部品の中身を、指している項目と合わせた形にする（描く・一覧表の文を作る・設定の欄を出すときに使う）。
// 項目を指していない部品（ボタン・見出しなど・項目を消した後に残った部品）は、そのまま返す
function resolvePart(design, p) {
  const item = p && p.itemId ? findItem(design, p.itemId) : null;
  if (!item) return p;
  return { ...p, label: item.name, required: item.required, memo: item.memo, props: item.props, item };
}

// その画面に、その項目を指す部品があるか（同じ項目を 1 つの画面に 2 回は置かない）
const itemOnScreen = (screen, itemId) => !!screen && screen.parts.some((p) => p.itemId === itemId);
// その項目を置いている画面（画面の順）
const screensWithItem = (design, itemId) => design.screens.filter((s) => itemOnScreen(s, itemId));
// 項目を一覧表から消した後に、画面に残った部品か（項目を指していたが、その項目がもうない）
const isOrphanPart = (design, p) => !!p.itemId && isItemType(p.type) && !findItem(design, p.itemId);
// 「＋ 項目を足す」で選べる種類（部品の箱の並びの順）
const itemMenuTypes = () => PALETTE_GROUPS.flatMap((g) => g.types).filter(isItemType);

// 項目を消すとき、その項目を置いた部品に写す中身（消したときの中身で固定するため）
function frozenItemFields(item) {
  const f = { label: item.name, required: item.required, memo: item.memo, props: clone(item.props) };
  if (item.lookup) f.lookup = clone(item.lookup);
  if (item.link) f.link = clone(item.link);
  return f;
}

// 項目の種類を変える。設定は新しい種類の形にそろえ（同じ名前の設定は残す）、その項目を置いた部品の種類も変える
function changeItemType(design, item, type) {
  item.type = type;
  item.props = keepInitialInOptions(type, normalizeProps(partType(type), item.props));
  design.screens.forEach((s) => s.parts.forEach((p) => { if (p.itemId === item.id) p.type = type; }));
}

// 部品の位置と大きさを 8 ドットのマス目に吸い付け、画面の中に収める（大きさは変えずに位置をずらす）
function fitRect(r, screen) {
  const maxW = Math.floor(screen.width / GRID) * GRID;
  const maxH = Math.floor(screen.height / GRID) * GRID;
  const w = Math.min(Math.max(PART_MIN, snapGrid(r.w)), maxW);
  const h = Math.min(Math.max(PART_MIN, snapGrid(r.h)), maxH);
  const x = Math.min(Math.max(0, snapGrid(r.x)), maxW - w);
  const y = Math.min(Math.max(0, snapGrid(r.y)), maxH - h);
  return { x, y, w, h };
}

// 縁のつまみ（grip: n・s・e・w と、その組み合わせ）を dx・dy だけ動かしたときの位置と大きさ。動かした辺だけをマス目に吸い付ける
function resizedRect(r0, grip, dx, dy, screen) {
  const maxX = Math.floor(screen.width / GRID) * GRID;
  const maxY = Math.floor(screen.height / GRID) * GRID;
  let l = r0.x;
  let t = r0.y;
  let r = r0.x + r0.w;
  let b = r0.y + r0.h;
  if (grip.includes('w')) l = Math.min(Math.max(0, snapGrid(l + dx)), r - PART_MIN);
  if (grip.includes('e')) r = Math.max(Math.min(maxX, snapGrid(r + dx)), l + PART_MIN);
  if (grip.includes('n')) t = Math.min(Math.max(0, snapGrid(t + dy)), b - PART_MIN);
  if (grip.includes('s')) b = Math.max(Math.min(maxY, snapGrid(b + dy)), t + PART_MIN);
  return { x: l, y: t, w: r - l, h: b - t };
}

// 部品を置いたときに付ける番号は「その画面のいちばん大きい番号＋1」
function nextPartNo(screen) {
  return screen.parts.reduce((m, p) => (Number.isInteger(p.no) && p.no > m ? p.no : m), 0) + 1;
}

// 同じ位置に部品があれば、重ならない所まで右下へずらす（押して置く・貼り付けを続けたときに、部品がぴったり重ならないため）
function freeSpot(screen, at) {
  let { x, y } = at;
  for (let i = 0; i < 40 && screen.parts.some((p) => p.x === x && p.y === y); i++) {
    x += PART_GAP;
    y += PART_GAP;
  }
  return { x, y };
}

// itemId を渡すと、その項目を指す部品を作る（項目名と設定は項目が持つ）
function createPartData(type, screen, at, itemId = null) {
  const t = partType(type);
  const rect = fitRect({ x: at.x, y: at.y, w: t.w, h: t.h }, screen);
  const base = { id: newId('p'), type, ...rect, no: t.noNumber ? null : nextPartNo(screen), labelPos: 'top', sample: '', placeholder: '' };
  if (itemId) return { ...base, itemId };
  return { ...base, label: t.label, required: false, memo: '', props: clone(t.props) };
}

// 選択肢の部品の初期値を、今の選択肢の中のものだけにする（選択肢を書き換えて、なくなった選択肢が初期値に残らないため）
function keepInitialInOptions(type, props) {
  if (!['dropdown', 'radio', 'checkbox'].includes(type) || !Array.isArray(props.options)) return props;
  const opts = props.options;
  if (type === 'checkbox') return { ...props, initial: (Array.isArray(props.initial) ? props.initial : []).filter((o) => opts.includes(o)) };
  return { ...props, initial: opts.includes(props.initial) ? props.initial : '' };
}

// 番号を振り直す: 番号の付いた部品を、上から下・左から右の順に 1 から付け直す（番号を外した部品はそのまま）
function renumberedParts(parts) {
  const order = parts.filter((p) => p.no != null).sort((a, b) => a.y - b.y || a.x - b.x);
  const nos = new Map(order.map((p, i) => [p.id, i + 1]));
  return parts.map((p) => (nos.has(p.id) ? { ...p, no: nos.get(p.id) } : p));
}

// 一覧表の「設定」の列の文。1 行目に「必須・最大 50 文字」のような短い条件を「・」でつなぎ、
// 「選択肢＝…」のように「＝」で書く項目は 1 つずつ行を分け、最後の行にメモを足す。何も書いていない欄は出さない
function describePart(p) {
  const pr = p.props || {};
  const v = (s) => String(s == null ? '' : s).trim();
  const list = (a) => (Array.isArray(a) ? a.map(v).filter(Boolean).join('／') : '');
  const short = [];
  const eq = [];
  const eqIf = (label, value) => { if (value) eq.push(`${label}＝${value}`); };
  if (p.required && partType(p.type) && partType(p.type).input) short.push('必須');
  switch (p.type) {
    case 'text1': case 'text2':
      if (v(pr.maxLen)) short.push(`最大 ${v(pr.maxLen)} 文字`);
      eqIf('初期値', v(pr.initial));
      break;
    case 'number': {
      const [min, max, dec] = [v(pr.min), v(pr.max), v(pr.decimals)];
      if (min && max) short.push(`${min}〜${max}`);
      else if (min) short.push(`${min} 以上`);
      else if (max) short.push(`${max} 以下`);
      if (dec === '0') short.push('小数なし');
      else if (dec) short.push(`小数 ${dec} 桁`);
      eqIf('単位', v(pr.unit));
      eqIf('初期値', v(pr.initial));
      break;
    }
    case 'date':
      eqIf('初期値', pr.initial === 'today' ? '今日' : pr.initial === 'date' ? v(pr.initialDate) : '');
      break;
    case 'datetime':
      eqIf('初期値', pr.initial === 'now' ? '今の日時' : '');
      break;
    case 'dropdown': case 'radio': case 'checkbox':
      eqIf('選択肢', list(pr.options));
      eqIf('初期値', p.type === 'checkbox' ? list(pr.initial) : v(pr.initial));
      break;
    case 'user':
      if (pr.multiple) short.push('複数人を選べる');
      eqIf('選べる人', v(pr.scope));
      eqIf('初期値', pr.initial === 'me' ? '使っている人' : '');
      break;
    case 'file':
      if (v(pr.maxCount)) short.push(`${v(pr.maxCount)} 個まで`);
      eqIf('ファイル', v(pr.accept));
      break;
    case 'calc':
      eqIf('計算式', v(pr.formula));
      eqIf('単位', v(pr.unit));
      break;
    case 'button':
      eqIf('押したとき', v(pr.action));
      break;
  }
  return [short.join('・'), ...eq, v(p.memo)].filter(Boolean).join('\n');
}

// データベースの項目の一覧表の「設定」の列の文（部品の設定の一覧表と同じ書き方）
const describeItem = (item) => describePart({ type: item.type, required: item.required, memo: item.memo, props: item.props });

// 一覧表の「項目名」の列。説明の文字は 1 行目の初めの 20 文字。名前がなければ部品の種類
function partTitle(p) {
  const first = String(p.label == null ? '' : p.label).split('\n')[0].trim();
  if (!first) return partTypeName(p.type);
  return p.type === 'desc' && first.length > 20 ? first.slice(0, 20) + '…' : first;
}

// 部品の設定の一覧表の行（番号の付いた部品だけを番号の順に）。design を渡すと、部品が指す項目の中身で書く
function tableRows(screen, design = null) {
  return screen.parts
    .filter((p) => p.no != null)
    .sort((a, b) => a.no - b.no)
    .map((raw) => {
      const p = design ? resolvePart(design, raw) : raw;
      return { id: p.id, no: p.no, label: partTitle(p), kind: partTypeName(p.type), setting: describePart(p) };
    });
}

// 部品のいちばん下の端より画面を低くしない（下の縁のドラッグで部品が切れないため）。機器の 1 画面分から 8 ドットずつ
function minScreenHeight(screen) {
  const min = DEVICES[screen.device].height;
  const bottom = screen.parts.reduce((m, p) => Math.max(m, p.y + p.h), 0);
  return bottom <= min ? min : min + Math.ceil((bottom - min) / GRID) * GRID;
}

// ── 読み込んだデータを今の形に直す ──
// 足りない項目を補い、知らない項目はそのまま残す（新しい版で足した項目を消さないため）。
const numOr = (v, d) => (v !== null && v !== '' && Number.isFinite(Number(v)) ? Number(v) : d);

// items はその画面設計の項目（直した後のもの）。項目を指していない入力欄の部品（データの形の版 1 の部品）は、
// 部品が持っていた項目名と設定から項目を 1 つ作って items に足し、その項目を指す部品にする
function normalizePart(src, items = []) {
  const p = isObj(src) ? src : {};
  const t = partType(p.type);
  const no = Number(p.no);
  const base = {
    ...p,
    id: str(p.id) || newId('p'),
    type: str(p.type) || 'unknown',
    x: numOr(p.x, 0),
    y: numOr(p.y, 0),
    w: Math.max(PART_MIN, numOr(p.w, t ? t.w : 160)),
    h: Math.max(PART_MIN, numOr(p.h, t ? t.h : 64)),
    no: p.no != null && p.no !== '' && Number.isInteger(no) && no > 0 ? no : null,
  };
  if (!t) return base; // 知らない種類（新しい版で足した部品）は、中身をそのまま残す
  const common = { ...base, labelPos: p.labelPos === 'left' ? 'left' : 'top', sample: str(p.sample), placeholder: str(p.placeholder) };
  const fields = {
    label: typeof p.label === 'string' ? p.label : t.label,
    required: !!p.required,
    memo: str(p.memo),
    props: keepInitialInOptions(base.type, normalizeProps(t, p.props)),
  };
  if (!isItemType(base.type)) return { ...common, ...fields };
  const itemId = str(p.itemId);
  if (!itemId) {
    const item = normalizeItem({ name: fields.label, type: base.type, required: fields.required, memo: fields.memo, props: fields.props });
    items.push(item);
    return withoutItemFields({ ...common, itemId: item.id });
  }
  // 指している項目があれば、項目名と設定は項目のものを使う。なければ（項目を一覧表から消した後）、部品が持っている中身で描く
  if (items.some((it) => it.id === itemId)) return withoutItemFields({ ...common, itemId });
  return { ...common, itemId, ...fields };
}

function withoutItemFields(p) {
  const { label, required, memo, props, lookup, link, ...rest } = p;
  return rest;
}

function normalizeItem(src) {
  const it = isObj(src) ? src : {};
  const type = str(it.type) || 'text1';
  const t = isItemType(type) ? partType(type) : null;
  return {
    ...it,
    id: str(it.id) || newId('i'),
    name: typeof it.name === 'string' ? it.name : t ? t.label : '項目名',
    type,
    required: !!it.required,
    memo: str(it.memo),
    // 知らない種類の項目（新しい版で足した項目）は、設定をそのまま残す
    props: t ? keepInitialInOptions(type, normalizeProps(t, it.props)) : isObj(it.props) ? it.props : {},
    lookup: isObj(it.lookup) ? it.lookup : null,
    link: normalizeLink(it.link),
  };
}

// 取り込んだ元 { designId, itemId, designName, lost }。designName は元の画面設計の名前の控え（元がなくなったときに出す）。
// lost は、元の画面設計を完全に削除したか、元の画面設計でその項目を消したとき true（そのときの中身で固定している）
function normalizeLink(src) {
  if (!isObj(src) || !str(src.designId) || !str(src.itemId)) return null;
  return { ...src, designId: str(src.designId), itemId: str(src.itemId), designName: str(src.designName), lost: !!src.lost };
}

// 取り込んだ項目に写す、元の項目の中身（取り込んだ側では直せない中身）
const LINKED_FIELDS = ['name', 'type', 'required', 'memo', 'props', 'lookup'];
function linkedFields(src) {
  return { name: src.name, type: src.type, required: src.required, memo: src.memo, props: clone(src.props), lookup: src.lookup ? clone(src.lookup) : null };
}

// 取り込んだ項目（つなげたまま）を、元の項目の今の中身にそろえる。元を直したときは、同じ操作（commit）の中で呼ぶ。
// 元が見つからないときは lost にして、今の中身で固定する。元の元（取り込んだ項目をさらに取り込んだもの）にも届くように、変わらなくなるまで繰り返す
function syncLinkedItems(state) {
  const designs = new Map(state.designs.map((d) => [d.id, d]));
  for (let round = 0; round < 8; round++) {
    let changed = false;
    state.designs.forEach((d) => d.items.forEach((it) => {
      if (!it.link) return;
      const srcDesign = designs.get(it.link.designId);
      const src = srcDesign ? findItem(srcDesign, it.link.itemId) : null;
      if (!src || src === it) {
        if (!it.link.lost) { it.link.lost = true; changed = true; }
        return;
      }
      if (it.link.lost) { it.link.lost = false; changed = true; }
      if (it.link.designName !== srcDesign.name) { it.link.designName = srcDesign.name; changed = true; }
      const want = linkedFields(src);
      if (LINKED_FIELDS.every((k) => JSON.stringify(it[k]) === JSON.stringify(want[k]))) return;
      if (want.type !== it.type && isItemType(want.type)) changeItemType(d, it, want.type);
      Object.assign(it, want);
      changed = true;
    }));
    if (!changed) return;
  }
}

// 取り込む窓で、元の項目 it がこの画面設計 d から見てどうなっているか。
// 'own'＝この画面設計の項目を取り込んだもの、'done'＝取り込み済み、'same'＝同じ名前の項目がある、'' ＝ふつう
function importState(d, src, it) {
  if (it.link && it.link.designId === d.id) return 'own';
  if (d.items.some((x) => x.link && x.link.designId === src.id && x.link.itemId === it.id)) return 'done';
  if (d.items.some((x) => x.name === it.name)) return 'same';
  return '';
}

// その画面設計の項目を取り込んでいる、ほかの画面設計（ごみ箱のものは除く）
function designsImporting(state, designId) {
  return state.designs.filter((d) => d.id !== designId && !d.trashedAt && d.items.some((it) => it.link && it.link.designId === designId && !it.link.lost));
}

// 種類ごとの設定を、最初の値と同じ形（文字の配列・真偽・文字）にそろえる。知らない項目は残す
function normalizeProps(t, src) {
  const props = isObj(src) ? { ...src } : {};
  Object.entries(t.props).forEach(([k, def]) => {
    const v = props[k];
    if (Array.isArray(def)) props[k] = Array.isArray(v) ? v.filter((x) => typeof x === 'string' || typeof x === 'number').map(String) : clone(def);
    else if (typeof def === 'boolean') props[k] = v === undefined ? def : !!v;
    else props[k] = typeof v === 'string' ? v : typeof v === 'number' && Number.isFinite(v) ? String(v) : def;
  });
  return props;
}

// 同じ画面設計の中で部品の id が重なっていたら、後のほうに新しい id を付ける（片方を消すと両方消えるのを防ぐため）
function uniquePartIds(screens) {
  const seen = new Set();
  screens.forEach((s) => s.parts.forEach((p) => {
    if (seen.has(p.id)) p.id = newId('p');
    seen.add(p.id);
  }));
  return screens;
}
// 項目の id も同じ（重なっていると、片方を直すと両方の部品が変わるため）。後のほうの項目を指す部品はないものとして扱う
function uniqueItemIds(items) {
  const seen = new Set();
  items.forEach((it) => {
    if (seen.has(it.id)) it.id = newId('i');
    seen.add(it.id);
  });
  return items;
}

function normalizeScreen(src, i, items = []) {
  const s = isObj(src) ? src : {};
  const device = own(DEVICES, s.device) ? s.device : 'pc';
  // 部品から項目を作るとき（データの形の版 1 を直すとき）は、上から下・左から右の順に作る（一覧表の並びを画面の読む順にするため）
  const raw = Array.isArray(s.parts) ? s.parts.filter(isObj) : [];
  const order = raw.map((p, k) => k).sort((a, b) => numOr(raw[a].y, 0) - numOr(raw[b].y, 0) || numOr(raw[a].x, 0) - numOr(raw[b].x, 0));
  const parts = [];
  order.forEach((k) => { parts[k] = normalizePart(raw[k], items); });
  return {
    ...s,
    id: str(s.id) || newId('s'),
    name: typeof s.name === 'string' ? s.name : `画面 ${i + 1}`,
    device,
    width: DEVICES[device].width,
    height: snapHeight(s.height == null ? DEVICES[device].height : s.height, device),
    showHeader: s.showHeader !== false,
    tablePos: s.tablePos === 'bottom' ? 'bottom' : 'right',
    parts,
    callouts: Array.isArray(s.callouts) ? s.callouts : [],
  };
}

function normalizeDesign(src) {
  const d = isObj(src) ? src : {};
  const createdAt = str(d.createdAt) || nowIso();
  const items = uniqueItemIds((Array.isArray(d.items) ? d.items : []).filter(isObj).map(normalizeItem));
  const screens = Array.isArray(d.screens) && d.screens.length
    ? uniquePartIds(d.screens.map((s, i) => normalizeScreen(s, i, items)))
    : [createScreenData(FIRST_SCREEN_NAME)];
  return {
    ...d,
    id: str(d.id) || newId('d'),
    name: cleanName(d.name) || '名前なし',
    target: str(d.target),
    description: str(d.description),
    createdAt,
    updatedAt: str(d.updatedAt) || createdAt,
    trashedAt: str(d.trashedAt) || null,
    revisions: Array.isArray(d.revisions) ? d.revisions : [],
    items,
    screens,
  };
}

function normalizeState(raw, schemaVersion) {
  const settings = isObj(raw.settings) ? raw.settings : {};
  const customs = Array.isArray(settings.customTargets) ? settings.customTargets : [];
  const state = {
    ...raw,
    schemaVersion,
    settings: { ...settings, customTargets: [...new Set(customs.filter((t) => typeof t === 'string' && t.trim()))] },
    designs: (Array.isArray(raw.designs) ? raw.designs : []).filter(isObj).map(normalizeDesign),
  };
  syncLinkedItems(state);
  return state;
}

// 戻り値 { state, blockReason }。blockReason があるときは、保存を止める（データを消さないため）
function migrate(raw) {
  if (raw == null) return { state: createInitialState(), blockReason: null };
  if (!isObj(raw)) return { state: createInitialState(), blockReason: '保存データの形が正しくありません。' };
  const v = raw.schemaVersion === undefined ? 1 : Number(raw.schemaVersion);
  if (!Number.isInteger(v) || v < 1) return { state: createInitialState(), blockReason: '保存データの版（schemaVersion）が正しくありません。' };
  if (v > SCHEMA_VERSION) {
    return {
      state: normalizeState(raw, v),
      blockReason: `この保存データは新しい版のアプリで保存されています（データの形の版 ${v}。この版のアプリが分かるのは ${SCHEMA_VERSION} まで）。新しい版のアプリを使ってください。`,
    };
  }
  // データの形を上げるときは、ここに「v が N より小さければ N の形に直す」を足していく。
  // 1 → 2（項目を画面設計の items へ移す）は normalizePart が受け持つ: 項目を指していない入力欄の部品 1 つから項目を 1 つ作る
  // （同じ項目名の部品が別の画面にあっても 1 つにまとめない。別の項目のつもりの部品を 1 つにしてしまわないため）
  return { state: normalizeState(raw, SCHEMA_VERSION), blockReason: null };
}

// ── 3. 保存 ───────────────────────────────────────────────────────────────────
// ブラウザで開いたとき。容量の上限に当たると save() が false を返す
class LocalStorageAdapter {
  constructor(key = STORAGE_KEY) {
    this.key = key;
  }
  // 中身が壊れているときは例外を投げる（起動のときに保存を止める）
  load() {
    const raw = localStorage.getItem(this.key);
    return raw ? JSON.parse(raw) : null;
  }
  save(state) {
    try {
      localStorage.setItem(this.key, JSON.stringify(state));
      return true;
    } catch (e) {
      console.warn('保存に失敗しました:', e);
      return false;
    }
  }
}

// Electron で動いているとき。前の保存が終わるのを待たずにすぐ送る
// （1 つずつ並べて書くのは、メインプロセスの storage.js の saveChain が受け持つ）
class FileAdapter {
  constructor() {
    this.pending = Promise.resolve();
    this.lastError = null;
  }
  save(state) {
    const json = JSON.stringify(state);
    this.pending = window.storageAPI.save(json)
      .then((res) => {
        if (!res || !res.ok) throw new Error((res && res.error) || 'わからない理由');
        this.lastError = null;
      })
      .catch((e) => {
        this.lastError = e;
        console.error('ファイルへの保存に失敗しました:', e);
        showBanner('ファイルへの保存に失敗しました（' + (e.message || e) + '）。ディスクの空きとフォルダの書き込みの許可を確かめてください。');
      });
    return true;
  }
}

// 保存を止めているとき（読み込めなかった・新しい版のデータ）。何も書かない
class BlockedAdapter {
  save() {
    return true;
  }
}

// 戻り値 { store, blockReason, notice }。blockReason があるときは保存を止める。notice は知らせるだけ（保存は続ける）
async function createAppStore() {
  let raw;
  let notice = null;
  try {
    if (window.storageAPI) {
      const res = await window.storageAPI.load();
      if (!res || !res.ok) throw new Error((res && res.error) || '読み込みに失敗しました');
      raw = res.json == null ? null : JSON.parse(res.json);
      notice = res.notice || null;
    } else {
      raw = new LocalStorageAdapter().load();
    }
  } catch (e) {
    const reason = '保存データを読み込めませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  let migrated;
  try {
    migrated = migrate(raw);
  } catch (e) {
    const reason = '保存データを今の形に直せませんでした（' + (e.message || e) + '）。';
    return { store: new Store(new BlockedAdapter(), createInitialState()), blockReason: reason };
  }
  const { state, blockReason } = migrated;
  if (blockReason) return { store: new Store(new BlockedAdapter(), state), blockReason };
  const adapter = window.storageAPI ? new FileAdapter() : new LocalStorageAdapter();
  return { store: new Store(adapter, state), blockReason: null, notice };
}

// ── 4. 元に戻す ───────────────────────────────────────────────────────────────
// 変更はすべて commit() を通す。変更の前の写しを履歴に積み、保存し、画面を描き直す。
class Store {
  constructor(adapter, state) {
    this.adapter = adapter;
    this.state = state;
    this.undoStack = [];
    this.redoStack = [];
    this.listeners = new Set();
  }
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }
  notify() {
    this.listeners.forEach((fn) => fn(this.state));
  }
  commit(mutator, { history = true } = {}) {
    if (history) {
      this.undoStack.push(clone(this.state));
      if (this.undoStack.length > HISTORY_LIMIT) this.undoStack.shift();
      this.redoStack = [];
    }
    mutator(this.state);
    this.persist();
    this.notify();
  }
  canUndo() { return this.undoStack.length > 0; }
  canRedo() { return this.redoStack.length > 0; }
  undo() {
    if (!this.canUndo()) return;
    this.redoStack.push(clone(this.state));
    this.state = this.undoStack.pop();
    this.persist();
    this.notify();
  }
  redo() {
    if (!this.canRedo()) return;
    this.undoStack.push(clone(this.state));
    this.state = this.redoStack.pop();
    this.persist();
    this.notify();
  }
  // 画面設計を開くとき・一覧へ戻るとき・完全に削除したときに呼ぶ（開いていない画面設計が戻るのを防ぐ）
  clearHistory() {
    this.undoStack = [];
    this.redoStack = [];
  }
  persist() {
    this.lastSaveOk = this.adapter.save(this.state);
    if (this.lastSaveOk === false) showBanner('保存に失敗しました。ブラウザの保存領域がいっぱいの可能性があります。');
    return this.lastSaveOk;
  }
}

let store = null;
const findDesign = (state, id) => state.designs.find((d) => d.id === id) || null;

// ── 画面設計の操作（store を書き換える）──
// 画面設計を書き換えた後は、ほかの画面設計が取り込んでいる項目（つなげたまま）も同じ commit の中でそろえる
// （元に戻すで、元と取り込んだ側が一緒に戻るように）。取り込んだ側の更新日時は変えない
function mutateDesign(id, fn, { touch = true } = {}) {
  if (!findDesign(store.state, id)) return false;
  store.commit((s) => {
    const d = findDesign(s, id);
    fn(d, s);
    if (touch) d.updatedAt = nowIso();
    syncLinkedItems(s);
  });
  return true;
}

const actions = {
  createDesign(name, target) {
    const n = cleanName(name);
    if (!n) return null;
    const d = createDesignData(n, target);
    store.commit((s) => {
      addCustomTarget(s, target);
      s.designs.push(d);
    });
    return d.id;
  },
  renameDesign(id, name) {
    const n = cleanName(name);
    if (!n) return false;
    return mutateDesign(id, (d) => { d.name = n; });
  },
  // patch は { name, target, description } のどれか
  updateDesignInfo(id, patch) {
    return mutateDesign(id, (d, s) => {
      if ('name' in patch) d.name = cleanName(patch.name) || d.name;
      if ('target' in patch) {
        d.target = patch.target;
        addCustomTarget(s, patch.target);
      }
      if ('description' in patch) d.description = String(patch.description);
    });
  },
  duplicateDesign(id) {
    const src = findDesign(store.state, id);
    if (!src) return null;
    const copy = duplicateDesignData(src);
    store.commit((s) => { s.designs.push(copy); });
    return copy.id;
  },
  trashDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = nowIso(); }, { touch: false });
  },
  restoreDesign(id) {
    return mutateDesign(id, (d) => { d.trashedAt = null; }, { touch: false });
  },
  // 完全に削除は戻せない。履歴に写しが残っていると元に戻すで戻ってしまうので、履歴も空にする
  deleteDesignForever(id) {
    if (!findDesign(store.state, id)) return false;
    store.clearHistory();
    store.commit((s) => {
      s.designs = s.designs.filter((d) => d.id !== id);
      syncLinkedItems(s); // この画面設計から取り込んでいた項目は、今の中身で固定する
    }, { history: false });
    return true;
  },
  // patch は { name, device, height, showHeader, tablePos } のどれか
  updateScreen(designId, screenId, patch) {
    return mutateDesign(designId, (d) => {
      const i = d.screens.findIndex((x) => x.id === screenId);
      if (i < 0) return;
      let sc = d.screens[i];
      if ('device' in patch && own(DEVICES, patch.device)) {
        sc = changeDevice(sc, patch.device);
        // 縦は、いちばん下の部品が入るまで画面を伸ばす（部品を上へ寄せて重ねないため）。
        // 横は、幅が狭くなって画面からはみ出す部品を画面の中へ寄せる（知らない種類の部品はそのまま）
        sc.height = Math.max(sc.height, minScreenHeight(sc));
        sc.parts = sc.parts.map((p) => (partType(p.type) ? { ...p, ...fitRect(p, sc) } : p));
      }
      if ('height' in patch) sc = { ...sc, height: Math.max(snapHeight(patch.height, sc.device), minScreenHeight(sc)) };
      if ('name' in patch) sc = { ...sc, name: cleanName(patch.name) || sc.name };
      if ('showHeader' in patch) sc = { ...sc, showHeader: !!patch.showHeader };
      if ('tablePos' in patch) sc = { ...sc, tablePos: patch.tablePos === 'bottom' ? 'bottom' : 'right' };
      d.screens[i] = sc;
    });
  },

  // ── 部品の操作 ──
  // at は置く位置（画面の左上から）。帯の下に置き、同じ位置に部品があればずらす。戻り値は新しい部品の id
  addPart(designId, screenId, type, at) {
    const sc = findScreen(designId, screenId);
    const t = partType(type);
    if (!sc || !t) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    // 入力欄の部品を置くと、データベースの項目の一覧表にも項目を 1 つ足す（項目名と設定は項目が持つ）
    const item = isItemType(type) ? createItemData(type) : null;
    const p = createPartData(type, sc, freeSpot(sc, start), item && item.id);
    mutateScreen(designId, screenId, (s, d) => {
      if (item) d.items.push(item);
      s.parts.push(p);
    });
    return p.id;
  },
  // patch は { label, labelPos, sample, placeholder, required, memo, numbered, props } のどれか（props は足りない分だけ書き換える）。
  // 項目を指す部品の label（項目名）・required・memo・props は項目に書く（その項目を置いた全部の画面が変わる）。
  // 項目を一覧表から消した後に残った部品では、それらを書き換えない（消したときの中身で固定する）
  updatePart(designId, screenId, partId, patch) {
    return mutatePart(designId, screenId, partId, (p, sc, d) => {
      ['labelPos', 'sample', 'placeholder'].forEach((k) => { if (k in patch) p[k] = patch[k]; });
      if ('numbered' in patch) p.no = patch.numbered ? (p.no != null ? p.no : nextPartNo(sc)) : null;
      const item = findItem(d, p.itemId);
      if (item) { if (!item.link) applyFieldPatch(item, 'name', patch); } // 取り込んだ項目は直せない（元のモックで直す）
      else if (!p.itemId) applyFieldPatch(p, 'label', patch);
    });
  },
  // 位置と大きさを変える（マス目に吸い付け、画面の中に収める）。変わらないときは履歴に積まない
  movePart(designId, screenId, partId, rect) {
    const sc = findScreen(designId, screenId);
    const p = findPart(sc, partId);
    if (!p) return false;
    const r = fitRect(rect, sc);
    if (r.x === p.x && r.y === p.y && r.w === p.w && r.h === p.h) return false;
    return mutatePart(designId, screenId, partId, (q) => { Object.assign(q, r); });
  },
  deletePart(designId, screenId, partId) {
    return mutatePart(designId, screenId, partId, (p, sc) => { sc.parts = sc.parts.filter((x) => x.id !== partId); });
  },
  // 貼り付けと複製。src の写しを at に置く。番号の付いた部品の写しには、その画面の次の番号を付ける。戻り値は新しい部品の id。
  // 項目を指す部品の写しは、その項目がこの画面にまだなければ同じ項目を指す（同じ画面設計のほかの画面へ貼り付けたとき）。
  // この画面にもうあれば、項目も写して新しい項目にする（同じ項目を 1 つの画面に 2 回は置かないため）。
  // srcItem はコピーしたときの項目の写し。ほかの画面設計へ貼り付けて、その項目がないときに、同じ id で足す
  insertPartCopy(designId, screenId, src, at, srcItem = null) {
    const sc = findScreen(designId, screenId);
    const d = findDesign(store.state, designId);
    if (!sc || !isObj(src)) return null;
    const p = { ...clone(src), id: newId('p'), ...fitRect({ ...src, ...freeSpot(sc, fitRect({ ...src, ...at }, sc)) }, sc) };
    p.no = src.no != null ? nextPartNo(sc) : null;
    let newItem = null;
    if (p.itemId && isItemType(p.type)) {
      // 取り込んだ項目の部品を、取り込んだ元の画面設計へ貼り付けるときは、元の項目を指す
      const home = isObj(srcItem) && srcItem.link && srcItem.link.designId === designId ? findItem(d, srcItem.link.itemId) : null;
      if (home && !findItem(d, p.itemId)) p.itemId = home.id;
      const item = findItem(d, p.itemId);
      if (!item && isObj(srcItem) && srcItem.id === p.itemId) newItem = clone(srcItem);
      else if (item && itemOnScreen(sc, item.id)) {
        newItem = { ...clone(item), id: newId('i') };
        p.itemId = newItem.id;
      }
    }
    mutateScreen(designId, screenId, (s, dd) => {
      if (newItem) dd.items.push(newItem);
      s.parts.push(p);
    });
    return p.id;
  },
  renumberParts(designId, screenId) {
    return mutateScreen(designId, screenId, (sc) => { sc.parts = renumberedParts(sc.parts); });
  },

  // ── データベースの項目の操作 ──
  addItem(designId, type) {
    if (!isItemType(type) || !findDesign(store.state, designId)) return null;
    const item = createItemData(type);
    mutateDesign(designId, (d) => { d.items.push(item); });
    return item.id;
  },
  // patch は { label（項目名）, required, memo, props, type } のどれか
  updateItem(designId, itemId, patch) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || item.link) return false; // 取り込んだ項目は直せない（元のモックで直す）
    if ('type' in patch && !isItemType(patch.type)) return false;
    return mutateDesign(designId, (d) => {
      const item = findItem(d, itemId);
      if ('type' in patch && patch.type !== item.type) changeItemType(d, item, patch.type);
      applyFieldPatch(item, 'name', patch);
    });
  },
  // 項目を並べ替える。toIndex は、今の並びで「この位置の項目の前」に入れる位置（いちばん後ろは項目の数）
  moveItem(designId, itemId, toIndex) {
    const d = findDesign(store.state, designId);
    const from = d ? d.items.findIndex((it) => it.id === itemId) : -1;
    if (from < 0 || !Number.isInteger(toIndex) || toIndex < 0 || toIndex > d.items.length || toIndex === from || toIndex === from + 1) return false;
    return mutateDesign(designId, (dd) => {
      const [it] = dd.items.splice(from, 1);
      dd.items.splice(toIndex > from ? toIndex - 1 : toIndex, 0, it);
    });
  },
  // 項目を一覧表から消す。その項目を置いた部品は画面に残し、消したときの項目名と設定を部品に写して固定する（ユーザーの指示）
  deleteItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item) return false;
    const fields = frozenItemFields(item);
    return mutateDesign(designId, (d) => {
      d.items = d.items.filter((it) => it.id !== itemId);
      d.screens.forEach((s) => s.parts.forEach((p) => { if (p.itemId === itemId) Object.assign(p, clone(fields)); }));
    });
  },
  // 項目を消した後に残った部品から、消したときの中身で項目を一覧表のいちばん下に戻す。同じ項目を指していたほかの部品もつながり直る
  restoreItem(designId, itemId) {
    const d = findDesign(store.state, designId);
    if (!d || findItem(d, itemId)) return false;
    const src = d.screens.flatMap((s) => s.parts).find((p) => p.itemId === itemId && isItemType(p.type));
    if (!src) return false;
    const item = normalizeItem({ id: itemId, name: src.label, type: src.type, required: src.required, memo: src.memo, props: clone(src.props), lookup: src.lookup || null, link: src.link || null });
    return mutateDesign(designId, (dd) => {
      dd.items.push(item);
      dd.screens.forEach((s) => { s.parts = s.parts.map((p) => (p.itemId === itemId ? withoutItemFields(p) : p)); });
    });
  },
  // ほかの画面設計（srcDesignId）の項目を取り込み、一覧表のいちばん下に足す。取り込んだ項目は元とつなげたままにする。
  // 戻り値は足した項目の数。この画面設計の項目を取り込んだ項目（元がこの画面設計）と、取り込み済みの項目は足さない
  importItems(designId, srcDesignId, itemIds) {
    const d = findDesign(store.state, designId);
    const src = findDesign(store.state, srcDesignId);
    if (!d || !src || d.id === src.id) return 0;
    const add = itemIds.map((id) => findItem(src, id)).filter((it) => it && importState(d, src, it) !== 'done' && importState(d, src, it) !== 'own')
      .map((it) => ({ ...linkedFields(it), id: newId('i'), link: { designId: src.id, itemId: it.id, designName: src.name, lost: false } }));
    if (!add.length) return 0;
    mutateDesign(designId, (dd) => { dd.items.push(...add.map(normalizeItem)); });
    return add.length;
  },
  // 取り込んだ項目のつながりを切り、そのときの中身の、この画面設計だけの項目にする
  unlinkItem(designId, itemId) {
    const item = findItem(findDesign(store.state, designId), itemId);
    if (!item || !item.link) return false;
    return mutateDesign(designId, (d) => { findItem(d, itemId).link = null; });
  },
  // データベースの項目の一覧表にある項目を、画面に置く。その画面にもう置いてあれば置かない（戻り値 null）
  addItemPart(designId, screenId, itemId, at) {
    const sc = findScreen(designId, screenId);
    const item = findItem(findDesign(store.state, designId), itemId);
    const t = item && partType(item.type);
    if (!sc || !t || !isItemType(item.type) || itemOnScreen(sc, itemId)) return null;
    const start = fitRect({ x: at.x, y: Math.max(sc.showHeader ? BAND_H : 0, at.y), w: t.w, h: t.h }, sc);
    const p = createPartData(item.type, sc, freeSpot(sc, start), itemId);
    mutateScreen(designId, screenId, (s) => { s.parts.push(p); });
    return p.id;
  },
};

function findScreen(designId, screenId) {
  const d = findDesign(store.state, designId);
  return d ? d.screens.find((s) => s.id === screenId) || null : null;
}
// 画面・部品が見つからないときは、履歴に何も積まずに false を返す
function mutateScreen(designId, screenId, fn) {
  if (!findScreen(designId, screenId)) return false;
  return mutateDesign(designId, (d) => fn(d.screens.find((s) => s.id === screenId), d));
}
function mutatePart(designId, screenId, partId, fn) {
  if (!findPart(findScreen(designId, screenId), partId)) return false;
  return mutateScreen(designId, screenId, (sc, d) => fn(findPart(sc, partId), sc, d));
}

// 設定の欄の変更を、項目（nameKey は 'name'）か、項目を指さない部品（nameKey は 'label'）に書く
function applyFieldPatch(target, nameKey, patch) {
  if ('label' in patch) target[nameKey] = patch.label;
  if ('required' in patch) target.required = !!patch.required;
  if ('memo' in patch) target.memo = patch.memo;
  if (isObj(patch.props)) target.props = keepInitialInOptions(target.type, { ...target.props, ...patch.props });
}

// ── 5. 共通の部品 ─────────────────────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showBanner(message) {
  const el = $('#banner');
  el.textContent = message;
  el.hidden = false;
}

let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

// 小さな窓。OK で collect(窓) の結果（{ error } なら窓に出して閉じない）、キャンセルで null を返す。
// 窓は 1 つだけ。開いている間は後ろの画面（#app）を inert にして、押せないようにする
function showDialog({ title, body, okLabel, okClass = 'primary', init, collect, wide = false }) {
  if (isDialogOpen()) return Promise.resolve(null);
  return new Promise((resolve) => {
    const root = $('#dialog-root');
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <h2>${esc(title)}</h2>
          <div class="modal-body">${body}</div>
          <p class="modal-error" hidden></p>
          <div class="modal-actions">
            <button class="btn" data-dlg="cancel">キャンセル</button>
            <button class="btn ${okClass}" data-dlg="ok">${esc(okLabel)}</button>
          </div>
        </div>
      </div>`;
    const modal = $('.modal', root);
    const close = (value) => {
      document.removeEventListener('keydown', onKey, true);
      root.innerHTML = '';
      appEl().removeAttribute('inert');
      resolve(value);
    };
    const ok = () => {
      const r = collect ? collect(modal) : true;
      if (r && r.error) {
        const errEl = $('.modal-error', modal);
        errEl.textContent = r.error;
        errEl.hidden = false;
        return;
      }
      close(r);
    };
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(null); return; }
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      // ボタンの上の Enter は、ブラウザの本来の動き（そのボタンを押す）に任せる。複数行の欄では改行にする
      if (e.target && e.target.closest && e.target.closest('button, textarea')) return;
      e.preventDefault();
      ok();
    }
    document.addEventListener('keydown', onKey, true);
    $('[data-dlg="cancel"]', modal).addEventListener('click', () => close(null));
    $('[data-dlg="ok"]', modal).addEventListener('click', ok);
    appEl().setAttribute('inert', '');
    if (init) init(modal);
    // 窓の中にフォーカスを移す。危ない操作の窓では「キャンセル」に置く（Enter の押し間違いで実行しないため）
    if (!modal.contains(document.activeElement)) $(okClass === 'danger' ? '[data-dlg="cancel"]' : '[data-dlg="ok"]', modal).focus();
  });
}
const isDialogOpen = () => !!$('#dialog-root .modal-overlay');

// 作る先を選ぶ欄。「その他」を選ぶと名前を書く欄が出る。選んだ値は readTargetPicker で読む
const OTHER_TARGET = '__other__';
function targetPickerHtml(state, current) {
  const customs = [...state.settings.customTargets];
  if (current && !builtinTarget(current) && !customs.includes(current)) customs.push(current);
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
  return `
    <div class="target-picker">
      <select class="target-select" aria-label="作る先">
        ${current ? '' : opt('', '（選んでいません）', true)}
        ${BUILTIN_TARGETS.map((t) => opt('b:' + t.id, t.label, current === t.id)).join('')}
        ${customs.map((c) => opt('c:' + c, c, current === c)).join('')}
        ${opt(OTHER_TARGET, 'その他（名前を書く）', false)}
      </select>
      <input type="text" class="target-other" maxlength="${TARGET_MAX}" placeholder="作る先の名前" aria-label="作る先の名前" hidden>
    </div>`;
}
// 戻り値: 作る先（kintone などは id、その他は書いた名前）。その他で名前が空なら null
function readTargetPicker(root) {
  const v = $('.target-select', root).value;
  if (v === OTHER_TARGET) return resolveTargetName($('.target-other', root).value) || null;
  return v.slice(2);
}
function bindTargetPicker(root, onPick) {
  const sel = $('.target-select', root);
  const other = $('.target-other', root);
  sel.addEventListener('change', () => {
    other.hidden = sel.value !== OTHER_TARGET;
    if (!other.hidden) { other.focus(); return; }
    if (onPick && sel.value) onPick(readTargetPicker(root));
  });
  if (!onPick) return;
  other.addEventListener('change', () => {
    const t = readTargetPicker(root);
    if (t) onPick(t);
  });
}

function targetChip(target) {
  const cls = builtinTarget(target) ? ' t-' + target : '';
  return `<span class="chip${cls}">${esc(targetLabel(target))}</span>`;
}

// 画面を、編集の画面と同じ HTML で描く（縮小画像にも使う）。selectedId の部品には、選んだ印と縁のつまみを付ける。
// marks のとき（編集の画面）は、項目を消した後に残った部品などに小さな札を付ける（書き出しと縮小画像には付けない）
function screenHtml(design, screen, { grid = false, height = screen.height, selectedId = null, marks = false } = {}) {
  const band = screen.showHeader ? `<div class="screen-band">${esc(design.name)} ／ ${esc(screen.name)}</div>` : '';
  const parts = screen.parts.map((p) => partHtml(resolvePart(design, p), p.id === selectedId, marks)).join('');
  return `<div class="screen${grid ? ' grid' : ''}" style="width:${screen.width}px;height:${height}px">${band}${parts}</div>`;
}

// ── 部品の見た目（画像 q15・仕上がりイメージ.png に合わせた）──
const GRIPS = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
const partNoHtml = (p, cls = '') => (p.no != null ? `<span class="pno${cls}">${p.no}</span>` : '');

function partHtml(p, selected = false, marks = false) {
  const t = partType(p.type);
  const cls = ['part', 'pt-' + (t ? p.type : 'unknown')];
  if (t && t.input && p.labelPos === 'left') cls.push('lab-left');
  if (selected) cls.push('sel');
  const grips = selected ? GRIPS.map((g) => `<span class="grip g-${g}" data-grip="${g}"></span>`).join('') : '';
  // 読み込んだデータが思わぬ形でも、ほかの部品と画面は描けるように、この部品だけを「描けない部品」の箱にする
  let inner;
  try {
    inner = partInnerHtml(p, t, marks);
  } catch (e) {
    inner = `<div class="punknown">この部品は描けません（${esc(e.message || e)}）</div>`;
  }
  return `<div class="${cls.join(' ')}" data-part-id="${esc(p.id)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px">${inner}${grips}</div>`;
}

// 編集の画面だけで、項目名の後ろに付ける札（項目を一覧表から消した後に残った部品）
function partMarksHtml(p) {
  if (isItemType(p.type) && p.itemId && !p.item) return ' <span class="tag gone" title="この部品の項目は、データベースの項目の一覧表から消しました">項目なし</span>';
  const link = p.item && p.item.link;
  if (link && link.lost) return ` <span class="tag lost" title="取り込んだ元のモック（または元の項目）はもうありません">取り込み・元なし</span>`;
  if (link) return ` <span class="tag link" title="モック「${esc(link.designName)}」から取り込んだ項目">取り込み</span>`;
  return '';
}

function partInnerHtml(p, t, marks = false) {
  if (!t) return `<div class="punknown">${partNoHtml(p)}${esc(partTypeName(p.type))}</div>`;
  const pr = p.props;
  switch (p.type) {
    case 'button':
      // 番号はボタンの左の外。左に番号の入る幅がないときは、画面の縁で切れないように左上の角に重ねる
      return `${partNoHtml(p, p.x >= 28 ? ' pno-out' : ' pno-corner')}<div class="pbtn ${pr.style === 'normal' ? 'normal' : 'primary'}">${esc(p.label)}</div>`;
    case 'heading':
      return `<div class="phead">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'desc':
      return `<div class="pdesc">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'divider':
      return `<div class="pline">${partNoHtml(p)}<i></i></div>`;
  }
  const label = `<div class="plabel">${partNoHtml(p)}<span class="plabel-text">${esc(p.label)}</span>${p.required ? '<span class="preq">*</span>' : ''}${marks ? partMarksHtml(p) : ''}</div>`;
  return label + partFieldHtml(p, t);
}

// 入力欄の部品の、項目名より下（入力欄・選択肢・添付の枠）
function partFieldHtml(p, t) {
  const pr = p.props;
  const opts = (mark, isOn) => `<div class="popts${pr.dir === 'v' ? ' v' : ''}">${(pr.options || []).map((o) =>
    `<span class="popt"><span class="pmark ${mark}${isOn(o) ? ' on' : ''}"></span>${esc(o)}</span>`).join('')}</div>`;
  if (p.type === 'radio') return opts('rd', (o) => o === pr.initial);
  if (p.type === 'checkbox') return opts('ck', (o) => Array.isArray(pr.initial) && pr.initial.includes(o));
  if (p.type === 'file') return '<div class="pdrop">📎 ファイルをここにドラッグ、または <u>選ぶ</u></div>';
  const value = p.sample ? esc(p.sample) : `<span class="pph">${esc(p.placeholder || t.ph)}</span>`;
  const unit = String(pr.unit || '').trim();
  const right = {
    number: unit && esc(unit), calc: unit && esc(unit), date: '📅', datetime: '🕒', dropdown: '▼', user: '選ぶ',
  }[p.type];
  const head = p.type === 'user' ? '<span class="picon">👤</span>' : '';
  const kind = p.type === 'text2' ? ' area' : p.type === 'calc' ? ' calc' : '';
  return `<div class="pbox${kind}">${head}<span class="pval">${value}</span>${right ? `<span class="pr">${right}</span>` : ''}</div>`;
}

// 部品の設定の一覧表。editor のときは、行を押すとその部品を選べるようにし、番号の付いた部品がなければ案内を出す。
// 書き出し（editor でないとき）では、番号の付いた部品がなければ表を出さない
function partTableHtml(design, screen, { editor = false, selectedId = null } = {}) {
  const rows = tableRows(screen, design);
  if (!rows.length && !editor) return '';
  const width = screen.tablePos === 'bottom' ? screen.width : TABLE_W;
  const body = rows.length
    ? `<table><thead><tr><th class="c-no">番号</th><th class="c-label">項目名</th><th class="c-kind">部品の種類</th><th>設定</th></tr></thead><tbody>${rows.map((r) => `
        <tr${editor ? ` data-action="select-part" data-id="${esc(r.id)}"` : ''}${r.id === selectedId ? ' class="sel"' : ''}>
          <td class="c-no">${r.no}</td><td>${esc(r.label)}</td><td>${esc(r.kind)}</td><td class="c-set">${esc(r.setting)}</td></tr>`).join('')}</tbody></table>`
    : '<div class="ptable-empty">番号の付いた部品はまだありません。<br>部品を置くと、ここに番号ごとの設定が並びます。<br>（この案内は書き出しには出ません）</div>';
  return `<div class="ptable" style="width:${width}px"><h3>部品の設定</h3>${body}</div>`;
}

// 縮小画像。画面の上から機器の 1 画面分を、箱（boxW × boxH）に収まるように CSS の scale で縮める
function thumbHtml(design, screen, boxW, boxH) {
  const viewH = Math.min(screen.height, DEVICES[screen.device].height);
  const k = Math.min(boxW / screen.width, boxH / viewH);
  const w = Math.round(screen.width * k);
  const h = Math.round(viewH * k);
  return `<div class="thumb" style="width:${w}px;height:${h}px"><div class="thumb-scale" style="transform:scale(${k.toFixed(4)})">${screenHtml(design, screen)}</div></div>`;
}

  paletteClosed: {}, // 部品の箱で閉じている組（{ 組の id: true }。アプリを閉じるまで覚えておく）

const appEl = () => $('#app');

function renderHome() {
  appEl().innerHTML = `
    <header class="brandbar">

      <span class="spacer"></span>
      <button class="tbtn" data-action="undo" ${store.canUndo() ? '' : 'disabled'} title="直前の操作を取り消します（Ctrl+Z）">↶ 元に戻す</button>

function renderCards() {
  const list = visibleDesigns(store.state, ui.query);
  if (list.length) return list.map(renderCard).join('');
  if (!visibleDesigns(store.state).length) return '<p class="empty">まだ画面設計がありません。「＋ 新規作成」から始めましょう。</p>';
  return `<p class="empty">「${esc(cleanName(ui.query))}」を名前に含む画面設計はありません。</p>`;
}

function revisionLabel(d) {
  return d.revisions.length ? `第 ${d.revisions.length} 版` : '版なし';
}

function renderCard(d) {
  return `
    <article class="card" data-id="${esc(d.id)}">
      <button class="card-open" data-action="open" data-id="${esc(d.id)}" title="「${esc(d.name)}」を開く">
        <div class="card-thumb">${thumbHtml(d, d.screens[0], 240, 136)}</div>
        <div class="card-body">
          <h2 class="card-name">${esc(d.name)}</h2>
          <div class="card-meta">${targetChip(d.target)}<span>画面 ${d.screens.length} つ・${revisionLabel(d)}</span></div>
          <div class="card-date">更新 ${fmtDateTime(d.updatedAt)}</div>
        </div>
      </button>
      <button class="card-more" data-action="card-menu" data-id="${esc(d.id)}" aria-label="「${esc(d.name)}」の操作" title="名前の変更・複製・削除">…</button>
      ${ui.menuFor === d.id ? cardMenuHtml(d) : ''}

}

function cardMenuHtml(d) {
  const id = esc(d.id);
  return `
    <div class="card-menu" role="menu">
      <button role="menuitem" data-action="rename" data-id="${id}">名前の変更</button>
      <button role="menuitem" data-action="duplicate" data-id="${id}">複製</button>
      <button role="menuitem" class="danger" data-action="trash" data-id="${id}">削除（ごみ箱へ移す）</button>
    </div>`;
}

function renderTrash() {
  const list = trashedDesigns(store.state);
  const head = `<button class="trash-toggle" data-action="toggle-trash" aria-expanded="${ui.trashOpen}">${ui.trashOpen ? '▾' : '▸'} ごみ箱（${list.length}）</button>`;
  if (!ui.trashOpen) return head;
  const rows = list.map((d) => `
    <div class="trash-row" data-id="${esc(d.id)}">
      <span class="trash-name">${esc(d.name)}</span>${targetChip(d.target)}
      <span class="trash-date">ごみ箱へ移した日時 ${fmtDateTime(d.trashedAt)}</span>
      <button class="btn small" data-action="restore" data-id="${esc(d.id)}">戻す</button>
      <button class="btn small danger-text" data-action="delete-forever" data-id="${esc(d.id)}">完全に削除</button>
    </div>`).join('');
  return head + `
    <div class="trash-list">
      ${rows || '<p class="trash-empty">ごみ箱は空です。</p>'}
      <p class="trash-note">「戻す」を押すと一覧に戻ります。「完全に削除」を押すと、元に戻せません。</p>
    </div>`;
}

function refreshCards() {
  const el = $('#home-cards');
  if (el) el.innerHTML = renderCards();
}

function openNewDesignDialog() {
  return showDialog({
    title: '新しい画面設計',
    okLabel: '作成して開く',
    body: `
      <label class="field"><span>名前（業務アプリの名前）</span><input type="text" name="name" maxlength="${NAME_MAX}" placeholder="例: 顧客管理アプリ"></label>
      <div class="field"><span>作る先</span>${targetPickerHtml(store.state, 'kintone')}</div>
      <p class="hint">白紙の画面を 1 つ入れて開きます。説明は、開いたあとに右の欄で書けます。</p>`,
    init: (m) => {
      bindTargetPicker(m);
      $('[name=name]', m).focus();
    },
    collect: (m) => {
      const name = cleanName($('[name=name]', m).value);
      if (!name) return { error: '名前を書いてください。' };
      const target = readTargetPicker(m);
      if (!target) return { error: '「その他」を選んだときは、作る先の名前を書いてください。' };
      return { name, target };
    },

}

function openRenameDialog(d) {
  return showDialog({
    title: '名前の変更',
    okLabel: '変更する',
    body: `<label class="field"><span>画面設計の名前</span><input type="text" name="name" maxlength="${NAME_MAX}" value="${esc(d.name)}"></label>`,
    init: (m) => {
      const input = $('[name=name]', m);
      input.focus();
      input.select();
    },
    collect: (m) => {
      const name = cleanName($('[name=name]', m).value);
      return name ? { name } : { error: '名前を書いてください。' };
