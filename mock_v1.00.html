// ほかのモックから項目を取り込む窓（画像 q21）。左で元のモック（ごみ箱にない、ほかの画面設計）を選び、右で項目に印を付ける
async function openImportDialog() {
  const d = currentDesign();
  const sources = visibleDesigns(store.state).filter((x) => x.id !== d.id);
  let srcId = (sources.find((x) => x.items.length) || sources[0] || {}).id || null;
  let query = '';
  const checked = new Set();
  const stateLabel = { own: '<span class="tag done">このモックの項目</span>', done: '<span class="tag done">取り込み済み</span>', same: '<span class="tag warn">同じ名前の項目があります</span>',
    status: '<span class="tag done">ステータスはこのモックにもうあります</span>' };
  const leftHtml = () => {
    const q = cleanName(query).toLowerCase();
    const list = sources.filter((x) => !q || x.name.toLowerCase().includes(q));
    if (!list.length) return `<p class="imp-empty">${sources.length ? '名前に合う画面設計はありません。' : 'ほかの画面設計がありません。'}</p>`;
    return list.map((x) => `
      <button type="button" class="imp-design${x.id === srcId ? ' on' : ''}" data-imp-src="${esc(x.id)}">
        ${thumbHtml(x, x.screens[0], 62, 40)}
        <span><span class="nm">${esc(x.name)}</span><span class="mt">${targetChip(x.target)}項目 ${x.items.length} 個・${esc(fmtDateTime(x.updatedAt).slice(5, 10).replace('-', '/'))} 更新</span></span>
      </button>`).join('');
  };
  const rightHtml = () => {
    const src = findDesign(store.state, srcId);
    if (!src) return '<p class="imp-empty">左で、取り込む元のモックを選びます。</p>';
    if (!src.items.length) return `<p class="imp-empty">「${esc(src.name)}」には、まだ項目がありません。</p>`;
    return `<table><thead><tr><th></th><th>項目名</th><th>部品の種類</th><th>設定</th></tr></thead><tbody>${src.items.map((it) => {
      const st = importState(d, src, it);
      const dis = IMPORT_BLOCKED.includes(st);
      return `<tr${dis ? ' class="dis"' : ''}><td class="ck"><input type="checkbox" data-imp-item="${esc(it.id)}" aria-label="「${esc(it.name)}」を取り込む"${dis || checked.has(it.id) ? ' checked' : ''}${dis ? ' disabled' : ''}></td>
        <td>${esc(it.name)} ${stateLabel[st] || ''}</td><td>${esc(itemTypeName(it.type))}</td><td class="set">${esc(isItemType(it.type) ? describeItem(it, { design: src, state: store.state }) : '')}</td></tr>`;
    }).join('')}</tbody></table>`;
  };
  const footText = () => {
    const src = findDesign(store.state, srcId);
    return src && checked.size ? `「${esc(src.name)}」から、新しく <b>${checked.size} 個</b>の項目を、データベースの項目の一覧表に取り込みます。` : '取り込む項目に印を付けてください。';
  };
  return showDialog({
    title: 'ほかのモックから項目を取り込む',
    okLabel: '取り込む',
    wide: true,
    body: `
      <p class="hint" style="margin-bottom:10px">取り込んだ項目は、元のモックとつながったままになります。元のモックで項目を直すと、この画面設計の項目も同じように変わります（ここでは直せません）。</p>
      <div class="imp">
        <div class="imp-left"><div class="imp-head">1. 取り込む元のモックを選ぶ</div>
          <label class="imp-search"><input type="search" data-imp-search placeholder="名前で探す" aria-label="名前で探す"></label>
          <div class="imp-list" data-imp-left>${leftHtml()}</div></div>
        <div class="imp-right"><div class="imp-head">2. 取り込む項目に印を付ける<span class="spacer"></span><button type="button" class="link-btn" data-imp-all>すべて選ぶ</button></div>
          <div class="imp-items" data-imp-right>${rightHtml()}</div></div>
      </div>
      <p class="imp-foot" data-imp-foot>${footText()}</p>`,
    init: (m) => {
      const redraw = () => {
        $('[data-imp-left]', m).innerHTML = leftHtml();
        $('[data-imp-right]', m).innerHTML = rightHtml();
        $('[data-imp-foot]', m).innerHTML = footText();
      };
      m.addEventListener('click', (e) => {
        const b = e.target.closest('[data-imp-src]');
        if (b && b.dataset.impSrc !== srcId) { srcId = b.dataset.impSrc; checked.clear(); redraw(); return; }
        if (e.target.closest('[data-imp-all]')) {
          const src = findDesign(store.state, srcId);
          if (src) src.items.forEach((it) => { if (!IMPORT_BLOCKED.includes(importState(d, src, it))) checked.add(it.id); });
          redraw();
        }
      });
      m.addEventListener('change', (e) => {
        const c = e.target.closest('[data-imp-item]');
        if (!c) return;
        if (c.checked) checked.add(c.dataset.impItem); else checked.delete(c.dataset.impItem);
        $('[data-imp-foot]', m).innerHTML = footText();
      });
      m.addEventListener('input', (e) => {
        if (!e.target.matches('[data-imp-search]')) return;
        query = e.target.value;
        $('[data-imp-left]', m).innerHTML = leftHtml();
      });
    },
    collect: () => (srcId && checked.size ? { srcId, ids: [...checked] } : { error: '取り込む項目に印を付けてください。' }),
  }).then((r) => {
    if (!r) return;
    const src = findDesign(store.state, r.srcId);
    Object.assign(ui, { panel: 'items', partId: null, addItemMenu: false });
    const n = actions.importItems(d.id, r.srcId, r.ids);
    if (n) toast(`「${src.name}」から ${n} 個の項目を取り込みました。`);
    updateEditor();
  });
}

// 取り込んだ項目の元のモックを開き、データベースの項目の一覧表でその項目を選ぶ
function openLinkSource(itemId) {
  if (standalone) return;
  const it = findItem(currentDesign(), itemId);
  const src = it && it.link ? findDesign(store.state, it.link.designId) : null;
  if (!src || src.trashedAt) { toast('元のモックが見つかりません（ごみ箱にあるか、完全に削除されています）。'); return; }
  flushSideField();
  openDesign(src.id);
  Object.assign(ui, { panel: 'items', itemId: findItem(src, it.link.itemId) ? it.link.itemId : null });
  updateEditor();
}

// 項目を消す。画面に置いてあるときは、部品が残って固定されることを確かめてから消す
async function deleteItemWithConfirm(itemId) {
  const d = currentDesign();
  const item = findItem(d, itemId);
  if (!item) return;
  const scr = screensWithItem(d, itemId).map((s) => s.name);
  if (scr.length) {
    const ok = await showDialog({
      title: '項目を消す',
      okLabel: '消す',
      okClass: 'danger',
      body: `<p>データベースの項目の一覧表から「${esc(item.name)}」を消します。</p>
        <p class="warn">${esc(scr.join('・'))}の画面にある部品は残り、消したときの項目名と設定で固定されます（部品の設定の欄の「項目の一覧表に戻す」で戻せます）。</p>`,
    });
    if (!ok) return;
  }
  if (ui.itemId === itemId) ui.itemId = null;
  actions.deleteItem(d.id, itemId);
}

// 項目の一覧表の並べ替え（行の左のつまみのドラッグ）。放した行の上半分なら前、下半分なら後ろに入れる
function startItemSort(ev, itemId) {
  ev.preventDefault();
  flushSideField();
  drag = { kind: 'item-sort', id: itemId, to: null };
  document.body.classList.add('sorting');
}

function dragItemSort(ev) {
  document.querySelectorAll('#db-view tr.drop-before, #db-view tr.drop-after').forEach((r) => r.classList.remove('drop-before', 'drop-after'));
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const row = hit && hit.closest ? hit.closest('#db-view tr[data-id]') : null;
  if (!row) { drag.to = null; return; }
  const ids = currentDesign().items.map((it) => it.id);
  const r = row.getBoundingClientRect();
  const after = ev.clientY > r.top + r.height / 2;
  drag.to = ids.indexOf(row.dataset.id) + (after ? 1 : 0);
  row.classList.add(after ? 'drop-after' : 'drop-before');
}

// 図の箱のドラッグ（つながりの図・ステータスの移り方の図・画面の移り方の図。どの図かは data-view）。動かさずに放したときは、
// つながりの図はその画面設計を開き（編集中の画面設計の箱と、一覧にないデータベースは開かない）、画面の移り方の図はその画面を開く
function startMapDrag(ev, el) {
  ev.preventDefault();
  flushSideField();
  const inner = el.closest('.map-inner');
  drag = { kind: 'map', el, inner, view: inner.dataset.view || 'map', key: el.dataset.node, sx: ev.clientX, sy: ev.clientY,
    x0: parseFloat(el.style.left) || 0, y0: parseFloat(el.style.top) || 0, moved: false, focus: inner.dataset.focus || null };
}
// ドラッグの間に描き直す線（ほかの箱は今の位置のまま）。矢印の印の id の頭は、図を描いたときと同じにする
function viewEdgesSvg(view, focus, pos, w, h) {
  if (view === 'map') return mapEdgesSvg(mapModel(store.state, focus), pos, w, h);
  const d = findDesign(store.state, focus);
  const model = view === 'process' ? processModel(d) : flowModel(store.state, d);
  return mapEdgesSvg(model, pos, w, h, { ...VIEW_DRAW[view], idPrefix: view === 'process' ? 'proc' : 'flow' });
}
function dragMap(ev) {
  if (store.isViewing) return; // 前の版を見ている間は、箱を動かさない（押して開くのはできる）
  const dx = ev.clientX - drag.sx;
  const dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  drag.moved = true;
  document.body.classList.add('map-dragging');
  drag.x = Math.max(0, snapGrid(drag.x0 + dx));
  drag.y = Math.max(0, snapGrid(drag.y0 + dy));
  Object.assign(drag.el.style, { left: drag.x + 'px', top: drag.y + 'px' });
  // 図の枠の外へ動かしたときは、枠を広げる（放すまで箱が隠れないように）
  const st = drag.inner.style;
  st.width = Math.max(parseFloat(st.width), drag.x + MAP_W + 60) + 'px';
  st.height = Math.max(parseFloat(st.height), drag.y + MAP_H + 76) + 'px';
  // 線も描き直す
  const pos = {};
  drag.inner.querySelectorAll('.mnode').forEach((n) => { pos[n.dataset.node] = { x: parseFloat(n.style.left) || 0, y: parseFloat(n.style.top) || 0, h: parseFloat(n.style.height) || MAP_H }; });
  const svg = drag.inner.querySelector('svg');
  if (svg) svg.outerHTML = viewEdgesSvg(drag.view, drag.focus, pos, parseFloat(drag.inner.style.width), parseFloat(drag.inner.style.height));
}
function endMapDrag(done) {
  document.body.classList.remove('map-dragging');
  if (done.moved && (done.x !== done.x0 || done.y !== done.y0)) { actions.setViewPos(done.focus, done.view, done.key, { x: done.x, y: done.y }); return; }
  if (done.view === 'flow') { openFlowNode(done.key); return; }
  if (done.view !== 'map' || !done.key.startsWith('d:') || done.key === 'd:' + done.focus) return;
  if (!findDesign(store.state, done.key.slice(2))) return; // 単体で開いた HTML の、ほかの画面設計の箱（この HTML にない）は開かない
  openDesign(done.key.slice(2));
}

// 画面の移り方の図の箱を押したとき: この画面設計の画面はその画面を、ほかの画面設計の画面はその画面設計のその画面を開く
function openFlowNode(key) {
  if (key.startsWith('s:')) { openScreen(key.slice(2)); return; }
  const [designId, screenId] = key.slice(2).split('/');
  const d = findDesign(store.state, designId);
  if (!d || d.trashedAt || !d.screens.some((s) => s.id === screenId)) return; // 単体で開いた HTML の、ほかの画面設計の画面（この HTML にない）は開かない
  openDesign(designId);
  openScreen(screenId);
}

function onDragMove(ev) {
  if (!drag) return;
  if (drag.kind === 'map') { dragMap(ev); return; }
  if (drag.kind === 'add') { dragAdditive(ev); return; }
  if (drag.kind === 'group') { dragGroup(ev); return; }
  if (drag.kind === 'band') { dragBand(ev); return; }
  if (drag.kind === 'item-sort') { dragItemSort(ev); return; }
  if (drag.kind === 'screen-sort') { dragScreenSort(ev); return; }
  if (drag.kind === 'sys-design-sort') { dragSysDesignSort(ev); return; }
  if (drag.kind === 'swim-move') { dragSwimMove(ev); return; }
  if (drag.kind === 'swim-end') { dragSwimRelink(ev); return; }
  if (drag.kind === 'swim-place') { dragSwimPlace(ev); return; }
  if (drag.kind === 'co-move' || drag.kind === 'co-size') { dragCallout(ev); return; }
  if (drag.kind === 'co-link') { dragCalloutLink(ev); return; }
  if (drag.kind === 'move' || drag.kind === 'size') { dragPart(ev); return; }
  if (drag.kind === 'place') { dragPlace(ev); return; }
  const { wrap } = drag;
  if (drag.kind === 'pan') {
    wrap.scrollLeft = drag.sl - (ev.clientX - drag.sx);
    wrap.scrollTop = drag.st - (ev.clientY - drag.sy);
    return;
  }
  // 窓の下の端の近くまで来たら、下へ送る（画面を長く伸ばすため）
  const r = wrap.getBoundingClientRect();
  if (r.height && ev.clientY > r.bottom - 32) wrap.scrollTop += 24;
  const dy = ev.clientY - drag.sy + (wrap.scrollTop - drag.st);
  const h = Math.max(snapHeight(drag.h0 + dy / ui.zoom, drag.device), drag.minH);
  if (h === (ui.previewHeight == null ? drag.h0 : ui.previewHeight)) return;
  ui.previewHeight = h;
  renderStage();
}

function onDragEnd(ev) {
  if (!drag) return;
  const done = drag;
  drag = null;
  document.body.classList.remove('resizing', 'moving', 'sorting', 'linking', 'copying', 'screen-sorting');
  if (done.kind === 'map') { endMapDrag(done); return; }
  if (done.kind === 'add') {
    // Ctrl を押して押しただけ（動かしていない）なら、選ぶものに足す・外す
    const { k, id } = done.hit;
    setSelection(isSelected(k, id) ? ui.sel.filter((x) => !(x.k === k && x.id === id)) : [...ui.sel, done.hit]);
    return;
  }
  if (done.kind === 'group') { endGroupDrag(done); return; }
  if (done.kind === 'band') { endBand(done); return; }
  if (done.kind === 'co-move' || done.kind === 'co-size') {
    const r = done.rect;
    if (!r || !actions.moveCallout(ui.designId, currentScreen().id, done.id, r)) renderStage();
    return;
  }
  if (done.kind === 'co-link') {
    const c = findCallout(currentScreen(), done.id);
    if (done.target === undefined || !c || c.target === done.target || !actions.updateCallout(ui.designId, currentScreen().id, done.id, { target: done.target })) renderStage();
    return;
  }
  if (done.kind === 'item-sort') {
    if (done.to == null || !actions.moveItem(ui.designId, done.id, done.to)) renderItemsView(currentDesign());
    return;
  }
  if (done.kind === 'screen-sort') {
    if (done.moved && (done.to == null || !actions.moveScreen(ui.designId, done.id, done.to))) refreshScreenList();
    return;
  }
  if (done.kind === 'sys-design-sort') { endSysDesignSort(done); return; }
  if (done.kind === 'swim-move') { endSwimMove(done); return; }
  if (done.kind === 'swim-end') { endSwimRelink(done, ev); return; }
  if (done.kind === 'swim-place') { endSwimPlace(done, ev); return; }
  if (done.kind === 'place') { if (done.moved) dropPlace(done, ev); return; }
  if (done.kind === 'move' || done.kind === 'size') {
    const r = done.rect;
    const r0 = done.r0;
    if (r && (r.x !== r0.x || r.y !== r0.y || r.w !== r0.w || r.h !== r0.h)) actions.movePart(ui.designId, currentScreen().id, done.id, r);
    return;
  }
  done.wrap.classList.remove('grabbing');
  if (done.kind !== 'resize') return;
  const h = ui.previewHeight;
  ui.previewHeight = null;
  // 始めたときの画面に書く（ドラッグの途中に元に戻すで画面が消えると、今の画面がほかの画面に変わるため。デバッグとリリースの見直し⑤-7）
  if (h != null && h !== done.h0 && done.screenId === currentScreen().id) actions.updateScreen(ui.designId, done.screenId, { height: h });
  else renderStage();
}

// ── コピー・貼り付け・複製・削除・矢印のキーで動かす（選んだものをまとめて）──
// コピーしたものは { designId（コピーした画面設計）, parts: [{ part（部品の写し）, item（指している項目の写し。ほかの画面設計へ貼り付けるときに使う）}], callouts: [吹き出しの写し] }
function selectionEntries() {
  const s = currentScreen();
  const d = currentDesign();
  const parts = ui.sel.filter((x) => x.k === 'p').map((x) => findPart(s, x.id)).filter(Boolean)
    .map((p) => { const item = findItem(d, p.itemId); return { part: clone(p), item: item ? clone(item) : null }; });
  const callouts = ui.sel.filter((x) => x.k === 'c').map((x) => findCallout(s, x.id)).filter(Boolean).map(clone);
  return { designId: d.id, parts, callouts };
}
function copyPart() {
  const entries = selectionEntries();
  const n = entries.parts.length + entries.callouts.length;
  if (!n) return;
  ui.clipboard = entries;
  updateToolbarState();
  toast(`${n === 1 ? (entries.parts.length ? '部品' : '吹き出し') : `${n} 個`}をコピーしました。Ctrl+V で貼り付けます。`);
}

// 続けて貼り付けると、前に貼り付けた所から右下へずらして置く
function pastePart() {
  if (!ui.clipboard) return;
  const out = actions.insertCopies(ui.designId, currentScreen().id, ui.clipboard, PART_GAP, PART_GAP);
  if (!out.length) return;
  const shift = (o) => ({ ...o, x: o.x + PART_GAP, y: o.y + PART_GAP });
  ui.clipboard = { ...ui.clipboard, parts: ui.clipboard.parts.map((e) => ({ ...e, part: shift(e.part) })), callouts: ui.clipboard.callouts.map(shift) };
  setSelection(out);
}

function duplicatePart() {
  const out = actions.insertCopies(ui.designId, currentScreen().id, selectionEntries(), PART_GAP, PART_GAP);
  if (out.length) setSelection(out);
}

function deletePart() {
  if (!ui.sel.length) return;
  const sel = ui.sel;
  ui.sel = [];
  actions.deleteMany(ui.designId, currentScreen().id, sel);
}

function nudgePart(dx, dy) {
  if (ui.sel.length) actions.moveMany(ui.designId, currentScreen().id, ui.sel, dx * GRID, dy * GRID);
}

// ── 8. 出力と取り込み ─────────────────────────────────────────────────────
// 出力の窓（PDF・HTML・PNG。画像 q33）・印刷用のページ（表紙・つながりの図・項目の一覧表・画面。q34〜q36）・
// HTML の出力と、単体で開いたとき（q37）・HTML の取り込み（q39）。PDF・PNG のファイルは、デスクトップ版の main（export.js）が作る（q38）
const EMBED_ID = 'mim-embedded'; // 出力した HTML に画面設計を埋め込む script の id（ビジネスダイアグラムメーカー・CheckListMaker と別の名前）
const EMBED_FORMAT = 'mockimagemaker-design';
const IMPORT_MAX_CHARS = 50 * 1024 * 1024; // 取り込む HTML の大きさの上限
const PNG_MARGIN = 24; // PNG のまわりの白
// 用紙（in はインチ）。スライドは PowerPoint のワイド画面と同じ大きさで、横だけ（2026-10-13 ユーザー指示）
const PAPERS = {
  A4: { label: 'A4', in: [297 / 25.4, 210 / 25.4] },
  A3: { label: 'A3', in: [420 / 25.4, 297 / 25.4] },
  slide: { label: 'スライド（16:9）', in: [40 / 3, 7.5], landscapeOnly: true },
};
let APP_STYLE = ''; // アプリの style の文字（起動のときに取る）
// 単体で開いた HTML のとき { designId, peers, exportedAt, baseUpdatedAt, savedJson, savedOnce, diffBase（違いの札の元にする版。readDiffBase） }。アプリとして開いたときは null
let standalone = null;

// 用紙の大きさ。px は 96 dpi。幅は切り捨て、高さはさらに 1px 小さくする（端数で白いページが増えないように）
function paperSize(paper, orient) {
  const key = own(PAPERS, paper) ? paper : 'A4';
  const p = PAPERS[key];
  const [a, b] = p.in;
  const land = !!p.landscapeOnly || orient !== 'portrait';
  const [wi, hi] = land ? [Math.max(a, b), Math.min(a, b)] : [Math.min(a, b), Math.max(a, b)];
  return { paper: key, landscape: land, wi, hi, wmm: wi * 25.4, hmm: hi * 25.4, w: Math.floor(wi * 96 + 1e-6), h: Math.floor(hi * 96 + 1e-6) - 1 };
}

// ファイルの名前に使えない字（\ / : * ? " < > | と制御文字）を「_」にする
function safeFileName(name, fallback = '画面設計') {
  const s = String(name == null ? '' : name).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim().replace(/[. ]+$/, '').slice(0, 80);
  return s || fallback;
}
const pad2 = (n) => String(n).padStart(2, '0');

// ── 測る（見えない所に置いた箱で実際に描いて測る。jsdom のように測れないときは測らない）──
function measureBox(html, width = null) {
  const probe = document.createElement('div');
  probe.className = 'xp-probe';
  if (width) probe.style.width = width + 'px';
  probe.innerHTML = html;
  document.body.append(probe);
  return probe; // 使い終わったら remove する
}
function canMeasure() {
  const probe = measureBox('<div style="width:100px;height:10px"></div>');
  const ok = probe.firstElementChild.getBoundingClientRect().width > 0;
  probe.remove();
  return ok;
}

// ── 印刷用のページ（q34〜q36）──
const pageFoot = (left, right) => `<div class="pg-foot"><span>${left}</span><span>${right}</span></div>`;
// 表紙のほかのページの枠。上に見出しと紺の線、下の端に「画面設計の名前 ／ ページの名前」と「n / 全体」
function pageFrame({ P, title, sub = '', body, left = '', right = '', headExtra = '' }) {
  return `<div class="pg" style="width:${P.w}px;height:${P.h}px"><div class="pg-in">
    <div class="pg-head"><h2>${title}</h2>${sub ? `<span>${sub}</span>` : ''}${headExtra}</div>
    <div class="pg-body">${body}</div>${pageFoot(left, right)}</div></div>`;
}
// 枠の本文の大きさ。測れないときは見込みの値
function pageBodySize(P, measured) {
  if (!measured) return { aw: P.w - 80, ah: P.h - 30 - 18 - 40 - 26 };
  const probe = measureBox(pageFrame({ P, title: 'あ', sub: 'あ', body: '', left: 'あ', right: '1 / 1' }));
  const r = probe.querySelector('.pg-body').getBoundingClientRect();
  probe.remove();
  return { aw: Math.floor(r.width), ah: Math.floor(r.height) };
}

// 表紙（q34 案A）。名前・作る先・出力した日・最終更新・数・説明と、2 列で「画面の一覧」と「改訂履歴」。縦の用紙では上下に積む
function coverListRows(plan) {
  const rows = [];
  if (plan.changesPage) rows.push(`<tr class="lead"><td class="nm">${esc(plan.changesTitle)}</td><td class="dev"></td><td class="no">${plan.changesPage}</td></tr>`);
  if (plan.mapPage) rows.push(`<tr class="lead"><td class="nm">つながりの図</td><td class="dev"></td><td class="no">${plan.mapPage}</td></tr>`);
  if (plan.itemsPage) rows.push(`<tr class="lead"><td class="nm">データベースの項目の一覧表</td><td class="dev"></td><td class="no">${plan.itemsPage}</td></tr>`);
  if (plan.processPage) rows.push(`<tr class="lead"><td class="nm">ステータスの移り方</td><td class="dev"></td><td class="no">${plan.processPage}</td></tr>`);
  if (plan.flowPage) rows.push(`<tr class="lead"><td class="nm">画面の移り方</td><td class="dev"></td><td class="no">${plan.flowPage}</td></tr>`);
  plan.screens.forEach(({ s, i, page }) => rows.push(`<tr><td class="nm">${i + 1}　${esc(s.name)}</td><td class="dev">${DEVICES[s.device].label}</td><td class="no">${page}</td></tr>`));
  return rows;
}
const coverListTable = (rows) => `<table class="cv-table"><thead><tr><th>画面の名前</th><th>機器</th><th class="no">ページ</th></tr></thead><tbody>${rows.join('') || '<tr><td class="empty" colspan="3">（出力する画面はありません）</td></tr>'}</tbody></table>`;
// 表紙と「改訂履歴（続き）」に出す版の行（古い順。自動で残した行〔取り込む前の状態・戻す前の状態〕は出さない）
const coverRevisionRows = (d) => versionRows(d).sort((a, b) => a.no - b.no)
  .map((r) => `<tr><td>第 ${esc(r.no)} 版</td><td>${esc(revisionDay(r))}</td><td style="white-space:pre-wrap">${esc(r.note)}</td></tr>`);
function coverRevisionTable(rows) {
  const body = rows.length ? rows.join('') : '<tr><td class="empty" colspan="3">（まだ改訂履歴はありません）</td></tr>';
  return `<table class="cv-table"><thead><tr><th style="width:70px">版</th><th style="width:96px">日付</th><th>変えた内容</th></tr></thead><tbody>${body}</tbody></table>`;
}
// 表紙の骨組み（画面設計の表紙と、システムの説明書の表紙〔第 10 段階の後半〕で同じ形。splitCoverRows が .cv-list・.cv-revs・.cv-foot を名前で探す）。
// c: { kicker（小見出し）, title（名前）, meta（名前の下の行の HTML）, desc（説明の HTML）, list: [左の列の見出し, 表], side: [右の列の見出し, 表], total }
function coverShell(P, c) {
  return `<div class="pg" style="width:${P.w}px;height:${P.h}px"><div class="pg-cover">
    <div class="cv-kicker">${c.kicker}</div>
    <h1 class="cv-title">${esc(c.title)}</h1>
    <div class="cv-meta">${c.meta}</div>
    <hr class="cv-rule">
    <div class="cv-sec"><h3>説明</h3>${c.desc}</div>
    <div class="cv-cols${P.h > P.w ? ' stack' : ''}">
      <div class="cv-sec cv-list"><h3>${c.list[0]}</h3>${c.list[1]}</div>
      <div class="cv-sec cv-revs"><h3>${c.side[0]}</h3>${c.side[1]}</div>
    </div>
    <div class="cv-spacer"></div>
    <div class="cv-foot"><span>モックイメージメーカー v${APP_VERSION} で出力</span><span>全 ${c.total} ページ</span></div>
  </div></div>`;
}
// 表紙の説明（高さの上限は用紙の高さの 24%）。cut なら、続きを省略したと書く（where は全文を見られる所。「〇〇で」まで）
function coverDescHtml(P, text, cut, where) {
  if (!text.trim()) return '<div class="cv-desc none">（説明は書かれていません）</div>';
  return `<div class="cv-desc" style="max-height:${Math.round(P.h * 0.24)}px">${esc(text)}</div>`
    + (cut ? `<p class="cv-desc-cut">（説明が長いため、続きを省略しました。全文は${where}見られます）</p>` : '');
}
// 表紙の HTML の説明が、決めた高さに入りきらないか（測れるときだけ呼ぶ）
function coverDescOver(html) {
  const probe = measureBox(html);
  const el = probe.querySelector('.cv-desc');
  const over = el.scrollHeight > el.clientHeight + 1;
  probe.remove();
  return over;
}
// revRows は表紙に出す版の行（既定は全部。入りきらない行は「改訂履歴（続き）」のページへ。splitCoverRevisions）
function coverPageHtml(d, P, rows, total, exportedAt, { descCut = false, revRows = coverRevisionRows(d) } = {}) {
  const meta = `${targetChip(d.target)}<span>出力した日 <b>${esc(fmtDateTime(exportedAt).slice(0, 10))}</b></span><span>最終更新 ${esc(fmtDateTime(d.updatedAt))}</span>`
    + `<span>画面 ${d.screens.length} つ・データベースの項目 ${d.items.length} 個</span>`;
  return coverShell(P, { kicker: '画面設計書', title: d.name, meta, desc: coverDescHtml(P, d.description, descCut, 'アプリか、出力した HTML で'),
    list: ['画面の一覧', coverListTable(rows)], side: ['改訂履歴', coverRevisionTable(revRows)], total });
}
const coverContHtml = (d, P, rows, page, total) => pageFrame({ P, title: '画面の一覧（続き）', body: coverListTable(rows),
  left: `${esc(d.name)} ／ 画面の一覧（続き）`, right: `${page} / ${total}` });
const revisionContHtml = (d, P, rows, page, total) => pageFrame({ P, title: '改訂履歴（続き）', body: coverRevisionTable(rows),
  left: `${esc(d.name)} ／ 改訂履歴（続き）`, right: `${page} / ${total}` });
// 表紙の改訂履歴の表を、表紙に入る行と「改訂履歴（続き）」のページの行に分ける（[表紙の行, 続きの 1 ページ目の行, …]）。測れないときは全部を表紙に。
// 版が多い・変えた内容が長いと、表が表紙の下の端で切れていた（デバッグとリリースの見直し②-1。仕様「表紙」の「入りきらないときは次のページへ続ける」）。
// html(revRows) は、画面の一覧を 1 行だけ入れ、版の行に revRows を入れた表紙（縦の用紙では、改訂履歴の表は一覧の下にあるため。一覧は splitCoverRows が分ける）。
// 表紙には少なくとも 1 行を出す（1 行だけでも入らないときは、その行は表紙で途中までになる）
function splitCoverRevisions(html, P, rows, measured, aw, ah) {
  if (!measured || !rows.length) return [rows];
  const probe = measureBox(html(rows));
  const limit = coverLimit(probe, P);
  const bottoms = [...probe.querySelectorAll('.cv-revs tbody tr')].map((tr) => tr.getBoundingClientRect().bottom);
  probe.remove();
  const fit = Math.max(1, bottoms.filter((b) => b <= limit).length);
  if (fit >= rows.length) return [rows];
  return [rows.slice(0, fit), ...splitItemRows(rows.slice(fit), aw, ah, measured, coverRevisionTable)];
}
// 表紙の画面の一覧を、1 ページ目と続きのページに分ける（行の高さを測る。続きのページでは見出しの行を繰り返す）。測れないときは全部を 1 ページ目に。
// coverHtml(rows) は、その行を一覧に入れた表紙の HTML を返す関数（画面設計の表紙と、システムの説明書の表紙〔第 10 段階の後半〕で使う）。
// 表紙は、左の列 .cv-list・右の列 .cv-revs・下の端 .cv-foot を持つこと（名前で探して測るため）
function splitCoverRows(coverHtml, P, rows, measured, bodyH) {
  if (!measured || !rows.length) return [rows];
  const probe = measureBox(coverHtml(rows));
  // 1 ページ目の一覧が入る下の端（縦の用紙では、一覧の下の改訂履歴の分も引く）
  let limit = coverLimit(probe, P);
  if (P.h > P.w) limit -= probe.querySelector('.cv-revs').getBoundingClientRect().height + 18;
  const trs = [...probe.querySelectorAll('.cv-list tbody tr')].map((tr) => tr.getBoundingClientRect());
  const headH = probe.querySelector('.cv-list thead').getBoundingClientRect().height;
  probe.remove();
  const over = trs.findIndex((r) => r.bottom > limit);
  if (over < 0) return [rows];
  const n = Math.max(1, over);
  const chunks = [rows.slice(0, n)];
  let cur = [];
  let used = headH;
  trs.slice(n).forEach((r, k) => {
    if (cur.length && used + r.height > bodyH) { chunks.push(cur); cur = []; used = headH; }
    cur.push(rows[n + k]);
    used += r.height;
  });
  if (cur.length) chunks.push(cur);
  return chunks;
}

// 表紙の 1 ページ目で、表が入る下の端（下の余白と下の端の行を引く）。probe は measureBox で描いた表紙
const coverLimit = (probe, P) => probe.querySelector('.pg').getBoundingClientRect().top + P.h - 36 - probe.querySelector('.cv-foot').getBoundingClientRect().height - 12;

// データベースの項目の一覧表（q35 案A。つまみ・消すボタン・足すボタンなし。元は札でなく文字で書く）
function itemSourceText(d, it, state) {
  const lines = [];
  if (it.lookup) {
    const src = it.lookup.db.designId ? findDesign(state, it.lookup.db.designId) : null;
    const db = esc(dbLabel(state, it.lookup.db));
    lines.push(`ルックアップ：${db} › ${esc(refLabel(src, it.lookup.key))}<br><small>（この値で${db}を探す）</small>`);
  } else {
    const role = lookupCopyOf(d, it);
    if (role) {
      const klk = role.key.lookup;
      const src = klk.db.designId ? findDesign(state, klk.db.designId) : null;
      lines.push(`ルックアップ：${esc(dbLabel(state, klk.db))} › ${esc(refLabel(src, role.copy.from))}<br><small>（${esc(role.key.name)}で引く）</small>`);
    }
  }
  if (it.link) lines.push(`${it.link.lost ? '取り込み（元なし）' : '取り込み'}：${esc(it.link.designName || '（名前なし）')} › ${esc(it.name)}`);
  return lines.join('<br>') || '<span class="none">－</span>';
}
function itemRowsHtml(d, state) {
  return d.items.map((it) => {
    const scr = screensWithItem(d, it.id).map((s) => s.name);
    return `<tr><td>${it.name ? esc(it.name) : '<span class="none">（名前なし）</span>'}</td><td>${esc(itemTypeName(it.type))}</td>`
      + `<td class="set">${esc(isItemType(it.type) ? describeItem(it, { design: d, state }) : '')}</td><td>${itemSourceText(d, it, state)}</td>`
      + `<td>${scr.length ? esc(scr.join('・')) : '<span class="none">どの画面にもない</span>'}</td></tr>`;
  });
}
const ITEM_COLS = '<colgroup><col style="width:15%"><col style="width:12%"><col style="width:33%"><col style="width:24%"><col style="width:16%"></colgroup>';
const printItemTable = (rows) => `<table class="xp-itable">${ITEM_COLS}<thead><tr><th>項目名</th><th>部品の種類</th><th>設定</th><th>ルックアップ元・取り込み元</th><th>置いている画面</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
// 変更内容の一覧のページの表（第 6 段階。q44c）
const CHANGE_COLS = '<colgroup><col style="width:14%"><col style="width:7%"><col style="width:16%"><col style="width:11%"><col style="width:52%"></colgroup>';
const changeRowsHtml = (rows) => rows.map((x) => `<tr><td>${esc(x.screen)}</td><td>${esc(x.no)}</td><td>${esc(x.name)}</td><td><span class="cg-k ${esc(x.k)}">${esc(x.change)}</span></td><td class="set">${esc(x.text)}</td></tr>`);
const printChangeTable = (rows) => `<table class="xp-itable">${CHANGE_COLS}<thead><tr><th>画面</th><th>番号</th><th>項目名</th><th>変更</th><th>変更の内容</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
// 表を、ページに入る行ごとに分ける（行の高さは描いて測る。見出しの行はページごとに繰り返す）。測れないときは 1 ページ
function splitItemRows(rows, aw, ah, measured, tableFn = printItemTable) {
  if (!measured || !rows.length) return rows.length ? [rows] : [];
  const probe = measureBox(tableFn(rows), aw);
  const head = probe.querySelector('thead').getBoundingClientRect().height;
  const hs = [...probe.querySelectorAll('tbody tr')].map((tr) => tr.getBoundingClientRect().height);
  probe.remove();
  const pages = [];
  let cur = [];
  let used = head;
  rows.forEach((r, i) => {
    if (cur.length && used + hs[i] > ah) { pages.push(cur); cur = []; used = head; }
    cur.push(r);
    if (head + hs[i] > ah) cur.cut = true; // 1 行だけでもページに入らない（その行は途中までになる）
    used += hs[i];
  });
  if (cur.length) pages.push(cur);
  return pages;
}

// つながりの図のページ（q35 案A）。凡例だけ出し（案内の文・並べ直すボタンなし）、箱のある所を切り出して本文に収まるように縮める（拡大しない）
const hasMapLinks = (d, state) => mapModel(state, d.id).nodes.length > 1;
// idTag は矢印の印の id の頭に足す字（システムの説明書で、画面設計ごとに変える。第 10 段階の後半）
function mapPageBody(d, state, aw, ah, idTag = '') {
  const legend = `<div class="xp-legend">${VIEW_LEGENDS.map}</div>`;
  // 矢印の印の id は、編集の画面の図と重ならない名前にする（同じ id があると矢印が消えるため）
  const html = mapHtml(state, d.id, d.mapPos || {}, { idPrefix: 'xp-map' + idTag }).replace(' id="map-inner"', '');
  const boxes = [...html.matchAll(/class="mnode[^"]*"[^>]*style="left:(-?[\d.]+)px;top:(-?[\d.]+)px;width:([\d.]+)px;height:([\d.]+)px"/g)].map((m) => m.slice(1).map(Number));
  const m = html.match(/class="map-inner"[^>]*style="width:([\d.]+)px;height:([\d.]+)px"/);
  if (!m || !boxes.length) return legend + html;
  const [mw, mh] = [Number(m[1]), Number(m[2])];
  const pad = 28; // 線と矢印の文字が箱の外へ出る分
  const x0 = Math.max(0, Math.min(...boxes.map((b) => b[0])) - pad);
  const y0 = Math.max(0, Math.min(...boxes.map((b) => b[1])) - pad);
  const x1 = Math.min(mw, Math.max(...boxes.map((b) => b[0] + b[2])) + pad);
  const y1 = Math.min(mh, Math.max(...boxes.map((b) => b[1] + b[3])) + pad);
  return legend + fitDiagram(html, { x0, y0, cw: x1 - x0, ch: y1 - y0 }, aw, ah - 28); // 28 は凡例の分
}
// 図の HTML の切り出す範囲（c: { x0, y0, cw, ch }）を、aw × ah に収まるように縮めて置く（拡大しない）
function fitDiagram(html, c, aw, ah) {
  const k = Math.min(1, aw / c.cw, ah / c.ch);
  return `<div class="xp-fit"><div style="width:${Math.floor(c.cw * k)}px;height:${Math.floor(c.ch * k)}px;position:relative;overflow:hidden">`
    + `<div style="width:${c.cw}px;height:${c.ch}px;position:relative;zoom:${k.toFixed(4)}">`
    + `<div style="position:absolute;left:${-c.x0}px;top:${-c.y0}px">${html}</div></div></div></div>`;
}

// ステータスの移り方のページと画面の移り方のページ（第 8 段階。q59）。操作が 1 つもない・移る先が 1 本もないときは出さない
const hasProcessPage = (d) => { const it = d.items.find((x) => x.type === 'status'); return !!it && it.props.actions.length > 0; };
const hasFlowPage = (d, state) => flowModel(state, d).edges.length > 0;
// 操作の一覧表（番号・操作・前のステータス → 次のステータス・操作する人・条件）
const ACTION_COLS = '<colgroup><col style="width:8%"><col style="width:22%"><col style="width:32%"><col style="width:16%"><col style="width:22%"></colgroup>';
const printActionTable = (rows) => `<table class="xp-itable">${ACTION_COLS}<thead><tr><th>番号</th><th>操作</th><th>前のステータス → 次のステータス</th><th>操作する人</th><th>条件</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
function actionRowsHtml(it) {
  const name = (id) => esc(stateNameOf(it.props.states, id) || '（なし）');
  return it.props.actions.map((a, i) => `<tr><td>${i + 1}</td><td>${esc(a.name)}</td><td>${name(a.from)} → ${name(a.to)}</td><td>${esc(a.role)}</td><td class="set">${esc(a.cond)}</td></tr>`);
}
// ステータスの移り方のページ。上に凡例、左に図（上から下へ。本文の幅の 45% まで縮める）、右に操作の一覧表。
// 右に置くと表の幅が PROC_TABLE_MIN より狭くなるとき（縦の用紙）は、図（本文の高さの 6 割まで縮める）の下に、本文の幅いっぱいの表を置く。
// 表が入りきらないときは、続きのページに表だけを出す。戻り値 { sub, body, rest（続きのページごとの表の行） }
const PROC_TABLE_MIN = 520;
function processPagePlan(d, state, aw, ah, measured, idTag = '') {
  const it = d.items.find((x) => x.type === 'status');
  const html = viewHtml('process', state, d, d.processPos || {}, { idPrefix: 'xp-proc' + idTag, bare: true });
  const c = diagramCrop(html);
  const bh = ah - 28; // 凡例の分
  const fw = Math.floor(aw * 0.45);
  const side = c ? Math.floor(aw - c.cw * Math.min(1, fw / c.cw, bh / c.ch) - 32) : aw;
  const stack = !!c && side < PROC_TABLE_MIN;
  const fh = stack ? Math.floor(bh * 0.6) : bh;
  const fig = c ? fitDiagram(html, c, stack ? aw : fw, fh) : '';
  // 表の 1 ページ目に使える高さ。図の下に置くときは、図の高さと間（16）を引く
  const th = stack ? bh - Math.floor(c.ch * Math.min(1, aw / c.cw, fh / c.ch)) - 16 : bh;
  const rows = actionRowsHtml(it);
  const first = splitItemRows(rows, stack ? aw : side, th, measured, printActionTable)[0] || [];
  const rest = first.length < rows.length ? splitItemRows(rows.slice(first.length), aw, ah, measured, printActionTable) : [];
  return {
    sub: `ステータス ${it.props.states.length} つ・操作 ${it.props.actions.length} つ`,
    body: `<div class="xp-legend">${VIEW_LEGENDS.process}</div><div class="xp-proc${stack ? ' stack' : ''}">${fig ? `<div>${fig}</div>` : ''}`
      + `<div class="xp-proc-tbl"${stack ? '' : ` style="width:${side}px"`}>${printActionTable(first)}</div></div>`,
    rest,
  };
}
function flowPageBody(d, state, aw, ah, idTag = '') {
  const html = viewHtml('flow', state, d, d.flowPos || {}, { idPrefix: 'xp-flow' + idTag, bare: true });
  const c = diagramCrop(html);
  return `<div class="xp-legend">${VIEW_LEGENDS.flow}</div>${c ? fitDiagram(html, c, aw, ah - 28) : html}`;
}

// 画面と吹き出しと部品の設定の一覧表を 1 つに組む（q36 案A）。編集の画面と同じ並べ方（画面のまわり 240 ドット）を、
// 画面と吹き出しを囲む範囲で切り取り、一覧表をその外側に 32 ドット空けて置く（右なら上の端を画面の上の端に、下なら左の端を画面の左の端にそろえる）。
// 戻り値 { html, cw, ch }（縮める前の大きさ）。key は矢印の印の id の頭（ページごとに変える。同じ id が編集の画面にもあると矢印が消えるため）
// diff（{ info: designDiff の screens の 1 つ, label }）を渡すと、部品・吹き出しの札と、一覧表の札・削除した部品を入れる（第 6 段階）
// table・callouts を false にすると、一覧表・吹き出しを入れない（AI が画面だけを画像で見るとき。第 7 段階）
function screenComposite(d, s, key, measured, diff = null, { table: withTable = true, callouts: withCallouts = true } = {}) {
  const Z = CALLOUT_ZONE;
  const zoneW = s.width + Z * 2;
  const zoneH = s.height + Z * 2;
  const shown = withCallouts ? s.callouts : [];
  const rects = [[Z, Z, Z + s.width, Z + s.height], ...shown.map((c) => [Z + c.x, Z + c.y, Z + c.x + c.w, Z + c.y + c.h])];
  const pad = 8;
  const x0 = Math.max(0, Math.min(...rects.map((r) => r[0])) - pad);
  const y0 = Math.max(0, Math.min(...rects.map((r) => r[1])) - pad);
  const x1 = Math.min(zoneW, Math.max(...rects.map((r) => r[2])) + pad);
  const y1 = Math.min(zoneH, Math.max(...rects.map((r) => r[3])) + pad);
  const [cropW, cropH] = [x1 - x0, y1 - y0];
  const lines = withCallouts ? calloutLinesSvg(s).replace(' id="co-lines"', '').replace(/co-arrow-/g, `${key}-co-arrow-`) : '';
  const info = diff && !diff.info.isNew ? diff.info : null;
  const boxes = shown.map((c) => `<div class="callout cc-${esc(c.color)}" style="left:${Z + c.x}px;top:${Z + c.y}px;width:${c.w}px;height:${c.h}px">${esc(c.text)}${info ? diffBadge(info.callouts[c.id]) : ''}</div>`).join('');
  const zone = `<div class="xp-zone" style="position:absolute;left:0;top:0;width:${cropW}px;height:${cropH}px;overflow:hidden">`
    + `<div style="position:absolute;left:${-x0}px;top:${-y0}px;width:${zoneW}px;height:${zoneH}px">`
    + `<div style="position:absolute;left:${Z}px;top:${Z}px">${screenHtml(d, s, { grid: false, marks: false, diff: info })}</div>${lines}${boxes}</div></div>`;
  const table = withTable ? partTableHtml(d, s, { editor: false, diff: info && diff }) : '';
  let [tw, th] = [0, 0];
  if (table && measured) {
    const probe = measureBox(table);
    const r = probe.firstElementChild.getBoundingClientRect();
    [tw, th] = [Math.ceil(r.width), Math.ceil(r.height)];
    probe.remove();
  } else if (table) {
    tw = s.tablePos === 'bottom' ? s.width : TABLE_W;
  }
  const right = s.tablePos !== 'bottom';
  const tx = right ? cropW + TABLE_GAP : Z - x0;
  const ty = right ? Z - y0 : cropH + TABLE_GAP;
  const cw = table ? Math.max(cropW, tx + tw) : cropW;
  const ch = table ? Math.max(cropH, ty + th) : cropH;
  return { cw, ch, html: zone + (table ? `<div style="position:absolute;left:${tx}px;top:${ty}px">${table}</div>` : '') };
}
// 画面のページの本文。本文に収まるように縮め（拡大しない）、左右・上下の真ん中に置く。測れないときは縮めない。
// 縮めるのは transform でなく zoom にする（transform だと、縮める前の幅が残り、画面のページが 2 つ以上あると、
// Electron の印刷が用紙からはみ出しているとみなして全部のページを約 0.67 倍に縮めてしまうため）
// zoom では 1px の罫線が縮まないので、縮めた表は「測った高さ × 倍率」より高くなる。縮めた後の大きさを測り直し、収まるまで倍率を下げる
function screenPageBody(comp, aw, ah, measured) {
  const stage = (k, w, h, top) => `<div class="xp-stage" style="width:${Math.ceil(w)}px;height:${Math.ceil(h)}px;margin-top:${top}px">`
    + `<div style="position:absolute;left:0;top:0;width:${comp.cw}px;height:${comp.ch}px;zoom:${k.toFixed(4)}">${comp.html}</div></div>`;
  if (!measured) return { k: 1, html: stage(1, comp.cw, comp.ch, 0) };
  let k = Math.min(1, aw / comp.cw, ah / comp.ch);
  let [w, h] = [comp.cw * k, comp.ch * k];
  for (let i = 0; i < 5; i++) {
    const probe = measureBox(stage(k, w, h, 0));
    const box = probe.querySelector('.xp-stage').getBoundingClientRect();
    [w, h] = [0, 0];
    probe.querySelectorAll('.xp-zone, .ptable').forEach((el) => {
      const r = el.getBoundingClientRect();
      w = Math.max(w, r.right - box.left);
      h = Math.max(h, r.bottom - box.top);
    });
    probe.remove();
    if (w <= aw + 0.5 && h <= ah + 0.5) break;
    k *= Math.min(aw / w, ah / h) * 0.995;
  }
  return { k, html: stage(k, w, h, Math.max(0, Math.floor((ah - h) / 2))) };
}

// 印刷用の文書（PDF にする HTML）。アプリと同じ style に、用紙の大きさ（@page）を足す
function printDocumentHtml(title, P, pagesHtml) {
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<title>' + esc(title) + '</title>\n<style>' + APP_STYLE
    + '\n@page{size:' + P.wmm.toFixed(3) + 'mm ' + P.hmm.toFixed(3) + 'mm;margin:0}\n</style>\n</head>\n<body class="xp-doc">\n' + pagesHtml + '\n</body>\n</html>\n';
}

// 出力で比べる版（第 6 段階）。戻り値 { result（designDiff）, label（「第 2 版」）, title（「第 2 版（2026-10-10）」） } か null
function exportDiff(d, state, revId) {
  const r = findRevision(d, revId);
  if (!isVersionRow(r) || !hasSnapshot(r)) return null;
  return { result: designDiff(designFromSnapshot(d, r), d, state), label: revisionTitle(r), title: `${revisionTitle(r)}（${revisionDay(r)}）` };
}
// 画面のページの見出しの右に出す、比べた版との違いの数
function diffSumHtml(df, info) {
  if (!df || !info) return '';
  if (info.isNew) return `<span class="df-sum">${esc(df.label)}にない、新しい画面</span>`;
  const c = info.counts;
  return `<span class="df-sum">${esc(df.title)}との違い：<b class="n">新 ${c.new}</b>・<b class="c">変 ${c.chg}</b>・<b class="d">削除 ${c.del}</b></span>`;
}

// PDF の中身を組む。opts { paper, orient, cover, map, items, process, flow, screenIds（省略するとすべての画面）, diffRevId（比べる版の行の id） }。
// 表紙（入りきらなければ「画面の一覧（続き）」「改訂履歴（続き）」）→ 比べた版からの変更内容（違いの印を選んだときだけ）→ つながりの図（つながりがあるときだけ）→
// 項目の一覧表（項目があるときだけ）→ ステータスの移り方（操作があるときだけ）→ 画面の移り方（移る先があるときだけ）→ 選んだ画面。
// システムの説明書（第 10 段階の後半）に画面設計のページを並べるときは、opts に pageStart（最初のページの番号。既定 1）・grandTotal（「n / N」と
// 表紙の「全 N ページ」の N。既定はこの画面設計のページ数）・idTag（矢印の印の id の頭に足す字。既定 ''）を渡す。countOnly なら、ページを組まずに数だけ返す。
// 戻り値 { html（印刷用の文書）, P（用紙）, pages（ページの HTML）, total（この画面設計のページ数）, included（本当に入れたページ { cover, map, items, process, flow }） }。
// countOnly のときは { P, total }
function exportDocument(d, state, opts, exportedAt = nowIso()) {
  const L = exportLayout(d, state, opts, exportedAt);
  if (opts.countOnly) return { P: L.P, total: L.plan.total };
  const pages = [...exportCoverPages(d, L, exportedAt), ...exportViewPages(d, state, L), ...exportScreenPages(d, L)];
  const included = { cover: !!opts.cover, map: L.withMap, items: L.itemChunks.length > 0, process: !!L.proc, flow: L.withFlow };
  return { P: L.P, pages, total: L.plan.total, included, html: printDocumentHtml(d.name, L.P, pages.join('\n')) };
}
// ページの並べ方を決める（どのページを何ページ目に置くか・表紙と表をどこで分けるか）。番号は pageStart からの通し番号、plan.total はこの画面設計のページ数。
// 戻り値 { P, measured, aw, ah, df, itemChunks, changeChunks, proc, withMap, withFlow, plan, coverChunks, revChunks（[表紙の版の行, 「改訂履歴（続き）」の行, …]）,
//   descCut, base（最初のページの番号 - 1）, grand（「n / N」の N）, idTag }
function exportLayout(d, state, opts, exportedAt) {
  const P = paperSize(opts.paper, opts.orient);
  const measured = canMeasure();
  const { aw, ah } = pageBodySize(P, measured);
  const idTag = opts.idTag || '';
  const screens = d.screens.map((s, i) => ({ s, i })).filter(({ s }) => !opts.screenIds || opts.screenIds.includes(s.id));
  const withMap = !!opts.map && hasMapLinks(d, state);
  const itemChunks = opts.items ? splitItemRows(itemRowsHtml(d, state), aw, ah, measured) : [];
  const df = opts.diffRevId ? exportDiff(d, state, opts.diffRevId) : null;
  const changesTitle = df ? `${df.title}からの変更内容` : '';
  const changeChunks = !df ? [] : df.result.rows.length ? splitItemRows(changeRowsHtml(df.result.rows), aw, ah, measured, printChangeTable) : [[]];
  const proc = opts.process && hasProcessPage(d) ? processPagePlan(d, state, aw, ah, measured, idTag) : null;
  const withFlow = !!opts.flow && hasFlowPage(d, state);
  const base = (opts.pageStart || 1) - 1;
  // ページ番号は、表紙が何ページになるかで変わる。番号の桁で行の高さは変わらないので、仮の番号で 1 回分けてから決め直す
  const numbering = (coverPages) => {
    let n = base + coverPages;
    const changesPage = changeChunks.length ? n + 1 : 0;
    n += changeChunks.length;
    const mapPage = withMap ? ++n : 0;
    const itemsPage = itemChunks.length ? n + 1 : 0;
    n += itemChunks.length;
    const processPage = proc ? n + 1 : 0;
    n += proc ? 1 + proc.rest.length : 0;
    const flowPage = withFlow ? ++n : 0;
    return { changesPage, changesTitle, mapPage, itemsPage, processPage, flowPage, screens: screens.map((x) => ({ ...x, page: ++n })), total: n - base };
  };
  let coverChunks = [];
  // 表紙の説明が、決めた高さに入りきるか（入りきらなければ、省略したと書く）
  const descCut = !!opts.cover && measured && !!d.description.trim() && coverDescOver(coverPageHtml(d, P, [], 1, exportedAt));
  // 表紙の改訂履歴の表に入る行と、「改訂履歴（続き）」のページ（画面の一覧を 1 行だけ入れた表紙で測る）
  const revChunks = !opts.cover ? []
    : splitCoverRevisions((revRows) => coverPageHtml(d, P, coverListRows(numbering(1)).slice(0, 1), 99, nowIso(), { descCut, revRows }), P, coverRevisionRows(d), measured, aw, ah);
  const revCont = Math.max(0, revChunks.length - 1);
  let plan = numbering(opts.cover ? 1 + revCont : 0);
  if (opts.cover) {
    const coverHtml = (rows) => coverPageHtml(d, P, rows, 99, nowIso(), { descCut, revRows: revChunks[0] });
    coverChunks = splitCoverRows(coverHtml, P, coverListRows(plan), measured, ah);
    if (coverChunks.length > 1) {
      plan = numbering(coverChunks.length + revCont);
      coverChunks = splitCoverRows(coverHtml, P, coverListRows(plan), measured, ah);
    }
  }
  return { P, measured, aw, ah, df, itemChunks, changeChunks, proc, withMap, withFlow, plan, coverChunks, revChunks, descCut, base, grand: opts.grandTotal || plan.total, idTag };
}
// 表紙と「画面の一覧（続き）」「改訂履歴（続き）」のページ
function exportCoverPages(d, L, exportedAt) {
  const { P, grand } = L;
  const list = L.coverChunks.map((rows, k) => (k === 0 ? coverPageHtml(d, P, rows, grand, exportedAt, { descCut: L.descCut, revRows: L.revChunks[0] })
    : coverContHtml(d, P, rows, L.base + k + 1, grand)));
  const revs = L.revChunks.slice(1).map((rows, k) => revisionContHtml(d, P, rows, L.base + L.coverChunks.length + k + 1, grand));
  return [...list, ...revs];
}
// 変更内容・つながりの図・項目の一覧表・ステータスの移り方・画面の移り方のページ
function exportViewPages(d, state, L) {
  const { P, aw, ah, df, plan, proc, grand } = L;
  const left = (t) => `${esc(d.name)} ／ ${t}`;
  const pages = [];
  L.changeChunks.forEach((rows, k) => pages.push(pageFrame({ P, title: esc(plan.changesTitle) + (k ? '（続き）' : ''),
    sub: `${df.result.rows.length} 件${rows.cut ? '・長い行は途中まで' : ''}`,
    body: rows.length ? printChangeTable(rows) : `<p class="cg-none">${esc(df.label)}から変わった所はありません。</p>`,
    left: left('変更内容'), right: `${plan.changesPage + k} / ${grand}` })));
  if (L.withMap) {
    pages.push(pageFrame({ P, title: 'つながりの図', sub: `「${esc(d.name)}」と、直接つながる画面設計`, body: mapPageBody(d, state, aw, ah, L.idTag),
      left: left('つながりの図'), right: `${plan.mapPage} / ${grand}` }));
  }
  L.itemChunks.forEach((rows, k) => pages.push(pageFrame({ P, title: `データベースの項目の一覧表${k ? '（続き）' : ''}`,
    sub: `項目 ${d.items.length} 個${rows.cut ? '・長い行は途中まで（全文はアプリか HTML で見られます）' : ''}`,
    body: printItemTable(rows), left: left('データベースの項目の一覧表'), right: `${plan.itemsPage + k} / ${grand}` })));
  if (proc) {
    pages.push(pageFrame({ P, title: 'ステータスの移り方', sub: proc.sub, body: proc.body, left: left('ステータスの移り方'), right: `${plan.processPage} / ${grand}` }));
    proc.rest.forEach((rows, k) => pages.push(pageFrame({ P, title: 'ステータスの移り方（続き）', sub: '操作の一覧表', body: printActionTable(rows),
      left: left('ステータスの移り方'), right: `${plan.processPage + 1 + k} / ${grand}` })));
  }
  if (L.withFlow) {
    pages.push(pageFrame({ P, title: '画面の移り方', sub: `画面 ${d.screens.length} つ・${flowEntryNote(state, d)}`, body: flowPageBody(d, state, aw, ah, L.idTag),
      left: left('画面の移り方'), right: `${plan.flowPage} / ${grand}` }));
  }
  return pages;
}
// 画面のページ（吹き出しの矢印の印の id の頭 'p' + ページの番号は、通し番号なので、説明書の中でも重ならない）
function exportScreenPages(d, L) {
  const { P, aw, ah, df, measured, grand } = L;
  return L.plan.screens.map(({ s, i, page }) => {
    const info = df ? df.result.screens[s.id] : null;
    const body = screenPageBody(screenComposite(d, s, 'p' + page, measured, info && { info, label: df.label }), aw, ah, measured);
    const name = `${i + 1}　${esc(s.name)}`;
    const sub = `${DEVICES[s.device].label}・${s.width} × ${s.height}${body.k < 0.995 ? `・${Math.round(body.k * 100)}% に縮小` : ''}`;
    return pageFrame({ P, title: name, sub, body: body.html, left: `${esc(d.name)} ／ ${name}`, right: `${page} / ${grand}`, headExtra: diffSumHtml(df, info) });
  });
}

// ── システムの説明書（PDF。第 10 段階の後半。q76・q77・q80・q81。仕様_細かい決めごと.md の「説明書（PDF）の細かい決めごと」）──
// システムの表紙（入りきらなければ「画面設計の一覧（続き）」）→ スイムレーン図 → 画面設計ごとに、画面設計を 1 つ出力したときと同じページ → 設計ノート。
// ページの番号はすべて説明書の全体の通し番号。出せないページ（作業の箱がない・設計ノートに行がない）は黙って外す
// 設計ノートのページに入れる段階。⑤（説明書と出力）の行は入れない（AI が出力したファイルの場所〔使う人の名前が入った PC のフォルダ〕を書く行で、
// 説明書を作ること自体の記録のため。ベンダーに渡す PDF に載らないように）
const NOTE_DOC_STAGES = NOTE_STAGES.filter((k) => k !== 'docs');
// 説明書に入れる設計ノートの行 { decisions, open（答えのない行）, decided（答えのある行） }。段階 ①〜④ の行のうち、文（決めたこと・理由・
// まだ決まっていないこと・答えのどれか）が空でない行を、段階の順（同じ段階の中は書いた順）に。窓・AI・ページの組み方の 3 か所は、これで見分ける
function noteDocRows(y) {
  const pick = (rows, keys) => NOTE_DOC_STAGES.flatMap((k) => rows.filter((r) => r.stage === k && keys.some((f) => str(r[f]).trim())));
  const qs = pick(y.notes.questions, ['text', 'answer']);
  return { decisions: pick(y.notes.decisions, ['text', 'reason']), open: qs.filter((q) => !noteQuestionDecided(q)), decided: qs.filter(noteQuestionDecided) };
}
// 説明書に出せるページ { swimlane（作業の箱がある）, notes（設計ノートに入れる行がある）, designs（入っている画面設計の数。ごみ箱のものは除く） }
function systemDocCan(y, state) {
  const r = noteDocRows(y);
  return { swimlane: swimlaneModel(state, y).nodes.length > 0, notes: r.decisions.length + r.open.length + r.decided.length > 0, designs: designsOfSystem(state, y).length };
}
// システムの表紙の「画面設計の一覧」の行。plan { swimlanePage, notesPage, designs: [{ d, firstPage, pages, others（ほかのシステムの名前） }] }
function systemCoverRows(plan) {
  const lead = (name, page) => `<tr class="lead"><td class="nm">${name}</td><td class="dev"></td><td class="no">${page}</td></tr>`;
  const rows = plan.swimlanePage ? [lead('スイムレーン図', plan.swimlanePage)] : [];
  plan.designs.forEach((r) => rows.push(`<tr><td class="nm">${esc(r.d.name)}${r.others.length ? systemShareTag(r.others) : ''}</td>`
    + `<td class="dev">${targetChip(r.d.target)}</td><td class="no">${r.pages ? r.firstPage : ''}</td></tr>`));
  if (!plan.designs.length) rows.push('<tr><td class="empty" colspan="3">（画面設計は入っていません）</td></tr>');
  if (plan.notesPage) rows.push(lead('設計ノート', plan.notesPage));
  return rows;
}
// 表紙の札「〇〇でも使っている」。ほかのシステムの名前は 2 つまで出し、残りは「ほか N つ」にまとめる。
// 札は名前の切れ目（「・」の後）でだけ折り返す（名前の長いシステムが多くても、左の列を押し広げない。見直しの B-5）
function systemShareTag(others) {
  const names = others.slice(0, 2).map(esc);
  const last = `<span class="nw">${names.pop()}${others.length > 2 ? `ほか ${others.length - 2} つ` : ''}でも使っている</span>`;
  return `<span class="share-tag">${[...names.map((n) => `<span class="nw">${n}</span>`), last].join('・')}</span>`;
}
const systemListTable = (rows) => `<table class="cv-table"><thead><tr><th>画面設計</th><th>作る先</th><th class="no">ページ</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
// 表紙の役割の表。max は表紙に入る役割の数（null は全部。coverRoleFit が測る）。入りきらない役割は省き、表の下にそう書く（見直しの B-2）
function systemRoleTable(y, max = null) {
  const shown = max == null ? y.roles : y.roles.slice(0, max);
  const rows = y.roles.length
    ? shown.map((r) => `<tr><td>${esc(r.name)}</td><td style="white-space:pre-wrap">${esc(r.memo)}</td></tr>`).join('')
    : '<tr><td class="empty" colspan="2">（役割はまだありません）</td></tr>';
  const left = y.roles.length - shown.length;
  const more = left ? `<p class="cv-desc-cut">（表紙に入りきらないため、残りの役割 ${left} つを省略しました。全部はアプリのシステムの「役割」で見られます）</p>` : '';
  return `<table class="cv-table"><thead><tr><th style="width:96px">役割</th><th>メモ</th></tr></thead><tbody>${rows}</tbody></table>${more}`;
}
// 表紙の役割の表に入る役割の数（測れるときだけ呼ぶ）。全部入るときは null。入りきらないときは、表の下の断り書きの 1 行の分を空けて入る数。
// html は、画面設計の一覧を 1 行だけ入れた表紙（縦の用紙では、役割の表は一覧の下にあるため。一覧は splitCoverRows が役割の表の分を引いて分ける）
function coverRoleFit(html, P) {
  const probe = measureBox(html);
  const limit = coverLimit(probe, P);
  const bottoms = [...probe.querySelectorAll('.cv-revs tbody tr')].map((tr) => tr.getBoundingClientRect().bottom);
  probe.remove();
  if (!bottoms.length || bottoms[bottoms.length - 1] <= limit) return null;
  return bottoms.filter((b) => b <= limit - COVER_MORE_H).length;
}
const COVER_MORE_H = 26; // 表の下の断り書きの 1 行の高さ（.cv-desc-cut）
// システムの表紙（画像 q81_2）。左に「画面設計の一覧」、右に「役割」（縦の用紙では上下）
function systemCoverHtml(y, state, P, rows, total, exportedAt, { descCut = false, roleMax = null } = {}) {
  const counts = `役割 ${y.roles.length} つ・画面設計 ${designsOfSystem(state, y).length} つ・作業 ${swimlaneModel(state, y).nodes.length} つ`;
  const updated = y.updatedAt ? `<span>最終更新 ${esc(fmtDateTime(y.updatedAt))}</span>` : ''; // 読み込んだデータで日時がないとき（new Date(null) は 1970 年になる）は出さない
  const meta = `<span>出力した日 <b>${esc(fmtDateTime(exportedAt).slice(0, 10))}</b></span>${updated}<span>${counts}</span>`;
  return coverShell(P, { kicker: 'システムの説明書', title: y.name, meta, desc: coverDescHtml(P, y.description, descCut, 'アプリのシステムの「概要」で'),
    list: ['画面設計の一覧', systemListTable(rows)], side: ['役割', systemRoleTable(y, roleMax)], total });
}
const systemCoverContHtml = (y, P, rows, page, total) => pageFrame({ P, title: '画面設計の一覧（続き）', body: systemListTable(rows),
  left: `${esc(y.name)} ／ 画面設計の一覧（続き）`, right: `${page} / ${total}` });
// スイムレーン図のページ（画像 q81_3）。上に凡例（測れるときは凡例の高さを測って引く）、図は本文に収まるように縮める（拡大しない）
function swimlanePageHtml(y, state, P, L, page, total) {
  const legend = `<div class="xp-legend">${VIEW_LEGENDS.swimlane}</div>`;
  let lh = 28;
  if (L.measured) {
    const probe = measureBox(legend, L.aw);
    lh = Math.ceil(probe.firstElementChild.getBoundingClientRect().height) + 8; // 8 は凡例の下の空き
    probe.remove();
  }
  const html = swimlaneHtml(state, y, { idPrefix: 'xp-swim', bare: true });
  const c = diagramCrop(html);
  return pageFrame({ P, title: 'スイムレーン図', sub: '役割ごとの帯に、作業の箱を左から順に並べた業務の流れ', body: legend + (c ? fitDiagram(html, c, L.aw, L.ah - lh) : html),
    left: `${esc(y.name)} ／ スイムレーン図`, right: `${page} / ${total}` });
}

// 設計ノートのページ（画像 q80_3）。「決めたことと理由」の表と、「まだ決まっていないこと」の表（答えのない行 → 答えのある行を灰色で）
const NOTE_KEY_HTML = `<p class="xp-nt-key">段階: ${NOTE_DOC_STAGES.map((k) => esc(NOTE_STAGE_NAMES[k])).join('　')}</p>`;
const NOTE_DEC_COLS = '<colgroup><col style="width:11%"><col style="width:6%"><col style="width:38%"><col></colgroup>';
const NOTE_Q_COLS = '<colgroup><col style="width:6%"><col style="width:38%"><col><col style="width:15%"></colgroup>';
const noteDecTable = (rows) => `<table class="xp-itable">${NOTE_DEC_COLS}<thead><tr><th>日付</th><th>段階</th><th>決めたこと</th><th>理由</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
const noteQTable = (rows) => `<table class="xp-itable">${NOTE_Q_COLS}<thead><tr><th>段階</th><th>まだ決まっていないこと</th><th>答え</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
const noteDecRowHtml = (r) => `<tr><td class="nw">${esc(r.date)}</td><td>${noteStageNo(r.stage)}</td><td class="set">${esc(r.text)}</td><td class="set">${esc(r.reason)}</td></tr>`;
function noteQRowHtml(q) {
  if (!noteQuestionDecided(q)) return `<tr><td>${noteStageNo(q.stage)}</td><td class="set">${esc(q.text)}</td><td></td><td></td></tr>`;
  const md = q.resolvedAt ? noteMonthDay(q.resolvedAt) : '';
  return `<tr class="done"><td>${noteStageNo(q.stage)}</td><td class="set">${esc(q.text)}</td><td class="set">${esc(q.answer)}</td><td class="nw">${md ? `${md} に決まった` : '決まった'}</td></tr>`;
}
// 設計ノートのページの表 { sub（見出しの右の小さな字）, sections: [{ title, count, rows（行の HTML）, table（表を組む関数） }] }。行のない表は入れない
function noteDocSections(y) {
  const r = noteDocRows(y);
  const sections = [];
  const sub = [];
  if (r.decisions.length) {
    sections.push({ title: '決めたことと理由', count: `${r.decisions.length} つ`, rows: r.decisions.map(noteDecRowHtml), table: noteDecTable });
    sub.push(`決めたことと理由 ${r.decisions.length} つ`);
  }
  if (r.open.length + r.decided.length) {
    const count = `${r.open.length} つ${r.decided.length ? `（決まったもの ${r.decided.length} つ）` : ''}`;
    sections.push({ title: 'まだ決まっていないこと', count, rows: [...r.open, ...r.decided].map(noteQRowHtml), table: noteQTable });
    sub.push(`まだ決まっていないこと ${count}`);
  }
  return { sub: sub.join('・'), sections };
}
// 設計ノートの表を、ページに入る行ごとに分ける。戻り値はページごとの [{ sec, rows, cont（前のページから続く表）, cut（1 行だけでも入らない行を途中まで出す） }]。
// 1 ページ目は段階の読み方の高さを引き、表ごとに見出し（h3）と表の見出しの行の高さを引く。見出しの後に 1 行も入らないなら、その表は次のページから
// （見出しだけをページの下に残さない）。測れないときは 1 ページ
function splitNoteSections(sections, aw, ah, measured) {
  if (!sections.length) return [];
  if (!measured) return [sections.map((sec) => ({ sec, rows: sec.rows, cont: false, cut: false }))];
  const m = measureNoteSections(sections, aw);
  const pages = [];
  let cur = [];
  let used = m.key;
  sections.forEach((sec, s) => {
    const { head, hs } = m.secs[s];
    let i = 0;
    while (i < sec.rows.length) {
      let h = used + (cur.length ? NOTE_SEC_GAP : 0) + head;
      let n = 0;
      while (i + n < sec.rows.length && h + hs[i + n] <= ah) h += hs[i + n++];
      const cut = !n && !cur.length; // 空のページにも入らない行は、途中まで出す
      if (!n && !cut) { pages.push(cur); cur = []; used = 0; continue; }
      if (cut) { n = 1; h = ah; }
      cur.push({ sec, rows: sec.rows.slice(i, i + n), cont: i > 0, cut });
      used = h;
      i += n;
    }
  });
  if (cur.length) pages.push(cur);
  return pages;
}
const NOTE_SEC_GAP = 18; // 表と次の表の見出しの間（CSS の .xp-itable + .xp-doc-h3 の margin-top）
// 設計ノートの表の高さを測る { key（段階の読み方と下の空き）, secs: [{ head（表の見出し〔h3〕と表の見出しの行）, hs（行の高さ） }] }
function measureNoteSections(sections, aw) {
  const probe = measureBox(NOTE_KEY_HTML + sections.map((sec) => `<div>${noteSecHead(sec, false)}${sec.table(sec.rows)}</div>`).join(''), aw);
  const top = (el) => el.getBoundingClientRect().top;
  const blocks = [...probe.children].slice(1);
  const out = {
    key: top(blocks[0]) - top(probe.firstElementChild),
    secs: blocks.map((b) => ({
      head: top(b.querySelector('tbody')) - top(b),
      hs: [...b.querySelectorAll('tbody tr')].map((tr) => tr.getBoundingClientRect().height),
    })),
  };
  probe.remove();
  return out;
}
const noteSecHead = (sec, cont) => `<h3 class="xp-doc-h3">${sec.title}${cont ? '（続き）' : ''}<small>${sec.count}</small></h3>`;
// 設計ノートのページ（分けたページごと）。firstPage はこのページの番号、total は説明書の全体のページ数
function noteDocPagesHtml(y, P, pages, sub, firstPage, total) {
  return pages.map((chunks, k) => pageFrame({ P, title: k ? '設計ノート（続き）' : '設計ノート',
    sub: (chunks.some((c) => c.cut) ? '長い行は途中まで（全文はアプリの設計ノートで見られます）・' : '') + sub,
    body: (k ? '' : NOTE_KEY_HTML) + chunks.map((c) => noteSecHead(c.sec, c.cont) + c.sec.table(c.rows)).join(''),
    left: `${esc(y.name)} ／ 設計ノート`, right: `${firstPage + k} / ${total}` }));
}

// 説明書の中身を組む。opts { paper, orient, systemCover, swimlane, notes（システムのページ）, cover, map, items, process, flow（画面設計ごとのページ） }。
// 戻り値 { P, pages, total, html, included: { systemCover, swimlane, notes }, designs: [{ id, name, firstPage, pages, included: { cover, map, items, process, flow } }] }。
// 画面設計ごとのページは exportDocument で組み（番号は通し番号、矢印の印の id の頭は画面設計ごとに '-d1'・'-d2'…）、画面のページはいつも全部入れる
function exportSystemDocument(y, state, opts, exportedAt = nowIso()) {
  const P = paperSize(opts.paper, opts.orient);
  const measured = canMeasure();
  const { aw, ah } = pageBodySize(P, measured);
  const can = systemDocCan(y, state);
  const included = { systemCover: !!opts.systemCover, swimlane: !!opts.swimlane && can.swimlane, notes: !!opts.notes && can.notes };
  const per = { paper: opts.paper, orient: opts.orient, cover: !!opts.cover, map: !!opts.map, items: !!opts.items, process: !!opts.process, flow: !!opts.flow };
  const notes = included.notes ? noteDocSections(y) : { sub: '', sections: [] };
  const notePages = splitNoteSections(notes.sections, aw, ah, measured);
  const plan = systemDocPlan(y, state, P, { included, per, notePages: notePages.length, measured, ah, exportedAt });
  const pages = plan.coverChunks.map((rows, k) => (k === 0 ? systemCoverHtml(y, state, P, rows, plan.total, exportedAt, { descCut: plan.descCut, roleMax: plan.roleMax })
    : systemCoverContHtml(y, P, rows, k + 1, plan.total)));
  if (included.swimlane) pages.push(swimlanePageHtml(y, state, P, { aw, ah, measured }, plan.swimlanePage, plan.total));
  const designs = plan.designs.map((r, k) => {
    const doc = exportDocument(r.d, state, { ...per, pageStart: r.firstPage, grandTotal: plan.total, idTag: '-d' + (k + 1) }, exportedAt);
    pages.push(...doc.pages);
    return { id: r.d.id, name: r.d.name, firstPage: r.firstPage, pages: doc.pages.length, included: doc.included };
  });
  pages.push(...noteDocPagesHtml(y, P, notePages, notes.sub, plan.notesPage, plan.total));
  return { P, pages, total: plan.total, included, designs, html: printDocumentHtml(`${y.name}_説明書`, P, pages.join('\n')) };
}
// 説明書のページの並べ方。画面設計ごとのページの数を数え（countOnly）、表紙を分けてから番号を決め直す（exportLayout と同じ 2 回の形）。
// 戻り値 { swimlanePage, designs: [{ d, firstPage, pages, others }], notesPage, total, coverChunks, descCut, roleMax（表紙に入る役割の数。null は全部） }
function systemDocPlan(y, state, P, { included, per, notePages, measured, ah, exportedAt }) {
  const dl = designsOfSystem(state, y).map((d) => ({ d, pages: exportDocument(d, state, { ...per, countOnly: true }).total,
    others: systemsOf(state, d.id).filter((x) => x.id !== y.id).map((x) => x.name) }));
  const numbering = (coverPages) => {
    let n = coverPages;
    const swimlanePage = included.swimlane ? ++n : 0;
    const designs = dl.map((r) => { const firstPage = n + 1; n += r.pages; return { ...r, firstPage }; });
    const notesPage = notePages ? n + 1 : 0;
    return { swimlanePage, designs, notesPage, total: n + notePages };
  };
  let plan = numbering(included.systemCover ? 1 : 0);
  if (!included.systemCover) return { ...plan, coverChunks: [], descCut: false, roleMax: null };
  const descCut = measured && !!y.description.trim() && coverDescOver(systemCoverHtml(y, state, P, [], 1, exportedAt));
  const roleMax = measured ? coverRoleFit(systemCoverHtml(y, state, P, systemCoverRows(plan).slice(0, 1), 1, exportedAt, { descCut }), P) : null;
  const coverHtml = (rows) => systemCoverHtml(y, state, P, rows, 99, exportedAt, { descCut, roleMax });
  let coverChunks = splitCoverRows(coverHtml, P, systemCoverRows(plan), measured, ah);
  if (coverChunks.length > 1) {
    plan = numbering(coverChunks.length);
    coverChunks = splitCoverRows(coverHtml, P, systemCoverRows(plan), measured, ah);
  }
  return { ...plan, coverChunks, descCut, roleMax };
}

// PNG にする文書（画面ごとに 1 つ。ページの枠なし・縮めない・まわりに白の余白）。戻り値 [{ name, html, width, height }]。
// diffRevId（比べる版の行の id）を渡すと、違いの札と削除した部品を入れる。parts（{ table, callouts }）は screenComposite へ渡す
function exportPngDocs(d, state, screenIds = null, diffRevId = null, parts = {}) {
  const measured = canMeasure();
  const df = diffRevId ? exportDiff(d, state, diffRevId) : null;
  return d.screens.map((s, i) => ({ s, i })).filter(({ s }) => !screenIds || screenIds.includes(s.id)).map(({ s, i }) => {
    const info = df ? df.result.screens[s.id] : null;
    const comp = screenComposite(d, s, 'g' + (i + 1), measured, info && { info, label: df.label }, parts);
    const width = comp.cw + PNG_MARGIN * 2;
    const height = comp.ch + PNG_MARGIN * 2;
    const body = `<div class="xp-png" style="width:${width}px;height:${height}px">`
      + `<div class="xp-stage" style="position:absolute;left:${PNG_MARGIN}px;top:${PNG_MARGIN}px;width:${comp.cw}px;height:${comp.ch}px">${comp.html}</div></div>`;
    const html = pngDocHtml(`${d.name} ／ ${s.name}`, body);
    return { name: `${safeFileName(d.name)}_${pad2(i + 1)}_${safeFileName(s.name, '画面')}.png`, width, height, html };
  });
}

// PNG にする文書の骨組み（アプリと同じ style・白の背景）
const pngDocHtml = (title, body) => '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<title>' + esc(title) + '</title>\n<style>' + APP_STYLE
  + '\nhtml,body{margin:0;background:#fff}\n</style>\n</head>\n<body class="xp-doc">\n' + body + '\n</body>\n</html>\n';

// 図の凡例（AI の図の画像。第 8 段階。スイムレーン図は第 9 段階）
const VIEW_TITLES = { map: 'つながりの図', process: 'ステータスの移り方', flow: '画面の移り方', swimlane: 'スイムレーン図' };
const VIEW_LEGENDS = {
  map: '<span><i></i>ルックアップ・関連レコード一覧（値が流れる向き）</span><span><i class="d"></i>項目の取り込み</span><span><i class="x"></i>一覧にないデータベース</span>',
  process: '<span><i></i>先へ進む操作</span><span><i class="b"></i>前へ戻る操作（差し戻しなど）</span>',
  flow: '<span><i></i>ボタン</span><span><i class="g"></i>リンクの文字</span><span><i class="x"></i>ほかの画面設計の画面</span>',
  swimlane: '<span><i></i>流れ</span><span><i class="b"></i>戻る流れ（差し戻しなど）</span>'
    + '<span>箱の形: 角の丸い箱＝始まり・終わり／ひし形＝判断／左右が二重線＝システムへの入力／下が波＝書類</span>',
};
// 図の HTML（mapHtml・viewHtml・swimlaneHtml）の、箱と線と矢印の文字と帯（スイムレーン図）のある所（まわりに 16 の余白）。
// 戻り値 { x0, y0, cw, ch }。箱も帯もなければ null。線は曲げる点まで数える（線の形より少し広くなるが、切れない）
function diagramCrop(html) {
  const xs = [];
  const ys = [];
  const rects = (re) => [...html.matchAll(re)].forEach((m) => {
    const [x, y, w, h] = m.slice(1).map(Number);
    xs.push(x, x + w);
    ys.push(y, y + h);
  });
  rects(/class="mnode[^"]*"[^>]*style="left:(-?[\d.]+)px;top:(-?[\d.]+)px;width:([\d.]+)px;height:([\d.]+)px"/g);
  // SVG の rect（矢印の文字の下地と、スイムレーン図の帯）。ほかの図では、箱がなければ rect もない
  rects(/<rect x="(-?[\d.]+)" y="(-?[\d.]+)" width="([\d.]+)" height="([\d.]+)"/g);
  if (!xs.length) return null;
  [...html.matchAll(/<path d="([^"]+)"[^>]*marker-end=/g)].forEach((m) => {
    const n = (m[1].match(/-?[\d.]+/g) || []).map(Number);
    for (let i = 0; i + 1 < n.length; i += 2) {
      xs.push(n[i]);
      ys.push(n[i + 1]);
    }
  });
  const m = html.match(/class="map-inner[^"]*"[^>]*style="width:([\d.]+)px;height:([\d.]+)px"/); // スイムレーン図は class="map-inner swim-inner"
  const [mw, mh] = m ? [Number(m[1]), Number(m[2])] : [Infinity, Infinity];
  const pad = 16;
  const [x0, y0] = [Math.max(0, Math.min(...xs) - pad), Math.max(0, Math.min(...ys) - pad)];
  const [x1, y1] = [Math.min(mw, Math.max(...xs) + pad), Math.min(mh, Math.max(...ys) + pad)];
  return { x0, y0, cw: Math.ceil(x1 - x0), ch: Math.ceil(y1 - y0) };
}
// 図の画像の文書（AI の get_view_image。ページの枠なし・縮めない・上に凡例・まわりに白の余白）。view は 'map'・'process'・'flow'。
// 戻り値 { html, width, height, boxes（箱の数）, arrows（矢印の数）}
function viewImageDoc(d, state, view) {
  const model = view === 'map' ? mapModel(state, d.id) : view === 'process' ? processModel(d) : flowModel(state, d);
  const html = view === 'map' ? mapHtml(state, d.id, d.mapPos || {}, { idPrefix: 'xi-map' }).replace(' id="map-inner"', '')
    : viewHtml(view, state, d, d[VIEW_POS[view]] || {}, { idPrefix: 'xi-' + view, bare: true });
  return diagramImageDoc(`${d.name} ／ ${VIEW_TITLES[view]}`, VIEW_LEGENDS[view], html, { boxes: model.nodes.length, arrows: model.edges.length });
}
// スイムレーン図の画像の文書（AI の get_view_image。第 9 段階）。題はシステムの名前。戻り値は viewImageDoc と同じ形。
// 凡例が長い（箱の形の意味まで書く）ので、凡例が 1 行に収まるように、画像の幅を 880 + 余白より狭くしない
function swimlaneImageDoc(state, sys) {
  const model = swimlaneModel(state, sys);
  const html = swimlaneHtml(state, sys, { idPrefix: 'xi-swim', bare: true });
  return diagramImageDoc(`${sys.name} ／ ${VIEW_TITLES.swimlane}`, VIEW_LEGENDS.swimlane, html, { boxes: model.nodes.length, arrows: model.edges.length }, 880);
}
// 図の画像の文書の骨組み（ページの枠なし・縮めない・上に凡例・まわりに白の余白）。図の HTML の箱のある所（diagramCrop）を切り出す。
// 箱がなければ（案内の文だけのとき）480 × 120 を切り出す。minW は図の部分の幅の下限。counts（{ boxes, arrows }）は戻り値にそのまま入れる
function diagramImageDoc(title, legend, html, counts, minW = 480) {
  const c = diagramCrop(html) || { x0: 0, y0: 0, cw: 480, ch: 120 };
  const LEGEND_H = 28;
  const width = Math.max(c.cw, minW) + PNG_MARGIN * 2;
  const height = c.ch + LEGEND_H + PNG_MARGIN * 2;
  const body = `<div class="xp-png" style="width:${width}px;height:${height}px">`
    + `<div class="xp-legend" style="position:absolute;left:${PNG_MARGIN}px;top:${PNG_MARGIN}px">${legend}</div>`
    + `<div style="position:absolute;left:${PNG_MARGIN}px;top:${PNG_MARGIN + LEGEND_H}px;width:${c.cw}px;height:${c.ch}px;overflow:hidden">`
    + `<div style="position:absolute;left:${-c.x0}px;top:${-c.y0}px">${html}</div></div></div>`;
  return { html: pngDocHtml(title, body), width, height, ...counts };
}

// ── 出力する HTML（単体で開いて編集できる HTML。q37）──
// 写しの中の、ほかの画面設計を指す名前（ルックアップ元・関連レコード一覧の元）を今の名前に直す。
// 名前は選んだときの控えで、後の名前の変更に追いついていない。単体で開いたときは元がないので、この控えの名前で出す
function refreshRefNames(copy, state) {
  const live = (design, ref) => {
    const it = design && ref && ref.itemId ? findItem(design, ref.itemId) : null;
    if (it) ref.name = it.name;
  };
  const fixDb = (db) => {
    const src = db && db.designId ? findDesign(state, db.designId) : null;
    if (src) db.name = src.name;
    return src;
  };
  copy.items.forEach((it) => {
    if (!it.lookup) return;
    const src = fixDb(it.lookup.db);
    live(src, it.lookup.key);
    it.lookup.copies.forEach((c) => { live(src, c.from); live(copy, c.to); });
  });
  copy.screens.forEach((s) => s.parts.forEach((p) => {
    if (p.type !== 'table' || !isObj(p.props)) return;
    if (p.tableKind === 'records') (p.props.columns || []).forEach((c) => live(copy, c.ref));
    if (p.tableKind !== 'related' || !isObj(p.props.db)) return;
    const src = fixDb(p.props.db);
    if (isObj(p.props.cond)) { live(src, p.props.cond.from); live(copy, p.props.cond.to); }
    (p.props.columns || []).forEach((c) => live(src, c.ref));
  }));
}
// つながりの図に要る、ほかの画面設計の短い写し（その画面設計の名前・作る先・数と、この画面設計を指すルックアップ・取り込み・関連レコード一覧）
function peersOf(d, state) {
  return mapModel(state, d.id).nodes.filter((n) => n.design && n.design.id !== d.id && !n.design.peer).map(({ design: p }) => {
    const items = p.items.filter((it) => (it.lookup && it.lookup.db.designId === d.id) || (it.link && it.link.designId === d.id))
      .map((it) => ({ id: it.id, name: it.name, type: it.type, lookup: it.lookup ? clone(it.lookup) : null, link: it.link ? clone(it.link) : null }));
    const related = [];
    p.screens.forEach((s) => s.parts.forEach((pt) => {
      if (pt.type === 'table' && pt.tableKind === 'related' && isObj(pt.props) && isObj(pt.props.db) && pt.props.db.designId === d.id) related.push({ label: str(pt.label), db: clone(pt.props.db) });
    }));
    return { id: p.id, name: p.name, target: p.target, itemCount: p.items.length, screenCount: p.screens.length, items, related };
  });
}
function normalizePeers(raw) {
  return (Array.isArray(raw) ? raw : []).filter((p) => isObj(p) && str(p.id)).map((p) => ({
    id: str(p.id),
    name: cleanName(p.name) || '名前なし',
    target: str(p.target),
    itemCount: Math.max(0, Math.floor(Number(p.itemCount)) || 0),
    screenCount: Math.max(0, Math.floor(Number(p.screenCount)) || 0),
    items: (Array.isArray(p.items) ? p.items : []).filter(isObj).map((it) => ({ id: str(it.id), name: str(it.name), type: str(it.type), lookup: normalizeLookup(it.lookup), link: normalizeLink(it.link) })),
    related: (Array.isArray(p.related) ? p.related : []).filter(isObj).map((r) => ({ label: str(r.label), db: normalizeDb(r.db) })),
  }));
}
// 単体で開いたときの、つながりの図の仮の画面設計（この HTML にない画面設計。押しても開かない）
function peerDesigns(state) {
  if (!standalone) return [];
  return standalone.peers.filter((p) => !findDesign(state, p.id)).map((p) => ({
    ...p, peer: true, trashedAt: null,
    screens: [{ id: 'peer-' + p.id, parts: p.related.map((r) => ({ type: 'table', tableKind: 'related', label: r.label, props: { db: r.db } })) }],
  }));
}
// 画面設計の写し。改訂履歴の行は残し、版の写し（snapshot）は外す（出力する HTML には入れない）
const withoutSnapshots = (d) => clone({ ...d, revisions: d.revisions.filter(isObj).map((r) => ({ ...r, snapshot: undefined })) });
// 埋め込むデータ。revisions の写し（snapshot）は入れない。作る先の自由な名前は、この画面設計の作る先だけを入れる。
// diffRevId（比べる版の行の id）を渡すと、その版の写しだけを diffBase として入れる（開いたときに「新」「変」の札を出すため。第 6 段階）
function embedPayload(d, state, { diffRevId = null } = {}) {
  const copy = withoutSnapshots(d);
  refreshRefNames(copy, state);
  const r = diffRevId ? findRevision(d, diffRevId) : null;
  // 比べる版の写しも、名前の控えを今の名前に直す（今の中身と同じ直し方にしないと、版の後にルックアップ元の名前を変えただけで「変」になる）
  const diffSnap = isVersionRow(r) && hasSnapshot(r) ? clone(r.snapshot) : null;
  if (diffSnap) refreshRefNames(diffSnap, state);
  return {
    format: EMBED_FORMAT, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: nowIso(), baseUpdatedAt: d.updatedAt,
    baseHash: shortHash(comparableContent(d, state)), // 出力したときの中身の印（取り込むときに、こちらでも変えたかを見る）
    data: { schemaVersion: SCHEMA_VERSION, settings: { customTargets: d.target && !builtinTarget(d.target) ? [d.target] : [], mapPos: {} }, designs: [copy] },
    peers: peersOf(d, state),
    screenPeers: screenPeersOf(d, state), // 移る先のほかの画面設計の名前と画面（第 8 段階）
    ...(diffSnap ? { diffBase: { title: revisionTitle(r), day: revisionDay(r), snapshot: diffSnap } } : {}),
  };
}
// 単体で開いた HTML を保存し直すときのデータ（出力したときの日時・元の更新日時・ほかの画面設計の写しは、そのまま持ち回る）
function resavePayload(d, state) {
  const copy = withoutSnapshots(d);
  return {
    format: EMBED_FORMAT, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: standalone.exportedAt, baseUpdatedAt: standalone.baseUpdatedAt,
    baseHash: standalone.baseHash, savedAt: nowIso(),
    // 作る先の自由な名前は、この画面設計の作る先だけを入れる（「その他」に試しに書いた名前を、取り込む側の選択肢に増やさないため）
    data: { schemaVersion: SCHEMA_VERSION, settings: { customTargets: d.target && !builtinTarget(d.target) ? [d.target] : [], mapPos: {} }, designs: [copy] },
    peers: standalone.peers,
    screenPeers: standalone.screenPeers,
    ...(standalone.diffBase ? { diffBase: standalone.diffBase.raw } : {}), // 違いの札の元にする版も、そのまま持ち回る
  };
}
// アプリの HTML と同じ骨組みに、style・埋め込むデータ・script を入れる。埋め込むデータの「<」は JSON の書き方の < に逃がす（script の終わりの印で切れないように）。
// この script の中には、script の始まりと終わりの印をそのまま書かない（HTML の解析で、この script が途中で切れるため）
function standaloneHtml(title, payload) {
  const json = JSON.stringify(payload).replace(/</g, '\\u003c');
  const open = '<' + 'script';
  const close = '<' + '/script>';
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>' + esc(title) + '</title>\n<style>' + APP_STYLE + '</style>\n'
    + open + ' type="application/json" id="' + EMBED_ID + '">' + json + close + '\n</head>\n<body>\n'
    + '<div id="banner" hidden></div>\n<div id="app"></div>\n<div id="dialog-root"></div>\n<div id="toast" hidden></div>\n'
    + open + '>' + APP_SCRIPT + close + '\n</body>\n</html>\n';
}
const buildStandaloneHtml = (d, state, opts = {}) => standaloneHtml(d.name, standalone ? resavePayload(d, state) : embedPayload(d, state, opts));

// HTML の文字を保存する（ブラウザ）。Chrome・Edge は保存の窓で場所と名前を選ぶ（文字を先に作ってから窓を開き、すぐ書く。
// 引継書 7-1: 選んだファイルは書くまで空になり、書き込みの許可は押してから約 5 秒しか求められない）。ほかのブラウザはダウンロード
async function saveHtmlInBrowser(html, name) {
  if (typeof window.showSaveFilePicker === 'function') {
    let handle = null;
    try {
      handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'HTML ファイル', accept: { 'text/html': ['.html', '.htm'] } }] });
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, canceled: true };

  const r = await showDialog({
    title: `「${y.name}」の説明書を出力`,
    okLabel: '出力…',
    width: 680,
    body: systemDocDialogBody(y, can),

      syncSlideOrient(m, 'dp-paper', 'dp-orient');

    collect(m) {

        orient: (m.querySelector('[name="dp-orient"]:checked') || {}).value || 'landscape',
        openAfter: !!m.querySelector('[data-dopen]').checked,

      return r2;
    },

  Object.assign(docOpts, { paper: r.paper, orient: r.paper === 'slide' ? docOpts.orient : r.orient, openAfter: r.openAfter });
  DOC_PAGE_KEYS.forEach((k) => { if (!systemDocWhy(k, can)) docOpts[k] = r[k]; });
  // 窓を開いている間に、ごみ箱へ移った・消えたときは出力しない（人の操作で起きうる。窓が開いている間、AI の書く頼みは断る）
  const now = findSystem(store.state, sysId);

  return runSystemDoc(sysId, r);

// 説明書を出力する。r は説明書の窓の結果（docOpts と同じ名前）。保存の窓の結果はお知らせで伝える（キャンセルは何も出さない）
async function runSystemDoc(sysId, r) {
  const y = findSystem(store.state, sysId);
  const api = window.exportAPI;
  if (!y || !api) return null;
  docWaiting.add(sysId);
  try {
    toast('説明書（PDF）を作っています…');
    const doc = exportSystemDocument(y, store.state, r);
    const res = await api.savePdf({ name: `${safeFileName(y.name, 'システム')}_説明書.pdf`, html: doc.html, pageSize: { width: doc.P.wi, height: doc.P.hi }, open: !!r.openAfter });
    if (res && !res.canceled) toast(res.ok ? `説明書（PDF）を出力しました（${res.path}）。` : `説明書（PDF）を出力できませんでした（${res.error || 'わからない理由'}）。`);
    return res;
  } finally {
    docWaiting.delete(sysId);
  }
}

// 出力した HTML を読む。戻り値 { payload, design, customTargets } か { error }
function parseExportedHtml(text) {
  if (typeof text !== 'string' || !text.trim()) return { error: 'ファイルが空です。' };
  if (text.length > IMPORT_MAX_CHARS) return { error: 'ファイルが大きすぎます（50MB まで）。' };
  let doc;
  try {
    doc = new DOMParser().parseFromString(text, 'text/html');
  } catch (_) {
    return { error: 'HTML として読めませんでした。' };
  }
  const el = doc.getElementById(EMBED_ID);
  if (!el) return { error: 'モックイメージメーカーで出力した HTML ではありません（画面設計のデータが入っていません）。' };
  let payload;
  try {
    payload = JSON.parse(el.textContent);
  } catch (_) {
    return { error: 'HTML に入っている画面設計のデータが壊れています。' };
  }
  if (!isObj(payload) || payload.format !== EMBED_FORMAT) return { error: 'モックイメージメーカーで出力した HTML ではありません。' };
  const v = Number(payload.schemaVersion);
  if (!Number.isInteger(v) || v < 1) return { error: 'HTML に入っている画面設計のデータの版が正しくありません。' };
  if (v > SCHEMA_VERSION) return { error: `新しい版のアプリで出力した HTML です（データの形の版 ${v}。この版のアプリが分かるのは ${SCHEMA_VERSION} まで）。新しい版のアプリで取り込んでください。` };
  let migrated;
  try {
    migrated = migrate(payload.data);
  } catch (e) {
    return { error: '画面設計のデータを今の形に直せませんでした（' + (e.message || e) + '）。' };
  }
  if (migrated.blockReason) return { error: migrated.blockReason };
  if (migrated.state.designs.length !== 1) return { error: 'HTML に入っている画面設計が見つかりません。' };
  return { payload, design: migrated.state.designs[0], customTargets: migrated.state.settings.customTargets };
}

// 中身の短い印（受け渡しで「出力した後に、こちらでも変えたか」を見るため。FNV-1a を 2 本並べた 16 桁）
function shortHash(text) {
  let a = 0x811c9dc5;

    b = Math.imul(b ^ c, 0x5bd1e995);

    const hit = Array.isArray(states) ? states.find((x) => x.id === p.view.current) : null;

// 今の中身が同じなら、変えていない（元に戻すで戻した変更や、2 回目の取り込みも正しく分かるように、更新日時でなく中身で比べる）。

// 出力した HTML の文字を取り込む。戻り値 { status: 'added'|'replaced'|'copied'|'same'|'canceled'|'error', designId?, error? }。
// systemId を渡すと、新しく足すとき（一覧にない・別の画面設計として足す）だけ、そのシステムに入れる（システムのまとまりの上にファイルを落としたとき。

async function importHtmlText(text, { systemId = null } = {}) {
  const r = parseExportedHtml(text);
  if (r.error) { toast(r.error); return { status: 'error', error: r.error }; }
  const { payload, design: incoming } = r;
  const existing = findDesign(store.state, incoming.id);
  if (!existing) {
    // 一覧になければ、同じ id のまま足す（次に取り込むときに、同じ画面設計だと分かるように）。作る先の自由な名前は、この画面設計の作る先だけを足す
    store.commit((s) => {
      s.designs.push({ ...clone(incoming), trashedAt: null, updatedAt: nowIso() });
      addCustomTarget(s, incoming.target);
      syncLinkedItems(s);
      const d = findDesign(s, incoming.id);
      d.exchangeHash = shortHash(comparableContent(d, s));
      if (systemId) putIntoSystem(s, systemId, d.id);
    });
    toast(`「${incoming.name}」を一覧に足しました。`);
    return { status: 'added', designId: incoming.id };
  }
  if (sameAfterImport(existing, incoming)) {
    // ごみ箱にあれば、中身は変えずに一覧に戻す（何も起きないと、一覧を探しても見つからないため）
    if (existing.trashedAt) {
      actions.restoreDesign(existing.id);
      toast(`「${existing.name}」はごみ箱にありました。取り込む HTML と同じ中身なので、中身は変えずに一覧に戻しました。`);
      return { status: 'restored', designId: existing.id };
    }
    toast(`「${existing.name}」と同じ中身なので、取り込みませんでした。`);
    return { status: 'same', designId: existing.id };
  }
  const how = await openImportConfirmDialog(existing, incoming, payload);
  if (!how) return { status: 'canceled' };
  if (how === 'copy') {
    const copy = duplicateDesignData(incoming);
    copy.name = importedCopyName(incoming.name);
    store.commit((s) => {
      s.designs.push(copy);
      addCustomTarget(s, copy.target);
      syncLinkedItems(s);
      if (systemId) putIntoSystem(s, systemId, copy.id);
    });
    toast(`「${copy.name}」として一覧に足しました。`);
    return { status: 'copied', designId: copy.id };
  }
  store.commit((s) => replaceWithImported(s, incoming));
  toast(`「${incoming.name}」を、取り込んだ中身に置き換えました。前の中身は改訂履歴に「取り込む前の状態」として残しています（元に戻す〔Ctrl+Z〕でも戻せます）。`);
  return { status: 'replaced', designId: incoming.id };
}

// ブラウザは隠した input
async function pickHtmlText() {
