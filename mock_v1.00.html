function aiWarnHtml() {
  const w = aiView.warn;
  if (!w) return '';
  const open = ui.view === 'editor' ? currentDesign() : null;
  let text = `<b>${esc(w.label)}</b> が「${esc(w.name)}」を${w.created ? '作った' : '直した'}ので、元に戻す（Ctrl+Z）の履歴を消しました。`;
  if (open && !w.openChanged) text += `開いている「${esc(open.name)}」は変わっていません。`;
  if (!w.created) text += `<br>AI の変更を戻すときは、「${esc(w.name)}」の改訂履歴の「${esc(w.label)} が直す前の状態」から戻せます。`;
  const btn = w.created
    ? `<button class="btn small" data-action="ai-open-design" data-id="${esc(w.designId)}">「${esc(w.name)}」を開く</button>`
    : `<button class="btn small" data-action="ai-open-revisions" data-id="${esc(w.designId)}">「${esc(w.name)}」の改訂履歴を開く</button>`;
  return `<div class="ai-band warn" id="ai-warn" role="status"><span class="ic">⚠</span><span>${text}</span><span class="spacer"></span>${btn}${aiCloseBtn('ai-warn-close')}</div>`;
}

// 画面ごとの印（designDiff の screens から）。AI が足した画面は、全部の部品と吹き出しを「足した」にする
function aiScreenMarks(diff, s) {
  const info = diff && diff.screens[s.id];
  if (!info) return { parts: {}, callouts: {} };
  if (!info.isNew) return { parts: info.parts, callouts: info.callouts };
  return { parts: Object.fromEntries(s.parts.map((p) => [p.id, 'new'])), callouts: Object.fromEntries(s.callouts.map((c) => [c.id, 'new'])) };
}
const aiHasMarks = (m) => Object.keys(m.parts).length + Object.keys(m.callouts).length > 0;
// 光らせ始めてからの時間。描き直しても光り方が続くように、CSS のアニメーションを経った分だけ進めて始める
const aiGlowElapsed = (at) => (at == null ? AI_GLOW_MS : Math.max(0, Date.now() - at));
const aiGlowClass = (at) => (aiGlowElapsed(at) < AI_GLOW_MS ? ' ai-glow' : '');
const aiGlowStyle = (at) => (aiGlowElapsed(at) < AI_GLOW_MS ? ` style="animation-delay:-${aiGlowElapsed(at)}ms"` : '');

// 開いている画面の、AI が足した・直した部品と吹き出しに札を付け、光らせる（renderStage の最後に呼ぶ）
function markAiParts(s) {
  const b = aiView.band;
  if (!b || b.kind !== 'edited' || b.designId !== ui.designId || store.isViewing) return;
  const marks = aiScreenMarks(b.diff, s);
  if (!aiHasMarks(marks)) return;
  const elapsed = aiGlowElapsed(aiView.glow.get(s.id));
  const mark = (el, kind, inside) => {
    el.insertAdjacentHTML('beforeend', `<span class="ai-tag${inside ? ' ai-in' : ''}">${kind === 'new' ? 'AI が足した' : 'AI が直した'}</span>`);
    if (elapsed >= AI_GLOW_MS) return;
    el.classList.add('ai-glow');
    el.style.animationDelay = `-${elapsed}ms`;
  };
  // 画面の上の端の部品は、札が画面の外で切れないように、部品の内側に出す
  document.querySelectorAll('#stage .screen .part[data-part-id]').forEach((el) => {
    const k = marks.parts[el.dataset.partId];
    if (k) mark(el, k, parseFloat(el.style.top) < 24);
  });
  document.querySelectorAll('#stage .callout[data-callout-id]').forEach((el) => {
    const k = marks.callouts[el.dataset.calloutId];
    if (k) mark(el, k, false);
  });
}
// AI の印を付けた画面を開いたら、光らせ始めて印を消す
function aiSeeScreen(id) {
  if (aiView.unseen.delete(id)) aiView.glow.set(id, Date.now());
}
// 一覧の画面のカードの印。まだ一覧に出していない印は、初めて出すときに光らせ始める
function aiCardMark(id) {
  const m = aiView.cards.get(id);
  if (m && m.at == null) m.at = Date.now();
  return m || null;
}

// 直す前の様子を控える（aiWrite の batch の前）。開いている画面設計の写しは、光らせる部品と紫の帯の件数を決めるのに使う
function aiViewBefore(S) {
  const openId = ui.view === 'editor' ? ui.designId : null;
  const open = openId ? findDesign(S, openId) : null;
  if (!open) return { open: null };
  const keep = aiView.band && aiView.band.kind === 'edited' && aiView.band.designId === openId;
  const snap = designSnapshot(open);
  return { open: openId, content: designContent(open), json: designJsonWithRefs(open), snap, base: keep ? aiView.band.base : snap };
}
// AI が直した後の知らせ（aiWrite で、中身が変わったときに呼ぶ）。mode は元に戻すの履歴の扱い（true か 'clear'）
function aiAfterWrite(tx, mode, hadHistory, beforeMap, seen) {
  const S = store.state;
  const label = aiClientLabel(tx.ctx.client);
  const target = findDesign(S, tx.createdDesign || (tx.design && tx.design.id));
  const created = !!tx.createdDesign;
  // 一覧の画面のカードの印（一覧の画面に出すときに光らせる）
  S.designs.filter((x) => beforeMap.get(x.id) !== designJsonWithRefs(x)).forEach((x) => {
    const was = aiView.cards.get(x.id);
    aiView.cards.set(x.id, { kind: x.id === tx.createdDesign || (was && was.kind === 'created') ? 'created' : 'edited', at: ui.view === 'home' ? Date.now() : null });
  });
  const open = seen.open ? findDesign(S, seen.open) : null;
  const openChanged = !!open && designContent(open) !== seen.content;
  if (openChanged) aiNoteOpenEdited(open, seen, label, mode === true);
  else if (open && designJsonWithRefs(open) !== seen.json) toast(`${label} が「${open.name}」を改訂しました（${revisionLabel(open)}）。`); // 改訂履歴に版を足しただけ
  // 元に戻すの履歴を消したら、前に出した紫の帯（開いている画面設計）の「元に戻す」は出さない（押しても戻らないため）
  if (mode === 'clear' && aiView.band && aiView.band.kind === 'edited') aiView.band.undoable = false;
  if (mode === 'clear' && hadHistory) {
    aiView.warn = target ? { designId: target.id, name: target.name, label, created, openChanged } : null;
    aiView.cleared = target ? target.name : '画面設計';
  } else if (!openChanged && target && target.id !== seen.open) {
    aiView.band = { kind: created ? 'created' : 'other', designId: target.id, name: target.name, label };
  }
  aiView.undoMark = { len: store.undoStack.length, top: store.undoStack[store.undoStack.length - 1] };
  if (ui.view === 'home') renderHome();
  else updateEditor({ keepSide: true });
}
// 開いている画面設計を AI が直したとき: 紫の帯（件数は最初に直す前と今の違い）と、この 1 回で変わった部品を光らせる
function aiNoteOpenEdited(open, seen, label, undoable) {
  const diff = designDiff(seen.base, open, store.state);
  aiView.band = { kind: 'edited', designId: open.id, name: open.name, label, base: seen.base, diff, undoable };
  const now = designDiff(seen.snap, open, store.state);
  open.screens.forEach((s) => {
    if (!aiHasMarks(aiScreenMarks(now, s))) return;
    if (ui.panel === 'screen' && s.id === ui.screenId) {
      aiView.glow.set(s.id, Date.now()); // 開いている画面は、今から光らせる（開いている画面は切り替えない）
      aiView.unseen.delete(s.id);
    } else aiView.unseen.add(s.id); // ほかの画面は、左の一覧の縮小画像に「AI」の印
  });
}
// 人が直した（元に戻すの履歴が、紫の帯を出したときから変わった）ら、紫の帯と光らせる印を閉じる（onStoreChange の初めに呼ぶ）
function aiNoteStoreChange() {
  if (aiView.writing || !aiView.band || !aiView.undoMark) return;
  const m = aiView.undoMark;
  if (store.undoStack.length === m.len && store.undoStack[store.undoStack.length - 1] === m.top) return;
  aiCloseBand();
}
function aiCloseBand() {
  Object.assign(aiView, { band: null, undoMark: null });
  aiView.glow.clear();
  aiView.unseen.clear();
}
// 一覧の画面と編集の画面を行き来したときに、知らせを片付ける。一覧の画面から画面設計を開くときは、カードの印も消す（q50c）
function aiForgetView(leavingHome) {
  aiCloseBand();
  Object.assign(aiView, { warn: null, cleared: null });
  if (leavingHome) aiView.cards.clear();
}

function onAiClick(action, btn) {
  switch (action) {
    case 'ai-band-close':
      aiCloseBand();
      if (ui.view === 'home') renderHome();
      else updateEditor({ keepSide: true });
      return true;
    case 'ai-warn-close':
      aiView.warn = null;
      renderAiChrome();
      return true;
    case 'ai-show-changes': openAiChangesDialog().catch(reportPageError); return true;
    case 'ai-open-design':
      flushSideField();
      if (findDesign(store.state, btn.dataset.id)) openDesign(btn.dataset.id);
      return true;
    case 'ai-open-revisions':
      flushSideField();
      if (!(ui.view === 'editor' && ui.designId === btn.dataset.id)) {
        if (!findDesign(store.state, btn.dataset.id)) return true;
        openDesign(btn.dataset.id);
      }
      openRevisionsDialog().catch(reportPageError);
      return true;
  }
  return false;
}

// 紫の帯の「変更内容を見る」（AI が最初に直す前と今の違い。AI の書く頼みは止めない窓）
async function openAiChangesDialog() {
  const b = aiView.band;
  if (!b || b.kind !== 'edited') return;
  const rows = b.diff.rows;
  await showDialog({
    title: `${b.label} が「${b.name}」を直した内容`,
    width: 1080,
    okHidden: true,
    cancelLabel: '閉じる',
    aiPassive: true,
    body: rows.length ? `<p class="cg-title">${rows.length} 件</p><div class="cg-wrap">${changeTableHtml(rows)}</div>` : '<div class="cg-none">変わった所はありません。</div>',
  });
}

// 「AI とつなぐ」の窓（q49）。アプリのメニューの「ヘルプ > AI とつなぐ…」・タスクトレイのメニュー・紫の札から開く（ブラウザで開いたときは出さない）。
// 登録の文は main が作る（インストール先の実際の場所を入れる。開発版では開発版の文）。AI の書く頼みは止めない窓
function aiConnectStatusHtml() {
  const labels = aiClientLabels();
  return labels.length ? `<span class="ai-chip"><span class="dot"></span>今つながっている AI：${esc(labels.join('・'))}</span>` : '今つながっている AI はありません。';
}
async function openAiConnectDialog() {
  if (!window.aiAPI || !window.aiAPI.connectInfo) return;
  const info = await window.aiAPI.connectInfo();
  if (!info || isDialogOpen()) return;
  await showDialog({
    title: 'AI とつなぐ',
    width: 760,
    okHidden: true,
    cancelLabel: '閉じる',
    aiPassive: true,
    body: `
      <div class="aic-status" id="aic-status">${aiConnectStatusHtml()}</div>
      <p>Claude Code などの AI から、このアプリの画面設計を読んだり、作ったり、直したりできます（MCP というつなぎ方を使います）。
      使う前に、AI のアプリに、このアプリを 1 回だけ登録してください。</p>
      <div class="aic-sec">
        <h3>Claude Code に登録する<span class="spacer"></span><button class="btn small aic-copy" data-copy="claude">コピー</button></h3>
        <div class="hint">PowerShell に下の文を貼り付けて、1 回だけ実行します。</div>
        <div class="aic-code" data-code="claude">${esc(info.claudeCommand)}</div>
        <div class="hint">登録した後に Claude Code を起動し直すと使えます。起動している Claude Code では、<b>/mcp</b> でつなぎ直します。</div>
      </div>
      <div class="aic-sec">
        <h3>ほかの AI のアプリ（MCP に対応したもの）に登録する<span class="spacer"></span><button class="btn small aic-copy" data-copy="json">コピー</button></h3>
        <div class="hint">それぞれのアプリの説明に従って、MCP の設定に下の内容を書きます。</div>
        <div class="aic-code" data-code="json">${esc(info.json)}</div>
      </div>
      ${info.dev ? '<div class="aic-dev">これは開発版（npm start で動かしているアプリ）の文です。インストールした版のアプリでは、その版の「AI とつなぐ」に出る文を使ってください。</div>' : ''}
      <ul class="aic-notes">
        <li>AI が今ある画面設計を直すと、直す前の中身が改訂履歴に「AI が直す前の状態」として自動で残ります。そこから戻せます。</li>
        <li>AI には、画面設計の削除・ごみ箱へ移すこと・改訂履歴の行を消すことはさせません。</li>
        <li>アプリを新しい版に入れ替えるときは、先にアプリを終了してください（タスクトレイのアイコンの「終了」）。入れ替えた後は、Claude Code の <b>/mcp</b> でつなぎ直します。</li>
      </ul>`,
    init: (modal) => modal.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
      copyAiText(b, info[b.dataset.copy === 'claude' ? 'claudeCommand' : 'json']).catch(reportPageError);
    })),
  });
}
async function copyAiText(btn, text) {
  const ok = await window.aiAPI.copyText(String(text || ''));
  if (!ok) { toast('コピーできませんでした。文を選んで Ctrl+C でコピーしてください。'); return; }
  btn.textContent = '✓ コピーしました';
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 2000);
}

// ── 11. 起動 ──────────────────────────────────────────────────────────────────
function bindGlobalEvents() {
  const app = appEl();
  app.addEventListener('click', onAppClick);
  app.addEventListener('input', (e) => {
    // 選択肢を打っている間も、初期値の欄を今の選択肢に合わせておく（離れたときに初期値の欄を作り直すと、押した四角が消えるため）
    if (e.target.dataset && e.target.dataset.pf === 'props.options') { refreshChoiceInitial(parseOptions(e.target.value)); return; }
    if (e.target.id !== 'home-search') return;
    ui.query = e.target.value;
    refreshCards();
  });
  app.addEventListener('change', (e) => {
    if (e.target.closest('#side-panel') && !e.target.closest('.target-picker')) onSidePanelChange(e);
  });
  app.addEventListener('mousedown', (e) => {
    const node = e.button === 0 ? e.target.closest('.mnode') : null;
    if (node) { startMapDrag(e, node); return; }
    if (ui.view !== 'editor' || e.button !== 0) return;
    // 「…」・「＋ 画面を足す」・「…」のメニューの項目は、押した時点で右の欄を離れない（離れると打ちかけの文字の保存で画面の一覧が描き直され、
    // 押したボタンが click の前に消えて、1 回目の押しが効かないため）。打ちかけの文字は、押したときの処理の初めに保存する
    if (e.target.closest('.sl-more, .sl-add, .screen-menu button')) { e.preventDefault(); return; }
    if (ui.screenMenu) closeScreenMenu();
    // 前の版を見ている間は、置く・並べ替えるのドラッグを始めない（押して切り替える・選ぶだけ）
    if (store.isViewing) {
      const pick = e.target.closest('[data-action="select-part"], [data-action="select-screen"], [data-action="select-item"], [data-action="open-items"], [data-action="open-map"]');
      if (pick) onEditorClick(pick.dataset.action, pick);
      return;
    }
    // 部品の箱のボタンからのドラッグ（押しただけなら click で置く）
    const btn = e.target.closest('.pal-btn');
    if (btn) { startPlace(e, btn.dataset.type); return; }
    const itemBtn = e.target.closest('button.pal-item');
    if (itemBtn) {
      const item = findItem(currentDesign(), itemBtn.dataset.itemId);
      if (item) startPlace(e, item.type, item.id);
      return;
    }
    const grip = e.target.closest('#db-view [data-drag="item-sort"]');
    if (grip) { startItemSort(e, grip.closest('tr').dataset.id); return; }
    // 画面の縮小画像は、押した時点で切り替え（下の select-screen）、そのままドラッグすると並べ替える
    const slItem = e.target.closest('#screen-list .sl-item');
    if (slItem) startScreenSort(e, slItem.dataset.id);
    // 一覧表の行と画面の一覧は、押した時点で切り替える。右の欄で打ちかけの文字があると、離れたときの保存で
    // 一覧表と画面の一覧が描き直され、押した行・ボタンが click の前に消えて、1 回目の押しが効かないため
    if (e.target.closest('.del-x')) return;
    const sel = e.target.closest('[data-action="select-part"], [data-action="select-screen"], [data-action="select-item"], [data-action="open-items"], [data-action="open-map"]');
    if (sel) onEditorClick(sel.dataset.action, sel);
  });
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  window.addEventListener('resize', () => { if (ui.view === 'editor') { syncZoomSpacer(); closeScreenMenu(); closeRevMenu(); } }); // メニューの位置がボタンからずれるので閉じる
  // 画面の一覧を送ったときは、「…」のメニューを閉じる（「…」から離れるため。scroll は泡立たないので、捕まえる側で受ける）
  document.addEventListener('scroll', (e) => { if (e.target && e.target.id === 'screen-list') closeScreenMenu(); }, true);
  window.addEventListener('blur', flushSideField);
  // 閉じる前に、打ちかけの文字を保存する。単体で開いた HTML で保存していない変更があれば、閉じるのを止める（ブラウザの確かめが出る）
  window.addEventListener('beforeunload', (e) => {
    flushSideField();
    if (isStandaloneDirty()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  // ファイルを落としたとき（最初の画面なら HTML を取り込む。ほかの画面では、ページが置き換わらないように止める）
  document.addEventListener('dragover', onFileDragOver);
  document.addEventListener('drop', onFileDrop);
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('file-over'); });
}

async function boot() {
  const styleEl = document.querySelector('head > style');
  APP_STYLE = styleEl ? styleEl.textContent : '';
  // 書き出した HTML（画面設計が埋め込まれている）を開いたときは、単体で開いたときの形で起動する（q37。どこにも保存しない）
  const embedded = document.getElementById(EMBED_ID);
  const created = embedded ? createStandaloneStore(embedded) : await createAppStore();
  store = created.store;
  store.blockReason = created.blockReason || null;
  if (embedded) {
    if (created.blockReason) showBanner(created.blockReason + (created.failed ? '' : ' この HTML は、新しい版のアプリで開いてください。'));
  } else if (created.blockReason) showBanner(created.blockReason + ' 今のデータを消さないように、保存を止めています。');
  else if (created.notice) showBanner(created.notice);
  store.subscribe(onStoreChange);
  bindGlobalEvents();
  if (window.menuAPI) window.menuAPI.onCommand(runCommand);
  if (!embedded) renderHome();
  else if (!created.blockReason) openDesign(standalone.designId);
  bindAiEvents();
  exposeForTest();
}

// ── 12. テスト用の窓口 ────────────────────────────────────────────────────────
// テストの土台（test/harness.js）が起動の前に window.__test__ を置いたときだけ埋める
function exposeForTest() {
  if (!window.__test__) return;
  Object.assign(window.__test__, {
    store, ui, actions, runCommand, openDesign, goHome, migrate, normalizeState, snapHeight, changeDevice,
    visibleDesigns, trashedDesigns, resolveTargetName, DEVICES, SCHEMA_VERSION, STORAGE_KEY, APP_VERSION,
    PART_TYPES, PALETTE_GROUPS, fitRect, resizedRect, describePart, tableRows, renumberedParts, minScreenHeight, selectPart, currentScreen,
    currentDesign, currentPart, resolvePart, findItem, describeItem, mapModel, mapLayout, SCREEN_TEMPLATES,
    exportDocument, exportPngDocs, buildStandaloneHtml, embedPayload, parseExportedHtml, importHtmlText, openExportDialog, runExport,
    paperSize, safeFileName, saveStandalone, isStandaloneDirty, revisionLabel, exportOpts, peersOf, EMBED_ID, EMBED_FORMAT,
    designDiff, designFromSnapshot, nextVersionNo, latestVersion, openAddRevisionDialog, openRevisionsDialog, startViewRevision, leaveViewing,
    restoreRevisionWithConfirm, openDiffListDialog, editorDiff, todayDay,
    revisionTitle, revisionRow, DESIGN_CONTENT_KEYS, designContentOf, designContent, stateWithRefs, layoutPlacements, placePartIn,
    aiDispatch, AI_TOOLS, aiPage, aiState: () => aiState(), imeComposing: () => imeComposing, setDragForTest: (v) => { drag = v; },
    aiView, AI_ROWS_MAX, AI_GLOW_MS, AI_CLIENT_NAMES, aiChipText,
    standaloneInfo: () => standalone, appScript: () => APP_SCRIPT, appStyle: () => APP_STYLE,
    ready: true,
  });
}

// 起動の途中で例外が出たときは、真っ白のまま止まらないように、上の赤い帯で知らせる
boot().catch((e) => {
  console.error(e);
  showBanner('アプリを起動できませんでした（' + ((e && e.message) || e) + '）。');
});
