// ほかのモックから項目を取り込む窓（画像 q21）。左で元のモック（ごみ箱にない、ほかの画面設計）を選び、右で項目に印を付ける
async function openImportDialog() {
  const d = currentDesign();
  const sources = visibleDesigns(store.state).filter((x) => x.id !== d.id);
  let srcId = (sources.find((x) => x.items.length) || sources[0] || {}).id || null;
  let query = '';
  const checked = new Set();
  const stateLabel = { own: '<span class="tag done">このモックの項目</span>', done: '<span class="tag done">取り込み済み</span>', same: '<span class="tag warn">同じ名前の項目があります</span>',
    status: '<span class="tag done">ステータスはこのモックにもうあります</span>' };
  const leftHtml = () => {
    const q = cleanName(query).toLowerCase();
    const list = sources.filter((x) => !q || x.name.toLowerCase().includes(q));
    if (!list.length) return `<p class="imp-empty">${sources.length ? '名前に合う画面設計はありません。' : 'ほかの画面設計がありません。'}</p>`;
    return list.map((x) => `
      <button type="button" class="imp-design${x.id === srcId ? ' on' : ''}" data-imp-src="${esc(x.id)}">
        ${thumbHtml(x, x.screens[0], 62, 40)}
        <span><span class="nm">${esc(x.name)}</span><span class="mt">${targetChip(x.target)}項目 ${x.items.length} 個・${esc(fmtDateTime(x.updatedAt).slice(5, 10).replace('-', '/'))} 更新</span></span>
      </button>`).join('');
  };
  const rightHtml = () => {
    const src = findDesign(store.state, srcId);
    if (!src) return '<p class="imp-empty">左で、取り込む元のモックを選びます。</p>';
    if (!src.items.length) return `<p class="imp-empty">「${esc(src.name)}」には、まだ項目がありません。</p>`;
    return `<table><thead><tr><th></th><th>項目名</th><th>部品の種類</th><th>設定</th></tr></thead><tbody>${src.items.map((it) => {
      const st = importState(d, src, it);
      const dis = IMPORT_BLOCKED.includes(st);
      return `<tr${dis ? ' class="dis"' : ''}><td class="ck"><input type="checkbox" data-imp-item="${esc(it.id)}" aria-label="「${esc(it.name)}」を取り込む"${dis || checked.has(it.id) ? ' checked' : ''}${dis ? ' disabled' : ''}></td>
        <td>${esc(it.name)} ${stateLabel[st] || ''}</td><td>${esc(itemTypeName(it.type))}</td><td class="set">${esc(isItemType(it.type) ? describeItem(it, { design: src, state: store.state }) : '')}</td></tr>`;
    }).join('')}</tbody></table>`;
  };
  const footText = () => {
    const src = findDesign(store.state, srcId);
    return src && checked.size ? `「${esc(src.name)}」から、新しく <b>${checked.size} 個</b>の項目を、データベースの項目の一覧表に取り込みます。` : '取り込む項目に印を付けてください。';
  };
  return showDialog({
    title: 'ほかのモックから項目を取り込む',
    okLabel: '取り込む',
    wide: true,
    body: `
      <p class="hint" style="margin-bottom:10px">取り込んだ項目は、元のモックとつながったままになります。元のモックで項目を直すと、この画面設計の項目も同じように変わります（ここでは直せません）。</p>
      <div class="imp">
        <div class="imp-left"><div class="imp-head">1. 取り込む元のモックを選ぶ</div>
          <label class="imp-search"><input type="search" data-imp-search placeholder="名前で探す" aria-label="名前で探す"></label>
          <div class="imp-list" data-imp-left>${leftHtml()}</div></div>
        <div class="imp-right"><div class="imp-head">2. 取り込む項目に印を付ける<span class="spacer"></span><button type="button" class="link-btn" data-imp-all>すべて選ぶ</button></div>
          <div class="imp-items" data-imp-right>${rightHtml()}</div></div>
      </div>
      <p class="imp-foot" data-imp-foot>${footText()}</p>`,
    init: (m) => {
      const redraw = () => {
        $('[data-imp-left]', m).innerHTML = leftHtml();
        $('[data-imp-right]', m).innerHTML = rightHtml();
        $('[data-imp-foot]', m).innerHTML = footText();
      };
      m.addEventListener('click', (e) => {
        const b = e.target.closest('[data-imp-src]');
        if (b && b.dataset.impSrc !== srcId) { srcId = b.dataset.impSrc; checked.clear(); redraw(); return; }
        if (e.target.closest('[data-imp-all]')) {
          const src = findDesign(store.state, srcId);
          if (src) src.items.forEach((it) => { if (!IMPORT_BLOCKED.includes(importState(d, src, it))) checked.add(it.id); });
          redraw();
        }
      });
      m.addEventListener('change', (e) => {
        const c = e.target.closest('[data-imp-item]');
        if (!c) return;
        if (c.checked) checked.add(c.dataset.impItem); else checked.delete(c.dataset.impItem);
        $('[data-imp-foot]', m).innerHTML = footText();
      });
      m.addEventListener('input', (e) => {
        if (!e.target.matches('[data-imp-search]')) return;
        query = e.target.value;
        $('[data-imp-left]', m).innerHTML = leftHtml();
      });
    },
    collect: () => (srcId && checked.size ? { srcId, ids: [...checked] } : { error: '取り込む項目に印を付けてください。' }),
  }).then((r) => {
    if (!r) return;
    const src = findDesign(store.state, r.srcId);
    Object.assign(ui, { panel: 'items', partId: null, addItemMenu: false });
    const n = actions.importItems(d.id, r.srcId, r.ids);
    if (n) toast(`「${src.name}」から ${n} 個の項目を取り込みました。`);
    updateEditor();
  });
}

// 項目の一覧表の並べ替え（行の左のつまみのドラッグ）。放した行の上半分なら前、下半分なら後ろに入れる

function dragItemSort(ev) {
  document.querySelectorAll('#db-view tr.drop-before, #db-view tr.drop-after').forEach((r) => r.classList.remove('drop-before', 'drop-after'));
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const row = hit && hit.closest ? hit.closest('#db-view tr[data-id]') : null;
  if (!row) { drag.to = null; return; }

// つながりの図の箱のドラッグ。動かさずに放したときは、その画面設計を開く（編集中の画面設計の箱と、一覧にないデータベースは開かない）
function startMapDrag(ev, el) {
  ev.preventDefault();
  flushSideField();
  const inner = el.closest('.map-inner');
  drag = { kind: 'map', el, inner, key: el.dataset.node, sx: ev.clientX, sy: ev.clientY, x0: parseFloat(el.style.left) || 0, y0: parseFloat(el.style.top) || 0, moved: false, focus: inner.dataset.focus || null };
}
function dragMap(ev) {
  if (store.isViewing) return; // 前の版を見ている間は、箱を動かさない（押して開くのはできる）
  const dx = ev.clientX - drag.sx;
  const dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
  drag.moved = true;
  document.body.classList.add('map-dragging');
  drag.x = Math.max(0, snapGrid(drag.x0 + dx));
  drag.y = Math.max(0, snapGrid(drag.y0 + dy));
  Object.assign(drag.el.style, { left: drag.x + 'px', top: drag.y + 'px' });
  // 図の枠の外へ動かしたときは、枠を広げる（放すまで箱が隠れないように）
  const st = drag.inner.style;
  st.width = Math.max(parseFloat(st.width), drag.x + MAP_W + 60) + 'px';
  st.height = Math.max(parseFloat(st.height), drag.y + MAP_H + 76) + 'px';
  // 線も描き直す（ほかの箱は今の位置のまま）
  const model = mapModel(store.state, drag.focus);
  const pos = {};
  drag.inner.querySelectorAll('.mnode').forEach((n) => { pos[n.dataset.node] = { x: parseFloat(n.style.left) || 0, y: parseFloat(n.style.top) || 0, h: parseFloat(n.style.height) || MAP_H }; });
  const svg = drag.inner.querySelector('svg');
  if (svg) svg.outerHTML = mapEdgesSvg(model, pos, parseFloat(drag.inner.style.width), parseFloat(drag.inner.style.height));
}
function endMapDrag(done) {
  document.body.classList.remove('map-dragging');
  if (done.moved && (done.x !== done.x0 || done.y !== done.y0)) { actions.setMapPos(done.focus, done.key, { x: done.x, y: done.y }); return; }
  if (!done.key.startsWith('d:') || done.key === 'd:' + done.focus) return;
  if (!findDesign(store.state, done.key.slice(2))) return; // 単体で開いた HTML の、ほかの画面設計の箱（この HTML にない）は開かない
  openDesign(done.key.slice(2));
}

function onDragMove(ev) {
  if (!drag) return;
  if (drag.kind === 'map') { dragMap(ev); return; }
  if (drag.kind === 'add') { dragAdditive(ev); return; }
  if (drag.kind === 'group') { dragGroup(ev); return; }
  if (drag.kind === 'band') { dragBand(ev); return; }
  if (drag.kind === 'item-sort') { dragItemSort(ev); return; }
  if (drag.kind === 'screen-sort') { dragScreenSort(ev); return; }
  if (drag.kind === 'co-move' || drag.kind === 'co-size') { dragCallout(ev); return; }
  if (drag.kind === 'co-link') { dragCalloutLink(ev); return; }
  if (drag.kind === 'move' || drag.kind === 'size') { dragPart(ev); return; }
  if (drag.kind === 'place') { dragPlace(ev); return; }
  const { wrap } = drag;
  if (drag.kind === 'pan') {
    wrap.scrollLeft = drag.sl - (ev.clientX - drag.sx);
    wrap.scrollTop = drag.st - (ev.clientY - drag.sy);
    return;
  }
  // 窓の下の端の近くまで来たら、下へ送る（画面を長く伸ばすため）
  const r = wrap.getBoundingClientRect();
  if (r.height && ev.clientY > r.bottom - 32) wrap.scrollTop += 24;
  const dy = ev.clientY - drag.sy + (wrap.scrollTop - drag.st);
  const h = Math.max(snapHeight(drag.h0 + dy / ui.zoom, drag.device), drag.minH);
  if (h === (ui.previewHeight == null ? drag.h0 : ui.previewHeight)) return;
  ui.previewHeight = h;
  renderStage();
}

function onDragEnd(ev) {
  if (!drag) return;
  const done = drag;
  drag = null;
  document.body.classList.remove('resizing', 'moving', 'sorting', 'linking', 'copying', 'screen-sorting');
  if (done.kind === 'map') { endMapDrag(done); return; }
  if (done.kind === 'add') {
    // Ctrl を押して押しただけ（動かしていない）なら、選ぶものに足す・外す
    const { k, id } = done.hit;
    setSelection(isSelected(k, id) ? ui.sel.filter((x) => !(x.k === k && x.id === id)) : [...ui.sel, done.hit]);
    return;
  }
  if (done.kind === 'group') { endGroupDrag(done); return; }
  if (done.kind === 'band') { endBand(done); return; }
  if (done.kind === 'co-move' || done.kind === 'co-size') {
    const r = done.rect;
    if (!r || !actions.moveCallout(ui.designId, currentScreen().id, done.id, r)) renderStage();
    return;
  }
  if (done.kind === 'co-link') {
    const c = findCallout(currentScreen(), done.id);
    if (done.target === undefined || !c || c.target === done.target || !actions.updateCallout(ui.designId, currentScreen().id, done.id, { target: done.target })) renderStage();
    return;
  }
  if (done.kind === 'item-sort') {
    if (done.to == null || !actions.moveItem(ui.designId, done.id, done.to)) renderItemsView(currentDesign());
    return;
  }
  if (done.kind === 'screen-sort') {
    if (done.moved && (done.to == null || !actions.moveScreen(ui.designId, done.id, done.to))) refreshScreenList();
    return;
  }
  if (done.kind === 'place') { if (done.moved) dropPlace(done, ev); return; }
  if (done.kind === 'move' || done.kind === 'size') {
    const r = done.rect;
    const r0 = done.r0;
    if (r && (r.x !== r0.x || r.y !== r0.y || r.w !== r0.w || r.h !== r0.h)) actions.movePart(ui.designId, currentScreen().id, done.id, r);
    return;
  }
  done.wrap.classList.remove('grabbing');
  if (done.kind !== 'resize') return;
  const h = ui.previewHeight;
  ui.previewHeight = null;
  if (h != null && h !== done.h0) actions.updateScreen(ui.designId, currentScreen().id, { height: h });
  else renderStage();
}

// ── コピー・貼り付け・複製・削除・矢印のキーで動かす（選んだものをまとめて）──
// コピーしたものは { parts: [{ part（部品の写し）, item（指している項目の写し。ほかの画面設計へ貼り付けるときに使う）}], callouts: [吹き出しの写し] }
function selectionEntries() {

  const d = currentDesign();
  const parts = ui.sel.filter((x) => x.k === 'p').map((x) => findPart(s, x.id)).filter(Boolean)
    .map((p) => { const item = findItem(d, p.itemId); return { part: clone(p), item: item ? clone(item) : null }; });
  const callouts = ui.sel.filter((x) => x.k === 'c').map((x) => findCallout(s, x.id)).filter(Boolean).map(clone);
  return { parts, callouts };
}

function pastePart() {

function splitCoverRows(d, P, rows, measured, bodyH, opts = {}) {
  if (!measured || !rows.length) return [rows];
  const probe = measureBox(coverPageHtml(d, P, rows, 99, nowIso(), opts));
  const pgTop = probe.querySelector('.pg').getBoundingClientRect().top;
  const footH = probe.querySelector('.cv-foot').getBoundingClientRect().height;
  // 1 ページ目の一覧が入る下の端（下の余白と下の端の行を引く。縦の用紙では、一覧の下の改訂履歴の分も引く）
  let limit = pgTop + P.h - 36 - footH - 12;
  if (P.h > P.w) limit -= probe.querySelector('.cv-revs').getBoundingClientRect().height + 18;
  const trs = [...probe.querySelectorAll('.cv-list tbody tr')].map((tr) => tr.getBoundingClientRect());
  const headH = probe.querySelector('.cv-list thead').getBoundingClientRect().height;
  probe.remove();
  const over = trs.findIndex((r) => r.bottom > limit);
  if (over < 0) return [rows];
  const n = Math.max(1, over);
  const chunks = [rows.slice(0, n)];
  let cur = [];

  trs.slice(n).forEach((r, k) => {
    if (cur.length && used + r.height > bodyH) { chunks.push(cur); cur = []; used = headH; }
    cur.push(rows[n + k]);

  const boxes = [...html.matchAll(/class="mnode[^"]*"[^>]*style="left:(-?[\d.]+)px;top:(-?[\d.]+)px;width:([\d.]+)px;height:([\d.]+)px"/g)].map((m) => m.slice(1).map(Number));
  const m = html.match(/class="map-inner"[^>]*style="width:([\d.]+)px;height:([\d.]+)px"/);
  if (!m || !boxes.length) return legend + html;
  const [mw, mh] = [Number(m[1]), Number(m[2])];
  const pad = 28; // 線と矢印の文字が箱の外へ出る分

  const y0 = Math.max(0, Math.min(...boxes.map((b) => b[1])) - pad);
  const x1 = Math.min(mw, Math.max(...boxes.map((b) => b[0] + b[2])) + pad);
  const y1 = Math.min(mh, Math.max(...boxes.map((b) => b[1] + b[3])) + pad);
  const [cw, ch] = [x1 - x0, y1 - y0];
  const k = Math.min(1, aw / cw, (ah - 28) / ch); // 28 は凡例の分
  return `${legend}<div class="xp-fit"><div style="width:${Math.floor(cw * k)}px;height:${Math.floor(ch * k)}px;position:relative;overflow:hidden">`
    + `<div style="width:${cw}px;height:${ch}px;position:relative;zoom:${k.toFixed(4)}">`
    + `<div style="position:absolute;left:${-x0}px;top:${-y0}px">${html}</div></div></div></div>`;
}

// 画面と吹き出しと部品の設定の一覧表を 1 つに組む（q36 案A）。編集の画面と同じ並べ方（画面のまわり 240 ドット）を、
// 画面と吹き出しを囲む範囲で切り取り、一覧表をその外側に 32 ドット空けて置く（右なら上の端を画面の上の端に、下なら左の端を画面の左の端にそろえる）。
// 戻り値 { html, cw, ch }（縮める前の大きさ）。key は矢印の印の id の頭（ページごとに変える。同じ id が編集の画面にもあると矢印が消えるため）
// diff（{ info: designDiff の screens の 1 つ, label }）を渡すと、部品・吹き出しの札と、一覧表の札・削除した部品を入れる（第 6 段階）
// table・callouts を false にすると、一覧表・吹き出しを入れない（AI が画面だけを画像で見るとき。第 7 段階）
function screenComposite(d, s, key, measured, diff = null, { table: withTable = true, callouts: withCallouts = true } = {}) {
  const Z = CALLOUT_ZONE;
  const zoneW = s.width + Z * 2;
  const zoneH = s.height + Z * 2;
  const shown = withCallouts ? s.callouts : [];
  const rects = [[Z, Z, Z + s.width, Z + s.height], ...shown.map((c) => [Z + c.x, Z + c.y, Z + c.x + c.w, Z + c.y + c.h])];
  const pad = 8;
  const x0 = Math.max(0, Math.min(...rects.map((r) => r[0])) - pad);
  const y0 = Math.max(0, Math.min(...rects.map((r) => r[1])) - pad);
  const x1 = Math.min(zoneW, Math.max(...rects.map((r) => r[2])) + pad);
  const y1 = Math.min(zoneH, Math.max(...rects.map((r) => r[3])) + pad);
  const [cropW, cropH] = [x1 - x0, y1 - y0];
  const lines = withCallouts ? calloutLinesSvg(s).replace(' id="co-lines"', '').replace(/co-arrow-/g, `${key}-co-arrow-`) : '';
  const info = diff && !diff.info.isNew ? diff.info : null;
  const boxes = shown.map((c) => `<div class="callout cc-${esc(c.color)}" style="left:${Z + c.x}px;top:${Z + c.y}px;width:${c.w}px;height:${c.h}px">${esc(c.text)}${info ? diffBadge(info.callouts[c.id]) : ''}</div>`).join('');
  const zone = `<div class="xp-zone" style="position:absolute;left:0;top:0;width:${cropW}px;height:${cropH}px;overflow:hidden">`
    + `<div style="position:absolute;left:${-x0}px;top:${-y0}px;width:${zoneW}px;height:${zoneH}px">`
    + `<div style="position:absolute;left:${Z}px;top:${Z}px">${screenHtml(d, s, { grid: false, marks: false, diff: info })}</div>${lines}${boxes}</div></div>`;
  const table = withTable ? partTableHtml(d, s, { editor: false, diff: info && diff }) : '';
  let [tw, th] = [0, 0];
  if (table && measured) {
    const probe = measureBox(table);
    const r = probe.firstElementChild.getBoundingClientRect();
    [tw, th] = [Math.ceil(r.width), Math.ceil(r.height)];
    probe.remove();
  } else if (table) {
    tw = s.tablePos === 'bottom' ? s.width : TABLE_W;
  }
  const right = s.tablePos !== 'bottom';
  const tx = right ? cropW + TABLE_GAP : Z - x0;
  const ty = right ? Z - y0 : cropH + TABLE_GAP;
  const cw = table ? Math.max(cropW, tx + tw) : cropW;
  const ch = table ? Math.max(cropH, ty + th) : cropH;
  return { cw, ch, html: zone + (table ? `<div style="position:absolute;left:${tx}px;top:${ty}px">${table}</div>` : '') };
}
// 画面のページの本文。本文に収まるように縮め（拡大しない）、左右・上下の真ん中に置く。測れないときは縮めない。
// 縮めるのは transform でなく zoom にする（transform だと、縮める前の幅が残り、画面のページが 2 つ以上あると、
// Electron の印刷が用紙からはみ出しているとみなして全部のページを約 0.67 倍に縮めてしまうため）
// zoom では 1px の罫線が縮まないので、縮めた表は「測った高さ × 倍率」より高くなる。縮めた後の大きさを測り直し、収まるまで倍率を下げる
function screenPageBody(comp, aw, ah, measured) {
  const stage = (k, w, h, top) => `<div class="xp-stage" style="width:${Math.ceil(w)}px;height:${Math.ceil(h)}px;margin-top:${top}px">`
    + `<div style="position:absolute;left:0;top:0;width:${comp.cw}px;height:${comp.ch}px;zoom:${k.toFixed(4)}">${comp.html}</div></div>`;
  if (!measured) return { k: 1, html: stage(1, comp.cw, comp.ch, 0) };
  let k = Math.min(1, aw / comp.cw, ah / comp.ch);
  let [w, h] = [comp.cw * k, comp.ch * k];
  for (let i = 0; i < 5; i++) {
    const probe = measureBox(stage(k, w, h, 0));
    const box = probe.querySelector('.xp-stage').getBoundingClientRect();
    [w, h] = [0, 0];
    probe.querySelectorAll('.xp-zone, .ptable').forEach((el) => {
      const r = el.getBoundingClientRect();
      w = Math.max(w, r.right - box.left);
      h = Math.max(h, r.bottom - box.top);
    });
    probe.remove();
    if (w <= aw + 0.5 && h <= ah + 0.5) break;
    k *= Math.min(aw / w, ah / h) * 0.995;
  }
  return { k, html: stage(k, w, h, Math.max(0, Math.floor((ah - h) / 2))) };
}

// 印刷用の文書（PDF にする HTML）。アプリと同じ style に、用紙の大きさ（@page）を足す
function printDocumentHtml(title, P, pagesHtml) {
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<title>' + esc(title) + '</title>\n<style>' + APP_STYLE
    + '\n@page{size:' + P.wmm.toFixed(3) + 'mm ' + P.hmm.toFixed(3) + 'mm;margin:0}\n</style>\n</head>\n<body class="xp-doc">\n' + pagesHtml + '\n</body>\n</html>\n';
}

// 書き出しで比べる版（第 6 段階）。戻り値 { result（designDiff）, label（「第 2 版」）, title（「第 2 版（2026-10-10）」） } か null
function exportDiff(d, state, revId) {
  const r = findRevision(d, revId);
  if (!isVersionRow(r) || !hasSnapshot(r)) return null;
  return { result: designDiff(designFromSnapshot(d, r), d, state), label: revisionTitle(r), title: `${revisionTitle(r)}（${revisionDay(r)}）` };
}
// 画面のページの見出しの右に出す、比べた版との違いの数
function diffSumHtml(df, info) {
  if (!df || !info) return '';
  if (info.isNew) return `<span class="df-sum">${esc(df.label)}にない、新しい画面</span>`;
  const c = info.counts;
  return `<span class="df-sum">${esc(df.title)}との違い：<b class="n">新 ${c.new}</b>・<b class="c">変 ${c.chg}</b>・<b class="d">削除 ${c.del}</b></span>`;
}

// PDF の中身を組む。opts { paper, orient, cover, map, items, screenIds（省略するとすべての画面）, diffRevId（比べる版の行の id） }。
// 表紙（入りきらなければ「画面の一覧（続き）」）→ 比べた版からの変更内容（違いの印を選んだときだけ）→ つながりの図（つながりがあるときだけ）→
// 項目の一覧表（項目があるときだけ）→ 選んだ画面。戻り値 { html（印刷用の文書）, P（用紙）, pages（ページの HTML）, total }
function exportDocument(d, state, opts, exportedAt = nowIso()) {
  const P = paperSize(opts.paper, opts.orient);
  const measured = canMeasure();
  const { aw, ah } = pageBodySize(P, measured);
  const screens = d.screens.map((s, i) => ({ s, i })).filter(({ s }) => !opts.screenIds || opts.screenIds.includes(s.id));
  const withMap = !!opts.map && hasMapLinks(d, state);
  const itemChunks = opts.items ? splitItemRows(itemRowsHtml(d, state), aw, ah, measured) : [];
  const df = opts.diffRevId ? exportDiff(d, state, opts.diffRevId) : null;
  const changesTitle = df ? `${df.title}からの変更内容` : '';
  const changeChunks = !df ? [] : df.result.rows.length ? splitItemRows(changeRowsHtml(df.result.rows), aw, ah, measured, printChangeTable) : [[]];
  // ページ番号は、表紙が何ページになるかで変わる。番号の桁で行の高さは変わらないので、仮の番号で 1 回分けてから決め直す
  const numbering = (coverPages) => {
    let n = coverPages;
    const changesPage = changeChunks.length ? n + 1 : 0;
    n += changeChunks.length;
    const mapPage = withMap ? ++n : 0;
    const itemsPage = itemChunks.length ? n + 1 : 0;
    n += itemChunks.length;
    return { changesPage, changesTitle, mapPage, itemsPage, screens: screens.map((x) => ({ ...x, page: ++n })), total: n };
  };
  let plan = numbering(opts.cover ? 1 : 0);
  let coverChunks = [];
  // 表紙の説明が、決めた高さに入りきるか（入りきらなければ、省略したと書く）
  let descCut = false;
  if (opts.cover && measured && d.description.trim()) {
    const probe = measureBox(coverPageHtml(d, P, [], 1, exportedAt));
    const el = probe.querySelector('.cv-desc');
    descCut = el.scrollHeight > el.clientHeight + 1;
    probe.remove();
  }
  if (opts.cover) {
    coverChunks = splitCoverRows(d, P, coverListRows(plan), measured, ah, { descCut });
    if (coverChunks.length > 1) {
      plan = numbering(coverChunks.length);
      coverChunks = splitCoverRows(d, P, coverListRows(plan), measured, ah, { descCut });
    }
  }
  const { total } = plan;
  const left = (t) => `${esc(d.name)} ／ ${t}`;
  const pages = coverChunks.map((rows, k) => (k === 0 ? coverPageHtml(d, P, rows, total, exportedAt, { descCut }) : coverContHtml(d, P, rows, k + 1, total)));
  changeChunks.forEach((rows, k) => pages.push(pageFrame({ P, title: esc(changesTitle) + (k ? '（続き）' : ''),
    sub: `${df.result.rows.length} 件${rows.cut ? '・長い行は途中まで' : ''}`,
    body: rows.length ? printChangeTable(rows) : `<p class="cg-none">${esc(df.label)}から変わった所はありません。</p>`,
    left: left('変更内容'), right: `${plan.changesPage + k} / ${total}` })));
  if (withMap) {
    pages.push(pageFrame({ P, title: 'つながりの図', sub: `「${esc(d.name)}」と、直接つながる画面設計`, body: mapPageBody(d, state, aw, ah),
      left: left('つながりの図'), right: `${plan.mapPage} / ${total}` }));
  }
  itemChunks.forEach((rows, k) => pages.push(pageFrame({ P, title: `データベースの項目の一覧表${k ? '（続き）' : ''}`,
    sub: `項目 ${d.items.length} 個${rows.cut ? '・長い行は途中まで（全文はアプリか HTML で見られます）' : ''}`,
    body: printItemTable(rows), left: left('データベースの項目の一覧表'), right: `${plan.itemsPage + k} / ${total}` })));
  plan.screens.forEach(({ s, i, page }) => {
    const info = df ? df.result.screens[s.id] : null;
    const body = screenPageBody(screenComposite(d, s, 'p' + page, measured, info && { info, label: df.label }), aw, ah, measured);
    const name = `${i + 1}　${esc(s.name)}`;
    const sub = `${DEVICES[s.device].label}・${s.width} × ${s.height}${body.k < 0.995 ? `・${Math.round(body.k * 100)}% に縮小` : ''}`;
    pages.push(pageFrame({ P, title: name, sub, body: body.html, left: left(name), right: `${page} / ${total}`, headExtra: diffSumHtml(df, info) }));
  });
  return { P, pages, total, html: printDocumentHtml(d.name, P, pages.join('\n')) };
}

// PNG にする文書（画面ごとに 1 つ。ページの枠なし・縮めない・まわりに白の余白）。戻り値 [{ name, html, width, height }]。
// diffRevId（比べる版の行の id）を渡すと、違いの札と削除した部品を入れる。parts（{ table, callouts }）は screenComposite へ渡す
function exportPngDocs(d, state, screenIds = null, diffRevId = null, parts = {}) {
  const measured = canMeasure();
  const df = diffRevId ? exportDiff(d, state, diffRevId) : null;
  return d.screens.map((s, i) => ({ s, i })).filter(({ s }) => !screenIds || screenIds.includes(s.id)).map(({ s, i }) => {
    const info = df ? df.result.screens[s.id] : null;
    const comp = screenComposite(d, s, 'g' + (i + 1), measured, info && { info, label: df.label }, parts);
    const width = comp.cw + PNG_MARGIN * 2;
    const height = comp.ch + PNG_MARGIN * 2;
    const body = `<div class="xp-png" style="width:${width}px;height:${height}px">`
      + `<div class="xp-stage" style="position:absolute;left:${PNG_MARGIN}px;top:${PNG_MARGIN}px;width:${comp.cw}px;height:${comp.ch}px">${comp.html}</div></div>`;
    const html = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<title>' + esc(`${d.name} ／ ${s.name}`) + '</title>\n<style>' + APP_STYLE
      + '\nhtml,body{margin:0;background:#fff}\n</style>\n</head>\n<body class="xp-doc">\n' + body + '\n</body>\n</html>\n';
    return { name: `${safeFileName(d.name)}_${pad2(i + 1)}_${safeFileName(s.name, '画面')}.png`, width, height, html };
  });
}

// ── 書き出す HTML（単体で開いて編集できる HTML。q37）──
// 写しの中の、ほかの画面設計を指す名前（ルックアップ元・関連レコード一覧の元）を今の名前に直す。
// 名前は選んだときの控えで、後の名前の変更に追いついていない。単体で開いたときは元がないので、この控えの名前で出す
function refreshRefNames(copy, state) {
  const live = (design, ref) => {
    const it = design && ref && ref.itemId ? findItem(design, ref.itemId) : null;
    if (it) ref.name = it.name;
  };
  const fixDb = (db) => {
    const src = db && db.designId ? findDesign(state, db.designId) : null;
    if (src) db.name = src.name;
    return src;
  };
  copy.items.forEach((it) => {
    if (!it.lookup) return;
    const src = fixDb(it.lookup.db);
    live(src, it.lookup.key);
    it.lookup.copies.forEach((c) => { live(src, c.from); live(copy, c.to); });
  });
  copy.screens.forEach((s) => s.parts.forEach((p) => {
    if (p.type !== 'table' || !isObj(p.props)) return;
    if (p.tableKind === 'records') (p.props.columns || []).forEach((c) => live(copy, c.ref));
    if (p.tableKind !== 'related' || !isObj(p.props.db)) return;
    const src = fixDb(p.props.db);
    if (isObj(p.props.cond)) { live(src, p.props.cond.from); live(copy, p.props.cond.to); }
    (p.props.columns || []).forEach((c) => live(src, c.ref));
  }));
}
// つながりの図に要る、ほかの画面設計の短い写し（その画面設計の名前・作る先・数と、この画面設計を指すルックアップ・取り込み・関連レコード一覧）
function peersOf(d, state) {
  return mapModel(state, d.id).nodes.filter((n) => n.design && n.design.id !== d.id && !n.design.peer).map(({ design: p }) => {
    const items = p.items.filter((it) => (it.lookup && it.lookup.db.designId === d.id) || (it.link && it.link.designId === d.id))
      .map((it) => ({ id: it.id, name: it.name, type: it.type, lookup: it.lookup ? clone(it.lookup) : null, link: it.link ? clone(it.link) : null }));
    const related = [];
    p.screens.forEach((s) => s.parts.forEach((pt) => {
      if (pt.type === 'table' && pt.tableKind === 'related' && isObj(pt.props) && isObj(pt.props.db) && pt.props.db.designId === d.id) related.push({ label: str(pt.label), db: clone(pt.props.db) });
    }));
    return { id: p.id, name: p.name, target: p.target, itemCount: p.items.length, screenCount: p.screens.length, items, related };
  });
}
function normalizePeers(raw) {
  return (Array.isArray(raw) ? raw : []).filter((p) => isObj(p) && str(p.id)).map((p) => ({
    id: str(p.id),
    name: cleanName(p.name) || '名前なし',
    target: str(p.target),
    itemCount: Math.max(0, Math.floor(Number(p.itemCount)) || 0),
    screenCount: Math.max(0, Math.floor(Number(p.screenCount)) || 0),
    items: (Array.isArray(p.items) ? p.items : []).filter(isObj).map((it) => ({ id: str(it.id), name: str(it.name), type: str(it.type), lookup: normalizeLookup(it.lookup), link: normalizeLink(it.link) })),
    related: (Array.isArray(p.related) ? p.related : []).filter(isObj).map((r) => ({ label: str(r.label), db: normalizeDb(r.db) })),
  }));
}
// 単体で開いたときの、つながりの図の仮の画面設計（この HTML にない画面設計。押しても開かない）
function peerDesigns(state) {
  if (!standalone) return [];
  return standalone.peers.filter((p) => !findDesign(state, p.id)).map((p) => ({
    ...p, peer: true, trashedAt: null,
    screens: [{ id: 'peer-' + p.id, parts: p.related.map((r) => ({ type: 'table', tableKind: 'related', label: r.label, props: { db: r.db } })) }],
  }));
}
// 画面設計の写し。改訂履歴の行は残し、版の写し（snapshot）は外す（書き出す HTML には入れない）
const withoutSnapshots = (d) => clone({ ...d, revisions: d.revisions.filter(isObj).map((r) => ({ ...r, snapshot: undefined })) });
// 埋め込むデータ。revisions の写し（snapshot）は入れない。作る先の自由な名前は、この画面設計の作る先だけを入れる。
// diffRevId（比べる版の行の id）を渡すと、その版の写しだけを diffBase として入れる（開いたときに「新」「変」の札を出すため。第 6 段階）
function embedPayload(d, state, { diffRevId = null } = {}) {
  const copy = withoutSnapshots(d);
  refreshRefNames(copy, state);
  const r = diffRevId ? findRevision(d, diffRevId) : null;
  // 比べる版の写しも、名前の控えを今の名前に直す（今の中身と同じ直し方にしないと、版の後にルックアップ元の名前を変えただけで「変」になる）
  const diffSnap = isVersionRow(r) && hasSnapshot(r) ? clone(r.snapshot) : null;
  if (diffSnap) refreshRefNames(diffSnap, state);
  return {
    format: EMBED_FORMAT, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: nowIso(), baseUpdatedAt: d.updatedAt,
    baseHash: shortHash(comparableContent(d, state)), // 書き出したときの中身の印（取り込むときに、こちらでも変えたかを見る）
    data: { schemaVersion: SCHEMA_VERSION, settings: { customTargets: d.target && !builtinTarget(d.target) ? [d.target] : [], mapPos: {} }, designs: [copy] },
    peers: peersOf(d, state),
    ...(diffSnap ? { diffBase: { title: revisionTitle(r), day: revisionDay(r), snapshot: diffSnap } } : {}),
  };
}
// 単体で開いた HTML を保存し直すときのデータ（書き出したときの日時・元の更新日時・ほかの画面設計の写しは、そのまま持ち回る）
function resavePayload(d, state) {
  const copy = withoutSnapshots(d);
  return {
    format: EMBED_FORMAT, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: standalone.exportedAt, baseUpdatedAt: standalone.baseUpdatedAt,
    baseHash: standalone.baseHash, savedAt: nowIso(),
    // 作る先の自由な名前は、この画面設計の作る先だけを入れる（「その他」に試しに書いた名前を、取り込む側の選択肢に増やさないため）
    data: { schemaVersion: SCHEMA_VERSION, settings: { customTargets: d.target && !builtinTarget(d.target) ? [d.target] : [], mapPos: {} }, designs: [copy] },
    peers: standalone.peers,
    ...(standalone.diffBase ? { diffBase: standalone.diffBase.raw } : {}), // 違いの札の元にする版も、そのまま持ち回る
  };
}
// アプリの HTML と同じ骨組みに、style・埋め込むデータ・script を入れる。埋め込むデータの「<」は JSON の書き方の < に逃がす（script の終わりの印で切れないように）。
// この script の中には、script の始まりと終わりの印をそのまま書かない（HTML の解析で、この script が途中で切れるため）
function standaloneHtml(title, payload) {
  const json = JSON.stringify(payload).replace(/</g, '\\u003c');
  const open = '<' + 'script';
  const close = '<' + '/script>';
  return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + '<title>' + esc(title) + '</title>\n<style>' + APP_STYLE + '</style>\n'
    + open + ' type="application/json" id="' + EMBED_ID + '">' + json + close + '\n</head>\n<body>\n'
    + '<div id="banner" hidden></div>\n<div id="app"></div>\n<div id="dialog-root"></div>\n<div id="toast" hidden></div>\n'
    + open + '>' + APP_SCRIPT + close + '\n</body>\n</html>\n';
}
const buildStandaloneHtml = (d, state, opts = {}) => standaloneHtml(d.name, standalone ? resavePayload(d, state) : embedPayload(d, state, opts));

// HTML の文字を保存する（ブラウザ）。Chrome・Edge は保存の窓で場所と名前を選ぶ（文字を先に作ってから窓を開き、すぐ書く。

async function saveHtmlInBrowser(html, name) {
  if (typeof window.showSaveFilePicker === 'function') {
    let handle = null;
    try {
      handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'HTML ファイル', accept: { 'text/html': ['.html', '.htm'] } }] });
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, canceled: true };
      console.warn('保存の窓を使えないので、ダウンロードにします:', e); // ポリシーで止めてある・iframe の中など
    }
    if (handle) {
      try {
        const w = await handle.createWritable();
        await w.write(html);
        await w.close();
        return { ok: true, path: handle.name };
      } catch (e) {
        console.warn('選んだファイルに書けなかったので、ダウンロードにします:', e);
        toast('選んだファイルに書けませんでした。代わりにダウンロードします。');
      }
    }
  }
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return { ok: true, path: name, download: true };
}

  let payload;

  let migrated;

  }

function changedSinceExport(cur, payload) {
  const known = [str(payload.baseHash), str(cur.exchangeHash)].filter(Boolean);
  if (!known.length) return !!payload.baseUpdatedAt && String(cur.updatedAt) > String(payload.baseUpdatedAt);
  return !known.includes(shortHash(comparableContent(cur, store.state)));
}
// 一覧にある画面設計を、取り込む中身で置き換える（state を書き換える）。今の中身は改訂履歴に「取り込む前の状態」として残す
function replaceWithImported(s, incoming) {
  const d = findDesign(s, incoming.id);
  d.revisions.push(revisionRow(d, 'import', { note: REV_AUTO.import }));
  Object.assign(d, designContentOf(incoming, true), { trashedAt: null, updatedAt: nowIso() });
  addCustomTarget(s, incoming.target);
  syncLinkedItems(s); // 一覧にある元の項目とつなぎ直す（元がなければ「元なし」で固定。この画面設計から取り込んだ、ほかの画面設計の項目もそろう）
  d.exchangeHash = shortHash(comparableContent(d, s)); // 取り込んだ中身の印（次に取り込むとき、こちらで変えていないと分かるように）
}
// 置き換えても中身が変わらないか（つながった項目は、一覧にある元にそろえてから比べる。
// 書き出した HTML ではルックアップ元などの名前を今の名前に直しているので、手元の写しも同じように直してから比べる）
function sameAfterImport(existing, incoming) {
  const trial = cloneState(store.state);
  replaceWithImported(trial, incoming);
  return comparableContent(existing, store.state) === comparableContent(findDesign(trial, incoming.id), trial);
}
const importedCopyName = (name) => cleanName(name).slice(0, NAME_MAX - 6).trim() + '（取り込み）';
// 確かめの窓。戻り値 'replace'（置き換える）・'copy'（別の画面設計として足す）・null（キャンセル）
function openImportConfirmDialog(cur, inc, payload) {
  const count = (d) => ({ screens: d.screens.length, parts: d.screens.reduce((n, s) => n + s.parts.length, 0), items: d.items.length });

  return showDialog({
    title: `「${inc.name}」を取り込みますか？`,
    okLabel: '取り込む',
    okClass: 'danger',
    width: 560,
    body: `<p>一覧${cur.trashedAt ? 'の「ごみ箱」' : ''}にある画面設計「${esc(cur.name)}」から書き出した HTML です。</p>
      <table class="imp-cmp"><thead><tr><th></th><th>今の中身</th><th>取り込む中身</th></tr></thead><tbody>

        ${row('画面', `${a.screens} つ`, `${b.screens} つ`)}${row('部品', `${a.parts} 個`, `${b.parts} 個`)}${row('項目', `${a.items} 個`, `${b.items} 個`)}
      </tbody></table>
      ${changedHere ? `<p class="warn">書き出した後（${esc(fmtDateTime(payload.baseUpdatedAt))} より後）に、こちらでも変えています。置き換えると、こちらで変えた所は消えます（今の中身は改訂履歴に残ります）。</p>` : ''}
      <div class="imp-choice">
        <label class="check"><input type="radio" name="imp-how" value="replace" checked><span><b>置き換える</b><small class="sub">今の中身は、改訂履歴に「取り込む前の状態」として残ります。${cur.trashedAt ? 'ごみ箱から一覧に戻します。' : ''}元に戻す（Ctrl+Z）でも戻せます。</small></span></label>
        <label class="check"><input type="radio" name="imp-how" value="copy"><span><b>別の画面設計として足す</b><small class="sub">「${esc(importedCopyName(inc.name))}」として一覧に足します。今の中身はそのままです。</small></span></label>
      </div>`,

}
// 書き出した HTML の文字を取り込む。戻り値 { status: 'added'|'replaced'|'copied'|'same'|'canceled'|'error', designId?, error? }
async function importHtmlText(text) {
  const r = parseExportedHtml(text);
  if (r.error) { toast(r.error); return { status: 'error', error: r.error }; }
  const { payload, design: incoming } = r;
  const existing = findDesign(store.state, incoming.id);
  if (!existing) {
    // 一覧になければ、同じ id のまま足す（次に取り込むときに、同じ画面設計だと分かるように）。作る先の自由な名前は、この画面設計の作る先だけを足す
    store.commit((s) => {
      s.designs.push({ ...clone(incoming), trashedAt: null, updatedAt: nowIso() });
      addCustomTarget(s, incoming.target);
      syncLinkedItems(s);
      const d = findDesign(s, incoming.id);
      d.exchangeHash = shortHash(comparableContent(d, s));
    });
    toast(`「${incoming.name}」を一覧に足しました。`);
    return { status: 'added', designId: incoming.id };
  }
  if (sameAfterImport(existing, incoming)) {
    // ごみ箱にあれば、中身は変えずに一覧に戻す（何も起きないと、一覧を探しても見つからないため）
    if (existing.trashedAt) {
      actions.restoreDesign(existing.id);
      toast(`「${existing.name}」はごみ箱にありました。取り込む HTML と同じ中身なので、中身は変えずに一覧に戻しました。`);
      return { status: 'restored', designId: existing.id };
    }
    toast(`「${existing.name}」と同じ中身なので、取り込みませんでした。`);
    return { status: 'same', designId: existing.id };
  }
  const how = await openImportConfirmDialog(existing, incoming, payload);
  if (!how) return { status: 'canceled' };
  if (how === 'copy') {
    const copy = duplicateDesignData(incoming);
    copy.name = importedCopyName(incoming.name);
    store.commit((s) => {
      s.designs.push(copy);
      addCustomTarget(s, copy.target);
      syncLinkedItems(s);
    });
    toast(`「${copy.name}」として一覧に足しました。`);
    return { status: 'copied', designId: copy.id };
  }
  store.commit((s) => replaceWithImported(s, incoming));
  toast(`「${incoming.name}」を、取り込んだ中身に置き換えました。前の中身は改訂履歴に「取り込む前の状態」として残しています（元に戻す〔Ctrl+Z〕でも戻せます）。`);
  return { status: 'replaced', designId: incoming.id };
}
const readFileText = (file) => (typeof file.text === 'function' ? file.text() : new Promise((resolve, reject) => {

}));
async function importHtmlFile(file) {
  if (!file) return null;
  if (file.size > IMPORT_MAX_CHARS) { toast('ファイルが大きすぎます（50MB まで）。'); return { status: 'error' }; }
  return importHtmlText(await readFileText(file));
}
// 取り込む HTML を選んで、その文字を返す（キャンセル・読めないときは null）。デスクトップは main の開く窓（アプリのメニューからも開けるように）、
// ブラウザは隠した input
async function pickHtmlText() {
  if (window.exportAPI) {
    const res = await window.exportAPI.openHtml();
    if (!res || res.canceled) return null;
    if (!res.ok) { toast(`ファイルを読めませんでした（${res.error || 'わからない理由'}）。`); return null; }
    return res.text;
  }
  const file = await new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.html,.htm,text/html';
    input.addEventListener('change', () => resolve(input.files && input.files[0] ? input.files[0] : null));
    input.addEventListener('cancel', () => resolve(null));
    input.click();
  });
  if (!file) return null;
  if (file.size > IMPORT_MAX_CHARS) { toast('ファイルが大きすぎます（50MB まで）。'); return null; }
  return readFileText(file);
}
// 選んでから取り込む。編集の画面からは、ファイルを選んだ後に一覧へ戻る（キャンセルしたときは、編集の画面のまま）
async function pickAndImportHtml() {
  const text = await pickHtmlText();
  if (text == null) return null;
  if (ui.view === 'editor') goHome();
  return importHtmlText(text);
}
// ファイルを落としたとき。最初の画面なら取り込み、ほかではページが置き換わらないように既定の動きを止めるだけ
const hasFiles = (e) => !!e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
const canDropImport = () => !standalone && ui.view === 'home' && !isDialogOpen();
function onFileDragOver(e) {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = canDropImport() ? 'copy' : 'none';
  document.body.classList.toggle('file-over', canDropImport());
}
function onFileDrop(e) {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.body.classList.remove('file-over');
  if (!canDropImport()) return;
  const files = [...e.dataTransfer.files];
  (async () => { for (const f of files) await importHtmlFile(f); })().catch(reportPageError); // いくつか落としたときは、順に取り込む
}

// ボタン・キー・アプリのメニュー（Electron の menu:command）からの命令は、すべてここで受ける
function runCommand(cmd) {
  if (isDialogOpen()) return false;
  flushSideField();
  closeScreenMenu();
  closeRevMenu();
  if (store.isViewing && !VIEW_OK_COMMANDS.includes(cmd)) {
    toast('前の版を見ている間は、直せません。上の黄色い帯の「見るのをやめる」で、今の中身に戻ってください。');
    return true;
  }
  switch (cmd) {
    case 'undo':
      // AI がほかの画面設計を直したときに履歴を消した後は、元に戻せない理由を知らせる（q51）
      if (!store.canUndo() && aiView.cleared) toast(`元に戻せる操作はありません（AI が「${aiView.cleared}」を直したときに、履歴を消しました）。`);
      else store.undo();
      return true;
    case 'redo': store.redo(); return true;
    // AI とつなぐ窓（第 7 段階。デスクトップ版だけ）
    case 'aiConnect': openAiConnectDialog().catch(reportPageError); return true;
    // 改訂履歴（第 6 段階）。開いている画面設計について行う
    case 'addRevision': case 'openRevisions':
      if (ui.view !== 'editor') { toast('改訂する画面設計を開いてから選んでください。'); return true; }
      (cmd === 'addRevision' ? openAddRevisionDialog() : openRevisionsDialog()).catch(reportPageError);
      return true;
    case 'goHome':
      if (ui.view === 'editor' && !standalone) goHome();
      return true;
    // 書き出しと取り込み（第 5 段階）。単体で開いた HTML では、書き出しの窓と取り込みは出さず、HTML を保存し直すだけ（q37）
    case 'exportDialog':
      if (standalone) return true;
      if (ui.view === 'editor') openExportDialog(ui.designId).catch(reportPageError);
      else toast('書き出す画面設計を開くか、カードの「…」から「書き出す…」を選んでください。');
      return true;
    case 'importHtml':
      if (standalone) return true;
      pickAndImportHtml().catch(reportPageError);
      return true;
    case 'saveHtml':
      if (standalone) saveStandalone().catch(reportPageError);
      return true;
  }
  if (ui.view !== 'editor') return false;
  switch (cmd) {
    case 'openItems': openItemsPanel(); return true;
    case 'openMap': openMapPanel(); return true;
    case 'addItemMenu':
      if (ui.panel !== 'items') Object.assign(ui, { panel: 'items', partId: null });
      ui.addItemMenu = !ui.addItemMenu;
      updateEditor();
      return true;
    case 'deleteItem': if (ui.panel === 'items' && ui.itemId) deleteItemWithConfirm(ui.itemId).catch(reportPageError); return true;
    case 'importItems': if (!standalone) openImportDialog().catch(reportPageError); return true;
    case 'deselectItem': if (ui.panel === 'items') selectItem(null); return true;
    case 'addScreen': openAddScreenDialog().catch(reportPageError); return true;
    case 'prevScreen': case 'nextScreen': stepScreen(cmd === 'nextScreen' ? 1 : -1); return true;
  }
  if (ui.panel !== 'screen') return false;
  switch (cmd) {
    case 'zoomIn': case 'zoomOut': case 'zoomReset': zoomByCommand(cmd); return true;
    case 'modeSelect': setMode('select'); return true;
    case 'modeHand': setMode('hand'); return true;
    case 'copyPart': copyPart(); return true;
    case 'pastePart': pastePart(); return true;
    case 'duplicatePart': duplicatePart(); return true;
    case 'deletePart': deletePart(); return true;
    case 'deselectPart': selectPart(null); return true;
    case 'selectAll': selectAll(); return true;
    case 'numberOn': case 'numberOff': actions.numberMany(ui.designId, currentScreen().id, ui.sel, cmd === 'numberOn'); return true;
    case 'renumber': actions.renumberParts(ui.designId, currentScreen().id); return true;
    // 開いている画面の複製・消す（項目の一覧表やつながりの図を出している間は、どの画面か見えないので使わない）
    case 'duplicateScreen': duplicateScreenAndOpen(ui.screenId); return true;
    case 'deleteScreen': deleteScreenWithConfirm(ui.screenId).catch(reportPageError); return true;
  }
  if (own(ALIGN_COMMANDS, cmd)) { actions.alignMany(ui.designId, currentScreen().id, ui.sel, ALIGN_COMMANDS[cmd]); return true; }
  const nudge = { moveLeft: [-1, 0], moveRight: [1, 0], moveUp: [0, -1], moveDown: [0, 1] }[cmd];
  if (nudge) { nudgePart(...nudge); return true; }
  return false;
}

  if (ui.view === 'editor' && onEditorClick(action, btn)) return;
  onHomeAction(action, id).catch(reportPageError);
}

function reportPageError(e) {
  console.error(e);
  toast('うまくいきませんでした（' + ((e && e.message) || e) + '）。');
}

// Ctrl+Z・Ctrl+Y・Ctrl+Shift+Z と、拡大縮小のキー（CheckListMaker v1.0.8 と同じ考え方）。
// 入力欄の中の Ctrl+Z・Ctrl+Y は、文字の取り消しとしてブラウザに任せる
function keyCommand(e) {
  const k = String(e.key || '').toLowerCase();
  if (k === 'z') return e.shiftKey ? 'redo' : 'undo';
  if (k === 'y') return 'redo';
  if (k === '+' || k === '=' || k === ';') return 'zoomIn';
  if (k === '-') return 'zoomOut';
  if (k === '0') return 'zoomReset';
  return null;
}

// 編集の画面で、入力欄の外で押したキー（部品を選んでいるときの Delete・矢印・Esc と、Ctrl+C・Ctrl+V・Ctrl+D）
function editorKeyCommand(e) {
  const k = String(e.key || '');
  if (ui.panel === 'items') {
    if (e.ctrlKey || e.metaKey || !ui.itemId) return null;
    if (k === 'Delete' || k === 'Backspace') return 'deleteItem';
    return k === 'Escape' ? 'deselectItem' : null;
  }
  if (e.ctrlKey || e.metaKey) {
    const low = k.toLowerCase();
    if (low === 'a') return 'selectAll';
    if (low === 'c' && ui.sel.length) return 'copyPart';
    if (low === 'v' && ui.clipboard) return 'pastePart';
    if (low === 'd' && ui.sel.length) return 'duplicatePart';
    return null;
  }
  // PageUp・PageDown で前後の画面へ（画像 q31）
  if (ui.panel === 'screen' && (k === 'PageUp' || k === 'PageDown')) return k === 'PageUp' ? 'prevScreen' : 'nextScreen';
  if (!ui.sel.length) return null;
  if (k === 'Delete' || k === 'Backspace') return 'deletePart';
  if (k === 'Escape') return 'deselectPart';
  return { ArrowLeft: 'moveLeft', ArrowRight: 'moveRight', ArrowUp: 'moveUp', ArrowDown: 'moveDown' }[k] || null;
}

function onKeyDown(e) {
  // 単体で開いた HTML では、Ctrl+S で HTML を保存し直す（ブラウザの「名前を付けて保存」は、描いた後のページを保存してしまうため止める。窓を開いている間も止める）
  if (standalone && (e.ctrlKey || e.metaKey) && !e.altKey && String(e.key || '').toLowerCase() === 's') {
    e.preventDefault();
    if (isDialogOpen()) toast('窓を閉じてから保存してください。');
    else runCommand('saveHtml');
    return;
  }
  if (isDialogOpen()) return;
  if (e.key === 'Escape' && ui.menuFor) { ui.menuFor = null; refreshCards(); return; }
  if (e.key === 'Escape' && ui.revMenu) { closeRevMenu(); return; }
  if (e.key === 'Escape' && ui.screenMenu) {
    const id = ui.screenMenu;
    closeScreenMenu();
    const more = [...document.querySelectorAll('.sl-more')].find((b) => b.dataset.id === id);
    if (more) more.focus();
    return;
  }
  const inField = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
  if (ui.view === 'editor' && !inField && !e.altKey && !e.isComposing) {
    const partCmd = editorKeyCommand(e);
    if (partCmd) { e.preventDefault(); runCommand(partCmd); return; }
  }
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const cmd = keyCommand(e);
  if (!cmd) return;
  if ((cmd === 'undo' || cmd === 'redo') && inField) return;
  if (cmd.startsWith('zoom') && ui.view !== 'editor') return;
  e.preventDefault();
  runCommand(cmd);
}

function onStoreChange() {
  aiNoteStoreChange(); // 人が直したら、AI が直した知らせ（紫の帯）を閉じる
  if (ui.view === 'home') renderHome();
  else updateEditor({ keepSide: keepSideOnNotify });
  refreshStandaloneBar();
}

// ── 10. AI の窓口（第 7 段階。AI設計基盤_設計書.md の 8・9 章）──────────────────
// AI（Claude Code など）の頼みを main から preload の aiAPI で受け、actions.* に直して実行し、返事を返す。
// 道具の決まりはここ 1 か所に置く（入口の mcp-server.js は、頼みをそのまま渡すだけ）。確かめの窓・ファイルを選ぶ窓を出す関数は呼ばない（8-5）。
// 読む道具は本当の中身（前の版を見ている間は store.realState）を読む。書く道具は store.batch() で 1 回の変更にする（8-1）。
// 返事は { ok: true, result } か { ok: false, error: { code, message, candidates? } }。画像と書き出しは render も返す（main が画像・PDF にする）。

// 断るときの例外。message は AI に返す日本語の文（理由と、人がすること）
class AiRefusal extends Error {
  constructor(code, message, extra = {}) {
    super(message);
    this.code = code;
    Object.assign(this, extra);
  }
}
const AI_REPLY_BUDGET = 24000; // 1 回の返事の文字の目安（Claude Code が道具の返事を切らない大きさ。設計書の 9-1）
const aiState = () => store.realState || store.state;
let aiQueue = Promise.resolve();
let imeComposing = false; // 人が日本語を変換している間（8-4。書く頼みは待つ）

// 頼みを 1 つずつ実行する（2 つの AI がつながっても、頼みが混ざらないように）
function aiDispatch(tool, args, ctx = {}) {
  const run = aiQueue.then(() => aiRun(tool, args, ctx));
  aiQueue = run.catch(() => {});
  return run;
}
async function aiRun(tool, args, ctx) {
  const t = own(AI_TOOLS, tool) ? AI_TOOLS[tool] : null;
  if (!t) return aiError({ code: 'unknown_tool', message: `「${tool}」という道具はありません。` });
  try {
    const out = await t.run(isObj(args) ? args : {}, { session: str(ctx.session), client: str(ctx.client) });
    if (out instanceof AiRendered) return { ok: true, result: out.result, render: out.render };
    return { ok: true, result: out };
  } catch (e) {
    if (e instanceof AiRefusal) return aiError(e);
    console.warn('AI の頼みの途中で問題が起きました:', e);
    return aiError({ code: 'internal', message: `アプリの中で問題が起きました（${(e && e.message) || e}）。` });
  }
}
function aiError(e) {
  const error = { code: e.code, message: e.message };
  if (e.candidates) error.candidates = e.candidates;
  return { ok: false, error };
}
// 画像・書き出しの返事（main が render の HTML を PNG・PDF にする）
class AiRendered {
  constructor(result, render) {
    this.result = result;
    this.render = render;
  }
}

// ── 指し方（8-6）── id がぴったり合うもの、なければ名前。2 つ以上に当たるときは候補を付けて断る
function aiKey(ref) {
  return typeof ref === 'number' && Number.isFinite(ref) ? String(ref) : str(ref).trim();
}
function aiPick(list, ref, what, { nameOf = (x) => x.name, candidate = (x) => ({ id: x.id, name: nameOf(x) }) } = {}) {
  const key = aiKey(ref);
  if (!key) throw new AiRefusal('bad_request', `${what}を id か名前で指してください。`);
  const byId = list.find((x) => x.id === key);
  if (byId) return byId;
  const name = cleanName(key);
  const hits = list.filter((x) => cleanName(nameOf(x)) === name);
  if (hits.length === 1) return hits[0];
  if (hits.length > 1) throw new AiRefusal('ambiguous', `「${key}」という${what}が ${hits.length} つあります。id で指してください。`, { candidates: hits.map(candidate) });
  throw new AiRefusal('not_found', `「${key}」という${what}は見つかりません。`);
}
// 画面設計。一覧にあるものを先に探し、なければごみ箱を探す。write のとき、ごみ箱のものは断る（人に一覧へ戻してもらう）
function aiResolveDesign(S, ref, { write = false } = {}) {
  const cand = (d) => ({ id: d.id, name: d.name, updatedAt: d.updatedAt, ...(d.trashedAt ? { trashed: true } : {}) });
  const live = S.designs.filter((d) => !d.trashedAt);
  let d;
  try {
    d = aiPick(live, ref, '画面設計', { candidate: cand });
  } catch (e) {
    if (!(e instanceof AiRefusal) || e.code !== 'not_found') throw e;
    d = aiPick(S.designs.filter((x) => x.trashedAt), ref, '画面設計', { candidate: cand });
  }
  if (write && d.trashedAt) throw new AiRefusal('trashed', `「${d.name}」はごみ箱にあるため、直せません。アプリのごみ箱から一覧に戻してから、もう一度頼んでください。`);
  return d;
}
const aiResolveScreen = (d, ref) => aiPick(d.screens, ref, `「${d.name}」の画面`);
const aiResolveItem = (d, ref) => aiPick(d.items, ref, `「${d.name}」のデータベースの項目`, { candidate: (it) => ({ id: it.id, name: it.name, type: it.type }) });
// 部品は id か赤い番号（数でも、数字の文字でも）
function aiResolvePart(sc, ref) {
  const key = aiKey(ref);
  const byId = sc.parts.find((p) => p.id === key);
  if (byId) return byId;
  if (/^\d+$/.test(key)) {
    const hits = sc.parts.filter((p) => p.no === Number(key));
    if (hits.length === 1) return hits[0];
    if (hits.length > 1) throw new AiRefusal('ambiguous', `「${sc.name}」の画面に、番号 ${key} の部品が ${hits.length} つあります。id で指してください。`, { candidates: hits.map((p) => ({ id: p.id, no: p.no, type: p.type })) });
  }
  throw new AiRefusal('not_found', `「${sc.name}」の画面に、「${key}」という部品は見つかりません（部品は id か赤い番号で指します）。`);
}
function aiResolveCallout(sc, ref) {
  const c = findCallout(sc, aiKey(ref));
  if (!c) throw new AiRefusal('not_found', `「${sc.name}」の画面に、「${aiKey(ref)}」という吹き出しは見つかりません（吹き出しは id で指します）。`);
  return c;
}
// 改訂履歴の行は id か版の番号（2・「第 2 版」）
function aiResolveRevision(d, ref) {
  const key = aiKey(ref);
  const byId = findRevision(d, key);
  if (byId) return byId;
  const m = key.match(/^(?:第\s*)?(\d+)(?:\s*版)?$/);
  const row = m ? versionRows(d).find((r) => r.no === Number(m[1])) : null;
  if (!row) throw new AiRefusal('not_found', `「${d.name}」の改訂履歴に「${key}」という行は見つかりません。`);
  return row;
}

// 返事を分ける（大きい一覧は cursor で続きを読む）。戻り値 { page, nextCursor（続きがなければ null）}。
// sizeOf は 1 つ分の文字の数（区切りの「,」の 1 字も数える）
function aiPage(list, cursor, budget = AI_REPLY_BUDGET, sizeOf = (x) => JSON.stringify(x).length + 1) {
  const start = Math.max(0, parseInt(cursor, 10) || 0);
  const page = [];
  let size = 0;
  for (let i = start; i < list.length; i++) {
    const n = sizeOf(list[i]);
    if (page.length && size + n > budget) return { page, nextCursor: String(i) };
    page.push(list[i]);
    size += n;
  }
  return { page, nextCursor: null };
}

// ── 読む道具 ──
function aiDesignSummary(d) {
  const latest = latestVersion(d);
  return {
    id: d.id, name: d.name, target: targetLabel(d.target), screens: d.screens.length, items: d.items.length,
    latestVersion: latest ? revisionTitle(latest) : null, updatedAt: d.updatedAt, ...(d.trashedAt ? { trashed: true } : {}),

}
function aiListDesigns(args) {

  const q = str(args.query);
  const ql = cleanName(q).toLowerCase();
  const list = [...visibleDesigns(S, q), ...(args.trashed ? trashedDesigns(S).filter((d) => !ql || d.name.toLowerCase().includes(ql)) : [])];
  const { page, nextCursor } = aiPage(list.map(aiDesignSummary), args.cursor);

}
function aiItemSummary(d, it, ctx) {
  const out = { id: it.id, name: it.name, type: it.type, typeName: itemTypeName(it.type), required: !!it.required, setting: describeItem(it, ctx) };
  if (it.type === 'table') out.columns = (it.props.columns || []).map((c) => ({ id: c.id, name: c.name, type: c.type }));
  if (it.type === 'status') out.states = [...(it.props.states || [])];
  if (it.link) out.importedFrom = { design: it.link.designName || '', lost: !!it.link.lost };
  out.screens = screensWithItem(d, it.id).map((s) => s.name);
  return out;
}
function aiGetDesign(args) {
  const S = aiState();
  const d = aiResolveDesign(S, args.design);
  const ctx = { design: d, state: S };
  const { page, nextCursor } = aiPage(d.items.map((it) => aiItemSummary(d, it, ctx)), args.cursor);
  const importedBy = S.designs.filter((x) => x.id !== d.id && !x.trashedAt).flatMap((x) => x.items
    .filter((it) => it.link && it.link.designId === d.id && !it.link.lost)
    .map((it) => ({ design: x.name, item: it.name, from: (findItem(d, it.link.itemId) || { name: '' }).name })));
  return {
    id: d.id, name: d.name, target: targetLabel(d.target), description: d.description, updatedAt: d.updatedAt, ...(d.trashedAt ? { trashed: true } : {}),
    items: page, itemsTotal: d.items.length, nextCursor,
    screens: d.screens.map((s) => ({ id: s.id, name: s.name, device: s.device, width: s.width, height: s.height, showHeader: s.showHeader, tablePos: s.tablePos, parts: s.parts.length, callouts: (s.callouts || []).length })),
    revisions: d.revisions.filter(isObj).map((r) => ({ id: r.id, kind: r.kind, title: revisionTitle(r), date: revisionDay(r), note: str(r.note), canRestore: hasSnapshot(r) })),
    importedBy,

}
function aiPartSummary(d, sc, raw, ctx) {
  const p = resolvePart(d, raw);
  const out = {
    id: raw.id, no: raw.no == null ? null : raw.no, type: raw.type,
    typeName: raw.type === 'table' ? `表（${TABLE_KINDS[raw.tableKind] || 'テーブル'}）` : partTypeName(raw.type),
    label: partTitle(p), x: raw.x, y: raw.y, w: raw.w, h: raw.h, setting: describePart(p, ctx),

  if (isInputType(raw.type)) Object.assign(out, { labelPos: raw.labelPos, sample: raw.sample || '', placeholder: raw.placeholder || '' });

// 画面の中身。部品・吹き出し・部品の設定の一覧表の行を、この順に 1 つの並びにして、返事全体が目安に収まるように分ける
// （どれか 1 つだけを分けると、ほかの並びが大きいときに目安を超えるため）。ページごとの parts・callouts・table は、その並びの続きの分だけ

// ── 書く道具の共通の流れ（設計書の 8 章）──
const AI_BUSY_WAIT_MS = 2000; // 人がドラッグ・日本語の変換をしている間に、書く頼みを待つ長さ（8-4）
// AI のアプリの名前（入口が MCP のつなぎ始めに受け取った名前。「Claude Code が直す前の状態」の行に書く。8-3）
const AI_CLIENT_NAMES = { 'claude-code': 'Claude Code', 'claude-ai': 'Claude' };
const aiClientLabel = (client) => AI_CLIENT_NAMES[client] || cleanName(client, 40) || 'AI';
const aiBad = (message) => new AiRefusal('bad_request', message);

// 書けない状態なら断る（8-4）
function aiCheckWritable() {
  if (store.isViewing) {
    const d = findDesign(store.realState, ui.designId);
    throw new AiRefusal('viewing', `アプリで「${d ? d.name : '画面設計'}」の前の版を見ているため、今は直せません。アプリの黄色い帯の「見るのをやめる」を押してから、もう一度頼んでください。`);
  }
  if (store.blockReason) throw new AiRefusal('blocked', `アプリが保存を止めているため、直せません（理由: ${store.blockReason}）。`);
  // 「AI とつなぐ」「変更内容を見る」の窓（aiPassive）は、見るだけなので止めない
  const overlay = $('#dialog-root .modal-overlay');
  if (overlay && !overlay.hasAttribute('data-ai-passive')) throw new AiRefusal('dialog', 'アプリで確かめの窓が開いています。閉じてから、もう一度頼んでください。');
}
// 人がドラッグ・日本語の変換をしている間は、2 秒まで待つ。終わらなければ断る
async function aiWaitIdle() {
  const t0 = Date.now();
  while (drag || imeComposing) {
    if (Date.now() - t0 >= AI_BUSY_WAIT_MS) throw new AiRefusal('busy', 'アプリで人が操作しています。少し待ってから、もう一度頼んでください。');
    await new Promise((r) => setTimeout(r, 100));
  }
}

// 書く道具の共通の流れ。opts は { design（指す画面設計。新しく作る道具は書かない）, expect（読んだときの更新の印）, noBeforeRow }。
// run(tx) は store.batch の中で actions を呼び、返事の中身を返す（例外を投げると、何も変えずに断る）。
// tx は { ctx, design（指した画面設計）, warnings（返事に添える注意）, createdDesign（新しく作った画面設計の id）}
async function aiWrite(ctx, opts, run) {
  aiCheckWritable();
  await aiWaitIdle();
  aiCheckWritable(); // 待っている間に、確かめの窓が開いたかもしれない
  flushSideField(); // 右の欄の打ちかけの文字は、人の 1 回の変更として先に確定する（8-5）
  const S = store.state;
  const d = opts.design === undefined ? null : aiResolveDesign(S, opts.design, { write: true });
  if (d && opts.expect != null && opts.expect !== '' && str(opts.expect) !== d.updatedAt) {
    throw new AiRefusal('stale', `「${d.name}」は、読んだ後にアプリで直されました。読み直してから頼んでください（今の更新の印: ${d.updatedAt}）。`);
  }
  const tx = { ctx, design: d, warnings: [], createdDesign: null, noBeforeRow: !!opts.noBeforeRow };
  const beforeMap = new Map(S.designs.map((x) => [x.id, designJsonWithRefs(x)]));
  // 「AI が直す前の状態」の行は、直す前に作っておき、中身が変わったときだけ入れる（8-3）
  const row = d ? Object.assign(revisionRow(d, 'ai', { note: `${aiClientLabel(ctx.client)} が直す前の状態` }), { aiSession: ctx.session }) : null;
  const rowAt = d ? d.revisions.length : 0;
  const beforeContent = d ? designContent(d) : null;
  const hadHistory = store.undoStack.length > 0 || store.redoStack.length > 0;
  const seen = aiViewBefore(S); // 知らせ（紫・オレンジの帯と光らせ方）のため、直す前の様子を控える
  let mode = true;
  let out;
  let changed;
  aiView.writing = true;
  try {
    ({ changed } = store.batch(() => {
      out = run(tx);
      if (d && !tx.noBeforeRow) aiAddBeforeRow(tx, d.id, row, rowAt, beforeContent);
    }, { history: () => (mode = aiHistoryMode(tx, beforeMap)) }));
  } finally {
    aiView.writing = false;
  }
  if (changed) aiAfterWrite(tx, mode, hadHistory, beforeMap, seen);
  try {
    await store.whenSaved();
  } catch (e) {
    throw new AiRefusal('save_failed', `変更はアプリに入りましたが、ファイルへの保存に失敗しました（${(e && e.message) || e}）。アプリの赤い帯の案内を確かめてください。`);
  }
  const dd = d ? findDesign(store.state, d.id) : null;
  return { ...out, changed: !!changed, ...(dd ? { updatedAt: dd.updatedAt } : {}), ...(tx.warnings.length ? { warnings: tx.warnings } : {}) };
}
// その接続（session）で、その画面設計への最初の変更のときだけ、直す前の中身の行を入れる（行には session を書いておく。
// 元に戻すで行が消えたら、次の変更でまた入る）
function aiAddBeforeRow(tx, designId, row, at, beforeContent) {
  const d = findDesign(store.state, designId);
  if (!d || designContent(d) === beforeContent) return;
  if (d.revisions.some((r) => isObj(r) && r.kind === 'ai' && r.aiSession === row.aiSession)) return;
  d.revisions.splice(Math.min(at, d.revisions.length), 0, row);
  trimAiRows(d);
}
// 「AI が直す前の状態」の行は、画面設計ごとに新しい方から 10 行まで残し、11 行目ができたら古い行から消す
// （人の付けた版の行と、ほかの自動の行は消さない。行は古い順に並んでいる）
const AI_ROWS_MAX = 10;

  const aiRows = d.revisions.filter((r) => isObj(r) && r.kind === 'ai');
  if (aiRows.length <= AI_ROWS_MAX) return;
  const drop = new Set(aiRows.slice(0, aiRows.length - AI_ROWS_MAX));
  for (let i = d.revisions.length - 1; i >= 0; i--) if (drop.has(d.revisions[i])) d.revisions.splice(i, 1);
}
// 元に戻すの履歴の扱い（8-2）。AI の変更が、人が開いている画面設計（と、そこから項目を取り込んでいる画面設計）の中だけなら積む。
// 開いていない画面設計・新しい画面設計を変えたときは、履歴を消す（履歴は状態まるごとの写しなので、人の Ctrl+Z で AI の変更まで消えないように）

  const open = ui.view === 'editor' ? ui.designId : null;

  const S = store.state;
  const allowed = new Set([open, ...S.designs.filter((x) => x.items.some((it) => it.link && it.link.designId === open)).map((x) => x.id)]);
  const inside = S.designs.every((x) => {
    const old = beforeMap.get(x.id);
    return old !== undefined && (old === designJsonWithRefs(x) || allowed.has(x.id));

  return inside ? true : 'clear';
}
// ops（操作の並び）を 1 つずつ実行する。断るときは、何番目の操作かを文の頭に付ける

const aiUnknownOp = (op, names) => aiBad(`「${str(op.op)}」という操作はありません（使える操作: ${names.join('・')}）。`);

// 部品の種類の設定の欄（PART_TYPES の props）を検め、直して返す。知らない欄・形の違う値は、使える欄・値を添えて断る
function aiProps(type, props, d) {

  const out = {};
  Object.entries(props).forEach(([k, v]) => {

    const def = t.props[k];

    if (Array.isArray(def)) out[k] = aiArr(v, k).map((x) => aiStrVal(x, `「${k}」の中身`));

function aiTableColumns(cur, cols) {

  return cols.map((c, i) => {

    const old = cur.find((x) => x.name === name);

  Object.keys(props).forEach((k) => { if (!allowed.includes(k)) throw aiBad(`${TABLE_KINDS[kind]}の設定に「${k}」という欄はありません（使える欄: ${allowed.join('・')}）。`); });

  if ('db' in props) {

    const id = actions.createDesign(name, resolveTargetName(str(args.target)));

    tx.createdDesign = id;

}

const AI_ALIGN = ['left', 'hcenter', 'right', 'top', 'vcenter', 'bottom', 'hdist', 'vdist', 'width', 'height'];
async function aiEditParts(args, ctx) {
  return aiWrite(ctx, { design: args.design, expect: args.expect }, (tx) => {
    const sid = aiResolveScreen(tx.design, args.screen).id;
    return { screen: sid, parts: aiRunOps(args.ops, (op) => aiPartOp(tx, sid, op)) };
  });
}
function aiPartOp(tx, sid, op) {
  const id = tx.design.id;
  const d = () => findDesign(store.state, id);
  const sc = () => findScreen(id, sid);
  const part = (ref) => aiResolvePart(sc(), ref);
  const sel = (refs) => aiArr(refs, 'parts').map((r) => ({ k: 'p', id: part(r).id }));
  const brief = (pid) => {
    const p = findPart(sc(), pid);
    return p ? { id: p.id, no: p.no, type: p.type, label: partTitle(resolvePart(d(), p)), x: p.x, y: p.y, w: p.w, h: p.h } : { id: pid };
  };
  switch (op.op) {
    case 'update': {
      const p = part(op.part);
      actions.updatePart(id, sid, p.id, aiPartPatch(tx, d(), p, op));
      return { op: 'update', ...brief(p.id) };
    }
    case 'move': {
      const p = part(op.part);
      const r = { x: p.x, y: p.y, w: p.w, h: p.h };
      ['x', 'y', 'w', 'h'].forEach((k) => { if (op[k] !== undefined) r[k] = aiNum(op[k], k); });
      if (r.y + r.h > sc().height) actions.updateScreen(id, sid, { height: heightToFit(r.y + r.h, sc().device) }); // 下へはみ出すときは画面を伸ばす
      actions.movePart(id, sid, p.id, r);
      return { op: 'move', ...brief(p.id) };
    }
    case 'move_by': {
      const s = sel(op.parts);
      actions.moveMany(id, sid, s, op.dx == null ? 0 : aiNum(op.dx, 'dx'), op.dy == null ? 0 : aiNum(op.dy, 'dy'));
      return { op: 'move_by', parts: s.map((x) => brief(x.id)) };
    }
    case 'delete': {
      const p = part(op.part);
      const b = brief(p.id);
      actions.deletePart(id, sid, p.id);
      return { op: 'delete', ...b };
    }
    case 'renumber':
      actions.renumberParts(id, sid);
      return { op: 'renumber', parts: sc().parts.filter((p) => p.no != null).map((p) => ({ id: p.id, no: p.no })) };
    case 'align': {
      if (!AI_ALIGN.includes(op.how)) throw aiBad(`how は ${AI_ALIGN.map((x) => `"${x}"`).join('・')} です。`);
      const s = sel(op.parts);
      if (s.length < 2) throw aiBad('揃えるときは、部品を 2 つ以上書いてください（最初に書いた部品に合わせます）。');
      actions.alignMany(id, sid, s, op.how);
      return { op: 'align', parts: s.map((x) => brief(x.id)) };
    }
    case 'table_kind': {
      const p = part(op.part);
      if (p.type !== 'table') throw aiBad('表の中身を変えられるのは、表の部品だけです。');
      if (!own(TABLE_KINDS, op.kind)) throw aiBad('kind は "subtable"（テーブル）・"records"（レコード一覧）・"related"（関連レコード一覧）です。');
      actions.setTableKind(id, sid, p.id, op.kind);
      return { op: 'table_kind', ...brief(p.id), tableKind: op.kind };
    }
    case 'number': {
      if (typeof op.on !== 'boolean') throw aiBad('on は true（番号を付ける）か false（外す）です。');
      const s = sel(op.parts);
      actions.numberMany(id, sid, s, op.on);
      return { op: 'number', parts: s.map((x) => brief(x.id)) };
    }
    default: throw aiUnknownOp(op, AI_PART_OPS);
  }
}
// 部品を直す欄を、actions.updatePart の patch に直す（項目を指す部品の項目名・必須・メモ・設定は項目に書かれる）
function aiPartPatch(tx, d, p, op) {
  const item = p.itemId && isItemPart(p) ? findItem(d, p.itemId) : null;
  const orphan = !!p.itemId && isItemPart(p) && !item;
  const itemFields = ['label', 'required', 'memo', 'props'].filter((k) => op[k] !== undefined);
  if (itemFields.length && item && item.link) throw new AiRefusal('linked', `この部品の項目「${item.name}」は「${item.link.designName}」から取り込んだ項目なので、${itemFields.join('・')} はここでは直せません。`);
  if (itemFields.length && orphan) throw aiBad(`この部品の項目は一覧表から消してあるので、${itemFields.join('・')} は直せません（edit_items の restore で、項目を一覧表に戻せます）。`);
  const patch = {};
  if (op.label !== undefined) {
    const v = aiStrVal(op.label, 'label');
    if (item && !cleanName(v)) throw aiBad('項目名を空にはできません。');
    patch.label = item ? cleanName(v) : v;
  }
  if (op.required !== undefined) patch.required = !!op.required;
  if (op.memo !== undefined) patch.memo = aiStrVal(op.memo, 'memo');
  if (op.props !== undefined) {
    if (item) patch.props = aiItemProps(d, item, op.props);
    else if (p.type === 'table') patch.props = aiTablePartProps(p.tableKind, p.props, op.props, d);
    else patch.props = aiProps(p.type, op.props, d);
  }
  if ((op.style !== undefined || op.to !== undefined) && p.type !== 'button') throw aiBad('style・to を書けるのはボタンだけです。');
  if (p.type === 'button' && (op.style !== undefined || op.to !== undefined)) {
    const base = { ...(p.props || {}), ...(patch.props || {}) };
    patch.props = { ...(patch.props || {}), ...aiButtonProps(tx, op, base) };
  }
  if (op.labelPos !== undefined) {
    if (!['top', 'left'].includes(op.labelPos)) throw aiBad('labelPos は "top"（入力欄の上）か "left"（入力欄の左）です。');
    patch.labelPos = op.labelPos;
  }
  ['sample', 'placeholder'].forEach((k) => { if (op[k] !== undefined) patch[k] = aiStrVal(op[k], k); });
  if (op.numbered !== undefined) {
    if (typeof op.numbered !== 'boolean') throw aiBad('numbered は true か false です。');
    patch.numbered = op.numbered;
  }
  if (op.no === null) patch.numbered = false;
  if (op.rows !== undefined) {
    if (p.type !== 'table') throw aiBad('rows（見本の行の数）を書けるのは表だけです。');
    const n = Math.round(aiNum(op.rows, 'rows'));
    if (n < 1 || n > 20) throw aiBad('rows は 1〜20 です。');
    patch.view = { rows: n };
  }
  if (op.current !== undefined) {
    if (!['status', 'steps'].includes(p.type) || !item) throw aiBad('current を書けるのは、ステータスの印と進み具合の矢印だけです。');
    patch.view = { ...(patch.view || {}), current: aiStatusCurrent(item, op.current) };
  }
  if (!Object.keys(patch).length) throw aiBad('直す欄を 1 つ以上書いてください（label・required・memo・props・style・to・labelPos・sample・placeholder・numbered・rows・current）。');
  return patch;
}

// ── 書く道具: 吹き出し ──
const AI_CALLOUT_OPS = ['add', 'update', 'move', 'delete'];
const AI_CALLOUT_OUTSIDE = 24; // 吹き出しを置く既定の位置: つなぐ部品の右の、画面の外 24 ドット（Claude が決めた）
async function aiEditCallouts(args, ctx) {
  return aiWrite(ctx, { design: args.design, expect: args.expect }, (tx) => {
    const sid = aiResolveScreen(tx.design, args.screen).id;
    return { screen: sid, callouts: aiRunOps(args.ops, (op) => aiCalloutOp(tx, sid, op)) };
  });
}
function aiCalloutOp(tx, sid, op) {
  const id = tx.design.id;
  const sc = () => findScreen(id, sid);
  const colorOf = (v) => {
    if (!own(CALLOUT_COLORS, v)) throw aiBad(`color は ${Object.keys(CALLOUT_COLORS).map((k) => `"${k}"（${CALLOUT_COLORS[k][0]}）`).join('・')} です。`);
    return v;
  };
  const tipOf = (v) => {
    if (!['dot', 'arrow', 'none'].includes(v)) throw aiBad('tip は "dot"（点）・"arrow"（矢印）・"none"（なし）です。');
    return v;
  };
  const brief = (cid) => {
    const c = findCallout(sc(), cid);
    const t = c.target ? findPart(sc(), c.target) : null;
    return { id: c.id, text: c.text, color: c.color, tip: c.tip, x: c.x, y: c.y, w: c.w, h: c.h, target: t ? { id: t.id, no: t.no } : null };
  };
  const rectOf = (c) => {
    const r = { x: c.x, y: c.y, w: c.w, h: c.h };
    ['x', 'y', 'w', 'h'].forEach((k) => { if (op[k] !== undefined) r[k] = aiNum(op[k], k); });
    return r;
  };
  switch (op.op) {
    case 'add': {
      const text = op.text == null ? '' : aiStrVal(op.text, 'text');
      if (!text.trim()) throw aiBad('吹き出しの文（text）を書いてください。');
      const target = op.target == null ? null : aiResolvePart(sc(), op.target);
      const at = { x: sc().width + AI_CALLOUT_OUTSIDE, y: target ? target.y : AI_FIRST_ROW_Y };
      if (op.x === undefined && op.y === undefined) while (sc().callouts.some((c) => c.x === at.x && c.y === at.y)) at.y += PALETTE_EXTRA.callout.h + 16;
      const cid = actions.addCallout(id, sid, rectOf(at), target ? target.id : null);
      const patch = { text };
      if (op.color !== undefined) patch.color = colorOf(op.color);
      if (op.tip !== undefined) patch.tip = tipOf(op.tip);
      actions.updateCallout(id, sid, cid, patch);
      if (op.w !== undefined || op.h !== undefined) actions.moveCallout(id, sid, cid, rectOf(findCallout(sc(), cid)));
      return { op: 'add', ...brief(cid) };
    }
    case 'update': {
      const c = aiResolveCallout(sc(), op.callout);
      const patch = {};
      if (op.text !== undefined) patch.text = aiStrVal(op.text, 'text');
      if (op.color !== undefined) patch.color = colorOf(op.color);
      if (op.tip !== undefined) patch.tip = tipOf(op.tip);
      if (op.target !== undefined) patch.target = op.target === null ? null : aiResolvePart(sc(), op.target).id;
      if (!Object.keys(patch).length) throw aiBad('直す欄（text・color・tip・target）を 1 つ以上書いてください。');
      actions.updateCallout(id, sid, c.id, patch);
      return { op: 'update', ...brief(c.id) };
    }
    case 'move': {
      const c = aiResolveCallout(sc(), op.callout);
      actions.moveCallout(id, sid, c.id, rectOf(c));
      return { op: 'move', ...brief(c.id) };
    }
    case 'delete': {
      const c = aiResolveCallout(sc(), op.callout);
      const b = brief(c.id);
      actions.deleteCallout(id, sid, c.id);
      return { op: 'delete', ...b };
    }
    default: throw aiUnknownOp(op, AI_CALLOUT_OPS);
  }
}

// ── 書く道具: 改訂履歴（AI は行を消せない。設計書の 1-4）──
async function aiAddRevision(args, ctx) {
  return aiWrite(ctx, { design: args.design, expect: args.expect }, (tx) => {
    const rid = actions.addRevision(tx.design.id, { note: args.note == null ? '' : aiStrVal(args.note, 'note') });
    const r = findRevision(findDesign(store.state, tx.design.id), rid);
    return { revision: { id: r.id, no: r.no, title: revisionTitle(r), date: revisionDay(r), changes: Array.isArray(r.changes) ? r.changes.length : null } };
  });
}
// 前の版に戻す。戻す前の中身は「戻す前の状態」の行に残るので、「AI が直す前の状態」の行は足さない
async function aiRestoreRevision(args, ctx) {
  return aiWrite(ctx, { design: args.design, expect: args.expect, noBeforeRow: true }, (tx) => {
    const r = aiResolveRevision(tx.design, args.revision);
    if (!hasSnapshot(r)) throw new AiRefusal('no_snapshot', `「${revisionTitle(r)}」の行には写しがないため、戻せません（HTML から足した画面設計の行など）。`);
    actions.restoreRevision(tx.design.id, r.id);
    const d = findDesign(store.state, tx.design.id);
    const auto = d.revisions[d.revisions.length - 1];
    return { restored: { id: r.id, title: revisionTitle(r), date: revisionDay(r) }, beforeRow: { id: auto.id, title: revisionTitle(auto), note: auto.note } };
  });
}

// ── 画像と書き出し（main が render の HTML を PNG・PDF にし、決めたフォルダへ書く。ファイルの窓は出さない。設計書の 8-7）──
const aiDesignBrief = (d) => ({ id: d.id, name: d.name, updatedAt: d.updatedAt });
// 画面の画像。withTable が true なら、部品の設定の一覧表と吹き出しも写す（書き出しの PNG と同じ形）。false なら画面だけ
async function aiGetScreenImage(args) {
  flushSideField(); // 右の欄の打ちかけの文字を入れてから写す（8-5）
  const S = aiState();
  const d = aiResolveDesign(S, args.design);
  const sc = aiResolveScreen(d, args.screen);
  const full = args.withTable === true;
  const doc = exportPngDocs(d, S, [sc.id], null, { table: full, callouts: full })[0];
  return new AiRendered(
    { design: aiDesignBrief(d), screen: { id: sc.id, name: sc.name, device: sc.device, width: sc.width, height: sc.height }, withTable: full },
    { kind: 'image', html: doc.html, width: doc.width, height: doc.height },
  );
}
const AI_EXPORT_FORMATS = ['pdf', 'html', 'png'];
// 書き出す。設定は書き出しの窓と同じ（PDF: 用紙・向き・表紙・つながりの図・項目の一覧表、PDF と PNG: 画面、全部: 違いの印を付ける版）
async function aiExportDesign(args) {
  flushSideField();
  const S = aiState();
  const d = aiResolveDesign(S, args.design);
  const format = str(args.format);
  if (!AI_EXPORT_FORMATS.includes(format)) throw aiBad(`format は ${AI_EXPORT_FORMATS.map((x) => `"${x}"`).join('・')} です。`);
  const screenIds = args.screens == null ? null : aiArr(args.screens, 'screens').map((r) => aiResolveScreen(d, r).id);
  let diffRevId = null;
  if (args.diffWith != null) {
    const r = aiResolveRevision(d, args.diffWith);
    if (!isVersionRow(r) || !hasSnapshot(r)) throw aiBad('違いの印で比べられるのは、写しのある版の行だけです（自動の行とは比べません）。');
    diffRevId = r.id;
  }
  const base = safeFileName(d.name);
  const result = { design: aiDesignBrief(d), format, ...(diffRevId ? { diffWith: revisionTitle(findRevision(d, diffRevId)) } : {}) };
  if (format === 'html') {
    return new AiRendered(result, { kind: 'files', files: [{ name: `${base}.html`, text: buildStandaloneHtml(d, S, { diffRevId }) }] });
  }
  if (format === 'png') {
    const docs = exportPngDocs(d, S, screenIds, diffRevId);
    if (!docs.length) throw aiBad('書き出す画面を 1 つ以上選んでください。');
    return new AiRendered({ ...result, screens: docs.length }, { kind: 'png', files: docs.map(({ name, html, width, height }) => ({ name, html, width, height })) });
  }
  const paper = args.paper == null ? 'A4' : str(args.paper);
  if (!['A4', 'A3', 'slide'].includes(paper)) throw aiBad('paper は "A4"・"A3"・"slide"（16:9 の横）です。');
  const orient = paper === 'slide' ? 'landscape' : args.orient == null ? 'landscape' : str(args.orient);
  if (!['landscape', 'portrait'].includes(orient)) throw aiBad('orient は "landscape"（横）か "portrait"（縦）です。');
  const opts = {
    paper, orient, screenIds, diffRevId,
    cover: args.cover !== false, map: args.map !== false && hasMapLinks(d, S), items: args.items !== false && d.items.length > 0,
  };
  if (screenIds && !screenIds.length && !opts.cover && !opts.map && !opts.items) throw aiBad('入れるページか、書き出す画面を 1 つ以上選んでください。');
  const doc = exportDocument(d, S, opts);
  return new AiRendered(
    { ...result, paper, orient, pages: doc.total, cover: opts.cover, map: opts.map, items: opts.items },
    { kind: 'pdf', files: [{ name: `${base}.pdf`, html: doc.html, pageSize: { width: doc.P.wi, height: doc.P.hi } }] },
  );
}

// 日本語の変換中と、窓が隠れたとき（AI がつながっている間の × は窓を隠すだけなので、打ちかけの文字をここで確定する）
function bindAiEvents() {
  document.addEventListener('compositionstart', () => { imeComposing = true; }, true);
  document.addEventListener('compositionend', () => { imeComposing = false; }, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSideField(); });
  if (!window.aiAPI) return;
  window.aiAPI.onRequest((r) => aiDispatch(r && r.tool, r && r.args, { session: r && r.session, client: r && r.client }));
  if (window.aiAPI.onStatus) window.aiAPI.onStatus(onAiStatus);
  window.aiAPI.ready();
}
