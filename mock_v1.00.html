<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モックイメージメーカー</title>
<style>
/* ── 全体 ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Segoe UI','Yu Gothic UI','Meiryo',sans-serif;background:#f1f5f9;color:#1e293b;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:13px;color:#1e293b}
.spacer{flex:1}

/* 保存を止めているときの帯・お知らせ */
#banner{background:#fef2f2;color:#991b1b;border-bottom:1px solid #fecaca;padding:8px 16px;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#f8fafc;padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:50;max-width:80vw}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:#f1f5f9}
.btn.primary{background:#1d3f6e;border-color:#1d3f6e;color:#fff;font-weight:600}
.btn.primary:hover{background:#25528f}
.btn.danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
.btn.danger:hover{background:#b91c1c}
.btn.small{padding:4px 10px;font-size:12px}
.btn.small.danger-text{color:#dc2626}
.btn.on{background:#eff6ff;border-color:#2563eb;color:#1d4ed8;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}

/* 上の細い帯（アプリ名） */
.brandbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #e2e8f0;padding:6px 16px;min-height:38px;flex-shrink:0}
.brand{font-weight:700;font-size:13px;color:#0f172a}
.brand-ver{font-size:11px;color:#94a3b8}
.brand-design{font-size:13px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 作る先の印 */
.chip{display:inline-block;padding:1px 9px;border:1px solid #cbd5e1;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;white-space:nowrap}
.chip.t-kintone{background:#fff7e6;border-color:#f5c26b;color:#a15c00}
.chip.t-salesforce{background:#e8f4fd;border-color:#7cc0f0;color:#0b6fb3}
.chip.t-claude{background:#f3edff;border-color:#c4a8f5;color:#6d3fc9}

/* ── 最初の画面（画面設計の一覧）─────────────────────── */
.home-scroll{flex:1;overflow:auto}
.home{max-width:1120px;margin:0 auto;padding:22px 24px 40px}
.home.wide{max-width:none}
.home-head{display:flex;align-items:center;gap:10px}
.home-head h1{font-size:22px;font-weight:700;color:#0f172a}
.search{display:flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 10px;width:240px}
.search input{border:none;outline:none;padding:7px 0;width:100%;background:transparent}
.search:focus-within{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.home-note{color:#64748b;font-size:12px;margin:8px 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.empty{color:#64748b;padding:32px 4px;font-size:14px}
.card{position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:visible}
.card:hover{border-color:#94a3b8;box-shadow:0 2px 10px rgba(15,23,42,.08)}
.card-open{display:block;width:100%;border:none;background:none;text-align:left;cursor:pointer;border-radius:10px}
.card-thumb{height:160px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.card-body{padding:12px 16px 14px}
.card-name{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:24px}
.card-meta{display:flex;align-items:center;gap:6px;color:#64748b;font-size:12px;margin-bottom:4px}
.card-date{color:#64748b;font-size:12px}
.card-more{position:absolute;right:10px;bottom:10px;width:30px;height:26px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;color:#64748b;font-size:16px;line-height:1}
.card-more:hover{background:#f1f5f9;border-color:#cbd5e1}
.card-menu{position:absolute;right:10px;bottom:40px;z-index:10;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:4px;min-width:170px;display:flex;flex-direction:column}
.card-menu button{border:none;background:none;text-align:left;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.card-menu button:hover{background:#f1f5f9}
.card-menu button.danger{color:#dc2626}
.trash{margin-top:28px;border-top:1px solid #e2e8f0;padding-top:14px}
.trash-toggle{border:none;background:none;cursor:pointer;color:#475569;font-size:13px;font-weight:600;padding:4px 2px}
.trash-list{margin-top:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:6px 14px}
.trash-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.trash-row:last-of-type{border-bottom:none}
.trash-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-date{color:#64748b;font-size:12px;margin-left:auto;white-space:nowrap}
.trash-empty,.trash-note{color:#64748b;font-size:12px;padding:8px 0}

/* 縮小画像（画面を同じ HTML で描いて縮める） */
.thumb{position:relative;overflow:hidden;background:#fff;border:1px solid #cbd5e1;flex-shrink:0}
.thumb-scale{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

/* ── 小さな窓（名前を聞く・確かめる）────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.modal{background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.35);width:min(440px,calc(100vw - 32px));padding:20px 22px 18px}
.modal.wide{width:min(920px,calc(100vw - 32px))}
/* ほかのモックから項目を取り込む窓（画像 q21） */
.imp{display:flex;gap:14px;height:min(380px,calc(100vh - 260px))}
.imp-left{width:320px;flex-shrink:0;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;min-height:0}
.imp-right{flex:1;min-width:0;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;min-height:0}
.imp-head{padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:700;color:#334155;display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:8px 8px 0 0}
.imp-head .spacer{flex:1}
.imp-search{margin:8px 10px}
.imp-search input{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:5px 8px}
.imp-list{overflow:auto;padding:0 6px 6px;min-height:0}
.imp-design{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;margin-bottom:3px}
.imp-design:hover{background:#f8fafc}
.imp-design.on{background:#eff6ff;border-color:#93c5fd}
.imp-design .nm{font-weight:700;font-size:13px}
.imp-design .mt{font-size:11px;color:#64748b;display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.imp-items{overflow:auto;min-height:0}
.imp-items table{border-collapse:collapse;width:100%;font-size:12.5px}
.imp-items th,.imp-items td{border-bottom:1px solid #e2e8f0;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.5}
.imp-items th{background:#f8fafc;color:#475569;font-size:11.5px;position:sticky;top:0}
.imp-items td.ck{width:32px;text-align:center}
.imp-items tr.dis td{color:#94a3b8}
.imp-items td.set{white-space:pre-line}
.imp-items td:nth-child(3){white-space:nowrap}
.imp-empty{color:#64748b;font-size:12.5px;padding:14px;line-height:1.6}
.imp-foot{font-size:12.5px;color:#334155;margin-top:12px}
.tag.warn{background:#fff7ed;color:#9a3412;border:1px solid #fdba74;font-weight:400}
.tag.done{background:#dcfce7;color:#166534;border:1px solid #86efac;font-weight:400}
.link-btn{border:none;background:none;color:#2563eb;cursor:pointer;font-size:12px;padding:0}
.modal h2{font-size:16px;margin-bottom:14px;color:#0f172a}
.modal p{font-size:13px;line-height:1.6}
.modal .warn{color:#b91c1c;margin-top:6px}
.modal-error{color:#dc2626;font-size:12px;margin-top:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span:first-child{font-size:12px;color:#475569;font-weight:600}
.field input[type=text],.field textarea,.target-picker select,.target-picker input{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;background:#fff}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field input:focus,.field textarea:focus,.target-picker select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.target-picker{display:flex;flex-direction:column;gap:6px}
.hint{color:#64748b;font-size:12px;line-height:1.5}

/* ── 編集の画面 ─────────────────────────────────────── */
/* メニューバー（ビジネスダイアグラムメーカーの .rgroup などから写した） */
#toolbar{background:#f8fafc;color:#334155;padding:4px 8px 0;display:flex;flex-shrink:0;border-bottom:1px solid #cbd5e1;box-shadow:0 1px 4px rgba(15,23,42,.12);position:relative;z-index:2;overflow-x:auto}
.rgroup{display:flex;flex-direction:column;flex:0 0 auto;padding:0 7px 0 4px;border-right:1px solid #e2e8f0;margin-right:3px}
.gbody{flex:1;display:flex;align-items:flex-start;gap:2px;padding:2px 2px 0}
.glabel{text-align:center;font-size:10px;color:#64748b;padding:3px 2px 4px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.stack .tbtn{display:flex;align-items:center;gap:5px;text-align:left}
.bigbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:5px 7px 4px;border-radius:5px;border:1px solid transparent;background:transparent;color:#334155;font-size:11px;line-height:1.25;cursor:pointer}
.bigbtn .ico{font-size:20px;line-height:1}
.bigbtn:hover{background:#e2e8f0;color:#0f172a}
.bigbtn.on{background:#2563eb;color:#fff;border-color:#3b82f6}
.tbtn{background:transparent;border:1px solid transparent;color:#334155;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;white-space:nowrap}
.tbtn:hover{background:#e2e8f0;color:#0f172a}
.tbtn:disabled{opacity:.4;cursor:default;background:transparent}
.bigbtn:disabled{opacity:.4;cursor:default}
.zoom-label{min-width:52px;color:#475569;align-self:center}

.editor-body{flex:1;min-height:0;display:flex}
.screen-list{width:192px;flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;overflow-y:auto;padding:12px 12px 20px}
.panel-title{font-size:12px;font-weight:700;color:#334155;margin-bottom:10px}
.sl-item{display:block;width:100%;border:none;background:none;text-align:left;cursor:pointer;margin-bottom:12px;padding:0}
.sl-thumb{display:flex;justify-content:center;padding:6px;border:2px solid transparent;border-radius:6px;background:#f8fafc}
.sl-item.active .sl-thumb{border-color:#2563eb}
.sl-item:hover .sl-thumb{background:#eef2f7}
.sl-name{font-size:12px;color:#475569;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-item.active .sl-name{color:#1d4ed8;font-weight:600}
/* 画面の一覧の「…」・並べ替え・「＋ 画面を足す」（画像 q31・q29） */
.sl-wrap{position:relative;padding-bottom:12px}
.sl-wrap .sl-item{margin-bottom:0}
.sl-more{position:absolute;right:6px;top:6px;width:26px;height:22px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;color:#475569;font-size:14px;line-height:1;cursor:pointer;opacity:0}
.sl-wrap:hover .sl-more,.sl-wrap:focus-within .sl-more,.sl-more.open{opacity:1}
.sl-more:hover{background:#f1f5f9}
.sl-wrap.drop-before::before,.sl-wrap.drop-after::after{content:'';position:absolute;left:0;right:0;height:3px;background:#2563eb;border-radius:2px}
.sl-wrap.drop-before::before{top:-8px}
.sl-wrap.drop-after::after{bottom:4px}
body.screen-sorting,body.screen-sorting *{cursor:grabbing!important}
body.screen-sorting .sl-item.dragging{opacity:.4}
.sl-add{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:8px 0;border:1px dashed #94a3b8;border-radius:8px;background:#f8fafc;color:#1d3f6e;font-weight:700;cursor:pointer}
.sl-add:hover{background:#eef2f7}
.screen-menu{position:fixed;z-index:30;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:4px;min-width:170px;display:flex;flex-direction:column}
.screen-menu button{border:none;background:none;text-align:left;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.screen-menu button:hover{background:#f1f5f9}
.screen-menu button.danger{color:#dc2626}
.screen-menu button:disabled{color:#94a3b8;cursor:default;background:none}
.screen-menu hr{border:none;border-top:1px solid #e2e8f0;margin:4px 0}
/* 「画面を足す」の窓のひな形の札 */
.tpl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tpl{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:6px;text-align:center;cursor:pointer}
.tpl:hover{border-color:#94a3b8}
.tpl.sel{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.35)}
.tpl .th{height:112px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:4px;overflow:hidden}
.tpl b{display:block;margin-top:6px;font-size:13px}
.tpl small{display:block;color:#64748b;font-size:11px;line-height:1.4}
.tpl-dup{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;font-size:13px;color:#475569}
/* 左の一覧のいちばん上の「データベースの項目」（画像 q19 の案A） */
.db-entry{display:flex;align-items:center;gap:8px;width:100%;border:2px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#f8fafc;cursor:pointer;text-align:left}
.db-entry:hover{background:#eef2f7}
.db-entry .ic{font-size:18px;color:#1d3f6e;line-height:1}
.db-entry b{display:block;font-size:12.5px;color:#0f172a}
.db-entry small{display:block;color:#64748b;font-size:11px}
.db-entry.active{border-color:#2563eb;background:#eff6ff}
.db-entry.active b{color:#1d4ed8}
.sl-sep{border-top:1px solid #e2e8f0;margin:6px 0 10px}

.canvas-area{flex:1;min-width:0;position:relative;background:#e2e8f0}
#canvas-wrap{position:absolute;inset:0;overflow:auto}
#canvas-wrap.hand{cursor:grab}
#canvas-wrap.grabbing{cursor:grabbing}
#zoom-spacer{position:absolute;left:0;top:0;pointer-events:none}
#stage{position:absolute;left:0;top:0;padding:48px;transform-origin:0 0}
.zoom-badge{position:absolute;right:16px;bottom:14px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:2px 12px;font-size:12px;color:#475569;pointer-events:none}

/* 画面（描いた業務アプリの画面）。中身は HTML の要素で描く */
.screen-frame{position:relative}
.screen{position:relative;background:#fff;box-shadow:0 1px 6px rgba(15,23,42,.22);overflow:hidden}
.screen.grid{background-image:linear-gradient(to right,rgba(148,163,184,.22) 1px,transparent 1px),linear-gradient(to bottom,rgba(148,163,184,.22) 1px,transparent 1px);background-size:8px 8px}
.screen-band{height:40px;background:#1f2f4f;color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 部品（画面の中。見た目は画像 q15・仕上がりイメージ.png に合わせた） */
.part{position:absolute;display:flex;flex-direction:column;font-size:14px;color:#1e293b;line-height:1.4}
.part.lab-left{flex-direction:row;gap:8px}
.plabel{display:flex;align-items:center;gap:6px;height:24px;flex-shrink:0;color:#334155;white-space:nowrap;overflow:hidden}
.lab-left .plabel{width:112px;height:36px}
.plabel-text{overflow:hidden;text-overflow:ellipsis}
.pno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#dc2626;color:#fff;font-size:12px;font-weight:700;line-height:1;flex-shrink:0}
.pno-out{position:absolute;left:-28px;top:50%;transform:translateY(-50%)}
.pno-corner{position:absolute;left:-4px;top:-8px;z-index:1;box-shadow:0 0 0 2px #fff}
.preq{color:#dc2626;font-weight:700}
.pbox{margin-top:4px;flex:1;min-height:0;min-width:0;border:1px solid #94a3b8;border-radius:4px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#fff;overflow:hidden;white-space:nowrap}
.pbox.area{align-items:flex-start;padding-top:8px;white-space:pre-wrap}
.pbox.calc{background:#f1f5f9;border-style:dashed}
.pval{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbox .pr{margin-left:auto;color:#475569;font-size:13px;flex-shrink:0}
/* ルックアップの印（画像 q22）: 項目名の後ろの黄色い札、探す項目の「取得」、一緒に写される項目の灰色の入力欄。書き出しにも出す */
.reftag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;white-space:nowrap;line-height:1.6;flex-shrink:0}
.pbox .pget{margin-left:auto;margin-right:-10px;align-self:stretch;display:flex;align-items:center;gap:3px;padding:0 10px;border-left:1px solid #94a3b8;background:#f8fafc;font-size:12px;color:#1d4ed8;font-weight:600;flex-shrink:0}
.pbox.copied{background:#f1f5f9;color:#64748b}
.pph{color:#94a3b8}
.picon{flex-shrink:0}
.popts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;align-content:flex-start;overflow:hidden;min-width:0}
.popts.v{flex-direction:column;flex-wrap:nowrap}
.popt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pmark{width:15px;height:15px;border:1.5px solid #64748b;flex-shrink:0;position:relative}
.pmark.rd{border-radius:50%}
.pmark.ck{border-radius:3px}
.pmark.rd.on::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:#2563eb}
.pmark.ck.on{background:#2563eb;border-color:#2563eb}
.pmark.ck.on::after{content:'✓';position:absolute;left:1.5px;top:-3px;color:#fff;font-size:11px;font-weight:700}
.pdrop{margin-top:4px;flex:1;min-height:0;min-width:0;border:1.5px dashed #94a3b8;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:#64748b;font-size:13px;background:#f8fafc;overflow:hidden;white-space:nowrap}
.pdrop u{color:#2563eb;text-decoration:none;border:1px solid #93c5fd;border-radius:4px;padding:2px 8px;background:#fff}
.lab-left .pbox,.lab-left .popts,.lab-left .pdrop{margin-top:0}
.lab-left .popts{min-height:36px;align-items:center}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:15px;white-space:nowrap;overflow:hidden}
.pbtn.primary{background:#2563eb;color:#fff;font-weight:600}
.pbtn.normal{background:#fff;border:1px solid #64748b;color:#334155}
.phead{flex:1;display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:#0f172a;border-left:4px solid #1d3f6e;padding-left:8px;overflow:hidden;white-space:nowrap}
.pdesc{flex:1;display:flex;align-items:flex-start;gap:6px;font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap;overflow:hidden}
.pline{flex:1;display:flex;align-items:center;gap:6px}
.pline i{flex:1;height:1px;background:#94a3b8}
.punknown{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed #94a3b8;color:#64748b;font-size:12px;background:#f8fafc;overflow:hidden}
/* 表の部品（画像 q24） */
.ptbl-wrap{margin-top:4px;display:flex;align-items:flex-start;gap:6px;min-width:0;overflow:hidden}
.ptbl{border-collapse:collapse;font-size:13px;background:#fff;table-layout:fixed}
.ptbl th,.ptbl td{border:1px solid #94a3b8;height:34px;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptbl th{background:#eef2f7;color:#334155;font-weight:600}
.ptbl td.num{text-align:right}
.ptbl td.calc{background:#f1f5f9;text-align:right}
.ptbl td.ic{text-align:center;color:#64748b;padding:0}
.ptbl .pph{color:#94a3b8}
.ptbl-ops{display:flex;flex-direction:column;padding-top:34px;flex-shrink:0}
.ptbl-ops span{height:34px;display:flex;align-items:center;gap:3px}
.ptbl-ops i{width:20px;height:20px;border:1px solid #94a3b8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#64748b;background:#fff}
/* グラフの部品（画像 q25） */
.pgraph{flex:1;min-height:0;margin-top:4px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;overflow:hidden}
.pgraph svg{display:block}
/* 一覧の画面用・進み具合の画面用・見た目用（画像 q26） */
.psearch{flex:1;display:flex;align-items:center;border:1px solid #94a3b8;border-radius:6px;background:#fff;overflow:hidden;min-width:0}
.psearch .pph{flex:1;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.psearch b{align-self:stretch;display:flex;align-items:center;padding:0 14px;background:#2563eb;color:#fff;font-size:13px;flex-shrink:0}
.pfilter{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;font-size:13px;color:#475569}
.pfilter .f{height:32px;border:1px solid #94a3b8;border-radius:6px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;background:#fff;color:#1e293b;flex-shrink:0}
.pfilter .f small{color:#64748b;font-size:12px}
.pfilter .f i{font-style:normal;color:#64748b;font-size:10px}
.ppager{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;font-size:13px}
.ppager span{min-width:28px;height:28px;border:1px solid #cbd5e1;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#334155;padding:0 4px;flex-shrink:0}
.ppager span.on{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:700}
.ppager em{font-style:normal;color:#64748b;font-size:12px;margin-left:8px}
.pstatus{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;font-size:13px;color:#475569}
.pbadge{display:inline-flex;align-items:center;height:28px;padding:0 14px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid}
.sc0{background:#f1f5f9;color:#475569;border-color:#cbd5e1}.sc1{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.sc2{background:#dbeafe;color:#1e40af;border-color:#93c5fd}.sc3{background:#dcfce7;color:#166534;border-color:#86efac}.sc4{background:#fae8ff;color:#86198f;border-color:#f0abfc}
.psteps{flex:1;display:flex;min-width:0;overflow:hidden}
.psteps span{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:#e2e8f0;color:#475569;white-space:nowrap;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-right:-8px;padding:0 16px}
.psteps span:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.psteps span.done{background:#bfdbfe;color:#1e3a8a}
.psteps span.on{background:#2563eb;color:#fff;font-weight:700}
.ptabs{flex:1;display:flex;align-items:flex-end;border-bottom:2px solid #cbd5e1;overflow:hidden;white-space:nowrap}
.ptabs span{height:100%;padding:0 16px;display:flex;align-items:center;font-size:13px;color:#475569;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;flex-shrink:0}
.ptabs span.on{background:#fff;border-color:#cbd5e1;color:#1d4ed8;font-weight:700;margin-bottom:-2px;border-bottom:2px solid #fff}
.pimage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #94a3b8;border-radius:6px;background:#f1f5f9;color:#64748b;font-size:12.5px;overflow:hidden;text-align:center;padding:4px}
.plink{flex:1;display:flex;align-items:center;color:#2563eb;text-decoration:underline;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picon-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.picon-wrap svg{width:100%;height:100%}
/* 選んだ部品の印と、縁のつまみ（編集の画面だけ） */
.part.sel{outline:2px solid #2563eb;outline-offset:1px;z-index:1}
.grip{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #2563eb;border-radius:2px;z-index:2}
.g-nw{left:-6px;top:-6px;cursor:nwse-resize}.g-n{left:calc(50% - 5px);top:-6px;cursor:ns-resize}.g-ne{right:-6px;top:-6px;cursor:nesw-resize}
.g-e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}.g-se{right:-6px;bottom:-6px;cursor:nwse-resize}.g-s{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
.g-sw{left:-6px;bottom:-6px;cursor:nesw-resize}.g-w{left:-6px;top:calc(50% - 5px);cursor:ew-resize}
#stage .screen .part{cursor:move}
#canvas-wrap.hand #stage .screen .part{cursor:inherit}
body.moving,body.moving *{cursor:move!important}
body.placing,body.placing *{cursor:copy!important}
.place-ghost{position:fixed;z-index:30;pointer-events:none;border:2px dashed #2563eb;background:rgba(37,99,235,.08);border-radius:4px;color:#1d4ed8;font-size:12px;font-weight:600;padding:4px 6px;white-space:nowrap;overflow:hidden}

/* 部品の設定の一覧表（画面の右か下。見た目は画像 q18） */
.stage-row{display:flex;gap:32px;align-items:flex-start}
.stage-row.bottom{flex-direction:column}
/* 吹き出しを置ける範囲（画面のまわり 240 ドット。画像 q27）。部品の設定の一覧表はこの範囲の外に置く */
.co-zone{position:relative;flex-shrink:0}
.co-zone::before{content:'';position:absolute;inset:0;border:1.5px dashed rgba(148,163,184,.75);border-radius:8px;pointer-events:none}
.co-zone-cap{position:absolute;left:10px;top:6px;font-size:12px;color:#94a3b8;pointer-events:none}
.stage-row.right .ptable{margin-top:240px}
.stage-row.bottom .ptable{margin-left:240px}
/* 吹き出し（4 色。線の色も枠に合わせる） */
.callout{position:absolute;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;box-shadow:0 2px 6px rgba(15,23,42,.18);white-space:pre-wrap;overflow:hidden;cursor:move;z-index:3;border:1.5px solid}
.callout.cc-yellow{background:#fef9c3;border-color:#eab308;color:#422006}
.callout.cc-red{background:#fef2f2;border-color:#ef4444;color:#7f1d1d}
.callout.cc-blue{background:#eff6ff;border-color:#3b82f6;color:#1e3a8a}
.callout.cc-gray{background:#f8fafc;border-color:#94a3b8;color:#334155}
.callout.sel{outline:2px solid #2563eb;outline-offset:2px;overflow:visible}
.co-lines{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.co-handle{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #2563eb;cursor:crosshair;z-index:4;transform:translate(-50%,-50%)}
body.linking .co-handle{pointer-events:none}
body.linking,body.linking *{cursor:crosshair!important}
.co-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-1px;margin-right:3px}
/* まとめて選んだとき（画像 q28）: それぞれに青い枠、全体に点線の枠、基準（最初に選んだもの）に「基準」の札 */
.sel-box{position:absolute;border:1.5px dashed #2563eb;pointer-events:none;z-index:2}
.part.sel-ref,.callout.sel-ref{outline:3px solid #1d4ed8}
.part.sel-ref::before,.callout.sel-ref::before{content:'基準';position:absolute;left:-3px;top:-24px;background:#1d4ed8;color:#fff;font-size:11px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:4px;z-index:5;white-space:nowrap}
.band{position:absolute;border:1.5px dashed #2563eb;background:rgba(37,99,235,.08);pointer-events:none;z-index:6}
.ghost-copy{opacity:.55;pointer-events:none}
body.copying,body.copying *{cursor:copy!important}
.ms-list{font-size:12px;line-height:1.8;border:1px solid #e2e8f0;border-radius:6px;padding:5px 8px;background:#f8fafc;margin-bottom:10px;max-height:120px;overflow:auto}
.ms-list span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;white-space:nowrap}
.ms-list b{font-size:10px;color:#fff;background:#1d4ed8;border-radius:3px;padding:0 4px}
.ms-sub{font-size:11.5px;font-weight:700;color:#475569;margin:10px 0 6px}
.ms-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ms-btns button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #cbd5e1;border-radius:6px;padding:5px 2px;font-size:10.5px;background:#fff;color:#334155;cursor:pointer}
.ms-btns button:hover{background:#eff6ff;border-color:#93c5fd}
.ms-btns button:disabled{opacity:.4;cursor:default;background:#fff}
.ms-btns svg{display:block}
.ptable{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:16px 18px 18px;flex-shrink:0;font-size:14px;color:#1e293b}
.ptable h3{font-size:16px;color:#0f172a;margin-bottom:10px}
.ptable table{border-collapse:collapse;width:100%}
.ptable th,.ptable td{border:1px solid #cbd5e1;padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}
.ptable th{background:#eef2f7;color:#334155;font-size:13px}
.ptable .c-no{text-align:center;width:56px}
.ptable .c-label{width:116px}
.ptable .c-kind{width:148px}
.ptable .c-set{white-space:pre-line}
.ptable tr[data-action]{cursor:pointer}
.ptable tr[data-action]:hover td{background:#f8fafc}
.ptable tr.sel td{background:#eff6ff}
.ptable tr.br td:nth-child(2){padding-left:22px}
.ptable-empty{color:#64748b;font-size:13px;line-height:1.7;border:1px dashed #94a3b8;border-radius:6px;padding:14px;background:#f8fafc}
.screen-resize{position:absolute;left:0;right:0;bottom:22px;height:14px;transform:translateY(50%);cursor:ns-resize;display:flex;align-items:center;justify-content:center}
.screen-resize span{width:56px;height:6px;border-radius:3px;background:#94a3b8;opacity:.75}
.screen-resize:hover span{background:#2563eb;opacity:1}
.screen-size{height:24px;line-height:24px;font-size:12px;color:#64748b;text-align:center;white-space:nowrap}
body.resizing,body.resizing *{cursor:ns-resize!important}

/* 右の欄: 上に部品の箱、下に選んだ部品の設定。設定の欄にはいつも 340 ドットを残し、
   部品の箱がそれより伸びるときは部品の箱の中をスクロールする（画像 q14b） */
.side-panel{width:288px;flex-shrink:0;background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:0}
.side-box{flex:0 1 auto;max-height:max(96px,calc(100% - 340px));overflow-y:auto;padding:12px 14px 8px;border-bottom:2px solid #cbd5e1}
.side-settings{flex:1 1 340px;min-height:0;overflow-y:auto;padding:14px 16px 24px}
.side-panel section+section{margin-top:10px;padding-top:14px;border-top:1px solid #e2e8f0}
.panel-title small{font-weight:400;color:#64748b}
.pal-group{border:1px solid #e2e8f0;border-radius:6px;margin-bottom:5px}
.pal-head{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border:none;border-radius:6px;background:#f8fafc;font-size:12px;font-weight:700;color:#334155;cursor:pointer;text-align:left}
.pal-head:hover{background:#eef2f7}
.pal-head .n{margin-left:auto;font-weight:400;color:#94a3b8;font-size:11px}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px}
.pal-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:46px;border:1px solid #e2e8f0;border-radius:6px;background:#f8fafc;font-size:10.5px;line-height:1.15;color:#334155;text-align:center;padding:2px;white-space:pre-line;cursor:grab}
.pal-btn i{font-style:normal;font-size:15px;line-height:1;color:#1d3f6e}
.pal-btn:hover{background:#eff6ff;border-color:#93c5fd}
.row2{display:flex;gap:8px}
.row2>.field{flex:1;min-width:0}
.field>span:first-child small{font-weight:400;color:#94a3b8}
.field input[type=number],.field input[type=date],.field select{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;background:#fff}
.field input[type=number]:focus,.field input[type=date]:focus,.field select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.side-settings .check{margin-bottom:8px}
.pf-sep{border-top:1px dashed #cbd5e1;margin:12px 0 10px;position:relative}
.pf-sep i{position:absolute;top:-8px;left:0;background:#fff;padding-right:6px;font-style:normal;font-size:10.5px;color:#7c3aed;font-weight:700}
.pf-multi{display:flex;flex-direction:column;gap:3px;font-size:12px}
.pf-multi label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pf-out{margin-top:6px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:6px;padding:7px 9px}
.pf-out b{display:block;font-size:11px;color:#6d28d9;margin-bottom:3px}
.pf-out div{font-size:12.5px;line-height:1.6;white-space:pre-line}
.pf-del{margin-top:12px;text-align:right}
.seg{display:flex;gap:6px}
.seg label{flex:1 1 0;min-width:max-content;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid #cbd5e1;border-radius:6px;padding:6px 2px;font-size:12px;background:#fff}
.seg small{font-size:10px;color:#64748b}
.seg input:checked+span{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;font-weight:600}
.seg input:focus-visible+span{box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.height-value{font-size:13px;font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;cursor:pointer}
.check input{margin-top:3px}
.check .nb{white-space:nowrap}
.check small.sub{display:block;color:#64748b;font-size:11px;font-weight:400}

/* ── データベースの項目の一覧表（真ん中。画像 q19）── */
.db-view{position:absolute;inset:0;overflow:auto;padding:22px 26px 40px}
.itable{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:16px 18px 18px;max-width:1240px;position:relative}
.itable-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.itable-head h3{font-size:16px;color:#0f172a}
.itable-head .hint{margin-left:4px}
.itable table{border-collapse:collapse;width:100%;font-size:13px}
.itable th,.itable td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.55}
.itable th{background:#eef2f7;color:#334155;font-size:12px;white-space:nowrap}
.itable td.c-grip{width:26px;text-align:center;color:#94a3b8;cursor:grab;user-select:none}
.itable td.c-del{width:34px;text-align:center}
.itable td.c-set{white-space:pre-line}
.itable td.none,.itable .none{color:#94a3b8}
.itable tr[data-action]{cursor:pointer}
.itable tr[data-action]:hover td{background:#f8fafc}
.itable tr.sel td{background:#eff6ff}
.itable tr.drop-before td{box-shadow:inset 0 3px 0 #2563eb}
.itable tr.drop-after td{box-shadow:inset 0 -3px 0 #2563eb}
.itable-empty{color:#64748b;font-size:13px;line-height:1.7;border:1px dashed #94a3b8;border-radius:6px;padding:14px;background:#f8fafc}
.del-x{border:none;background:none;color:#94a3b8;cursor:pointer;font-size:14px;padding:0 4px;border-radius:4px}
.del-x:hover{color:#dc2626;background:#fef2f2}
.pop-menu{position:absolute;z-index:10;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:4px;min-width:190px;display:flex;flex-direction:column}
.pop-menu button{border:none;background:none;text-align:left;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.pop-menu button:hover{background:#f1f5f9}
.pop-menu button i{font-style:normal;width:18px;text-align:center;color:#1d3f6e}
body.sorting,body.sorting *{cursor:grabbing!important}
/* 部品や項目に付ける小さな札（編集の画面だけ。ルックアップの札は書き出しにも出す） */
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;white-space:nowrap;line-height:1.6;vertical-align:middle}
.tag.link{background:#dcfce7;color:#166534;border:1px solid #86efac}
.tag.lost,.tag.gone{background:#f1f5f9;color:#475569;border:1px solid #94a3b8}
/* 部品の箱のいちばん上の「データベースの項目」の組 */
.pal-group.items{border-color:#93c5fd}
.pal-group.items .pal-head{background:#eff6ff;color:#1d4ed8}
.pal-items{display:flex;flex-direction:column;gap:3px;padding:5px}
.pal-item{display:flex;align-items:center;gap:6px;border:1px solid #bfdbfe;border-radius:6px;background:#fff;padding:5px 8px;font-size:12px;cursor:grab;text-align:left;min-width:0}
.pal-item i{font-style:normal;color:#1d3f6e;width:16px;text-align:center;flex-shrink:0}
.pal-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal-item small{margin-left:auto;color:#64748b;font-size:10.5px;white-space:nowrap;flex-shrink:0}
.pal-item:hover{background:#eff6ff}
.pal-item.placed{opacity:.5;border-color:#e2e8f0;cursor:default}
.pal-item.placed small{color:#1d4ed8}
.pal-item.on{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 1px #2563eb}
.pal-empty{color:#64748b;font-size:11.5px;padding:6px 8px;line-height:1.5}
/* 選んだ部品の設定の欄の 2 つの枠（画像 q20）: 紺＝項目の設定、灰＝この画面だけの設定 */
.pf-sec{margin:0 0 10px;padding:0;border:0;min-width:0}
.pf-sec-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 9px;border-radius:7px 7px 0 0}
.pf-sec-head small{font-weight:400;font-size:10.5px}
.pf-sec-body{padding:10px 10px 4px;border:1px solid;border-top:none;border-radius:0 0 7px 7px}
.pf-sec.item .pf-sec-head{background:#1d3f6e;color:#fff}
.pf-sec.item .pf-sec-head small{color:#cbd5e1}
.pf-sec.item .pf-sec-body{border-color:#1d3f6e}
.pf-sec.here .pf-sec-head{background:#e2e8f0;color:#334155}
.pf-sec.here .pf-sec-head small{color:#64748b}
.pf-sec.here .pf-sec-body{border-color:#cbd5e1}
.pf-sec.locked .pf-sec-head{background:#64748b;color:#fff}
.pf-sec.locked .pf-sec-head small{color:#e2e8f0}
.pf-sec.locked .pf-sec-body{border-color:#94a3b8;background:#f8fafc}
.pf-sec.locked input,.pf-sec.locked textarea,.pf-sec.locked select{background:#f1f5f9;color:#64748b;border-style:dashed}
.pf-used{font-size:11.5px;color:#475569;margin-bottom:8px;line-height:1.5}
.pf-used b{color:#1d3f6e}
.pf-banner{border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.55;margin-bottom:10px}
.pf-banner .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pf-banner.link{background:#f0fdf4;border:1px solid #86efac;color:#14532d}
.pf-banner.gone{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12}
.pf-note{font-size:11px;color:#64748b;text-align:right;margin-top:3px}
/* データベースどうしのつながりの図（画像 q23） */
.map-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#475569;margin:6px 0 10px}

// 目次
//   1. 版
//   2. データの形（純関数）  … 画面設計・画面・部品の作り方、番号、一覧表の「設定」の文、読み込んだデータを今の形に直す migrate()
//   3. 保存                  … LocalStorageAdapter（ブラウザ）・FileAdapter（Electron）・BlockedAdapter（保存を止める）
//   4. 元に戻す              … Store（commit・undo・redo・persist・subscribe）と、画面設計・画面・部品の操作（actions）
//   5. 共通の部品            … 文字の置き換え・日時・お知らせ・小さな窓・作る先の選び方・画面と部品の描き方・一覧表・縮小画像
//   6. 一覧の画面            … カード・名前で探す・新規作成・名前の変更・複製・ごみ箱
//   7. 編集の画面            … メニューバー・画面の一覧・画面（帯・マス目・高さ）・部品の箱・設定の欄・拡大縮小・ハンド・
//                              部品のドラッグ（置く・動かす・大きさ）・コピーと貼り付け
//   8. 書き出しと取り込み    … 書き出しの窓（PDF・HTML・PNG）・印刷用のページ（表紙・つながりの図・項目の一覧表・画面）・
//                              単体で開いて編集できる HTML（埋め込み・保存し直す）・HTML の取り込み（確かめの窓）
//   9. 命令（runCommand）    … ボタン・キー・アプリのメニューからの命令を 1 か所で受ける
//  10. AI の窓口            … AI（Claude Code など）の頼みを受けて実行する（第 7 段階。AI設計基盤_設計書.md の 8・9 章）
//  11. 起動
//  12. テスト用の窓口（window.__test__。テストのときだけ埋まる）
// 手本: 保存と元に戻すと一覧の画面は CheckListMaker の index.html、
//       拡大縮小とハンドとメニューバーの見た目はビジネスダイアグラムメーカー（参考/diagram_v8.31.html）から写した。
// =============================================================================

// ── 1. 版 ─────────────────────────────────────────────────────────────────────
const APP_VERSION = '1.00';
// 書き出す HTML（単体で開いて編集できる HTML）の材料にする、このアプリの script の文字。
// document.currentScript は script を実行している間しか取れないので、いちばん初めに取っておく（style の文字は起動のときに取る）
const APP_SCRIPT = document.currentScript ? document.currentScript.textContent : '';

// ── 2. データの形（純関数）────────────────────────────────────────────────────
// { schemaVersion, settings: { customTargets }, designs: [ { id, name, target, description,
//   createdAt, updatedAt, trashedAt, revisions, items, screens: [ { id, name, device, width, height,
//   showHeader, tablePos, parts, callouts } ] } ] }
// items（データベースの項目の一覧表）と parts の 1 つずつの形は、下の「項目」「部品」に書いた。callouts（吹き出し）は第 3 段階の後半で使う。
// 倍率・モード・開いている画面・選んでいる部品・コピーした部品は保存しない（下の ui に持つ）。
// データの形の版: 1＝部品が項目名と設定を持つ（第 3 段階の前半まで）。2＝項目は画面設計の items に持ち、入力欄の部品は itemId で項目を指す。
const SCHEMA_VERSION = 2;
const STORAGE_KEY = 'mockimagemaker.v1';
const HISTORY_LIMIT = 50;
const GRID = 8;
const NAME_MAX = 100;
const TARGET_MAX = 60;
const DEVICES = {
  pc: { label: 'パソコン', width: 1280, height: 800 },
  tablet: { label: 'タブレット', width: 768, height: 1024 },
  phone: { label: 'スマホ', width: 375, height: 667 },
};
const BUILTIN_TARGETS = [
  { id: 'kintone', label: 'kintone' },
  { id: 'salesforce', label: 'Salesforce' },
  { id: 'claude', label: 'Claude で作るアプリ' },
];
const FIRST_SCREEN_NAME = '画面 1';

const clone = (obj) => JSON.parse(JSON.stringify(obj));
// 中まで凍らせる（改訂履歴の版の写し）。凍らせた物は書き換えられないので、直して使うときは clone してから使う
function deepFreeze(v) {
  if (!v || typeof v !== 'object' || Object.isFrozen(v)) return v;
  Object.freeze(v);
  Object.values(v).forEach(deepFreeze);
  return v;
}
const nowIso = () => new Date().toISOString();
const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const str = (v) => (typeof v === 'string' ? v : '');

function newId(prefix) {
  const c = window.crypto;
  if (c && typeof c.randomUUID === 'function') return prefix + '-' + c.randomUUID();
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// 名前の前後の空白を取り、続く空白を 1 つにする。長すぎる名前は切る
function cleanName(s, max = NAME_MAX) {
  return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').slice(0, max);
}

function createInitialState() {
  return { schemaVersion: SCHEMA_VERSION, settings: { customTargets: [], mapPos: {} }, designs: [] };
}

function createScreenData(name, device = 'pc') {
  const d = DEVICES[device];
  return { id: newId('s'), name, device, width: d.width, height: d.height, showHeader: true, tablePos: 'right', parts: [], callouts: [] };
}

function createDesignData(name, target, now = nowIso()) {
  return {
    id: newId('d'), name, target, description: '', createdAt: now, updatedAt: now,
    trashedAt: null, revisions: [], items: [], screens: [createScreenData(FIRST_SCREEN_NAME)], mapPos: {},
  };
}

// 高さは、機器の 1 画面分から 8 ドットずつ伸ばせる（1 画面分より低くはできない）
function snapHeight(h, device) {
  const min = DEVICES[device].height;
  const extra = Math.round((Number(h) - min) / GRID) * GRID;
  return min + Math.max(0, extra || 0);
}
// 下の端（bottom）まで入る、いちばん低い高さ（機器の 1 画面分から 8 ドットずつ）
function heightToFit(bottom, device) {
  const min = DEVICES[device].height;
  return min + Math.max(0, Math.ceil((bottom - min) / GRID) * GRID);
}

// 機器の種類を変えると、幅はその機器の幅になる。下へ伸ばした分は、新しい機器の 1 画面分に足す
function changeDevice(screen, device) {
  const extra = Math.max(0, screen.height - DEVICES[screen.device].height);
  return { ...screen, device, width: DEVICES[device].width, height: snapHeight(DEVICES[device].height + extra, device) };
}

function builtinTarget(id) {
  return BUILTIN_TARGETS.find((t) => t.id === id) || null;
}
function targetLabel(target) {
  const b = builtinTarget(target);
  return b ? b.label : target || '作る先なし';
}
// 「その他」に書いた名前。kintone などと同じ名前なら、そちらを選んだことにする
function resolveTargetName(text) {
  const s = cleanName(text, TARGET_MAX);
  const low = s.toLowerCase();
  const b = BUILTIN_TARGETS.find((t) => t.label.toLowerCase() === low || t.id === low);
  return b ? b.id : s;
}
function addCustomTarget(state, target) {
  if (!target || builtinTarget(target)) return;
  if (!state.settings.customTargets.includes(target)) state.settings.customTargets.push(target);
}

const byNewest = (key) => (a, b) => String(b[key] || '').localeCompare(String(a[key] || ''));
// 一覧に出す画面設計（ごみ箱のものを除く・名前で探す・更新の新しい順）
function visibleDesigns(state, query = '') {
  const q = cleanName(query).toLowerCase();
  return state.designs
    .filter((d) => !d.trashedAt && (!q || d.name.toLowerCase().includes(q)))
    .sort(byNewest('updatedAt'));
}
function trashedDesigns(state) {
  return state.designs.filter((d) => d.trashedAt).sort(byNewest('trashedAt'));
}

function duplicateDesignData(d, now = nowIso()) {
  const copy = clone({ ...d, revisions: [] });
  copy.id = newId('d');
  copy.name = cleanName(d.name + ' のコピー');
  copy.createdAt = now;
  copy.updatedAt = now;
  copy.trashedAt = null;
  // 改訂履歴は写さない（部品の id を付け直すので、前の版の写しと突き合わせられないため。Claude が決めた）
  copy.revisions = [];
  // 項目の id は画面設計の中だけで重ならなければよいので、そのまま写す（部品・ルックアップが指す id を付け直さなくて済むため）。
  // 画面と部品の id は付け直し、それを指す吹き出しのつなぐ部品と、リンクの文字の移る先も付け直す
  const screenIds = new Map(d.screens.map((s) => [s.id, newId('s')]));
  copy.screens = d.screens.map((s) => copyScreenData(s, { name: s.name, id: screenIds.get(s.id), screenIds }));
  // 編集の画面のつながりの図で覚えた「この画面設計」の箱の位置は、複製の箱の鍵で覚え直す
  if (isObj(copy.mapPos) && copy.mapPos['d:' + d.id]) {
    copy.mapPos['d:' + copy.id] = copy.mapPos['d:' + d.id];
    delete copy.mapPos['d:' + d.id];
  }
  return copy;
}

// ── 画面を足す・複製する（第 4 段階。画像 q29・q30）──
// 画面 1 つの写し。画面・部品・吹き出しの id を付け直し、吹き出しのつなぐ部品とリンクの文字の移る先も付け直す。
// 部品は同じ項目を指したまま（ほかの画面へ貼るときと同じ。1 つの画面に同じ項目は 1 回だけだが、別の画面には置ける）。
// screenIds（元の画面の id → 新しい id）を渡したとき（画面設計の複製）は、移る先をそれで付け直し、ないものは外す。
// 渡さないとき（画面の複製）は、自分の画面を指す移る先だけを新しい画面に付け直し、ほかの画面を指すものはそのままにする
function copyScreenData(src, { name, id = newId('s'), screenIds = null }) {
  const copy = clone(src);
  copy.id = id;
  copy.name = name;
  const partIds = new Map();
  copy.parts.forEach((p) => { partIds.set(p.id, newId('p')); p.id = partIds.get(p.id); });
  copy.callouts = (copy.callouts || []).map((c) => ({ ...c, id: newId('k'), target: c.target ? partIds.get(c.target) || null : null }));
  copy.parts.forEach((p) => {
    if (p.type !== 'link' || !isObj(p.props) || !p.props.screenId) return;
    const to = p.props.screenId;
    p.props.screenId = screenIds ? screenIds.get(to) || '' : to === src.id ? id : to;
  });
  return copy;
}

// 画面の名前が重ならないようにする（「一覧」がもうあれば「一覧 2」）。番号を足しても名前の長さの上限を超えないように、元の名前を切る
function uniqueScreenName(design, base) {
  const names = new Set(design.screens.map((s) => s.name));
  if (!names.has(base)) return base;
  for (let n = 2; ; n++) {
    const name = `${base.slice(0, NAME_MAX - String(n).length - 1).trim()} ${n}`;
    if (!names.has(name)) return name;
  }
}
// 白紙の画面の名前（「画面 4」）。画面の数＋1 から数えて、使われていない番号にする（「画面 3 2」のようにしないため）
function blankScreenName(design) {
  const names = new Set(design.screens.map((s) => s.name));
  for (let n = design.screens.length + 1; ; n++) if (!names.has(`画面 ${n}`)) return `画面 ${n}`;
}
// 複製した画面の名前（「◯◯ のコピー」、重なれば「◯◯ のコピー 2」）。長い名前でも「のコピー」と番号が切れないように、元の名前のほうを切る
function copyScreenName(design, name) {
  const names = new Set(design.screens.map((s) => s.name));
  for (let n = 1; ; n++) {
    const suffix = n === 1 ? ' のコピー' : ` のコピー ${n}`;
    const full = cleanName(name).slice(0, NAME_MAX - suffix.length).trim() + suffix;
    if (!names.has(full)) return full;
  }
}

// 画面を afterId の画面のすぐ後ろに入れる（見つからなければいちばん後ろ）
function insertScreenAfter(design, screen, afterId) {
  const i = design.screens.findIndex((s) => s.id === afterId);
  design.screens.splice(i < 0 ? design.screens.length : i + 1, 0, screen);
}

// リンクの文字で、移る先がその画面のもの
// （移る先を「URL を書く」に変えた後も screenId は残るので、移る先が画面のものだけを見る）
const linksToScreen = (p, screenId) => p.type === 'link' && isObj(p.props) && p.props.to === 'screen' && !!screenId && p.props.screenId === screenId;
// ほかの画面にある、その画面を移る先にしているリンクの文字の数（画面を消す確かめの窓に書く）
const linksInto = (design, screenId) => design.screens.filter((s) => s.id !== screenId)
  .reduce((n, s) => n + s.parts.filter((p) => linksToScreen(p, screenId)).length, 0);

// ひな形（画像 q30）。note は「画面を足す」の窓の札に書く短い説明
const SCREEN_TEMPLATES = [
  { id: 'blank', name: '白紙', note: '帯だけ' },
  { id: 'input', name: '入力', note: '項目を並べ、保存のボタン' },
  { id: 'detail', name: '詳細', note: '項目を並べ、編集・削除のボタン' },
  { id: 'list', name: '一覧', note: '検索・絞り込み・レコード一覧' },
  { id: 'graph', name: 'グラフ', note: 'グラフを 2 つ' },
  { id: 'agg', name: '集計', note: '表とグラフ' },
  { id: 'steps', name: '進み具合', note: '進み具合の矢印・承認のボタン' },
];
const TPL_LEFT = 32; // ひな形で部品を置く左の端
const TPL_COL2 = 480; // 項目を 2 列で並べるときの右の列（幅 400 の部品の右に 48 空ける）
const TPL_GAP = 24; // 項目の行の間
// データベースの項目がまだないときに、入力・詳細・進み具合へ置く見本の項目
const TPL_SAMPLE_ITEMS = [['text1', '項目名 1'], ['date', '項目名 2'], ['dropdown', '項目名 3']];

// ── 並べ方（第 7 段階。設計書の 9-3）──
// 行と列だけを決めれば、位置と大きさを決まりどおりに決める。ひな形と AI の並べ方（layout）の両方がこれを使う（置き方の決まりを 1 か所にするため）
const LAYOUT_COL_W = 400; // 列の幅
const LAYOUT_SPAN_W = TPL_COL2 + LAYOUT_COL_W - TPL_LEFT; // 2 列の幅いっぱい（848）
const LAYOUT_TWO_COL_MIN = TPL_COL2 + LAYOUT_COL_W + TPL_LEFT; // 2 列で置ける画面の幅（912。パソコンだけ）
const LAYOUT_ALIGN_GAP = 32; // align の行（ボタンの行）の部品の間と、前の行との間
const isAlignRow = (row) => isObj(row) && !Array.isArray(row) && Array.isArray(row.parts);
// 並べ方から位置と大きさを決める（純関数）。rows の 1 つは、部品の並び（配列）か { align: 'left'・'center'・'right', parts: [...] }。
// sizeOf(entry) は、その部品の種類と最初の大きさ { type, w, h } を返す。entry.span が 2 なら 2 列の幅いっぱいに広げる。
// 戻り値 { placed: [{ entry, type, x, y, w, h }]（置く順）, nextY（次に置ける y。最後の行のいちばん下＋24）}
function layoutPlacements({ rows, columns = 1 }, { width, startY, sizeOf }) {
  const cols = columns >= 2 && width >= LAYOUT_TWO_COL_MIN ? 2 : 1;
  const maxW = Math.floor((width - TPL_LEFT * 2) / GRID) * GRID; // 画面の幅から左右 32 ずつ引いた幅
  const placed = [];
  let y = startY;
  const sized = (entry) => {
    const s = sizeOf(entry);
    const w = entry && entry.span === 2 ? Math.min(LAYOUT_SPAN_W, maxW) : Math.min(s.w, maxW);
    return { entry, type: s.type, w, h: s.h };
  };
  // 1 行分を y に置き、次の行の y へ進める
  const putLine = (line) => {
    if (!line.length) return;
    line.forEach((p) => placed.push({ ...p, y }));
    y += Math.max(...line.map((p) => p.h)) + TPL_GAP;
  };
  rows.forEach((row) => {
    if (isAlignRow(row)) {
      if (y !== startY) y += LAYOUT_ALIGN_GAP - TPL_GAP;
      layoutAlignLines(row.parts.map(sized), maxW).forEach((line) => {
        const total = line.reduce((n, p) => n + p.w, 0) + LAYOUT_ALIGN_GAP * (line.length - 1);
        let x = row.align === 'right' ? width - TPL_LEFT - total
          : row.align === 'center' ? Math.floor((width - total) / 2 / GRID) * GRID : TPL_LEFT;
        putLine(line.map((p) => { const q = { ...p, x }; x += p.w + LAYOUT_ALIGN_GAP; return q; }));
      });
      return;
    }
    let line = [];
    (Array.isArray(row) ? row : []).forEach((entry) => {
      const p = sized(entry);
      // 1 列のとき・列の幅に入らない部品は、1 行を 1 つで使う
      if (cols === 1 || p.w > LAYOUT_COL_W) { putLine(line); putLine([{ ...p, x: TPL_LEFT }]); line = []; return; }
      if (line.length >= cols) { putLine(line); line = []; }
      line.push({ ...p, x: line.length ? TPL_COL2 : TPL_LEFT });
    });
    putLine(line);
  });
  return { placed, nextY: y };
}
// align の行の部品を、画面の幅に入る分ずつの行に分ける
function layoutAlignLines(parts, maxW) {
  const lines = [];
  let line = [];
  let w = 0;
  parts.forEach((p) => {
    if (line.length && w + LAYOUT_ALIGN_GAP + p.w > maxW) { lines.push(line); line = []; }
    w = line.length ? w + LAYOUT_ALIGN_GAP + p.w : p.w;
    line.push(p);
  });
  if (line.length) lines.push(line);
  return lines;
}
// 部品の最初の大きさ（並べ方の sizeOf に使う）
const defaultPartSize = (type) => ({ type, w: partType(type).w, h: partType(type).h });

// 画面に部品を 1 つ置く（commit はしない）。下の端が画面からはみ出すときは、画面を下へ伸ばす（部品が上へずれないように）。
// spec: { type, x, y, w, h, itemId, tableKind, label, props, view }。戻り値は置いた部品
function placePartIn(sc, design, { type, x, y, w, h, itemId = null, tableKind = 'subtable', label, props, view }) {
  const t = partType(type);
  const bottom = y + (h || t.h) + TPL_LEFT;
  if (bottom > sc.height) sc.height = snapHeight(Math.ceil(bottom / GRID) * GRID, sc.device);
  const p = createPartData(type, sc, { x, y }, itemId, { tableKind, design });
  if (label != null) p.label = label;
  if (props) p.props = { ...p.props, ...props };
  if (view) p.view = type === 'table' ? normalizeTableView({ ...p.view, ...view }) : { ...p.view, ...view };
  Object.assign(p, fitRect({ ...p, w: w || p.w, h: h || p.h }, sc));
  sc.parts.push(p);
  return p;
}

// ひな形から画面を作る（commit はしない）。戻り値 { screen, items（データベースの項目の一覧表に新しく足す項目）}。
// 入力・詳細・進み具合には、データベースの項目の一覧表の項目を上から順に 2 列で並べ、テーブルの項目はその下に 1 つずつ置く
function screenFromTemplate(design, templateId, name) {
  const sc = createScreenData(name);
  const items = [];
  const put = (type, x, y, opts = {}) => placePartIn(sc, design, { type, x, y, ...opts });
  const button = (x, y, label, style = 'primary') => put('button', x, y, { label, props: { style } });
  const status = () => {
    let it = design.items.find((x) => x.type === 'status') || items.find((x) => x.type === 'status');
    if (!it) items.push((it = createItemData('status')));
    return it;
  };
  const putStatus = (type, x, y) => {
    const it = status();
    put(type, x, y, { itemId: it.id, view: { current: it.props.states[1] || it.props.states[0] || '' } });
  };
  // 項目を 2 列で並べ（並べ方の決まり layoutPlacements で置く）、テーブルの項目はその下に 1 つずつ、最後に buttons の行を置く
  const flowItems = (y0, buttons = []) => {
    let inputs = design.items.filter((it) => isInputType(it.type));
    const tables = design.items.filter((it) => it.type === 'table');
    if (!inputs.length && !tables.length) {
      inputs = TPL_SAMPLE_ITEMS.map(([type, n]) => createItemData(type, n));
      items.push(...inputs);
    }
    const rows = [];
    for (let i = 0; i < inputs.length; i += 2) rows.push(inputs.slice(i, i + 2).map((it) => ({ item: it })));
    tables.forEach((it) => rows.push([{ item: it }]));
    if (buttons.length) rows.push({ align: 'left', parts: buttons.map(([label, style]) => ({ type: 'button', label, props: { style } })) });
    const sizeOf = (e) => defaultPartSize(e.item ? partTypeOfItem(e.item.type) : e.type);
    const { placed } = layoutPlacements({ rows, columns: 2 }, { width: sc.width, startY: y0, sizeOf });
    placed.forEach((pl) => put(pl.type, pl.x, pl.y, { itemId: pl.entry.item ? pl.entry.item.id : null, w: pl.w, h: pl.h, label: pl.entry.label, props: pl.entry.props }));
  };
  const right = (w) => sc.width - TPL_LEFT - w;
  switch (templateId) {
    case 'input':
      flowItems(64, [['保存', 'primary'], ['キャンセル', 'normal']]);
      break;
    case 'detail':
      button(right(96 + 32 + 96), 56, '編集');
      button(right(96), 56, '削除', 'normal');
      flowItems(112);
      break;
    case 'list': {
      put('search', TPL_LEFT, 64);
      put('filter', 368, 64);

// how: left・hcenter・right・top・vcenter・bottom（基準の端・真ん中に合わせる）、hdist・vdist（両端を動かさずに間を等しくする。3 つ以上）、
// width・height（基準と同じ幅・高さにする）。戻り値は動かした後の位置と大きさ（マス目と範囲に収めるのは呼ぶ側）
function alignedRects(rects, how) {
  if (rects.length < 2) return rects;
  const ref = rects[0];
  const out = rects.map((r) => ({ ...r }));
  const each = (fn) => out.forEach((r, i) => { if (i) fn(r); });
  switch (how) {
    case 'left': each((r) => { r.x = ref.x; }); break;
    case 'hcenter': each((r) => { r.x = ref.x + ref.w / 2 - r.w / 2; }); break;
    case 'right': each((r) => { r.x = ref.x + ref.w - r.w; }); break;
    case 'top': each((r) => { r.y = ref.y; }); break;
    case 'vcenter': each((r) => { r.y = ref.y + ref.h / 2 - r.h / 2; }); break;
    case 'bottom': each((r) => { r.y = ref.y + ref.h - r.h; }); break;
    case 'width': each((r) => { r.w = ref.w; }); break;
    case 'height': each((r) => { r.h = ref.h; }); break;
    case 'hdist': case 'vdist': {
      if (out.length < 3) return out;
      const [pos, size] = how === 'hdist' ? ['x', 'w'] : ['y', 'h'];
      const order = [...out].sort((a, b) => a[pos] - b[pos]);
      const first = order[0];
      const last = order[order.length - 1];
      const total = order.reduce((s, r) => s + r[size], 0);
      const gap = (last[pos] + last[size] - first[pos] - total) / (order.length - 1);
      let at = first[pos];
      order.forEach((r) => { r[pos] = at; at += r[size] + gap; });
      break;
    }
  }
  return out;
}

// 吹き出しから部品への線の両端（吹き出しの縁の点 → 部品のいちばん近い点）。重なっているときは null
function calloutLine(c, part) {

  const cx = c.x + c.w / 2;
  const cy = c.y + c.h / 2;
  const inside = cx >= part.x && cx <= part.x + part.w && cy >= part.y && cy <= part.y + part.h;
  const ex = inside ? part.x + part.w / 2 : Math.min(Math.max(cx, part.x), part.x + part.w);
  const ey = inside ? part.y + part.h / 2 : Math.min(Math.max(cy, part.y), part.y + part.h);
  const dx = ex - cx;
  const dy = ey - cy;
  const tx = dx > 0 ? (c.w / 2) / dx : dx < 0 ? (-c.w / 2) / dx : Infinity;
  const ty = dy > 0 ? (c.h / 2) / dy : dy < 0 ? (-c.h / 2) / dy : Infinity;
  const k = Math.min(tx, ty);
  if (!(k < 1)) return null;
  return { x1: cx + dx * k, y1: cy + dy * k, x2: ex, y2: ey };
}

  return f;
}

// 項目の種類を変える。設定は新しい種類の形にそろえ（同じ名前の設定は残す）、その項目を置いた部品の種類も変える
// 入力欄の部品の種類のあいだだけで変える（表・ステータスとは行き来しない）
function changeItemType(design, item, type) {
  item.type = type;
  item.props = keepInitialInOptions(type, normalizeProps(partType(type), item.props));
  if (!LOOKUP_TYPES.includes(type)) item.lookup = null;
  design.screens.forEach((s) => s.parts.forEach((p) => { if (p.itemId === item.id) p.type = type; }));
}

// 部品の位置と大きさを 8 ドットのマス目に吸い付け、画面の中に収める（大きさは変えずに位置をずらす）
function fitRect(r, screen) {
  const maxW = Math.floor(screen.width / GRID) * GRID;
  const maxH = Math.floor(screen.height / GRID) * GRID;
  const w = Math.min(Math.max(PART_MIN, snapGrid(r.w)), maxW);
  const h = Math.min(Math.max(PART_MIN, snapGrid(r.h)), maxH);
  const x = Math.min(Math.max(0, snapGrid(r.x)), maxW - w);
  const y = Math.min(Math.max(0, snapGrid(r.y)), maxH - h);
  return { x, y, w, h };
}

// 縁のつまみ（grip: n・s・e・w と、その組み合わせ）を dx・dy だけ動かしたときの位置と大きさ。動かした辺だけをマス目に吸い付ける
function resizedRect(r0, grip, dx, dy, screen) {
  const maxX = Math.floor(screen.width / GRID) * GRID;
  const maxY = Math.floor(screen.height / GRID) * GRID;
  let l = r0.x;
  let t = r0.y;
  let r = r0.x + r0.w;
  let b = r0.y + r0.h;
  if (grip.includes('w')) l = Math.min(Math.max(0, snapGrid(l + dx)), r - PART_MIN);
  if (grip.includes('e')) r = Math.max(Math.min(maxX, snapGrid(r + dx)), l + PART_MIN);
  if (grip.includes('n')) t = Math.min(Math.max(0, snapGrid(t + dy)), b - PART_MIN);
  if (grip.includes('s')) b = Math.max(Math.min(maxY, snapGrid(b + dy)), t + PART_MIN);
  return { x: l, y: t, w: r - l, h: b - t };
}

// 部品を置いたときに付ける番号は「その画面のいちばん大きい番号＋1」
function nextPartNo(screen) {
  return screen.parts.reduce((m, p) => (Number.isInteger(p.no) && p.no > m ? p.no : m), 0) + 1;
}

// 同じ位置に部品があれば、重ならない所まで右下へずらす（押して置く・貼り付けを続けたときに、部品がぴったり重ならないため）
function freeSpot(screen, at) {
  let { x, y } = at;
  for (let i = 0; i < 40 && screen.parts.some((p) => p.x === x && p.y === y); i++) {
    x += PART_GAP;
    y += PART_GAP;
  }
  return { x, y };
}

// itemId を渡すと、その項目を指す部品を作る（項目名と設定は項目が持つ）。表の部品は tableKind で中身を決める
function createPartData(type, screen, at, itemId = null, { tableKind = 'subtable', design = null } = {}) {
  const t = partType(type);
  const rect = fitRect({ x: at.x, y: at.y, w: t.w, h: t.h }, screen);
  const base = { id: newId('p'), type, ...rect, no: t.noNumber ? null : nextPartNo(screen), labelPos: 'top', sample: '', placeholder: '' };
  if (type === 'table') base.tableKind = itemId ? 'subtable' : tableKind === 'subtable' ? 'records' : tableKind;
  if (type === 'table') base.view = { rows: 3, samples: {}, widths: {} };
  if (type === 'status' || type === 'steps') base.view = { current: '', showWord: true };
  if (itemId) return { ...base, itemId };
  const props = type === 'table' ? defaultTablePartProps(design) : clone(t.props);
  const label = type === 'table' ? (base.tableKind === 'related' ? '関連レコード一覧' : '一覧') : t.label;
  return { ...base, label, required: false, memo: '', props };
}

// レコード一覧・関連レコード一覧の設定の最初の値。レコード一覧の列は、この画面設計の項目の初めの 4 つ（入力欄の部品の項目）
function defaultTablePartProps(design) {
  const cols = design ? design.items.filter((it) => isInputType(it.type)).slice(0, 4) : [];
  return {
    columns: cols.map((it) => ({ id: newId('c'), ref: { itemId: it.id, name: it.name } })),
    sort: '', perPage: '20', limit: '5',
    db: { designId: null, name: '', free: false },
    cond: { from: emptyRef(), to: emptyRef() },
  };
}

// 選択肢の部品の初期値を、今の選択肢の中のものだけにする（選択肢を書き換えて、なくなった選択肢が初期値に残らないため）
function keepInitialInOptions(type, props) {
  if (!['dropdown', 'radio', 'checkbox'].includes(type) || !Array.isArray(props.options)) return props;
  const opts = props.options;
  if (type === 'checkbox') return { ...props, initial: (Array.isArray(props.initial) ? props.initial : []).filter((o) => opts.includes(o)) };
  return { ...props, initial: opts.includes(props.initial) ? props.initial : '' };
}

// 番号を振り直す: 番号の付いた部品を、上から下・左から右の順に 1 から付け直す（番号を外した部品はそのまま）
function renumberedParts(parts) {
  const order = parts.filter((p) => p.no != null).sort((a, b) => a.y - b.y || a.x - b.x);
  const nos = new Map(order.map((p, i) => [p.id, i + 1]));
  return parts.map((p) => (nos.has(p.id) ? { ...p, no: nos.get(p.id) } : p));
}

// 一覧表の「設定」の列の文。1 行目に「必須・最大 50 文字」のような短い条件を「・」でつなぎ、
// 「選択肢＝…」のように「＝」で書く項目は 1 つずつ行を分け、最後の行にメモを足す。何も書いていない欄は出さない
// ctx（{ design, state }）を渡すと、ルックアップの文も足す（ルックアップ元の名前を引くため）
function describePart(p, ctx = null) {
  const x = describePartLines(p, ctx);
  return [x.short, ...x.eq, x.memo].filter(Boolean).join('\n');
}
// 設定の文を組む前の形 { short（「必須・最大 50 文字」）, eq（「選択肢＝…」の行）, memo }。改訂履歴の変更内容の一覧で、行ごとに比べるためにも使う
function describePartLines(p, ctx = null) {
  const pr = p.props || {};
  const v = (s) => String(s == null ? '' : s).trim();
  const list = (a) => (Array.isArray(a) ? a.map(v).filter(Boolean).join('／') : '');
  const short = [];
  const eq = [];
  const eqIf = (label, value) => { if (value) eq.push(`${label}＝${value}`); };
  if (p.required && partType(p.type) && partType(p.type).input) short.push('必須');
  switch (p.type) {
    case 'text1': case 'text2':
      if (v(pr.maxLen)) short.push(`最大 ${v(pr.maxLen)} 文字`);
      eqIf('初期値', v(pr.initial));
      break;
    case 'number': {
      const [min, max, dec] = [v(pr.min), v(pr.max), v(pr.decimals)];
      if (min && max) short.push(`${min}〜${max}`);
      else if (min) short.push(`${min} 以上`);
      else if (max) short.push(`${max} 以下`);
      if (dec === '0') short.push('小数なし');
      else if (dec) short.push(`小数 ${dec} 桁`);
      eqIf('単位', v(pr.unit));
      eqIf('初期値', v(pr.initial));
      break;
    }
    case 'date':
      eqIf('初期値', pr.initial === 'today' ? '今日' : pr.initial === 'date' ? v(pr.initialDate) : '');
      break;
    case 'datetime':
      eqIf('初期値', pr.initial === 'now' ? '今の日時' : '');
      break;
    case 'dropdown': case 'radio': case 'checkbox':
      eqIf('選択肢', list(pr.options));
      eqIf('初期値', p.type === 'checkbox' ? list(pr.initial) : v(pr.initial));
      break;
    case 'user':
      if (pr.multiple) short.push('複数人を選べる');
      eqIf('選べる人', v(pr.scope));
      eqIf('初期値', pr.initial === 'me' ? '使っている人' : '');
      break;
    case 'file':
      if (v(pr.maxCount)) short.push(`${v(pr.maxCount)} 個まで`);
      eqIf('ファイル', v(pr.accept));
      break;
    case 'calc':
      eqIf('計算式', v(pr.formula));
      eqIf('単位', v(pr.unit));
      break;
    case 'button':
      eqIf('押したとき', v(pr.action));
      break;
    case 'table':
      if (p.tableKind === 'subtable') { if (p.required) short.push('必須（1 行以上）'); }
      else if (p.tableKind === 'related') {
        const src = ctx && pr.db && pr.db.designId ? findDesign(ctx.state, pr.db.designId) : null;
        const db = ctx ? dbLabel(ctx.state, pr.db) : v(pr.db && pr.db.name);
        eqIf('関連レコード一覧', db);
        if (pr.cond && (pr.cond.from.itemId || pr.cond.from.name)) eqIf('条件', `${db}の「${refLabel(src, pr.cond.from)}」がこのレコードの「${refLabel(ctx && ctx.design, pr.cond.to)}」と同じ`);
        eqIf('並べ順', v(pr.sort));
        if (v(pr.limit)) short.push(`最大 ${v(pr.limit)} 件`);
      } else {
        eqIf('並べ順', v(pr.sort));
        if (v(pr.perPage)) short.push(`1 ページ ${v(pr.perPage)} 件`);
      }
      break;
    case 'graph': {
      const by = itemNameIn(ctx, pr.byItem);
      eqIf('グラフ', CHART_NAMES[pr.chart] || '');
      eqIf('分類', by ? by + (v(pr.byUnit) ? `（${v(pr.byUnit)}）` : '') : v(pr.byUnit));
      const agg = pr.agg === 'count' ? AGG_NAMES.count : itemNameIn(ctx, pr.aggItem) ? `${itemNameIn(ctx, pr.aggItem)}の${AGG_NAMES[pr.agg] || '合計'}` : '';
      eqIf('集計', agg && agg + (v(pr.unit) ? `（${v(pr.unit)}）` : ''));
      break;
    }
    case 'search':
      eqIf('探す項目', (pr.items || []).map((id) => itemNameIn(ctx, id)).filter(Boolean).join('・'));
      if (pr.button === false) short.push('「検索」ボタンなし');
      break;
    case 'filter':
      eqIf('絞り込む項目', (pr.items || []).map((id) => itemNameIn(ctx, id)).filter(Boolean).join('・'));
      break;
    case 'pager':
      if (v(pr.perPage)) short.push(`1 ページ ${v(pr.perPage)} 件`);
      break;
    case 'status': case 'steps':
      eqIf('ステータス', (pr.states || []).join(p.type === 'steps' ? ' → ' : '／'));
      break;
    case 'tabs':
      eqIf('タブ', list(pr.tabs));
      break;
    case 'link':
      eqIf('移る先', pr.to === 'url' ? v(pr.url) : pr.to === 'screen' ? screenNameIn(ctx, pr.screenId) : '');
      break;
  }
  if (ctx) eq.push(...lookupLines(ctx, p));
  return { short: short.join('・'), eq, memo: v(p.memo) };
}

const itemNameIn = (ctx, id) => { const it = ctx && id ? findItem(ctx.design, id) : null; return it ? it.name : ''; };
const screenNameIn = (ctx, id) => { const s = ctx && id ? ctx.design.screens.find((x) => x.id === id) : null; return s ? `${s.name}の画面` : ''; };

// データベースの項目の一覧表の「設定」の列の文（部品の設定の一覧表と同じ書き方）。表（テーブル）は列の名前も書く
function describeItem(item, ctx = null) {
  const text = describePart({ type: item.type, tableKind: 'subtable', required: item.required, memo: item.memo, props: item.props, item }, ctx);
  if (item.type !== 'table') return text;
  const cols = (item.props.columns || []).map((c) => c.name).filter(Boolean).join('・');
  return [cols && `列＝${cols}`, text].filter(Boolean).join('\n');
}

// 表の部品の列（描くときと、一覧表の枝番の行に使う）。{ id, name, type, kind（部品の種類の名前）, setting（設定の文） }
function tableColumns(p, ctx = null) {
  const pr = p.props || {};
  if (p.tableKind === 'subtable') {
    return (pr.columns || []).map((c) => ({ id: c.id, name: c.name, type: c.type, kind: partTypeName(c.type), setting: describePart({ type: c.type, required: c.required, memo: c.memo, props: c.props }) }));
  }
  const design = ctx && ctx.design;
  const src = p.tableKind === 'related' ? (ctx && pr.db && pr.db.designId ? findDesign(ctx.state, pr.db.designId) : null) : design;
  return (pr.columns || []).map((c) => {
    const it = src && c.ref.itemId ? findItem(src, c.ref.itemId) : null;
    const setting = p.tableKind === 'related' ? `${ctx ? dbLabel(ctx.state, pr.db) : ''}の項目` : it ? describeItem(it, ctx) : '';
    return { id: c.id, name: it ? it.name : c.ref.name || '（項目を選んでいません）', type: it ? it.type : 'text1', kind: it ? itemTypeName(it.type) : '－', setting };
  });
}

// 一覧表の「項目名」の列。説明の文字は 1 行目の初めの 20 文字。名前がなければ部品の種類
function partTitle(p) {
  const first = String(p.label == null ? '' : p.label).split('\n')[0].trim();
  if (!first) return partTypeName(p.type);
  return p.type === 'desc' && first.length > 20 ? first.slice(0, 20) + '…' : first;
}

// 部品の設定の一覧表の行（番号の付いた部品だけを番号の順に）。design を渡すと、部品が指す項目の中身で書く
function tableRows(screen, design = null, state = null) {
  const ctx = design && state ? { design, state } : null;
  // 表の部品は、表の行の下に、列ごとの行を枝番（3-1・3-2）で並べる（CLAUDE.md の「部品の細かい決めごと（後半）」）
  return screen.parts
    .filter((p) => p.no != null)
    .sort((a, b) => a.no - b.no)
    .flatMap((raw) => {
      const p = design ? resolvePart(design, raw) : raw;
      const kind = p.type === 'table' ? `表（${TABLE_KINDS[p.tableKind] || 'テーブル'}）` : partTypeName(p.type);
      const row = { id: p.id, no: p.no, label: partTitle(p), kind, setting: describePart(p, ctx) };
      if (p.type !== 'table') return [row];
      return [row, ...tableColumns(p, ctx).map((c, i) => ({ id: p.id, no: `${p.no}-${i + 1}`, label: c.name, kind: c.kind, setting: c.setting, branch: true }))];
    });
}

// 部品のいちばん下の端より画面を低くしない（下の縁のドラッグで部品が切れないため）。機器の 1 画面分から 8 ドットずつ
function minScreenHeight(screen) {
  const min = DEVICES[screen.device].height;
  const bottom = screen.parts.reduce((m, p) => Math.max(m, p.y + p.h), 0);
  return bottom <= min ? min : min + Math.ceil((bottom - min) / GRID) * GRID;
}

// ── 改訂履歴（第 6 段階。CLAUDE.md の「改訂履歴の細かい決めごと」）──
// 画面設計の revisions の行: { id, kind, no, date, note, schemaVersion, appVersion, snapshot, changes, baseNo }
//   kind: 'revision'（改訂する。no に版の番号）・'import'（取り込む前の状態）・'restore'（戻す前の状態）・'ai'（AI が直す前の状態。第 7 段階）。
//     自動の行（import・restore・ai）の no は null。
//   snapshot: revisions を除いた画面設計の写し。ほかのモックから取り込んだ項目も、そのときの中身のまま写る（後で元が変わっても、前の版の中身は変わらない）。
//     書き出した HTML には写しを入れないので、HTML から足した画面設計の行には写しがない（見る・戻すができない）。
//   changes: 改訂したときに、ひとつ前の版（第 baseNo 版）と比べて作った変更内容の一覧（designDiff の rows）。第 1 版と、前の版の写しがないときは null
const REV_AUTO = { import: '取り込む前の状態', restore: '戻す前の状態', ai: 'AI が直す前の状態' };
const isVersionRow = (r) => isObj(r) && r.kind === 'revision' && Number.isInteger(r.no);
const hasSnapshot = (r) => isObj(r) && isObj(r.snapshot);
const versionRows = (d) => d.revisions.filter(isVersionRow);
const latestVersion = (d) => versionRows(d).reduce((m, r) => (!m || r.no > m.no ? r : m), null);
// 次の版の番号。消した版の番号は付け直さないが、いちばん新しい版を消したときは、その番号をもう一度使う（Claude が決めた）
const nextVersionNo = (d) => (latestVersion(d) ? latestVersion(d).no + 1 : 1);
const revisionTitle = (r) => (isVersionRow(r) ? `第 ${r.no} 版` : REV_AUTO[r.kind] || '自動で残した状態');
const revisionDay = (r) => fmtDateTime(r.date).slice(0, 10);
const findRevision = (d, id) => (d && id ? d.revisions.find((r) => isObj(r) && r.id === id) || null : null);
const todayDay = () => fmtDateTime(nowIso()).slice(0, 10);
// 日付の欄（YYYY-MM-DD）から行の日時を作る。今日なら今の日時、ほかの日ならその日の昼（時差で日付がずれないように）
function revisionDate(day) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str(day)) || day === todayDay()) return nowIso();
  const t = new Date(`${day}T12:00:00`);
  return Number.isNaN(t.getTime()) ? nowIso() : t.toISOString();
}

// 画面設計の中身（前の版に戻す・取り込んで置き換える・中身を比べるところ）。画面設計に中身の項目を足したら、ここに足す
// （restoreRevision・replaceWithImported・designContent がこれを使う。3 か所に並べていると、足すときに漏れるため。第 7 段階）
const DESIGN_CONTENT_KEYS = ['name', 'target', 'description', 'items', 'screens', 'mapPos'];
// 画面設計の中身だけを抜き出す。copy のときは中身を写す
function designContentOf(d, copy = false) {
  const out = {};
  DESIGN_CONTENT_KEYS.forEach((k) => { out[k] = copy && d[k] !== undefined ? clone(d[k]) : d[k]; });
  return out;
}
// 改訂履歴に残す写し（revisions を除いた画面設計）。凍らせて、元に戻すの履歴・保存では写さずに同じものを指す（stateWithRefs）
function designSnapshot(d) {
  return deepFreeze(clone({ ...d, revisions: undefined }));
}
function revisionRow(d, kind, { no = null, note = '', date = nowIso(), changes = null, baseNo = null } = {}) {
  return { id: newId('r'), kind, no, date, note, schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, snapshot: designSnapshot(d), changes, baseNo };
}
// 写しから、見る・戻す・比べるための画面設計を作る（今の形に直す。id は今の画面設計のまま）
function designFromSnapshot(d, r) {
  return normalizeDesign({ ...clone(r.snapshot), id: d.id, revisions: [] });
}
// 「改訂する」で残す変更内容の一覧。ひとつ前の版（いちばん新しい版）と今を比べる。前の版がない・写しがないときは null
function changesSinceLatest(d, state) {
  const prev = latestVersion(d);
  if (!prev || !hasSnapshot(prev)) return { changes: null, baseNo: prev ? prev.no : null };
  return { changes: designDiff(designFromSnapshot(d, prev), d, state).rows, baseNo: prev.no };
}

// ── 前の版と今の違い（変更内容の一覧と「新」「変」の印）──
// 部品・吹き出し・画面・項目は id で突き合わせる。「変」は、設定・位置・大きさのどれかが変わったもの（ユーザー指示）
const DIFF_CLIP = 40;
const clipText = (s, n = DIFF_CLIP) => {
  const t = String(s == null ? '' : s).replace(/\s*\n\s*/g, '／').trim();
  if (!t) return 'なし';
  return t.length > n ? t.slice(0, n) + '…' : t;
};
const fromTo = (label, a, b) => `${label}：${clipText(a)} → ${clipText(b)}`;
const LABEL_WORDS = { heading: '文字', desc: '文字', button: 'ボタンの文字', link: '文字' };
const LABEL_POS = { top: '上', left: '左' };
// 比べない名前の控え（{ itemId, name }・{ designId, name } の name）を外す。名前は今の名前で引いて書くので、控えの古さを違いにしない
function stripNameCaches(v) {
  if (Array.isArray(v)) return v.map(stripNameCaches);
  if (!isObj(v)) return v;
  const out = {};
  Object.keys(v).forEach((k) => {
    if (k === 'name' && (str(v.itemId) || str(v.designId))) return;
    out[k] = stripNameCaches(v[k]);
  });
  return out;
}
// 部品の、比べるための中身（項目の中身と合わせる）
function partFacts(design, raw, state) {
  const p = resolvePart(design, raw);
  const ctx = { design, state };
  const own0 = clone(raw);
  ['id', 'x', 'y', 'w', 'h', 'no'].forEach((k) => delete own0[k]);
  const item = p.item ? { name: p.item.name, type: p.item.type, required: p.item.required, memo: p.item.memo, props: p.item.props, lookup: p.item.lookup } : null;
  return {
    p, no: p.no, title: partTitle(p), label: str(p.label), orphan: isOrphanPart(design, raw),
    kind: p.type === 'table' ? `表（${TABLE_KINDS[p.tableKind] || 'テーブル'}）` : partTypeName(p.type),
    lines: describePartLines(p, ctx), setting: describePart(p, ctx),
    columns: p.type === 'table' ? tableColumns(p, ctx).map((c) => `${c.name}（${c.kind}）`).join('・') : '',
    all: canonicalJson(stripNameCaches({ own: own0, item })),
  };
}
// 設定の文の違い（「条件：なし → 必須」「選択肢：A → B」「メモ：…」）
function settingChanges(a, b) {
  const out = [];
  if (a.short !== b.short) out.push(fromTo('条件', a.short, b.short));
  const map = (eq) => new Map(eq.map((line) => {
    const i = line.indexOf('＝');
