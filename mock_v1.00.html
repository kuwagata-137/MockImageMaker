// keepSide: 右の欄の文字を書き換えたときは、右の欄を描き直さない（次に押した入力欄が作り直されて、文字が打てなくなるため）
function updateEditor({ keepSide = false } = {}) {
  const d = currentDesign();
  if (!d || d.trashedAt) { goHome(); return; }
  if (!d.screens.some((s) => s.id === ui.screenId)) ui.screenId = d.screens[0].id;
  if (!findPart(currentScreen(), ui.partId)) ui.partId = null; // 元に戻すなどで部品が消えたとき
  $('#ed-title').textContent = `${d.name}（${targetLabel(d.target)}）`;
  updateToolbarState();
  $('#screen-list').innerHTML = screenListHtml(d);
  renderStage();
  if (!keepSide) renderSettings(d);
}

function updateToolbarState() {
  const s = currentScreen();
  $('#tb-undo').disabled = !store.canUndo();
  $('#tb-redo').disabled = !store.canRedo();
  ['#tb-copy', '#tb-dup', '#tb-del'].forEach((sel) => { $(sel).disabled = !ui.partId; });
  $('#tb-paste').disabled = !ui.clipboard;
  $('#tb-renumber').disabled = !s || !s.parts.some((p) => p.no != null);
  $('#tb-mode-select').classList.toggle('on', ui.mode === 'select');
  $('#tb-mode-hand').classList.toggle('on', ui.mode === 'hand');
  $('#canvas-wrap').classList.toggle('hand', ui.mode === 'hand');
}

function screenListHtml(d) {
  return '<div class="panel-title">画面</div>' + d.screens.map((s, i) => `
    <button class="sl-item${s.id === ui.screenId ? ' active' : ''}" data-action="select-screen" data-id="${esc(s.id)}" title="${esc(s.name)}">
      <div class="sl-thumb">${thumbHtml(d, s, 132, 84)}</div>
      <div class="sl-name">${i + 1}　${esc(s.name)}</div>
    </button>`).join('');
}

// 真ん中の画面と、部品の設定の一覧表を描く。ドラッグ中は ui.previewHeight の高さで描く（保存はドラッグを放したとき）
function renderStage() {
  const d = currentDesign();
  const s = currentScreen();
  const h = ui.previewHeight == null ? s.height : ui.previewHeight;
  $('#stage').innerHTML = `
    <div class="stage-row ${s.tablePos === 'bottom' ? 'bottom' : 'right'}">
      <div class="screen-frame" style="width:${s.width}px">
        ${screenHtml(d, s, { grid: true, height: h, selectedId: ui.partId })}
        <div class="screen-resize" data-drag="resize" title="ドラッグで画面の高さを変えます（8 ドットずつ。機器の 1 画面分と、いちばん下の部品より低くはなりません）"><span></span></div>
        <div class="screen-size">${DEVICES[s.device].label}・${s.width} × ${h}</div>
      </div>
      ${partTableHtml(s, { editor: true, selectedId: ui.partId })}
    </div>`;
  const hv = $('#side-height');
  if (hv) hv.textContent = `${h} ドット`;
  applyZoom();
}

// 右の欄の上の部品の箱。組の見出しを押すと開く・閉じる（最初は全部開いている）
function renderPalette() {
  const box = $('#side-box');
  const top = box.scrollTop;
  const btn = (type) => {
    const t = partType(type);
    return `<button class="pal-btn" data-action="add-part" data-type="${type}" title="${esc(t.name)}（画面へドラッグして置く。押すと、見えている所の真ん中に置く）"><i>${t.icon}</i>${esc(t.pal || t.name)}</button>`;
  };
  box.innerHTML = '<div class="panel-title">部品 <small>（画面へドラッグして置く）</small></div>' + PALETTE_GROUPS.map((g) => {
    const open = !ui.paletteClosed[g.id];
    return `<div class="pal-group">
      <button class="pal-head" data-action="toggle-palette" data-id="${g.id}" aria-expanded="${open}">${open ? '▼' : '▶'} ${esc(g.name)}<span class="n">${g.types.length}</span></button>
      ${open ? `<div class="pal-grid">${g.types.map(btn).join('')}</div>` : ''}
    </div>`;
  }).join('');
  box.scrollTop = top;
}

// 右の欄の下。部品を選んでいるときはその部品の設定、選んでいないときは画面設計の情報と画面の設定。
// 同じものを描き直すときは、スクロールの位置を保つ
function renderSettings(d) {
  const el = $('#side-settings');
  const key = ui.partId || 'screen:' + ui.screenId;
  const top = el.dataset.key === key ? el.scrollTop : 0;
  const p = findPart(currentScreen(), ui.partId);
  if (p) el.innerHTML = partSettingsHtml(p);
  else renderScreenSettings(d, el);
  el.dataset.key = key;
  el.scrollTop = top;
}

function renderScreenSettings(d, el) {
  const s = currentScreen();
  const devices = Object.entries(DEVICES).map(([key, v]) => `
    <label><input type="radio" name="device" value="${key}" data-field="device"${s.device === key ? ' checked' : ''}><span>${v.label}<small>幅 ${v.width}</small></span></label>`).join('');
  const tablePos = [['right', '画面の右'], ['bottom', '画面の下']].map(([v, l]) => `
    <label><input type="radio" name="table-pos" value="${v}" data-field="table-pos"${s.tablePos === v ? ' checked' : ''}><span>${l}</span></label>`).join('');
  el.innerHTML = `
    <section>
      <div class="panel-title">画面設計の情報</div>
      <label class="field"><span>名前</span><input type="text" data-field="design-name" maxlength="${NAME_MAX}" value="${esc(d.name)}"></label>
      <div class="field"><span>作る先</span>${targetPickerHtml(store.state, d.target)}</div>
      <label class="field"><span>説明</span><textarea data-field="design-desc" rows="4" placeholder="この業務アプリで何をするか など">${esc(d.description)}</textarea></label>
    </section>
    <section>
      <div class="panel-title">画面の設定</div>
      <label class="field"><span>画面の名前</span><input type="text" data-field="screen-name" maxlength="${NAME_MAX}" value="${esc(s.name)}"></label>
      <div class="field"><span>機器の種類</span><div class="seg">${devices}</div></div>
      <div class="field"><span>高さ</span><span class="height-value" id="side-height">${s.height} ドット</span>
        <span class="hint">画面の下の縁をドラッグすると、8 ドットずつ伸ばせます。</span></div>
      <label class="check"><input type="checkbox" data-field="screen-header"${s.showHeader ? ' checked' : ''}>画面のいちばん上に「業務アプリ名 ／ 画面の名前」の帯を付ける</label>
      <div class="field" style="margin-top:10px"><span>部品の設定の一覧表の位置</span><div class="seg">${tablePos}</div></div>
    </section>`;
  bindTargetPicker(el, (t) => actions.updateDesignInfo(d.id, { target: t }));
}

// ── 選んだ部品の設定の欄（画像 q16）──
// 欄の data-pf は部品の項目の名前。「props.」で始まるものは部品の種類ごとの設定（props）
const pfLabel = (label, hint) => `<span>${label}${hint ? ` <small>${hint}</small>` : ''}</span>`;
const pfText = (key, label, value, { hint = '', placeholder = '', type = 'text' } = {}) =>
  `<label class="field">${pfLabel(label, hint)}<input type="${type}" data-pf="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;
const pfArea = (key, label, value, { hint = '', rows = 3 } = {}) =>
  `<label class="field">${pfLabel(label, hint)}<textarea data-pf="${key}" rows="${rows}">${esc(value)}</textarea></label>`;
const pfCheck = (key, label, on) => `<label class="check"><input type="checkbox" data-pf="${key}"${on ? ' checked' : ''}>${label}</label>`;
const pfSeg = (key, label, value, choices) => `<div class="field">${pfLabel(label)}<div class="seg">${choices.map(([v, l]) =>
  `<label><input type="radio" name="pf-${key}" value="${v}" data-pf="${key}"${value === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>`;
const pfSelect = (key, label, value, choices) => `<label class="field">${pfLabel(label)}<select data-pf="${key}">${choices.map(([v, l]) =>
  `<option value="${esc(v)}"${value === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
const pfRow = (...cells) => `<div class="row2">${cells.join('')}</div>`;
const NUM = { type: 'number' };

function partSettingsHtml(p) {
  const t = partType(p.type);
  const del = '<div class="pf-del"><button class="btn small danger-text" data-action="delete-part">この部品を消す</button></div>';
  if (!t) return `<div class="panel-title">選んだ部品</div><p class="hint">${esc(partTypeName(p.type))}です。新しい版のアプリで足した部品のため、この版では設定を変えられません。</p>${del}`;
  const typeFields = partTypeFieldsHtml(p);
  const setting = describePart(p);
  const out = p.no == null
    ? '<div class="pf-out"><b>一覧表の「設定」に出る文</b><div>（番号を外しているので、一覧表には出ません）</div></div>'
    : `<div class="pf-out"><b>一覧表の「設定」に出る文</b><div id="pf-out">${esc(setting) || '（まだありません）'}</div></div>`;
  return `
    <div class="panel-title">選んだ部品の設定（${p.no != null ? `番号 ${p.no}・` : ''}${esc(t.name)}）</div>
    ${partCommonFieldsHtml(p, t)}
    ${typeFields ? `<div class="pf-sep"><i>${esc(t.name)}の欄</i></div>${typeFields}` : ''}
    ${pfArea('memo', 'メモ', p.memo, { hint: '（自由に書く）' })}
    ${out}
    ${del}`;
}

// 共通の欄。入力欄の部品は 項目名・項目名の位置・見本の値・必須・番号を付ける（見本の値は薄い字のある部品だけ）
function partCommonFieldsHtml(p, t) {
  const numbered = pfCheck('numbered', '番号を付ける', p.no != null);
  if (p.type === 'button') return pfText('label', 'ボタンの文字', p.label) + numbered;
  if (p.type === 'heading') return pfText('label', '文字', p.label) + numbered;
  if (p.type === 'desc') return pfArea('label', '文字', p.label) + numbered;
  if (!t.input) return numbered;
  const sample = t.ph
    ? pfText('sample', '見本の値', p.sample, { hint: '（書かないときは薄い字）', placeholder: p.placeholder || t.ph })
      + pfText('placeholder', '薄い字', p.placeholder, { hint: '（見本の値がないときに出す字）', placeholder: t.ph })
    : '';
  return pfText('label', '項目名', p.label)
    + pfSeg('labelPos', '項目名の位置', p.labelPos, [['top', '上'], ['left', '左']])
    + sample
    + pfCheck('required', '必須', p.required)
    + numbered;
}

// 部品の種類ごとの欄（CLAUDE.md の「部品の細かい決めごと」）
function partTypeFieldsHtml(p) {
  const pr = p.props;
  // 選択肢の部品だけで使う欄（ほかの種類では作らない）
  const optionsField = () => pfArea('props.options', '選択肢', (pr.options || []).join('\n'), { hint: '（1 行に 1 つ）', rows: 4 });
  const dirField = () => pfSeg('props.dir', '並べ方', pr.dir, [['h', '横'], ['v', '縦']]);
  const initialField = () => `<div id="pf-initial" data-options="${esc(JSON.stringify(pr.options || []))}">${choiceInitialHtml(p)}</div>`;
  switch (p.type) {
    case 'text1': case 'text2':
      return pfRow(pfText('props.maxLen', '最大の文字数', pr.maxLen, NUM), pfText('props.initial', '初期値', pr.initial));
    case 'number':
      return pfText('props.unit', '単位', pr.unit, { placeholder: '例: 円・人' })
        + pfRow(pfText('props.min', 'いちばん小さい値', pr.min, NUM), pfText('props.max', 'いちばん大きい値', pr.max, NUM))
        + pfRow(pfText('props.decimals', '小数の桁数', pr.decimals, NUM), pfText('props.initial', '初期値', pr.initial));
    case 'date':
      return pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['today', '今日'], ['date', '日付を書く']])
        + (pr.initial === 'date' ? pfText('props.initialDate', '初期値の日付', pr.initialDate, { type: 'date' }) : '');
    case 'datetime':
      return pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['now', '今の日時']]);
    case 'dropdown': case 'radio':
      return optionsField() + initialField() + (p.type === 'radio' ? dirField() : '');
    case 'checkbox':
      return optionsField() + initialField() + dirField();
    case 'user':
      return pfText('props.scope', '選べる人', pr.scope, { placeholder: '例: 営業部の社員' })
        + pfCheck('props.multiple', '複数人を選べる', pr.multiple)
        + pfSelect('props.initial', '初期値', pr.initial, [['none', 'なし'], ['me', '使っている人']]);
    case 'file':
      return pfRow(pfText('props.accept', '受け付けるファイル', pr.accept, { placeholder: '例: PDF' }), pfText('props.maxCount', 'いちばん多い個数', pr.maxCount, NUM));
    case 'calc':
      return pfText('props.formula', '計算式', pr.formula, { placeholder: '例: 数量×単価' }) + pfText('props.unit', '単位', pr.unit, { placeholder: '例: 円' });
    case 'button':
      return pfSeg('props.style', '見た目', pr.style, [['primary', '目立つ（青）'], ['normal', 'ふつう（白）']])
        + pfArea('props.action', '押したとき', pr.action);
  }
  return '';
}

// 選択肢の部品の「初期値」。選択肢を書き換えたときは、ここだけを描き直す
function choiceInitialHtml(p) {
  const pr = p.props;
  const options = pr.options || [];
  if (p.type !== 'checkbox') return pfSelect('props.initial', '初期値', pr.initial, [['', '（なし）'], ...options.map((o) => [o, o])]);
  const on = Array.isArray(pr.initial) ? pr.initial : [];
  const boxes = options.map((o) => `<label><input type="checkbox" data-pf="props.initial" value="${esc(o)}"${on.includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('');
  return `<div class="field">${pfLabel('初期値', '（いくつでも）')}<div class="pf-multi">${boxes || '<span class="hint">選択肢を書くと選べます。</span>'}</div></div>`;
}

let keepSideOnNotify = false;
function commitKeepSide(fn) {
  keepSideOnNotify = true;
  try { fn(); } finally { keepSideOnNotify = false; }
}

// 右の欄の変更（文字は、欄を離れたときか Enter を押したときに保存する）
function onSidePanelChange(e) {
  if (e.target.dataset.pf) { onPartFieldChange(e.target); return; }
  const field = e.target.dataset.field;
  const d = currentDesign();
  const s = currentScreen();
  if (!field || !d) return;
  const v = e.target.value;
  if (field === 'design-name' || field === 'screen-name') {
    const old = field === 'design-name' ? d.name : s.name;
    const n = cleanName(v);
    if (!n) { e.target.value = old; toast('名前を空にはできません。'); return; }
    if (n === old) return;
    const patch = { name: n };
    commitKeepSide(() => (field === 'design-name' ? actions.updateDesignInfo(d.id, patch) : actions.updateScreen(d.id, s.id, patch)));
    return;
  }
  if (field === 'design-desc' && v !== d.description) commitKeepSide(() => actions.updateDesignInfo(d.id, { description: v }));
  if (field === 'device' && v !== s.device) actions.updateScreen(d.id, s.id, { device: v });
  if (field === 'screen-header') actions.updateScreen(d.id, s.id, { showHeader: e.target.checked });
  if (field === 'table-pos' && v !== s.tablePos) actions.updateScreen(d.id, s.id, { tablePos: v });
}

// 選んだ部品の設定の欄の変更。文字の欄は右の欄を描き直さずに保存し（打っている欄が作り直されないため）、
// 「一覧表に出る文」と選択肢の初期値だけを描き直す
const isTextInput = (el) => el.matches('input[type=text], input[type=number], input[type=date], textarea');
function onPartFieldChange(el) {
  const s = currentScreen();
  const p = findPart(s, ui.partId);
  if (!p) return;
  const key = el.dataset.pf;
  const value = readPartField(el);
  const old = key.startsWith('props.') ? p.props[key.slice(6)] : key === 'numbered' ? p.no != null : p[key];
  if (JSON.stringify(old) === JSON.stringify(value)) return;
  const patch = key.startsWith('props.') ? { props: { [key.slice(6)]: value } } : { [key]: value };
  if (!isTextInput(el)) { actions.updatePart(ui.designId, s.id, p.id, patch); return; }
  commitKeepSide(() => actions.updatePart(ui.designId, s.id, p.id, patch));
  const now = findPart(currentScreen(), p.id);
  const out = $('#pf-out');
  if (out) out.textContent = describePart(now) || '（まだありません）';
  if (key === 'props.options') refreshChoiceInitial(now.props.options);
}

const parseOptions = (text) => String(text).split('\n').map((o) => o.trim()).filter(Boolean);

// 選択肢の部品の初期値の欄を、options（まだ保存していない打ちかけの選択肢でもよい）に合わせて描き直す。同じ選択肢なら描き直さない
function refreshChoiceInitial(options) {
  const box = $('#pf-initial');
  const p = findPart(currentScreen(), ui.partId);
  if (!box || !p) return;
  const key = JSON.stringify(options);
  if (box.dataset.options === key) return;
  box.dataset.options = key;
  box.innerHTML = choiceInitialHtml({ ...p, props: keepInitialInOptions(p.type, { ...p.props, options }) });
}

function readPartField(el) {
  const key = el.dataset.pf;
  if (key === 'props.initial' && el.type === 'checkbox') {
    return [...document.querySelectorAll('#side-settings [data-pf="props.initial"]')].filter((c) => c.checked).map((c) => c.value);
  }
  if (el.type === 'checkbox') return el.checked;
  if (key === 'props.options') return parseOptions(el.value);
  // 1 行の欄は前後の空白を取る。複数行の欄（説明の文字・メモ・押したとき）は書いたまま
  return el.tagName === 'TEXTAREA' ? el.value : el.value.trim();
}

// 右の欄で打ちかけの文字（まだ change が起きていない）を保存する。
// 右の欄を作り直す操作（高さのドラッグ・部品を選ぶ）・命令・窓を離れる前に呼ぶ（呼ばないと、作り直しで打った文字が消える）
const TEXT_FIELDS = ['design-name', 'screen-name', 'design-desc'];
function flushSideField() {
  const el = document.activeElement;
  if (ui.view !== 'editor' || !el || !el.closest || !el.closest('#side-settings') || !isTextInput(el)) return;
  if (!el.dataset.pf && !TEXT_FIELDS.includes(el.dataset.field)) return;
  if ((el.dataset.field === 'design-name' || el.dataset.field === 'screen-name') && !cleanName(el.value)) return; // 名前を消して打ち直している途中は待つ
  onSidePanelChange({ target: el });
}

// ── 拡大縮小（ビジネスダイアグラムメーカーの applyZoom・syncZoomSpacer・zoomAtPointer から写した）──
function stageOffsetX() {
  return parseFloat($('#stage').style.left) || 0;
}

// スクロールできる範囲（#zoom-spacer）を、縮めた画面と一覧表の大きさに合わせる。画面が窓より狭いときは真ん中に置く。
// 一覧表の高さは中身で決まるので、描いた #stage の大きさ（拡大縮小の前の大きさ）も見る
function syncZoomSpacer() {
  const wrap = $('#canvas-wrap');
  const stage = $('#stage');
  const s = currentScreen();
  if (!wrap || !s) return;
  const h = ui.previewHeight == null ? s.height : ui.previewHeight;
  const tableW = s.tablePos === 'bottom' ? 0 : TABLE_GAP + TABLE_W;
  const sw = Math.round(Math.max(s.width + tableW + STAGE_PAD * 2, stage.offsetWidth) * ui.zoom);
  const sh = Math.round(Math.max(h + STAGE_PAD * 2 + SIZE_LABEL_H, stage.offsetHeight) * ui.zoom);
  const offX = Math.max(0, Math.round((wrap.clientWidth - sw) / 2));
  $('#stage').style.left = offX + 'px';
  const spacer = $('#zoom-spacer');
  spacer.style.width = sw + offX + 'px';
  spacer.style.height = sh + 'px';
}

function applyZoom() {
  const stage = $('#stage');
  if (!stage) return;
  stage.style.transform = `scale(${ui.zoom})`;
  syncZoomSpacer();
  const label = Math.round(ui.zoom * 100) + '%';
  $('#zoom-label').textContent = label;
  $('#zoom-badge').textContent = label;
}

function nextZoom(dir) {
  if (dir > 0) {
    const up = ZOOM_STEPS.find((z) => z >= ui.zoom + 0.01);
    return up == null ? ui.zoom : up;
  }
  const down = [...ZOOM_STEPS].reverse().find((z) => z <= ui.zoom - 0.01);
  return down == null ? ui.zoom : down;
}

// 窓の中の点（vx, vy）が指している画面の位置を動かさずに、倍率を変える
function zoomAt(vx, vy, zoom) {
  const wrap = $('#canvas-wrap');
  const before = ui.zoom;
  if (!wrap || zoom === before) return;
  const cx = (vx + wrap.scrollLeft - stageOffsetX()) / before;
  const cy = (vy + wrap.scrollTop) / before;
  ui.zoom = zoom;
  applyZoom();
  wrap.scrollLeft = Math.max(0, stageOffsetX() + cx * zoom - vx);
  wrap.scrollTop = Math.max(0, cy * zoom - vy);
}

function zoomAtPointer(ev, dir) {
  const r = $('#canvas-wrap').getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, nextZoom(dir));
}

// ボタン・キー・メニューからの拡大縮小は、見えている部分の真ん中を中心にする
function zoomByCommand(cmd) {
  const wrap = $('#canvas-wrap');
  const zoom = cmd === 'zoomReset' ? 1 : nextZoom(cmd === 'zoomIn' ? 1 : -1);
  zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, zoom);
}

function setMode(mode) {
  ui.mode = mode;
  updateToolbarState();
}

// ── ハンドツールと高さのドラッグ（ビジネスダイアグラムメーカーの initHandTool から写した）と、部品のドラッグ ──
// drag.kind: 'pan'（ハンドで動かす）・'resize'（画面の高さ）・'move'（部品を動かす）・'size'（部品の大きさ）・'place'（部品の箱から置く）
let drag = null;

function initCanvasEvents(wrap) {
  wrap.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest('[data-drag="resize"]')) { startResize(ev, wrap); return; }
    if (ui.mode !== 'hand') { onSelectModeMouseDown(ev); return; }
    ev.preventDefault();
    drag = { kind: 'pan', wrap, sx: ev.clientX, sy: ev.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
    wrap.classList.add('grabbing');
  });
  // ハンドのときはホイールで、どのモードでも Ctrl+ホイールで、カーソルの位置を中心に拡大縮小する
  wrap.addEventListener('wheel', (ev) => {
    if (ui.mode !== 'hand' && !(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    if (ev.deltaY !== 0) zoomAtPointer(ev, ev.deltaY < 0 ? 1 : -1);
  }, { passive: false });
}

function startResize(ev, wrap) {
  ev.preventDefault();
  flushSideField();
  const s = currentScreen();
  drag = { kind: 'resize', wrap, sy: ev.clientY, st: wrap.scrollTop, h0: s.height, device: s.device, minH: minScreenHeight(s) };
  document.body.classList.add('resizing');
}

// 選択のモードで画面の上を押したとき: 部品・縁のつまみならドラッグを始め、何もない所なら選ぶのをやめる
function onSelectModeMouseDown(ev) {
  const grip = ev.target.closest('.grip');
  const partEl = ev.target.closest('#stage .screen .part');
  if (partEl) { startPartDrag(ev, partEl.dataset.partId, grip ? grip.dataset.grip : null); return; }
  if (ev.target.closest('.ptable')) return; // 一覧表の行は click で選ぶ
  if (ui.partId) selectPart(null);
}

// 部品を選ぶ（null で選ぶのをやめる）。右の欄で打ちかけの文字は、前に選んでいた部品に保存してから切り替える
function selectPart(id) {
  flushSideField();
  if (ui.partId === id) return;
  ui.partId = id;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}

function startPartDrag(ev, partId, grip) {
  ev.preventDefault();
  selectPart(partId);
  // 右の欄の文字の欄にフォーカスが残っていると、Delete や矢印のキーがその欄に行くので外す
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
  const p = findPart(currentScreen(), partId);
  if (!p) return;
  drag = { kind: grip ? 'size' : 'move', grip, id: partId, sx: ev.clientX, sy: ev.clientY, r0: { x: p.x, y: p.y, w: p.w, h: p.h }, rect: null };
  if (!grip) document.body.classList.add('moving');
}

// 部品のドラッグ中は、その部品の要素だけを動かす（保存は放したとき）
function dragPart(ev) {
  const s = currentScreen();
  const dx = (ev.clientX - drag.sx) / ui.zoom;
  const dy = (ev.clientY - drag.sy) / ui.zoom;
  const r0 = drag.r0;
  const rect = drag.kind === 'move' ? fitRect({ ...r0, x: r0.x + dx, y: r0.y + dy }, s) : resizedRect(r0, drag.grip, dx, dy, s);
  drag.rect = rect;
  // id は読み込んだデータの値なので、セレクタに埋め込まずに dataset で探す
  const el = [...document.querySelectorAll('#stage .part')].find((e) => e.dataset.partId === drag.id);
  if (el) Object.assign(el.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
}

// 部品の箱のボタンを押したときに、ドラッグで置くかもしれないので覚えておく（動かさずに放せば click で真ん中に置く）
function startPlace(ev, type) {
  if (ev.button !== 0 || !partType(type)) return;
  ev.preventDefault();
  flushSideField();
  drag = { kind: 'place', type, sx: ev.clientX, sy: ev.clientY, moved: false, ghost: null };
}

const PLACE_GRAB = 8; // 置くときの影の左上から、マウスの位置までの幅（窓の上のドット）
function dragPlace(ev) {
  if (!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const t = partType(drag.type);
  if (!drag.ghost) {
    drag.moved = true;
    drag.ghost = document.createElement('div');
    drag.ghost.className = 'place-ghost';
    drag.ghost.textContent = t.name;
    drag.ghost.style.width = t.w * ui.zoom + 'px';
    drag.ghost.style.height = t.h * ui.zoom + 'px';
    document.body.appendChild(drag.ghost);
    document.body.classList.add('placing');
  }
  drag.ghost.style.left = ev.clientX - PLACE_GRAB + 'px';
  drag.ghost.style.top = ev.clientY - PLACE_GRAB + 'px';
}

// 画面の上で放したら、そこに置く。画面の外で放したら置かない
function dropPlace(done, ev) {
  done.ghost.remove();
  document.body.classList.remove('placing');
  // ドラッグを部品の箱の上で放すと click が起きて真ん中に置かれてしまうので、すぐ後の click を 1 回だけ止める
  const stop = (e) => { e.stopPropagation(); e.preventDefault(); };
  document.addEventListener('click', stop, true);
  setTimeout(() => document.removeEventListener('click', stop, true), 0);
  // 放した所に見えているのが画面のときだけ置く。画面の矩形だけで見ると、右の欄・メニューバーの裏に隠れた部分
  // （スクロールで見えない所）で放しても置いてしまうため。影（.place-ghost）は消してあるので邪魔にならない
  const scr = $('#stage .screen');
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  if (!scr || !hit || !scr.contains(hit)) return;
  const r = scr.getBoundingClientRect();
  const at = { x: (ev.clientX - PLACE_GRAB - r.left) / ui.zoom, y: (ev.clientY - PLACE_GRAB - r.top) / ui.zoom };
  addPartAt(done.type, at);
}

function addPartAt(type, at) {
  const id = actions.addPart(ui.designId, currentScreen().id, type, at);
  if (id) selectPart(id);
}

// 部品の箱のボタンを押しただけのときは、窓に見えている画面の真ん中に置く
function addPartAtCenter(type) {
  const t = partType(type);
  const wrap = $('#canvas-wrap');
  const scr = $('#stage .screen');
  if (!t || !wrap || !scr) return;
  const wr = wrap.getBoundingClientRect();
  const sr = scr.getBoundingClientRect();
  const cx = (wr.left + wr.width / 2 - sr.left) / ui.zoom;
  const cy = (wr.top + wr.height / 2 - sr.top) / ui.zoom;
  addPartAt(type, { x: cx - t.w / 2, y: cy - t.h / 2 });
}

function onDragMove(ev) {
  if (!drag) return;
  if (drag.kind === 'move' || drag.kind === 'size') { dragPart(ev); return; }
  if (drag.kind === 'place') { dragPlace(ev); return; }
  const { wrap } = drag;
  if (drag.kind === 'pan') {
    wrap.scrollLeft = drag.sl - (ev.clientX - drag.sx);
    wrap.scrollTop = drag.st - (ev.clientY - drag.sy);
    return;
  }
  // 窓の下の端の近くまで来たら、下へ送る（画面を長く伸ばすため）
  const r = wrap.getBoundingClientRect();
  if (r.height && ev.clientY > r.bottom - 32) wrap.scrollTop += 24;
  const dy = ev.clientY - drag.sy + (wrap.scrollTop - drag.st);
  const h = Math.max(snapHeight(drag.h0 + dy / ui.zoom, drag.device), drag.minH);
  if (h === (ui.previewHeight == null ? drag.h0 : ui.previewHeight)) return;
  ui.previewHeight = h;
  renderStage();
}

function onDragEnd(ev) {
  if (!drag) return;
  const done = drag;
  drag = null;
  document.body.classList.remove('resizing', 'moving');
  if (done.kind === 'place') { if (done.moved) dropPlace(done, ev); return; }
  if (done.kind === 'move' || done.kind === 'size') {
    const r = done.rect;
    const r0 = done.r0;
    if (r && (r.x !== r0.x || r.y !== r0.y || r.w !== r0.w || r.h !== r0.h)) actions.movePart(ui.designId, currentScreen().id, done.id, r);
    return;
  }
  done.wrap.classList.remove('grabbing');
  if (done.kind !== 'resize') return;
  const h = ui.previewHeight;
  ui.previewHeight = null;
  if (h != null && h !== done.h0) actions.updateScreen(ui.designId, currentScreen().id, { height: h });
  else renderStage();
}

// ── 部品のコピー・貼り付け・複製・削除・矢印のキーで動かす ──
function copyPart() {
  const p = findPart(currentScreen(), ui.partId);
  if (!p) return;
  ui.clipboard = clone(p);
  updateToolbarState();
  toast('部品をコピーしました。Ctrl+V で貼り付けます。');
}

// 続けて貼り付けると、前に貼り付けた所から右下へずらして置く
function pastePart() {
  const src = ui.clipboard;
  if (!src) return;
  const id = actions.insertPartCopy(ui.designId, currentScreen().id, src, { x: src.x + PART_GAP, y: src.y + PART_GAP });
  const p = findPart(currentScreen(), id);
  if (!p) return;
  ui.clipboard = { ...src, x: p.x, y: p.y };
  selectPart(id);
}

function duplicatePart() {
  const p = findPart(currentScreen(), ui.partId);
  if (!p) return;
  selectPart(actions.insertPartCopy(ui.designId, currentScreen().id, p, { x: p.x + PART_GAP, y: p.y + PART_GAP }));
}

function deletePart() {
  if (!ui.partId) return;
  const id = ui.partId;
  ui.partId = null;
  actions.deletePart(ui.designId, currentScreen().id, id);
}

function nudgePart(dx, dy) {
  const p = findPart(currentScreen(), ui.partId);
  if (p) actions.movePart(ui.designId, currentScreen().id, p.id, { ...p, x: p.x + dx * GRID, y: p.y + dy * GRID });
}

// ── 8. 命令（runCommand）──────────────────────────────────────────────────────
// ボタン・キー・アプリのメニュー（Electron の menu:command）からの命令は、すべてここで受ける
function runCommand(cmd) {
  if (isDialogOpen()) return false;
  flushSideField();
  switch (cmd) {
    case 'undo': store.undo(); return true;
    case 'redo': store.redo(); return true;
    case 'goHome':
      if (ui.view === 'editor') goHome();
      return true;
  }
  if (ui.view !== 'editor') return false;
  switch (cmd) {
    case 'zoomIn': case 'zoomOut': case 'zoomReset': zoomByCommand(cmd); return true;
    case 'modeSelect': setMode('select'); return true;
    case 'modeHand': setMode('hand'); return true;
    case 'copyPart': copyPart(); return true;
    case 'pastePart': pastePart(); return true;
    case 'duplicatePart': duplicatePart(); return true;
    case 'deletePart': deletePart(); return true;
    case 'deselectPart': selectPart(null); return true;
    case 'renumber': actions.renumberParts(ui.designId, currentScreen().id); return true;
  }
  const nudge = { moveLeft: [-1, 0], moveRight: [1, 0], moveUp: [0, -1], moveDown: [0, 1] }[cmd];
  if (nudge) { nudgePart(...nudge); return true; }
  return false;
}

const ACTION_COMMANDS = {
  undo: 'undo', redo: 'redo', home: 'goHome', 'zoom-in': 'zoomIn', 'zoom-out': 'zoomOut',
  'zoom-reset': 'zoomReset', 'mode-select': 'modeSelect', 'mode-hand': 'modeHand',
  'copy-part': 'copyPart', 'paste-part': 'pastePart', 'duplicate-part': 'duplicatePart', 'delete-part': 'deletePart', renumber: 'renumber',
};

// 編集の画面だけで使う、ボタン以外の押したときの動き
function onEditorClick(action, btn) {
  switch (action) {
    case 'select-screen':
      flushSideField();
      if (btn.dataset.id === ui.screenId) return true; // mousedown で切り替えた後の click
      ui.screenId = btn.dataset.id;
      ui.partId = null;
      updateEditor();
      return true;
    case 'add-part': addPartAtCenter(btn.dataset.type); return true;
    case 'select-part': selectPart(btn.dataset.id); return true;
    case 'toggle-palette':
      ui.paletteClosed[btn.dataset.id] = !ui.paletteClosed[btn.dataset.id];
      renderPalette();
      return true;
  }
  return false;
}

function onAppClick(e) {
  if (isDialogOpen()) return;
  if (ui.menuFor && !e.target.closest('.card-menu, .card-more')) {
    ui.menuFor = null;
    refreshCards();
  }
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const { action, id } = btn.dataset;
  if (ACTION_COMMANDS[action]) { runCommand(ACTION_COMMANDS[action]); return; }
  if (ui.view === 'editor' && onEditorClick(action, btn)) return;
  onHomeAction(action, id).catch(reportPageError);
}

function reportPageError(e) {
  console.error(e);
  toast('うまくいきませんでした（' + ((e && e.message) || e) + '）。');
}

// Ctrl+Z・Ctrl+Y・Ctrl+Shift+Z と、拡大縮小のキー（CheckListMaker v1.0.8 と同じ考え方）。
// 入力欄の中の Ctrl+Z・Ctrl+Y は、文字の取り消しとしてブラウザに任せる
function keyCommand(e) {
  const k = String(e.key || '').toLowerCase();
  if (k === 'z') return e.shiftKey ? 'redo' : 'undo';
  if (k === 'y') return 'redo';
  if (k === '+' || k === '=' || k === ';') return 'zoomIn';
  if (k === '-') return 'zoomOut';
  if (k === '0') return 'zoomReset';
  return null;
}

// 編集の画面で、入力欄の外で押したキー（部品を選んでいるときの Delete・矢印・Esc と、Ctrl+C・Ctrl+V・Ctrl+D）
function editorKeyCommand(e) {
  const k = String(e.key || '');
  if (e.ctrlKey || e.metaKey) {
    const low = k.toLowerCase();
    if (low === 'c' && ui.partId) return 'copyPart';
    if (low === 'v' && ui.clipboard) return 'pastePart';
    if (low === 'd' && ui.partId) return 'duplicatePart';
    return null;
  }
  if (!ui.partId) return null;
  if (k === 'Delete' || k === 'Backspace') return 'deletePart';
  if (k === 'Escape') return 'deselectPart';
  return { ArrowLeft: 'moveLeft', ArrowRight: 'moveRight', ArrowUp: 'moveUp', ArrowDown: 'moveDown' }[k] || null;
}

function onKeyDown(e) {
  if (isDialogOpen()) return;
  if (e.key === 'Escape' && ui.menuFor) { ui.menuFor = null; refreshCards(); return; }
  const inField = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])');
  if (ui.view === 'editor' && !inField && !e.altKey && !e.isComposing) {
    const partCmd = editorKeyCommand(e);
    if (partCmd) { e.preventDefault(); runCommand(partCmd); return; }
  }
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const cmd = keyCommand(e);
  if (!cmd) return;
  if ((cmd === 'undo' || cmd === 'redo') && inField) return;
  if (cmd.startsWith('zoom') && ui.view !== 'editor') return;
  e.preventDefault();
  runCommand(cmd);
}

function onStoreChange() {
  if (ui.view === 'home') renderHome();
  else updateEditor({ keepSide: keepSideOnNotify });
}

// ── 9. 起動 ───────────────────────────────────────────────────────────────────
function bindGlobalEvents() {
  const app = appEl();
  app.addEventListener('click', onAppClick);
  app.addEventListener('input', (e) => {
    // 選択肢を打っている間も、初期値の欄を今の選択肢に合わせておく（離れたときに初期値の欄を作り直すと、押した四角が消えるため）
    if (e.target.dataset && e.target.dataset.pf === 'props.options') { refreshChoiceInitial(parseOptions(e.target.value)); return; }
    if (e.target.id !== 'home-search') return;
    ui.query = e.target.value;
    refreshCards();
  });
  app.addEventListener('change', (e) => {
    if (e.target.closest('#side-panel') && !e.target.closest('.target-picker')) onSidePanelChange(e);
  });
  app.addEventListener('mousedown', (e) => {
    if (ui.view !== 'editor' || e.button !== 0) return;
    // 部品の箱のボタンからのドラッグ（押しただけなら click で置く）
    const btn = e.target.closest('.pal-btn');
    if (btn) { startPlace(e, btn.dataset.type); return; }
    // 一覧表の行と画面の一覧は、押した時点で切り替える。右の欄で打ちかけの文字があると、離れたときの保存で
    // 一覧表と画面の一覧が描き直され、押した行・ボタンが click の前に消えて、1 回目の押しが効かないため
    const sel = e.target.closest('[data-action="select-part"], [data-action="select-screen"]');
    if (sel) onEditorClick(sel.dataset.action, sel);
  });
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  window.addEventListener('resize', () => { if (ui.view === 'editor') syncZoomSpacer(); });
  window.addEventListener('blur', flushSideField);
  window.addEventListener('beforeunload', flushSideField);
}

async function boot() {
  const created = await createAppStore();
  store = created.store;
  if (created.blockReason) showBanner(created.blockReason + ' 今のデータを消さないように、保存を止めています。');
  else if (created.notice) showBanner(created.notice);
  store.subscribe(onStoreChange);
  bindGlobalEvents();
  if (window.menuAPI) window.menuAPI.onCommand(runCommand);
  renderHome();
  exposeForTest();
}

// ── 10. テスト用の窓口 ────────────────────────────────────────────────────────
// テストの土台（test/harness.js）が起動の前に window.__test__ を置いたときだけ埋める
function exposeForTest() {
  if (!window.__test__) return;
  Object.assign(window.__test__, {
    store, ui, actions, runCommand, openDesign, goHome, migrate, normalizeState, snapHeight, changeDevice,
    visibleDesigns, trashedDesigns, resolveTargetName, DEVICES, SCHEMA_VERSION, STORAGE_KEY, APP_VERSION,
    PART_TYPES, PALETTE_GROUPS, fitRect, resizedRect, describePart, tableRows, renumberedParts, minScreenHeight, selectPart, currentScreen,
    ready: true,
  });
}

// 起動の途中で例外が出たときは、真っ白のまま止まらないように、上の赤い帯で知らせる
boot().catch((e) => {
  console.error(e);
  showBanner('アプリを起動できませんでした（' + ((e && e.message) || e) + '）。');
});
</script>
