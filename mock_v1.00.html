  return [Math.min(Math.max(dx, lo), hi), Math.min(Math.max(dy, lo2), hi2)].map((v) => (Number.isFinite(v) ? v : 0));
}

// 設定の欄の変更を、項目（nameKey は 'name'）か、項目を指さない部品（nameKey は 'label'）に書く
function applyFieldPatch(target, nameKey, patch) {
  if ('label' in patch) target[nameKey] = patch.label;
  if ('required' in patch) target.required = !!patch.required;
  if ('memo' in patch) target.memo = patch.memo;
  if (!isObj(patch.props)) return;
  let props = { ...target.props, ...patch.props };
  // ステータスの並びを名前の並びで書いたとき（右の欄の「ステータスの並び」）は、同じ名前のステータスの id を残し、なくなったステータスを使う操作を消す
  const names = patch.props.states;
  if (Array.isArray(names) && names.every((s) => typeof s === 'string') && isObj(target.props) && Array.isArray(target.props.states)) {
    const fixed = statePropsFromNames(target.props, names).props;
    props = { ...props, states: fixed.states, actions: 'actions' in patch.props ? props.actions : fixed.actions };
  }
  target.props = keepInitialInOptions(target.type, props);
}
// 項目の項目名・必須・メモ・設定を書き換える。ステータスの並びを変えたときは、なくなったステータスを見本で出していた部品を「なし」にする
function setItemFields(design, item, patch) {
  const before = stateIdsOf(item);
  applyFieldPatch(item, 'name', patch);
  clearGoneStates(design, item, before);
}

// ── 5. 共通の部品 ─────────────────────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showBanner(message) {
  const el = $('#banner');
  el.textContent = message;
  el.hidden = false;
}

let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}

// 小さな窓。OK で collect(窓) の結果（{ error } なら窓に出して閉じない）、キャンセルで null を返す。
// 窓は 1 つだけ。開いている間は後ろの画面（#app）を inert にして、押せないようにする。
// okHidden: OK のボタンを隠す（「閉じる」だけの窓。窓の中のボタンから OK を押した形で閉じるときに使う）
// ボタンは Windows の決まりで、肯定（OK）を左、取りやめ（キャンセル・閉じる）を右に並べ、右下に寄せる（2026-10-14 ユーザー指示）。
// 最初にフォーカスを当てるボタンは、並びとは別に決める（下の focus の行）
// aiPassive: 見るだけの窓（「AI とつなぐ」など）。開いている間も、AI の書く頼みを断らない（8-4 の例外）
function showDialog({ title, body, okLabel = 'OK', okClass = 'primary', init, collect, wide = false, width = null, cancelLabel = 'キャンセル', okHidden = false, aiPassive = false }) {
  if (isDialogOpen()) return Promise.resolve(null);
  return new Promise((resolve) => {
    const root = $('#dialog-root');
    root.innerHTML = `
      <div class="modal-overlay"${aiPassive ? ' data-ai-passive' : ''}>
        <div class="modal${wide ? ' wide' : ''}"${width ? ` style="width:min(${width}px,calc(100vw - 32px))"` : ''} role="dialog" aria-modal="true" aria-label="${esc(title)}">
          <h2>${esc(title)}</h2>
          <div class="modal-body">${body}</div>
          <p class="modal-error" hidden></p>
          <div class="modal-actions">
            <button class="btn ${okClass}" data-dlg="ok"${okHidden ? ' hidden' : ''}>${esc(okLabel)}</button>
            <button class="btn" data-dlg="cancel">${esc(cancelLabel)}</button>
          </div>
        </div>
      </div>`;
    const modal = $('.modal', root);
    const close = (value) => {
      document.removeEventListener('keydown', onKey, true);
      root.innerHTML = '';
      appEl().removeAttribute('inert');
      resolve(value);
    };
    const ok = () => {
      const r = collect ? collect(modal) : true;
      if (r && r.error) {
        const errEl = $('.modal-error', modal);
        errEl.textContent = r.error;
        errEl.hidden = false;
        return;
      }
      close(r);
    };
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(null); return; }
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      // ボタンの上の Enter は、ブラウザの本来の動き（そのボタンを押す）に任せる。複数行の欄では改行にする
      if (e.target && e.target.closest && e.target.closest('button, textarea')) return;
      e.preventDefault();
      // 名前で探す欄の Enter は、探すだけで肯定にしない。肯定のボタンを押せないときも肯定にしない（T9 の見直し。入れる窓で、
      // 探してから Enter を押すと、選んでいた画面設計を入れて窓が閉じていた・何も選んでいないと誤りの文が出ていた）
      if (e.target && e.target.matches && e.target.matches('input[type="search"]')) return;
      if ($('[data-dlg="ok"]', modal).disabled) return;
      ok();
    }
    document.addEventListener('keydown', onKey, true);
    $('[data-dlg="cancel"]', modal).addEventListener('click', () => close(null));
    $('[data-dlg="ok"]', modal).addEventListener('click', ok);
    appEl().setAttribute('inert', '');
    if (init) init(modal);
    // 窓の中にフォーカスを移す。危ない操作の窓では「キャンセル」に置く（Enter の押し間違いで実行しないため）
    if (!modal.contains(document.activeElement)) $(okClass === 'danger' || okHidden ? '[data-dlg="cancel"]' : '[data-dlg="ok"]', modal).focus();
  });
}
const isDialogOpen = () => !!$('#dialog-root .modal-overlay');

// 作る先を選ぶ欄。「その他」を選ぶと名前を書く欄が出る。選んだ値は readTargetPicker で読む
const OTHER_TARGET = '__other__';
function targetPickerHtml(state, current) {
  const customs = [...state.settings.customTargets];
  if (current && !builtinTarget(current) && !customs.includes(current)) customs.push(current);
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
  return `
    <div class="target-picker">
      <select class="target-select" aria-label="作る先">
        ${current ? '' : opt('', '（選んでいません）', true)}
        ${BUILTIN_TARGETS.map((t) => opt('b:' + t.id, t.label, current === t.id)).join('')}
        ${customs.map((c) => opt('c:' + c, c, current === c)).join('')}
        ${opt(OTHER_TARGET, 'その他（名前を書く）', false)}
      </select>
      <input type="text" class="target-other" maxlength="${TARGET_MAX}" placeholder="作る先の名前" aria-label="作る先の名前" hidden>
    </div>`;
}
// 戻り値: 作る先（kintone などは id、その他は書いた名前）。その他で名前が空なら null
function readTargetPicker(root) {
  const v = $('.target-select', root).value;
  if (v === OTHER_TARGET) return resolveTargetName($('.target-other', root).value) || null;
  return v.slice(2);
}
function bindTargetPicker(root, onPick) {
  const sel = $('.target-select', root);
  const other = $('.target-other', root);
  sel.addEventListener('change', () => {
    other.hidden = sel.value !== OTHER_TARGET;
    if (!other.hidden) { other.focus(); return; }
    if (onPick && sel.value) onPick(readTargetPicker(root));
  });
  if (!onPick) return;
  other.addEventListener('change', () => {
    const t = readTargetPicker(root);
    if (t) onPick(t);
  });
}

function targetChip(target) {
  const cls = builtinTarget(target) ? ' t-' + target : '';
  return `<span class="chip${cls}">${esc(targetLabel(target))}</span>`;
}

// 画面を、編集の画面と同じ HTML で描く（縮小画像にも使う）。selectedId の部品には、選んだ印と縁のつまみを付ける。
// marks のとき（編集の画面）は、項目を消した後に残った部品などに小さな札を付ける（出力と縮小画像には付けない）
// selected（部品の id の Set）を渡すと、それらに選んだ印を付ける。縁のつまみは gripId の部品だけ（1 つだけ選んだとき）
// diff（designDiff の screens の 1 つ）を渡すと、前の版から足した・変えた部品の右上に「新」「変」の札を付ける
function screenHtml(design, screen, { grid = false, height = screen.height, selectedId = null, selected = null, gripId = selectedId, marks = false, diff = null } = {}) {
  const band = screen.showHeader ? `<div class="screen-band">${esc(design.name)} ／ ${esc(screen.name)}</div>` : '';
  const isSel = (id) => (selected ? selected.has(id) : id === selectedId);
  // 札は部品の右上の角から外へ出す。画面の上・右の端の部品では、画面の外へ出た分が切れるので内側に寄せる
  const edge = (p) => `${p.y < DF_OUT ? ' df-t' : ''}${p.x + p.w + DF_OUT > screen.width ? ' df-r' : ''}`;
  const parts = screen.parts.map((p) => partHtml(resolvePart(design, p), isSel(p.id), marks, p.id === gripId, diff ? diff.parts[p.id] : null, edge(p))).join('');
  return `<div class="screen${grid ? ' grid' : ''}" style="width:${screen.width}px;height:${height}px">${band}${parts}</div>`;
}

// ── 部品の見た目（画像 q15・仕上がりイメージ.png に合わせた）──
const GRIPS = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
const partNoHtml = (p, cls = '') => (p.no != null ? `<span class="pno${cls}">${p.no}</span>` : '');

// 違いの札（q42 案A）。kind は 'new'（新）か 'chg'（変）。edge は内側に寄せるクラス（' df-t'・' df-r'）。DF_OUT は札が部品の角から外へ出る幅（CSS の .df と同じ）
const DF_OUT = 11;
const diffBadge = (kind, edge = '') => (kind ? `<span class="df df-${kind === 'new' ? 'new' : 'chg'}${edge}">${kind === 'new' ? '新' : '変'}</span>` : '');
const diffBadgeInline = (kind) => (kind ? `<span class="df-in df-${kind === 'new' ? 'new' : 'chg'}">${kind === 'new' ? '新' : '変'}</span>` : '');
function partHtml(p, selected = false, marks = false, withGrips = selected, diffKind = null, diffEdge = '') {
  const t = partType(p.type);
  const cls = ['part', 'pt-' + (t ? p.type : 'unknown')];
  if (t && t.input && p.labelPos === 'left') cls.push('lab-left');
  if (selected) cls.push('sel');
  const grips = selected && withGrips ? GRIPS.map((g) => `<span class="grip g-${g}" data-grip="${g}"></span>`).join('') : '';
  // 読み込んだデータが思わぬ形でも、ほかの部品と画面は描けるように、この部品だけを「描けない部品」の箱にする
  let inner;
  try {
    inner = partInnerHtml(p, t, marks);
  } catch (e) {
    inner = `<div class="punknown">この部品は描けません（${esc(e.message || e)}）</div>`;
  }
  return `<div class="${cls.join(' ')}" data-part-id="${esc(p.id)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px">${inner}${grips}${diffBadge(diffKind, diffEdge)}</div>`;
}

// 編集の画面だけで、項目名の後ろに付ける札（項目を一覧表から消した後に残った部品）
function partMarksHtml(p) {
  if (isItemPart(p) && p.itemId && !p.item) return ' <span class="tag gone" title="この部品の項目は、データベースの項目の一覧表から消しました">項目なし</span>';
  const link = p.item && p.item.link;
  if (link && link.lost) return ` <span class="tag lost" title="取り込んだ元のモック（または元の項目）はもうありません">取り込み・元なし</span>`;
  if (link) return ` <span class="tag link" title="モック「${esc(link.designName)}」から取り込んだ項目">取り込み</span>`;
  return '';
}

function partInnerHtml(p, t, marks = false) {
  if (!t) return `<div class="punknown">${partNoHtml(p)}${esc(partTypeName(p.type))}</div>`;
  const pr = p.props;
  // 項目名のない部品の番号は、ボタンと同じく左の外（左に入る幅がないときは左上の角に重ねる）
  const outNo = () => partNoHtml(p, p.x >= 28 ? ' pno-out' : ' pno-corner');
  switch (p.type) {
    case 'table': return `${partLabelHtml(p, marks)}${tableHtml(p)}`;
    case 'graph': return `<div class="plabel">${partNoHtml(p)}<span class="plabel-text">${esc(p.label)}</span></div><div class="pgraph">${graphSvg(p)}</div>`;
    case 'search':
      return `${outNo()}<div class="psearch"><span class="pph">🔍 ${esc(p.placeholder || t.ph)}</span>${pr.button !== false ? '<b>検索</b>' : ''}</div>`;
    case 'filter': {
      const names = (pr.items || []).map((id, i) => [p.itemNames ? p.itemNames[id] : '', (pr.values || [])[i]]);
      const chips = names.length
        ? names.map(([n, val]) => `<span class="f"><small>${esc(n || '（項目なし）')}</small>${esc(val || 'すべて')}<i>▼</i></span>`).join('')
        : '<span class="pph">（絞り込む項目を選んでください）</span>';
      return `${outNo()}<div class="pfilter"><span>絞り込み:</span>${chips}</div>`;
    }
    case 'pager': {
      const per = Math.max(1, Number(pr.perPage) || 20);
      const total = Math.max(0, Number(pr.total) || 0);
      const pages = Math.max(1, Math.ceil(total / per));
      const nums = pages <= 4 ? Array.from({ length: pages }, (_, i) => String(i + 1)) : ['1', '2', '3', '…', String(pages)];
      const count = pr.showCount === false ? '' : total ? `<em>${total} 件中 1〜${Math.min(per, total)} 件</em>` : '<em>0 件</em>';
      return `${outNo()}<div class="ppager"><span>‹</span>${nums.map((n, i) => `<span${i === 0 ? ' class="on"' : ''}>${n}</span>`).join('')}<span>›</span>${count}</div>`;
    }
    case 'status': {
      // 見本で出すステータスがない（「なし」・並びにない）ときは、並びの 1 つ目を出す
      const states = pr.states || [];
      const id = resolveStateRef(states, p.view && p.view.current);
      const at = Math.max(0, states.findIndex((s) => s.id === id));
      const word = p.view && p.view.showWord === false ? '' : `<span>${esc(p.label)}</span>`;
      return `${outNo()}<div class="pstatus">${word}<span class="pbadge sc${at % 5}">${esc(states[at] ? states[at].name : '')}</span>${marks ? partMarksHtml(p) : ''}</div>`;
    }
    case 'steps': {
      const states = pr.states || [];
      const id = resolveStateRef(states, p.view && p.view.current);
      const at = id ? states.findIndex((s) => s.id === id) : -1;
      return `${outNo()}<div class="psteps">${states.map((s, i) => `<span class="${i < at ? 'done' : i === at ? 'on' : ''}">${esc(s.name)}</span>`).join('')}</div>`;
    }
    case 'tabs': {
      const tabs = pr.tabs || [];
      const cur = tabs.includes(pr.current) ? pr.current : tabs[0];
      return `${outNo()}<div class="ptabs">${tabs.map((s) => `<span${s === cur ? ' class="on"' : ''}>${esc(s)}</span>`).join('')}</div>`;
    }
    case 'image':
      return `${partNoHtml(p, ' pno-corner')}<div class="pimage"><svg width="40" height="32" viewBox="0 0 40 32" aria-hidden="true"><rect x="1" y="1" width="38" height="30" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/><circle cx="12" cy="10" r="3.5" fill="#94a3b8"/><path d="M4,28 L15,17 L22,23 L28,15 L37,28 Z" fill="#94a3b8"/></svg>${esc(p.label)}</div>`;
    case 'link':
      return `${outNo()}<div class="plink">${esc(p.label)}</div>`;
    case 'icon':
      return `${partNoHtml(p, ' pno-corner')}<div class="picon-wrap">${iconSvg(pr.icon, pr.color)}</div>`;
    case 'button':
      // 番号はボタンの左の外。左に番号の入る幅がないときは、画面の縁で切れないように左上の角に重ねる
      return `${partNoHtml(p, p.x >= 28 ? ' pno-out' : ' pno-corner')}<div class="pbtn ${pr.style === 'normal' ? 'normal' : 'primary'}">${esc(p.label)}</div>`;
    case 'heading':
      return `<div class="phead">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'desc':
      return `<div class="pdesc">${partNoHtml(p)}<span>${esc(p.label)}</span></div>`;
    case 'divider':
      return `<div class="pline">${partNoHtml(p)}<i></i></div>`;
  }
  return partLabelHtml(p, marks) + partFieldHtml(p, t);
}

// 入力欄の部品と表の、番号・項目名・必須の印・ルックアップの札（と、編集の画面だけの札）
function partLabelHtml(p, marks) {
  const ref = p.lookupRole ? '<span class="reftag" title="ほかのデータベースから値を引く項目（ルックアップ）">⇦ ルックアップ</span>' : '';
  const related = p.type === 'table' && p.tableKind === 'related' && p.relatedName ? `<span class="reftag" title="ほかのデータベースのレコードを並べる表（関連レコード一覧）">⇦ ${esc(p.relatedName)}</span>` : '';
  return `<div class="plabel">${partNoHtml(p)}<span class="plabel-text">${esc(p.label)}</span>${p.required ? '<span class="preq">*</span>' : ''}${ref}${related}${marks ? partMarksHtml(p) : ''}</div>`;
}

// 表の部品の中身。列の名前・見本の値・幅は p.columns（resolvePart で付けた列）と、この画面だけの設定（view）から
function tableHtml(p) {
  const cols = p.columns || [];
  const view = p.view || { rows: 3, samples: {}, widths: {} };
  const ops = p.tableKind === 'subtable';
  const icon = p.tableKind === 'records';
  const avail = Math.max(60, p.w - (ops ? 52 : 0) - (icon ? 34 : 0) - 2);
  const fixed = cols.reduce((s, c) => s + (view.widths[c.id] || 0), 0);
  const free = cols.filter((c) => !view.widths[c.id]).length;
  const each = free ? Math.max(40, Math.floor((avail - fixed) / free)) : 0;
  const width = (c) => view.widths[c.id] || each;

  const rows = Array.from({ length: view.rows }, (_, r) => `<tr>${icon ? '<td class="ic">📄</td>' : ''}${cols.map((c) => {

// グラフの部品の絵。見本の値（1 行に「分類, 値」）から、棒・横棒・折れ線・円を描く
const GRAPH_COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', '#f97316'];
// 1 行に「分類, 値」。全角の数字は半角に直し、値の中の桁の区切り（1,200）は数に含める。値の後ろの単位（120万）は読み飛ばす。
// 値に数字のない行は描かない（0 の棒にしない）
function parseGraphSamples(text) {
  return String(text || '').normalize('NFKC').split('\n').map((line) => {
    const m = line.match(/^(.*?)[,、\t]\s*[¥$]?([-+]?\d[\d,]*(?:\.\d+)?)[^\d]*$/);
    if (!m) return null;
    const value = Number(m[2].replace(/,/g, ''));
    return Number.isFinite(value) ? { label: m[1].trim(), value: Math.max(0, value) } : null;
  }).filter(Boolean).slice(0, 24);
}
// 目盛りを 4 つに分けたとき、1 目盛りがきりのよい数（6・60・250 など）になるいちばん上の値
function niceMax(v) {
  if (v <= 0) return 4;
  const raw = v / 4;
  const p = 10 ** Math.floor(Math.log10(raw));
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map((k) => k * p).find((x) => x >= raw - 1e-9) * 4;
}
function graphSvg(p) {
  const w = Math.max(40, p.w - 2);
  const h = Math.max(40, p.h - TABLE_LABEL_H - 6);
  const data = parseGraphSamples(p.props.samples);
  const svg = (inner) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif" aria-hidden="true">${inner}</svg>`;
  const text = (x, y, s, attrs = '') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="11" fill="#475569" ${attrs}>${esc(s)}</text>`;
  if (!data.length) return svg(text(w / 2, h / 2, '見本の値を書くと、グラフが出ます', 'text-anchor="middle"'));
  const max = niceMax(Math.max(...data.map((d) => d.value)));
  const chart = p.props.chart;
  if (chart === 'pie') {
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const r = Math.max(10, Math.min(h / 2 - 10, w * 0.28));
    const cx = r + 16;
    const cy = h / 2;
    let a = -Math.PI / 2;
    const whole = data.filter((d) => d.value > 0).length === 1;
    const slices = data.map((d, i) => {
      const da = (d.value / total) * Math.PI * 2;
      const [x1, y1, x2, y2] = [cx + r * Math.cos(a), cy + r * Math.sin(a), cx + r * Math.cos(a + da), cy + r * Math.sin(a + da)];
      const path = whole ? (d.value > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${GRAPH_COLORS[i % 8]}"/>` : '')
        : `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${da > Math.PI ? 1 : 0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${GRAPH_COLORS[i % 8]}"/>`;
      a += da;
      return path;
    }).join('');
    const legend = data.map((d, i) => `<rect x="${cx + r + 24}" y="${18 + i * 22}" width="11" height="11" fill="${GRAPH_COLORS[i % 8]}"/>${text(cx + r + 40, 28 + i * 22, `${d.label}　${d.value}（${Math.round((d.value / total) * 100)}%）`, 'font-size="12"')}`).join('');
    return svg(slices + legend);
  }
  const unit = String(p.props.unit || '').trim();
  if (chart === 'hbar') {
    const left = 96;
    const bw = (h - 20) / data.length;
    const bars = data.map((d, i) => {
      const len = Math.max(0, ((w - left - 50) * d.value) / max);
      const y = 10 + i * bw + bw * 0.18;
      return `<rect x="${left}" y="${y.toFixed(1)}" width="${len.toFixed(1)}" height="${Math.max(0, bw * 0.64).toFixed(1)}" fill="#3b82f6"/>${text(left - 6, y + bw * 0.42, d.label, 'text-anchor="end" font-size="12"')}${text(left + len + 5, y + bw * 0.42, String(d.value))}`;
    }).join('');
    return svg(`<line x1="${left}" y1="6" x2="${left}" y2="${h - 6}" stroke="#64748b"/>${bars}`);
  }
  const [L, R, T, B] = [44, 12, unit ? 22 : 12, 24];
  const pw = Math.max(0, w - L - R);
  const ph = Math.max(0, h - T - B);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((k) => {
    const y = T + ph * (1 - k);
    return `<line x1="${L}" y1="${y.toFixed(1)}" x2="${w - R}" y2="${y.toFixed(1)}" stroke="${k ? '#e2e8f0' : '#64748b'}"/>${text(L - 5, y + 4, String(Math.round(max * k * 100) / 100), 'text-anchor="end" font-size="10.5"')}`;
  }).join('');
  const step = pw / data.length;
  const cxs = data.map((d, i) => L + step * (i + 0.5));
  const ys = data.map((d) => T + ph * (1 - d.value / max));
  const labels = data.map((d, i) => text(cxs[i], h - 8, d.label, 'text-anchor="middle"')).join('');
  const marks = chart === 'line'
    ? `<polyline points="${cxs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ')}" fill="none" stroke="#3b82f6" stroke-width="2.5"/>${cxs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4" fill="#fff" stroke="#3b82f6" stroke-width="2"/>`).join('')}`
    : cxs.map((x, i) => `<rect x="${(x - step * 0.32).toFixed(1)}" y="${ys[i].toFixed(1)}" width="${(step * 0.64).toFixed(1)}" height="${Math.max(0, T + ph - ys[i]).toFixed(1)}" fill="#3b82f6"/>`).join('');
  return svg(`${ticks}<line x1="${L}" y1="${T}" x2="${L}" y2="${T + ph}" stroke="#64748b"/>${marks}${labels}${unit ? text(L, 12, `（${unit}）`, 'font-size="10.5"') : ''}`);
}

const ICON_COLORS = { black: ['黒', '#1e293b'], blue: ['青', '#2563eb'], red: ['赤', '#dc2626'], gray: ['灰', '#64748b'] };

// 入力欄の部品の、項目名より下（入力欄・選択肢・添付の枠）
function partFieldHtml(p, t) {
  const pr = p.props;
  const opts = (mark, isOn) => `<div class="popts${pr.dir === 'v' ? ' v' : ''}">${(pr.options || []).map((o) =>
    `<span class="popt"><span class="pmark ${mark}${isOn(o) ? ' on' : ''}"></span>${esc(o)}</span>`).join('')}</div>`;
  if (p.type === 'radio') return opts('rd', (o) => o === pr.initial);
  if (p.type === 'checkbox') return opts('ck', (o) => Array.isArray(pr.initial) && pr.initial.includes(o));
  if (p.type === 'file') return '<div class="pdrop">📎 ファイルをここにドラッグ、または <u>選ぶ</u></div>';
  // ルックアップで一緒に写される項目は、自分では書けないことが分かるように灰色にし、どこから入るかを薄い字で書く
  const copied = p.lookupRole === 'copy';
  const ph = copied && !p.placeholder ? `（${p.lookupKeyName}から自動で入る）` : p.placeholder || t.ph;
  const value = p.sample ? esc(p.sample) : `<span class="pph">${esc(ph)}</span>`;
  const unit = String(pr.unit || '').trim();
  const right = {
    number: unit && esc(unit), calc: unit && esc(unit), date: '📅', datetime: '🕒', dropdown: '▼', user: '選ぶ',
  }[p.type];
  const head = p.type === 'user' ? '<span class="picon">👤</span>' : '';
  const kind = p.type === 'text2' ? ' area' : p.type === 'calc' ? ' calc' : copied ? ' copied' : '';
  const get = p.lookupRole === 'key' ? '<span class="pget">🔍 取得</span>' : '';
  return `<div class="pbox${kind}">${head}<span class="pval">${value}</span>${right ? `<span class="pr">${right}</span>` : ''}${get}</div>`;
}

// 部品の設定の一覧表。editor のときは、行を押すとその部品を選べるようにし、番号の付いた部品がなければ案内を出す。
// 出力（editor でないとき）では、番号の付いた部品がなければ表を出さない
// diff（{ info: designDiff の screens の 1 つ, label: 「第 2 版」 }）を渡すと、番号の前に「新」「変」の札を付け、表の下に「削除した部品」を並べる
function partTableHtml(design, screen, { editor = false, selectedId = null, selected = null, diff = null } = {}) {
  const isSel = (id) => (selected ? selected.has(id) : id === selectedId);
  const rows = tableRows(screen, design, store.state);
  const info = diff && !diff.info.isNew ? diff.info : null;
  if (!rows.length && !editor && !(info && info.deleted.length)) return '';
  const width = screen.tablePos === 'bottom' ? screen.width : TABLE_W;
  const head = '<thead><tr><th class="c-no">番号</th><th class="c-label">項目名</th><th class="c-kind">部品の種類</th><th>設定</th></tr></thead>';
  const mark = (r) => (info && !r.branch ? diffBadgeInline(info.parts[r.id]) : '');
  const body = rows.length
    ? `<table>${head}<tbody>${rows.map((r) => `
        <tr${editor ? ` data-action="select-part" data-id="${esc(r.id)}"` : ''}${isSel(r.id) || r.branch ? ` class="${[isSel(r.id) ? 'sel' : '', r.branch ? 'br' : ''].join(' ').trim()}"` : ''}>
          <td class="c-no">${mark(r)}${r.no}</td><td>${esc(r.label)}</td><td>${esc(r.kind)}</td><td class="c-set">${esc(r.setting)}</td></tr>`).join('')}</tbody></table>`
    : editor ? '<div class="ptable-empty">番号の付いた部品はまだありません。<br>部品を置くと、ここに番号ごとの設定が並びます。<br>（この案内は出力には出ません）</div>' : '';
  return `<div class="ptable" style="width:${width}px"><h3>部品の設定</h3>${body}${info ? diffTableFoot(info, diff.label) : ''}</div>`;
}
// 一覧表の下の「削除した部品」の表と、札の説明
function diffTableFoot(info, label) {
  const marked = Object.keys(info.parts).length + Object.keys(info.callouts).length > 0;
  const del = info.deleted.length
    ? `<div class="df-del"><h4>削除した部品（${esc(label)}にあって、今はない部品。番号は${esc(label)}のもの）</h4><table><thead><tr><th class="c-no">番号</th><th class="c-label">項目名</th><th class="c-kind">部品の種類</th><th>設定</th></tr></thead><tbody>${
      info.deleted.map((x) => `<tr><td class="c-no">${x.no == null ? '－' : x.no}</td><td>${esc(x.title)}</td><td>${esc(x.kind)}</td><td class="c-set">${esc(x.setting)}</td></tr>`).join('')}</tbody></table></div>`
    : '';
  const legend = marked || del ? `<div class="df-legend">${diffBadgeInline('new')}${esc(label)}の後に足した部品　${diffBadgeInline('chg')}${esc(label)}の後に設定・位置・大きさを変えた部品</div>` : '';
  return del + legend;
}

// 縮小画像。画面の上から機器の 1 画面分を、箱（boxW × boxH）に収まるように CSS の scale で縮める
function thumbHtml(design, screen, boxW, boxH) {
  const viewH = Math.min(screen.height, DEVICES[screen.device].height);
  const k = Math.min(boxW / screen.width, boxH / viewH);
  const w = Math.round(screen.width * k);
  const h = Math.round(viewH * k);
  return `<div class="thumb" style="width:${w}px;height:${h}px"><div class="thumb-scale" style="transform:scale(${k.toFixed(4)})">${screenHtml(design, screen)}</div></div>`;
}

// 曲線（p0 → p3。p1・p2 は曲げる点）がほかの箱に重なるときの通り道。重なる箱の手前で、その箱たちの上か下（線の高さに近いほう）の
// 隙間へ曲がり、横にまっすぐ通って、箱を過ぎてから相手の箱へ曲がる。重ならないとき・隙間がないときは null（そのまま引く）
function mapDetour(p0, p1, p2, p3, others) {
  const at = (t) => [0, 1].map((k) => (1 - t) ** 3 * p0[k] + 3 * (1 - t) ** 2 * t * p1[k] + 3 * (1 - t) * t * t * p2[k] + t ** 3 * p3[k]);
  const hits = new Set();
  for (let t = 0.02; t < 1; t += 0.02) {
    const [x, y] = at(t);
    others.forEach((b) => { if (x > b.x - 8 && x < b.x + b.w + 8 && y > b.y - 8 && y < b.y + b.h + 8) hits.add(b); });
  }
  if (!hits.size) return null;
  const list = [...hits];
  const s = Math.sign(p3[0] - p0[0]);
  const [left, right] = [Math.min(...list.map((b) => b.x)) - 28, Math.max(...list.map((b) => b.x + b.w)) + 28];
  const [xa, xb] = s > 0 ? [left, right] : [right, left];
  if ((xa - p0[0]) * s < 16 || (p3[0] - xb) * s < 16) return null;
  const free = (y) => y >= 8 && !others.some((b) => y > b.y - 8 && y < b.y + b.h + 8 && b.x < Math.max(xa, xb) && b.x + b.w > Math.min(xa, xb));
  const mid = (p0[1] + p3[1]) / 2;
  const ys = [Math.min(...list.map((b) => b.y)) - 24, Math.max(...list.map((b) => b.y + b.h)) + 24];
  const yd = ys.sort((m, n) => Math.abs(m - mid) - Math.abs(n - mid)).find(free);
  return yd == null ? null : { xa, xb, yd };
}
// ── ステータスの移り方の図と画面の移り方の図（第 8 段階。画像 q54 の案B・q55 の案A・q58）──
// どちらも、つながりの図と同じ形のモデル { nodes: [{ key, name, ... }], edges: [{ from, to, kind, labels }] } を作り、
// 箱の置き方（mapPlace）と線（mapEdgesSvg）は、つながりの図の関数を使い回す。箱の位置は画面設計の processPos・flowPos に覚える
const PROC_ROW = 150; // ステータスの移り方の図の段の高さ（箱の高さ 64 ＋ 矢印の文字を書く間 86）
const PROC_X = 240; // 箱の左の端（箱の左に、矢印の文字を書く間を空ける）
const VIEW_POS = { map: 'mapPos', process: 'processPos', flow: 'flowPos' };
const VIEW_DRAW = {
  process: { style: (e) => (e.kind === 'back' ? { col: '#ea580c', w: 2, dash: '6 4', mark: 'o' } : { col: '#1d3f6e', w: 2.5, mark: 'n' }), label: (e) => e.labels.slice(0, 2), vertical: true },
  flow: { style: (e) => (e.kind === 'link' ? { col: '#16a34a', w: 2, dash: '3 4', mark: 'g' } : { col: '#1d3f6e', w: 2.5, mark: 'n' }), label: (e) => e.labels.slice(0, 3), flat: true, lanes: true },
  // スイムレーン図（第 9 段階）: 流れは紺の実線、戻る流れ（差し戻しなど。列が左へ戻る矢印）は橙の点線
  // 2 本並んだ線（行きと差し戻し）の文字は、線の向きに直角に離す（normalOutside。T9 の見直し）
  swimlane: { style: (e) => (e.kind === 'back' ? { col: '#ea580c', w: 2, dash: '6 4', mark: 'o' } : { col: '#1d3f6e', w: 2.5, mark: 'n' }), label: (e) => e.labels, flat: true, normalOutside: true },
};
// ステータスの移り方の図。箱＝ステータス（並びの順。order）、矢印＝操作（前と次の両方があるものだけ。並びで前へ戻る操作は kind 'back'）。
// 矢印の文字は「操作の名前（操作する人）」と、2 行目に条件。outs は、そのステータスから出ていく操作の数
function processModel(d) {
  const it = (d.items || []).find((x) => x.type === 'status');
  if (!it) return { nodes: [], edges: [], item: null };
  const states = it.props.states;
  const at = (id) => states.findIndex((s) => s.id === id);
  const drawn = it.props.actions.filter((a) => at(a.from) >= 0 && at(a.to) >= 0 && a.from !== a.to);
  return {
    item: it,
    nodes: states.map((s, i) => ({ key: 't:' + s.id, name: s.name, order: i, outs: drawn.filter((a) => a.from === s.id).length })),
    edges: drawn.map((a) => ({
      from: 't:' + a.from, to: 't:' + a.to, kind: at(a.to) < at(a.from) ? 'back' : 'next', action: a.id,
      labels: [a.name + (a.role ? `（${a.role}）` : ''), ...(a.cond ? [a.cond] : [])],
    })),
  };
}
// ステータスの移り方の図の自動の位置。ステータスの並びの順に上から下へ（q54 の案B。右の欄のステータスの並びと同じ向き）
function processLayout(model) {
  return Object.fromEntries(model.nodes.map((n) => [n.key, { x: PROC_X, y: 40 + n.order * PROC_ROW }]));
}
// 上下に並ぶ箱の間の線（ステータスの移り方の図）。間にほかの箱がなければ null（ふつうの線）。あれば、両方の箱の右の縁から出て、
// 間の箱の右を回る（lane 本目は 28 ずつ外を回る。隣でないステータスへの操作）。minX は回る線のいちばん内側の x の下限（まっすぐな線の文字の右）
function procBracket(a, b, others, lane, minX = 0) {
  const [top, bottom] = a.y < b.y ? [a.y + a.h, b.y] : [b.y + b.h, a.y];
  const hits = others.filter((o) => o.y < bottom && o.y + o.h > top && o.x < Math.max(a.x + a.w, b.x + b.w) && o.x + o.w > Math.min(a.x, b.x));
  if (!hits.length) return null;
  const f = (n) => n.toFixed(1);
  const xd = Math.max(Math.max(a.x + a.w, b.x + b.w, ...hits.map((o) => o.x + o.w)) + 28, minX) + lane * 28;
  const dy = 20 + (lane % 3) * 10;
  const [x1, y1, x2, y2] = [a.x + a.w, a.y + dy, b.x + b.w, b.y + dy];
  const s = Math.sign(y2 - y1);
  return { detour: true, mx: xd, my: (y1 + y2) / 2,
    d: `M${f(x1)},${f(y1)} L${f(xd - 12)},${f(y1)} Q${f(xd)},${f(y1)} ${f(xd)},${f(y1 + s * 12)} L${f(xd)},${f(y2 - s * 12)} Q${f(xd)},${f(y2)} ${f(xd - 12)},${f(y2)} L${f(x2)},${f(y2)}` };
}
// 移る先の画面設計（画面の移り方の図の、ほかの画面設計の箱）。ごみ箱の画面設計は描かない。単体で開いた HTML では screenPeers から引く
function flowOwner(state, designId) {
  const x = findDesign(state, designId);
  if (x) return x.trashedAt ? null : x;
  return (standalone && standalone.screenPeers.find((p) => p.id === designId && !p.trashed)) || null;
}
// ほかの画面設計から、この画面設計の画面へ移ってくるボタン・リンクの文字（q58: 来る元も描く）。[{ owner, from（相手の画面）, to, type, label }]
function flowIncoming(state, d) {
  const out = [];
  state.designs.filter((x) => x.id !== d.id && !x.trashedAt).forEach((x) => x.screens.forEach((s) => s.parts.forEach((p) => {
    const t = moveTargetOf(p, x.id);
    if (t && t.designId === d.id) out.push({ owner: x, from: s, to: t.screenId, type: p.type, label: partTitle(p) });
  })));
  if (standalone) {
    standalone.screenPeers.filter((peer) => !findDesign(state, peer.id)).forEach((peer) => peer.refs.forEach((r) => {
      const from = peer.screens.find((s) => s.id === r.from);
      if (from) out.push({ owner: peer, from, to: r.to, type: r.type, label: r.label });
    }));
  }
  return out;
}
// 画面の移り方の図。箱＝この画面設計の画面（並びの順。order）と、行き先・来る元のほかの画面設計の画面（ext に画面設計の名前）。
// 矢印＝ボタン（kind 'button'）とリンクの文字（'link'）。同じ 2 つの画面の間の同じ種類の矢印は 1 本にまとめ、文字は部品の名前を並べる。
// 自分の画面への矢印と、見つからない画面への矢印は描かない。order は列を決める順（画面の並びで前へ進む矢印 0・ほかの画面設計 1・戻る矢印 2）
function flowModel(state, d) {
  const index = new Map(d.screens.map((s, i) => [s.id, i]));
  const nodes = new Map(d.screens.map((s, i) => ['s:' + s.id, { key: 's:' + s.id, name: s.name, order: i, screen: s }]));
  const extKey = (owner, s) => {
    const k = `x:${owner.id}/${s.id}`;
    if (!nodes.has(k)) nodes.set(k, { key: k, name: s.name, ext: owner.name, designId: owner.id });
    return k;
  };
  const edges = new Map();
  const add = (from, to, kind, label, order) => {
    if (from === to) return;
    const k = `${from}|${to}|${kind}`;
    if (!edges.has(k)) edges.set(k, { from, to, kind, labels: [], order });
    if (label && !edges.get(k).labels.includes(label)) edges.get(k).labels.push(label);
  };
  d.screens.forEach((s) => s.parts.forEach((p) => {
    const t = moveTargetOf(p, d.id);
    if (!t) return;
    if (t.designId === d.id) {
      if (index.has(t.screenId)) add('s:' + s.id, 's:' + t.screenId, p.type, partTitle(p), index.get(t.screenId) > index.get(s.id) ? 0 : 2);
      return;
    }
    const owner = flowOwner(state, t.designId);
    const ts = owner ? owner.screens.find((x) => x.id === t.screenId) : null;
    if (ts) add('s:' + s.id, extKey(owner, ts), p.type, partTitle(p), 1);
  }));
  flowIncoming(state, d).forEach((r) => { if (index.has(r.to)) add(extKey(r.owner, r.from), 's:' + r.to, r.type, r.label, 1); });
  return { nodes: [...nodes.values()], edges: [...edges.values()] };
}
// ステータスの移り方の図・画面の移り方の図の HTML（編集の画面・出力・AI の画像で使う）。saved は覚えた箱の位置。
// o: idPrefix（矢印の印の id の頭。出力では編集の画面と重ならない頭にする）・bare（id="map-inner" を付けない）
function viewHtml(view, state, d, saved = {}, o = {}) {
  const model = view === 'process' ? processModel(d) : flowModel(state, d);
  if (!model.nodes.length) return `<p class="map-empty">${view === 'process' ? 'ステータスの項目がまだありません（部品の箱から「ステータスの印」か「進み具合の矢印」を置くと作られます）。' : '画面がありません。'}</p>`;
  const hOf = () => MAP_H;
  const pos = mapPlace(model, saved || {}, view === 'process' ? processLayout(model) : mapLayout(model, hOf), hOf);
  const nodes = model.nodes.map((n) => {
    const p = pos[n.key];
    const dev = n.screen && DEVICES[n.screen.device] ? DEVICES[n.screen.device].label : '';
    const body = view === 'process' ? `<b>${n.order + 1}　${esc(n.name)}</b><div class="mt"><span>出ていく操作 ${n.outs} つ</span></div>`
      : n.ext ? `<b>${esc(n.name)}</b><div class="mt"><span>「${esc(n.ext)}」の画面</span></div>`
        : `<b>${esc(n.name)}</b><div class="mt"><span class="dev">${esc(dev)}</span><span>部品 ${n.screen.parts.length} 個</span></div>`;
    const title = view === 'process' ? 'ドラッグで動かせます'
      : !n.ext ? 'ドラッグで動かせます。押すと、この画面を開きます'
        : findDesign(state, n.designId) ? `ドラッグで動かせます。押すと「${esc(n.ext)}」を開きます` : 'ドラッグで動かせます（この HTML に入っていない画面設計なので、開けません）';
    return `<div class="mnode${n.ext ? ' ext' : ''}" data-node="${esc(n.key)}" style="left:${p.x}px;top:${p.y}px;width:${MAP_W}px;height:${p.h}px" title="${title}">${body}</div>`;
  }).join('');
  // ステータスの移り方の図は、箱の右に矢印の文字と、箱の右を回る線の分の幅を取る
  const extra = view === 'process' ? 260 + model.edges.length * 28 : 40;
  const w = Math.max(view === 'process' ? 600 : 860, ...Object.values(pos).map((p) => p.x + MAP_W + extra));
  const h = Math.max(view === 'process' ? 300 : 420, ...Object.values(pos).map((p) => p.y + p.h + 60));
  const svg = mapEdgesSvg(model, pos, w, h, { ...VIEW_DRAW[view], idPrefix: o.idPrefix || (view === 'process' ? 'proc' : 'flow') });
  return `<div class="map-inner"${o.bare ? '' : ' id="map-inner"'} style="width:${w}px;height:${h}px" data-view="${view}" data-focus="${esc(d.id)}">${svg}${nodes}</div>`;
}
function mapLegendHtml() {
  return `<div class="map-head"><span><i></i>ルックアップ・関連レコード一覧（値が流れる向き）</span><span><i class="d"></i>項目の取り込み</span><span><i class="x"></i>一覧にないデータベース</span>
    <span class="spacer"></span><button class="btn small" data-action="map-reset" title="ドラッグで動かした箱を、自動で並べた位置に戻します">自動で並べ直す</button></div>`;
}

// ── スイムレーン図（第 9 段階。AI設計基盤_設計書.md の 5-4。画像 q62・q63）──
// 役割（申請者・上長など）ごとの横の帯（レーン）に、作業の箱を左から列で並べ、矢印でつないだ業務の流れの図。帯の並びは役割の並び。
// 作業の位置は、作業が持つ役割（帯）と列だけで決まる（ドラッグで動かした位置は覚えない。帯と列に吸い付く）。
// 箱の大きさは、ほかの図と同じ 200 × 64（mapEdgesSvg が箱の大きさを決め打ちしているため）。帯は SVG の rect で描く（diagramCrop が拾うように）
const SWIM_LABEL_W = 136; // 左の、役割の名前の列の幅
const SWIM_COL = 280; // 列の幅（箱 200 ＋ 矢印の間 80。第 9 段階の T6b で 240 から広げた。間が 40 だと、隣の列の行きと帰りの矢印〔差し戻しなど〕が重なって読めない）
const SWIM_X0 = SWIM_LABEL_W + 24; // 列 0 の箱の左の端
const SWIM_PAD = 24; // 帯の上と下の余白
const SWIM_GAP = 16; // 同じ帯の同じ列に積んだ箱の間
// 作業の指す先の名前 { design, screen, state }（指していないものは null）。画面とステータスは、指す画面設計の中から引く
// （id は画面設計の中だけで重ならないので、画面設計と組で引く）。画面設計を指していなければ、画面とステータスも引かない
function swimRefNames(state, ref) {
  const out = { design: null, screen: null, state: null };
  if (!ref || !ref.designId) return out;
  const d = findDesign(state, ref.designId);
  out.design = d ? d.name : '（ない画面設計）';
  if (ref.screenId) {
    const s = d && d.screens.find((x) => x.id === ref.screenId);
    out.screen = s ? s.name : '（ない画面）';
  }
  if (ref.stateId) {
    const it = d && d.items.find((x) => x.type === 'status');
    const st = it && it.props.states.find((x) => x.id === ref.stateId);
    out.state = st ? st.name : '（ないステータス）';
  }
  return out;
}
// スイムレーン図のモデル。箱 { key: 'w:作業の id', step, laneIndex（帯の番号）, col, ref（指す先の名前）}。役割が見つからない作業は描かない。
// 矢印 { from, to, kind, labels, edge } は両端の箱があるものだけ。先の作業の列が元の作業の列より小さい矢印は kind 'back'（差し戻しなど）
function swimlaneModel(state, sys) {
  const laneOf = new Map(sys.roles.map((r, i) => [r.id, i]));
  const steps = sys.swimlane.steps.filter((w) => laneOf.has(w.roleId));
  const colOf = new Map(steps.map((w) => [w.id, w.col]));
  return {
    nodes: steps.map((w) => ({ key: 'w:' + w.id, step: w, laneIndex: laneOf.get(w.roleId), col: w.col, ref: swimRefNames(state, w.ref) })),
    edges: sys.swimlane.edges.filter((e) => colOf.has(e.from) && colOf.has(e.to) && e.from !== e.to).map((e) => ({
      from: 'w:' + e.from, to: 'w:' + e.to, kind: colOf.get(e.to) < colOf.get(e.from) ? 'back' : 'next', labels: e.label ? [e.label] : [], edge: e,
    })),
  };
}
// スイムレーン図の位置。帯は役割の順に上から。同じ帯の同じ列に作業が 2 つ以上あれば、作業の並びの順に縦に積む（段の間 80）。
// 帯の高さ＝上下の余白 24 ＋ 段の数 × 64 ＋ 段の間 16（作業のない帯も 1 段分）。戻り値 { pos, lanes: [{ role, y, h }], w, h }。数はどれも 8 の倍数
function swimlaneLayout(model, sys) {
  const rows = sys.roles.map(() => 1);
  const used = new Map(); // '帯|列' → その枠に積んだ箱の数
  const rowOf = new Map();
  model.nodes.forEach((n) => {
    const k = n.laneIndex + '|' + n.col;
    const r = used.get(k) || 0;
    used.set(k, r + 1);
    rowOf.set(n.key, r);
    rows[n.laneIndex] = Math.max(rows[n.laneIndex], r + 1);
  });
  let y = 0;
  const lanes = sys.roles.map((role, i) => {
    const lane = { role, y, h: SWIM_PAD * 2 + rows[i] * MAP_H + (rows[i] - 1) * SWIM_GAP };
    y += lane.h;
    return lane;
  });
  const pos = Object.fromEntries(model.nodes.map((n) => [n.key, {
    x: SWIM_X0 + n.col * SWIM_COL, y: lanes[n.laneIndex].y + SWIM_PAD + rowOf.get(n.key) * (MAP_H + SWIM_GAP), h: MAP_H,
  }]));
  const w = Math.max(600, ...Object.values(pos).map((p) => p.x + MAP_W + 40));
  return { pos, lanes, w, h: y };
}
// 作業の箱の札の文字（指す先が画面ならその画面、なければステータス、画面設計だけならその画面設計）と、マウスを乗せたときの文
function swimRefTag(ref) {
  if (ref.screen) return '画面: ' + ref.screen;
  if (ref.state) return 'ステータス: ' + ref.state;
  return ref.design ? '画面設計: ' + ref.design : '';
}
function swimStepTitle(n) {
  const w = n.step;
  return [`${SWIM_KIND_NAMES[w.kind]}: ${w.text || '（文字なし）'}`,
    n.ref.design && '画面設計: ' + n.ref.design, n.ref.screen && '画面: ' + n.ref.screen, n.ref.state && 'ステータス: ' + n.ref.state,
    w.memo && 'メモ: ' + w.memo].filter(Boolean).join('\n');
}
// スイムレーン図の HTML（システムの画面・AI の画像で使う）。o: idPrefix（矢印の印の id の頭）・bare（id="map-inner" を付けない）・
// zoom（システムの画面の倍率。図を transform で縮め、縮めた大きさの枠 .swim-zoom で包む〔スクロールの範囲を縮めた大きさにするため〕）・
// edit（システムの画面で、矢印を押す所・選んだ矢印の印を描く。swimEdgeTools。第 9 段階の T6b）。役割がないときは案内の文、作業がないときは帯だけ
function swimlaneHtml(state, sys, o = {}) {
  if (!sys.roles.length) return '<p class="map-empty">役割がまだありません。役割（申請者・上長など）を足すと、役割ごとの横の帯ができ、作業の箱を並べられます。</p>';
  const model = swimlaneModel(state, sys);
  const { pos, lanes, w, h } = swimlaneLayout(model, sys);
  // 帯（白と薄い灰を交互に）と、左の名前の列。rect の属性は x・y・width・height の順（diagramCrop が拾う形）
  const bands = lanes.map((l, i) => `<rect x="0" y="${l.y}" width="${w}" height="${l.h}" fill="${i % 2 ? '#f8fafc' : '#fff'}" stroke="#cbd5e1"/>`
    + `<rect x="0" y="${l.y}" width="${SWIM_LABEL_W}" height="${l.h}" fill="#e8eef6" stroke="#cbd5e1"/>`).join('');
  const labs = lanes.map((l) => `<div class="swim-lab" style="top:${l.y}px;width:${SWIM_LABEL_W}px;height:${l.h}px"${l.role.memo ? ` title="${esc(l.role.memo)}"` : ''}>${esc(l.role.name)}</div>`).join('');
  const nodes = model.nodes.map((n) => {
    const p = pos[n.key];
    const tag = swimRefTag(n.ref);
    return `<div class="mnode sw k-${n.step.kind}" data-node="${esc(n.key)}" title="${esc(swimStepTitle(n))}" style="left:${p.x}px;top:${p.y}px;width:${MAP_W}px;height:${MAP_H}px">`
      + `<b>${esc(n.step.text || SWIM_KIND_NAMES[n.step.kind])}</b>${tag ? `<span class="ref">${esc(tag)}</span>` : ''}</div>`;
  }).join('');
  const ends = []; // 選んだ矢印の両端の ○（箱より上に描く）
  const tools = o.edit ? {
    lineAttr: (e) => ` class="sw-line" data-edge="${esc(e.edge.id)}"`,
    extra: (e, g, lab) => { ends.push(swimEdgeEnds(e, g)); return swimEdgeTools(e, g, lab); },
  } : {};
  // 選んだ矢印の青い印（CSS の marker-end で付け替える）。選んだ線は太い（3.5）ので、印の大きさをふだんの線（2.5）の印と同じに縮める
  const selMark = mapMarker('swim-arrow-s', '#2563eb').replace('markerWidth="8" markerHeight="8"', 'markerWidth="5.7" markerHeight="5.7"');
  const under = (o.edit ? `<defs>${selMark}</defs>` : '') + bands;
  const svg = mapEdgesSvg(model, pos, w, h, { ...VIEW_DRAW.swimlane, idPrefix: o.idPrefix || 'swim', under, ...tools });
  const over = o.edit ? `<svg class="swim-over" width="${w}" height="${h}">${ends.join('')}</svg>` : '';
  const z = o.zoom || null;
  const inner = `<div class="map-inner swim-inner"${o.bare ? '' : ' id="map-inner"'} data-view="swimlane" data-focus="${esc(sys.id)}" style="width:${w}px;height:${h}px${z ? `;transform:scale(${z});transform-origin:0 0` : ''}">${svg}${labs}${nodes}${over}</div>`;
  return z ? `<div class="swim-zoom" style="width:${Math.round(w * z)}px;height:${Math.round(h * z)}px">${inner}</div>` : inner;
}
// システムの画面のスイムレーン図の、矢印 1 本の押す所（第 9 段階の T6b。画像 q63。mapEdgesSvg の extra）。.sw-edge の中に、
// 線に沿った太い透明の線と文字の下地（.sw-hit。押す・ダブルクリック・右クリック）と、文字のない線の真ん中の小さな ○（.sw-mid。乗ったときと選んだ間だけ出す）。
// data-mx・data-my は文字の欄を出す所（文字の下地の真ん中か、線の真ん中）。線と同じく、箱の下に描く
const swimNum = (n) => n.toFixed(1);
function swimEdgeTools(e, g, lab) {
  const f = swimNum;
  const [mx, my] = lab ? [lab.x + lab.w / 2, lab.y + lab.h / 2] : [g.mx, g.my];
  return `<g class="sw-edge" data-edge="${esc(e.edge.id)}" data-mx="${f(mx)}" data-my="${f(my)}"><path class="sw-hit" d="${g.d}"/>`
    + (lab ? `<rect class="sw-hit" x="${f(lab.x)}" y="${f(lab.y)}" width="${lab.w}" height="${lab.h}"/>` : `<circle class="sw-mid" cx="${f(g.mx)}" cy="${f(g.my)}" r="4"/>`)
    + '</g>';
}
// 矢印 1 本の両端のオレンジの ○（.sw-ends の中の .sw-end。選んだ間だけ出す。付け替えのドラッグ）。端は箱の縁にあって半分が箱に重なるので、
// 箱より後の SVG（.swim-over）に描く（箱の下だと、箱が押す所を隠す）。端の位置は線の d の最初と最後の数
function swimEdgeEnds(e, g) {
  const f = swimNum;
  const nums = g.d.match(/-?\d+(\.\d+)?/g).map(Number);
  const [x1, y1, x2, y2] = [nums[0], nums[1], nums[nums.length - 2], nums[nums.length - 1]];
  return `<g class="sw-ends" data-edge="${esc(e.edge.id)}"><circle class="sw-end" data-end="from" cx="${f(x1)}" cy="${f(y1)}" r="5"/>`
    + `<circle class="sw-end" data-end="to" cx="${f(x2)}" cy="${f(y2)}" r="5"/></g>`;
}
// ── スイムレーン図の上の位置の計算（第 9 段階の T6b。純関数）。位置はどれも図の中の位置（倍率をかける前）──
const SWIM_NEAR = 25; // ○＋ を出す、箱の縁からの近さ（BDM の QC_NEAR と同じ）
const SWIM_PLUS_GAP = 12; // ○＋ の真ん中の、箱の縁からの距離（BDM と同じ）
// 点の帯と列 { laneIndex, roleId, col }。帯の上と下の外の点は、いちばん近い帯。列は 0 から（名前の列の上の点は列 0）。
// 箱の間（矢印を通す間）は、真ん中で左右の列に分ける。図の右の外の点は、その先の列。帯がないときは null
function swimCellAt(layout, x, y) {
  const { lanes } = layout;
  if (!lanes.length) return null;
  const found = lanes.findIndex((l) => y < l.y + l.h);
  const i = found < 0 ? lanes.length - 1 : found;
  const col = Math.max(0, Math.floor((x - SWIM_X0 + (SWIM_COL - MAP_W) / 2) / SWIM_COL));
  return { laneIndex: i, roleId: lanes[i].role.id, col };
}
// 箱 b（左上の位置）のどの縁が、点に向いているか（'top'・'right'・'bottom'・'left'。箱の大きさで割った向きで決める。BDM の qcHoverMove と同じ）
function swimSideToward(b, x, y) {
  const ux = (x - (b.x + MAP_W / 2)) / (MAP_W / 2);
  const uy = (y - (b.y + MAP_H / 2)) / (MAP_H / 2);
  if (Math.abs(ux) >= Math.abs(uy)) return ux >= 0 ? 'right' : 'left';
  return uy >= 0 ? 'bottom' : 'top';
}
// 箱 b の縁 side の真ん中から、外へ out だけ離れた点 { x, y }
function swimSidePoint(b, side, out = 0) {
  const [cx, cy] = [b.x + MAP_W / 2, b.y + MAP_H / 2];
  if (side === 'top') return { x: cx, y: b.y - out };
  if (side === 'bottom') return { x: cx, y: b.y + MAP_H + out };
  return side === 'left' ? { x: b.x - out, y: cy } : { x: b.x + MAP_W + out, y: cy };
}
// ○＋ を出す所 { key（'w:作業の id'）, side, x, y（○＋ の真ん中）}。点にいちばん近い箱（箱の中なら近さ 0、外なら縁からの距離。
// SWIM_NEAR より遠い箱は数えない。同じ近さなら後に描いた箱）の、点に向いた縁の 12 外。近い箱がなければ null
function swimPlusAt(pos, x, y) {
  let best = null;
  let bestD = Infinity;
  Object.entries(pos).forEach(([key, b]) => {
    const ox = Math.max(b.x - x, x - (b.x + MAP_W), 0);
    const oy = Math.max(b.y - y, y - (b.y + MAP_H), 0);
    if (ox > SWIM_NEAR || oy > SWIM_NEAR) return;
    const d = Math.max(ox, oy);
    if (d > bestD) return;
    best = { key, b };
    bestD = d;
  });
  if (!best) return null;
  const side = swimSideToward(best.b, x, y);
  return { key: best.key, side, ...swimSidePoint(best.b, side, SWIM_PLUS_GAP) };
}
// 「全体を表示」の倍率。図の幅 w を、見えている欄の幅 avail に合わせる（はみ出さないように 100 分の 1 で切り捨て。BDM の fitView と同じく
// 100% より大きくしない。いちばん小さい倍率は ZOOM_STEPS の最初）。欄の幅が分からない（0。隠れているとき）ときは 1
function swimFitZoom(w, avail) {
  if (!(avail > 0) || !(w > 0)) return 1;
  return Math.max(ZOOM_STEPS[0], Math.min(1, Math.floor((avail * 100) / w) / 100));
}
// 列を書かなかった作業（col が null か undefined）に、矢印の順から列を付けた写しを返す（AI がスイムレーン図を組み立てるときに使う）。
// 列はつながりの図と同じく、矢印の元から何段目か（mapForwardEdges で輪を閉じる矢印〔差し戻しなど〕を外し、mapRanks で決める）。
// 列を書いた作業はそのまま動かさず、列のない作業は、前の作業（矢印の元）のいちばん右の列の次にする。前の作業がなく、列を書いた
// 次の作業があれば、そのすぐ左の列。矢印のない作業は、作業の並びの順に、列のある作業のいちばん右の次の列（作業を足す addStep と同じ）
// 輪を閉じる矢印として外すのは、作業の並び（steps の順）で前へ戻る矢印（差し戻しなど）にする（前へ進む矢印を order 0 で先に足し、戻る矢印を
// order 1 で後に足す。T9 の見直し。矢印の並びの順で足していたので、差し戻しが先に並ぶと、差し戻しが流れになり、進む矢印が戻る流れになっていた）
function swimAutoCols(steps, edges) {
  const out = steps.map((w) => ({ ...w }));
  const byId = new Map(out.map((w) => [w.id, w]));
  const at = new Map(out.map((w, i) => [w.id, i]));
  const model = {
    nodes: out.map((w) => ({ key: w.id })),
    edges: edges.filter((e) => isObj(e) && byId.has(e.from) && byId.has(e.to) && e.from !== e.to)
      .map((e) => ({ from: e.from, to: e.to, order: at.get(e.to) > at.get(e.from) ? 0 : 1 })),
  };
  const forward = mapForwardEdges(model);
  const rank = mapRanks(model, forward);
  const open = (w) => w.col == null;
  const colOf = (w) => Number(w.col) || 0;
  const linked = new Set(forward.flatMap((e) => [e.from, e.to]));
  // 矢印の元を先に決める（mapRanks の段は、矢印の先ほど大きい）
  out.filter((w) => linked.has(w.id) && open(w)).sort((a, b) => rank.get(a.id) - rank.get(b.id)).forEach((w) => {
    const prev = forward.filter((e) => e.to === w.id).map((e) => byId.get(e.from));
    const fixedNext = forward.filter((e) => e.from === w.id).map((e) => byId.get(e.to)).filter((x) => !open(x));
    w.col = prev.length ? Math.max(...prev.map(colOf)) + 1 : fixedNext.length ? Math.max(0, Math.min(...fixedNext.map(colOf)) - 1) : rank.get(w.id);
  });
  out.filter((w) => !linked.has(w.id) && open(w)).forEach((w) => {
    w.col = Math.max(-1, ...out.filter((x) => !open(x)).map(colOf)) + 1;
  });
  return out;
}

// ── 最初の画面のシステムのまとまり（第 9 段階の T5。画像 q61 の案B・q45〜q47。AI設計基盤_設計書.md の 5-6）──

function homeGroups(state, query = '') {
  const q = cleanName(query).toLowerCase();
  const hit = (name) => !q || name.toLowerCase().includes(q);
  const groups = state.systems.filter((y) => !y.trashedAt).map((y) => {
    const all = designsOfSystem(state, y);
    return { id: y.id, system: y, name: y.name, designs: hit(y.name) ? all : all.filter((d) => hit(d.name)) };
  });
  groups.push({ id: LONE_GROUP, system: null, name: 'システムに入っていない', designs: loneDesigns(state).filter((d) => hit(d.name)).sort(byNewest('updatedAt')) });
  return q ? groups.filter((g) => (g.system && hit(g.name)) || g.designs.length) : groups;
}

function renderCard(d, { sys = null } = {}) {

          <h2 class="card-name">${esc(d.name)}</h2>
          <div class="card-meta">${targetChip(d.target)}<span>画面 ${d.screens.length} つ・${revisionLabel(d)}</span></div>
          ${shared ? `<span class="share-tag" data-action="share-tag" data-id="${esc(d.id)}" title="${esc(users.map((y) => y.name).join('・'))}で使っています">${users.length} つのシステムで使っている</span>` : ''}
          <div class="card-date">更新 ${fmtDateTime(d.updatedAt)}</div>
        </div>
      </button>
      <button class="card-more" data-action="card-menu" data-id="${esc(d.id)}" aria-label="「${esc(d.name)}」の操作" title="${sys ? '名前の変更・複製・出力・このシステムから外す・削除' : '名前の変更・複製・出力・削除'}">…</button>
      ${ui.menuFor === d.id ? cardMenuHtml(d, sys) : ''}
    </article>`;
}

function cardMenuHtml(d, sys = null) {
  const id = esc(d.id);
  const inSys = sys ? ` data-sys="${esc(sys.id)}"` : '';
  return `
    <div class="card-menu" role="menu">
      <button role="menuitem" data-action="rename" data-id="${id}">名前の変更</button>
      <button role="menuitem" data-action="duplicate" data-id="${id}"${inSys}>複製</button>
      <button role="menuitem" data-action="export-design" data-id="${id}">出力…</button>
      ${sys ? `<button role="menuitem" data-action="remove-from-system" data-id="${id}"${inSys}>このシステムから外す</button>` : ''}
      <button role="menuitem" class="danger" data-action="trash" data-id="${id}">削除（ごみ箱へ移す）</button>
    </div>`;
}

// ごみ箱。システム（第 9 段階）もあるときは、「システム」と「画面設計」の小見出しで分ける。数はシステムと画面設計の合計
function renderTrash() {
  const S = store.state;
  const systems = trashedSystems(S);
  const list = trashedDesigns(S);
  const head = `<button class="trash-toggle" data-action="toggle-trash" aria-expanded="${ui.trashOpen}">${ui.trashOpen ? '▾' : '▸'} ごみ箱（${systems.length + list.length}）</button>`;
  if (!ui.trashOpen) return head;
  const sysRows = systems.map((y) => `
    <div class="trash-row sys" data-id="${esc(y.id)}">
      <span class="trash-name">${esc(y.name)}</span><span class="trash-meta">画面設計 ${designsOfSystem(S, y).length} つ</span>
      <span class="trash-date">ごみ箱へ移した日時 ${fmtDateTime(y.trashedAt)}</span>
      <button class="btn small" data-action="restore-system" data-id="${esc(y.id)}">戻す</button>
      <button class="btn small danger-text" data-action="delete-system-forever" data-id="${esc(y.id)}">完全に削除</button>
    </div>`).join('');
  const rows = list.map((d) => `
    <div class="trash-row" data-id="${esc(d.id)}">
      <span class="trash-name">${esc(d.name)}</span>${targetChip(d.target)}
      <span class="trash-date">ごみ箱へ移した日時 ${fmtDateTime(d.trashedAt)}</span>
      <button class="btn small" data-action="restore" data-id="${esc(d.id)}">戻す</button>
      <button class="btn small danger-text" data-action="delete-forever" data-id="${esc(d.id)}">完全に削除</button>
    </div>`).join('');
  const body = systems.length
    ? `<h3 class="trash-sub">システム</h3>${sysRows}<h3 class="trash-sub">画面設計</h3>${rows || '<p class="trash-empty">ごみ箱に画面設計はありません。</p>'}`
    : rows || '<p class="trash-empty">ごみ箱は空です。</p>';
  return head + `
    <div class="trash-list">
      ${body}
      <p class="trash-note">「戻す」を押すと一覧に戻ります。「完全に削除」を押すと、元に戻せません。</p>
    </div>`;
}

// 左の一覧と右のまとまりを描き直す（名前で探す欄・ごみ箱はそのまま）
function refreshCards() {
  const el = $('#home-cards');

}

// 新しい画面設計の窓。システム（第 9 段階）があるときは「入れるシステム」を選ぶ欄を出す（最初の値は systemId。null なら「（入れない）」）
function openNewDesignDialog({ systemId = null } = {}) {
  const systems = store.state.systems.filter((y) => !y.trashedAt);
  const opt = (v, label) => `<option value="${esc(v)}"${v === (systemId || '') ? ' selected' : ''}>${esc(label)}</option>`;
  const sysField = systems.length
    ? `<label class="field"><span>入れるシステム</span><select name="system">${opt('', '（入れない）')}${systems.map((y) => opt(y.id, y.name)).join('')}</select></label>` : '';
  return showDialog({
    title: '新しい画面設計',
    okLabel: '作成して開く',
    body: `
      <label class="field"><span>名前（業務アプリの名前）</span><input type="text" name="name" maxlength="${NAME_MAX}" placeholder="例: 顧客管理アプリ"></label>
      <div class="field"><span>作る先</span>${targetPickerHtml(store.state, 'kintone')}</div>
      ${sysField}
      <p class="hint">白紙の画面を 1 つ入れて開きます。説明は、開いたあとに右の欄で書けます。</p>`,
    init: (m) => {
      bindTargetPicker(m);
      $('[name=name]', m).focus();
    },
    collect: (m) => {
      const name = cleanName($('[name=name]', m).value);
      if (!name) return { error: '名前を書いてください。' };
      const target = readTargetPicker(m);
      if (!target) return { error: '「その他」を選んだときは、作る先の名前を書いてください。' };
      const sel = $('[name=system]', m);
      return { name, target, systemId: sel && sel.value ? sel.value : null };
    },
  });
}
// 「＋ 新しい画面設計」（見出し・アプリのメニュー）と、システムのまとまりのメニューの「新しい画面設計を作る」（systemId）。作ったら編集の画面を開く
async function newDesignWithDialog(systemId) {
  const first = systemId !== undefined ? systemId : (homeSystem() || {}).id || null;
  const r = await openNewDesignDialog({ systemId: first });
  if (!r) return;
  const id = actions.createDesign(r.name, r.target, { systemId: r.systemId });

}

// システムの名前と説明の窓（「＋ 新しいシステム」と「名前と説明を変える」）。戻り値 { name, description } か null。
// 名前は前後の空白を削り、説明は削らない（actions・AI の道具と同じ。何も変えずに「変える」を押したときに、中身が変わらないように）

      <label class="field"><span>説明</span><textarea name="description" rows="4" placeholder="例: 出張の事前申請と、上長の承認、旅費の精算までをまとめるシステム">${esc(description)}</textarea></label>

// 「＋ 新しいシステム」。同じ名前のシステムがあっても作れる（画面設計と同じ）。作ったら、最初の画面の左の一覧でそのシステムを選ぶ
// （探している文字とつながりの図は外す。作ったシステムが見えるように）
async function newSystemWithDialog() {
  const r = await openSystemDialog({ title: '新しいシステム', okLabel: '作る', hint: 'システムは、いくつかの画面設計をまとめる入れ物です。説明は後からでも書けます。' });

// 「今ある画面設計を入れる」「今ある画面設計を複製して入れる」の窓（画像 q47。手本は「画面を足す」の窓と、ほかのモックから項目を取り込む窓）。
// mode は 'same'（同じ画面設計のまま入れる）か 'copy'（複製して入れる）。いくつでも選べる（札の右上に ✓）。ごみ箱の画面設計は出さない。
// 'same' では、このシステムにもう入っている画面設計を薄くして選べなくする。戻り値は選んだ画面設計の id の並び（札の並びの順。キャンセルは null）
function openPickDesignsDialog(y, mode) {
  const S = store.state;
  const same = mode === 'same';
  const list = visibleDesigns(S);
  const cards = list.map((d) => {
    const users = systemsOf(S, d.id);
    const off = same && y.designIds.includes(d.id);
    return `<button type="button" class="pick-card${off ? ' off' : ''}" data-pick="${esc(d.id)}" data-sys="${esc(users.map((x) => x.id).join(' '))}" aria-pressed="false"${off ? ' disabled' : ''}>
      <div class="th">${thumbHtml(d, d.screens[0], 236, 92)}${off ? '<span class="pick-in">このシステムに入っている</span>' : ''}<span class="pick-ck" aria-hidden="true">✓</span></div>
      <div class="bd"><b>${esc(d.name)}</b>${targetChip(d.target)}</div>
      <small class="where">${esc(users.map((x) => x.name).join('・') || 'システムに入っていない')}・画面 ${d.screens.length}・項目 ${d.items.length}</small>
      <small class="date">更新 ${esc(fmtDateTime(d.updatedAt).slice(0, 10))}</small>
    </button>`;
  }).join('');
  const opt = (v, label) => `<option value="${esc(v)}">${esc(label)}</option>`;
  const lead = same
    ? `ほかのシステムにある画面設計を選んで、${esc(y.name)}にも並べます。選んだ画面設計の編集内容は、常に自動で同期します。`
    : `画面設計を選んで複製し、複製を${esc(y.name)}に入れます。複製は別のもので、元の画面設計とは同期しません。`;
  return showDialog({
    title: `${same ? '今ある画面設計を入れる' : '今ある画面設計を複製して入れる'}（${y.name}）`,
    okLabel: same ? '入れる' : '複製して入れる',
    width: 920,
    body: `<p class="pick-lead">${lead}</p>
      <div class="pick-bar"><input type="search" class="pick-search" placeholder="名前で探す" aria-label="名前で探す">
        <select class="pick-sys" aria-label="システムで絞る">${opt('all', 'すべてのシステム')}${S.systems.filter((x) => !x.trashedAt).map((x) => opt('y:' + x.id, x.name)).join('')}${opt(LONE_GROUP, 'システムに入っていない')}</select></div>
      <div class="pick-grid">${cards}</div>
      <p class="pick-none" hidden>${list.length ? '当たる画面設計はありません。' : 'まだ画面設計がありません。'}</p>
      <p class="pick-note"></p>`,
    init: (m) => bindPickDesigns(m, y, same),
    collect: (m) => {
      const ids = [...m.querySelectorAll('.pick-card.sel')].map((b) => b.dataset.pick);
      return ids.length ? ids : { error: same ? '入れる画面設計を選んでください。' : '複製する画面設計を選んでください。' };
    },
  });
}
// 入れる窓の札を選ぶ・名前とシステムで絞る（絞って見えなくなった札も、選んだままにする）。何も選んでいないときは、肯定のボタンを押せなくする
function bindPickDesigns(m, y, same) {
  const okBtn = $('[data-dlg="ok"]', m);
  const search = $('.pick-search', m);
  const filter = $('.pick-sys', m);
  const all = [...m.querySelectorAll('.pick-card')];
  const designOf = (b) => findDesign(store.state, b.dataset.pick);
  const refresh = () => {
    const q = cleanName(search.value).toLowerCase();
    const f = filter.value;
    let shown = 0;
    all.forEach((b) => {
      const sys = b.dataset.sys ? b.dataset.sys.split(' ') : [];
      const inFilter = f === 'all' || (f === LONE_GROUP ? !sys.length : sys.includes(f.slice(2)));
      b.hidden = !(inFilter && (!q || designOf(b).name.toLowerCase().includes(q)));
      if (!b.hidden) shown++;
    });
    $('.pick-none', m).hidden = shown > 0;
    const picked = all.filter((b) => b.classList.contains('sel')).map(designOf);
    okBtn.disabled = !picked.length;
    $('.pick-note', m).textContent = pickNoteText(y, picked, same);
  };
  all.forEach((b) => b.addEventListener('click', () => {
    if (b.disabled) return;
    const on = !b.classList.contains('sel');
    b.classList.toggle('sel', on);
    b.setAttribute('aria-pressed', String(on));
    refresh();
  }));
  search.addEventListener('input', refresh);
  filter.addEventListener('change', refresh);
  refresh();
  search.focus();
}
// 入れる窓の下の緑の枠の文。入れると 2 つ以上のシステムに入る画面設計には、カードに「N つのシステムで使っている」の札が付くことを書く
function pickNoteText(y, picked, same) {
  if (!picked.length) return same ? '入れる画面設計を選んでください（いくつでも選べます）。' : '複製する画面設計を選んでください（いくつでも選べます）。';
  const names = picked.slice(0, 5).map((d) => d.name).join('・') + (picked.length > 5 ? ' ほか' : '');
  const head = `選んでいるもの：${names}（${picked.length} つ）。`;
  if (!same) return `${head}選んだ画面設計を複製して、${y.name}に入れます。複製は別のもので、元を直しても変わりません。`;
  const counts = picked.map((d) => systemsOf(store.state, d.id).filter((x) => x.id !== y.id).length + 1);
  const shared = counts.filter((n) => n > 1);
  let tail = `${y.name}に並びます。`;
  if (shared.length && shared.length === counts.length && shared.every((n) => n === shared[0])) tail = `${y.name}にも並び、カードに「${shared[0]} つのシステムで使っている」の札が付きます。`;
  else if (shared.length) tail = `${y.name}にも並び、ほかのシステムでも使っている画面設計のカードに、「2 つのシステムで使っている」などの札が付きます。`;
  return `${head}${tail}別のものとして使いたいときは、「＋ 画面設計を入れる」の「複製して入れる」を使います。`;
}
// 入れる窓・複製して入れる窓を出して入れる（どちらも 1 回の変更。元に戻す 1 回で戻る）
async function pickDesignsIntoSystem(sysId, mode) {
  const y = findSystem(store.state, sysId);
  if (!y || y.trashedAt) return;
  const ids = await openPickDesignsDialog(y, mode);
  if (!ids) return;
  const done = mode === 'same' ? actions.addDesignsToSystem(y.id, ids) : actions.copyDesignsIntoSystem(y.id, ids);
  if (!done.length) return;
  const one = done.length === 1 ? findDesign(store.state, done[0]) : null;
  if (one) toast(`「${one.name}」を${y.name}に入れました。`);
  else toast(mode === 'same' ? `${done.length} つの画面設計を${y.name}に入れました。` : `${done.length} つの画面設計を複製して、${y.name}に入れました。`);
}

// 画面設計の完全な削除の確かめ。ごみ箱にないシステムに入っていれば、どのシステムからも外れ、スイムレーン図の作業の指す先も外れることを書く（T9 の見直し）
function openDeleteForeverDialog(d) {
  const importers = designsImporting(store.state, d.id);
  const systems = systemsOf(store.state, d.id);
  const sysNote = systems.length
    ? `<p style="margin-top:6px">「${esc(d.name)}」は、${esc(systems.map((y) => y.name).join('・'))}に入っています。完全に削除すると、どのシステムからも外れ、スイムレーン図の作業の指す先も外れます。</p>`
    : '';
  const note = importers.length
    ? `<p class="warn">このモックの項目を、ほかの ${importers.length} つの画面設計（${esc(importers.map((x) => x.name).join('・'))}）が取り込んでいます。完全に削除すると、取り込んだ側の項目は、今の中身で固定されます。</p>`
    : '';
  return showDialog({
    title: '完全に削除',
    okLabel: '完全に削除する',
    okClass: 'danger',
    body: `<p>「${esc(d.name)}」を完全に削除します。</p><p class="warn">完全に削除すると、元に戻せません（「元に戻す」でも戻りません）。</p>${sysNote}${note}`,
  });
}
// システムの完全な削除の確かめ（入っていた画面設計は残る。戻せないので、元に戻すの履歴も消える）。ボタンは画面設計の窓と同じ「完全に削除する」。
// 資料の行があり、資料の窓口があるとき（デスクトップ版）だけ、資料のファイルも消えることを知らせる（removeMaterialFiles）
function openDeleteSystemDialog(y) {
  const n = window.materialsAPI ? y.materials.length : 0;
  const files = n ? `資料のファイル（${n} つ）も消えます。` : '';
  return showDialog({
    title: '完全に削除',
    okLabel: '完全に削除する',
    okClass: 'danger',
    body: `<p>「${esc(y.name)}」を完全に削除します。システムの役割とスイムレーン図が消えます。${files}入っていた画面設計は消えません。元に戻せません（元に戻す〔Ctrl+Z〕の履歴も消えます）。</p>`,
  });
}
// 資料の窓口（デスクトップ版の preload.js の materialsAPI）の失敗の返事 { ok:false, error:{ code, message } } の文。materialFailMessage は文がなければ
// 空の文（お知らせで、場面ごとの文に替えるとき）、materialFailText は「わからない理由」（console.warn・起動時の掃除・入れられなかったときのお知らせ）
const materialFailMessage = (res) => (res && isObj(res.error) && str(res.error.message)) || '';
const materialFailText = (res) => materialFailMessage(res) || 'わからない理由';
// システムを完全に削除した後に、そのシステムの資料のファイルを資料の窓口に消してもらう（第 9 段階の後半。デスクトップ版だけ）。
// 消したことが保存されてから消す（保存に失敗したまま消すと、次に起動したときに戻ってくるシステムの資料のファイルがなくなるため）。
// 保存を止めているとき（blockReason）も同じ理由で消さない。失敗しても console.warn だけ（消し残したファイルは、次に起動したときの掃除で消える）
async function removeMaterialFiles(sysId) {
  const api = window.materialsAPI;
  if (!api || store.blockReason) return;
  try {
    await store.whenSaved();
  } catch (e) {
    console.warn('保存が済んでいないため、資料のファイルを消しませんでした:', (e && e.message) || e);
    return;
  }
  try {
    const res = await api.removeSystem(sysId);
    if (!res || !res.ok) console.warn('資料のファイルを消せませんでした:', materialFailText(res));
  } catch (e) {
    console.warn('資料のファイルを消せませんでした:', (e && e.message) || e);
  }
}

// 画面設計をごみ箱へ移すときの確かめ（画像 q21 の右下・AI設計基盤_設計書.md の 5-6）。ごみ箱にないシステムに入っている（systems）か、
// ほかの画面設計が項目を取り込んでいる（importers）ときに出す。両方のときは 1 つの窓に 2 つの段落で書く
function openTrashDesignDialog(d, { systems = [], importers = [] } = {}) {
  const sysNote = systems.length
    ? `<p style="margin-top:6px">「${esc(d.name)}」は、${esc(systems.map((y) => y.name).join('・'))}で使っています。ごみ箱へ移すと、どのシステムからも見えなくなります。ごみ箱から戻すと、元のシステムに戻ります。</p>`
    : '';
  const importNote = importers.length
    ? `<p class="warn">このモックの項目を、ほかの ${importers.length} つの画面設計（${esc(importers.map((x) => x.name).join('・'))}）が取り込んでいます。
      ごみ箱の中にある間は、つながったままです。完全に削除すると、取り込んだ側の項目は、そのときの中身で固定されます。</p>`
    : '';
  return showDialog({
    title: `「${d.name}」をごみ箱に移しますか？`,
    okLabel: 'ごみ箱へ移す',
    okClass: 'danger',
    body: `<p>ごみ箱からいつでも戻せます。</p>${sysNote}${importNote}`,
  });
}

// 最初の画面で押したもの（runCommand で受けないもの）。btn は押した要素
async function onHomeAction(action, id, btn) {
  switch (action) {
    case 'open': openDesign(id); return;
    case 'card-menu': Object.assign(ui, { menuFor: ui.menuFor === id ? null : id, sysMenu: null }); refreshCards(); return;
    case 'home-map': case 'home-cards': Object.assign(ui, { homeMap: action === 'home-map', menuFor: null, sysMenu: null }); renderHome(); return;
    case 'map-reset': actions.resetMapPos(null); return;
    case 'toggle-trash': ui.trashOpen = !ui.trashOpen; $('#home-trash').innerHTML = renderTrash(); return;
    case 'home-group': Object.assign(ui, { homeGroup: btn.dataset.group, menuFor: null, sysMenu: null }); refreshCards(); return;
  }
  if (SYSTEM_HOME_ACTIONS.includes(action)) {
    const y = findSystem(store.state, id);
    if (y) await onSystemAction(action, y);
    return;
  }
  const d = id ? findDesign(store.state, id) : null;
  if (!d) return;
  if (ui.menuFor) {
    ui.menuFor = null;
    refreshCards();
  }
  await onDesignAction(action, d, btn);
}

async function onDesignAction(action, d, btn = null) {
  // カードを出しているシステムのまとまり（「…」のメニューの複製・このシステムから外す）
  const inSys = btn && btn.dataset.sys ? findSystem(store.state, btn.dataset.sys) : null;
  switch (action) {
    case 'export-design':
      await openExportDialog(d.id);
      return;
    case 'rename': {
      const r = await openRenameDialog(d);
      if (r && r.name !== d.name) actions.renameDesign(d.id, r.name);
      return;
    }
    case 'duplicate':
      // システムのまとまりのカードから複製したときは、そのシステムにだけ入れる（設計書の 5-6）
      actions.duplicateDesign(d.id, { systemId: inSys ? inSys.id : null });
      toast(inSys ? `「${d.name} のコピー」を作り、${inSys.name}に入れました。` : `「${d.name} のコピー」を作りました。`);
      return;
    case 'remove-from-system':
      if (inSys && actions.removeDesignFromSystem(inSys.id, d.id)) toast(`「${d.name}」を${inSys.name}から外しました。画面設計は残っています。`);
      return;
    case 'share-tag':
      toast(`「${d.name}」は、${systemsOf(store.state, d.id).map((y) => y.name).join('・')}で使っています。`);
      return;
    case 'trash': {
      const importers = designsImporting(store.state, d.id);
      const systems = systemsOf(store.state, d.id);
      if ((importers.length || systems.length) && !(await openTrashDesignDialog(d, { systems, importers }))) return;
      actions.trashDesign(d.id);
      toast(`「${d.name}」をごみ箱へ移しました。戻すときは、下の「ごみ箱」か「元に戻す」（Ctrl+Z）を使います。`);
      return;
    }
    case 'restore':
      actions.restoreDesign(d.id);
      toast(`「${d.name}」を一覧に戻しました。`);
      return;
    case 'delete-forever':
      if (await openDeleteForeverDialog(d)) {
        actions.deleteDesignForever(d.id);
        toast(`「${d.name}」を完全に削除しました。`);
      }
  }
}

// システムのまとまり・ごみ箱のシステムの行で押したもの
const SYSTEM_HOME_ACTIONS = ['open-system', 'sys-add-menu', 'sys-menu', 'sys-add-new', 'sys-add-same', 'sys-add-copy', 'sys-edit', 'sys-doc', 'sys-trash', 'restore-system', 'delete-system-forever'];
async function onSystemAction(action, y) {
  if (action === 'sys-add-menu' || action === 'sys-menu') { toggleSysMenu(action === 'sys-menu' ? 'more' : 'add', y.id); return; }
  closeSysMenu();
  switch (action) {
    case 'open-system': openSystem(y.id); return;
    case 'sys-add-new': await newDesignWithDialog(y.id); return;
    case 'sys-add-same': case 'sys-add-copy': await pickDesignsIntoSystem(y.id, action === 'sys-add-same' ? 'same' : 'copy'); return;
    case 'sys-edit': {
      const r = await openSystemDialog({ title: '名前と説明を変える', okLabel: '変える', name: y.name, description: y.description });
      if (r) actions.updateSystem(y.id, r);
      return;
    }
    case 'sys-doc': await openSystemDocDialog(y.id); return;
    // ごみ箱へ移すのは確かめない（画面設計と同じ。元に戻すで戻せる）
    case 'sys-trash':
      if (actions.trashSystem(y.id)) toast(`「${y.name}」をごみ箱へ移しました。入っていた画面設計は残っています。`);
      return;
    case 'restore-system':
      if (actions.restoreSystem(y.id)) toast(`「${y.name}」を一覧に戻しました。`);
      return;
    case 'delete-system-forever':
      if (!(await openDeleteSystemDialog(y))) return;
      if (!actions.deleteSystemForever(y.id)) return;
      toast(`「${y.name}」を完全に削除しました。`);
      removeMaterialFiles(y.id); // 消し終わるのは待たない（失敗しても知らせは console.warn だけ）
  }
}

// ── システムの画面（第 9 段階の T6a。画像 q62 の案A・q64 の案A・q65・q66）──
// 編集の画面と同じ形: 上にメニューバー（一覧へ・元に戻す・やり直す・拡大・縮小）、左に入口 6 つ（概要・役割・スイムレーン図・資料・設計ノート・履歴。
// 資料はデスクトップ版だけ。設計ノートは第 10 段階）と入っている画面設計のカード、真ん中に押した入口の中身（ui.sysPanel）、右に入口ごとの案内。
// スイムレーン図の上の操作（足す・つなぐ・ドラッグ）と、右の欄の作業の設定は T6b で作る（T6a では、箱を押して選ぶだけ）
const SYS_PANELS = ['overview', 'roles', 'swimlane', 'materials', 'notes', 'history'];
// 資料の入口（第 9 段階の後半）は、資料の窓口（デスクトップ版の preload.js の materialsAPI）があるときだけ出す（ブラウザ・単体で開いた HTML では、
// ファイルを入れられず読めないため）。窓口がないときに資料の入口を選んだら、スイムレーン図にする
const shownSysPanel = (panel) => (panel === 'materials' && !window.materialsAPI ? 'swimlane' : panel);
// ui.view を 'system'、ui.systemId を開くシステムにする。画面設計を開くときと同じく、元に戻すの履歴を空にし、AI の知らせを片付ける
// （AI の元に戻すの履歴の決め方〔q66〕は、この 2 つの値で決まる）。ごみ箱のシステムは開かない。
// 入口は panel か、同じアプリの間にそのシステムで最後に開いた入口（ui.sysPanels。保存しない）。初めて開くシステムはスイムレーン図
function openSystem(id, { panel = null } = {}) {
  leaveViewing();
  const y = findSystem(store.state, id);
  if (!y || y.trashedAt) return;
  aiForgetView(ui.view === 'home');
  const p = shownSysPanel(SYS_PANELS.includes(panel) ? panel : ui.sysPanels[id] || 'swimlane');
  Object.assign(ui, {
    view: 'system', systemId: id, designId: null, screenId: null, menuFor: null, sysMenu: null, sysDesignMenu: null, stepSel: null, editorFrom: null,
    previewHeight: null, sel: [], panel: 'screen', itemId: null, addItemMenu: false, revMenu: false, foldMenu: null, sysPanel: p,
    edgeSel: null, swimMode: 'select', swimLink: null, swimPal: null,
  });
  ui.sysPanels[id] = p;
  store.clearHistory();
  mountSystem();
  renderSystem();
}
// 入口を切り替える（左の入口・「役割を足す」・オレンジの帯の「履歴を開く」）
function openSystemPanel(panel) {
  if (!SYS_PANELS.includes(panel) || ui.view !== 'system') return;
  const p = shownSysPanel(panel);
  Object.assign(ui, { sysPanel: p, sysMenu: null, sysDesignMenu: null, swimLink: null, swimPal: null });
  ui.sysPanels[ui.systemId] = p;
  renderSystem();
}

function mountSystem() {
  appEl().innerHTML = `
    <header class="brandbar"><span class="brand">モックイメージメーカー</span><span class="brand-design" id="sys-title"></span>${aiChipSlotHtml()}</header>
    <div id="toolbar">${sysToolbarHtml()}</div>
    <div id="ai-bands"></div>
    <div id="sys-menu-root"></div>
    <div class="editor-body" id="sys-body">
      <aside class="screen-list" id="sys-list" aria-label="システムの入口と画面設計の一覧"></aside>
      <div class="canvas-area"><div class="db-view" id="sys-view"></div></div>
      <aside class="side-panel" id="sys-side-panel" aria-label="作業の箱と設定"><div class="side-box" id="sys-box" hidden></div><div class="side-settings" id="sys-side"></div></aside>
    </div>`;
}
// メニューバー（編集の画面と同じ見た目。組はファイル・履歴・編集・表示）。編集と拡大縮小は、スイムレーン図を出しているときだけ押せる。
// 編集の組（T6b）: ▶ 選択・→ 接続（BDM と同じ 2 つのモード。キー v・c）と ✕ 削除（選んだ作業の箱か矢印）
function sysToolbarHtml() {
  const group = (label, body) => `<div class="rgroup"><div class="gbody">${body}</div><div class="glabel">${label}</div></div>`;
  return [
    // 「出力」は小さなメニュー（説明書（PDF）を出力…・MPD に出力…。デスクトップ版だけ。第 10 段階の後半の q76・第 11 段階の q82）。
    // data-id は、Esc でメニューを閉じたときにフォーカスを戻す先の見分け（SYS_MENU_OPENERS）
    group('ファイル', '<button class="bigbtn" data-action="home" title="システムと画面設計の一覧へ戻ります"><span class="ico">←</span>一覧へ</button>'
      + (window.exportAPI ? `<button class="bigbtn" data-action="export" data-id="${esc(ui.systemId || '')}" aria-haspopup="menu" aria-expanded="false" title="このシステムの説明書（PDF）か MPD に出力します"><span class="ico">⇪</span>出力</button>` : '')),
    group('履歴', `<div class="stack">
      <button class="tbtn" data-action="undo" id="sys-undo" title="直前の操作を取り消します（Ctrl+Z）">↶ 元に戻す</button>
      <button class="tbtn" data-action="redo" id="sys-redo" title="取り消した操作をやり直します（Ctrl+Y）">↷ やり直す</button></div>`),
    group('編集', `
      <button class="bigbtn" data-action="swim-select" id="sys-mode-select" title="作業の箱と矢印を選んで、動かす・直すモード（V キー）"><span class="ico">▶</span>選択</button>
      <button class="bigbtn" data-action="swim-connect" id="sys-mode-connect" title="つなぐ元とつなぐ先の作業の箱を順に押して、矢印でつなぐモード（C キー）"><span class="ico">→</span>接続</button>
      <button class="bigbtn" data-action="swim-delete" id="sys-del" title="選んだ作業の箱か矢印を消します（Delete キー）"><span class="ico">✕</span>削除</button>`),
    group('表示', `<div class="stack">
      <button class="tbtn" data-action="zoom-in" data-sys-zoom title="スイムレーン図を拡大（Ctrl+＋）">＋ 拡大</button>
      <button class="tbtn" data-action="zoom-out" data-sys-zoom title="スイムレーン図を縮小（Ctrl+－）">－ 縮小</button></div>
      <div class="stack">
      <button class="tbtn" data-action="zoom-fit" data-sys-zoom title="スイムレーン図の幅を、真ん中の欄の幅に合わせます">⊡ 全体を表示</button>
      <button class="tbtn zoom-label" data-action="zoom-reset" data-sys-zoom id="sys-zoom-label" title="100% に戻します（Ctrl+0）">100%</button></div>`),
  ].join('');
}
// メニューバーのボタンは描き直さず、押せる・押せないと倍率の文字だけを変える（真ん中の欄を離れたときの保存で描き直すと、押したボタンが click の前に消えるため）
function updateSysToolbar() {
  $('#sys-undo').disabled = !store.canUndo();
  $('#sys-redo').disabled = !store.canRedo();
  const zoomable = sysZoomable();
  document.querySelectorAll('#toolbar [data-sys-zoom]').forEach((b) => { b.disabled = !zoomable; });
  $('#sys-zoom-label').textContent = Math.round(ui.sysZoom * 100) + '%';
  $('#sys-mode-select').disabled = !zoomable;
  $('#sys-mode-connect').disabled = !zoomable;
  $('#sys-mode-select').classList.toggle('on', zoomable && ui.swimMode === 'select');
  $('#sys-mode-connect').classList.toggle('on', zoomable && ui.swimMode === 'connect');
  $('#sys-del').disabled = !zoomable || !(ui.stepSel || ui.edgeSel);
}
// 拡大縮小できるとき（スイムレーン図を出していて、役割が 1 つ以上ある）
function sysZoomable() {
  const y = ui.view === 'system' ? findSystem(store.state, ui.systemId) : null;
  return !!y && ui.sysPanel === 'swimlane' && y.roles.length > 0;
}

// システムの画面を描く（中身が変わったとき・AI の帯を閉じたとき・開いたとき）。開いているシステムがごみ箱に入った・消えたときは一覧へ戻る。
// keepMain: 真ん中の欄の文字を書き換えたときは、真ん中を描き直さない（次に押した欄が作り直されて、文字が打てなくなるため。編集の画面の keepSide と同じ）。
// keepSide: 右の欄の作業の設定の文字を書き換えたときは、右の欄を描き直さない（T6b。真ん中の図は描き直す）
function renderSystem({ keepMain = false, keepSide = false } = {}) {
  const y = findSystem(store.state, ui.systemId);
  if (!y || y.trashedAt) { goHome(); return; }
  if (!$('#sys-body')) { mountSystem(); keepMain = false; keepSide = false; }
  const menuFocus = keepNoteMenuFocus();
  fixSwimState(y);
  $('#sys-title').innerHTML = `${esc(y.name)}<small>（システム）</small>`;
  updateSysToolbar();
  refreshSysList();
  if (keepMain) document.querySelectorAll('#sys-view [data-sys-name]').forEach((el) => { el.textContent = y.name; });
  else renderSysMain(y);
  if (!keepSide) renderSysSide(y);
  renderAiChrome();
  menuFocus();
}
// 設計ノートの進み具合のメニューの中にフォーカスがあれば、描き直した後（メニューは左の一覧と真ん中の描き直しで作り直される）、同じ項目
// （data-state）へフォーカスを戻す関数を返す。同じ項目がなくなった（AI がその進み具合にした）・メニューが閉じたときは、進み具合のボタンへ戻す
// （AI が書いて描き直したときに、フォーカスが body に落ちないように。終わりの見直し A の Minor 5）
function keepNoteMenuFocus() {
  const el = document.activeElement;
  if (!el || !el.closest || !el.closest('#sys-menu-root .nt-menu')) return () => {};
  const state = el.dataset.state || '';
  return () => {
    const same = [...document.querySelectorAll('#sys-menu-root .nt-menu [role="menuitem"]')].find((b) => b.dataset.state === state);
    const back = same || $('#sys-view [data-action="sys-note-stage-menu"]');
    if (back) back.focus();
  };
}
// 元に戻す・AI が書いたなどで、選んでいた作業・矢印、つなぐ元の作業が消えたときは外す。スイムレーン図を出していないとき・役割がないときは、
// つなぐ途中と、置き場で押した種類をやめる
function fixSwimState(y) {
  if (ui.stepSel && !findStep(y, ui.stepSel)) ui.stepSel = null;
  if (ui.edgeSel && !y.swimlane.edges.some((e) => e.id === ui.edgeSel)) ui.edgeSel = null;
  if (ui.swimLink && !findStep(y, ui.swimLink.from)) ui.swimLink = null;
  if (ui.sysPanel !== 'swimlane' || !y.roles.length) Object.assign(ui, { swimLink: null, swimPal: null });
}
// 右の欄（上の置き場と、下の設定）を描く。同じものを描き直すときは、スクロールの位置と、打っている欄のフォーカスを戻す
function renderSysSide(y) {
  const el = $('#sys-side');
  const key = `${ui.sysPanel}:${ui.stepSel || ''}:${ui.edgeSel || ''}`;
  const same = el.dataset.key === key;
  const top = same ? el.scrollTop : 0;
  const focus = same ? keepSysSideFocus() : () => {};
  el.dataset.key = key;
  el.innerHTML = sysSideHtml(y);
  el.scrollTop = top;
  focus();
  renderSysBox(y);
}
// 左の一覧と、開いているメニューを描き直す
function refreshSysList() {
  const y = findSystem(store.state, ui.systemId);
  const el = $('#sys-list');
  if (!y || !el) return;
  const keep = keepScroll(['#sys-list']);
  el.innerHTML = sysScreenListHtml(y);
  keep();
  renderSysMenus();
}

// ── システムの画面の左の欄: 入口 6 つ（編集の画面の「データベースの項目」の札と同じ形。資料はデスクトップ版だけ）と、入っている画面設計のカード ──
function sysScreenListHtml(y) {
  const designs = designsOfSystem(store.state, y);
  const entry = (panel, ic, label, note, title) => `<button class="db-entry sys-entry${ui.sysPanel === panel ? ' active' : ''}" data-action="sys-panel" data-panel="${panel}" aria-pressed="${ui.sysPanel === panel}" title="${title}">
      <span class="ic">${ic}</span><span><b>${label}</b><small>${esc(note)}</small></span></button>`;
  const steps = y.swimlane.steps.length;
  const mats = y.materials.length;
  return entry('overview', '✎', '概要', '名前と説明', 'システムの名前と説明を開きます')
    + entry('roles', '👥', '役割', y.roles.length ? `${y.roles.length} つ` : 'まだありません', '役割（申請者・上長など。スイムレーン図の横の帯）を開きます')
    + entry('swimlane', '⇶', 'スイムレーン図', steps ? `作業 ${steps} つ` : '作業なし', '役割ごとの帯に作業の箱を並べた、業務の流れの図を開きます')
    + (window.materialsAPI ? entry('materials', '📎', '資料', mats ? `ファイル ${mats} つ` : 'まだありません', 'システムを作るときに参考にするファイル（業務の様式・説明書・図）を開きます') : '')
    + entry('notes', '📓', '設計ノート', noteEntryNote(y), '段階ごとの進み具合・決めたことと理由・まだ決まっていないことを開きます')
    + entry('history', '◷', '履歴', sysHistoryNote(y), 'AI がこのシステムを直す前の中身（自動で残した行）を開きます')
    + `<div class="sl-sep"></div><div class="panel-title sys-dhead">${designs.length ? `画面設計 ${designs.length} つ` : '画面設計'}</div>`
    + (designs.length ? designs.map(sysDesignCardHtml).join('') : '<p class="sys-dempty">まだ画面設計が入っていません。</p>')
    + `<button class="btn small sys-add" data-action="sys-add-menu" data-id="${esc(y.id)}" aria-haspopup="menu" aria-expanded="${ui.sysMenu === 'add:' + y.id}">＋ 画面設計を入れる ▾</button>`;
}
// 履歴の入口の小さな字。AI が直す前の状態の行があればその数、なければ戻す前の状態などの行の数
function sysHistoryNote(y) {
  const rows = y.revisions.filter(isObj);
  const ai = rows.filter((r) => r.kind === 'ai').length;
  if (ai) return `AI が直す前の状態 ${ai}`;
  return rows.length ? `戻す前の状態 ${rows.length}` : 'まだありません';
}
// 画面設計のカード（縮小画像・名前。ごみ箱にないシステム 2 つ以上に入っている共通の画面設計は、緑の枠と札）。押すと開き、ドラッグで並べ替える。
// マウスを乗せると右上に「…」（開く・上へ動かす・下へ動かす・このシステムから外す）
function sysDesignCardHtml(d) {
  const users = systemsOf(store.state, d.id);
  const shared = users.length > 1;
  const id = esc(d.id);
  return `<div class="sl-wrap sys-dwrap" data-id="${id}">
    <button class="sys-dcard${shared ? ' shared' : ''}" data-action="sys-open-design" data-id="${id}" title="「${esc(d.name)}」を開きます（ドラッグで並べ替えます）">
      <div class="sys-dthumb">${thumbHtml(d, d.screens[0], 152, 86)}</div><b>${esc(d.name)}</b>
      ${shared ? `<span class="share-tag" data-action="share-tag" data-id="${id}" title="${esc(users.map((x) => x.name).join('・'))}で使っています">${users.length} つのシステムで使っている</span>` : ''}
    </button>
    <button class="sl-more${ui.sysDesignMenu === d.id ? ' open' : ''}" data-action="sys-design-menu" data-id="${id}" aria-haspopup="menu" aria-expanded="${ui.sysDesignMenu === d.id}" aria-label="「${esc(d.name)}」の操作" title="開く・並べ替え・このシステムから外す">…</button>
  </div>`;
}
// 左の欄のメニュー（カードの「…」と「＋ 画面設計を入れる ▾」）と、設計ノートの「この段階の進み具合」のボタンのメニュー（第 10 段階）と、
// メニューバーの「出力」の小さなメニュー（第 11 段階）。欄の外まではみ出せるように、窓に対して置く。窓の下からはみ出すときは上に開く。
// 進み具合のボタン（真ん中）と「出力」（メニューバー）は、メニューを開け閉めしても描き直さないので、ボタンの aria-expanded はここで付け直す
function renderSysMenus() {
  const root = $('#sys-menu-root');
  if (!root) return;
  const y = findSystem(store.state, ui.systemId);
  const shown = y ? designsOfSystem(store.state, y) : [];
  if (ui.sysDesignMenu && !shown.some((d) => d.id === ui.sysDesignMenu)) ui.sysDesignMenu = null;
  const stage = !!y && ui.sysMenu === `stage:${y.id}`;
  const stageBtn = $('#sys-view [data-action="sys-note-stage-menu"]');
  if (stageBtn) stageBtn.setAttribute('aria-expanded', String(stage));
  const exp = !!y && ui.sysMenu === `export:${y.id}`;
  const expBtn = $('#toolbar [data-action="export"]');
  if (expBtn) expBtn.setAttribute('aria-expanded', String(exp));

    : y && ui.sysMenu === `add:${y.id}` ? $('#sys-list .sys-add') : stage ? stageBtn : exp ? expBtn : null;
  if (!anchor) { root.innerHTML = ''; return; }
  root.innerHTML = ui.sysDesignMenu ? sysDesignMenuHtml(shown, ui.sysDesignMenu) : stage ? noteStageMenuHtml(y) : exp ? sysExportMenuHtml(y) : sysAddMenuHtml(y, ' sys-fixed');
  const menu = root.firstElementChild;
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.round(r.left) + 'px';
  menu.style.top = Math.round(r.bottom + 4) + 'px';
  if (r.bottom + 4 + menu.offsetHeight > window.innerHeight - 8) menu.style.top = Math.max(8, Math.round(r.top - 4 - menu.offsetHeight)) + 'px';
}
function sysDesignMenuHtml(shown, designId) {
  const i = shown.findIndex((d) => d.id === designId);

  return `<div class="screen-menu sys-dmenu" role="menu">

}
function toggleSysDesignMenu(id) {

  refreshSysList();
  const first = ui.sysDesignMenu && $('#sys-menu-root [role="menuitem"]:not(:disabled)');

function closeSysDesignMenu() {

// カードの「…」のメニューで押したもの
function onSysDesignMenu(y, action, designId) {
  const d = findDesign(store.state, designId);

  if (!d || i < 0) return;

      if (actions.removeDesignFromSystem(y.id, d.id)) toast(`「${d.name}」を${y.name}から外しました。画面設計は残っています。`);
