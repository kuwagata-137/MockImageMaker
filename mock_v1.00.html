    if (k === 'sample') view.samples[ui.colId] = String(el.value).split('\n').map((x) => x.trim());
    else if (Number(el.value) > 0) view.widths[ui.colId] = Math.round(Number(el.value));
    else delete view.widths[ui.colId];
    run(() => actions.updatePart(d.id, s.id, p.id, { view: { samples: view.samples, widths: view.widths } }));
    return;
  }
  if (k.startsWith('col.')) {
    if (!p.item || p.item.link) return;
    const cols = clone(p.item.props.columns);
    const c = cols.find((x) => x.id === ui.colId);
    if (!c) return;
    const f = k.slice(4);
    if (f === 'name') c.name = el.value.trim();
    else if (f === 'required') c.required = el.checked;
    else if (f === 'type') Object.assign(c, { type: el.value, props: keepInitialInOptions(el.value, normalizeProps(partType(el.value), c.props)) });
    else if (f.startsWith('props.')) {
      const pk = f.slice(6);
      c.props = keepInitialInOptions(c.type, { ...c.props, [pk]: el.type === 'checkbox' && pk !== 'initial' ? el.checked
        : pk === 'options' ? parseOptions(el.value)
        : pk === 'initial' && el.type === 'checkbox' ? [...document.querySelectorAll('#side-settings [data-tb="col.props.initial"]')].filter((x) => x.checked).map((x) => x.value)
        : el.tagName === 'TEXTAREA' ? el.value : el.value.trim() });
    }
    const apply = () => actions.updateItem(d.id, p.item.id, { props: { columns: cols.map(normalizeColumn) } });
    if (keep && f !== 'props.options') commitKeepSide(apply); else apply();
    return;
  }
  const pr = clone(p.props);
  if (k === 'db') {
    const x = el.value.startsWith('d:') ? findDesign(store.state, el.value.slice(2)) : null;
    pr.db = x ? { designId: x.id, name: x.name, free: false } : { designId: null, name: '', free: el.value === '__free__' };
    pr.cond.from = emptyRef();
    pr.columns = [];
  } else if (k === 'dbName') pr.db.name = el.value.trim();
  else if (k === 'condFrom') {
    const it = findItem(findDesign(store.state, pr.db.designId), el.value);
    pr.cond.from = it ? { itemId: it.id, name: it.name } : emptyRef();
  } else if (k === 'condFromName') pr.cond.from = { itemId: null, name: el.value.trim() };
  else if (k === 'condTo') {
    const it = findItem(d, el.value);
    pr.cond.to = it ? { itemId: it.id, name: it.name } : emptyRef();
  } else if (k === 'addCol' || k === 'addColName') {
    const src = p.tableKind === 'related' ? findDesign(store.state, pr.db.designId) : d;
    const it = k === 'addCol' ? findItem(src, el.value) : null;
    const name = it ? it.name : el.value.trim();
    if (!name) return;
    pr.columns.push({ id: newId('c'), ref: { itemId: it ? it.id : null, name } });
    if (k === 'addColName') el.value = '';
  } else return;
  run(() => actions.updatePart(d.id, s.id, p.id, { props: pr }));
}

// 表の列の欄のボタン（列を選ぶ・並べ替える・外す・足す）
function onTableColumnAction(action, id) {
  const p = currentSubject();
  const s = currentScreen();
  if (!p || p.type !== 'table') return;
  if (action === 'tb-col') { ui.colId = ui.colId === id ? null : id; renderSettings(currentDesign()); return; }
  const isItem = ui.panel === 'items' || p.tableKind === 'subtable';
  if (isItem && (!p.item || p.item.link)) return;
  const cols = clone(isItem ? p.item.props.columns : p.props.columns);
  const i = cols.findIndex((c) => c.id === id);
  if (action === 'tb-col-add') {
    const c = createColumnData('text1', `列 ${cols.length + 1}`);
    cols.push(c);
    ui.colId = c.id;
  } else if (i < 0) return;
  else if (action === 'tb-col-del') cols.splice(i, 1);
  else {
    const j = action === 'tb-col-up' ? i - 1 : i + 1;
    if (j < 0 || j >= cols.length) return;
    [cols[i], cols[j]] = [cols[j], cols[i]];
  }
  if (isItem) actions.updateItem(ui.designId, p.item.id, { props: { columns: cols } });
  else actions.updatePart(ui.designId, s.id, p.id, { props: { columns: cols } });
}

// 絞り込みの欄の変更（data-fl）と、↑↓✕
function onFilterFieldChange(el) {
  const p = currentPart();
  if (!p || p.type !== 'filter') return;
  const items = [...(p.props.items || [])];
  const values = items.map((_, i) => (p.props.values || [])[i] || '');
  if (el.dataset.fl === 'add') {
    if (!el.value) return;
    items.push(el.value);
    values.push('');
  } else if (el.dataset.fl === 'value') values[Number(el.dataset.i)] = el.value.trim();
  else return;
  const apply = () => actions.updatePart(ui.designId, currentScreen().id, p.id, { props: { items, values } });
  if (isTextInput(el)) commitKeepSide(apply); else apply();
}
function onFilterAction(action, i) {
  const p = currentPart();
  if (!p || p.type !== 'filter') return;
  const items = [...(p.props.items || [])];
  const values = items.map((_, k) => (p.props.values || [])[k] || '');
  if (action === 'fl-del') { items.splice(i, 1); values.splice(i, 1); } else {
    const j = action === 'fl-up' ? i - 1 : i + 1;
    if (j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    [values[i], values[j]] = [values[j], values[i]];
  }
  actions.updatePart(ui.designId, currentScreen().id, p.id, { props: { items, values } });
}

// 「＋ 写す項目を足す」と、組の ✕
function editLookupCopies(fn) {
  const p = currentSubject();
  const item = p && p.item;
  if (!item || !item.lookup || item.link) return;
  const next = clone(item.lookup);
  fn(next.copies);
  actions.updateLookup(ui.designId, item.id, next);
}

// 一緒に写される項目から、探す項目の設定を開く。画面では、その画面に探す項目の部品があればそれを選び、なければ項目の一覧表で選ぶ
function openLookupKey(itemId) {
  const part = ui.panel === 'screen' ? currentScreen().parts.find((x) => x.itemId === itemId) : null;
  if (part) selectPart(part.id);
  else selectItem(itemId);
}

// 選択肢の部品の初期値の欄を、options（まだ保存していない打ちかけの選択肢でもよい）に合わせて描き直す。同じ選択肢なら描き直さない
function refreshChoiceInitial(options) {
  const box = $('#pf-initial');
  const p = currentSubject();
  if (!box || !p) return;
  const key = JSON.stringify(options);
  if (box.dataset.options === key) return;
  box.dataset.options = key;
  box.innerHTML = choiceInitialHtml({ ...p, props: keepInitialInOptions(p.type, { ...p.props, options }) });
}

function readPartField(el) {
  const key = el.dataset.pf;
  if ((key === 'props.initial' || key === 'props.items') && el.type === 'checkbox') {
    return [...document.querySelectorAll(`#side-settings [data-pf="${key}"]`)].filter((c) => c.checked).map((c) => c.value);
  }
  if (el.type === 'checkbox') return el.checked;
  if (key === 'props.options' || key === 'props.states' || key === 'props.tabs') return parseOptions(el.value);
  // 1 行の欄は前後の空白を取る。複数行の欄（説明の文字・メモ・押したとき）は書いたまま
  return el.tagName === 'TEXTAREA' ? el.value : el.value.trim();
}

// 人が打っていない文字の欄は保存しない（第 10 段階の前半・終わりの見直し A の Important 1）。欄に出した文は、保存してある文と違う形になる
// ことがある（1 行の欄は改行を消す・複数行の欄は CRLF の改行を LF にそろえる・前後の空白を取って保存する欄がある・設計ノートの読み取ったこと
// とメモは NOTE_TEXT_MAX を超える分を保存するときに切る）。そのような文を読み込んだ欄にフォーカスして離れるだけで、文が書き換わって
// 元に戻すの履歴に積まれないように、欄にフォーカスしたとき（focusin）の値を控え、今の値が控えと同じ欄は保存しない（onSidePanelChange）。
// 控えは、その欄で保存した後にも今の値で付け直す（打って保存した後に元の文へ打ち戻したときに保存するため。窓を離れて戻ったときは focusin が
// 出ないことがあるので、focusin だけには頼らない）。描いたときの文（el.defaultValue）とは比べない（打って保存した後に、描いたときの文へ
// 打ち戻すと、保存されなくなるため）
const fieldValueAtFocus = new WeakMap();
function rememberFieldValue(el) {
  if (el && el.matches && isTextInput(el)) fieldValueAtFocus.set(el, el.value);
}
const fieldUntyped = (el) => fieldValueAtFocus.has(el) && fieldValueAtFocus.get(el) === el.value;

// 右の欄（システムの画面では真ん中の欄と右の欄。第 9 段階）で打ちかけの文字（まだ change が起きていない）を保存する。
// 右の欄を作り直す操作（高さのドラッグ・部品を選ぶ）・命令・窓を離れる前に呼ぶ（呼ばないと、作り直しで打った文字が消える）。
// システムの画面では、スイムレーン図の上の文字の欄（ダブルクリックで出す）も確定する（T6b）
const TEXT_FIELDS = ['design-name', 'screen-name', 'design-desc'];
function flushSideField() {
  if (ui.view === 'system' && swimEditor) commitSwimEditor();
  const el = document.activeElement;
  const where = ui.view === 'editor' ? '#side-settings' : ui.view === 'system' ? '#sys-view, #sys-side' : null;
  if (!where || !el || !el.closest || !el.closest(where) || !isTextInput(el)) return;
  // 作る先の「その他」に打ちかけの名前（欄を離れたときの change で決まる）
  if (el.classList.contains('target-other')) { el.dispatchEvent(new Event('change')); return; }
  if (!el.dataset.sy && !el.dataset.sw && !el.dataset.pf && !el.dataset.lk && !el.dataset.ps && !el.dataset.pa && !el.dataset.tb && !el.dataset.fl && !el.dataset.co && !TEXT_FIELDS.includes(el.dataset.field)) return;
  // 名前を消して打ち直している途中は待つ（画面設計・画面・ステータス・操作・システム・役割の名前）
  const nameField = el.dataset.field === 'design-name' || el.dataset.field === 'screen-name' || el.dataset.ps || (el.dataset.pa && el.dataset.k === 'name')
    || el.dataset.sy === 'name' || el.dataset.sy === 'role-name';
  if (nameField && !cleanName(el.value)) return;
  onSidePanelChange({ target: el });
}

// ── 拡大縮小（ビジネスダイアグラムメーカーの applyZoom・syncZoomSpacer・zoomAtPointer から写した）──
function stageOffsetX() {
  return parseFloat($('#stage').style.left) || 0;
}

// スクロールできる範囲（#zoom-spacer）を、縮めた画面と一覧表の大きさに合わせる。画面が窓より狭いときは真ん中に置く。
// 一覧表の高さは中身で決まるので、描いた #stage の大きさ（拡大縮小の前の大きさ）も見る
function syncZoomSpacer() {
  const wrap = $('#canvas-wrap');
  const stage = $('#stage');
  const s = currentScreen();
  if (!wrap || !s) return;
  const h = ui.previewHeight == null ? s.height : ui.previewHeight;
  const tableW = s.tablePos === 'bottom' ? 0 : TABLE_GAP + TABLE_W;
  const sw = Math.round(Math.max(s.width + CALLOUT_ZONE * 2 + tableW + STAGE_PAD * 2, stage.offsetWidth) * ui.zoom);
  const sh = Math.round(Math.max(h + CALLOUT_ZONE * 2 + STAGE_PAD * 2, stage.offsetHeight) * ui.zoom);
  const offX = Math.max(0, Math.round((wrap.clientWidth - sw) / 2));
  $('#stage').style.left = offX + 'px';
  const spacer = $('#zoom-spacer');
  spacer.style.width = sw + offX + 'px';
  spacer.style.height = sh + 'px';
}

function applyZoom() {
  const stage = $('#stage');
  if (!stage) return;
  stage.style.transform = `scale(${ui.zoom})`;
  syncZoomSpacer();
  const label = Math.round(ui.zoom * 100) + '%';
  $('#zoom-label').textContent = label;
  $('#zoom-badge').textContent = label;
}

// cur は今の倍率（編集の画面は ui.zoom、システムの画面のスイムレーン図は ui.sysZoom）
function nextZoom(dir, cur = ui.zoom) {
  if (dir > 0) {
    const up = ZOOM_STEPS.find((z) => z >= cur + 0.01);
    return up == null ? cur : up;
  }
  const down = [...ZOOM_STEPS].reverse().find((z) => z <= cur - 0.01);
  return down == null ? cur : down;
}

// 窓の中の点（vx, vy）が指している画面の位置を動かさずに、倍率を変える
function zoomAt(vx, vy, zoom) {
  const wrap = $('#canvas-wrap');
  const before = ui.zoom;
  if (!wrap || zoom === before) return;
  const cx = (vx + wrap.scrollLeft - stageOffsetX()) / before;
  const cy = (vy + wrap.scrollTop) / before;
  ui.zoom = zoom;
  applyZoom();
  wrap.scrollLeft = Math.max(0, stageOffsetX() + cx * zoom - vx);
  wrap.scrollTop = Math.max(0, cy * zoom - vy);
}

function zoomAtPointer(ev, dir) {
  const r = $('#canvas-wrap').getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, nextZoom(dir));
}

// ボタン・キー・メニューからの拡大縮小は、見えている部分の真ん中を中心にする
function zoomByCommand(cmd) {
  const wrap = $('#canvas-wrap');
  const zoom = cmd === 'zoomReset' ? 1 : nextZoom(cmd === 'zoomIn' ? 1 : -1);
  zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, zoom);
}

function setMode(mode) {
  ui.mode = mode;
  updateToolbarState();
}

// ── ハンドツールと高さのドラッグ（ビジネスダイアグラムメーカーの initHandTool から写した）と、部品のドラッグ ──
// drag.kind: 'pan'（ハンドで動かす）・'resize'（画面の高さ）・'move'（部品を動かす）・'size'（部品の大きさ）・'place'（部品の箱から置く）
let drag = null;

function initCanvasEvents(wrap) {
  wrap.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest('[data-drag="resize"]')) { if (!store.isViewing) startResize(ev, wrap); return; }
    if (ui.mode !== 'hand' && store.isViewing) { onViewModeMouseDown(ev); return; }
    if (ui.mode !== 'hand') { onSelectModeMouseDown(ev); return; }
    ev.preventDefault();
    drag = { kind: 'pan', wrap, sx: ev.clientX, sy: ev.clientY, sl: wrap.scrollLeft, st: wrap.scrollTop };
    wrap.classList.add('grabbing');
  });
  // ハンドのときはホイールで、どのモードでも Ctrl+ホイールで、カーソルの位置を中心に拡大縮小する
  wrap.addEventListener('wheel', (ev) => {
    if (ui.mode !== 'hand' && !(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    if (ev.deltaY !== 0) zoomAtPointer(ev, ev.deltaY < 0 ? 1 : -1);
  }, { passive: false });
}

function startResize(ev, wrap) {
  ev.preventDefault();
  flushSideField();
  const s = currentScreen();
  drag = { kind: 'resize', wrap, screenId: s.id, sy: ev.clientY, st: wrap.scrollTop, h0: s.height, device: s.device, minH: minScreenHeight(s) };
  document.body.classList.add('resizing');
}

// 選択のモードで画面の上を押したとき: 部品・縁のつまみならドラッグを始め、何もない所なら選ぶのをやめる
// Ctrl（Shift でも）を押しながら押すと、選ぶものに足す・外す（Microsoft Office と同じ。ユーザーの指示）。
// そのままドラッグすると、選んだものを複製する（Office と同じ。Claude が決めた）。
// 選んだもののどれかをドラッグすると、まとめて動かす。何もない所からドラッグすると、囲んだ枠に全部入ったものを選ぶ
function onSelectModeMouseDown(ev) {
  const additive = ev.ctrlKey || ev.metaKey || ev.shiftKey;
  const grip = ev.target.closest('.grip');
  const handle = ev.target.closest('[data-co-handle]');
  if (handle && !additive) { startCalloutLink(ev, handle.dataset.coHandle); return; }
  const coEl = ev.target.closest('#stage .callout');
  const partEl = coEl ? null : ev.target.closest('#stage .screen .part');
  const hit = coEl ? { k: 'c', id: coEl.dataset.calloutId } : partEl ? { k: 'p', id: partEl.dataset.partId } : null;
  if (hit) {
    if (additive) { startAdditive(ev, hit); return; }
    if (ui.sel.length > 1 && isSelected(hit.k, hit.id)) { startGroupDrag(ev, false, hit); return; }
    if (hit.k === 'c') startCalloutDrag(ev, hit.id, grip ? grip.dataset.grip : null);
    else startPartDrag(ev, hit.id, grip ? grip.dataset.grip : null);
    return;
  }
  if (ev.target.closest('.ptable')) return; // 一覧表の行は click で選ぶ
  if (!ev.target.closest('#co-zone')) { if (ui.sel.length && !additive) selectPart(null); return; }
  startBand(ev, additive);
}

// 前の版を見ている間に画面の上を押したとき: 部品・吹き出しを選ぶだけ（右の欄で設定を見る。動かせない）
function onViewModeMouseDown(ev) {
  const coEl = ev.target.closest('#stage .callout');
  const partEl = coEl ? null : ev.target.closest('#stage .screen .part');
  if (coEl || partEl) {
    ev.preventDefault();
    setSelection([coEl ? { k: 'c', id: coEl.dataset.calloutId } : { k: 'p', id: partEl.dataset.partId }]);
    return;
  }
  if (!ev.target.closest('.ptable') && ui.sel.length) selectPart(null);
}

// 選んでいるもの（ui.sel）を変えて、画面と右の欄を描き直す
function setSelection(sel) {
  flushSideField();
  ui.sel = sel;
  ui.colId = null;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}
function blurSidePanel() {
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
}

function startAdditive(ev, hit) {
  ev.preventDefault();
  flushSideField();
  blurSidePanel();
  drag = { kind: 'add', hit, sx: ev.clientX, sy: ev.clientY };
}
// Ctrl を押したままドラッグし始めたら、押したものも選んで、複製のドラッグにする
function dragAdditive(ev) {
  if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const { hit, sx, sy } = drag;
  if (!isSelected(hit.k, hit.id)) setSelection([...ui.sel, hit]);
  startGroupDrag({ clientX: sx, clientY: sy, preventDefault() {} }, true);
  dragGroup(ev);
}

function startGroupDrag(ev, copy, hit = null) {
  ev.preventDefault();
  flushSideField();
  blurSidePanel();
  const s = currentScreen();
  drag = { kind: 'group', copy, hit, sx: ev.clientX, sy: ev.clientY, rects: selRects(s, ui.sel), dx: 0, dy: 0, ghosts: null, moved: false };
  document.body.classList.add(copy ? 'copying' : 'moving');
}
function selElement(x) {
  return [...document.querySelectorAll(x.k === 'p' ? '#stage .part' : '#stage .callout')].find((e) => (x.k === 'p' ? e.dataset.partId : e.dataset.calloutId) === x.id);
}
// まとめて動かしている間は、要素だけを動かす（保存は放したとき）。複製のときは、写しの影を動かす
function dragGroup(ev) {
  if (!dragStarted(ev)) return;
  const s = currentScreen();
  const [dx, dy] = clampGroupMove(s, drag.rects, snapGrid((ev.clientX - drag.sx) / ui.zoom), snapGrid((ev.clientY - drag.sy) / ui.zoom));
  drag.dx = dx;
  drag.dy = dy;
  if (drag.copy && !drag.ghosts) {
    drag.ghosts = drag.rects.map((r) => {
      const el = selElement(r);
      if (!el) return null;
      const g = el.cloneNode(true);
      g.classList.add('ghost-copy');
      g.classList.remove('sel-ref');
      el.parentNode.appendChild(g);
      return g;
    });
  }
  const overrides = {};
  drag.rects.forEach((r, i) => {
    const el = drag.copy ? drag.ghosts[i] : selElement(r);
    const off = r.k === 'c' ? CALLOUT_ZONE : 0;
    if (el) Object.assign(el.style, { left: off + r.x + dx + 'px', top: off + r.y + dy + 'px' });
    overrides[r.k + ':' + r.id] = { ...r, x: r.x + dx, y: r.y + dy };
  });
  if (!drag.copy) {
    redrawCalloutLines(overrides);
    const box = $('#stage .sel-box');
    if (box) box.style.display = 'none';
  }
}
function endGroupDrag(done) {
  if (!done.dx && !done.dy) {
    if (done.hit && !done.copy && !done.moved) { setSelection([done.hit]); return; }
    renderStage();
    return;
  }
  if (done.copy) {
    const out = actions.insertCopies(ui.designId, currentScreen().id, selectionEntries(), done.dx, done.dy);
    if (out.length) { ui.sel = out; updateEditor(); } else renderStage();
    return;
  }
  if (!actions.moveMany(ui.designId, currentScreen().id, ui.sel, done.dx, done.dy)) renderStage();
}

// 何もない所からのドラッグで囲む。Ctrl を押していないときは、押した時点で選ぶのをやめる
function zonePoint(ev) {
  const zone = $('#co-zone');
  const r = zone.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / ui.zoom - CALLOUT_ZONE, y: (ev.clientY - r.top) / ui.zoom - CALLOUT_ZONE };
}
function startBand(ev, additive) {
  ev.preventDefault();
  if (!additive && ui.sel.length) selectPart(null);
  else flushSideField();
  const pt = zonePoint(ev);
  drag = { kind: 'band', x0: pt.x, y0: pt.y, x: pt.x, y: pt.y, additive, base: [...ui.sel], el: null, sx: ev.clientX, sy: ev.clientY };
}
function dragBand(ev) {
  if (!drag.el && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const pt = zonePoint(ev);
  drag.x = pt.x;
  drag.y = pt.y;
  if (!drag.el) {
    drag.el = document.createElement('div');
    drag.el.className = 'band';
    $('#co-zone').appendChild(drag.el);
  }
  const Z = CALLOUT_ZONE;
  Object.assign(drag.el.style, { left: Z + Math.min(drag.x0, drag.x) + 'px', top: Z + Math.min(drag.y0, drag.y) + 'px', width: Math.abs(drag.x - drag.x0) + 'px', height: Math.abs(drag.y - drag.y0) + 'px' });
}
// 枠の中に全部入った部品と吹き出しを選ぶ（ユーザーが選んだ）。並びは上から下・左から右（いちばん初めが基準）
function endBand(done) {
  if (!done.el) return;
  done.el.remove();
  const s = currentScreen();
  const [x0, y0, x1, y1] = [Math.min(done.x0, done.x), Math.min(done.y0, done.y), Math.max(done.x0, done.x), Math.max(done.y0, done.y)];
  const inside = (o) => o.x >= x0 && o.y >= y0 && o.x + o.w <= x1 && o.y + o.h <= y1;
  const found = [...s.parts.filter(inside).map((p) => ({ k: 'p', id: p.id, o: p })), ...s.callouts.filter(inside).map((c) => ({ k: 'c', id: c.id, o: c }))]
    .sort((a, b) => a.o.y - b.o.y || a.o.x - b.o.x).map(({ k, id }) => ({ k, id }));
  const base = done.additive ? done.base : [];
  setSelection([...base, ...found.filter((f) => !base.some((b) => b.k === f.k && b.id === f.id))]);
}

function selectAll() {
  const s = currentScreen();
  const parts = [...s.parts].sort((a, b) => a.y - b.y || a.x - b.x).map((p) => ({ k: 'p', id: p.id }));
  setSelection([...parts, ...s.callouts.map((c) => ({ k: 'c', id: c.id }))]);
}

// 吹き出しを選ぶ（null で選ぶのをやめる）
function selectCallout(id) {
  flushSideField();
  if (ui.calloutId === id) return;
  ui.calloutId = id;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}

function startCalloutDrag(ev, id, grip) {
  ev.preventDefault();
  selectCallout(id);
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
  const c = findCallout(currentScreen(), id);
  if (!c) return;
  drag = { kind: grip ? 'co-size' : 'co-move', grip, id, sx: ev.clientX, sy: ev.clientY, r0: { x: c.x, y: c.y, w: c.w, h: c.h }, rect: null };
  if (!grip) document.body.classList.add('moving');
}

// ドラッグ中は、その吹き出しの要素と線だけを描き直す（保存は放したとき）
function dragCallout(ev) {
  if (!dragStarted(ev)) return;
  const s = currentScreen();
  const dx = (ev.clientX - drag.sx) / ui.zoom;
  const dy = (ev.clientY - drag.sy) / ui.zoom;
  const r0 = drag.r0;
  const rect = drag.kind === 'co-move' ? fitCallout({ ...r0, x: r0.x + dx, y: r0.y + dy }, s) : resizedCallout(r0, drag.grip, dx, dy, s);
  drag.rect = rect;
  const el = [...document.querySelectorAll('#stage .callout')].find((e) => e.dataset.calloutId === drag.id);
  if (el) Object.assign(el.style, { left: CALLOUT_ZONE + rect.x + 'px', top: CALLOUT_ZONE + rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
  redrawCalloutLines({ ['c:' + drag.id]: rect });
}
function redrawCalloutLines(overrides) {
  const svg = $('#co-lines');
  if (svg) svg.outerHTML = calloutLinesSvg(currentScreen(), overrides);
  const h = $('#stage [data-co-handle]');
  if (h) h.style.display = 'none'; // 動かしている間は線の先の ○ を隠す（放すと描き直す）
}

// 線の先の ○ をドラッグして、部品に重ねたところでつなぐ
function startCalloutLink(ev, id) {
  ev.preventDefault();
  flushSideField(); // 右の欄の打ちかけの文字（吹き出しの文字など）を先に保存する（放したときの描き直しで消えないように。デバッグとリリースの見直し⑤-1）
  blurSidePanel();
  drag = { kind: 'co-link', id, target: undefined, sx: ev.clientX, sy: ev.clientY };
  document.body.classList.add('linking');
}
function dragCalloutLink(ev) {
  if (!dragStarted(ev)) return; // 押しただけなら、つながりを変えない（target は undefined のまま）
  const s = currentScreen();
  const c = findCallout(s, drag.id);
  const zone = $('#co-zone');
  if (!c || !zone) return;
  const r = zone.getBoundingClientRect();
  const x = (ev.clientX - r.left) / ui.zoom - CALLOUT_ZONE;
  const y = (ev.clientY - r.top) / ui.zoom - CALLOUT_ZONE;
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const partEl = hit && hit.closest ? hit.closest('#stage .screen .part') : null;
  drag.target = partEl ? partEl.dataset.partId : null;
  redrawCalloutLines({ temp: { x1: c.x + c.w / 2, y1: c.y + c.h / 2, x2: x, y2: y } });
}

function placeCalloutAt(at, target) {
  const id = actions.addCallout(ui.designId, currentScreen().id, at, target);
  if (id) selectCallout(id);
}

// 部品を選んでいるときに部品の箱の「吹き出し」を押すと、その部品の右上につないで置く。選んでいないときは見えている所の真ん中に置く
function addCalloutByClick() {
  const s = currentScreen();
  const p = findPart(s, ui.partId);
  if (p) { placeCalloutAt({ x: p.x + p.w + 24, y: p.y - 96 }, p.id); return; }
  const wrap = $('#canvas-wrap');
  const scr = $('#stage .screen');
  if (!wrap || !scr) return;
  const wr = wrap.getBoundingClientRect();
  const sr = scr.getBoundingClientRect();
  placeCalloutAt({ x: (wr.left + wr.width / 2 - sr.left) / ui.zoom - 100, y: (wr.top + wr.height / 2 - sr.top) / ui.zoom - 40 }, null);
}

// 部品を選ぶ（null で選ぶのをやめる）。右の欄で打ちかけの文字は、前に選んでいた部品に保存してから切り替える
function selectPart(id) {
  flushSideField();
  if (id ? ui.partId === id : !ui.sel.length) return; // null のときは、吹き出しを選んでいても選ぶのをやめる
  ui.partId = id;
  ui.colId = null;
  renderStage();
  renderSettings(currentDesign());
  updateToolbarState();
}

function startPartDrag(ev, partId, grip) {
  ev.preventDefault();
  selectPart(partId);
  // 右の欄の文字の欄にフォーカスが残っていると、Delete や矢印のキーがその欄に行くので外す
  const active = document.activeElement;
  if (active && active.closest && active.closest('#side-panel')) active.blur();
  const p = findPart(currentScreen(), partId);
  if (!p) return;
  drag = { kind: grip ? 'size' : 'move', grip, id: partId, sx: ev.clientX, sy: ev.clientY, r0: { x: p.x, y: p.y, w: p.w, h: p.h }, rect: null };
  if (!grip) document.body.classList.add('moving');
}

// 押したところから窓の上で 4 ドットより動かしたら、ドラッグを始めたとみなす（drag.moved）。それまでは動かさない
// （縮小して見ているときは、押しただけの手の揺れでも升目 1 つ分ずれ、元に戻すの履歴に残っていた。デバッグとリリースの見直し⑤-3）
function dragStarted(ev) {
  if (!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return false;
  drag.moved = true;
  return true;
}

// 部品のドラッグ中は、その部品の要素だけを動かす（保存は放したとき）
function dragPart(ev) {
  if (!dragStarted(ev)) return;
  const s = currentScreen();
  const dx = (ev.clientX - drag.sx) / ui.zoom;
  const dy = (ev.clientY - drag.sy) / ui.zoom;
  const r0 = drag.r0;
  const rect = drag.kind === 'move' ? fitRect({ ...r0, x: r0.x + dx, y: r0.y + dy }, s) : resizedRect(r0, drag.grip, dx, dy, s);
  drag.rect = rect;
  // id は読み込んだデータの値なので、セレクタに埋め込まずに dataset で探す
  const el = [...document.querySelectorAll('#stage .part')].find((e) => e.dataset.partId === drag.id);
  if (el) Object.assign(el.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
  if (s.callouts.some((c) => c.target === drag.id)) redrawCalloutLines({ ['p:' + drag.id]: rect });
}

// 部品の箱のボタンを押したときに、ドラッグで置くかもしれないので覚えておく（動かさずに放せば click で真ん中に置く）。
// itemId を渡したとき（部品の箱の「データベースの項目」の組）は、その項目を指す部品を置く
function startPlace(ev, type, itemId = null) {
  if (ev.button !== 0 || !paletteEntry(type)) return;
  ev.preventDefault(); // 押した時点では右の欄を離れない。打ちかけの文字は、ドラッグを始めたとき（dragPlace）か click の処理の初め（onAppClick）に保存する
  drag = { kind: 'place', type, itemId, sx: ev.clientX, sy: ev.clientY, moved: false, ghost: null };
}

const PLACE_GRAB = 8; // 置くときの影の左上から、マウスの位置までの幅（窓の上のドット）
function dragPlace(ev) {
  if (!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
  const t = paletteEntry(drag.type);
  if (!drag.ghost) {
    drag.moved = true;
    flushSideField();
    drag.ghost = document.createElement('div');
    drag.ghost.className = 'place-ghost';
    const item = drag.itemId ? findItem(currentDesign(), drag.itemId) : null;
    drag.ghost.textContent = item ? `${item.name}（${t.name}）` : t.name;
    drag.ghost.style.width = t.w * ui.zoom + 'px';
    drag.ghost.style.height = t.h * ui.zoom + 'px';
    document.body.appendChild(drag.ghost);
    document.body.classList.add('placing');
  }
  drag.ghost.style.left = ev.clientX - PLACE_GRAB + 'px';
  drag.ghost.style.top = ev.clientY - PLACE_GRAB + 'px';
}

// 画面の上で放したら、そこに置く。画面の外で放したら置かない
function dropPlace(done, ev) {
  done.ghost.remove();
  document.body.classList.remove('placing');
  // ドラッグを部品の箱の上で放すと click が起きて真ん中に置かれてしまうので、すぐ後の click を 1 回だけ止める
  const stop = (e) => { e.stopPropagation(); e.preventDefault(); };
  document.addEventListener('click', stop, true);
  setTimeout(() => document.removeEventListener('click', stop, true), 0);
  // 放した所に見えているのが画面のときだけ置く。画面の矩形だけで見ると、右の欄・メニューバーの裏に隠れた部分
  // （スクロールで見えない所）で放しても置いてしまうため。影（.place-ghost）は消してあるので邪魔にならない
  const scr = $('#stage .screen');
  const hit = document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const zone = $('#co-zone');
  if (done.type === 'callout') {
    if (!scr || !hit || !zone || !zone.contains(hit)) return;
    const r = scr.getBoundingClientRect();
    const x = (ev.clientX - r.left) / ui.zoom;
    const y = (ev.clientY - r.top) / ui.zoom;
    const partEl = hit.closest('#stage .screen .part');
    // 部品の上に落としたときは、部品と重ならないように右上へずらして置き、その部品につなぐ
    if (partEl) placeCalloutAt({ x: x + 40, y: y - 120 }, partEl.dataset.partId);
    else placeCalloutAt({ x: x - PLACE_GRAB / ui.zoom, y: y - PLACE_GRAB / ui.zoom }, null);
    return;
  }
  if (!scr || !hit || !scr.contains(hit)) return;
  const r = scr.getBoundingClientRect();
  const at = { x: (ev.clientX - PLACE_GRAB - r.left) / ui.zoom, y: (ev.clientY - PLACE_GRAB - r.top) / ui.zoom };
  addPartAt(done.type, at, done.itemId);
}

function addPartAt(type, at, itemId = null) {
  const sid = currentScreen().id;
  const id = itemId ? actions.addItemPart(ui.designId, sid, itemId, at) : actions.addPart(ui.designId, sid, type, at);
  if (id) selectPart(id);
}

// 部品の箱のボタンを押しただけのときは、窓に見えている画面の真ん中に置く
function addPartAtCenter(type, itemId = null) {
  if (type === 'callout') { addCalloutByClick(); return; }
  const t = partType(type);
  const wrap = $('#canvas-wrap');
  const scr = $('#stage .screen');
  if (!t || !wrap || !scr) return;
  const wr = wrap.getBoundingClientRect();
  const sr = scr.getBoundingClientRect();
  const cx = (wr.left + wr.width / 2 - sr.left) / ui.zoom;
  const cy = (wr.top + wr.height / 2 - sr.top) / ui.zoom;
  addPartAt(type, { x: cx - t.w / 2, y: cy - t.h / 2 }, itemId);
}

// ── データベースの項目の一覧表の操作 ──
// 真ん中を項目の一覧表にする（選んでいた部品は選ぶのをやめる）
function openItemsPanel() {

}
// 真ん中に図を出す（panel は 'map'・'process'・'flow'）
function openViewPanel(panel) {

}

function selectItem(id) {

function addItemOfType(type) {
